us wichtigem Grund möglich (§ 22 BBiG)."], "richtig": 2, "erklaerung": "Eine Kündigung nach der Probezeit ist nur aus wichtigem Grund möglich (§ 22 BBiG).", "schwierigkeit": "schwer"}, {"id": 716, "gesetz": "KSchG", "frage": "#0716 Welche Voraussetzungen müssen für eine betriebsbedingte Kündigung vorliegen?", "antworten": ["Ein Pflichtverstoß des Arbeitnehmers und eine vorherige Abmahnung (§ 1 Abs. 2 KSchG).", "Ein dringendes betriebliches Erfordernis und eine fehlerfreie Sozialauswahl (§ 1 Abs. 2 KSchG).", "Krankheitsbedingte Fehlzeiten von mehr als sechs Wochen und ein ärztliches Attest (§ 1 KSchG)."], "richtig": 1, "erklaerung": "Ein dringendes betriebliches Erfordernis und eine fehlerfreie Sozialauswahl (§ 1 Abs. 2 KSchG).", "schwierigkeit": "leicht"}, {"id": 717, "gesetz": "KSchG", "frage": "#0717 Welche sozialen Kriterien sind bei der Sozialauswahl zu beachten?", "antworten": ["Betriebszugehörigkeit, Lebensalter, Wohnort und Mitgliedschaft im Betriebsrat (§ 1 Abs. 3 KSchG).", "Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten und Schwerbehinderung (§ 1 Abs. 3 KSchG).", "Leistung, Fehlzeiten, Pünktlichkeit und Umsatz der einzelnen Beschäftigten (§ 1 Abs. 3 KSchG)."], "richtig": 1, "erklaerung": "Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten und Schwerbehinderung (§ 1 Abs. 3 KSchG).", "schwierigkeit": "mittel"}, {"id": 718, "gesetz": "KSchG", "frage": "#0718 Welche Rolle spielt ein Interessenausgleich bei betriebsbedingten Kündigungen?", "antworten": ["Der Arbeitgeber muss nichts beweisen; die Kündigung gilt automatisch als sozial gerechtfertigt (§ 1 Abs. 5 KSchG).", "Mit Namensliste ist die Kündigung unanfechtbar; eine Klage ist ausgeschlossen (§ 1 Abs. 5 KSchG).", "Mit Namensliste wird die Betriebsbedingtheit vermutet; die Sozialauswahl ist nur auf grobe Fehlerhaftigkeit prüfbar (§ 1 Abs. 5 KSchG)."], "richtig": 2, "erklaerung": "Mit Namensliste wird die Betriebsbedingtheit vermutet; die Sozialauswahl ist nur auf grobe Fehlerhaftigkeit prüfbar (§ 1 Abs. 5 KSchG).", "schwierigkeit": "schwer"}, {"id": 719, "gesetz": "KSchG", "frage": "#0719 Hat ein Arbeitnehmer Anspruch auf eine Abfindung bei betriebsbedingter Kündigung?", "antworten": ["Ja, wenn der Arbeitnehmer binnen einer Woche der Kündigung widerspricht (§ 1a KSchG).", "Grundsätzlich nein; nur wenn der Arbeitgeber im Kündigungsschreiben darauf hinweist und der Arbeitnehmer die Klagefrist verstreichen lässt (§ 1a KSchG).", "Ja, jeder Arbeitnehmer erhält bei betriebsbedingter Kündigung ein Monatsgehalt je Beschäftigungsjahr (§ 1a KSchG)."], "richtig": 1, "erklaerung": "Grundsätzlich nein; nur wenn der Arbeitgeber im Kündigungsschreiben darauf hinweist und der Arbeitnehmer die Klagefrist verstreichen lässt (§ 1a KSchG).", "schwierigkeit": "leicht"}, {"id": 720, "gesetz": "KSchG", "frage": "#0720 Wie hoch ist die Abfindung nach § 1a KSchG?", "antworten": ["Ein Monatsverdienst je Beschäftigungsjahr, ab sechs Monaten wird aufgerundet (§ 1a Abs. 2 KSchG).", "Beim Abfindungsanspruch nach § 1a: 0,5 Monatsverdienste je Beschäftigungsjahr, mehr als sechs Monate werden aufgerundet (§ 1a Abs. 2 KSchG).", "0,25 Monatsverdienste je Beschäftigungsjahr, höchstens jedoch zwölf Monatsverdienste (§ 1a Abs. 2 KSchG)."], "richtig": 1, "erklaerung": "Beim Abfindungsanspruch nach § 1a: 0,5 Monatsverdienste je Beschäftigungsjahr, mehr als sechs Monate werden aufgerundet (§ 1a Abs. 2 KSchG).", "schwierigkeit": "mittel"}, {"id": 721, "gesetz": "KSchG", "frage": "#0721 Welche Frist gilt für die Erhebung einer Kündigungsschutzklage?", "antworten": ["Drei Monate nach der Kündigung, nur schriftlich beim Arbeitgeber (§ 623 BGB).", "Drei Wochen nach Zugang der Kündigung (§ 4 KSchG).", "Vier Wochen nach Zugang der Kündigung (§ 4 KSchG)."], "richtig": 1, "erklaerung": "Drei Wochen nach Zugang der Kündigung (§ 4 KSchG).", "schwierigkeit": "schwer"}, {"id": 722, "gesetz": "KSchG", "frage": "#0722 Was passiert, wenn ein Arbeitnehmer die Klagefrist versäumt?", "antworten": ["Die Kündigung bleibt unwirksam, wenn sie sozial ungerechtfertigt war (§ 4 KSchG).", "Die Kündigung gilt als wirksam (§ 7 KSchG).", "Er kann die Klage jederzeit nachholen, solange das Arbeitsverhältnis tatsächlich fortgesetzt wird (§ 5 KSchG)."], "richtig": 1, "erklaerung": "Die Kündigung gilt als wirksam (§ 7 KSchG).", "schwierigkeit": "leicht"}, {"id": 723, "gesetz": "KSchG", "frage": "#0723 Kann eine Kündigung auch durch den Betriebsrat verhindert werden?", "antworten": ["Ja, der Betriebsrat kann eine Kündigung per Veto verhindern; ohne seine Zustimmung ist sie unwirksam (§ 99 BetrVG).", "Nein; ohne Anhörung des Betriebsrats ist sie aber unwirksam, ein Widerspruch begründet nur einen Weiterbeschäftigungsanspruch (§ 102 BetrVG).", "Ja, ein Widerspruch des Betriebsrats macht jede Kündigung automatisch unwirksam (§ 102 BetrVG)."], "richtig": 1, "erklaerung": "Nein; ohne Anhörung des Betriebsrats ist sie aber unwirksam, ein Widerspruch begründet nur einen Weiterbeschäftigungsanspruch (§ 102 BetrVG).", "schwierigkeit": "mittel"}, {"id": 724, "gesetz": "KSchG", "frage": "#0724 Welche Möglichkeiten hat das Arbeitsgericht bei einer unwirksamen Kündigung?", "antworten": ["Feststellung, dass das Arbeitsverhältnis fortbesteht, oder auf Antrag Auflösung gegen Abfindung (§§ 4, 9 KSchG).", "Umdeutung der Kündigung in eine Änderungskündigung mit geringerem Entgelt, wenn der Arbeitgeber dies beantragt (§ 2 KSchG).", "Feststellung der Unwirksamkeit, wobei das Arbeitsverhältnis stets mit einer Abfindung von einem Monatsverdienst je Beschäftigungsjahr endet (§ 1a KSchG)."], "richtig": 0, "erklaerung": "Feststellung, dass das Arbeitsverhältnis fortbesteht, oder auf Antrag Auflösung gegen Abfindung (§§ 4, 9 KSchG).", "schwierigkeit": "schwer"}, {"id": 725, "gesetz": "KSchG", "frage": "#0725 Wann kann das Arbeitsgericht eine Abfindung festlegen?", "antworten": ["Nur durch die Agentur für Arbeit, wenn der Arbeitnehmer nach der Kündigung arbeitslos wird; Höhe bis zu sechs Monatsverdienste (§ 3 KSchG).", "Auf Antrag, wenn die Fortsetzung des Arbeitsverhältnisses unzumutbar ist; Höhe bis zu 12 (15/18) Monatsverdienste (§§ 9, 10 KSchG).", "Von Amts wegen in jedem Kündigungsschutzprozess; die Höhe beträgt stets ein halbes Monatsgehalt je Beschäftigungsjahr (§ 1a KSchG)."], "richtig": 1, "erklaerung": "Auf Antrag, wenn die Fortsetzung des Arbeitsverhältnisses unzumutbar ist; Höhe bis zu 12 (15/18) Monatsverdienste (§§ 9, 10 KSchG).", "schwierigkeit": "leicht"}, {"id": 726, "gesetz": "KSchG", "frage": "#0726 Wann ist eine Kündigung anzeigepflichtig?", "antworten": ["Bei Massenentlassungen gemäß § 17 KSchG.", "Bei jeder Kündigung während der Probezeit gemäß § 622 Abs. 3 BGB.", "Bei jeder Kündigung eines Arbeitnehmers mit mehr als zehn Jahren Betriebszugehörigkeit (§ 622 BGB)."], "richtig": 0, "erklaerung": "Bei Massenentlassungen gemäß § 17 KSchG.", "schwierigkeit": "mittel"}, {"id": 727, "gesetz": "KSchG", "frage": "#0727 Welche Arbeitgeberpflichten bestehen bei einer Massenentlassung?", "antworten": ["Anzeige bei der Agentur für Arbeit und Beratung mit dem Betriebsrat (§ 17 KSchG).", "Schriftliche Unterrichtung der Arbeitnehmer und Genehmigung der Entlassungen durch die Agentur für Arbeit (§ 19 KSchG).", "Anzeige beim Gewerbeamt und Einholung der Zustimmung des Integrationsamtes für alle betroffenen Arbeitnehmer (§ 17 KSchG)."], "richtig": 0, "erklaerung": "Anzeige bei der Agentur für Arbeit und Beratung mit dem Betriebsrat (§ 17 KSchG).", "schwierigkeit": "schwer"}, {"id": 728, "gesetz": "KSchG", "frage": "#0728 Welche Sperrfrist gilt bei einer Massenentlassung?", "antworten": ["Entlassungen werden erst nach einem Monat wirksam (§ 18 KSchG).", "Der Arbeitnehmer darf in den ersten drei Jahren nach der Entlassung nicht wieder im Betrieb eingestellt werden (§ 18 KSchG).", "Eine Sperrfrist gilt nicht; die Kündigungen wirken sofort mit Zugang an den Arbeitnehmer (§ 17 KSchG)."], "richtig": 0, "erklaerung": "Entlassungen werden erst nach einem Monat wirksam (§ 18 KSchG).", "schwierigkeit": "leicht"}, {"id": 729, "gesetz": "KSchG", "frage": "#0729 Welche Strafen drohen bei Verstößen gegen die Anzeigepflicht?", "antworten": ["Die Kündigungen bleiben wirksam, der Arbeitgeber zahlt lediglich ein Zwangsgeld an die Agentur für Arbeit (§ 18 KSchG).", "Die Kündigungen sind unwirksam (§ 17 KSchG).", "Bußgeld bis 5.000 € und Entzug der Gewerbeerlaubnis (§ 17 KSchG)."], "richtig": 1, "erklaerung": "Die Kündigungen sind unwirksam (§ 17 KSchG).", "schwierigkeit": "mittel"}, {"id": 730, "gesetz": "KSchG", "frage": "#0730 Wann entfällt die Pflicht zur Massenentlassungsanzeige?", "antworten": ["In Betrieben mit in der Regel höchstens 20 Arbeitnehmern oder wenn die Schwellenwerte der Entlassungen nicht erreicht werden (§ 17 Abs. 1 KSchG).", "Wenn der Betriebsrat den Entlassungen zustimmt oder die Kündigungen während der Probezeit ausgesprochen werden (§ 17 Abs. 3 KSchG).", "In Betrieben mit in der Regel höchstens 50 Arbeitnehmern oder wenn alle Betroffenen eine Abfindung erhalten (§ 17 Abs. 1 KSchG)."], "richtig": 0, "erklaerung": "In Betrieben mit in der Regel höchstens 20 Arbeitnehmern oder wenn die Schwellenwerte der Entlassungen nicht erreicht werden (§ 17 Abs. 1 KSchG).", "schwierigkeit": "schwer"}, {"id": 751, "gesetz": "BUrlG", "frage": "#0751 Haben Taxifahrer Anspruch auf bezahlten Urlaub?", "antworten": ["Nein, Taxifahrer als Fahrpersonal sind vom Bundesurlaubsgesetz ausgenommen (§ 2 BUrlG).", "Ja, jeder Arbeitnehmer hat Anspruch auf bezahlten Erholungsurlaub (§ 1 BUrlG).", "Nur, wenn dies im Arbeitsvertrag ausdrücklich vereinbart wurde (§ 1 BUrlG)."], "richtig": 1, "erklaerung": "Ja, jeder Arbeitnehmer hat Anspruch auf bezahlten Erholungsurlaub (§ 1 BUrlG).", "schwierigkeit": "leicht"}, {"id": 752, "gesetz": "BUrlG", "frage": "#0752 Wie lange beträgt der gesetzliche Mindesturlaub für Taxifahrer?", "antworten": ["Zwei Wochen pro Jahr, weitere Tage nur nach tariflicher Regelung (§ 3 Abs. 2 BUrlG).", "Mindestens 30 Arbeitstage pro Jahr bei einer Fünftagewoche (§ 3 Abs. 1 BUrlG).", "Mindestens 24 Werktage pro Jahr (§ 3 Abs. 1 BUrlG)."], "richtig": 2, "erklaerung": "Mindestens 24 Werktage pro Jahr (§ 3 Abs. 1 BUrlG).", "schwierigkeit": "mittel"}, {"id": 753, "gesetz": "BUrlG", "frage": "#0753 Welche Tage gelten als Werktage im Sinne des BUrlG?", "antworten": ["Alle Kalendertage außer Sonn- und gesetzlichen Feiertagen (§ 3 Abs. 2 BUrlG).", "Nur die Tage von Montag bis Freitag, an denen der Betrieb tatsächlich arbeitet (§ 3 Abs. 2 BUrlG).", "Alle Kalendertage, an denen der Arbeitnehmer nach seinem Dienstplan tatsächlich zur Arbeit eingeteilt ist (§ 3 Abs. 2 BUrlG)."], "richtig": 0, "erklaerung": "Alle Kalendertage außer Sonn- und gesetzlichen Feiertagen (§ 3 Abs. 2 BUrlG).", "schwierigkeit": "schwer"}, {"id": 754, "gesetz": "BUrlG", "frage": "#0754 Wann erwirbt ein Taxifahrer den vollen Urlaubsanspruch?", "antworten": ["Nach sechs Monaten Betriebszugehörigkeit (§ 4 BUrlG).", "Erst nach dem ersten vollen Kalenderjahr im Betrieb (§ 4 BUrlG).", "Sofort mit dem ersten Arbeitstag (§ 4 BUrlG)."], "richtig": 0, "erklaerung": "Nach sechs Monaten Betriebszugehörigkeit (§ 4 BUrlG).", "schwierigkeit": "leicht"}, {"id": 755, "gesetz": "BUrlG", "frage": "#0755 Was passiert mit dem Urlaubsanspruch, wenn ein Taxifahrer vor Ablauf der sechs Monate ausscheidet?", "antworten": ["Es besteht ein Teilurlaubsanspruch von einem Zwölftel pro vollem Monat (§ 5 Abs. 1 BUrlG).", "Der Anspruch entfällt vollständig, da die Wartezeit nicht erfüllt wurde (§ 4 BUrlG).", "Es besteht der volle Jahresurlaub, der bei Ausscheiden in Geld abzugelten ist (§ 7 Abs. 4 BUrlG)."], "richtig": 0, "erklaerung": "Es besteht ein Teilurlaubsanspruch von einem Zwölftel pro vollem Monat (§ 5 Abs. 1 BUrlG).", "schwierigkeit": "mittel"}, {"id": 756, "gesetz": "BUrlG", "frage": "#0756 Wer hat Anspruch auf Urlaub nach dem BUrlG?", "antworten": ["Nur sozialversicherungspflichtig Beschäftigte; Auszubildende und arbeitnehmerähnliche Personen sind ausgenommen (§ 2 BUrlG).", "Alle Arbeitnehmer und Selbstständige, die länger als sechs Monate für denselben Auftraggeber tätig sind (§ 2 BUrlG).", "Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG)."], "richtig": 2, "erklaerung": "Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG).", "schwierigkeit": "schwer"}, {"id": 757, "gesetz": "BUrlG", "frage": "#0757 Darf ein Arbeitgeber bereits gewährten Urlaub zurückfordern?", "antworten": ["Nein; scheidet der Arbeitnehmer aus und hat er zu viel Urlaub erhalten, kann das Urlaubsentgelt nicht zurückgefordert werden (§ 5 Abs. 3 BUrlG).", "Ja, der Arbeitgeber kann das Urlaubsentgelt für zu viel genommenen Urlaub vom letzten Gehalt einbehalten (§ 394 BGB).", "Ja, aber nur innerhalb der ersten sechs Monate des Arbeitsverhältnisses (§ 4 BUrlG)."], "richtig": 0, "erklaerung": "Nein; scheidet der Arbeitnehmer aus und hat er zu viel Urlaub erhalten, kann das Urlaubsentgelt nicht zurückgefordert werden (§ 5 Abs. 3 BUrlG).", "schwierigkeit": "leicht"}, {"id": 758, "gesetz": "BUrlG", "frage": "#0758 Was passiert mit dem Urlaubsanspruch bei einem Arbeitgeberwechsel?", "antworten": ["Doppelansprüche sind ausgeschlossen, der bisherige Arbeitgeber muss eine Bescheinigung ausstellen (§ 6 BUrlG).", "Der Urlaubsanspruch verfällt, der neue Arbeitgeber gewährt den vollen Urlaub erst nach Ablauf der Wartezeit (§ 4 BUrlG).", "Der bisherige Arbeitgeber muss den Resturlaub an den neuen Arbeitgeber auszahlen, der ihn gewährt (§ 7 Abs. 4 BUrlG)."], "richtig": 0, "erklaerung": "Doppelansprüche sind ausgeschlossen, der bisherige Arbeitgeber muss eine Bescheinigung ausstellen (§ 6 BUrlG).", "schwierigkeit": "mittel"}, {"id": 759, "gesetz": "BUrlG", "frage": "#0759 Welche Fristen gelten für die Übertragung des Urlaubs auf das nächste Jahr?", "antworten": ["Im Kalenderjahr; Übertragung nur bis 31. März bei Krankheit, danach verfällt der Urlaub stets ersatzlos, auch ohne Hinweis des Arbeitgebers (§ 7 Abs. 3 BUrlG).", "Übertragung bis zum 30. Juni des Folgejahres ist stets ohne besondere Gründe möglich; ein Hinweis des Arbeitgebers ist nicht erforderlich (§ 7 Abs. 3 BUrlG).", "Im Kalenderjahr; Übertragung bei dringenden betrieblichen oder persönlichen Gründen bis 31. März; Verfall nur nach Hinweis des Arbeitgebers (§ 7 Abs. 3 BUrlG)."], "richtig": 2, "erklaerung": "Im Kalenderjahr; Übertragung bei dringenden betrieblichen oder persönlichen Gründen bis 31. März; Verfall nur nach Hinweis des Arbeitgebers (§ 7 Abs. 3 BUrlG).", "schwierigkeit": "schwer"}, {"id": 760, "gesetz": "BUrlG", "frage": "#0760 Was passiert mit nicht genommenem Urlaub bei Beendigung des Arbeitsverhältnisses?", "antworten": ["Er muss in Geld abgegolten werden (§ 7 Abs. 4 BUrlG).", "Er geht auf den neuen Arbeitgeber über, der ihn gewähren muss (§ 6 BUrlG).", "Er verfällt ersatzlos, weil Urlaub nur in natura gewährt wird (§ 7 Abs. 3 BUrlG)."], "richtig": 0, "erklaerung": "Er muss in Geld abgegolten werden (§ 7 Abs. 4 BUrlG).", "schwierigkeit": "leicht"}, {"id": 761, "gesetz": "BUrlG", "frage": "#0761 Wer entscheidet über den Zeitpunkt des Urlaubs?", "antworten": ["Der Arbeitgeber unter Berücksichtigung der Wünsche des Arbeitnehmers, sofern keine dringenden betrieblichen Gründe entgegenstehen (§ 7 Abs. 1 BUrlG).", "Die Agentur für Arbeit, die den Zeitpunkt im Streitfall auf Antrag des Arbeitnehmers festsetzt (§ 7 BUrlG).", "Der Arbeitnehmer allein; der Arbeitgeber muss den gewünschten Zeitraum stets genehmigen (§ 7 Abs. 1 BUrlG)."], "richtig": 0, "erklaerung": "Der Arbeitgeber unter Berücksichtigung der Wünsche des Arbeitnehmers, sofern keine dringenden betrieblichen Gründe entgegenstehen (§ 7 Abs. 1 BUrlG).", "schwierigkeit": "mittel"}, {"id": 762, "gesetz": "BUrlG", "frage": "#0762 Muss der Urlaub zusammenhängend genommen werden?", "antworten": ["Nein, der Arbeitnehmer kann den Urlaub frei in beliebig kleine Teile aufteilen (§ 7 Abs. 2 BUrlG).", "Grundsätzlich ja; eine Teilung ist nur mit Zustimmung des Betriebsrats zulässig, wobei jeder Teil mindestens fünf Tage umfassen muss (§ 7 Abs. 2 BUrlG).", "Grundsätzlich ja; wird er aus dringenden Gründen geteilt, muss ein Teil mindestens zwölf aufeinanderfolgende Werktage umfassen (§ 7 Abs. 2 BUrlG)."], "richtig": 2, "erklaerung": "Grundsätzlich ja; wird er aus dringenden Gründen geteilt, muss ein Teil mindestens zwölf aufeinanderfolgende Werktage umfassen (§ 7 Abs. 2 BUrlG).", "schwierigkeit": "schwer"}, {"id": 763, "gesetz": "BUrlG", "frage": "#0763 Kann ein Arbeitgeber den Urlaub verweigern?", "antworten": ["Nein, beantragter Urlaub darf nie verweigert werden (§ 7 Abs. 1 BUrlG).", "Ja, wenn dringende betriebliche Gründe oder vorrangige Urlaubswünsche anderer Arbeitnehmer bestehen (§ 7 Abs. 1 BUrlG).", "Ja, wenn der Arbeitnehmer weniger als zwei Jahre im Betrieb beschäftigt ist (§ 4 BUrlG)."], "richtig": 1, "erklaerung": "Ja, wenn dringende betriebliche Gründe oder vorrangige Urlaubswünsche anderer Arbeitnehmer bestehen (§ 7 Abs. 1 BUrlG).", "schwierigkeit": "leicht"}, {"id": 764, "gesetz": "BUrlG", "frage": "#0764 Darf ein Taxifahrer während des Urlaubs arbeiten?", "antworten": ["Nein, jede dem Urlaubszweck widersprechende Erwerbstätigkeit ist verboten (§ 8 BUrlG).", "Ja, Nebentätigkeiten während des Urlaubs sind uneingeschränkt erlaubt, da der Urlaub dem Arbeitnehmer gehört (§ 8 BUrlG).", "Ja, aber nur mit schriftlicher Zustimmung des Betriebsrats; dann verkürzt sich der Urlaubsanspruch entsprechend (§ 8 BUrlG)."], "richtig": 0, "erklaerung": "Nein, jede dem Urlaubszweck widersprechende Erwerbstätigkeit ist verboten (§ 8 BUrlG).", "schwierigkeit": "mittel"}, {"id": 765, "gesetz": "BUrlG", "frage": "#0765 Was passiert, wenn ein Taxifahrer während des Urlaubs krank wird?", "antworten": ["Der Urlaub läuft weiter; die Krankheitstage werden angerechnet und der Arbeitnehmer erhält Krankengeld (§ 9 BUrlG).", "Die durch ärztliches Attest nachgewiesenen Krankheitstage werden nicht auf den Urlaub angerechnet (§ 9 BUrlG).", "Der gesamte Urlaub entfällt und muss neu beantragt werden, sobald die Krankheit länger als drei Tage dauert (§ 9 BUrlG)."], "richtig": 1, "erklaerung": "Die durch ärztliches Attest nachgewiesenen Krankheitstage werden nicht auf den Urlaub angerechnet (§ 9 BUrlG).", "schwierigkeit": "schwer"}, {"id": 766, "gesetz": "BUrlG", "frage": "#0766 Wie wird das Urlaubsentgelt berechnet?", "antworten": ["Nach dem Verdienst des letzten Kalenderjahres einschließlich aller Überstunden (§ 11 Abs. 1 BUrlG).", "Nach dem Mindestlohn multipliziert mit der vertraglichen Stundenzahl, unabhängig vom bisherigen Verdienst (§ 11 BUrlG).", "Nach dem durchschnittlichen Verdienst der letzten 13 Wochen vor Urlaubsbeginn, ohne Überstunden (§ 11 Abs. 1 BUrlG)."], "richtig": 2, "erklaerung": "Nach dem durchschnittlichen Verdienst der letzten 13 Wochen vor Urlaubsbeginn, ohne Überstunden (§ 11 Abs. 1 BUrlG).", "schwierigkeit": "leicht"}, {"id": 767, "gesetz": "BUrlG", "frage": "#0767 Wann muss das Urlaubsentgelt ausgezahlt werden?", "antworten": ["Mit der nächsten regulären Lohnabrechnung nach der Rückkehr aus dem Urlaub (§ 11 Abs. 2 BUrlG).", "Erst am Ende des Kalenderjahres gesammelt für alle genommenen Urlaubstage (§ 11 Abs. 1 BUrlG).", "Vor Urlaubsantritt (§ 11 Abs. 2 BUrlG)."], "richtig": 2, "erklaerung": "Vor Urlaubsantritt (§ 11 Abs. 2 BUrlG).", "schwierigkeit": "mittel"}, {"id": 768, "gesetz": "BUrlG", "frage": "#0768 Darf der Arbeitgeber während des Urlaubs eine Maßnahme der medizinischen Vorsorge anrechnen?", "antworten": ["Nein, diese zählt nicht als Urlaub (§ 10 BUrlG).", "Ja, aber höchstens zur Hälfte der Dauer der Maßnahme (§ 9 BUrlG).", "Ja, jede ärztlich verordnete Kur wird stets auf den Jahresurlaub angerechnet (§ 10 BUrlG)."], "richtig": 0, "erklaerung": "Nein, diese zählt nicht als Urlaub (§ 10 BUrlG).", "schwierigkeit": "schwer"}, {"id": 769, "gesetz": "BUrlG", "frage": "#0769 Was gilt für Arbeitnehmer in Heimarbeit bezüglich des Urlaubs?", "antworten": ["Es gelten besondere Regelungen für Urlaubsentgelt (§ 12 BUrlG).", "Es gelten dieselben Vorschriften wie für Arbeitnehmer im Betrieb; Sonderregeln bestehen nicht (§ 3 BUrlG).", "Sie sind vom BUrlG vollständig ausgenommen und haben keinen Urlaubsanspruch (§ 2 BUrlG)."], "richtig": 0, "erklaerung": "Es gelten besondere Regelungen für Urlaubsentgelt (§ 12 BUrlG).", "schwierigkeit": "leicht"}, {"id": 770, "gesetz": "BUrlG", "frage": "#0770 Kann von den Bestimmungen des BUrlG durch Tarifverträge abgewichen werden?", "antworten": ["Ja, auch zuungunsten der Arbeitnehmer, außer bei §§ 1, 2 und 3 Abs. 1 (Mindesturlaub); Einzelverträge nur zugunsten (§ 13 Abs. 1 BUrlG).", "Nein, das BUrlG ist in allen Teilen zwingend; auch Tarifverträge dürfen in keinem Punkt davon abweichen (§ 13 Abs. 1 BUrlG).", "Ja, Tarifverträge dürfen jede Regelung abändern, auch den gesetzlichen Mindesturlaub von 24 Werktagen (§ 13 Abs. 1 BUrlG)."], "richtig": 0, "erklaerung": "Ja, auch zuungunsten der Arbeitnehmer, außer bei §§ 1, 2 und 3 Abs. 1 (Mindesturlaub); Einzelverträge nur zugunsten (§ 13 Abs. 1 BUrlG).", "schwierigkeit": "mittel"}, {"id": 771, "gesetz": "BUrlG", "frage": "#0771 Welche Behörde überwacht die Einhaltung des BUrlG?", "antworten": ["Keine; das BUrlG sieht keine behördliche Überwachung vor, Ansprüche werden vor dem Arbeitsgericht durchgesetzt.", "Die Zollverwaltung im Rahmen der Finanzkontrolle Schwarzarbeit (§ 14 MiLoG).", "Das Landesamt für Arbeitsschutz, das Verstöße mit Bußgeld bis 5.000 € ahnden kann (§ 13 BUrlG)."], "richtig": 0, "erklaerung": "Keine; das BUrlG sieht keine behördliche Überwachung vor, Ansprüche werden vor dem Arbeitsgericht durchgesetzt.", "schwierigkeit": "schwer"}, {"id": 772, "gesetz": "BUrlG", "frage": "#0772 Welche Sanktionen drohen bei Verstößen gegen das BUrlG?", "antworten": ["Keine Bußgelder; der Arbeitnehmer kann Urlaub, Urlaubsentgelt oder Abgeltung vor dem Arbeitsgericht einklagen, ggf. Schadensersatz.", "Bußgeld bis 25.000 € durch die Gewerbeaufsicht sowie Eintragung ins Gewerbezentralregister (§ 13 BUrlG).", "Strafbarkeit des Arbeitgebers mit Freiheitsstrafe bis zu einem Jahr (§ 266a StGB)."], "richtig": 0, "erklaerung": "Keine Bußgelder; der Arbeitnehmer kann Urlaub, Urlaubsentgelt oder Abgeltung vor dem Arbeitsgericht einklagen, ggf. Schadensersatz.", "schwierigkeit": "leicht"}, {"id": 773, "gesetz": "BUrlG", "frage": "#0773 Wie kann ein Arbeitnehmer gegen verweigerten Urlaub vorgehen?", "antworten": ["Er darf den Urlaub eigenmächtig antreten, wenn der Arbeitgeber nicht binnen einer Woche antwortet (§ 7 BUrlG).", "Er kann den Anspruch beim Arbeitsgericht einklagen, in Eilfällen per einstweiliger Verfügung (§ 7 Abs. 1 BUrlG, § 2 ArbGG).", "Er kann sich an die Agentur für Arbeit wenden, die den Urlaubszeitpunkt per Bescheid festsetzt (§ 7 BUrlG)."], "richtig": 1, "erklaerung": "Er kann den Anspruch beim Arbeitsgericht einklagen, in Eilfällen per einstweiliger Verfügung (§ 7 Abs. 1 BUrlG, § 2 ArbGG).", "schwierigkeit": "mittel"}, {"id": 774, "gesetz": "BUrlG", "frage": "#0774 Welche Auswirkungen hat eine unzulässige Kürzung des Urlaubs durch den Arbeitgeber?", "antworten": ["Sie ist wirksam, wenn der Arbeitnehmer nicht binnen drei Wochen schriftlich widerspricht (§ 4 KSchG).", "Sie ist wirksam, wenn sie in einer Betriebsvereinbarung geregelt ist; der Mindesturlaub kann so auf 20 Werktage sinken (§ 13 BUrlG).", "Sie ist unwirksam, und der volle Urlaubsanspruch bleibt bestehen (§§ 1, 3, 13 BUrlG)."], "richtig": 2, "erklaerung": "Sie ist unwirksam, und der volle Urlaubsanspruch bleibt bestehen (§§ 1, 3, 13 BUrlG).", "schwierigkeit": "schwer"}, {"id": 775, "gesetz": "BUrlG", "frage": "#0775 Welche Bedeutung hat die sogenannte „Unabdingbarkeit“ des Urlaubsanspruchs?", "antworten": ["Der Arbeitnehmer kann im Arbeitsvertrag gegen einen Ausgleich wirksam auf den Urlaubsanspruch verzichten (§ 13 BUrlG).", "Der Urlaubsanspruch besteht nur, solange das Arbeitsverhältnis ununterbrochen läuft, und erlischt bei jeder Unterbrechung (§ 6 BUrlG).", "Der gesetzliche Mindesturlaub kann nicht zuungunsten des Arbeitnehmers verkürzt werden (§ 13 BUrlG)."], "richtig": 2, "erklaerung": "Der gesetzliche Mindesturlaub kann nicht zuungunsten des Arbeitnehmers verkürzt werden (§ 13 BUrlG).", "schwierigkeit": "leicht"}, {"id": 776, "gesetz": "BUrlG", "frage": "#0776 Gibt es Sonderregelungen für das Baugewerbe und ähnliche Branchen?", "antworten": ["Ja, Tarifverträge können spezifische Urlaubsregelungen festlegen (§ 13 Abs. 2 BUrlG).", "Ja, aber nur durch Verordnung des Bundesarbeitsministeriums, nicht durch Tarifvertrag (§ 13 Abs. 3 BUrlG).", "Nein, das BUrlG kennt keinerlei Sonderregelungen für einzelne Branchen (§ 13 BUrlG)."], "richtig": 0, "erklaerung": "Ja, Tarifverträge können spezifische Urlaubsregelungen festlegen (§ 13 Abs. 2 BUrlG).", "schwierigkeit": "mittel"}, {"id": 777, "gesetz": "BUrlG", "frage": "#0777 Wie wird der Urlaub bei kurzfristiger Beschäftigung geregelt?", "antworten": ["Der Arbeitgeber zahlt stattdessen einen pauschalen Zuschlag von 5 % auf den Lohn; ein Urlaubsanspruch besteht nicht (§ 11 BUrlG).", "Arbeitnehmer haben Anspruch auf anteiligen Urlaub gemäß § 5 Abs. 1 BUrlG.", "Kein Urlaubsanspruch, wenn das Arbeitsverhältnis kürzer als drei Monate dauert; danach besteht der volle Jahresanspruch (§ 4 BUrlG)."], "richtig": 1, "erklaerung": "Arbeitnehmer haben Anspruch auf anteiligen Urlaub gemäß § 5 Abs. 1 BUrlG.", "schwierigkeit": "schwer"}, {"id": 778, "gesetz": "BUrlG", "frage": "#0778 Kann ein einmal genehmigter Urlaub durch den Arbeitgeber widerrufen werden?", "antworten": ["Ja, der Arbeitgeber darf ihn jederzeit ohne Angabe von Gründen widerrufen (§ 7 BUrlG).", "Nein, eine Rücknahme ist nicht zulässig (§ 7 BUrlG).", "Ja, aber nur bis zu zwei Wochen vor Urlaubsbeginn (§ 7 BUrlG)."], "richtig": 1, "erklaerung": "Nein, eine Rücknahme ist nicht zulässig (§ 7 BUrlG).", "schwierigkeit": "leicht"}, {"id": 779, "gesetz": "BUrlG", "frage": "#0779 Welche Regelung gilt für den Fall, dass ein Arbeitnehmer nach einer Kündigung bereits mehr Urlaub erhalten hat als ihm zustand?", "antworten": ["Der Arbeitgeber darf das zu viel gezahlte Urlaubsentgelt von der letzten Vergütung abziehen (§ 5 Abs. 3 BUrlG).", "Eine Rückforderung des zu viel gezahlten Urlaubsentgelts ist nicht möglich (§ 5 Abs. 3 BUrlG).", "Der Arbeitnehmer muss den zu viel genommenen Urlaub beim nächsten Arbeitgeber nacharbeiten (§ 6 BUrlG)."], "richtig": 1, "erklaerung": "Eine Rückforderung des zu viel gezahlten Urlaubsentgelts ist nicht möglich (§ 5 Abs. 3 BUrlG).", "schwierigkeit": "mittel"}, {"id": 780, "gesetz": "BUrlG", "frage": "#0780 Kann ein Arbeitnehmer nach Ende des Arbeitsverhältnisses seinen Resturlaub noch nehmen?", "antworten": ["Nein, der Resturlaub verfällt zum Beendigungstermin ersatzlos, sofern er nicht übertragen wurde (§ 7 Abs. 3 BUrlG).", "Ja, der Arbeitnehmer kann den Resturlaub innerhalb von drei Monaten nach Ende des Arbeitsverhältnisses beim bisherigen Arbeitgeber noch nehmen (§ 7 Abs. 3 BUrlG).", "Nein, der Resturlaub muss abgegolten werden (§ 7 Abs. 4 BUrlG)."], "richtig": 2, "erklaerung": "Nein, der Resturlaub muss abgegolten werden (§ 7 Abs. 4 BUrlG).", "schwierigkeit": "schwer"}, {"id": 801, "gesetz": "EntgFG", "frage": "#0801 Haben Taxifahrer Anspruch auf Entgeltfortzahlung im Krankheitsfall?", "antworten": ["Ja, aber erst ab dem vierten Krankheitstag und höchstens für zwei Wochen (§ 3 Abs. 1 EntgFG).", "Nein, Entgeltfortzahlung gilt nur für Festangestellte, nicht für Fahrer mit Umsatzbeteiligung (§ 1 EntgFG).", "Ja, sie haben Anspruch auf bis zu sechs Wochen Entgeltfortzahlung durch den Arbeitgeber (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Ja, sie haben Anspruch auf bis zu sechs Wochen Entgeltfortzahlung durch den Arbeitgeber (§ 3 Abs. 1 EntgFG).", "schwierigkeit": "leicht"}, {"id": 802, "gesetz": "EntgFG", "frage": "#0802 Ab wann besteht der Anspruch auf Entgeltfortzahlung für einen angestellten Taxifahrer?", "antworten": ["Nach vier Wochen ununterbrochener Dauer des Arbeitsverhältnisses (§ 3 Abs. 3 EntgFG).", "Erst nach Ablauf der Probezeit, spätestens nach sechs Monaten (§ 3 Abs. 3 EntgFG).", "Ab dem ersten Tag des Arbeitsverhältnisses (§ 3 Abs. 3 EntgFG)."], "richtig": 0, "erklaerung": "Nach vier Wochen ununterbrochener Dauer des Arbeitsverhältnisses (§ 3 Abs. 3 EntgFG).", "schwierigkeit": "mittel"}, {"id": 803, "gesetz": "EntgFG", "frage": "#0803 Wie hoch ist das fortzuzahlende Entgelt für Taxifahrer im Krankheitsfall?", "antworten": ["Ausschließlich der Mindestlohn für die ausgefallenen Stunden; Umsatzanteile werden nicht berücksichtigt (§ 4 Abs. 1 EntgFG).", "Das Entgelt, das bei regelmäßiger Arbeitszeit angefallen wäre; bei Umsatzlohn der erzielbare Durchschnittsverdienst (§ 4 Abs. 1, 1a EntgFG).", "Das durchschnittliche Entgelt der letzten zwölf Monate vor der Erkrankung einschließlich Überstunden und Aufwendungsersatz (§ 4 Abs. 1a EntgFG)."], "richtig": 1, "erklaerung": "Das Entgelt, das bei regelmäßiger Arbeitszeit angefallen wäre; bei Umsatzlohn der erzielbare Durchschnittsverdienst (§ 4 Abs. 1, 1a EntgFG).", "schwierigkeit": "schwer"}, {"id": 804, "gesetz": "EntgFG", "frage": "#0804 Erhält ein Taxifahrer während der Probezeit Entgeltfortzahlung bei Krankheit?", "antworten": ["Nein, in der Probezeit besteht kein Anspruch auf Entgeltfortzahlung (§ 3 Abs. 3 EntgFG).", "Ja, vom ersten Tag an, weil die Wartezeit in der Probezeit nicht gilt (§ 3 EntgFG).", "Ja, sobald das Arbeitsverhältnis vier Wochen ununterbrochen besteht; die Probezeit schließt den Anspruch nicht aus (§ 3 Abs. 3 EntgFG)."], "richtig": 2, "erklaerung": "Ja, sobald das Arbeitsverhältnis vier Wochen ununterbrochen besteht; die Probezeit schließt den Anspruch nicht aus (§ 3 Abs. 3 EntgFG).", "schwierigkeit": "leicht"}, {"id": 805, "gesetz": "EntgFG", "frage": "#0805 Welche Verpflichtung hat ein Taxifahrer bei Krankmeldung?", "antworten": ["Arbeitsunfähigkeit innerhalb von drei Tagen schriftlich anzeigen; ein Attest ist immer schon am ersten Krankheitstag vorzulegen (§ 5 EntgFG).", "Unverzüglich Arbeitsunfähigkeit und Dauer mitteilen; ab dem 4. Kalendertag AU ärztlich feststellen lassen (eAU), Privatversicherte Bescheinigung vorlegen (§ 5 EntgFG).", "Nur mündlich beim Fahrdienstleiter melden; eine ärztliche Bescheinigung ist erst ab der zweiten Woche nötig (§ 5 EntgFG)."], "richtig": 1, "erklaerung": "Unverzüglich Arbeitsunfähigkeit und Dauer mitteilen; ab dem 4. Kalendertag AU ärztlich feststellen lassen (eAU), Privatversicherte Bescheinigung vorlegen (§ 5 EntgFG).", "schwierigkeit": "mittel"}, {"id": 806, "gesetz": "EntgFG", "frage": "#0806 Was regelt das Entgeltfortzahlungsgesetz?", "antworten": ["Die Zahlung von Krankengeld durch die Krankenkassen und von Verletztengeld durch die Berufsgenossenschaft (§ 1 EntgFG).", "Die Entgeltfortzahlung bei Urlaub, Feiertagen und Mutterschutz (§ 1 EntgFG).", "Die Fortzahlung des Arbeitsentgelts an gesetzlichen Feiertagen und im Krankheitsfall (§ 1 EntgFG)."], "richtig": 2, "erklaerung": "Die Fortzahlung des Arbeitsentgelts an gesetzlichen Feiertagen und im Krankheitsfall (§ 1 EntgFG).", "schwierigkeit": "schwer"}, {"id": 807, "gesetz": "EntgFG", "frage": "#0807 Wer hat Anspruch auf Entgeltfortzahlung nach dem EntgFG?", "antworten": ["Nur Vollzeitbeschäftigte; Teilzeitkräfte und Auszubildende sind ausgenommen (§ 1 Abs. 2 EntgFG).", "Arbeitnehmer und Selbstständige mit eigenem Taxiunternehmen (§ 1 EntgFG).", "Arbeitnehmer, einschließlich Teilzeitbeschäftigte und Auszubildende (§ 1 Abs. 2 EntgFG)."], "richtig": 2, "erklaerung": "Arbeitnehmer, einschließlich Teilzeitbeschäftigte und Auszubildende (§ 1 Abs. 2 EntgFG).", "schwierigkeit": "leicht"}, {"id": 808, "gesetz": "EntgFG", "frage": "#0808 Wann haben Arbeitnehmer Anspruch auf Feiertagsvergütung?", "antworten": ["Wenn die Arbeitszeit wegen eines gesetzlichen Feiertages ausfällt (§ 2 Abs. 1 EntgFG).", "Nur wenn der Arbeitnehmer am Feiertag tatsächlich gearbeitet hat (§ 2 Abs. 1 EntgFG).", "Nur für kirchliche Feiertage; für staatliche Feiertage besteht kein Anspruch (§ 2 EntgFG)."], "richtig": 0, "erklaerung": "Wenn die Arbeitszeit wegen eines gesetzlichen Feiertages ausfällt (§ 2 Abs. 1 EntgFG).", "schwierigkeit": "mittel"}, {"id": 809, "gesetz": "EntgFG", "frage": "#0809 Wann entfällt der Anspruch auf Feiertagsvergütung?", "antworten": ["Wenn der Arbeitnehmer unentschuldigt am letzten oder ersten Arbeitstag vor/nach dem Feiertag fehlt (§ 2 Abs. 3 EntgFG).", "Wenn der Arbeitnehmer weniger als ein Jahr im Betrieb beschäftigt ist (§ 2 EntgFG).", "Wenn der Arbeitnehmer in der Woche des Feiertags Überstunden abgebaut hat (§ 2 Abs. 1 EntgFG)."], "richtig": 0, "erklaerung": "Wenn der Arbeitnehmer unentschuldigt am letzten oder ersten Arbeitstag vor/nach dem Feiertag fehlt (§ 2 Abs. 3 EntgFG).", "schwierigkeit": "schwer"}, {"id": 810, "gesetz": "EntgFG", "frage": "#0810 Gilt das EntgFG auch für geringfügig Beschäftigte?", "antworten": ["Ja, auch Minijobber haben Anspruch auf Entgeltfortzahlung (§ 1 Abs. 2 EntgFG).", "Nein, Minijobber sind vom EntgFG ausgenommen; sie erhalten Krankengeld von der Minijob-Zentrale (§ 1 EntgFG).", "Nur, wenn sie mehr als 20 Stunden pro Woche arbeiten (§ 3 Abs. 3 EntgFG)."], "richtig": 0, "erklaerung": "Ja, auch Minijobber haben Anspruch auf Entgeltfortzahlung (§ 1 Abs. 2 EntgFG).", "schwierigkeit": "leicht"}, {"id": 811, "gesetz": "EntgFG", "frage": "#0811 Wie lange zahlt der Arbeitgeber das Gehalt bei Krankheit?", "antworten": ["Bis zu 78 Wochen innerhalb von drei Jahren (§ 3 EntgFG).", "Für die gesamte Dauer der Arbeitsunfähigkeit, solange das Arbeitsverhältnis besteht (§ 3 Abs. 1 EntgFG).", "Bis zu sechs Wochen (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Bis zu sechs Wochen (§ 3 Abs. 1 EntgFG).", "schwierigkeit": "mittel"}, {"id": 812, "gesetz": "EntgFG", "frage": "#0812 Was passiert, wenn ein Arbeitnehmer nach sechs Wochen weiterhin arbeitsunfähig ist?", "antworten": ["Die gesetzliche Krankenkasse zahlt Krankengeld (§§ 44 ff. SGB V).", "Der Arbeitgeber zahlt weiter 80 % des Entgelts für bis zu 78 Wochen (§ 3 Abs. 1 EntgFG).", "Die Agentur für Arbeit zahlt Arbeitslosengeld nach den Vorschriften des SGB III (§§ 136 ff. SGB III)."], "richtig": 0, "erklaerung": "Die gesetzliche Krankenkasse zahlt Krankengeld (§§ 44 ff. SGB V).", "schwierigkeit": "schwer"}, {"id": 813, "gesetz": "EntgFG", "frage": "#0813 Wann beginnt der Anspruch auf Entgeltfortzahlung erneut nach einer Krankheit?", "antworten": ["Immer erst zu Beginn des nächsten Kalenderjahres, unabhängig von der Krankheitsursache (§ 3 Abs. 1 EntgFG).", "Bei jeder neuen Krankheit erst nach einer Wartezeit von vier Wochen; bei derselben Krankheit nie wieder im selben Kalenderjahr (§ 3 EntgFG).", "Bei neuer Krankheit sofort neu; bei derselben Krankheit nach sechs Monaten ohne AU wegen dieser Krankheit oder zwölf Monate nach Beginn der ersten AU (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Bei neuer Krankheit sofort neu; bei derselben Krankheit nach sechs Monaten ohne AU wegen dieser Krankheit oder zwölf Monate nach Beginn der ersten AU (§ 3 Abs. 1 EntgFG).", "schwierigkeit": "leicht"}, {"id": 814, "gesetz": "EntgFG", "frage": "#0814 Welche Besonderheit gilt für eine wiederholte Erkrankung mit derselben Diagnose?", "antworten": ["Ein neuer Anspruch entsteht nur, wenn der Arbeitnehmer zwischenzeitlich mindestens vier Wochen gearbeitet hat und die Krankheit neu bescheinigt wird (§ 3 Abs. 3 EntgFG).", "Der Anspruch lebt nur auf, wenn seit der letzten Arbeitsunfähigkeit mindestens sechs Monate vergangen sind oder zwölf Monate seit der ersten Krankheit verstrichen sind (§ 3 Abs. 1 EntgFG).", "Der Anspruch besteht nur einmal pro Kalenderjahr je Diagnose; ein neuer Anspruch entsteht stets zum 1. Januar (§ 3 Abs. 1 EntgFG)."], "richtig": 1, "erklaerung": "Der Anspruch lebt nur auf, wenn seit der letzten Arbeitsunfähigkeit mindestens sechs Monate vergangen sind oder zwölf Monate seit der ersten Krankheit verstrichen sind (§ 3 Abs. 1 EntgFG).", "schwierigkeit": "mittel"}, {"id": 815, "gesetz": "EntgFG", "frage": "#0815 Gibt es eine Entgeltfortzahlung bei Organspenden?", "antworten": ["Nein, bei Organspenden besteht nur ein Anspruch auf unbezahlte Freistellung (§ 616 BGB).", "Ja, aber nur für drei Tage; danach zahlt die Krankenkasse des Spenders Krankengeld (§ 3 EntgFG).", "Ja, bis zu sechs Wochen (§ 3a EntgFG)."], "richtig": 2, "erklaerung": "Ja, bis zu sechs Wochen (§ 3a EntgFG).", "schwierigkeit": "schwer"}, {"id": 816, "gesetz": "EntgFG", "frage": "#0816 Welche Bestandteile zählen zur Entgeltfortzahlung?", "antworten": ["Ausschließlich das Grundgehalt; Zulagen und Zuschläge werden nie berücksichtigt (§ 4 Abs. 1 EntgFG).", "Das Entgelt einschließlich Überstundenvergütung und Aufwendungsersatz der letzten drei Monate (§ 4 Abs. 1a EntgFG).", "Das bei regelmäßiger Arbeitszeit zustehende Entgelt inkl. Zulagen, ohne Überstundenvergütung und Aufwendungsersatz (§ 4 Abs. 1, 1a EntgFG)."], "richtig": 2, "erklaerung": "Das bei regelmäßiger Arbeitszeit zustehende Entgelt inkl. Zulagen, ohne Überstundenvergütung und Aufwendungsersatz (§ 4 Abs. 1, 1a EntgFG).", "schwierigkeit": "leicht"}, {"id": 817, "gesetz": "EntgFG", "frage": "#0817 Sind Zulagen und Zuschläge Bestandteil des fortzuzahlenden Entgelts?", "antworten": ["Nein, Nachtzuschläge werden nur bei tatsächlicher Arbeitsleistung gezahlt und entfallen bei Krankheit ersatzlos (§ 4 EntgFG).", "Ja, aber nur zur Hälfte; Zuschläge werden bei Krankheit stets hälftig gekürzt (§ 4a EntgFG).", "Ja, wenn sie ohne die Arbeitsunfähigkeit angefallen wären (z. B. Nachtzuschläge), außer Überstundenvergütung (§ 4 Abs. 1, 1a EntgFG)."], "richtig": 2, "erklaerung": "Ja, wenn sie ohne die Arbeitsunfähigkeit angefallen wären (z. B. Nachtzuschläge), außer Überstundenvergütung (§ 4 Abs. 1, 1a EntgFG).", "schwierigkeit": "mittel"}, {"id": 818, "gesetz": "EntgFG", "frage": "#0818 Kann das Entgelt für Feiertage und Krankheit durch Tarifvertrag abweichen?", "antworten": ["Ja, Tarifverträge dürfen auch die Dauer der Entgeltfortzahlung von sechs Wochen verkürzen (§ 4 Abs. 4 EntgFG).", "Ja, aber nur die Bemessungsgrundlage des Krankheitsentgelts; sonst darf nicht zuungunsten abgewichen werden (§§ 4 Abs. 4, 12 EntgFG).", "Nein, das EntgFG ist in allen Teilen zwingend; Tarifverträge dürfen nicht davon abweichen (§ 12 EntgFG)."], "richtig": 1, "erklaerung": "Ja, aber nur die Bemessungsgrundlage des Krankheitsentgelts; sonst darf nicht zuungunsten abgewichen werden (§§ 4 Abs. 4, 12 EntgFG).", "schwierigkeit": "schwer"}, {"id": 819, "gesetz": "EntgFG", "frage": "#0819 Welche Leistungen sind von der Entgeltfortzahlung ausgenommen?", "antworten": ["Das Entgelt für die ersten drei Krankheitstage (Karenztage) (§ 3 EntgFG).", "Das Grundgehalt und vermögenswirksame Leistungen des Arbeitgebers (§ 4 Abs. 1 EntgFG).", "Überstundenvergütungen und Aufwendungsersatz (§ 4 Abs. 1a EntgFG)."], "richtig": 2, "erklaerung": "Überstundenvergütungen und Aufwendungsersatz (§ 4 Abs. 1a EntgFG).", "schwierigkeit": "leicht"}, {"id": 820, "gesetz": "EntgFG", "frage": "#0820 Kann der Arbeitgeber Sondervergütungen kürzen?", "antworten": ["Ja, wenn vereinbart; je Krankheitstag höchstens ein Viertel des im Jahresdurchschnitt auf einen Arbeitstag entfallenden Entgelts (§ 4a EntgFG).", "Nein, Sondervergütungen wie Weihnachtsgeld dürfen wegen Krankheit nie gekürzt werden (§ 4a EntgFG).", "Ja, auch ohne Vereinbarung, bis zur Hälfte des Tagesverdienstes je Krankheitstag (§ 4a EntgFG)."], "richtig": 0, "erklaerung": "Ja, wenn vereinbart; je Krankheitstag höchstens ein Viertel des im Jahresdurchschnitt auf einen Arbeitstag entfallenden Entgelts (§ 4a EntgFG).", "schwierigkeit": "mittel"}, {"id": 821, "gesetz": "EntgFG", "frage": "#0821 Wann muss eine Krankmeldung erfolgen?", "antworten": ["Innerhalb von drei Kalendertagen nach Beginn der Arbeitsunfähigkeit schriftlich (§ 5 Abs. 1 EntgFG).", "Unverzüglich nach Beginn der Arbeitsunfähigkeit (§ 5 Abs. 1 EntgFG).", "Erst, wenn die Arbeitsunfähigkeit länger als drei Kalendertage dauert; vorher ist keine Mitteilung nötig (§ 5 Abs. 1 EntgFG)."], "richtig": 1, "erklaerung": "Unverzüglich nach Beginn der Arbeitsunfähigkeit (§ 5 Abs. 1 EntgFG).", "schwierigkeit": "schwer"}, {"id": 822, "gesetz": "EntgFG", "frage": "#0822 Wann muss eine ärztliche Bescheinigung vorgelegt werden?", "antworten": ["Erst bei Arbeitsunfähigkeit von mehr als einer Woche, spätestens am zehnten Tag (§ 5 Abs. 1a EntgFG).", "Bei AU über drei Kalendertage am folgenden Arbeitstag, auf Verlangen früher; gesetzlich Versicherte nur Feststellung (eAU) (§ 5 Abs. 1, 1a EntgFG).", "Immer schon am ersten Krankheitstag, bei jeder Krankheit unabhängig von der Dauer (§ 5 Abs. 1 EntgFG)."], "richtig": 1, "erklaerung": "Bei AU über drei Kalendertage am folgenden Arbeitstag, auf Verlangen früher; gesetzlich Versicherte nur Feststellung (eAU) (§ 5 Abs. 1, 1a EntgFG).", "schwierigkeit": "leicht"}, {"id": 823, "gesetz": "EntgFG", "frage": "#0823 Was passiert, wenn ein Arbeitnehmer die Krankmeldung nicht rechtzeitig einreicht?", "antworten": ["Der Arbeitgeber kann die Zahlung verweigern, solange die Bescheinigung schuldhaft nicht vorliegt; der Anspruch entfällt nicht (§ 7 EntgFG).", "Der Arbeitnehmer schuldet dem Arbeitgeber eine Vertragsstrafe in Höhe eines Wochenlohns (§ 5 EntgFG).", "Der Anspruch auf Entgeltfortzahlung entfällt endgültig für die gesamte Krankheitsdauer (§ 7 EntgFG)."], "richtig": 0, "erklaerung": "Der Arbeitgeber kann die Zahlung verweigern, solange die Bescheinigung schuldhaft nicht vorliegt; der Anspruch entfällt nicht (§ 7 EntgFG).", "schwierigkeit": "mittel"}, {"id": 824, "gesetz": "EntgFG", "frage": "#0824 Welche Pflicht hat ein Arbeitnehmer bei Krankheit im Ausland?", "antworten": ["Er muss nach der Rückkehr lediglich eine ausländische Bescheinigung nachreichen; eine Mitteilung vorab ist nicht nötig (§ 5 Abs. 2 EntgFG).", "Er muss seinen Arbeitgeber und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG).", "Er muss binnen drei Tagen die zuständige Botschaft informieren, die die Krankheit beglaubigt (§ 5 Abs. 2 EntgFG)."], "richtig": 1, "erklaerung": "Er muss seinen Arbeitgeber und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG).", "schwierigkeit": "schwer"}, {"id": 825, "gesetz": "EntgFG", "frage": "#0825 Darf ein erkrankter Arbeitnehmer während der Arbeitsunfähigkeit verreisen?", "antworten": ["Ja, uneingeschränkt; der Arbeitgeber darf wegen Verhaltens während der Arbeitsunfähigkeit niemals abmahnen oder kündigen (§ 12 EntgFG).", "Ja, wenn die Reise die Genesung nicht gefährdet; genesungswidriges Verhalten kann zur Abmahnung oder Kündigung führen (Rechtsprechung, kein § im EntgFG).", "Nein, während der Arbeitsunfähigkeit ist jede Reise ausnahmslos verboten, sonst entfällt der Anspruch (§ 3 EntgFG)."], "richtig": 1, "erklaerung": "Ja, wenn die Reise die Genesung nicht gefährdet; genesungswidriges Verhalten kann zur Abmahnung oder Kündigung führen (Rechtsprechung, kein § im EntgFG).", "schwierigkeit": "leicht"}, {"id": 826, "gesetz": "EntgFG", "frage": "#0826 Welche Behörde ist für die Überwachung des EntgFG zuständig?", "antworten": ["Die Krankenkassen, die Ansprüche der Arbeitnehmer von Amts wegen durchsetzen (§ 5 EntgFG).", "Die Gewerbeaufsicht der Länder, die Verstöße mit Bußgeld ahnden kann (§ 12 EntgFG).", "Keine; Ansprüche werden vor den Arbeitsgerichten durchgesetzt (§ 2 ArbGG)."], "richtig": 2, "erklaerung": "Keine; Ansprüche werden vor den Arbeitsgerichten durchgesetzt (§ 2 ArbGG).", "schwierigkeit": "mittel"}, {"id": 827, "gesetz": "EntgFG", "frage": "#0827 Kann der Arbeitgeber eine Entgeltfortzahlung verweigern?", "antworten": ["Ja, in den ersten vier Wochen des Arbeitsverhältnisses sowie bei jeder wiederholten Erkrankung innerhalb von zwölf Monaten (§ 3 Abs. 3 EntgFG).", "Nein, der Arbeitgeber muss stets zahlen, auch bei grob selbstverschuldeter Krankheit oder fehlender Bescheinigung (§ 3 EntgFG).", "Ja, solange die AU-Bescheinigung fehlt oder der Forderungsübergang vereitelt wird (§ 7 EntgFG); bei Verschulden besteht kein Anspruch (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Ja, solange die AU-Bescheinigung fehlt oder der Forderungsübergang vereitelt wird (§ 7 EntgFG); bei Verschulden besteht kein Anspruch (§ 3 Abs. 1 EntgFG).", "schwierigkeit": "schwer"}, {"id": 828, "gesetz": "EntgFG", "frage": "#0828 Wann endet die Entgeltfortzahlungspflicht des Arbeitgebers?", "antworten": ["Nach sechs Wochen oder mit Ende des Arbeitsverhältnisses, außer bei Kündigung aus Anlass der Arbeitsunfähigkeit (§§ 3, 8 EntgFG).", "Sofort mit Ausspruch der Kündigung durch eine der Parteien, auch während der Krankheit (§ 622 BGB).", "Erst nach 78 Wochen Arbeitsunfähigkeit innerhalb von drei Jahren (§ 3 EntgFG)."], "richtig": 0, "erklaerung": "Nach sechs Wochen oder mit Ende des Arbeitsverhältnisses, außer bei Kündigung aus Anlass der Arbeitsunfähigkeit (§§ 3, 8 EntgFG).", "schwierigkeit": "leicht"}, {"id": 829, "gesetz": "EntgFG", "frage": "#0829 Was passiert, wenn die Arbeitsunfähigkeit durch Dritte verursacht wurde?", "antworten": ["Der Arbeitnehmer verliert seinen Anspruch auf Entgeltfortzahlung, weil Dritte haften (§ 3 EntgFG).", "Der Schadensersatzanspruch des Arbeitnehmers geht in Höhe der Entgeltfortzahlung auf den Arbeitgeber über (§ 6 EntgFG).", "Der Arbeitgeber muss den Schaden selbst tragen und kann nur die Berufsgenossenschaft in Anspruch nehmen (§ 6 EntgFG)."], "richtig": 1, "erklaerung": "Der Schadensersatzanspruch des Arbeitnehmers geht in Höhe der Entgeltfortzahlung auf den Arbeitgeber über (§ 6 EntgFG).", "schwierigkeit": "mittel"}, {"id": 830, "gesetz": "EntgFG", "frage": "#0830 Gilt das EntgFG auch für Heimarbeiter?", "antworten": ["Nein, Heimarbeiter sind vom EntgFG ausgenommen und erhalten keinerlei Entgeltsicherung (§ 1 EntgFG).", "Ja, unter bestimmten Bedingungen besteht ein Anspruch auf wirtschaftliche Sicherung (§ 10 EntgFG).", "Ja, sie haben Anspruch auf volle Entgeltfortzahlung durch den Auftraggeber für bis zu zwölf Wochen (§ 3 EntgFG)."], "richtig": 1, "erklaerung": "Ja, unter bestimmten Bedingungen besteht ein Anspruch auf wirtschaftliche Sicherung (§ 10 EntgFG).", "schwierigkeit": "schwer"}, {"id": 851, "gesetz": "MuSchG", "frage": "#0851 Darf eine schwangere Taxifahrerin weiterhin Fahrgäste befördern?", "antworten": ["Ja, uneingeschränkt bis zum Beginn der Schutzfrist, da Fahren keine belastende Tätigkeit ist (§ 3 MuSchG).", "Nur, wenn keine unverantwortbare Gefährdung besteht, z. B. durch lange Sitzzeiten, Stress oder Unfallrisiken (§ 9 MuSchG).", "Nein, schwangeren Frauen ist die Personenbeförderung nach dem Personenbeförderungsgesetz generell verboten (§ 13 PBefG)."], "richtig": 1, "erklaerung": "Nur, wenn keine unverantwortbare Gefährdung besteht, z. B. durch lange Sitzzeiten, Stress oder Unfallrisiken (§ 9 MuSchG).", "schwierigkeit": "leicht"}, {"id": 852, "gesetz": "MuSchG", "frage": "#0852 Muss ein Taxiunternehmen für schwangere Fahrerinnen spezielle Schutzmaßnahmen ergreifen?", "antworten": ["Nein, Schutzmaßnahmen sind erst nach Vorlage eines ärztlichen Beschäftigungsverbots erforderlich (§ 16 MuSchG).", "Ja, die Berufsgenossenschaft erstellt die Gefährdungsbeurteilung und weist der Schwangeren einen neuen Arbeitsplatz zu (§ 10 MuSchG).", "Ja, der Arbeitgeber muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG)."], "richtig": 2, "erklaerung": "Ja, der Arbeitgeber muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG).", "schwierigkeit": "mittel"}, {"id": 853, "gesetz": "MuSchG", "frage": "#0853 Dürfen schwangere Taxifahrerinnen in der Nachtschicht arbeiten?", "antworten": ["Nein, die Beschäftigung zwischen 20:00 Uhr und 6:00 Uhr ist grundsätzlich verboten, kann aber in Ausnahmefällen genehmigt werden (§ 5 MuSchG).", "Nein, Nachtarbeit zwischen 22:00 und 6:00 Uhr ist stets verboten, Ausnahmen gibt es nicht (§ 5 MuSchG).", "Ja, mit schriftlicher Einwilligung der Fahrerin ist Nachtarbeit ohne weitere Genehmigung und ohne Zeitgrenze zulässig (§ 5 MuSchG)."], "richtig": 0, "erklaerung": "Nein, die Beschäftigung zwischen 20:00 Uhr und 6:00 Uhr ist grundsätzlich verboten, kann aber in Ausnahmefällen genehmigt werden (§ 5 MuSchG).", "schwierigkeit": "schwer"}, {"id": 854, "gesetz": "MuSchG", "frage": "#0854 Sind Sonn- und Feiertagsdienste für schwangere Fahrerinnen erlaubt?", "antworten": ["Nur mit ausdrücklicher Bereiterklärung, bei Ausnahme nach § 10 ArbZG, mit Ersatzruhetag und ohne Gefährdung durch Alleinarbeit (§ 6 MuSchG).", "Nein, an Sonn- und Feiertagen dürfen Schwangere nie beschäftigt werden (§ 6 MuSchG).", "Ja, wie bei allen anderen Beschäftigten; besondere Voraussetzungen oder Ersatzruhetage sind nicht vorgesehen (§ 9 ArbZG)."], "richtig": 0, "erklaerung": "Nur mit ausdrücklicher Bereiterklärung, bei Ausnahme nach § 10 ArbZG, mit Ersatzruhetag und ohne Gefährdung durch Alleinarbeit (§ 6 MuSchG).", "schwierigkeit": "leicht"}, {"id": 855, "gesetz": "MuSchG", "frage": "#0855 Wie lange gilt der Mutterschutz für eine Taxifahrerin vor und nach der Geburt?", "antworten": ["Sechs Wochen vor der Geburt und mindestens acht Wochen danach (§ 3 MuSchG).", "Vier Wochen vor der Geburt und sechs Wochen danach (§ 3 MuSchG).", "Ab Bekanntgabe der Schwangerschaft bis zum Ende der Stillzeit (§ 3 MuSchG)."], "richtig": 0, "erklaerung": "Sechs Wochen vor der Geburt und mindestens acht Wochen danach (§ 3 MuSchG).", "schwierigkeit": "mittel"}, {"id": 856, "gesetz": "MuSchG", "frage": "#0856 Was ist das Ziel des Mutterschutzgesetzes (MuSchG)?", "antworten": ["Sicherung des Einkommens von Müttern in den ersten drei Lebensjahren des Kindes durch staatliches Elterngeld (§ 1 MuSchG).", "Schutz der Gesundheit von Schwangeren und stillenden Frauen sowie ihres Kindes am Arbeitsplatz (§ 1 MuSchG).", "Schutz von Arbeitnehmerinnen vor Kündigung bis zum Ende der Elternzeit sowie Anspruch auf Teilzeit nach der Geburt (§ 1 MuSchG)."], "richtig": 1, "erklaerung": "Schutz der Gesundheit von Schwangeren und stillenden Frauen sowie ihres Kindes am Arbeitsplatz (§ 1 MuSchG).", "schwierigkeit": "schwer"}, {"id": 857, "gesetz": "MuSchG", "frage": "#0857 Für wen gilt das MuSchG?", "antworten": ["Nur für verheiratete Arbeitnehmerinnen in Vollzeit, nicht für Auszubildende (§ 1 MuSchG).", "Für alle Frauen in einem Arbeitsverhältnis, einschließlich Auszubildende und Praktikantinnen (§ 1 Abs. 2 MuSchG).", "Für alle Frauen, auch Selbstständige und Unternehmerinnen, die im Taxigewerbe tätig sind (§ 1 MuSchG)."], "richtig": 1, "erklaerung": "Für alle Frauen in einem Arbeitsverhältnis, einschließlich Auszubildende und Praktikantinnen (§ 1 Abs. 2 MuSchG).", "schwierigkeit": "leicht"}, {"id": 858, "gesetz": "MuSchG", "frage": "#0858 Welche Arbeitsbedingungen sind für Schwangere besonders kritisch?", "antworten": ["Nur Tätigkeiten mit Nachtarbeit nach 22 Uhr; alle anderen Belastungen sind unbedenklich (§ 9 MuSchG).", "Teilzeitarbeit sowie Bürotätigkeiten mit Bildschirmnutzung, die stets untersagt sind (§ 9 MuSchG).", "Tätigkeiten mit schwerem Heben, langen Standzeiten, gefährlichen Stoffen oder psychischer Belastung (§ 9 MuSchG)."], "richtig": 2, "erklaerung": "Tätigkeiten mit schwerem Heben, langen Standzeiten, gefährlichen Stoffen oder psychischer Belastung (§ 9 MuSchG).", "schwierigkeit": "mittel"}, {"id": 859, "gesetz": "MuSchG", "frage": "#0859 Müssen Arbeitgeber schwangere Mitarbeiterinnen über ihre Rechte informieren?", "antworten": ["Ja, sie sind verpflichtet, über Schutzmaßnahmen und Arbeitsbedingungen aufzuklären (§ 14 MuSchG).", "Ja, aber nur auf ausdrückliche Nachfrage der Schwangeren; eine Aufklärungspflicht von sich aus besteht nicht (§ 15 MuSchG).", "Nein, die Information ist Aufgabe der Krankenkasse; der Arbeitgeber muss lediglich das Mutterschaftsgeld melden (§ 19 MuSchG)."], "richtig": 0, "erklaerung": "Ja, sie sind verpflichtet, über Schutzmaßnahmen und Arbeitsbedingungen aufzuklären (§ 14 MuSchG).", "schwierigkeit": "schwer"}, {"id": 860, "gesetz": "MuSchG", "frage": "#0860 Welche besonderen Schutzmaßnahmen gelten für stillende Mütter?", "antworten": ["Stillzeiten müssen gewährt und Arbeitsbedingungen angepasst werden (§ 7 MuSchG).", "Sie müssen ein Jahr lang vollständig und unbezahlt von der Arbeit freigestellt werden (§ 6 MuSchG).", "Es gilt ein absolutes Beschäftigungsverbot für sechs Monate nach der Entbindung (§ 3 MuSchG)."], "richtig": 0, "erklaerung": "Stillzeiten müssen gewährt und Arbeitsbedingungen angepasst werden (§ 7 MuSchG).", "schwierigkeit": "leicht"}, {"id": 861, "gesetz": "MuSchG", "frage": "#0861 Welche Tätigkeiten sind für Schwangere unzulässig?", "antworten": ["Tätigkeiten mit unverantwortbarer Gefährdung durch Gefahrstoffe, Hitze oder Lärm sowie Akkord- und Fließarbeit (§ 11 MuSchG).", "Ausschließlich Nachtarbeit und Sonntagsarbeit; alle anderen Tätigkeiten bleiben stets erlaubt (§ 11 MuSchG).", "Jede Tätigkeit mit Kundenkontakt sowie jede Arbeit im Außendienst (§ 11 MuSchG)."], "richtig": 0, "erklaerung": "Tätigkeiten mit unverantwortbarer Gefährdung durch Gefahrstoffe, Hitze oder Lärm sowie Akkord- und Fließarbeit (§ 11 MuSchG).", "schwierigkeit": "mittel"}, {"id": 862, "gesetz": "MuSchG", "frage": "#0862 Wann darf eine schwangere Frau nicht mehr arbeiten?", "antworten": ["Acht Wochen vor der Geburt; ein Verzicht der Schwangeren ist nicht möglich (§ 3 MuSchG).", "Sechs Wochen vor der Geburt, es sei denn, sie erklärt sich ausdrücklich bereit (§ 3 MuSchG).", "Ab Beginn des siebten Schwangerschaftsmonats, sofern ein Arzt dies bescheinigt (§ 16 MuSchG)."], "richtig": 1, "erklaerung": "Sechs Wochen vor der Geburt, es sei denn, sie erklärt sich ausdrücklich bereit (§ 3 MuSchG).", "schwierigkeit": "schwer"}, {"id": 863, "gesetz": "MuSchG", "frage": "#0863 Wann endet das Beschäftigungsverbot nach der Geburt?", "antworten": ["Mit Ablauf der Elternzeit, spätestens drei Jahre nach der Geburt (§ 15 BEEG).", "Sechs Wochen nach der Entbindung, bei Mehrlingsgeburten acht Wochen (§ 3 Abs. 2 MuSchG).", "Acht Wochen nach der Entbindung, bei Früh-, Mehrlingsgeburten oder Behinderung des Kindes (auf Antrag) zwölf Wochen (§ 3 Abs. 2 MuSchG)."], "richtig": 2, "erklaerung": "Acht Wochen nach der Entbindung, bei Früh-, Mehrlingsgeburten oder Behinderung des Kindes (auf Antrag) zwölf Wochen (§ 3 Abs. 2 MuSchG).", "schwierigkeit": "leicht"}, {"id": 864, "gesetz": "MuSchG", "frage": "#0864 Darf eine schwangere Frau schwere körperliche Arbeiten verrichten?", "antworten": ["Ja, ohne Einschränkung, solange kein Arzt ein individuelles Beschäftigungsverbot ausspricht (§ 16 MuSchG).", "Nein, wenn die Arbeit eine Gefährdung für sie oder das Kind darstellt (§ 9 MuSchG).", "Nein, jede körperliche Arbeit ist während der gesamten Schwangerschaft ausnahmslos untersagt (§ 11 MuSchG)."], "richtig": 1, "erklaerung": "Nein, wenn die Arbeit eine Gefährdung für sie oder das Kind darstellt (§ 9 MuSchG).", "schwierigkeit": "mittel"}, {"id": 865, "gesetz": "MuSchG", "frage": "#0865 Wie oft muss der Arbeitgeber eine Gefährdungsbeurteilung für schwangere Mitarbeiterinnen durchführen?", "antworten": ["Einmal jährlich, jeweils zum 1. Januar, für alle Arbeitnehmerinnen im Betrieb (§ 10 MuSchG).", "Vorab für jede Tätigkeit im Rahmen der Gefährdungsbeurteilung; nach Mitteilung der Schwangerschaft sind unverzüglich Schutzmaßnahmen festzulegen (§ 10 MuSchG).", "Erst nach Mitteilung der Schwangerschaft, dann einmalig innerhalb von sechs Wochen (§ 14 MuSchG)."], "richtig": 1, "erklaerung": "Vorab für jede Tätigkeit im Rahmen der Gefährdungsbeurteilung; nach Mitteilung der Schwangerschaft sind unverzüglich Schutzmaßnahmen festzulegen (§ 10 MuSchG).", "schwierigkeit": "schwer"}, {"id": 866, "gesetz": "MuSchG", "frage": "#0866 Wann beginnt der Kündigungsschutz für Schwangere?", "antworten": ["Ab Bekanntgabe der Schwangerschaft und bis zum Ende der Elternzeit (§ 18 BEEG).", "Erst ab dem vierten Schwangerschaftsmonat und bis zum Ende der Schutzfrist nach der Geburt (§ 17 MuSchG).", "Ab Beginn der Schwangerschaft und bis vier Monate nach der Geburt (§ 17 MuSchG)."], "richtig": 2, "erklaerung": "Ab Beginn der Schwangerschaft und bis vier Monate nach der Geburt (§ 17 MuSchG).", "schwierigkeit": "leicht"}, {"id": 867, "gesetz": "MuSchG", "frage": "#0867 Darf eine schwangere Frau während der Elternzeit gekündigt werden?", "antworten": ["Nein; es gilt das Kündigungsverbot während der Schwangerschaft (§ 17 MuSchG) und zusätzlich der Kündigungsschutz in der Elternzeit (§ 18 BEEG).", "Ja, in der Elternzeit entfällt der besondere Kündigungsschutz nach dem MuSchG vollständig (§ 17 MuSchG).", "Ja, mit Zustimmung der Agentur für Arbeit, die allein zuständig ist (§ 17 MuSchG)."], "richtig": 0, "erklaerung": "Nein; es gilt das Kündigungsverbot während der Schwangerschaft (§ 17 MuSchG) und zusätzlich der Kündigungsschutz in der Elternzeit (§ 18 BEEG).", "schwierigkeit": "mittel"}, {"id": 868, "gesetz": "MuSchG", "frage": "#0868 Wie hoch ist das Mutterschaftsgeld?", "antworten": ["Bis zu 25 € pro Kalendertag plus Zuschuss der Krankenkasse (§ 24 MuSchG).", "Bis zu 13 € pro Kalendertag plus Arbeitgeberzuschuss (§ 19, § 20 MuSchG).", "80 % des letzten Nettogehalts, gezahlt allein durch die Krankenkasse (§ 19 MuSchG)."], "richtig": 1, "erklaerung": "Bis zu 13 € pro Kalendertag plus Arbeitgeberzuschuss (§ 19, § 20 MuSchG).", "schwierigkeit": "schwer"}, {"id": 869, "gesetz": "MuSchG", "frage": "#0869 Wer zahlt den Mutterschutzlohn?", "antworten": ["Der Arbeitgeber während eines Beschäftigungsverbots (§ 18 MuSchG).", "Die Krankenkasse der Arbeitnehmerin (§ 19 MuSchG).", "Die Agentur für Arbeit, solange die Frau nicht beschäftigt werden darf (§ 20 MuSchG)."], "richtig": 0, "erklaerung": "Der Arbeitgeber während eines Beschäftigungsverbots (§ 18 MuSchG).", "schwierigkeit": "leicht"}, {"id": 870, "gesetz": "MuSchG", "frage": "#0870 Wie wird das Mutterschaftsgeld berechnet?", "antworten": ["Nach dem Nettoentgelt der letzten drei abgerechneten Kalendermonate vor der Schutzfrist; Kasse max. 13 €/Tag, Rest Arbeitgeberzuschuss (§§ 19–21 MuSchG).", "Nach dem Bruttoentgelt der letzten zwölf Monate; die Krankenkasse zahlt den vollen Betrag ohne Obergrenze (§ 19 MuSchG).", "Pauschal nach dem Mindestlohn für 40 Wochenstunden während der Schutzfristen (§ 24 MuSchG)."], "richtig": 0, "erklaerung": "Nach dem Nettoentgelt der letzten drei abgerechneten Kalendermonate vor der Schutzfrist; Kasse max. 13 €/Tag, Rest Arbeitgeberzuschuss (§§ 19–21 MuSchG).", "schwierigkeit": "mittel"}, {"id": 871, "gesetz": "MuSchG", "frage": "#0871 Welche Behörde ist für die Überwachung des Mutterschutzes zuständig?", "antworten": ["Die Krankenkassen, die das Mutterschaftsgeld zahlen (§ 29 MuSchG).", "Die Arbeitsschutzbehörden der Länder (§ 29 MuSchG).", "Die Berufsgenossenschaften als Träger der gesetzlichen Unfallversicherung (§ 29 MuSchG)."], "richtig": 1, "erklaerung": "Die Arbeitsschutzbehörden der Länder (§ 29 MuSchG).", "schwierigkeit": "schwer"}, {"id": 872, "gesetz": "MuSchG", "frage": "#0872 Was passiert, wenn ein Arbeitgeber gegen das MuSchG verstößt?", "antworten": ["Keine Sanktionen; das MuSchG enthält nur Empfehlungen ohne Bußgeldvorschriften (§ 33 MuSchG).", "Entzug der Gewerbeerlaubnis durch die Genehmigungsbehörde bei jedem Verstoß (§ 32 MuSchG).", "Geldbußen bis zu 30.000 € oder Freiheitsstrafen bei schwerwiegenden Verstößen (§ 32, § 33 MuSchG)."], "richtig": 2, "erklaerung": "Geldbußen bis zu 30.000 € oder Freiheitsstrafen bei schwerwiegenden Verstößen (§ 32, § 33 MuSchG).", "schwierigkeit": "leicht"}, {"id": 873, "gesetz": "MuSchG", "frage": "#0873 Welche Dokumentationspflichten hat der Arbeitgeber im Mutterschutz?", "antworten": ["Er muss Schutzmaßnahmen und Gefährdungsbeurteilungen schriftlich festhalten (§ 14 MuSchG).", "Er muss Schutzmaßnahmen der Krankenkasse melden und dort zehn Jahre archivieren lassen (§ 14 MuSchG).", "Er muss lediglich die Mitteilung der Schwangerschaft intern abheften; eine Dokumentation von Gefährdungen ist nicht vorgesehen (§ 15 MuSchG)."], "richtig": 0, "erklaerung": "Er muss Schutzmaßnahmen und Gefährdungsbeurteilungen schriftlich festhalten (§ 14 MuSchG).", "schwierigkeit": "mittel"}, {"id": 874, "gesetz": "MuSchG", "frage": "#0874 Welche Informationspflicht hat die Schwangere gegenüber dem Arbeitgeber?", "antworten": ["Sie ist verpflichtet, schon vor der Einstellung ein ärztliches Zeugnis über eine Schwangerschaft vorzulegen (§ 15 MuSchG).", "Sie muss die Schwangerschaft innerhalb von drei Tagen nach ärztlicher Feststellung schriftlich mitteilen (§ 15 MuSchG).", "Sie soll Schwangerschaft und voraussichtlichen Entbindungstag mitteilen, sobald sie davon weiß; eine Pflicht besteht nicht (§ 15 MuSchG)."], "richtig": 2, "erklaerung": "Sie soll Schwangerschaft und voraussichtlichen Entbindungstag mitteilen, sobald sie davon weiß; eine Pflicht besteht nicht (§ 15 MuSchG).", "schwierigkeit": "schwer"}, {"id": 875, "gesetz": "MuSchG", "frage": "#0875 Welche Konsequenzen hat eine missachtete Gefährdungsbeurteilung?", "antworten": ["Die Industrie- und Handelskammer entzieht dem Unternehmen die Ausbildungsberechtigung (§ 29 MuSchG).", "Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG).", "Die Krankenkasse kürzt dem Arbeitgeber die Erstattung der Umlage U2 (§ 1 AAG)."], "richtig": 1, "erklaerung": "Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG).", "schwierigkeit": "leicht"}, {"id": 876, "gesetz": "MuSchG", "frage": "#0876 Gibt es eine Ausnahme für werdende Mütter in Ausbildung oder Studium?", "antworten": ["Nein, Schülerinnen und Studentinnen sind vom Schutz des MuSchG ausgenommen und dürfen stets teilnehmen (§ 1 MuSchG).", "Ja, Studentinnen dürfen auch ohne ausdrückliches Verlangen zur Teilnahme an Pflichtveranstaltungen in der Schutzfrist verpflichtet werden (§ 3 Abs. 3 MuSchG).", "Ja, Schülerinnen und Studentinnen dürfen auf ausdrückliches Verlangen schon in der Schutzfrist nach der Entbindung an der Ausbildung teilnehmen (§ 3 Abs. 3 MuSchG)."], "richtig": 2, "erklaerung": "Ja, Schülerinnen und Studentinnen dürfen auf ausdrückliches Verlangen schon in der Schutzfrist nach der Entbindung an der Ausbildung teilnehmen (§ 3 Abs. 3 MuSchG).", "schwierigkeit": "mittel"}, {"id": 877, "gesetz": "MuSchG", "frage": "#0877 Welche Schutzmaßnahmen gelten für werdende Mütter in Schichtarbeit?", "antworten": ["Keine Arbeit zwischen 22 und 6 Uhr, höchstens 10 Stunden täglich und mindestens 9 Stunden Ruhezeit (§§ 4, 5 MuSchG).", "Schichtarbeit ist nur in der Frühschicht von 6 bis 14 Uhr erlaubt; Dauer und Ruhezeit regelt allein der Tarifvertrag (§ 6 MuSchG).", "Keine Arbeit zwischen 20 und 6 Uhr, max. 8,5 Stunden täglich und mindestens 11 Stunden ununterbrochene Ruhezeit (§§ 4, 5 MuSchG)."], "richtig": 2, "erklaerung": "Keine Arbeit zwischen 20 und 6 Uhr, max. 8,5 Stunden täglich und mindestens 11 Stunden ununterbrochene Ruhezeit (§§ 4, 5 MuSchG).", "schwierigkeit": "schwer"}, {"id": 878, "gesetz": "MuSchG", "frage": "#0878 Welches Recht hat eine Frau nach dem Ende eines Beschäftigungsverbots?", "antworten": ["Sie hat Anspruch auf Beförderung in eine höhere Entgeltgruppe als Ausgleich (§ 25 MuSchG).", "Sie muss sich beim Arbeitgeber neu bewerben, da das Arbeitsverhältnis endet (§ 17 MuSchG).", "Nach Ende eines Beschäftigungsverbots hat die Frau das Recht, entsprechend den vertraglich vereinbarten Bedingungen beschäftigt zu werden (§ 25 MuSchG)."], "richtig": 2, "erklaerung": "Nach Ende eines Beschäftigungsverbots hat die Frau das Recht, entsprechend den vertraglich vereinbarten Bedingungen beschäftigt zu werden (§ 25 MuSchG).", "schwierigkeit": "leicht"}, {"id": 879, "gesetz": "MuSchG", "frage": "#0879 Was gilt für Frauen in Teilzeit während der Stillzeit?", "antworten": ["Auch in Teilzeit Freistellung auf Verlangen in den ersten zwölf Monaten, mind. zweimal 30 oder einmal 60 Minuten täglich, ohne Entgeltausfall (§§ 7, 23 MuSchG).", "Ja, aber nur unbezahlt und nur bis zum sechsten Lebensmonat des Kindes (§ 23 MuSchG).", "Nein, Teilzeitkräfte haben keinen Anspruch auf Stillzeiten; nur Vollzeitkräfte (§ 7 MuSchG)."], "richtig": 0, "erklaerung": "Auch in Teilzeit Freistellung auf Verlangen in den ersten zwölf Monaten, mind. zweimal 30 oder einmal 60 Minuten täglich, ohne Entgeltausfall (§§ 7, 23 MuSchG).", "schwierigkeit": "mittel"}, {"id": 880, "gesetz": "MuSchG", "frage": "#0880 Dürfen Arbeitgeber den Arbeitsvertrag einer schwangeren Frau anpassen?", "antworten": ["Ja, der Arbeitgeber darf den Vertrag einseitig ändern und das Entgelt dauerhaft entsprechend der neuen Tätigkeit kürzen (§ 13 MuSchG).", "Bei unverantwortbarer Gefährdung: zuerst Arbeitsbedingungen umgestalten, dann Arbeitsplatzwechsel, zuletzt Beschäftigungsverbot (§ 13 MuSchG).", "Zuerst Beschäftigungsverbot, dann Arbeitsplatzwechsel, zuletzt Umgestaltung der Arbeitsbedingungen (§ 13 MuSchG)."], "richtig": 1, "erklaerung": "Bei unverantwortbarer Gefährdung: zuerst Arbeitsbedingungen umgestalten, dann Arbeitsplatzwechsel, zuletzt Beschäftigungsverbot (§ 13 MuSchG).", "schwierigkeit": "schwer"}, {"id": 901, "gesetz": "SGB IX", "frage": "#0901 Muss ein Taxiunternehmen schwerbehinderte Fahrer einstellen?", "antworten": ["Ja, jedes Taxiunternehmen muss unabhängig von seiner Größe mindestens einen schwerbehinderten Fahrer fest einstellen (§ 154 SGB IX).", "Nein, keine Pflicht im Einzelfall; Arbeitgeber mit mindestens 20 Arbeitsplätzen müssen aber auf 5 % der Arbeitsplätze schwerbehinderte Menschen beschäftigen oder eine Ausgleichsabgabe zahlen (§§ 154, 160 SGB IX).", "Nein, die Beschäftigungspflicht gilt nur für Arbeitgeber des öffentlichen Dienstes; private Unternehmen sind davon vollständig ausgenommen (§ 154 SGB IX)."], "richtig": 1, "erklaerung": "Nein, keine Pflicht im Einzelfall; Arbeitgeber mit mindestens 20 Arbeitsplätzen müssen aber auf 5 % der Arbeitsplätze schwerbehinderte Menschen beschäftigen oder eine Ausgleichsabgabe zahlen (§§ 154, 160 SGB IX).", "schwierigkeit": "leicht"}, {"id": 902, "gesetz": "SGB IX", "frage": "#0902 Welche Rechte hat ein schwerbehinderter Taxifahrer im Arbeitsverhältnis?", "antworten": ["Er hat Anspruch auf Zusatzurlaub, besonderen Kündigungsschutz und ggf. technische Arbeitshilfen (§§ 164, 168, 208 SGB IX).", "Er hat Anspruch auf eine bezahlte Freistellung von 20 Wochenstunden und auf eine Abfindung bei jeder Kündigung (§§ 164, 207 SGB IX).", "Er hat Anspruch auf drei Zusatzurlaubstage, Kündigungsschutz erst nach zehn Jahren und eine feste Tagesschicht (§§ 164, 168, 208 SGB IX)."], "richtig": 0, "erklaerung": "Er hat Anspruch auf Zusatzurlaub, besonderen Kündigungsschutz und ggf. technische Arbeitshilfen (§§ 164, 168, 208 SGB IX).", "schwierigkeit": "mittel"}, {"id": 903, "gesetz": "SGB IX", "frage": "#0903 Welche Pflichten hat ein Taxiunternehmen gegenüber schwerbehinderten Beschäftigten?", "antworten": ["Es muss ihnen nach drei Jahren Betriebszugehörigkeit einen Dauerarbeitsplatz mit Leitungsfunktion zuweisen (§ 164 SGB IX).", "Es muss sie ausschließlich im Innendienst beschäftigen (§ 160 SGB IX).", "Es muss ihnen geeignete Arbeitsbedingungen und Unterstützungsmaßnahmen bieten (§ 164 SGB IX)."], "richtig": 2, "erklaerung": "Es muss ihnen geeignete Arbeitsbedingungen und Unterstützungsmaßnahmen bieten (§ 164 SGB IX).", "schwierigkeit": "schwer"}, {"id": 904, "gesetz": "SGB IX", "frage": "#0904 Kann ein schwerbehinderter Taxifahrer von Nachtfahrten befreit werden?", "antworten": ["Ja, wenn gesundheitliche Einschränkungen vorliegen (§ 164 Abs. 4 SGB IX).", "Nein, Nachtfahrten gehören zum Taxigewerbe und eine Befreiung ist gesetzlich ausgeschlossen (§ 164 SGB IX).", "Nur, wenn der Fahrer mindestens 20 Dienstjahre im Betrieb hat (§ 208 SGB IX)."], "richtig": 0, "erklaerung": "Ja, wenn gesundheitliche Einschränkungen vorliegen (§ 164 Abs. 4 SGB IX).", "schwierigkeit": "leicht"}, {"id": 905, "gesetz": "SGB IX", "frage": "#0905 Welche besonderen Fördermöglichkeiten gibt es für Taxiunternehmen, die schwerbehinderte Fahrer beschäftigen?", "antworten": ["Zuschüsse zur Einrichtung eines behindertengerechten Arbeitsplatzes und Lohnkostenzuschüsse (§ 185 SGB IX).", "Pauschale Übernahme der Arbeitgeberanteile zur Sozialversicherung durch die Krankenkasse für drei Jahre (§ 50 SGB IX).", "Steuerfreibeträge bei der Gewerbesteuer und Zuschüsse zur Anschaffung von Taxametern (§ 185 SGB IX)."], "richtig": 0, "erklaerung": "Zuschüsse zur Einrichtung eines behindertengerechten Arbeitsplatzes und Lohnkostenzuschüsse (§ 185 SGB IX).", "schwierigkeit": "mittel"}, {"id": 906, "gesetz": "SGB IX", "frage": "#0906 Was regelt das Sozialgesetzbuch Neuntes Buch (SGB IX)?", "antworten": ["Die Beitragsbemessung und Beitragserhebung in der gesetzlichen Pflegeversicherung (§ 1 SGB IX).", "Die Rehabilitation und Teilhabe von Menschen mit Behinderungen am Arbeitsleben und in der Gesellschaft (§ 1 SGB IX).", "Die Grundsicherung für Arbeitsuchende und die Leistungen zum Lebensunterhalt (§ 1 SGB IX)."], "richtig": 1, "erklaerung": "Die Rehabilitation und Teilhabe von Menschen mit Behinderungen am Arbeitsleben und in der Gesellschaft (§ 1 SGB IX).", "schwierigkeit": "schwer"}, {"id": 907, "gesetz": "SGB IX", "frage": "#0907 Wer gilt als schwerbehindert im Sinne des SGB IX?", "antworten": ["Alle Personen über 55 Jahre mit einer chronischen Erkrankung (§ 2 SGB IX).", "Nur Personen mit Schwerbehindertenausweis und den Merkzeichen G oder aG (§ 229 SGB IX).", "Personen mit einem Grad der Behinderung (GdB) von mindestens 50 (§ 2 Abs. 2 SGB IX)."], "richtig": 2, "erklaerung": "Personen mit einem Grad der Behinderung (GdB) von mindestens 50 (§ 2 Abs. 2 SGB IX).", "schwierigkeit": "leicht"}, {"id": 908, "gesetz": "SGB IX", "frage": "#0908 Welche Institutionen sind für die Teilhabeleistungen zuständig?", "antworten": ["Krankenkassen, Agentur für Arbeit, Unfall- und Rentenversicherung, Träger der Sozialen Entschädigung, der Jugendhilfe und der Eingliederungshilfe (§ 6 SGB IX).", "Ausschließlich die Krankenkassen und das Integrationsamt (§ 6 SGB IX).", "Die Industrie- und Handelskammern, die Handwerkskammern und die Berufsgenossenschaft der Verkehrswirtschaft allein (§ 6 SGB IX)."], "richtig": 0, "erklaerung": "Krankenkassen, Agentur für Arbeit, Unfall- und Rentenversicherung, Träger der Sozialen Entschädigung, der Jugendhilfe und der Eingliederungshilfe (§ 6 SGB IX).", "schwierigkeit": "mittel"}, {"id": 909, "gesetz": "SGB IX", "frage": "#0909 Welches Ziel verfolgt die berufliche Rehabilitation?", "antworten": ["Die Beschäftigung von Menschen mit Behinderung ausschließlich in Werkstätten für behinderte Menschen (§ 49 SGB IX).", "Die Absicherung des Lebensunterhalts durch eine dauerhafte Erwerbsminderungsrente (§ 43 SGB VI).", "Die Wiederherstellung oder Verbesserung der Erwerbsfähigkeit von Menschen mit Behinderung (§ 49 SGB IX)."], "richtig": 2, "erklaerung": "Die Wiederherstellung oder Verbesserung der Erwerbsfähigkeit von Menschen mit Behinderung (§ 49 SGB IX).", "schwierigkeit": "schwer"}, {"id": 910, "gesetz": "SGB IX", "frage": "#0910 Welche Arten der Teilhabeleistungen gibt es?", "antworten": ["Nur Leistungen zur medizinischen Behandlung und Krankengeld (§ 5 SGB IX).", "Rentenleistungen, Arbeitslosengeld, Wohngeld und Kindergeld (§ 5 SGB IX).", "Medizinische Rehabilitation, Teilhabe am Arbeitsleben, unterhaltssichernde und ergänzende Leistungen, Teilhabe an Bildung, soziale Teilhabe (§ 5 SGB IX)."], "richtig": 2, "erklaerung": "Medizinische Rehabilitation, Teilhabe am Arbeitsleben, unterhaltssichernde und ergänzende Leistungen, Teilhabe an Bildung, soziale Teilhabe (§ 5 SGB IX).", "schwierigkeit": "leicht"}, {"id": 911, "gesetz": "SGB IX", "frage": "#0911 Ab welcher Betriebsgröße müssen Arbeitgeber schwerbehinderte Menschen beschäftigen?", "antworten": ["Ab jahresdurchschnittlich 20 Arbeitsplätzen auf 5 % der Arbeitsplätze; unter 40 Arbeitsplätzen ein, unter 60 zwei Pflichtplätze (§ 154 Abs. 1 SGB IX).", "Ab jahresdurchschnittlich 50 Arbeitsplätzen auf 6 % der Arbeitsplätze; unter 100 Arbeitsplätzen ein Pflichtplatz (§ 154 Abs. 1 SGB IX).", "Ab zehn Arbeitsplätzen auf 3 %; Kleinbetriebe unter 20 Arbeitsplätzen zahlen die Hälfte der Ausgleichsabgabe (§ 154 SGB IX)."], "richtig": 0, "erklaerung": "Ab jahresdurchschnittlich 20 Arbeitsplätzen auf 5 % der Arbeitsplätze; unter 40 Arbeitsplätzen ein, unter 60 zwei Pflichtplätze (§ 154 Abs. 1 SGB IX).", "schwierigkeit": "mittel"}, {"id": 912, "gesetz": "SGB IX", "frage": "#0912 Welche Sanktionen drohen Unternehmen, die die Beschäftigungspflicht nicht erfüllen?", "antworten": ["Der Betrieb verliert den Anspruch auf Lohnkostenzuschüsse und wird vom Integrationsamt gesperrt (§ 185 SGB IX).", "Geldbuße bis 50.000 € und Entzug der Gewerbeerlaubnis (§ 238 SGB IX).", "Sie müssen eine Ausgleichsabgabe zahlen (§ 160 SGB IX)."], "richtig": 2, "erklaerung": "Sie müssen eine Ausgleichsabgabe zahlen (§ 160 SGB IX).", "schwierigkeit": "schwer"}, {"id": 913, "gesetz": "SGB IX", "frage": "#0913 Welche Besonderheiten gelten für die Kündigung eines schwerbehinderten Taxifahrers?", "antworten": ["Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX).", "Die Kündigung ist wirksam, wenn der Arbeitgeber sie der Agentur für Arbeit vier Wochen vorher anzeigt (§ 17 KSchG).", "Die Kündigung ist nur mit Zustimmung des Betriebsrats wirksam; das Integrationsamt wird nicht beteiligt (§ 102 BetrVG)."], "richtig": 0, "erklaerung": "Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX).", "schwierigkeit": "leicht"}, {"id": 914, "gesetz": "SGB IX", "frage": "#0914 Wie hoch ist der Zusatzurlaub für schwerbehinderte Arbeitnehmer?", "antworten": ["Zehn zusätzliche Arbeitstage pro Jahr (§ 208 SGB IX).", "Fünf zusätzliche Arbeitstage pro Jahr (§ 208 SGB IX).", "Ein zusätzlicher Urlaubstag je zehn Dienstjahre, höchstens drei Tage (§ 208 SGB IX)."], "richtig": 1, "erklaerung": "Fünf zusätzliche Arbeitstage pro Jahr (§ 208 SGB IX).", "schwierigkeit": "mittel"}, {"id": 915, "gesetz": "SGB IX", "frage": "#0915 Was ist eine Inklusionsvereinbarung?", "antworten": ["Eine Vereinbarung mit der Agentur für Arbeit über die Zahlung der Ausgleichsabgabe in Raten (§ 160 SGB IX).", "Eine Vereinbarung des Integrationsamts mit dem Arbeitgeber über Zuschüsse für behindertengerechte Fahrzeuge (§ 185 SGB IX).", "Eine verbindliche Vereinbarung des Arbeitgebers mit Schwerbehindertenvertretung und Betriebsrat zur Eingliederung schwerbehinderter Menschen (§ 166 SGB IX)."], "richtig": 2, "erklaerung": "Eine verbindliche Vereinbarung des Arbeitgebers mit Schwerbehindertenvertretung und Betriebsrat zur Eingliederung schwerbehinderter Menschen (§ 166 SGB IX).", "schwierigkeit": "schwer"}, {"id": 916, "gesetz": "SGB IX", "frage": "#0916 Welche Maßnahmen der beruflichen Rehabilitation gibt es?", "antworten": ["Kuren, Krankenhausbehandlungen und häusliche Krankenpflege (§ 42 SGB IX).", "Umschulungen, Anpassungsqualifikationen, technische Arbeitshilfen, unterstützte Beschäftigung (§ 49 SGB IX).", "Ruhestandsversetzung, Rentenzahlung und Krankengeld (§ 49 SGB IX)."], "richtig": 1, "erklaerung": "Umschulungen, Anpassungsqualifikationen, technische Arbeitshilfen, unterstützte Beschäftigung (§ 49 SGB IX).", "schwierigkeit": "leicht"}, {"id": 917, "gesetz": "SGB IX", "frage": "#0917 Welche finanziellen Hilfen gibt es für Arbeitgeber bei der Einstellung schwerbehinderter Menschen?", "antworten": ["Befreiung von den Arbeitgeberanteilen zur Sozialversicherung für die gesamte Beschäftigungsdauer (§ 164 SGB IX).", "Zuschüsse für die Arbeitsplatzanpassung, Lohnkostenzuschüsse (§ 50 SGB IX).", "Steuerliche Absetzung des gesamten Gehalts des Beschäftigten bei der Einkommensteuer (§ 50 SGB IX)."], "richtig": 1, "erklaerung": "Zuschüsse für die Arbeitsplatzanpassung, Lohnkostenzuschüsse (§ 50 SGB IX).", "schwierigkeit": "mittel"}, {"id": 918, "gesetz": "SGB IX", "frage": "#0918 Welche besonderen Rechte haben schwerbehinderte Auszubildende?", "antworten": ["Sie haben Anspruch auf eine um ein Jahr verkürzte Ausbildung und sind von der Abschlussprüfung befreit (§ 64 BBiG).", "Sie haben Anspruch auf behinderungsgerechte Ausbildung (Nachteilsausgleich, ggf. Verlängerung der Ausbildung); Arbeitgeber können Ausbildungszuschüsse erhalten (§ 50 SGB IX, §§ 64 ff. BBiG).", "Sie haben Anspruch auf Vergütung in Höhe des doppelten Mindestlohns; Zuschüsse erhalten allein die Berufsschulen (§ 50 SGB IX)."], "richtig": 1, "erklaerung": "Sie haben Anspruch auf behinderungsgerechte Ausbildung (Nachteilsausgleich, ggf. Verlängerung der Ausbildung); Arbeitgeber können Ausbildungszuschüsse erhalten (§ 50 SGB IX, §§ 64 ff. BBiG).", "schwierigkeit": "schwer"}, {"id": 919, "gesetz": "SGB IX", "frage": "#0919 Wer ist für die berufliche Rehabilitation zuständig?", "antworten": ["Ausschließlich die Industrie- und Handelskammer (§ 6 SGB IX).", "Der Arbeitgeber auf eigene Kosten (§ 164 SGB IX).", "Je nach Fall die Rentenversicherung, Agentur für Arbeit oder Unfallversicherung (§ 6 SGB IX)."], "richtig": 2, "erklaerung": "Je nach Fall die Rentenversicherung, Agentur für Arbeit oder Unfallversicherung (§ 6 SGB IX).", "schwierigkeit": "leicht"}, {"id": 920, "gesetz": "SGB IX", "frage": "#0920 Was ist das Budget für Arbeit?", "antworten": ["Befristeter Zuschuss für Selbstständige zur Anschaffung eines Taxis, begrenzt auf 5.000 € (§ 61 SGB IX).", "Leistung für WfbM-berechtigte Menschen mit Behinderung bei Einstellung auf dem allgemeinen Arbeitsmarkt: Lohnkostenzuschuss an den Arbeitgeber bis 75 % sowie Anleitung und Begleitung (§ 61 SGB IX).", "Pauschales monatliches Budget für Pflegebedürftige zur Finanzierung von Pflegekräften (§ 29 SGB IX)."], "richtig": 1, "erklaerung": "Leistung für WfbM-berechtigte Menschen mit Behinderung bei Einstellung auf dem allgemeinen Arbeitsmarkt: Lohnkostenzuschuss an den Arbeitgeber bis 75 % sowie Anleitung und Begleitung (§ 61 SGB IX).", "schwierigkeit": "mittel"}, {"id": 921, "gesetz": "SGB IX", "frage": "#0921 Welche Beratungsangebote gibt es für Menschen mit Behinderungen?", "antworten": ["Ergänzende unabhängige Teilhabeberatung (EUTB) (§ 32 SGB IX).", "Der Pflegestützpunkt der Pflegekasse für alle Leistungen der Teilhabe (§ 7a SGB XI).", "Die Beratung durch die Industrie- und Handelskammer im Rahmen der Gewerbeanmeldung (§ 32 SGB IX)."], "richtig": 0, "erklaerung": "Ergänzende unabhängige Teilhabeberatung (EUTB) (§ 32 SGB IX).", "schwierigkeit": "schwer"}, {"id": 922, "gesetz": "SGB IX", "frage": "#0922 Was sind Integrationsfachdienste?", "antworten": ["Spezialisierte Dienste, die Menschen mit Behinderungen bei der Arbeitsplatzsuche und -erhaltung unterstützen (§ 192 SGB IX).", "Behörden, die Schwerbehindertenausweise ausstellen und den Grad der Behinderung feststellen (§ 152 SGB IX).", "Fahrdienste, die schwerbehinderte Menschen zur Arbeit befördern (§ 228 SGB IX)."], "richtig": 0, "erklaerung": "Spezialisierte Dienste, die Menschen mit Behinderungen bei der Arbeitsplatzsuche und -erhaltung unterstützen (§ 192 SGB IX).", "schwierigkeit": "leicht"}, {"id": 923, "gesetz": "SGB IX", "frage": "#0923 Welche Pflichten haben Arbeitgeber in Bezug auf Prävention?", "antworten": ["Sie müssen frühzeitig Maßnahmen zur Verhinderung von Kündigungen ergreifen (§ 167 SGB IX).", "Sie müssen vor jeder Kündigung eine Abfindung von mindestens einem Monatsgehalt anbieten (§ 1a KSchG).", "Sie müssen jährlich alle Beschäftigten ärztlich untersuchen lassen und die Ergebnisse der Krankenkasse melden (§ 167 SGB IX)."], "richtig": 0, "erklaerung": "Sie müssen frühzeitig Maßnahmen zur Verhinderung von Kündigungen ergreifen (§ 167 SGB IX).", "schwierigkeit": "mittel"}, {"id": 924, "gesetz": "SGB IX", "frage": "#0924 Was ist eine stufenweise Wiedereingliederung?", "antworten": ["Die Befreiung von der Arbeitspflicht bei vollem Gehalt für bis zu zwei Jahre (§ 44 SGB IX).", "Die Ersetzung des Krankengeldes durch eine Erwerbsminderungsrente auf Zeit (§ 43 SGB VI).", "Ein Konzept zur schrittweisen Rückkehr in den Beruf nach
