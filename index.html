hrpreis hinterlegen und dürfen nur auf dem Rücksitz Platz nehmen (§ 21 StVO)."], "richtig": 0, "erklaerung": "Kein Öffnen von Türen während der Fahrt, keine Sachbeschädigung, keine Belästigung anderer Personen (§ 14 BOKraft).", "schwierigkeit": "schwer"}, {"id": 113, "gesetz": "BOKraft", "frage": "#0113 Welche Vorschriften gibt es zur Mitnahme von Gepäck?", "antworten": ["Gepäck ist bis 50 kg je Fahrgast kostenlos, darüber hinaus darf der Fahrer die Beförderung verweigern (§ 51 PBefG).", "Gepäck darf nur im Kofferraum befördert werden; Handgepäck im Innenraum ist untersagt (§ 15 BOKraft).", "Gepäck muss so verstaut werden, dass es keine Fahrgäste gefährdet. Gefährliche Stoffe sind verboten (§ 15 BOKraft)."], "richtig": 2, "erklaerung": "Gepäck muss so verstaut werden, dass es keine Fahrgäste gefährdet. Gefährliche Stoffe sind verboten (§ 15 BOKraft).", "schwierigkeit": "leicht"}, {"id": 114, "gesetz": "BOKraft", "frage": "#0114 Welche Fahrzeuge dürfen im Personenverkehr eingesetzt werden?", "antworten": ["Nur Fahrzeuge mit mindestens vier Türen und einem Hubraum von mehr als 1.600 ccm (§ 17 BOKraft).", "Fahrzeuge mit mindestens zwei Achsen und vier Rädern, die den gesetzlichen Vorschriften entsprechen (§ 17 BOKraft).", "Alle zugelassenen Fahrzeuge einschließlich Motorräder und Anhängergespanne, sofern sie eine Hauptuntersuchung haben (§ 16 StVZO)."], "richtig": 1, "erklaerung": "Fahrzeuge mit mindestens zwei Achsen und vier Rädern, die den gesetzlichen Vorschriften entsprechen (§ 17 BOKraft).", "schwierigkeit": "mittel"}, {"id": 115, "gesetz": "BOKraft", "frage": "#0115 Welche Sicherheitsausrüstung müssen Fahrzeuge haben?", "antworten": ["Ein Notfallhammer, eine Wärmedecke und Schneeketten sind das ganze Jahr über in jedem Fahrzeug vorgeschrieben (§ 18 BOKraft).", "Feuerlöscher und Verbandkasten in jedem Taxi; ein Warndreieck ist nur bei Fahrten außerorts vorgeschrieben (§ 35g StVZO).", "Erste-Hilfe-Material (§ 35h StVZO), Warndreieck und Warnweste (§ 53a StVZO); je nach Straßen- und Witterungsverhältnissen Winterreifen, Schneeketten u. a. (§ 18 BOKraft). Ein Feuerlöscher ist nur in Kraftomnibussen Pflicht (§ 35g StVZO)."], "richtig": 2, "erklaerung": "Erste-Hilfe-Material (§ 35h StVZO), Warndreieck und Warnweste (§ 53a StVZO); je nach Straßen- und Witterungsverhältnissen Winterreifen, Schneeketten u. a. (§ 18 BOKraft). Ein Feuerlöscher ist nur in Kraftomnibussen Pflicht (§ 35g StVZO).", "schwierigkeit": "schwer"}, {"id": 116, "gesetz": "BOKraft", "frage": "#0116 Welche Sicherheitsvorkehrungen müssen Taxen und Mietwagen haben?", "antworten": ["Mindestens zwei Türen auf der rechten Fahrzeugseite und eine Alarmanlage (§ 25 BOKraft).", "Vier Türen, Sicherheitsglas rundum und ein Feuerlöscher (§ 24 BOKraft).", "Eine Trennwand zum Fahrgastraum und eine Überwachungskamera im Innenraum (§ 26 BOKraft)."], "richtig": 0, "erklaerung": "Mindestens zwei Türen auf der rechten Fahrzeugseite und eine Alarmanlage (§ 25 BOKraft).", "schwierigkeit": "leicht"}, {"id": 117, "gesetz": "BOKraft", "frage": "#0117 Wie müssen Taxen gekennzeichnet sein?", "antworten": ["Weiß lackiertes Fahrzeug mit einem blauen Streifen an der Seite und dem Stadtwappen auf der Tür (§ 43 BOKraft).", "Gelbe Lackierung (RAL 1021) und ein fest verbautes, unbeleuchtetes Dachschild mit Aufschrift „Taxi“ (§ 27 BOKraft).", "Hell-elfenbeinfarbene Lackierung (RAL 1015) und ein beleuchtbares Taxischild (§ 26 BOKraft)."], "richtig": 2, "erklaerung": "Hell-elfenbeinfarbene Lackierung (RAL 1015) und ein beleuchtbares Taxischild (§ 26 BOKraft).", "schwierigkeit": "mittel"}, {"id": 118, "gesetz": "BOKraft", "frage": "#0118 Welche Kennzeichnungspflichten gelten für Mietwagen?", "antworten": ["Mietwagen müssen ein Taxischild auf dem Dach haben, das aber abgedeckt werden kann (§ 26 BOKraft).", "Mietwagen müssen ein blaues Ordnungsnummernschild an der Heckscheibe haben (§ 27 BOKraft).", "Mietwagen müssen nur ein Firmenschild an der Fahrertür haben; ein Ordnungsnummernschild ist nicht erlaubt (§ 28 BOKraft)."], "richtig": 1, "erklaerung": "Mietwagen müssen ein blaues Ordnungsnummernschild an der Heckscheibe haben (§ 27 BOKraft).", "schwierigkeit": "schwer"}, {"id": 119, "gesetz": "BOKraft", "frage": "#0119 Müssen Mietwagen mit einem Fahrpreisanzeiger ausgestattet sein?", "antworten": ["Nein, sie benötigen stattdessen einen leicht ablesbaren Wegstreckenzähler oder ein konformitätsbewertetes softwarebasiertes System; das Eichrecht gilt (§ 30 BOKraft).", "Ja, aber nur bei Fahrten außerhalb des Ortsbereichs; innerorts genügt ein schriftlicher Festpreis (§ 49 Abs. 4 PBefG).", "Ja, sie müssen wie Taxen einen geeichten Fahrpreisanzeiger haben, damit der Taxitarif abgerechnet werden kann (§ 28 BOKraft)."], "richtig": 0, "erklaerung": "Nein, sie benötigen stattdessen einen leicht ablesbaren Wegstreckenzähler oder ein konformitätsbewertetes softwarebasiertes System; das Eichrecht gilt (§ 30 BOKraft).", "schwierigkeit": "leicht"}, {"id": 120, "gesetz": "BOKraft", "frage": "#0120 Wie müssen Fahrpreise im Taxenverkehr berechnet werden?", "antworten": ["Nach dem Fahrpreisanzeiger oder nach dem im Rahmen des Bestellvorgangs vereinbarten Entgelt; bei Zielen außerhalb des Pflichtfahrbereichs ist das Entgelt vorher frei zu vereinbaren (§ 37 BOKraft).", "Immer nach dem Taxitarif, auch bei Zielen weit außerhalb des Pflichtfahrbereichs; abweichende Vereinbarungen sind verboten (§ 51 PBefG).", "Nach der gefahrenen Strecke auf Grundlage des Kilometerzählers des Fahrzeugs; ein Festpreis darf nie vereinbart werden (§ 28 BOKraft)."], "richtig": 0, "erklaerung": "Nach dem Fahrpreisanzeiger oder nach dem im Rahmen des Bestellvorgangs vereinbarten Entgelt; bei Zielen außerhalb des Pflichtfahrbereichs ist das Entgelt vorher frei zu vereinbaren (§ 37 BOKraft).", "schwierigkeit": "mittel"}, {"id": 121, "gesetz": "BOKraft", "frage": "#0121 Wann darf ein Taxi sein Taxischild beleuchtet haben?", "antworten": ["Das Taxischild muss immer beleuchtet sein, auch während der Fahrt mit Fahrgästen, damit das Taxi erkennbar bleibt (§ 26 BOKraft).", "Im Pflichtfahrbereich muss das Taxischild beleuchtet sein, wenn keine Fahrtaufträge ausgeführt werden (außer am Taxenstand); während eines Fahrtauftrags muss die Beleuchtung ausgeschaltet sein (§ 39 BOKraft).", "Das Taxischild darf nur nachts und nur am Taxenstand beleuchtet sein; tagsüber ist die Beleuchtung verboten (§ 27 BOKraft)."], "richtig": 1, "erklaerung": "Im Pflichtfahrbereich muss das Taxischild beleuchtet sein, wenn keine Fahrtaufträge ausgeführt werden (außer am Taxenstand); während eines Fahrtauftrags muss die Beleuchtung ausgeschaltet sein (§ 39 BOKraft).", "schwierigkeit": "schwer"}, {"id": 122, "gesetz": "BOKraft", "frage": "#0122 Wie oft müssen Taxen und Mietwagen technisch überprüft werden?", "antworten": ["Alle zwei Jahre zur Hauptuntersuchung, zusätzlich jährlich zur Taxameter-Eichung durch das Kraftfahrt-Bundesamt (§ 29 StVZO).", "Einmal jährlich zur Hauptuntersuchung (§ 29 StVZO i. V. m. Anlage VIII), bei der auch die BOKraft-Vorschriften geprüft werden (§ 41 BOKraft); vor dem ersten Einsatz ist eine außerordentliche HU nötig (§ 42 BOKraft).", "Alle sechs Monate zur Sicherheitsprüfung durch die Genehmigungsbehörde (§ 41 BOKraft)."], "richtig": 1, "erklaerung": "Einmal jährlich zur Hauptuntersuchung (§ 29 StVZO i. V. m. Anlage VIII), bei der auch die BOKraft-Vorschriften geprüft werden (§ 41 BOKraft); vor dem ersten Einsatz ist eine außerordentliche HU nötig (§ 42 BOKraft).", "schwierigkeit": "leicht"}, {"id": 123, "gesetz": "BOKraft", "frage": "#0123 Welche Verstöße können als Ordnungswidrigkeiten geahndet werden?", "antworten": ["Nur Verstöße gegen das Tarifrecht; Sicherheits- und Kennzeichnungsverstöße sind lediglich zivilrechtlich zu verfolgen (§ 45 BOKraft).", "Jeder Verstoß ist eine Straftat nach dem Strafgesetzbuch und wird von der Staatsanwaltschaft verfolgt (§ 148 GewO).", "Verstöße gegen Sicherheitsvorschriften, Kennzeichnungspflichten oder Fahrpreisregelungen (§ 45 BOKraft)."], "richtig": 2, "erklaerung": "Verstöße gegen Sicherheitsvorschriften, Kennzeichnungspflichten oder Fahrpreisregelungen (§ 45 BOKraft).", "schwierigkeit": "mittel"}, {"id": 124, "gesetz": "BOKraft", "frage": "#0124 Was passiert, wenn eine Alarmanlage im Taxi ausgelöst wird?", "antworten": ["Die Hupe ertönt in Intervallen, Scheinwerfer und hintere Fahrtrichtungsanzeiger blinken; zusätzlich kann das Taxischild blinken (§ 25 Abs. 2 BOKraft).", "Das Innenlicht schaltet sich dauerhaft ein und das Taxischild leuchtet in rotem Licht (§ 27 BOKraft).", "Das Fahrzeug wird automatisch verriegelt und der Motor abgestellt; eine Nachricht geht an die Polizei (§ 26 BOKraft)."], "richtig": 0, "erklaerung": "Die Hupe ertönt in Intervallen, Scheinwerfer und hintere Fahrtrichtungsanzeiger blinken; zusätzlich kann das Taxischild blinken (§ 25 Abs. 2 BOKraft).", "schwierigkeit": "schwer"}, {"id": 125, "gesetz": "BOKraft", "frage": "#0125 Dürfen Mietwagen an Taxiständen warten?", "antworten": ["Ja, Mietwagen dürfen am Taxistand warten, wenn kein Taxi verfügbar ist und eine Vorbestellung vorliegt (§ 49 Abs. 4 PBefG).", "Ja, aber nur wenn sie sich an der letzten Stelle des Standes einreihen und 30 Minuten nicht überschreiten (§ 47 PBefG).", "Nein, an Taxenständen dürfen nur bereitgehaltene Taxen halten (Zeichen 229 StVO); Mietwagen dürfen auch sonst nicht so bereitgehalten werden, dass Verwechslungsgefahr mit Taxen besteht (§ 49 Abs. 4 PBefG)."], "richtig": 2, "erklaerung": "Nein, an Taxenständen dürfen nur bereitgehaltene Taxen halten (Zeichen 229 StVO); Mietwagen dürfen auch sonst nicht so bereitgehalten werden, dass Verwechslungsgefahr mit Taxen besteht (§ 49 Abs. 4 PBefG).", "schwierigkeit": "leicht"}, {"id": 126, "gesetz": "BOKraft", "frage": "#0126 Darf in Taxen oder Mietwagen geraucht werden?", "antworten": ["In Taxen und Mietwagen ist Rauchen grundsätzlich erlaubt, wenn der Fahrer und alle Fahrgäste einverstanden sind (§ 14 BOKraft).", "In Taxen gilt ein gesetzliches Rauchverbot (§ 1 Abs. 1 Nr. 2, § 2 Nr. 2 BNichtrSchG); für Mietwagen gibt es kein gesetzliches Verbot, der Unternehmer kann es aber anordnen. Die BOKraft selbst enthält kein Rauchverbot.", "In beiden Fahrzeugarten ist Rauchen nur nach Ausstellung einer behördlichen Sondererlaubnis erlaubt (§ 14 BOKraft)."], "richtig": 1, "erklaerung": "In Taxen gilt ein gesetzliches Rauchverbot (§ 1 Abs. 1 Nr. 2, § 2 Nr. 2 BNichtrSchG); für Mietwagen gibt es kein gesetzliches Verbot, der Unternehmer kann es aber anordnen. Die BOKraft selbst enthält kein Rauchverbot.", "schwierigkeit": "mittel"}, {"id": 127, "gesetz": "BOKraft", "frage": "#0127 Welche Behörde ist für die Kontrolle der BOKraft-Vorschriften zuständig?", "antworten": ["Das Kraftfahrt-Bundesamt in Flensburg durch regelmäßige Betriebsprüfungen (§ 20 StVZO).", "Die Industrie- und Handelskammer, die Fahrzeuge vor Ort kontrolliert und Bußgelder verhängt (§ 5 PBZugV).", "Die Genehmigungsbehörde als Aufsichtsbehörde (§ 54 Abs. 1 PBefG); sie kann u. a. Bücher einsehen und Auskünfte verlangen (§ 54a PBefG)."], "richtig": 2, "erklaerung": "Die Genehmigungsbehörde als Aufsichtsbehörde (§ 54 Abs. 1 PBefG); sie kann u. a. Bücher einsehen und Auskünfte verlangen (§ 54a PBefG).", "schwierigkeit": "schwer"}, {"id": 128, "gesetz": "BOKraft", "frage": "#0128 Welche Bedeutung hat die BOKraft für die Sicherheit im Personenverkehr?", "antworten": ["Sie legt die Fahrpreise im Taxiverkehr fest und verhindert, dass Fahrgäste zu viel bezahlen.", "Sie sorgt dafür, dass nur Unternehmer mit abgeschlossener Ausbildung zum Verkehrsfachwirt tätig sein dürfen, um die Qualität zu sichern.", "Sie stellt sicher, dass nur sichere und ordnungsgemäße Fahrzeuge und Betriebe am Straßenpersonenverkehr teilnehmen."], "richtig": 2, "erklaerung": "Sie stellt sicher, dass nur sichere und ordnungsgemäße Fahrzeuge und Betriebe am Straßenpersonenverkehr teilnehmen.", "schwierigkeit": "leicht"}, {"id": 129, "gesetz": "BOKraft", "frage": "#0129 Gilt die BOKraft auch für Mietwagen mit Chauffeurdiensten?", "antworten": ["Ja, aber nur, wenn die Fahrzeuge mindestens neun Sitzplätze haben (§ 1 Abs. 2 BOKraft).", "Ja, sofern sie gewerblich betrieben werden (§ 1 BOKraft).", "Nein, Chauffeurdienste fallen unter das Gewerbeordnungsrecht und sind von der BOKraft ausgenommen (§ 1 BOKraft)."], "richtig": 1, "erklaerung": "Ja, sofern sie gewerblich betrieben werden (§ 1 BOKraft).", "schwierigkeit": "mittel"}, {"id": 130, "gesetz": "BOKraft", "frage": "#0130 Was ist das Hauptziel der BOKraft?", "antworten": ["Die Sicherung kommunaler Einnahmen durch eine pauschale Abgabe je Fahrzeug an die Stadt (§ 41 BOKraft).", "Ein sicherer und ordnungsgemäßer Betrieb, der dem Vertrauen der Fahrgäste in eine sichere und ordnungsgemäße Beförderung gerecht wird (§ 2 BOKraft).", "Der Schutz der Wettbewerber, indem Taxiunternehmen untereinander gleiche Fahrpreise einhalten müssen (§ 51 BOKraft)."], "richtig": 1, "erklaerung": "Ein sicherer und ordnungsgemäßer Betrieb, der dem Vertrauen der Fahrgäste in eine sichere und ordnungsgemäße Beförderung gerecht wird (§ 2 BOKraft).", "schwierigkeit": "schwer"}, {"id": 151, "gesetz": "GewO", "frage": "#0151 Was ist der Grundsatz der Gewerbefreiheit?", "antworten": ["Gewerbetreibende müssen sich grundsätzlich vor Aufnahme der Tätigkeit in das Handelsregister eintragen lassen, sonst ist die Ausübung verboten (§ 29 GewO).", "Jeder kann ein Gewerbe betreiben, soweit keine gesetzlichen Beschränkungen bestehen (§ 1 GewO).", "Jeder darf ein Gewerbe nur betreiben, wenn die Industrie- und Handelskammer die Aufnahme zuvor förmlich genehmigt hat (§ 14 GewO)."], "richtig": 1, "erklaerung": "Jeder kann ein Gewerbe betreiben, soweit keine gesetzlichen Beschränkungen bestehen (§ 1 GewO).", "schwierigkeit": "leicht"}, {"id": 152, "gesetz": "GewO", "frage": "#0152 Wann muss ein Gewerbe angemeldet werden?", "antworten": ["Erst nach der ersten Steuererklärung, sobald der Gewinn 24.500 € übersteigt, beim Finanzamt (§ 14 Abs. 3 GewO).", "Spätestens innerhalb von drei Monaten nach Beginn des Betriebs bei der Industrie- und Handelskammer (§ 14 Abs. 1 GewO).", "Gleichzeitig mit dem Beginn des selbständigen Betriebs bei der zuständigen Behörde, in der Regel dem Gewerbeamt (§ 14 Abs. 1 GewO)."], "richtig": 2, "erklaerung": "Gleichzeitig mit dem Beginn des selbständigen Betriebs bei der zuständigen Behörde, in der Regel dem Gewerbeamt (§ 14 Abs. 1 GewO).", "schwierigkeit": "mittel"}, {"id": 153, "gesetz": "GewO", "frage": "#0153 Welche Arten von Gewerben unterscheidet die GewO?", "antworten": ["Handwerk, Industrie und Handel; Dienstleistungsgewerbe wie Taxi und Mietwagen sind in der GewO nicht erfasst und gelten als freie Berufe.", "Nur Reisegewerbe und Straßenhandel; das Taxi- und Mietwagengewerbe gilt als Reisegewerbe, weil es ortsungebunden ausgeübt wird.", "Stehendes Gewerbe, Reisegewerbe und Marktgewerbe. Das Taxi- und Mietwagengewerbe fällt unter das stehende Gewerbe."], "richtig": 2, "erklaerung": "Stehendes Gewerbe, Reisegewerbe und Marktgewerbe. Das Taxi- und Mietwagengewerbe fällt unter das stehende Gewerbe.", "schwierigkeit": "schwer"}, {"id": 154, "gesetz": "GewO", "frage": "#0154 Was ist der Unterschied zwischen einem Reisegewerbe und einem stehenden Gewerbe?", "antworten": ["Stehendes Gewerbe: Ausübung von einer gewerblichen Niederlassung aus, keine Reisegewerbekarte. Reisegewerbe: Tätigkeit ohne vorhergehende Bestellung außerhalb der Niederlassung oder ohne eine solche; erfordert grundsätzlich eine Reisegewerbekarte (§ 55 GewO).", "Das stehende Gewerbe wird nur im Freien, das Reisegewerbe nur in festen Geschäftsräumen ausgeübt; beide benötigen dieselbe Genehmigung (§ 14 GewO).", "Reisegewerbe ist jede selbstständige Tätigkeit mit mehr als zwei Beschäftigten, stehendes Gewerbe jede Tätigkeit mit weniger Beschäftigten; die Reisegewerbekarte stellt die IHK aus (§ 55 GewO)."], "richtig": 0, "erklaerung": "Stehendes Gewerbe: Ausübung von einer gewerblichen Niederlassung aus, keine Reisegewerbekarte. Reisegewerbe: Tätigkeit ohne vorhergehende Bestellung außerhalb der Niederlassung oder ohne eine solche; erfordert grundsätzlich eine Reisegewerbekarte (§ 55 GewO).", "schwierigkeit": "leicht"}, {"id": 155, "gesetz": "GewO", "frage": "#0155 Welche Behörde ist für Gewerbeanmeldungen zuständig?", "antworten": ["Die Industrie- und Handelskammer am Betriebssitz.", "Das örtliche Gewerbeamt oder die Ordnungsbehörde.", "Das Finanzamt am Wohnsitz des Gewerbetreibenden."], "richtig": 1, "erklaerung": "Das örtliche Gewerbeamt oder die Ordnungsbehörde.", "schwierigkeit": "mittel"}, {"id": 156, "gesetz": "GewO", "frage": "#0156 Warum unterliegt das Taxi- und Mietwagengewerbe der GewO?", "antworten": ["Weil es ein gewerbliches Unternehmen ist, das eine gewerbliche Anmeldung benötigt (§ 14 GewO).", "Weil es ein freier Beruf ist und deshalb nur der Aufsicht der IHK unterliegt, nicht aber der Gewerbeordnung (§ 6 GewO).", "Weil Taxen und Mietwagen als überwachungsbedürftige Gewerbe gelten und deshalb jährlich ein Zuverlässigkeitszeugnis benötigen (§ 38 GewO)."], "richtig": 0, "erklaerung": "Weil es ein gewerbliches Unternehmen ist, das eine gewerbliche Anmeldung benötigt (§ 14 GewO).", "schwierigkeit": "schwer"}, {"id": 157, "gesetz": "GewO", "frage": "#0157 Welche gewerberechtlichen Pflichten hat ein Taxi- oder Mietwagenunternehmen?", "antworten": ["Pflicht zur Anmeldung beim Ordnungsamt vor jeder einzelnen Fahrt und Führung eines Gewerbetagebuchs.", "Eintragung im Handelsregister, jährliche Verlängerung der Gewerbeerlaubnis und Mitgliedschaft in der Handwerkskammer.", "Gewerbeanmeldung, Einhaltung der Vorschriften der GewO und der Betriebspflichten."], "richtig": 2, "erklaerung": "Gewerbeanmeldung, Einhaltung der Vorschriften der GewO und der Betriebspflichten.", "schwierigkeit": "leicht"}, {"id": 158, "gesetz": "GewO", "frage": "#0158 Welche zusätzlichen Genehmigungen braucht ein Taxi- oder Mietwagenbetrieb?", "antworten": ["Keine; die Gewerbeanmeldung genügt, und eine zusätzliche Genehmigung nach dem PBefG ist für Taxen und Mietwagen nicht nötig (§ 14 GewO).", "Neben der Gewerbeanzeige (§ 14 GewO) eine Genehmigung nach dem Personenbeförderungsgesetz für den Taxen- bzw. Mietwagenverkehr (§§ 2, 47, 49 PBefG).", "Neben der Gewerbeanzeige (§ 14 GewO) eine Erlaubnis der Handwerkskammer und eine Sondergenehmigung des Kraftfahrt-Bundesamts (§ 20 StVZO)."], "richtig": 1, "erklaerung": "Neben der Gewerbeanzeige (§ 14 GewO) eine Genehmigung nach dem Personenbeförderungsgesetz für den Taxen- bzw. Mietwagenverkehr (§§ 2, 47, 49 PBefG).", "schwierigkeit": "mittel"}, {"id": 159, "gesetz": "GewO", "frage": "#0159 Was passiert, wenn ein Taxi- oder Mietwagenbetrieb ohne Gewerbeanmeldung betrieben wird?", "antworten": ["Es passiert nichts, solange die Anmeldung innerhalb eines Jahres nachgeholt wird; ein Bußgeld ist ausgeschlossen (§ 14 Abs. 1 GewO).", "Es droht eine Freiheitsstrafe bis zu einem Jahr; die Genehmigung nach dem PBefG erlischt automatisch (§ 148 GewO).", "Ordnungswidrigkeit mit Geldbuße bis zu 1.000 € (§ 146 Abs. 2 Nr. 2, Abs. 3 GewO); eine Gewerbeuntersagung setzt dagegen Unzuverlässigkeit voraus (§ 35 GewO)."], "richtig": 2, "erklaerung": "Ordnungswidrigkeit mit Geldbuße bis zu 1.000 € (§ 146 Abs. 2 Nr. 2, Abs. 3 GewO); eine Gewerbeuntersagung setzt dagegen Unzuverlässigkeit voraus (§ 35 GewO).", "schwierigkeit": "schwer"}, {"id": 160, "gesetz": "GewO", "frage": "#0160 Was bedeutet „überwachungsbedürftiges Gewerbe“ und betrifft es Taxi- und Mietwagenbetriebe?", "antworten": ["Gemeint sind Gewerbe, die nur mit Reisegewerbekarte betrieben werden dürfen; Taxi- und Mietwagenbetriebe gehören dazu (§ 55 GewO).", "Überwachungsbedürftige Gewerbe unterliegen besonderen Kontrollen (§ 38 GewO). Das Taxi- und Mietwagengewerbe ist kein überwachungsbedürftiges Gewerbe nach § 38 GewO, benötigt aber eine Genehmigung nach PBefG.", "Überwachungsbedürftige Gewerbe sind Gewerbe mit besonders hohem Umsatz; Taxi und Mietwagen gehören dazu und werden jährlich geprüft (§ 38 GewO)."], "richtig": 1, "erklaerung": "Überwachungsbedürftige Gewerbe unterliegen besonderen Kontrollen (§ 38 GewO). Das Taxi- und Mietwagengewerbe ist kein überwachungsbedürftiges Gewerbe nach § 38 GewO, benötigt aber eine Genehmigung nach PBefG.", "schwierigkeit": "leicht"}, {"id": 161, "gesetz": "GewO", "frage": "#0161 Wann kann eine Gewerbeuntersagung erfolgen?", "antworten": ["Wenn die Industrie- und Handelskammer die Mitgliedschaft kündigt und der Unternehmer keine Fachkundeprüfung bestanden hat (§ 14 GewO).", "Wenn der Gewerbetreibende seine Steuern nicht pünktlich zahlt oder einmalig eine Ordnungswidrigkeit begangen hat (§ 146 GewO).", "Wenn der Gewerbetreibende als unzuverlässig gilt (§ 35 GewO)."], "richtig": 2, "erklaerung": "Wenn der Gewerbetreibende als unzuverlässig gilt (§ 35 GewO).", "schwierigkeit": "mittel"}, {"id": 162, "gesetz": "GewO", "frage": "#0162 Welche Auswirkungen hat eine Gewerbeuntersagung?", "antworten": ["Der Unternehmer muss das Gewerbe an einen Dritten verkaufen; Zuwiderhandlungen werden ausschließlich zivilrechtlich geahndet (§ 35 Abs. 7 GewO).", "Der Unternehmer darf das Gewerbe nicht weiterführen; Zuwiderhandlungen sind Ordnungswidrigkeiten (§ 146 Abs. 1 Nr. 1 GewO), bei beharrlicher Wiederholung oder Gefährdung Straftaten (§ 148 GewO).", "Das Gewerbe darf zunächst für ein Jahr weitergeführt werden; erst danach tritt das Verbot in Kraft, und Verstöße bleiben folgenlos (§ 35 GewO)."], "richtig": 1, "erklaerung": "Der Unternehmer darf das Gewerbe nicht weiterführen; Zuwiderhandlungen sind Ordnungswidrigkeiten (§ 146 Abs. 1 Nr. 1 GewO), bei beharrlicher Wiederholung oder Gefährdung Straftaten (§ 148 GewO).", "schwierigkeit": "schwer"}, {"id": 163, "gesetz": "GewO", "frage": "#0163 Muss eine Verlegung des Betriebssitzes gemeldet werden?", "antworten": ["Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO).", "Nein, nur die Verlegung in ein anderes Bundesland muss beim Finanzamt gemeldet werden (§ 14 GewO).", "Ja, aber nur bei der Industrie- und Handelskammer, und zwar innerhalb eines Jahres nach dem Umzug (§ 14 GewO)."], "richtig": 0, "erklaerung": "Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO).", "schwierigkeit": "leicht"}, {"id": 164, "gesetz": "GewO", "frage": "#0164 Wann muss ein Gewerbe abgemeldet werden?", "antworten": ["Erst nach Ablauf eines Jahres ohne Umsatz, und zwar durch die Industrie- und Handelskammer (§ 14 GewO).", "Bei vollständiger Aufgabe der Tätigkeit oder bei Geschäftsaufgabe (§ 14 GewO).", "Nur wenn Verluste anfallen; bei Gewinnen besteht eine Pflicht zur Weiterführung des Gewerbes (§ 14 GewO)."], "richtig": 1, "erklaerung": "Bei vollständiger Aufgabe der Tätigkeit oder bei Geschäftsaufgabe (§ 14 GewO).", "schwierigkeit": "mittel"}, {"id": 165, "gesetz": "GewO", "frage": "#0165 Welche steuerlichen Pflichten entstehen durch eine Gewerbeanmeldung?", "antworten": ["Die Pflicht zur Zahlung eines festen Jahresbeitrags an die Industrie- und Handelskammer anstelle von Steuern.", "Keine; für Gewerbetreibende ergeben sich erst nach drei Jahren steuerliche Pflichten, die zuvor ruhen.", "Anmeldung beim Finanzamt, Abgabe von Steuererklärungen und ggf. Gewerbesteuerzahlung."], "richtig": 2, "erklaerung": "Anmeldung beim Finanzamt, Abgabe von Steuererklärungen und ggf. Gewerbesteuerzahlung.", "schwierigkeit": "schwer"}, {"id": 166, "gesetz": "GewO", "frage": "#0166 Welche Folgen hat eine Insolvenz für ein Gewerbe?", "antworten": ["Der Unternehmer muss die Gewerbeanmeldung innerhalb von 14 Tagen widerrufen und das Fahrzeug an die Insolvenzkasse übergeben (§ 14 GewO).", "Mit Eröffnung des Insolvenzverfahrens erlischt das Gewerbe sofort und endgültig; eine Neugründung ist für zehn Jahre verboten (§ 12 GewO).", "Während eines Insolvenzverfahrens darf das Gewerbe nicht wegen Unzuverlässigkeit aufgrund ungeordneter Vermögensverhältnisse untersagt oder eine Zulassung deshalb widerrufen werden (§ 12 GewO); die finanzielle Leistungsfähigkeit nach PBefG bleibt davon unberührt."], "richtig": 2, "erklaerung": "Während eines Insolvenzverfahrens darf das Gewerbe nicht wegen Unzuverlässigkeit aufgrund ungeordneter Vermögensverhältnisse untersagt oder eine Zulassung deshalb widerrufen werden (§ 12 GewO); die finanzielle Leistungsfähigkeit nach PBefG bleibt davon unberührt.", "schwierigkeit": "leicht"}, {"id": 167, "gesetz": "GewO", "frage": "#0167 Brauchen Taxi- oder Mietwagenfahrer eine eigene Gewerbeanmeldung?", "antworten": ["Ja, jeder Fahrer muss sich unabhängig vom Beschäftigungsverhältnis bei der Gewerbeaufsicht registrieren lassen.", "Nein, nur wenn sie als selbstständige Unternehmer tätig sind.", "Nein, aber angestellte Fahrer benötigen stattdessen eine Reisegewerbekarte der Gemeinde."], "richtig": 1, "erklaerung": "Nein, nur wenn sie als selbstständige Unternehmer tätig sind.", "schwierigkeit": "mittel"}, {"id": 168, "gesetz": "GewO", "frage": "#0168 Welche gewerberechtlichen Pflichten hat ein selbstständiger Taxiunternehmer?", "antworten": ["Eintragung in die Handwerksrolle, jährliche Kammerprüfung und Führung eines Gewerbetagebuchs.", "Mitgliedschaft in der Berufsgenossenschaft als einzige Pflicht; Steuern entfallen für Taxiunternehmer.", "Gewerbeanmeldung, Steuerpflichten, Einhaltung der gewerberechtlichen Vorschriften."], "richtig": 2, "erklaerung": "Gewerbeanmeldung, Steuerpflichten, Einhaltung der gewerberechtlichen Vorschriften.", "schwierigkeit": "schwer"}, {"id": 169, "gesetz": "GewO", "frage": "#0169 Kann eine natürliche Person mehrere Gewerbe betreiben?", "antworten": ["Nein, jeder Gewerbetreibende darf nur ein einziges Gewerbe betreiben (§ 3 GewO).", "Ja, aber nur mit Zustimmung der Industrie- und Handelskammer für jedes weitere Gewerbe (§ 14 GewO).", "Ja, mehrere Gewerbeanmeldungen sind möglich (§ 3 GewO)."], "richtig": 2, "erklaerung": "Ja, mehrere Gewerbeanmeldungen sind möglich (§ 3 GewO).", "schwierigkeit": "leicht"}, {"id": 170, "gesetz": "GewO", "frage": "#0170 Welche Rolle spielt die persönliche Zuverlässigkeit für die Gewerbeausübung?", "antworten": ["Die Zuverlässigkeit ist ohne Bedeutung, solange der Gewerbetreibende seine Beiträge zur IHK zahlt (§ 14 GewO).", "Nur vorbestrafte Personen dürfen niemals ein Gewerbe betreiben, auch nicht nach Tilgung im Register (§ 148 GewO).", "Unzuverlässige Personen können vom Gewerbebetrieb ausgeschlossen werden (§ 35 GewO)."], "richtig": 2, "erklaerung": "Unzuverlässige Personen können vom Gewerbebetrieb ausgeschlossen werden (§ 35 GewO).", "schwierigkeit": "mittel"}, {"id": 171, "gesetz": "GewO", "frage": "#0171 Welche Strafen drohen bei Verstößen gegen die GewO?", "antworten": ["Nur eine Verwarnung durch die IHK; weitere Folgen treten erst nach dem fünften Verstoß ein (§ 146 GewO).", "Bußgelder, Gewerbeuntersagung oder strafrechtliche Konsequenzen (§§ 144-148 GewO).", "Ausschließlich Freiheitsstrafen; Bußgelder sind in der Gewerbeordnung nicht vorgesehen (§ 148 GewO)."], "richtig": 1, "erklaerung": "Bußgelder, Gewerbeuntersagung oder strafrechtliche Konsequenzen (§§ 144-148 GewO).", "schwierigkeit": "schwer"}, {"id": 172, "gesetz": "GewO", "frage": "#0172 Welche Verstöße gegen die GewO sind strafbar?", "antworten": ["Strafbar ist nur das Betreiben eines Gewerbes ohne Gewerbeschein; sonstige Verstöße bleiben folgenlos (§ 14 GewO).", "Jede Ordnungswidrigkeit nach der GewO ist zugleich eine Straftat und führt zu einem Eintrag im Führungszeugnis (§ 146 GewO).", "Strafbar ist nur die beharrliche Wiederholung bestimmter Ordnungswidrigkeiten (z. B. Betrieb trotz Untersagung) oder eine dadurch verursachte Gefährdung von Leben, Gesundheit oder bedeutenden Sachwerten (§ 148 GewO); Verstöße gegen die Anzeigepflicht sind Ordnungswidrigkeiten (§ 146 GewO)."], "richtig": 2, "erklaerung": "Strafbar ist nur die beharrliche Wiederholung bestimmter Ordnungswidrigkeiten (z. B. Betrieb trotz Untersagung) oder eine dadurch verursachte Gefährdung von Leben, Gesundheit oder bedeutenden Sachwerten (§ 148 GewO); Verstöße gegen die Anzeigepflicht sind Ordnungswidrigkeiten (§ 146 GewO).", "schwierigkeit": "leicht"}, {"id": 173, "gesetz": "GewO", "frage": "#0173 Wann gilt eine Gewerbeuntersagung als aufgehoben?", "antworten": ["Nicht automatisch: Auf Antrag ist die Ausübung wieder zu gestatten, wenn keine Unzuverlässigkeit mehr vorliegt; vor Ablauf eines Jahres nur aus besonderen Gründen (§ 35 Abs. 6 GewO).", "Automatisch nach Ablauf eines Jahres, ohne dass es eines Antrags bedarf (§ 35 Abs. 6 GewO).", "Erst nach zehn Jahren, und zwar nur durch Beschluss des Verwaltungsgerichts (§ 35 Abs. 5 GewO)."], "richtig": 0, "erklaerung": "Nicht automatisch: Auf Antrag ist die Ausübung wieder zu gestatten, wenn keine Unzuverlässigkeit mehr vorliegt; vor Ablauf eines Jahres nur aus besonderen Gründen (§ 35 Abs. 6 GewO).", "schwierigkeit": "mittel"}, {"id": 174, "gesetz": "GewO", "frage": "#0174 Wie werden Einträge im Gewerbezentralregister gelöscht?", "antworten": ["Sie bleiben ein Leben lang eingetragen und werden erst nach dem Tod des Gewerbetreibenden gelöscht (§ 153 GewO).", "Sie werden jedes Jahr zum 31. Dezember automatisch gelöscht, unabhängig von der Art der Eintragung (§ 149 GewO).", "Nach Ablauf der Tilgungsfrist, je nach Art der Eintragung (§§ 149-153 GewO)."], "richtig": 2, "erklaerung": "Nach Ablauf der Tilgungsfrist, je nach Art der Eintragung (§§ 149-153 GewO).", "schwierigkeit": "schwer"}, {"id": 175, "gesetz": "GewO", "frage": "#0175 Welche Rolle spielt das Gewerbezentralregister für Taxi- und Mietwagenunternehmen?", "antworten": ["Es enthält nur Einträge zu Insolvenzen, nicht aber zu Ordnungswidrigkeiten oder Untersagungen (§ 12 GewO).", "Es enthält Einträge zu gewerberechtlichen Verstößen, die sich auf die Erlaubniserteilung auswirken können (§ 149 GewO).", "Es enthält Einträge zu Verkehrsverstößen und Punkten im Straßenverkehr, die vom Kraftfahrt-Bundesamt geführt werden (§ 28 StVG)."], "richtig": 1, "erklaerung": "Es enthält Einträge zu gewerberechtlichen Verstößen, die sich auf die Erlaubniserteilung auswirken können (§ 149 GewO).", "schwierigkeit": "leicht"}, {"id": 176, "gesetz": "GewO", "frage": "#0176 Darf ein Taxi- oder Mietwagenbetrieb an eine andere Person übertragen werden?", "antworten": ["Ja, die Übertragung der Rechte und Pflichten aus der Genehmigung bedarf der Genehmigung; bei Taxen nur zusammen mit dem ganzen Unternehmen oder wesentlichen Teilen (§ 2 Abs. 2 Nr. 2, Abs. 3 PBefG). Der Erwerber muss sein Gewerbe anzeigen (§ 14 GewO).", "Nein, die Genehmigung ist streng personengebunden und kann unter keinen Umständen übertragen werden (§ 2 PBefG).", "Ja, ohne Genehmigung der Behörde; der Erwerber muss nur den Fahrzeugbrief ummelden (§ 13 StVZO)."], "richtig": 0, "erklaerung": "Ja, die Übertragung der Rechte und Pflichten aus der Genehmigung bedarf der Genehmigung; bei Taxen nur zusammen mit dem ganzen Unternehmen oder wesentlichen Teilen (§ 2 Abs. 2 Nr. 2, Abs. 3 PBefG). Der Erwerber muss sein Gewerbe anzeigen (§ 14 GewO).", "schwierigkeit": "mittel"}, {"id": 177, "gesetz": "GewO", "frage": "#0177 Welche besonderen Anforderungen gibt es für Taxi- und Mietwagenbetriebe bei der Buchführung?", "antworten": ["Neben den allgemeinen Buchführungs- und Aufzeichnungspflichten (§§ 140 ff. AO, § 22 UStG) müssen Taxameter und Wegstreckenzähler mit TSE aufzeichnen (§ 146a AO, KassenSichV); Mietwagenunternehmer müssen Auftragseingänge erfassen und ein Jahr aufbewahren (§ 49 Abs. 4 PBefG).", "Taxi- und Mietwagenunternehmer müssen keine Aufzeichnungen führen, da die Fahrten bereits durch den Taxameter belegt sind (§ 49 Abs. 4 PBefG).", "Neben der allgemeinen Buchführung ist ein Fahrtenbuch mit Angabe aller Fahrgäste zu führen und fünf Jahre bei der IHK zu hinterlegen (§ 146a AO)."], "richtig": 0, "erklaerung": "Neben den allgemeinen Buchführungs- und Aufzeichnungspflichten (§§ 140 ff. AO, § 22 UStG) müssen Taxameter und Wegstreckenzähler mit TSE aufzeichnen (§ 146a AO, KassenSichV); Mietwagenunternehmer müssen Auftragseingänge erfassen und ein Jahr aufbewahren (§ 49 Abs. 4 PBefG).", "schwierigkeit": "schwer"}, {"id": 178, "gesetz": "GewO", "frage": "#0178 Welche Auswirkungen haben gewerberechtliche Verstöße auf eine Betriebserlaubnis?", "antworten": ["Verstöße berühren die Genehmigung nicht; die Gewerbeaufsicht kann nur ein Bußgeld verhängen (§ 146 GewO).", "Bereits der erste Verstoß führt automatisch zur dauerhaften Gewerbeuntersagung nach § 35 GewO und zum Entzug der Fahrerlaubnis (§ 3 StVG).", "Verstöße können die Zuverlässigkeit entfallen lassen; dann ist die PBefG-Genehmigung zu widerrufen (§ 25 PBefG). Eine Gewerbeuntersagung nach § 35 GewO ist insoweit ausgeschlossen (§ 35 Abs. 8 GewO)."], "richtig": 2, "erklaerung": "Verstöße können die Zuverlässigkeit entfallen lassen; dann ist die PBefG-Genehmigung zu widerrufen (§ 25 PBefG). Eine Gewerbeuntersagung nach § 35 GewO ist insoweit ausgeschlossen (§ 35 Abs. 8 GewO).", "schwierigkeit": "leicht"}, {"id": 179, "gesetz": "GewO", "frage": "#0179 Muss ein Mietwagenunternehmen auch eine Gewerbeanmeldung haben?", "antworten": ["Nein, Mietwagenunternehmen sind nur beim Finanzamt, nicht beim Gewerbeamt meldepflichtig (§ 138 AO).", "Nein, die Genehmigung nach dem PBefG ersetzt die Gewerbeanmeldung vollständig (§ 2 PBefG).", "Ja, auch Mietwagenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO)."], "richtig": 2, "erklaerung": "Ja, auch Mietwagenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO).", "schwierigkeit": "mittel"}, {"id": 180, "gesetz": "GewO", "frage": "#0180 Welche gewerberechtlichen Vorschriften gelten für digitale Vermittlungsdienste für Mietwagen?", "antworten": ["Digitale Vermittlungsdienste unterliegen ebenfalls der Gewerbeanmeldung und gewerberechtlichen Kontrolle (§ 14 GewO).", "Vermittler benötigen zusätzlich eine Reisegewerbekarte, weil sie ortsungebunden arbeiten (§ 55 GewO).", "Vermittlungsdienste sind von der Gewerbeordnung ausgenommen, da sie keine Personen selbst befördern (§ 6 GewO)."], "richtig": 0, "erklaerung": "Digitale Vermittlungsdienste unterliegen ebenfalls der Gewerbeanmeldung und gewerberechtlichen Kontrolle (§ 14 GewO).", "schwierigkeit": "schwer"}, {"id": 201, "gesetz": "FeV", "frage": "#0201 Wer benötigt eine Fahrerlaubnis zur Fahrgastbeförderung (FzF)?", "antworten": ["Alle Personen, die gewerblich Lkw im Güterverkehr oder Fahrzeuge mit Anhängern führen (§ 6 FeV).", "Nur Unternehmer, nicht aber angestellte Fahrer, wenn sie Taxen oder Mietwagen betreiben (§ 2 StVG).", "Personen, die Fahrgäste gewerblich in Taxen, Mietwagen oder Krankenkraftwagen befördern (§ 48 FeV). Ausnahme: Fahrer mit Fahrerlaubnis der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV)."], "richtig": 2, "erklaerung": "Personen, die Fahrgäste gewerblich in Taxen, Mietwagen oder Krankenkraftwagen befördern (§ 48 FeV). Ausnahme: Fahrer mit Fahrerlaubnis der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV).", "schwierigkeit": "leicht"}, {"id": 202, "gesetz": "FeV", "frage": "#0202 Welche Voraussetzungen müssen für den Erwerb einer Fahrerlaubnis zur Fahrgastbeförderung erfüllt sein?", "antworten": ["Mindestalter 25 Jahre, Klasse B seit 5 Jahren, ein Eintrag im Gewerbezentralregister und Sehvermögen sowie eine MPU (§ 48 Abs. 5 FeV).", "Mindestalter 21 Jahre (19 bei Beschränkung auf Krankenkraftwagen), Klasse B seit mindestens 2 Jahren, Führungszeugnis und Auskunft aus dem Fahreignungsregister, geistige und körperliche Eignung, Sehvermögen sowie für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV).", "Mindestalter 18 Jahre, Klasse B seit 6 Monaten, polizeiliches Führungszeugnis und eine Ortskundeprüfung bei der IHK (§ 48 Abs. 4 FeV)."], "richtig": 1, "erklaerung": "Mindestalter 21 Jahre (19 bei Beschränkung auf Krankenkraftwagen), Klasse B seit mindestens 2 Jahren, Führungszeugnis und Auskunft aus dem Fahreignungsregister, geistige und körperliche Eignung, Sehvermögen sowie für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV).", "schwierigkeit": "mittel"}, {"id": 203, "gesetz": "FeV", "frage": "#0203 Welche ärztlichen Untersuchungen sind für die Fahrerlaubnis zur Fahrgastbeförderung erforderlich?", "antworten": ["Eine Untersuchung beim Amtsarzt auf Impfstatus und ein Belastungs-EKG, nachzuweisen bei jeder Verlängerung (§ 48 Abs. 6 FeV).", "Eine psychologische Untersuchung bei der DEKRA und ein Drogenscreening, jeweils jährlich zu wiederholen (§ 11 FeV).", "Allgemeine gesundheitliche Untersuchung; Untersuchung des Sehvermögens (§ 48 Abs. 4 FeV, Anlage 5 & 6)."], "richtig": 2, "erklaerung": "Allgemeine gesundheitliche Untersuchung; Untersuchung des Sehvermögens (§ 48 Abs. 4 FeV, Anlage 5 & 6).", "schwierigkeit": "schwer"}, {"id": 204, "gesetz": "FeV", "frage": "#0204 Wie lange ist eine Fahrerlaubnis zur Fahrgastbeförderung gültig?", "antworten": ["Sie gilt unbefristet, solange die allgemeine Fahrerlaubnis besteht, und muss nur bei Verstößen neu beantragt werden (§ 48 Abs. 5 FeV).", "Sie wird für höchstens zwei Jahre erteilt und kann jeweils um ein weiteres Jahr verlängert werden (§ 48 Abs. 6 FeV).", "Sie wird für höchstens fünf Jahre erteilt und auf Antrag jeweils um bis zu fünf Jahre verlängert, wenn Eignung, Sehvermögen und die Gewähr für die besondere Verantwortung erneut nachgewiesen werden (§ 48 Abs. 5 FeV)."], "richtig": 2, "erklaerung": "Sie wird für höchstens fünf Jahre erteilt und auf Antrag jeweils um bis zu fünf Jahre verlängert, wenn Eignung, Sehvermögen und die Gewähr für die besondere Verantwortung erneut nachgewiesen werden (§ 48 Abs. 5 FeV).", "schwierigkeit": "leicht"}, {"id": 205, "gesetz": "FeV", "frage": "#0205 Welche Strafen drohen, wenn jemand ohne Fahrerlaubnis zur Fahrgastbeförderung ein Taxi fährt?", "antworten": ["Geld- oder Freiheitsstrafe bis zu einem Jahr nach dem Strafgesetzbuch und dauerhafte Entziehung der allgemeinen Fahrerlaubnis (§ 21 StVG).", "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt.", "Es droht nur eine mündliche Verwarnung; ein Bußgeld ist ausgeschlossen, solange die allgemeine Fahrerlaubnis besteht (§ 48 FeV)."], "richtig": 1, "erklaerung": "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt.", "schwierigkeit": "mittel"}, {"id": 206, "gesetz": "FeV", "frage": "#0206 Muss eine Fahrerlaubnis zur Fahrgastbeförderung in der Taxe oder dem Mietwagen mitgeführt werden?", "antworten": ["Ja, der Führerschein zur Fahrgastbeförderung ist bei der Fahrgastbeförderung neben dem Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV).", "Nein, es genügt, den Führerschein zur Fahrgastbeförderung zu Hause aufzubewahren und auf Verlangen innerhalb von 24 Stunden vorzuzeigen (§ 4 FeV).", "Nein, er ist nur bei Fahrten außerhalb des Pflichtfahrbereichs mitzuführen; innerhalb gilt der Eintrag im Fahrzeugschein (§ 48 Abs. 3 FeV)."], "richtig": 0, "erklaerung": "Ja, der Führerschein zur Fahrgastbeförderung ist bei der Fahrgastbeförderung neben dem Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV).", "schwierigkeit": "schwer"}, {"id": 207, "gesetz": "FeV", "frage": "#0207 Welche gesundheitlichen Anforderungen müssen Fahrer im Taxi- und Mietwagenverkehr erfüllen?", "antworten": ["Sie dürfen keine Erkrankungen oder Einschränkungen haben, die ihre Fahreignung beeinträchtigen (z. B. schwere Seh- oder Hörprobleme, Epilepsie) (§ 11 FeV).", "Fahrer müssen eine Sporttauglichkeitsprüfung bestehen und dürfen ein Gewicht von 100 kg nicht überschreiten (§ 48 Abs. 4 FeV).", "Es ist ein jährlicher Gesundheitsnachweis durch den Hausarzt erforderlich, und Brillenträger sind von der Fahrgastbeförderung ausgeschlossen (§ 48 FeV)."], "richtig": 0, "erklaerung": "Sie dürfen keine Erkrankungen oder Einschränkungen haben, die ihre Fahreignung beeinträchtigen (z. B. schwere Seh- oder Hörprobleme, Epilepsie) (§ 11 FeV).", "schwierigkeit": "leicht"}, {"id": 208, "gesetz": "FeV", "frage": "#0208 Welche Bedeutung hat das Führungszeugnis für die Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Es dient ausschließlich dazu, das Mindestalter des Bewerbers zu belegen; Vorstrafen spielen keine Rolle (§ 48 Abs. 1 FeV).", "Es muss nur beim ersten Antrag vorgelegt werden und ersetzt die Auskunft aus dem Fahreignungsregister (§ 28 FeV).", "Mit einem Führungszeugnis (§ 30 Abs. 5 BZRG) und einer Auskunft aus dem Fahreignungsregister muss der Bewerber nachweisen, dass er die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung bietet (§ 48 Abs. 4 Nr. 2a FeV)."], "richtig": 2, "erklaerung": "Mit einem Führungszeugnis (§ 30 Abs. 5 BZRG) und einer Auskunft aus dem Fahreignungsregister muss der Bewerber nachweisen, dass er die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung bietet (§ 48 Abs. 4 Nr. 2a FeV).", "schwierigkeit": "mittel"}, {"id": 209, "gesetz": "FeV", "frage": "#0209 Wann kann eine Fahrerlaubnis zur Fahrgastbeförderung entzogen werden?", "antworten": ["Nur wenn der Fahrer das 70. Lebensjahr vollendet hat, unabhängig von seiner gesundheitlichen Eignung (§ 48 Abs. 5 FeV).", "Wenn der Fahrer mehr als drei Beschwerden von Fahrgästen erhalten hat; das Erlöschen mit der allgemeinen Fahrerlaubnis tritt nicht ein (§ 48 Abs. 8 FeV).", "Wenn eine Voraussetzung nach § 48 Abs. 4 FeV wegfällt, z. B. körperliche/geistige Eignung oder die Gewähr für die besondere Verantwortung; sie erlischt auch mit der Entziehung der allgemeinen Fahrerlaubnis (§ 48 Abs. 9 FeV)."], "richtig": 2, "erklaerung": "Wenn eine Voraussetzung nach § 48 Abs. 4 FeV wegfällt, z. B. körperliche/geistige Eignung oder die Gewähr für die besondere Verantwortung; sie erlischt auch mit der Entziehung der allgemeinen Fahrerlaubnis (§ 48 Abs. 9 FeV).", "schwierigkeit": "schwer"}, {"id": 210, "gesetz": "FeV", "frage": "#0210 Welche Fahrerlaubnisklasse ist für das Führen eines Taxis erforderlich?", "antworten": ["Die Klasse C1 mit einer zusätzlichen Taxi-Zulassung der Genehmigungsbehörde (§ 6 FeV).", "Die Klasse B mit einer gültigen Fahrerlaubnis zur Fahrgastbeförderung (FzF) (§ 48 FeV).", "Die Klasse D1, da Taxen mehr als acht Fahrgäste befördern können (§ 6 FeV)."], "richtig": 1, "erklaerung": "Die Klasse B mit einer gültigen Fahrerlaubnis zur Fahrgastbeförderung (FzF) (§ 48 FeV).", "schwierigkeit": "leicht"}, {"id": 211, "gesetz": "FeV", "frage": "#0211 Welche Fahrerlaubnisklasse ist für das Führen eines Mietwagens erforderlich?", "antworten": ["Klasse D1, da Mietwagen gewerblich Personen befördern (§ 6 FeV).", "Klasse B mit einer Fahrerlaubnis zur Fahrgastbeförderung, falls gewerblich (§ 48 FeV).", "Keine besondere Klasse; ein Führerschein der Klasse AM genügt bei Fahrzeugen bis 45 km/h (§ 6 FeV)."], "richtig": 1, "erklaerung": "Klasse B mit einer Fahrerlaubnis zur Fahrgastbeförderung, falls gewerblich (§ 48 FeV).", "schwierigkeit": "mittel"}, {"id": 212, "gesetz": "FeV", "frage": "#0212 Darf ein Mietwagenfahrer ohne Fahrerlaubnis zur Fahrgastbeförderung arbeiten?", "antworten": ["Ja, nach einem Jahr Berufserfahrung mit Klasse B ist eine FzF nicht mehr erforderlich (§ 48 Abs. 2 FeV).", "Nein, für die gewerbliche Personenbeförderung ist die FzF verpflichtend – außer der Fahrer besitzt die Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV).", "Ja, Mietwagenfahrer benötigen keine FzF, weil sie nur auf Bestellung fahren; die FzF gilt nur für Taxen (§ 48 FeV)."], "richtig": 1, "erklaerung": "Nein, für die gewerbliche Personenbeförderung ist die FzF verpflichtend – außer der Fahrer besitzt die Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV).", "schwierigkeit": "schwer"}, {"id": 213, "gesetz": "FeV", "frage": "#0213 Dürfen Fahrten ohne gültige Fahrerlaubnis zur Fahrgastbeförderung durchgeführt werden?", "antworten": ["Ja, innerhalb des Ortsbereichs und an Taxiständen ist keine FzF erforderlich, nur auf Überlandfahrten (§ 48 FeV).", "Ja, wenn der Fahrer das 40. Lebensjahr vollendet hat und mindestens zehn Jahre Klasse B besitzt (§ 48 Abs. 2 FeV).", "Nein, jede gewerbliche Personenbeförderung erfordert eine gültige FzF – Ausnahme: Inhaber der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV)."], "richtig": 2, "erklaerung": "Nein, jede gewerbliche Personenbeförderung erfordert eine gültige FzF – Ausnahme: Inhaber der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV).", "schwierigkeit": "leicht"}, {"id": 214, "gesetz": "FeV", "frage": "#0214 Welche Sonderregelung gilt für Mietwagen im Gegensatz zu Taxen?", "antworten": ["Mietwagen unterliegen der Betriebspflicht und müssen rund um die Uhr zur Verfügung stehen (§ 21 PBefG).", "Mietwagen dürfen jederzeit an Taxiständen warten, müssen aber ihre Tarife dort aushängen (§ 47 PBefG).", "Mietwagen dürfen nur nach vorheriger Bestellung eingesetzt werden und nicht an Taxiständen warten (§ 49 PBefG)."], "richtig": 2, "erklaerung": "Mietwagen dürfen nur nach vorheriger Bestellung eingesetzt werden und nicht an Taxiständen warten (§ 49 PBefG).", "schwierigkeit": "mittel"}, {"id": 215, "gesetz": "FeV", "frage": "#0215 Was passiert, wenn ein Fahrer seine gesundheitlichen Anforderungen nicht mehr erfüllt?", "antworten": ["Nichts; Gesundheitsmängel müssen nur bei der Erstbeantragung nachgewiesen werden (§ 48 Abs. 4 FeV).", "Die Fahrerlaubnis zur Fahrgastbeförderung wird entzogen bzw. nicht verlängert (§ 48 Abs. 5, 9 FeV).", "Der Fahrer muss die FzF innerhalb von drei Monaten freiwillig zurückgeben, andernfalls droht eine Geldstrafe (§ 48 Abs. 7 FeV)."], "richtig": 1, "erklaerung": "Die Fahrerlaubnis zur Fahrgastbeförderung wird entzogen bzw. nicht verlängert (§ 48 Abs. 5, 9 FeV).", "schwierigkeit": "schwer"}, {"id": 216, "gesetz": "FeV", "frage": "#0216 Wie oft muss eine Fahrerlaubnis zur Fahrgastbeförderung erneuert werden?", "antworten": ["Alle zehn Jahre; ab 70 Jahren zusätzlich ein jährlicher ärztlicher Check beim Amtsarzt (§ 48 Abs. 6 FeV).", "Spätestens alle fünf Jahre; nachzuweisen sind ärztliche Eignung, Sehvermögen sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister, ab 60 Jahren zusätzlich Leistungstests (§ 48 Abs. 5, 6 FeV).", "Alle zwei Jahre; nachzuweisen sind nur Sehvermögen und ein aktuelles Foto, ärztliche Gutachten sind nicht erforderlich (§ 48 Abs. 5 FeV)."], "richtig": 1, "erklaerung": "Spätestens alle fünf Jahre; nachzuweisen sind ärztliche Eignung, Sehvermögen sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister, ab 60 Jahren zusätzlich Leistungstests (§ 48 Abs. 5, 6 FeV).", "schwierigkeit": "leicht"}, {"id": 217, "gesetz": "FeV", "frage": "#0217 Welche Fristen gelten für die Beantragung einer Verlängerung der Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Der Antrag ist frühestens drei Tage vor Ablauf zulässig; verspätete Anträge führen zur Neuprüfung der Fachkunde (§ 48 Abs. 6 FeV).", "Eine gesetzliche Antragsfrist besteht nicht; der Antrag sollte wegen der Bearbeitungszeit rechtzeitig (z. B. drei Monate) vor Ablauf gestellt werden (§ 48 Abs. 5 FeV).", "Der Antrag muss spätestens sechs Monate vor Ablauf gestellt werden, sonst ist eine Verlängerung ausgeschlossen (§ 48 Abs. 5 FeV)."], "richtig": 1, "erklaerung": "Eine gesetzliche Antragsfrist besteht nicht; der Antrag sollte wegen der Bearbeitungszeit rechtzeitig (z. B. drei Monate) vor Ablauf gestellt werden (§ 48 Abs. 5 FeV).", "schwierigkeit": "mittel"}, {"id": 218, "gesetz": "FeV", "frage": "#0218 Welche Nachweise müssen für die Verlängerung einer Fahrerlaubnis zur Fahrgastbeförderung erbracht werden?", "antworten": ["Nur ein neues Passfoto und ein Kontoauszug zum Nachweis der Mitgliedschaft in der IHK (§ 48 Abs. 4 FeV).", "Nachweis der geistigen und körperlichen Eignung, des Sehvermögens sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister; ab 60 Jahren zusätzliche Leistungstests (§ 48 Abs. 5, 6 FeV).", "Ein neues Gutachten über die Ortskunde sowie der Nachweis über 30 Fahrstunden im Taxi pro Jahr (§ 48 Abs. 6 FeV)."], "richtig": 1, "erklaerung": "Nachweis der geistigen und körperlichen Eignung, des Sehvermögens sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister; ab 60 Jahren zusätzliche Leistungstests (§ 48 Abs. 5, 6 FeV).", "schwierigkeit": "schwer"}, {"id": 219, "gesetz": "FeV", "frage": "#0219 Welche Konsequenzen drohen, wenn eine Fahrerlaubnis zur Fahrgastbeförderung abläuft?", "antworten": ["Der Fahrer muss die gesamte Fachkundeprüfung bei der IHK neu ablegen; zudem entfällt die allgemeine Fahrerlaubnis (§ 48 Abs. 4 FeV).", "Ohne gültige Erlaubnis darf nicht mehr befördert werden (Ordnungswidrigkeit). Eine erneute Prüfung ist nicht nötig; die Neuerteilung erfolgt unter den Voraussetzungen der Verlängerung (§ 48 Abs. 6 i. V. m. § 24 Abs. 2 FeV).", "Es gibt keine Folgen; die FzF gilt nach Ablauf stillschweigend für weitere fünf Jahre (§ 48 Abs. 5 FeV)."], "richtig": 1, "erklaerung": "Ohne gültige Erlaubnis darf nicht mehr befördert werden (Ordnungswidrigkeit). Eine erneute Prüfung ist nicht nötig; die Neuerteilung erfolgt unter den Voraussetzungen der Verlängerung (§ 48 Abs. 6 i. V. m. § 24 Abs. 2 FeV).", "schwierigkeit": "leicht"}, {"id": 220, "gesetz": "FeV", "frage": "#0220 Was ist bei einer Neuerteilung der Fahrerlaubnis zur Fahrgastbeförderung zu beachten?", "antworten": ["Der Bewerber muss die theoretische und praktische Fahrprüfung der Klasse B wiederholen (§ 15 FeV).", "Eine Neuerteilung erfolgt auf Antrag ohne weitere Prüfung; Eignungszweifel dürfen nicht berücksichtigt werden (§ 48 Abs. 5 FeV).", "Für die Neuerteilung nach Entziehung oder Verzicht gelten die Vorschriften für die Ersterteilung, also alle Voraussetzungen des § 48 Abs. 4 FeV; ggf. kann eine MPU angeordnet werden (§ 20 FeV)."], "richtig": 2, "erklaerung": "Für die Neuerteilung nach Entziehung oder Verzicht gelten die Vorschriften für die Ersterteilung, also alle Voraussetzungen des § 48 Abs. 4 FeV; ggf. kann eine MPU angeordnet werden (§ 20 FeV).", "schwierigkeit": "mittel"}, {"id": 221, "gesetz": "FeV", "frage": "#0221 Welche Strafen drohen bei Fahren ohne Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Nur eine Verwarnung ohne Verwarnungsgeld; Punkte in Flensburg werden nicht eingetragen (§ 4 StVG).", "Es droht in jedem Fall eine Freiheitsstrafe bis zu einem Jahr nach dem Strafgesetzbuch (§ 21 StVG).", "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); Geld- oder Freiheitsstrafe nach § 21 StVG nur, wenn auch die allgemeine Fahrerlaubnis fehlt."], "richtig": 2, "erklaerung": "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); Geld- oder Freiheitsstrafe nach § 21 StVG nur, wenn auch die allgemeine Fahrerlaubnis fehlt.", "schwierigkeit": "schwer"}, {"id": 222, "gesetz": "FeV", "frage": "#0222 Was passiert, wenn ein Fahrer unter Alkohol- oder Drogeneinfluss erwischt wird?", "antworten": ["Bußgeld und Fahrverbot (§ 24a StVG) bzw. Strafe und Entziehung der Fahrerlaubnis (§§ 316, 69 StGB), ggf. MPU (§§ 13, 14 FeV); im Taxi-/Mietwagendienst ist Alkohol während des Dienstes ohnehin verboten (§ 8 Abs. 3 Nr. 1, Abs. 5 BOKraft).", "Es droht lediglich eine Ermahnung des Unternehmers; Bußgeld und Fahrverbot gelten nur für Berufskraftfahrer im Lkw (§ 8 BOKraft).", "Der Fahrer darf bis zu 0,5 Promille im Dienst haben; Strafe droht erst bei Unfall mit Personenschaden (§ 24a StVG)."], "richtig": 0, "erklaerung": "Bußgeld und Fahrverbot (§ 24a StVG) bzw. Strafe und Entziehung der Fahrerlaubnis (§§ 316, 69 StGB), ggf. MPU (§§ 13, 14 FeV); im Taxi-/Mietwagendienst ist Alkohol während des Dienstes ohnehin verboten (§ 8 Abs. 3 Nr. 1, Abs. 5 BOKraft).", "schwierigkeit": "leicht"}, {"id": 223, "gesetz": "FeV", "frage": "#0223 Welche Konsequenzen drohen bei Verstößen gegen die Auflagen der Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Eine mündliche Verwarnung durch die IHK; die FzF bleibt in jedem Fall erhalten (§ 11 FeV).", "Entzug oder Nichtverlängerung der FzF (§ 46 FeV).", "Eine Geldstrafe nach § 148 GewO und die Einziehung des Fahrzeugs durch die Zulassungsstelle (§ 21 StVG)."], "richtig": 1, "erklaerung": "Entzug oder Nichtverlängerung der FzF (§ 46 FeV).", "schwierigkeit": "mittel"}, {"id": 224, "gesetz": "FeV", "frage": "#0224 Wann muss ein Taxi- oder Mietwagenfahrer eine medizinisch-psychologische Untersuchung (MPU) absolvieren?", "antworten": ["Bei Eignungszweifeln, z. B. Alkohol- oder Drogenproblematik oder erheblichen Verkehrs- bzw. Straftaten (§§ 11, 13, 14 FeV), sowie bei Bedenken an der Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 8 FeV).", "Bei jeder Verlängerung der FzF alle fünf Jahre, unabhängig von Auffälligkeiten (§ 48 Abs. 6 FeV).", "Nur bei Fahrern über 65 Jahren, sofern die Genehmigungsbehörde dies anordnet (§ 48 Abs. 5 FeV)."], "richtig": 0, "erklaerung": "Bei Eignungszweifeln, z. B. Alkohol- oder Drogenproblematik oder erheblichen Verkehrs- bzw. Straftaten (§§ 11, 13, 14 FeV), sowie bei Bedenken an der Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 8 FeV).", "schwierigkeit": "schwer"}, {"id": 225, "gesetz": "FeV", "frage": "#0225 Was geschieht, wenn ein Fahrer wiederholt gegen die Vorschriften des Personenbeförderungsgesetzes (PBefG) verstößt?", "antworten": ["Nach dem dritten Verstoß wird das Fahrzeug eingezogen und der Unternehmer von der IHK ausgeschlossen (§ 25 PBefG).", "Der Fahrer erhält eine Verwarnung der IHK; ein Entzug der FzF ist für Verstöße gegen das PBefG ausgeschlossen (§ 61 PBefG).", "Bestehen dadurch Zweifel an der Gewähr für die besondere Verantwortung, kann die Fahrerlaubnis zur Fahrgastbeförderung entzogen werden (§ 48 Abs. 8, 9 FeV); daneben drohen Bußgelder (§ 61 PBefG, § 45 BOKraft)."], "richtig": 2, "erklaerung": "Bestehen dadurch Zweifel an der Gewähr für die besondere Verantwortung, kann die Fahrerlaubnis zur Fahrgastbeförderung entzogen werden (§ 48 Abs. 8, 9 FeV); daneben drohen Bußgelder (§ 61 PBefG, § 45 BOKraft).", "schwierigkeit": "leicht"}, {"id": 226, "gesetz": "FeV", "frage": "#0226 Welche Sanktionen drohen, wenn ein Taxi- oder Mietwagenunternehmen Fahrer ohne gültige Fahrerlaubnis zur Fahrgastbeförderung beschäftigt?", "antworten": ["Keine; die Verantwortung liegt allein beim Fahrer, der Unternehmer ist nie haftbar (§ 48 FeV).", "Ordnungswidrigkeit des Halters/Unternehmers, der die Beförderung ohne Fahrerlaubnis zur Fahrgastbeförderung anordnet oder zulässt (§ 48 Abs. 7, § 75 Nr. 12 FeV); wiederholte Verstöße gefährden seine Zuverlässigkeit bis zum Widerruf der Genehmigung (§ 25 PBefG).", "Strafbarkeit des Unternehmers mit Freiheitsstrafe bis zu zwei Jahren nach dem StGB sowie sofortige Stilllegung aller Fahrzeuge (§ 21 StVG)."], "richtig": 1, "erklaerung": "Ordnungswidrigkeit des Halters/Unternehmers, der die Beförderung ohne Fahrerlaubnis zur Fahrgastbeförderung anordnet oder zulässt (§ 48 Abs. 7, § 75 Nr. 12 FeV); wiederholte Verstöße gefährden seine Zuverlässigkeit bis zum Widerruf der Genehmigung (§ 25 PBefG).", "schwierigkeit": "mittel"}, {"id": 227, "gesetz": "FeV", "frage": "#0227 Welche Anforderungen gelten an die Ortskunde für Taxifahrer?", "antworten": ["Eine Ortskundeprüfung gibt es nicht mehr; für Taxen, Mietwagen und gebündelten Bedarfsverkehr ist aber ein Fachkundenachweis vorzulegen, z. B. per Bescheinigung einer von der Landesbehörde bestimmten Stelle (§ 48 Abs. 4 Nr. 7 FeV).", "Ortskenntnis wird nur noch bei Fahrern über 60 Jahren geprüft; im Übrigen genügt ein Navigationsgerät (§ 48 Abs. 6 FeV).", "Taxifahrer müssen eine Ortskundeprüfung bei der IHK ablegen und einen Stadtplan im Fahrzeug mitführen (§ 48 Abs. 4 FeV)."], "richtig": 0, "erklaerung": "Eine Ortskundeprüfung gibt es nicht mehr; für Taxen, Mietwagen und gebündelten Bedarfsverkehr ist aber ein Fachkundenachweis vorzulegen, z. B. per Bescheinigung einer von der Landesbehörde bestimmten Stelle (§ 48 Abs. 4 Nr. 7 FeV).", "schwierigkeit": "schwer"}, {"id": 228, "gesetz": "FeV", "frage": "#0228 Welche Fahrzeuge benötigen eine Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Nur Taxis; Mietwagen und Krankenkraftwagen benötigen lediglich die Klasse B (§ 48 Abs. 1 FeV).", "Taxis, Mietwagen und Krankenkraftwagen (§ 48 FeV).", "Alle Fahrzeuge der Klasse B, die entgeltlich Güter befördern (§ 6 FeV)."], "richtig": 1, "erklaerung": "Taxis, Mietwagen und Krankenkraftwagen (§ 48 FeV).", "schwierigkeit": "leicht"}, {"id": 229, "gesetz": "FeV", "frage": "#0229 Wann darf eine Fahrerlaubnis zur Fahrgastbeförderung versagt werden?", "antworten": ["Wenn der Bewerber die deutsche Staatsangehörigkeit nicht besitzt oder weniger als zehn Jahre in Deutschland gelebt hat (§ 7 FeV).", "Wenn der Bewerber keinen eigenen Pkw besitzt und nicht Mitglied der IHK ist (§ 48 Abs. 3 FeV).", "Wenn eine Voraussetzung des § 48 Abs. 4 FeV fehlt, z. B. Mindestalter, gesundheitliche Eignung, Sehvermögen, Fachkunde oder die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 4 FeV)."], "richtig": 2, "erklaerung": "Wenn eine Voraussetzung des § 48 Abs. 4 FeV fehlt, z. B. Mindestalter, gesundheitliche Eignung, Sehvermögen, Fachkunde oder die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 4 FeV).", "schwierigkeit": "mittel"}, {"id": 230, "gesetz": "FeV", "frage": "#0230 Welche Vorschriften gelten für die Mitführung der Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Sie ist im Fahrzeug zu hinterlegen und muss nicht von jedem Fahrer persönlich mitgeführt werden (§ 48 Abs. 3 FeV).", "Sie muss nur bei Fahrten außerhalb der Gemeinde mitgeführt werden; innerhalb des Ortsgebiets genügt der Führerschein (§ 4 FeV).", "Der Führerschein zur Fahrgastbeförderung ist neben dem allgemeinen Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV)."], "richtig": 2, "erklaerung": "Der Führerschein zur Fahrgastbeförderung ist neben dem allgemeinen Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV).", "schwierigkeit": "schwer"}, {"id": 251, "gesetz": "StraßenGesetz", "frage": "#0251 Welche Fahrerlaubnisklasse wird für den Taxi- oder Mietwagenverkehr benötigt?", "antworten": ["Klasse C1 und zusätzlich eine Bescheinigung der IHK über die Ortskunde (§ 2 Abs. 2 StVG).", "Klasse B und zusätzlich die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 1, 3 StVG; § 48 FeV).", "Klasse D1, da Taxis und Mietwagen mehr als vier Personen befördern dürfen (§ 6 FeV)."], "richtig": 1, "erklaerung": "Klasse B und zusätzlich die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 1, 3 StVG; § 48 FeV).", "schwierigkeit": "leicht"}, {"id": 252, "gesetz": "StraßenGesetz", "frage": "#0252 Welche zusätzlichen Voraussetzungen sind für die Fahrgastbeförderung erforderlich?", "antworten": ["Ein Eintrag der Genehmigungsbehörde im Fahrzeugschein und ein Nachweis über 20 Stunden Fahrpraxis im Taxi (§ 3 StVG).", "Die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 3 StVG): u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehvermögen und für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV).", "Der Gewerbeschein und ein Führungszeugnis der IHK sind ausreichend; eine ärztliche Untersuchung entfällt (§ 2 Abs. 4 StVG)."], "richtig": 1, "erklaerung": "Die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 3 StVG): u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehvermögen und für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV).", "schwierigkeit": "mittel"}, {"id": 253, "gesetz": "StraßenGesetz", "frage": "#0253 Wann ist eine Fahrerlaubnis auf Probe erforderlich?", "antworten": ["Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 2 Jahre (§ 2a StVG).", "Bei jedem Fahrzeugwechsel eines Berufskraftfahrers; die Probezeit beträgt 4 Jahre (§ 2a StVG).", "Nur bei Neuerteilung nach Entziehung; die Probezeit beträgt 1 Jahr (§ 4 StVG)."], "richtig": 0, "erklaerung": "Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 2 Jahre (§ 2a StVG).", "schwierigkeit": "schwer"}, {"id": 254, "gesetz": "StraßenGesetz", "frage": "#0254 Welche Faktoren können zur Entziehung der Fahrerlaubnis führen?", "antworten": ["Wiederholte Verstöße gegen Verkehrsvorschriften oder Fahruntüchtigkeit (§ 3 StVG).", "Nur der Besitz eines Fahrzeugs mit Alterswert über 15 Jahren oder Rückstände bei der Kfz-Steuer (§ 5 StVG).", "Mangelnde Ortskenntnis oder Beschwerden von Fahrgästen über den Fahrstil (§ 48 FeV)."], "richtig": 0, "erklaerung": "Wiederholte Verstöße gegen Verkehrsvorschriften oder Fahruntüchtigkeit (§ 3 StVG).", "schwierigkeit": "leicht"}, {"id": 255, "gesetz": "StraßenGesetz", "frage": "#0255 Welche Erlaubnis ist für die gewerbliche Personenbeförderung erforderlich?", "antworten": ["Die Fahrerlaubnis zur Fahrgastbeförderung (umgangssprachlich „P-Schein“), nachgewiesen durch den Führerschein zur Fahrgastbeförderung (§ 2 Abs. 3 StVG, § 48 FeV).", "Die Taxi-Lizenz der IHK, die alle zwei Jahre durch eine Fahrprüfung erneuert wird (§ 5 PBZugV).", "Eine Reisegewerbekarte der Gemeinde, nachgewiesen durch einen Eintrag im Fahrzeugschein (§ 55 GewO)."], "richtig": 0, "erklaerung": "Die Fahrerlaubnis zur Fahrgastbeförderung (umgangssprachlich „P-Schein“), nachgewiesen durch den Führerschein zur Fahrgastbeförderung (§ 2 Abs. 3 StVG, § 48 FeV).", "schwierigkeit": "mittel"}, {"id": 256, "gesetz": "StraßenGesetz", "frage": "#0256 Welche Gesundheitsanforderungen müssen Taxifahrer erfüllen?", "antworten": ["Nachweis über körperliche und geistige Eignung (§ 2 Abs. 4 StVG).", "Nur ein Sehtest alle 10 Jahre; weitere gesundheitliche Nachweise sind nach dem StVG nicht zu erbringen (§ 12 FeV).", "Jährlich ein Gesundheitszeugnis des Hausarztes über Impfungen und Körpergewicht (§ 2 Abs. 6 StVG)."], "richtig": 0, "erklaerung": "Nachweis über körperliche und geistige Eignung (§ 2 Abs. 4 StVG).", "schwierigkeit": "schwer"}, {"id": 257, "gesetz": "StraßenGesetz", "frage": "#0257 Wie oft muss die Eignung für den Personenbeförderungsschein überprüft werden?", "antworten": ["Alle 5 Jahre (§ 48 FeV).", "Jährlich (§ 6 StVG).", "Alle 10 Jahre (§ 24 FeV)."], "richtig": 0, "erklaerung": "Alle 5 Jahre (§ 48 FeV).", "schwierigkeit": "leicht"}, {"id": 258, "gesetz": "StraßenGesetz", "frage": "#0258 Welche Strafe droht bei Fahrgastbeförderung ohne gültige Erlaubnis?", "antworten": ["Freiheitsstrafe bis zu fünf Jahren und lebenslanger Führerscheinentzug (§ 316 StGB).", "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); § 21 StVG greift nur, wenn auch die allgemeine Fahrerlaubnis fehlt.", "Es droht keine Sanktion, wenn die allgemeine Fahrerlaubnis besteht; nur der Unternehmer kann belangt werden (§ 2 StVG)."], "richtig": 1, "erklaerung": "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); § 21 StVG greift nur, wenn auch die allgemeine Fahrerlaubnis fehlt.", "schwierigkeit": "mittel"}, {"id": 259, "gesetz": "StraßenGesetz", "frage": "#0259 Welche Dokumente muss ein Taxifahrer während der Fahrt mitführen?", "antworten": ["Führerschein und Führerschein zur Fahrgastbeförderung (§ 4 Abs. 2, § 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die Tarifvorschriften (§ 10 BOKraft).", "Nur Führerschein und Fahrzeugbrief (Zulassungsbescheinigung Teil II); die Tarifvorschriften liegen bei der Zentrale (§ 4 Abs. 2 FeV).", "Personalausweis, Gewerbeanmeldung, Nachweis der Haftpflichtversicherung und den letzten Prüfbericht der Hauptuntersuchung (§ 14 GewO)."], "richtig": 0, "erklaerung": "Führerschein und Führerschein zur Fahrgastbeförderung (§ 4 Abs. 2, § 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die Tarifvorschriften (§ 10 BOKraft).", "schwierigkeit": "schwer"}, {"id": 260, "gesetz": "StraßenGesetz", "frage": "#0260 Wann muss ein Fahrtenbuch geführt werden?", "antworten": ["Immer bei Taxis und Mietwagen (§ 21 StVO).", "Bei behördlicher Anordnung nach Verkehrsverstößen (§ 31a StVZO).", "Nur bei Fahrten über 100 km (§ 22 StVO)."], "richtig": 1, "erklaerung": "Bei behördlicher Anordnung nach Verkehrsverstößen (§ 31a StVZO).", "schwierigkeit": "leicht"}, {"id": 261, "gesetz": "StraßenGesetz", "frage": "#0261 Wer haftet für Verkehrsverstöße mit einem Taxi oder Mietwagen?", "antworten": ["Allein der Fahrgast, wenn er den Fahrer zur Eile gedrängt hat (§ 18 StVG).", "Für Verkehrsordnungswidrigkeiten grundsätzlich der Fahrer; der Halter trägt bei Halt- und Parkverstößen ggf. die Kosten (§ 25a StVG). Für Unfallschäden haftet der Halter verschuldensunabhängig (§ 7 StVG), der Fahrer bei vermutetem Verschulden (§ 18 StVG).", "Immer der Unternehmer, auch für Geschwindigkeitsverstöße des Fahrers (§ 25a StVG)."], "richtig": 1, "erklaerung": "Für Verkehrsordnungswidrigkeiten grundsätzlich der Fahrer; der Halter trägt bei Halt- und Parkverstößen ggf. die Kosten (§ 25a StVG). Für Unfallschäden haftet der Halter verschuldensunabhängig (§ 7 StVG), der Fahrer bei vermutetem Verschulden (§ 18 StVG).", "schwierigkeit": "mittel"}, {"id": 262, "gesetz": "StraßenGesetz", "frage": "#0262 Welche Behörde ist für die Zulassung eines Taxis zuständig?", "antworten": ["Die Genehmigungsbehörde nach dem PBefG (§ 11 PBefG).", "Die örtliche Zulassungsstelle (§ 1 StVG).", "Das Kraftfahrt-Bundesamt in Flensburg (§ 20 StVZO)."], "richtig": 1, "erklaerung": "Die örtliche Zulassungsstelle (§ 1 StVG).", "schwierigkeit": "schwer"}, {"id": 263, "gesetz": "StraßenGesetz", "frage": "#0263 Welche Farbe müssen Taxis in Deutschland haben?", "antworten": ["Hellgelb (RAL 1018); jedes Bundesland legt die Farbe selbst fest (§ 43 BOKraft).", "Hell-elfenbein (RAL 1015), bundesweit vorgeschrieben (§ 26 Abs. 1 Nr. 1 BOKraft); Ausnahmen können die zuständigen Landesbehörden zulassen (§ 43 BOKraft).", "Weiß, bundesweit vorgeschrieben (§ 26 BOKraft); Ausnahmen sind nicht zulässig."], "richtig": 1, "erklaerung": "Hell-elfenbein (RAL 1015), bundesweit vorgeschrieben (§ 26 Abs. 1 Nr. 1 BOKraft); Ausnahmen können die zuständigen Landesbehörden zulassen (§ 43 BOKraft).", "schwierigkeit": "leicht"}, {"id": 264, "gesetz": "StraßenGesetz", "frage": "#0264 Welche Kennzeichnung muss ein Taxi haben?", "antworten": ["Gelbes Taxischild auf dem Dach, Ordnungsnummer an der Fahrertür sowie ein Wegstreckenzähler (§ 28 BOKraft).", "Blaues Taxischild, Firmenlogo auf beiden Seiten und ein Kennzeichen mit Zusatz „T“ (§ 27 BOKraft).", "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild mit Aufschrift „Taxi“ (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (§ 28 BOKraft)."], "richtig": 2, "erklaerung": "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild mit Aufschrift „Taxi“ (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (§ 28 BOKraft).", "schwierigkeit": "mittel"}, {"id": 265, "gesetz": "StraßenGesetz", "frage": "#0265 Was passiert, wenn ein Taxifahrer ohne Personenbeförderungsschein fährt?", "antworten": ["Es droht kein Bußgeld, nur eine Verwarnung durch die IHK, wenn der Fahrer die allgemeine Fahrerlaubnis besitzt (§ 48 FeV).", "Bußgeld als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt.", "Es droht eine Freiheitsstrafe bis zu einem Jahr, und das Fahrzeug wird eingezogen (§ 21 StVG)."], "richtig": 1, "erklaerung": "Bußgeld als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt.", "schwierigkeit": "schwer"}, {"id": 266, "gesetz": "StraßenGesetz", "frage": "#0266 Welche Strafen drohen bei überhöhter Geschwindigkeit im Taxi?", "antworten": ["Der Entzug der Genehmigung für zwei Jahre bei jedem Verstoß, ohne dass Bußgeld verhängt wird (§ 3 StVG).", "Es droht lediglich eine Verwarnung der Genehmigungsbehörde; Punkte werden nur für Unternehmer eingetragen (§ 25 PBefG).", "Punkte in Flensburg, Bußgeld, ggf. Fahrverbot (§ 4 StVG)."], "richtig": 2, "erklaerung": "Punkte in Flensburg, Bußgeld, ggf. Fahrverbot (§ 4 StVG).", "schwierigkeit": "leicht"}, {"id": 267, "gesetz": "StraßenGesetz", "frage": "#0267 Welche Konsequenzen hat die Beförderung von Fahrgästen ohne gültige Konzession?", "antworten": ["Es droht eine Freiheitsstrafe bis zu einem Jahr; Auswirkungen auf spätere Genehmigungen bestehen nicht (§ 148 GewO).", "Nur ein Verwarnungsgeld bis 55 €; die Genehmigungsbehörde darf keine weiteren Maßnahmen ergreifen (§ 56 OWiG).", "Ordnungswidrigkeit mit Geldbuße bis zu 20.000 € (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); zudem kann das die Zuverlässigkeit für künftige Genehmigungen in Frage stellen (§ 13 Abs. 1 Nr. 2 PBefG)."], "richtig": 2, "erklaerung": "Ordnungswidrigkeit mit Geldbuße bis zu 20.000 € (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); zudem kann das die Zuverlässigkeit für künftige Genehmigungen in Frage stellen (§ 13 Abs. 1 Nr. 2 PBefG).", "schwierigkeit": "mittel"}, {"id": 268, "gesetz": "StraßenGesetz", "frage": "#0268 Wann kann ein Taxiunternehmen seine Konzession verlieren?", "antworten": ["Wenn der Unternehmer das 65. Lebensjahr vollendet oder sein Fahrzeug wechselt; Betriebssitzverlegung ist folgenlos (§ 13 PBefG).", "Nur bei Insolvenz; Verstöße gegen Steuer- oder Sozialrecht führen nicht zum Verlust (§ 2 PBZugV).", "Bei Wegfall von Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachlicher Eignung (Widerrufspflicht) oder bei wiederholten Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG); sie erlischt bei Verlegung des Betriebssitzes in eine andere Gemeinde (§ 26 PBefG)."], "richtig": 2, "erklaerung": "Bei Wegfall von Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachlicher Eignung (Widerrufspflicht) oder bei wiederholten Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG); sie erlischt bei Verlegung des Betriebssitzes in eine andere Gemeinde (§ 26 PBefG).", "schwierigkeit": "schwer"}, {"id": 269, "gesetz": "StraßenGesetz", "frage": "#0269 Welche technischen Anforderungen muss ein Taxi oder Mietwagen erfüllen?", "antworten": ["Ein Fahrtenschreiber und ein Feuerlöscher, bei Taxen zusätzlich ein Navigationsgerät (§ 35g StVZO).", "Eine Hauptuntersuchung nur alle drei Jahre und ein Warndreieck; BOKraft-Ausrüstung ist nicht vorgeschrieben (§ 29 StVZO).", "Gültige Hauptuntersuchung (§ 29 StVZO) und die BOKraft-Ausrüstung: u. a. zwei Türen rechts und Alarmanlage, bei Taxen geeichter Fahrpreisanzeiger, bei Mietwagen Wegstreckenzähler (§§ 25–30 BOKraft)."], "richtig": 2, "erklaerung": "Gültige Hauptuntersuchung (§ 29 StVZO) und die BOKraft-Ausrüstung: u. a. zwei Türen rechts und Alarmanlage, bei Taxen geeichter Fahrpreisanzeiger, bei Mietwagen Wegstreckenzähler (§§ 25–30 BOKraft).", "schwierigkeit": "leicht"}, {"id": 270, "gesetz": "StraßenGesetz", "frage": "#0270 Wie oft muss die Hauptuntersuchung (HU) für Taxis und Mietwagen durchgeführt werden?", "antworten": ["Alle 6 Monate (§ 41 BOKraft).", "Alle 24 Monate (§ 29 StVZO).", "Alle 12 Monate (§ 29 StVZO)."], "richtig": 2, "erklaerung": "Alle 12 Monate (§ 29 StVZO).", "schwierigkeit": "mittel"}, {"id": 271, "gesetz": "StraßenGesetz", "frage": "#0271 Welche Pflichten hat ein Taxifahrer bei der täglichen Abfahrtkontrolle?", "antworten": ["Sichtkontrolle des Fahrzeugs, Prüfung der Beleuchtung, Reifen und Bremsen (§ 23 StVO).", "Sie müssen einen Bremstest auf der Rolle durchführen und das Fahrtenbuch beim Finanzamt abstempeln lassen (§ 29 StVZO).", "Eine tägliche Abfahrtkontrolle ist nur für Lkw vorgeschrieben; bei Taxen entfällt sie (§ 31 StVZO)."], "richtig": 0, "erklaerung": "Sichtkontrolle des Fahrzeugs, Prüfung der Beleuchtung, Reifen und Bremsen (§ 23 StVO).", "schwierigkeit": "schwer"}, {"id": 272, "gesetz": "StraßenGesetz", "frage": "#0272 Was ist zu tun, wenn das Taxi während der Fahrt eine Panne hat?", "antworten": ["Weiterfahren bis zur nächsten Werkstatt, Fahrgäste nicht informieren und das Taxameter anhalten (§ 23 StVO).", "Warnblinklicht einschalten, die Pannenstelle mit Warndreieck sichern (§ 15 StVO), Fahrgäste informieren und falls nötig ein Ersatzfahrzeug organisieren.", "Sofort den Pannendienst rufen und Fahrgäste ohne Absicherung aussteigen lassen (§ 34 StVO)."], "richtig": 1, "erklaerung": "Warnblinklicht einschalten, die Pannenstelle mit Warndreieck sichern (§ 15 StVO), Fahrgäste informieren und falls nötig ein Ersatzfahrzeug organisieren.", "schwierigkeit": "leicht"}, {"id": 273, "gesetz": "StraßenGesetz", "frage": "#0273 Welche Pflichten hat ein Taxifahrer nach einem Unfall?", "antworten": ["Nur den Unternehmer anrufen und die Unfallstelle verlassen, sobald der Fahrgast ausgestiegen ist (§ 142 StGB).", "Weiterfahren, wenn kein Personenschaden eingetreten ist, und den Schaden später dem Unternehmer melden (§ 34 StVO).", "Sofort anhalten, Unfallstelle sichern, Verletzten helfen, Beteiligung angeben und auf Verlangen Name, Anschrift, Führerschein, Fahrzeugschein und Versicherung nennen; ist kein Feststellungsberechtigter da, angemessen warten (§ 34 StVO, § 142 StGB)."], "richtig": 2, "erklaerung": "Sofort anhalten, Unfallstelle sichern, Verletzten helfen, Beteiligung angeben und auf Verlangen Name, Anschrift, Führerschein, Fahrzeugschein und Versicherung nennen; ist kein Feststellungsberechtigter da, angemessen warten (§ 34 StVO, § 142 StGB).", "schwierigkeit": "mittel"}, {"id": 274, "gesetz": "StraßenGesetz", "frage": "#0274 Darf ein Taxifahrer nach einem Unfall die Unfallstelle verlassen?", "antworten": ["Nein, der Fahrer muss unabhängig von der Schadenshöhe zwingend bis zum Eintreffen der Polizei bleiben, auch bei Bagatellschäden (§ 34 Abs. 1 StVO).", "Ja, aber erst wenn er die Feststellung seiner Person, seines Fahrzeugs und seiner Beteiligung ermöglicht oder eine angemessene Zeit gewartet hat; dann muss er die Feststellungen unverzüglich nachträglich ermöglichen. Ein Zettel am Fahrzeug genügt nicht (§ 142 StGB).", "Ja, jederzeit, wenn ein Zettel mit Name und Telefonnummer am Fahrzeug hinterlassen wurde (§ 34 StVO)."], "richtig": 1, "erklaerung": "Ja, aber erst wenn er die Feststellung seiner Person, seines Fahrzeugs und seiner Beteiligung ermöglicht oder eine angemessene Zeit gewartet hat; dann muss er die Feststellungen unverzüglich nachträglich ermöglichen. Ein Zettel am Fahrzeug genügt nicht (§ 142 StGB).", "schwierigkeit": "schwer"}, {"id": 275, "gesetz": "StraßenGesetz", "frage": "#0275 Welche Erste-Hilfe-Maßnahmen sollte ein Taxifahrer kennen?", "antworten": ["Wiederbelebung nur nach Anweisung der Polizei; ein Notruf ist erst nach Absprache mit dem Unternehmer zulässig (§ 34 StVO).", "Stabilisierung von Verletzten, Absichern der Unfallstelle, Notruf absetzen (§ 323c StGB – unterlassene Hilfeleistung).", "Kenntnisse in Erster Hilfe sind freiwillig; unterlassene Hilfeleistung ist nur strafbar, wenn ein Fahrgast betroffen ist (§ 142 StGB)."], "richtig": 1, "erklaerung": "Stabilisierung von Verletzten, Absichern der Unfallstelle, Notruf absetzen (§ 323c StGB – unterlassene Hilfeleistung).", "schwierigkeit": "leicht"}, {"id": 276, "gesetz": "StraßenGesetz", "frage": "#0276 Darf ein Fahrgast den Fahrpreis verweigern?", "antworten": ["Nein, der Fahrpreis ist aus dem Beförderungsvertrag geschuldet; zu zahlen ist nur das zulässige Tarifentgelt (§ 51 PBefG, § 37 BOKraft). Bis zur Erteilung einer verlangten Quittung darf der Fahrgast die Zahlung zurückhalten (§ 368 BGB).", "Ja, bei Unzufriedenheit mit der Fahrt darf der Fahrgast den Preis nach eigenem Ermessen kürzen (§ 51 PBefG).", "Ja, der Fahrgast darf die Zahlung bis zum Ende des Monats aufschieben, wenn er eine Quittung erhält (§ 271 BGB)."], "richtig": 0, "erklaerung": "Nein, der Fahrpreis ist aus dem Beförderungsvertrag geschuldet; zu zahlen ist nur das zulässige Tarifentgelt (§ 51 PBefG, § 37 BOKraft). Bis zur Erteilung einer verlangten Quittung darf der Fahrgast die Zahlung zurückhalten (§ 368 BGB).", "schwierigkeit": "mittel"}, {"id": 277, "gesetz": "StraßenGesetz", "frage": "#0277 Kann ein Taxifahrer einen Fahrgast ablehnen?", "antworten": ["Nein, die Beförderungspflicht gilt ausnahmslos; auch bei Gefahr für die Sicherheit darf der Fahrer nicht ablehnen (§ 22 PBefG).", "Ja, wenn Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft), oder wenn die Voraussetzungen der Beförderungspflicht fehlen bzw. die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 22, § 47 Abs. 4 PBefG).", "Ja, wenn der Fahrgast nur ein kurzes Fahrtziel hat oder kein Bargeld mitführt (§ 13 BOKraft)."], "richtig": 1, "erklaerung": "Ja, wenn Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft), oder wenn die Voraussetzungen der Beförderungspflicht fehlen bzw. die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 22, § 47 Abs. 4 PBefG).", "schwierigkeit": "schwer"}, {"id": 278, "gesetz": "StraßenGesetz", "frage": "#0278 Welche Folgen hat eine Trunkenheitsfahrt für einen Taxifahrer?", "antworten": ["Nur ein Verwarnungsgeld; Entzug der Fahrerlaubnis droht erst bei der dritten Fahrt unter Einfluss (§ 24a StVG).", "Entzug der Fahrerlaubnis, Fahrverbot, hohe Geldstrafe (§ 24a StVG, § 316 StGB).", "Ausschließlich eine Geldbuße ohne Punkte; die FzF bleibt immer erhalten (§ 316 StGB)."], "richtig": 1, "erklaerung": "Entzug der Fahrerlaubnis, Fahrverbot, hohe Geldstrafe (§ 24a StVG, § 316 StGB).", "schwierigkeit": "leicht"}, {"id": 279, "gesetz": "StraßenGesetz", "frage": "#0279 Was passiert, wenn ein Taxi unter Verstoß gegen Umweltzonen-Bestimmungen fährt?", "antworten": ["Fahrverbot von einem Monat und Eintrag von zwei Punkten (§ 4 StVG).", "Geldbuße (Regelsatz 100 €), kein Fahrverbot; ohne gültige Plakette darf in Umweltzonen nicht gefahren werden (Zeichen 270.1 StVO i. V. m. 35. BImSchV).", "Die Zulassung des Fahrzeugs wird entzogen und das Taxi stillgelegt (§ 5 FZV)."], "richtig": 1, "erklaerung": "Geldbuße (Regelsatz 100 €), kein Fahrverbot; ohne gültige Plakette darf in Umweltzonen nicht gefahren werden (Zeichen 270.1 StVO i. V. m. 35. BImSchV).", "schwierigkeit": "mittel"}, {"id": 280, "gesetz": "StraßenGesetz", "frage": "#0280 Welche Strafen drohen bei unerlaubtem Halten oder Parken im Halteverbot?", "antworten": ["Entzug der Fahrerlaubnis für einen Monat, stets zusätzlich zum Bußgeld (§ 25 StVG).", "Geldbuße, ggf. Abschleppen des Fahrzeugs (§ 12 StVO).", "Freiheitsstrafe bis zu sechs Monaten, wenn das Fahrzeug länger als drei Minuten stand (§ 142 StGB)."], "richtig": 1, "erklaerung": "Geldbuße, ggf. Abschleppen des Fahrzeugs (§ 12 StVO).", "schwierigkeit": "schwer"}, {"id": 301, "gesetz": "StraßenGesetz", "frage": "#0301 Welche Grundregeln gelten für alle Verkehrsteilnehmer?", "antworten": ["Ständige Vorsicht und gegenseitige Rücksichtnahme sind erforderlich. Niemand darf geschädigt, gefährdet oder unnötig behindert oder belästigt werden (§ 1 StVO).", "Nur Berufskraftfahrer sind zu Vorsicht verpflichtet; Privatfahrer dürfen andere behindern, sofern keine Gefährdung eintritt (§ 3 StVO).", "Jeder darf sich im Verkehr auf sein Vorrecht verlassen; Rücksicht muss nur genommen werden, wenn es ausdrücklich verlangt wird (§ 2 StVO)."], "richtig": 0, "erklaerung": "Ständige Vorsicht und gegenseitige Rücksichtnahme sind erforderlich. Niemand darf geschädigt, gefährdet oder unnötig behindert oder belästigt werden (§ 1 StVO).", "schwierigkeit": "leicht"}, {"id": 302, "gesetz": "StraßenGesetz", "frage": "#0302 Wo müssen Fahrzeuge grundsätzlich fahren?", "antworten": ["Fahrzeuge dürfen die Fahrbahn frei benutzen und in der Mitte fahren, wenn kein Gegenverkehr kommt (§ 3 StVO).", "Fahrzeuge müssen die Fahrbahn benutzen und möglichst weit rechts fahren (§ 2 StVO).", "Fahrzeuge müssen möglichst weit links fahren, damit Fuß
