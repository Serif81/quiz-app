ng sind (§ 612 BGB)."], "richtig": 1, "erklaerung": "Nein, Arbeitszeit ist zu vergüten, mindestens mit dem Mindestlohn (§§ 611a, 612 BGB, § 1 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1154, "gesetz": "BGB", "frage": "#1154 Welche Kündigungsfrist gilt für Taxi- und Mietwagenfahrer?", "antworten": ["Die gesetzlichen Kündigungsfristen gemäß § 622 BGB, abhängig von der Betriebszugehörigkeit.", "Einheitlich zwei Wochen zum Monatsende für alle Fahrer, unabhängig von der Dauer der Beschäftigung (§ 626 BGB).", "Es gibt keine Kündigungsfristen; das Arbeitsverhältnis kann jederzeit ohne Frist beendet werden (§ 620 BGB)."], "richtig": 0, "erklaerung": "Die gesetzlichen Kündigungsfristen gemäß § 622 BGB, abhängig von der Betriebszugehörigkeit.", "schwierigkeit": "leicht"}, {"id": 1155, "gesetz": "BGB", "frage": "#1155 Hat ein Taxifahrer ein Recht auf einen schriftlichen Arbeitsvertrag?", "antworten": ["Ja, ein Arbeitsvertrag ist nur wirksam, wenn er schriftlich abgeschlossen und von beiden Seiten unterschrieben wurde (§ 126 BGB).", "Nein, ein Nachweis der Arbeitsbedingungen ist im Taxigewerbe nicht erforderlich (§ 2 NachwG).", "Der Vertrag ist formfrei, der Arbeitgeber muss aber die wesentlichen Bedingungen schriftlich nachweisen; Textform genügt im Personenbeförderungsgewerbe nicht (§ 2 NachwG)."], "richtig": 2, "erklaerung": "Der Vertrag ist formfrei, der Arbeitgeber muss aber die wesentlichen Bedingungen schriftlich nachweisen; Textform genügt im Personenbeförderungsgewerbe nicht (§ 2 NachwG).", "schwierigkeit": "mittel"}, {"id": 1156, "gesetz": "BGB", "frage": "#1156 Darf ein Taxiunternehmen einen Taxifahrer entlassen, weil dieser sich über schlechte Arbeitsbedingungen beschwert?", "antworten": ["Ja, im Kleinbetrieb ist eine Kündigung aus jedem Grund zulässig, solange die Kündigungsfrist eingehalten wird (§ 622 BGB).", "Ja, wenn sich der Fahrer öffentlich äußert, ist eine fristlose Kündigung stets gerechtfertigt (§ 626 BGB).", "Nein, eine Kündigung aus diesem Grund verstößt gegen das Maßregelungsverbot (§ 612a BGB)."], "richtig": 2, "erklaerung": "Nein, eine Kündigung aus diesem Grund verstößt gegen das Maßregelungsverbot (§ 612a BGB).", "schwierigkeit": "schwer"}, {"id": 1157, "gesetz": "BGB", "frage": "#1157 Was passiert mit dem Arbeitsverhältnis eines Taxifahrers, wenn das Taxiunternehmen verkauft wird?", "antworten": ["Das Arbeitsverhältnis endet automatisch mit dem Verkauf; der Käufer muss neue Verträge schließen (§ 620 BGB).", "Das Arbeitsverhältnis geht mit allen Rechten und Pflichten auf den neuen Arbeitgeber über (§ 613a BGB).", "Es bleibt beim bisherigen Inhaber; der Käufer übernimmt nur Fahrzeuge und Konzession (§ 613 BGB)."], "richtig": 1, "erklaerung": "Das Arbeitsverhältnis geht mit allen Rechten und Pflichten auf den neuen Arbeitgeber über (§ 613a BGB).", "schwierigkeit": "leicht"}, {"id": 1158, "gesetz": "BGB", "frage": "#1158 Ist ein Taxifahrer verpflichtet, sein eigenes Fahrzeug für Fahrten zu nutzen?", "antworten": ["Nein, Arbeitsmittel stellt der Arbeitgeber; eine Nutzung des eigenen Fahrzeugs muss vereinbart und Aufwand ersetzt werden (§§ 611a, 670 BGB).", "Ja, aber nur gegen eine pauschale Nutzungsentschädigung von höchstens 10 € monatlich (§ 611a BGB).", "Ja, der Fahrer muss sein Fahrzeug einsetzen, wenn der Betrieb nicht genügend Taxen hat (§ 106 GewO)."], "richtig": 0, "erklaerung": "Nein, Arbeitsmittel stellt der Arbeitgeber; eine Nutzung des eigenen Fahrzeugs muss vereinbart und Aufwand ersetzt werden (§§ 611a, 670 BGB).", "schwierigkeit": "mittel"}, {"id": 1159, "gesetz": "BGB", "frage": "#1159 Darf ein Taxifahrer seinen Arbeitsplatz an eine andere Person weitergeben?", "antworten": ["Nein, die Arbeitsleistung muss persönlich erbracht werden, sofern keine andere Regelung getroffen wurde (§ 613 BGB).", "Ja, der Fahrer darf seine Schicht jederzeit an einen anderen Fahrer mit Personenbeförderungsschein übertragen (§ 613 BGB).", "Ja, wenn er den Arbeitgeber binnen 24 Stunden danach informiert, da Arbeitsverträge frei übertragbar sind (§ 398 BGB)."], "richtig": 0, "erklaerung": "Nein, die Arbeitsleistung muss persönlich erbracht werden, sofern keine andere Regelung getroffen wurde (§ 613 BGB).", "schwierigkeit": "schwer"}, {"id": 1160, "gesetz": "BGB", "frage": "#1160 Welche Regelungen gelten für die Bezahlung von Wartezeiten bei Taxifahrern?", "antworten": ["Standzeiten am Taxistand sind in der Regel Arbeitszeit (Arbeitsbereitschaft) und mindestens mit dem Mindestlohn zu vergüten (§ 611a BGB, § 1 MiLoG).", "Wartezeiten werden nur mit der Hälfte des Mindestlohns vergütet, da keine Fahrtätigkeit erfolgt, solange der Wagen am Stand steht (§ 1 MiLoG).", "Standzeiten sind unbezahlte Pausen und nur dann zu vergüten, wenn eine Fahrt stattfindet (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "Standzeiten am Taxistand sind in der Regel Arbeitszeit (Arbeitsbereitschaft) und mindestens mit dem Mindestlohn zu vergüten (§ 611a BGB, § 1 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1161, "gesetz": "BGB", "frage": "#1161 Wann gilt ein Arbeitsvertrag als wirksam geschlossen?", "antworten": ["Wenn sich Arbeitgeber und Arbeitnehmer über die wesentlichen Vertragsbestandteile (Vergütung, Tätigkeit) geeinigt haben (§ 611a BGB).", "Erst nach Ablauf der Probezeit; bis dahin besteht nur ein vorläufiges Beschäftigungsverhältnis (§ 622 Abs. 3 BGB).", "Erst wenn der Vertrag schriftlich ausgefertigt und beim Gewerbeamt hinterlegt wurde (§ 14 GewO)."], "richtig": 0, "erklaerung": "Wenn sich Arbeitgeber und Arbeitnehmer über die wesentlichen Vertragsbestandteile (Vergütung, Tätigkeit) geeinigt haben (§ 611a BGB).", "schwierigkeit": "mittel"}, {"id": 1162, "gesetz": "BGB", "frage": "#1162 Wann hat ein Arbeitnehmer Anspruch auf eine Abfindung nach einer Kündigung?", "antworten": ["Immer, bei jeder ordentlichen Kündigung durch den Arbeitgeber steht ein Monatsgehalt je Beschäftigungsjahr zu (§ 622 BGB).", "Grundsätzlich nicht; nach § 1a KSchG, wenn der Arbeitnehmer nach einer verhaltensbedingten Kündigung eine Abfindung verlangt (ein Monatsverdienst je Jahr).", "Grundsätzlich nicht; nach § 1a KSchG, wenn bei betriebsbedingter Kündigung mit Abfindungshinweis keine Klage erhoben wird (0,5 Monatsverdienste je Jahr)."], "richtig": 2, "erklaerung": "Grundsätzlich nicht; nach § 1a KSchG, wenn bei betriebsbedingter Kündigung mit Abfindungshinweis keine Klage erhoben wird (0,5 Monatsverdienste je Jahr).", "schwierigkeit": "schwer"}, {"id": 1163, "gesetz": "BGB", "frage": "#1163 Welche Rechte hat ein Arbeitnehmer bei einer fristlosen Kündigung?", "antworten": ["Er kann innerhalb von einem Monat nach Zugang Widerspruch beim Betriebsrat oder bei der IHK einlegen (§ 102 BetrVG).", "Er muss die Kündigung hinnehmen, da gegen eine fristlose Kündigung kein Rechtsmittel besteht (§ 626 BGB).", "Er kann innerhalb von drei Wochen nach Zugang Kündigungsschutzklage beim Arbeitsgericht erheben (§§ 4, 13 KSchG)."], "richtig": 2, "erklaerung": "Er kann innerhalb von drei Wochen nach Zugang Kündigungsschutzklage beim Arbeitsgericht erheben (§§ 4, 13 KSchG).", "schwierigkeit": "leicht"}, {"id": 1164, "gesetz": "BGB", "frage": "#1164 Welche Mindestanforderungen muss ein Arbeitszeugnis erfüllen?", "antworten": ["Es muss in Schriftform mit einer Beurteilung durch den Betriebsrat erstellt werden (§ 109 GewO).", "Es muss immer den Kündigungsgrund und die Gehaltshöhe enthalten (§ 630 BGB).", "Es muss klar, wahrheitsgemäß und wohlwollend formuliert sein (§ 109 GewO)."], "richtig": 2, "erklaerung": "Es muss klar, wahrheitsgemäß und wohlwollend formuliert sein (§ 109 GewO).", "schwierigkeit": "mittel"}, {"id": 1165, "gesetz": "BGB", "frage": "#1165 Wann verjährt ein Anspruch auf ausstehende Lohnzahlungen?", "antworten": ["Nach drei Jahren, beginnend mit dem Schluss des Jahres der Fälligkeit (§§ 195, 199 BGB).", "Nach zehn Jahren, beginnend mit der Entstehung des Anspruchs (§ 196 BGB).", "Nach zwei Jahren ab Zugang der letzten Lohnabrechnung (§ 214 BGB)."], "richtig": 0, "erklaerung": "Nach drei Jahren, beginnend mit dem Schluss des Jahres der Fälligkeit (§§ 195, 199 BGB).", "schwierigkeit": "schwer"}, {"id": 1166, "gesetz": "BGB", "frage": "#1166 Welche Regelung gilt für den Urlaubsanspruch eines Arbeitnehmers?", "antworten": ["Mindestens zwei Wochen; weitere Urlaubstage nur bei tarifvertraglicher Regelung (§ 7 BUrlG).", "Mindestens sechs Wochen pro Jahr, bei Nachtarbeit acht Wochen (§ 3 BUrlG).", "Mindestens vier Wochen gesetzlicher Mindesturlaub pro Jahr (§ 3 BUrlG)."], "richtig": 2, "erklaerung": "Mindestens vier Wochen gesetzlicher Mindesturlaub pro Jahr (§ 3 BUrlG).", "schwierigkeit": "leicht"}, {"id": 1167, "gesetz": "BGB", "frage": "#1167 Darf ein Arbeitgeber einseitig den Arbeitsort eines Arbeitnehmers ändern?", "antworten": ["Ja, im Rahmen des Weisungsrechts nach billigem Ermessen, soweit der Arbeitsort nicht im Arbeitsvertrag festgelegt ist (§ 106 GewO).", "Ja, uneingeschränkt und ohne Rücksicht auf die Interessen des Arbeitnehmers, solange die Kündigungsfrist eingehalten wird (§ 315 BGB).", "Nein, jede Änderung des Arbeitsorts bedarf der schriftlichen Zustimmung des Arbeitnehmers (§ 311 BGB)."], "richtig": 0, "erklaerung": "Ja, im Rahmen des Weisungsrechts nach billigem Ermessen, soweit der Arbeitsort nicht im Arbeitsvertrag festgelegt ist (§ 106 GewO).", "schwierigkeit": "mittel"}, {"id": 1168, "gesetz": "BGB", "frage": "#1168 Wann ist eine Probezeit in einem Arbeitsvertrag zulässig?", "antworten": ["Sie darf maximal drei Monate betragen und muss schriftlich vereinbart werden (§ 622 Abs. 1 BGB).", "Sie darf bis zu zwölf Monate betragen, wenn der Betriebsrat zustimmt (§ 1 KSchG).", "Sie darf maximal sechs Monate betragen (§ 622 Abs. 3 BGB)."], "richtig": 2, "erklaerung": "Sie darf maximal sechs Monate betragen (§ 622 Abs. 3 BGB).", "schwierigkeit": "schwer"}, {"id": 1169, "gesetz": "BGB", "frage": "#1169 Was passiert, wenn ein Arbeitnehmer ohne gültigen Grund nicht zur Arbeit erscheint?", "antworten": ["Der Arbeitgeber darf sofort den Lohn für den ganzen Monat einbehalten und das Fahrzeug einziehen (§ 273 BGB).", "Dies kann eine Abmahnung und im Wiederholungsfall eine ordentliche oder fristlose Kündigung zur Folge haben (§ 1 Abs. 2 KSchG, § 626 BGB).", "Es hat keine arbeitsrechtlichen Folgen, solange der Fahrer innerhalb einer Woche eine Entschuldigung nachreicht (§ 5 EFZG)."], "richtig": 1, "erklaerung": "Dies kann eine Abmahnung und im Wiederholungsfall eine ordentliche oder fristlose Kündigung zur Folge haben (§ 1 Abs. 2 KSchG, § 626 BGB).", "schwierigkeit": "leicht"}, {"id": 1170, "gesetz": "BGB", "frage": "#1170 Unter welchen Umständen kann ein Arbeitnehmer eine unbezahlte Freistellung verlangen?", "antworten": ["Jederzeit, da jeder Arbeitnehmer pro Jahr Anspruch auf bis zu drei Monate unbezahlte Freistellung hat (§ 7 BUrlG).", "Nur bei Vorlage eines ärztlichen Attests; eine Freistellung aus anderen Gründen ist gesetzlich ausgeschlossen (§ 5 EFZG).", "Nur bei gesetzlichem Anspruch (z. B. Pflegezeit, Elternzeit) oder mit Zustimmung des Arbeitgebers (§ 3 PflegeZG, § 15 BEEG)."], "richtig": 2, "erklaerung": "Nur bei gesetzlichem Anspruch (z. B. Pflegezeit, Elternzeit) oder mit Zustimmung des Arbeitgebers (§ 3 PflegeZG, § 15 BEEG).", "schwierigkeit": "mittel"}, {"id": 1171, "gesetz": "BGB", "frage": "#1171 Was ist der Unterschied zwischen einem Werkvertrag und einem Arbeitsvertrag?", "antworten": ["Ein Arbeitsvertrag verpflichtet zur persönlichen Arbeitsleistung, während ein Werkvertrag ein bestimmtes Ergebnis schuldet (§ 631 BGB).", "Beide Vertragsarten sind identisch; der Unterschied liegt nur in der Bezeichnung und der Form der Vergütung (§ 611 BGB).", "Der Werkvertrag begründet ein Weisungsrecht des Auftraggebers und Sozialversicherungspflicht, der Arbeitsvertrag nicht (§ 631 BGB)."], "richtig": 0, "erklaerung": "Ein Arbeitsvertrag verpflichtet zur persönlichen Arbeitsleistung, während ein Werkvertrag ein bestimmtes Ergebnis schuldet (§ 631 BGB).", "schwierigkeit": "schwer"}, {"id": 1172, "gesetz": "BGB", "frage": "#1172 Wann haftet ein Arbeitnehmer für Schäden, die er während der Arbeit verursacht?", "antworten": ["Voll bei Vorsatz und grober Fahrlässigkeit, anteilig bei mittlerer, nicht bei leichter Fahrlässigkeit (§§ 280, 619a BGB, innerbetrieblicher Schadensausgleich).", "Immer voll, da Arbeitnehmer nach dem BGB für jeden verursachten Schaden uneingeschränkt einstehen müssen (§ 276 BGB).", "Nie, denn das Betriebsrisiko trägt allein der Arbeitgeber, selbst bei Vorsatz (§ 618 BGB)."], "richtig": 0, "erklaerung": "Voll bei Vorsatz und grober Fahrlässigkeit, anteilig bei mittlerer, nicht bei leichter Fahrlässigkeit (§§ 280, 619a BGB, innerbetrieblicher Schadensausgleich).", "schwierigkeit": "leicht"}, {"id": 1173, "gesetz": "BGB", "frage": "#1173 Darf ein Arbeitnehmer während der Arbeitszeit für ein Konkurrenzunternehmen arbeiten?", "antworten": ["Nur bei einem Unternehmen in einem anderen Landkreis; Konkurrenz im eigenen Gebiet kann nur der Betriebsrat untersagen (§ 87 BetrVG).", "Ja, wenn er dem Arbeitgeber die Nebentätigkeit nachträglich anzeigt (§ 106 GewO).", "Nein, dies verstößt gegen die Treuepflicht und kann zur Kündigung führen (§ 60 HGB)."], "richtig": 2, "erklaerung": "Nein, dies verstößt gegen die Treuepflicht und kann zur Kündigung führen (§ 60 HGB).", "schwierigkeit": "mittel"}, {"id": 1174, "gesetz": "BGB", "frage": "#1174 Unter welchen Bedingungen kann ein Arbeitgeber Schadensersatz vom Arbeitnehmer fordern?", "antworten": ["Bei Vorsatz und grober Fahrlässigkeit voll, bei mittlerer Fahrlässigkeit anteilig; der Arbeitgeber muss das Verschulden beweisen (§§ 280, 619a BGB).", "Nur bei Vorsatz; bei grober Fahrlässigkeit haftet der Arbeitnehmer nie, und der Arbeitgeber trägt die Beweislast (§ 823 BGB).", "Bei jeder Fahrlässigkeit voll; der Arbeitnehmer muss beweisen, dass ihn kein Verschulden trifft (§ 280 Abs. 1 BGB)."], "richtig": 0, "erklaerung": "Bei Vorsatz und grober Fahrlässigkeit voll, bei mittlerer Fahrlässigkeit anteilig; der Arbeitgeber muss das Verschulden beweisen (§§ 280, 619a BGB).", "schwierigkeit": "schwer"}, {"id": 1175, "gesetz": "BGB", "frage": "#1175 Wie lange ist die gesetzliche Gewährleistungsfrist bei Werkverträgen nach BGB?", "antworten": ["Die Gewährleistungsfrist beträgt einheitlich drei Jahre ab Vertragsschluss, auch beim Dienstvertrag (§ 195 BGB).", "Beim Werkvertrag verjähren Mängelansprüche bei Sachwerken nach fünf Jahren; beim Dienstvertrag gilt dieselbe Frist (§ 195 BGB).", "Beim Dienstvertrag gibt es keine Gewährleistung; beim Werkvertrag verjähren Mängelansprüche bei Sachwerken in zwei Jahren ab Abnahme (§ 634a BGB)."], "richtig": 2, "erklaerung": "Beim Dienstvertrag gibt es keine Gewährleistung; beim Werkvertrag verjähren Mängelansprüche bei Sachwerken in zwei Jahren ab Abnahme (§ 634a BGB).", "schwierigkeit": "leicht"}, {"id": 1176, "gesetz": "BGB", "frage": "#1176 Wann kann ein Vertrag wegen Irrtums angefochten werden?", "antworten": ["Bei Inhalts- oder Erklärungsirrtum oder Irrtum über verkehrswesentliche Eigenschaften; die Anfechtung muss unverzüglich erfolgen (§§ 119, 121 BGB).", "Nur bei arglistiger Täuschung oder Drohung; ein Irrtum berechtigt nie zur Anfechtung (§ 123 BGB).", "Bei jedem Motivirrtum, etwa wenn sich der Käufer über den künftigen Wert der Sache täuscht; die Frist beträgt drei Jahre (§§ 119, 121 BGB)."], "richtig": 0, "erklaerung": "Bei Inhalts- oder Erklärungsirrtum oder Irrtum über verkehrswesentliche Eigenschaften; die Anfechtung muss unverzüglich erfolgen (§§ 119, 121 BGB).", "schwierigkeit": "mittel"}, {"id": 1177, "gesetz": "BGB", "frage": "#1177 Welche Bedeutung hat die „geschäftliche Unerfahrenheit“ bei Verträgen?", "antworten": ["Verträge sind nichtig, wenn die Unerfahrenheit ausgebeutet wird und ein auffälliges Missverhältnis von Leistung und Gegenleistung besteht (§ 138 Abs. 2 BGB).", "Verträge sind nur anfechtbar, wenn der Vertragspartner die Unerfahrenheit erkennt, und bleiben bis dahin gültig (§ 123 BGB).", "Sie berechtigt zum Widerruf innerhalb von 14 Tagen, auch bei Verträgen in Geschäftsräumen (§ 355 BGB)."], "richtig": 0, "erklaerung": "Verträge sind nichtig, wenn die Unerfahrenheit ausgebeutet wird und ein auffälliges Missverhältnis von Leistung und Gegenleistung besteht (§ 138 Abs. 2 BGB).", "schwierigkeit": "schwer"}, {"id": 1178, "gesetz": "BGB", "frage": "#1178 Wann sind Allgemeine Geschäftsbedingungen (AGB) unwirksam?", "antworten": ["AGB sind nur gegenüber Verbrauchern kontrollierbar; unter Unternehmern sind sie stets wirksam (§ 310 BGB).", "Überraschende Klauseln werden nicht Vertragsbestandteil (§ 305c BGB), unangemessen benachteiligende sind unwirksam (§ 307 BGB).", "AGB sind unwirksam, sobald sie nicht handschriftlich vom Kunden unterschrieben wurden (§ 126 BGB)."], "richtig": 1, "erklaerung": "Überraschende Klauseln werden nicht Vertragsbestandteil (§ 305c BGB), unangemessen benachteiligende sind unwirksam (§ 307 BGB).", "schwierigkeit": "leicht"}, {"id": 1179, "gesetz": "BGB", "frage": "#1179 Welche Formvorschriften gelten für Arbeitsverträge?", "antworten": ["Arbeitsverträge bedürfen zu ihrer Wirksamkeit stets der notariellen Beurkundung (§ 311b BGB).", "Ein Arbeitsvertrag kann mündlich geschlossen werden; ein Nachweis der Bedingungen ist nur bei Verträgen über sechs Monate Dauer vorgeschrieben (§ 2 NachwG).", "Ein Arbeitsvertrag kann mündlich oder schriftlich geschlossen werden, jedoch müssen die wesentlichen Bedingungen schriftlich festgehalten werden (§ 2 NachwG)."], "richtig": 2, "erklaerung": "Ein Arbeitsvertrag kann mündlich oder schriftlich geschlossen werden, jedoch müssen die wesentlichen Bedingungen schriftlich festgehalten werden (§ 2 NachwG).", "schwierigkeit": "mittel"}, {"id": 1180, "gesetz": "BGB", "frage": "#1180 Was passiert, wenn ein Arbeitnehmer seine Pflichten aus dem Arbeitsvertrag nicht erfüllt?", "antworten": ["Der Arbeitgeber darf den Lohn einseitig kürzen und ohne Vereinbarung eine Vertragsstrafe von drei Monatsgehältern festsetzen (§ 339 BGB).", "Der Arbeitgeber kann abmahnen und im Wiederholungsfall ordentlich oder bei schweren Verstößen fristlos kündigen (§ 1 Abs. 2 KSchG, § 626 BGB).", "Der Arbeitgeber kann sofort und ohne Abmahnung kündigen, da jede Pflichtverletzung einen wichtigen Grund darstellt (§ 626 BGB)."], "richtig": 1, "erklaerung": "Der Arbeitgeber kann abmahnen und im Wiederholungsfall ordentlich oder bei schweren Verstößen fristlos kündigen (§ 1 Abs. 2 KSchG, § 626 BGB).", "schwierigkeit": "schwer"}, {"id": 1201, "gesetz": "HGB_BGB", "frage": "#1201 Gilt ein Taxiunternehmen als Kaufmann im Sinne des HGB?", "antworten": ["Ja, wenn es ein Handelsgewerbe betreibt oder im Handelsregister eingetragen ist (§ 1 HGB).", "Nein, Taxiunternehmen sind Freiberufler und unterliegen nie dem HGB (§ 18 EStG).", "Ja, jedes Taxiunternehmen ist automatisch Kaufmann, sobald es ein Fahrzeug besitzt (§ 1 HGB)."], "richtig": 0, "erklaerung": "Ja, wenn es ein Handelsgewerbe betreibt oder im Handelsregister eingetragen ist (§ 1 HGB).", "schwierigkeit": "leicht"}, {"id": 1202, "gesetz": "HGB_BGB", "frage": "#1202 Welche Bedeutung hat die Handelsregistereintragung für ein Taxiunternehmen?", "antworten": ["Sie befreit das Unternehmen von der Gewerbeanmeldung und der Gewerbesteuer (§ 14 GewO).", "Sie bewirkt, dass das Unternehmen automatisch als Kaufmann gilt und den Vorschriften des HGB unterliegt (§ 2 HGB).", "Sie ist Voraussetzung für die Erteilung der Taxigenehmigung nach dem PBefG (§ 13 PBefG)."], "richtig": 1, "erklaerung": "Sie bewirkt, dass das Unternehmen automatisch als Kaufmann gilt und den Vorschriften des HGB unterliegt (§ 2 HGB).", "schwierigkeit": "mittel"}, {"id": 1203, "gesetz": "HGB_BGB", "frage": "#1203 Welche Pflichten hat ein Taxiunternehmer als Kaufmann?", "antworten": ["Er muss ausschließlich eine Einnahmen-Überschuss-Rechnung führen und ist von allen Buchführungspflichten des HGB befreit (§ 4 Abs. 3 EStG).", "Er muss einen Jahresabschluss im Bundesanzeiger veröffentlichen und einen Wirtschaftsprüfer bestellen (§§ 325, 316 HGB).", "Er muss Bücher führen, eine Bilanz aufstellen und sich an kaufmännische Sorgfaltspflichten halten (§§ 238, 243 HGB)."], "richtig": 2, "erklaerung": "Er muss Bücher führen, eine Bilanz aufstellen und sich an kaufmännische Sorgfaltspflichten halten (§§ 238, 243 HGB).", "schwierigkeit": "schwer"}, {"id": 1204, "gesetz": "HGB_BGB", "frage": "#1204 Wie unterscheidet sich ein Gewerbetreibender von einem Kaufmann im Taxi- und Mietwagengewerbe?", "antworten": ["Ein Gewerbetreibender haftet nur beschränkt, ein Kaufmann dagegen stets unbeschränkt mit seinem Privatvermögen, gleich in welcher Rechtsform.", "Ein Kaufmann unterliegt den Vorschriften des HGB, während ein Gewerbetreibender nach GewO und BGB behandelt wird.", "Ein Gewerbetreibender betreibt nur ein Nebengewerbe, ein Kaufmann dagegen immer ein Hauptgewerbe."], "richtig": 1, "erklaerung": "Ein Kaufmann unterliegt den Vorschriften des HGB, während ein Gewerbetreibender nach GewO und BGB behandelt wird.", "schwierigkeit": "leicht"}, {"id": 1205, "gesetz": "HGB_BGB", "frage": "#1205 Muss ein Taxiunternehmen ein kaufmännisch eingerichtetes Geschäft führen?", "antworten": ["Nein, die Pflicht gilt nur für Unternehmen mit mehr als zehn Beschäftigten (§ 238 HGB).", "Nur, wenn der Betrieb nach Art und Umfang einen kaufmännischen Geschäftsbetrieb erfordert (§ 1 Abs. 2 HGB).", "Ja, jedes Taxiunternehmen muss ab dem ersten Fahrzeug ein kaufmännisch eingerichtetes Geschäft führen (§ 1 Abs. 2 HGB)."], "richtig": 1, "erklaerung": "Nur, wenn der Betrieb nach Art und Umfang einen kaufmännischen Geschäftsbetrieb erfordert (§ 1 Abs. 2 HGB).", "schwierigkeit": "mittel"}, {"id": 1206, "gesetz": "HGB_BGB", "frage": "#1206 Welche Regelungen gelten für den Geschäftsverkehr eines Taxiunternehmens mit Fahrgästen?", "antworten": ["Die Beförderung beruht auf einem Arbeitsvertrag zwischen Fahrgast und Fahrer nach dem ArbZG.", "Die Beförderung basiert auf einem Beförderungsvertrag, der nach BGB und PBefG geregelt ist.", "Es besteht kein Vertrag; die Beförderung ist eine hoheitliche Leistung nach dem Verwaltungsverfahrensgesetz."], "richtig": 1, "erklaerung": "Die Beförderung basiert auf einem Beförderungsvertrag, der nach BGB und PBefG geregelt ist.", "schwierigkeit": "schwer"}, {"id": 1207, "gesetz": "HGB_BGB", "frage": "#1207 Welche Auswirkungen hat eine fehlerhafte Rechnung eines Taxiunternehmens?", "antworten": ["Eine fehlerhafte Rechnung ist nichtig und begründet weder Zahlungsanspruch noch Steuerschuld; sie darf nicht berichtigt werden (§ 14 UStG).", "Bei zu hoch ausgewiesener Steuer schuldet der Unternehmer nur den gesetzlichen Betrag; der Kunde behält stets den vollen Vorsteuerabzug (§ 15 UStG).", "Eine fehlerhafte Rechnung kann berichtigt werden; bis dahin kann der Kunde den Vorsteuerabzug verlieren, und zu hoch ausgewiesene Steuer schuldet der Unternehmer (§ 14c UStG, § 31 Abs. 5 UStDV)."], "richtig": 2, "erklaerung": "Eine fehlerhafte Rechnung kann berichtigt werden; bis dahin kann der Kunde den Vorsteuerabzug verlieren, und zu hoch ausgewiesene Steuer schuldet der Unternehmer (§ 14c UStG, § 31 Abs. 5 UStDV).", "schwierigkeit": "leicht"}, {"id": 1208, "gesetz": "HGB_BGB", "frage": "#1208 Darf ein Taxiunternehmen eine andere Firma führen als seinen eigenen Namen?", "antworten": ["Ja, aber die Firma muss unterscheidungskräftig sein und darf nicht irreführend wirken (§ 18 HGB).", "Nein, die Firma muss zwingend den vollständigen bürgerlichen Namen des Inhabers enthalten; Fantasienamen sind unzulässig (§ 19 HGB).", "Ja, aber nur nach Genehmigung durch das Ordnungsamt, das jede Firma vorab prüft (§ 23 HGB)."], "richtig": 0, "erklaerung": "Ja, aber die Firma muss unterscheidungskräftig sein und darf nicht irreführend wirken (§ 18 HGB).", "schwierigkeit": "mittel"}, {"id": 1209, "gesetz": "HGB_BGB", "frage": "#1209 Welche Haftung trifft den Unternehmer im Taxi- und Mietwagengewerbe?", "antworten": ["Der Einzelunternehmer haftet persönlich und unbeschränkt mit seinem gesamten Vermögen; bei GbR/OHG haften die Gesellschafter persönlich, bei der GmbH nur das Gesellschaftsvermögen (§ 721 BGB, § 126 HGB, § 13 Abs. 2 GmbHG).", "Einzelunternehmer haften nur mit dem Betriebsvermögen; bei der OHG haften die Gesellschafter nur in Höhe ihrer Einlage (§ 171 HGB).", "Alle Rechtsformen haften unbeschränkt; bei der GmbH haften die Gesellschafter zusätzlich anteilig mit ihrem Privatvermögen (§ 24 GmbHG)."], "richtig": 0, "erklaerung": "Der Einzelunternehmer haftet persönlich und unbeschränkt mit seinem gesamten Vermögen; bei GbR/OHG haften die Gesellschafter persönlich, bei der GmbH nur das Gesellschaftsvermögen (§ 721 BGB, § 126 HGB, § 13 Abs. 2 GmbHG).", "schwierigkeit": "schwer"}, {"id": 1210, "gesetz": "HGB_BGB", "frage": "#1210 Darf ein Taxiunternehmen mehrere Geschäftsadressen führen?", "antworten": ["Ja, aber der Hauptsitz muss ins Handelsregister eingetragen werden (§ 29 HGB).", "Ja, aber jede Adresse muss gesondert als eigenes Unternehmen bei der IHK registriert werden (§ 33 HGB).", "Nein, ein Unternehmen darf nur eine einzige Geschäftsadresse führen (§ 29 HGB)."], "richtig": 0, "erklaerung": "Ja, aber der Hauptsitz muss ins Handelsregister eingetragen werden (§ 29 HGB).", "schwierigkeit": "leicht"}, {"id": 1211, "gesetz": "HGB_BGB", "frage": "#1211 Gilt das HGB für das Arbeitsverhältnis von Taxi- und Mietwagenfahrern?", "antworten": ["Ja, aber nur für Fahrer mit Prokura; für alle anderen gilt ausschließlich die GewO (§ 48 HGB).", "Ja, das HGB regelt das Arbeitsverhältnis aller Fahrer abschließend (§ 59 HGB).", "Nein, das Arbeitsverhältnis richtet sich nach dem BGB (§ 611a BGB) und den arbeitsrechtlichen Spezialgesetzen (z. B. KSchG, ArbZG, MiLoG)."], "richtig": 2, "erklaerung": "Nein, das Arbeitsverhältnis richtet sich nach dem BGB (§ 611a BGB) und den arbeitsrechtlichen Spezialgesetzen (z. B. KSchG, ArbZG, MiLoG).", "schwierigkeit": "mittel"}, {"id": 1212, "gesetz": "HGB_BGB", "frage": "#1212 Welche Pflichten hat der Arbeitgeber gegenüber seinen Fahrern nach HGB und BGB?", "antworten": ["Zahlung der Vergütung, Fürsorgepflicht, Schutzmaßnahmen nach ArbSchG (§ 241 Abs. 2 BGB).", "Ausschließlich Zahlung der Vergütung; Fürsorge- und Schutzpflichten bestehen nur bei Verträgen über ein Jahr (§ 241 BGB).", "Zahlung der Vergütung, Stellung eines Dienstwagens zur privaten Nutzung und Beteiligung am Unternehmensgewinn (§ 611a BGB)."], "richtig": 0, "erklaerung": "Zahlung der Vergütung, Fürsorgepflicht, Schutzmaßnahmen nach ArbSchG (§ 241 Abs. 2 BGB).", "schwierigkeit": "schwer"}, {"id": 1213, "gesetz": "HGB_BGB", "frage": "#1213 Welche Kündigungsfristen gelten für angestellte Taxifahrer?", "antworten": ["Die gesetzlichen Kündigungsfristen des BGB sind maßgeblich (§ 622 BGB).", "Es gelten allein die Fristen des Personenbeförderungsgesetzes, die die Genehmigungsbehörde festlegt (§ 13 PBefG).", "Es gelten feste Fristen von einem Monat zum Monatsende, unabhängig von der Betriebszugehörigkeit (§ 626 BGB)."], "richtig": 0, "erklaerung": "Die gesetzlichen Kündigungsfristen des BGB sind maßgeblich (§ 622 BGB).", "schwierigkeit": "leicht"}, {"id": 1214, "gesetz": "HGB_BGB", "frage": "#1214 Welche Rechte hat ein angestellter Taxifahrer bei Überstunden?", "antworten": ["Überstunden sind stets mit einem Zuschlag von 25 % zu vergüten (§ 612 BGB).", "Angeordnete oder geduldete Überstunden sind zu vergüten oder durch Freizeit auszugleichen, wenn dies vereinbart ist oder eine Vergütung den Umständen nach zu erwarten ist (§ 612 Abs. 1 BGB).", "Überstunden sind nie zu vergüten, da sie mit dem Grundlohn pauschal abgegolten sind (§ 611a BGB)."], "richtig": 1, "erklaerung": "Angeordnete oder geduldete Überstunden sind zu vergüten oder durch Freizeit auszugleichen, wenn dies vereinbart ist oder eine Vergütung den Umständen nach zu erwarten ist (§ 612 Abs. 1 BGB).", "schwierigkeit": "mittel"}, {"id": 1215, "gesetz": "HGB_BGB", "frage": "#1215 Darf ein Taxiunternehmen einen Fahrer zur Nutzung eines Privatwagens zwingen?", "antworten": ["Ja, im Rahmen des Direktionsrechts darf der Arbeitgeber dies anordnen; die Kosten trägt der Fahrer (§ 106 GewO).", "Nein, Arbeitsmittel muss grundsätzlich der Arbeitgeber stellen; die Nutzung des Privatwagens muss vereinbart werden, und die Kosten sind zu erstatten (§ 670 BGB analog).", "Ja, wenn der Fahrer einen Führerschein besitzt; ihm steht dann nur Ersatz der Reparaturkosten zu (§ 670 BGB)."], "richtig": 1, "erklaerung": "Nein, Arbeitsmittel muss grundsätzlich der Arbeitgeber stellen; die Nutzung des Privatwagens muss vereinbart werden, und die Kosten sind zu erstatten (§ 670 BGB analog).", "schwierigkeit": "schwer"}, {"id": 1216, "gesetz": "HGB_BGB", "frage": "#1216 Welche Regelungen gelten für die Betriebsübernahme eines Taxiunternehmens?", "antworten": ["Alle Arbeitsverhältnisse enden mit dem Betriebsübergang; der neue Inhaber muss Verträge neu abschließen, und Fristen beginnen neu (§ 613a BGB).", "Der neue Inhaber tritt in die Arbeitsverhältnisse ein; eine Kündigung wegen des Betriebsübergangs ist aber ausdrücklich erlaubt (§ 613a Abs. 4 BGB).", "Bei einem Betriebsübergang durch Rechtsgeschäft tritt der neue Inhaber in die bestehenden Arbeitsverhältnisse ein; die Arbeitnehmer können binnen eines Monats widersprechen (§ 613a Abs. 1 und 6 BGB)."], "richtig": 2, "erklaerung": "Bei einem Betriebsübergang durch Rechtsgeschäft tritt der neue Inhaber in die bestehenden Arbeitsverhältnisse ein; die Arbeitnehmer können binnen eines Monats widersprechen (§ 613a Abs. 1 und 6 BGB).", "schwierigkeit": "leicht"}, {"id": 1217, "gesetz": "HGB_BGB", "frage": "#1217 Kann ein Taxiunternehmen Fahrer als freie Mitarbeiter beschäftigen?", "antworten": ["Ja, sobald ein schriftlicher Honorarvertrag vorliegt; die tatsächliche Durchführung ist unerheblich (§ 611a BGB).", "Ja, wenn sie tatsächlich selbstständig und nicht weisungsgebunden sind; sonst liegt Scheinselbstständigkeit mit Sozialversicherungspflicht vor (§ 611a BGB, § 7 SGB IV).", "Nein, Fahrer im Taxigewerbe sind kraft Gesetzes stets Arbeitnehmer; freie Mitarbeit ist unzulässig (§ 47 PBefG)."], "richtig": 1, "erklaerung": "Ja, wenn sie tatsächlich selbstständig und nicht weisungsgebunden sind; sonst liegt Scheinselbstständigkeit mit Sozialversicherungspflicht vor (§ 611a BGB, § 7 SGB IV).", "schwierigkeit": "mittel"}, {"id": 1218, "gesetz": "HGB_BGB", "frage": "#1218 Welche Regelungen gibt es für den Krankheitsfall eines Taxifahrers?", "antworten": ["Der Arbeitgeber muss sechs Wochen lang Entgeltfortzahlung leisten (§ 3 EFZG).", "Es besteht kein Anspruch auf Lohn; der Fahrer erhält ab dem ersten Tag Krankengeld von der Krankenkasse (§ 44 SGB V).", "Der Arbeitgeber zahlt zwölf Wochen lang 100 %, danach zahlt die Krankenkasse (§ 3 EFZG)."], "richtig": 0, "erklaerung": "Der Arbeitgeber muss sechs Wochen lang Entgeltfortzahlung leisten (§ 3 EFZG).", "schwierigkeit": "schwer"}, {"id": 1219, "gesetz": "HGB_BGB", "frage": "#1219 Wann haftet ein Taxifahrer für Schäden am Fahrzeug?", "antworten": ["Bei Vorsatz und grober Fahrlässigkeit in der Regel voll, bei mittlerer Fahrlässigkeit anteilig, bei leichter Fahrlässigkeit nicht (innerbetrieblicher Schadensausgleich, §§ 280, 619a BGB).", "Bei jeder Fahrlässigkeit voll, da der Fahrer das Fahrzeug eigenverantwortlich führt (§ 276 BGB).", "Nur bei Vorsatz; bei grober Fahrlässigkeit trägt der Arbeitgeber den Schaden vollständig (§ 254 BGB)."], "richtig": 0, "erklaerung": "Bei Vorsatz und grober Fahrlässigkeit in der Regel voll, bei mittlerer Fahrlässigkeit anteilig, bei leichter Fahrlässigkeit nicht (innerbetrieblicher Schadensausgleich, §§ 280, 619a BGB).", "schwierigkeit": "leicht"}, {"id": 1220, "gesetz": "HGB_BGB", "frage": "#1220 Welche Dokumentationspflichten hat ein Taxiunternehmer bezüglich seiner Arbeitnehmer?", "antworten": ["Er muss lediglich ein Fahrtenbuch führen; Lohnkonten sind nur bei mehr als zehn Beschäftigten Pflicht (§ 41 EStG).", "Er muss Beginn, Ende und Dauer der Arbeitszeit aufzeichnen sowie Lohnkonten und Entgeltunterlagen führen (§ 17 MiLoG, § 16 ArbZG, § 41 EStG, § 28f SGB IV).", "Nur die Lohnabrechnungen; Arbeitszeiten müssen nicht erfasst werden, da bei Taxifahrern Vertrauensarbeitszeit gilt (§ 3 ArbZG)."], "richtig": 1, "erklaerung": "Er muss Beginn, Ende und Dauer der Arbeitszeit aufzeichnen sowie Lohnkonten und Entgeltunterlagen führen (§ 17 MiLoG, § 16 ArbZG, § 41 EStG, § 28f SGB IV).", "schwierigkeit": "mittel"}, {"id": 1221, "gesetz": "HGB_BGB", "frage": "#1221 Muss ein Taxiunternehmer eine Bilanz erstellen?", "antworten": ["Ja, Kaufleute müssen stets bilanzieren; Befreiungen kennt das HGB nicht (§ 242 HGB).", "Nein, nur Kapitalgesellschaften müssen bilanzieren; Einzelkaufleute und Personengesellschaften dürfen immer eine EÜR erstellen (§ 4 Abs. 3 EStG).", "Ja, wenn er Kaufmann ist; Einzelkaufleute mit nicht mehr als 800.000 € Umsatz und 80.000 € Jahresüberschuss sind befreit (§§ 241a, 242 HGB)."], "richtig": 2, "erklaerung": "Ja, wenn er Kaufmann ist; Einzelkaufleute mit nicht mehr als 800.000 € Umsatz und 80.000 € Jahresüberschuss sind befreit (§§ 241a, 242 HGB).", "schwierigkeit": "schwer"}, {"id": 1222, "gesetz": "HGB_BGB", "frage": "#1222 Welche Formvorschriften gelten für Taxi-Unternehmen im HGB?", "antworten": ["Auf Geschäftsbriefen eingetragener Kaufleute müssen Firma, Rechtsformzusatz, Ort der Niederlassung, Registergericht und Registernummer angegeben werden (§ 37a HGB).", "Auf Geschäftsbriefen muss nur der Name des Inhabers und die Steuernummer stehen (§ 37a HGB).", "Geschäftsbriefe müssen handschriftlich unterschrieben und mit dem Siegel der IHK versehen werden (§ 126 BGB)."], "richtig": 0, "erklaerung": "Auf Geschäftsbriefen eingetragener Kaufleute müssen Firma, Rechtsformzusatz, Ort der Niederlassung, Registergericht und Registernummer angegeben werden (§ 37a HGB).", "schwierigkeit": "leicht"}, {"id": 1223, "gesetz": "HGB_BGB", "frage": "#1223 Welche Vorschriften gelten für eine offene Handelsgesellschaft (OHG) im Taxi-Gewerbe?", "antworten": ["Die Gesellschafter haften für die Verbindlichkeiten der OHG persönlich, unbeschränkt und als Gesamtschuldner (§ 126 HGB).", "Die Gesellschafter haften nur mit ihrer Einlage; das Privatvermögen ist geschützt (§ 171 HGB).", "Nur der geschäftsführende Gesellschafter haftet unbeschränkt, die übrigen nachrangig und nur bis zur Höhe ihrer Beteiligung (§ 128 HGB)."], "richtig": 0, "erklaerung": "Die Gesellschafter haften für die Verbindlichkeiten der OHG persönlich, unbeschränkt und als Gesamtschuldner (§ 126 HGB).", "schwierigkeit": "mittel"}, {"id": 1224, "gesetz": "HGB_BGB", "frage": "#1224 Welche Vorteile hat eine GmbH im Taxi-Gewerbe?", "antworten": ["Der Geschäftsführer haftet nie persönlich, auch nicht bei Insolvenzverschleppung (§ 15a InsO).", "Die Haftung ist auf das Gesellschaftsvermögen begrenzt (§ 13 GmbHG).", "Die GmbH ist von der Gewerbesteuer befreit und benötigt kein Stammkapital (§ 5 GmbHG)."], "richtig": 1, "erklaerung": "Die Haftung ist auf das Gesellschaftsvermögen begrenzt (§ 13 GmbHG).", "schwierigkeit": "schwer"}, {"id": 1225, "gesetz": "HGB_BGB", "frage": "#1225 Wann kann ein Taxiunternehmen einen Schadenersatzanspruch gegen einen Geschäftspartner geltend machen?", "antworten": ["Bei jeder Verzögerung ohne weitere Voraussetzungen, auch wenn der Partner nichts dafür kann (§ 276 BGB).", "Bei Pflichtverletzung oder Vertragsbruch (§ 280 BGB).", "Nur bei einem schriftlich vereinbarten Vertragsstrafenversprechen; ohne dieses besteht kein Anspruch (§ 339 BGB)."], "richtig": 1, "erklaerung": "Bei Pflichtverletzung oder Vertragsbruch (§ 280 BGB).", "schwierigkeit": "leicht"}, {"id": 1226, "gesetz": "HGB_BGB", "frage": "#1226 Wann gilt ein Taxiunternehmen als Handelsgesellschaft?", "antworten": ["Wenn es mehr als drei Fahrzeuge betreibt; die Rechtsform ist dabei unerheblich (§ 1 HGB).", "Wenn es als GbR oder als Einzelunternehmen im Handelsregister eingetragen ist (§ 105 HGB, § 705 BGB).", "Wenn es als OHG oder KG (gemeinsames Handelsgewerbe unter gemeinsamer Firma) oder als Kapitalgesellschaft wie die GmbH geführt wird (§§ 6, 105 HGB, § 13 Abs. 3 GmbHG)."], "richtig": 2, "erklaerung": "Wenn es als OHG oder KG (gemeinsames Handelsgewerbe unter gemeinsamer Firma) oder als Kapitalgesellschaft wie die GmbH geführt wird (§§ 6, 105 HGB, § 13 Abs. 3 GmbHG).", "schwierigkeit": "mittel"}, {"id": 1227, "gesetz": "HGB_BGB", "frage": "#1227 Welche Anforderungen gelten für die Rechnungslegung eines Taxiunternehmens?", "antworten": ["Es gelten die allgemeinen Buchführungspflichten nach HGB und UStG (§ 238 HGB).", "Es gilt ausschließlich die Einnahmen-Überschuss-Rechnung nach EStG; das HGB ist auf Taxiunternehmen nicht anwendbar (§ 4 Abs. 3 EStG).", "Es genügt eine formlose Zettelwirtschaft; Buchführungspflichten bestehen nur für Kapitalgesellschaften (§ 41 EStG)."], "richtig": 0, "erklaerung": "Es gelten die allgemeinen Buchführungspflichten nach HGB und UStG (§ 238 HGB).", "schwierigkeit": "schwer"}, {"id": 1228, "gesetz": "HGB_BGB", "frage": "#1228 Welche Bedeutung hat das Handelsregister für Taxiunternehmen?", "antworten": ["Es ersetzt die Gewerbeanmeldung und die Genehmigung nach dem PBefG (§ 8 HGB).", "Es wird von der IHK geführt und enthält die Taxikonzessionen aller Unternehmen (§ 8 HGB).", "Es dokumentiert die wichtigsten rechtlichen Tatsachen über das Unternehmen (§ 8 HGB)."], "richtig": 2, "erklaerung": "Es dokumentiert die wichtigsten rechtlichen Tatsachen über das Unternehmen (§ 8 HGB).", "schwierigkeit": "leicht"}, {"id": 1229, "gesetz": "HGB_BGB", "frage": "#1229 Kann ein Taxiunternehmen einen Handelsvertreter beschäftigen?", "antworten": ["Ja, der Handelsvertreter vermittelt Fahrdienste und erhält Provision (§ 84 HGB).", "Ja, der Handelsvertreter ist weisungsgebundener Arbeitnehmer mit Festgehalt und Urlaubsanspruch (§ 59 HGB).", "Nein, Handelsvertreter dürfen nur im Warenhandel tätig sein; für Dienstleistungen sind sie nicht zugelassen (§ 84 HGB)."], "richtig": 0, "erklaerung": "Ja, der Handelsvertreter vermittelt Fahrdienste und erhält Provision (§ 84 HGB).", "schwierigkeit": "mittel"}, {"id": 1230, "gesetz": "HGB_BGB", "frage": "#1230 Welche Folgen hat eine Insolvenz eines Taxiunternehmens?", "antworten": ["Mit dem Antrag auf Eröffnung erlöschen sofort sämtliche Arbeitsverträge und die Taxigenehmigung (§ 113 InsO).", "Das Unternehmen bleibt in der Verwaltung des Unternehmers; der Insolvenzverwalter hat stets nur ein Kontrollrecht (§ 270 InsO).", "Mit Eröffnung des Insolvenzverfahrens verliert der Unternehmer die Verwaltungs- und Verfügungsbefugnis über sein Vermögen; sie geht auf den Insolvenzverwalter über (§ 80 InsO)."], "richtig": 2, "erklaerung": "Mit Eröffnung des Insolvenzverfahrens verliert der Unternehmer die Verwaltungs- und Verfügungsbefugnis über sein Vermögen; sie geht auf den Insolvenzverwalter über (§ 80 InsO).", "schwierigkeit": "schwer"}, {"id": 1251, "gesetz": "UStG", "frage": "#1251 Welche steuerlichen Regelungen gelten für Taxiunternehmen hinsichtlich der Umsatzsteuer?", "antworten": ["Taxiunternehmen sind als Personenverkehr von der Umsatzsteuer befreit und müssen nur Lohnsteuer abführen (§ 4 UStG).", "Sie müssen Umsatzsteuer nur auf Fahrten über 50 km erheben; Kurzstrecken sind steuerfrei (§ 12 UStG).", "Taxiunternehmen unterliegen der Umsatzsteuerpflicht und müssen je nach Leistungsart den regulären oder ermäßigten Steuersatz anwenden (§ 1 UStG)."], "richtig": 2, "erklaerung": "Taxiunternehmen unterliegen der Umsatzsteuerpflicht und müssen je nach Leistungsart den regulären oder ermäßigten Steuersatz anwenden (§ 1 UStG).", "schwierigkeit": "leicht"}, {"id": 1252, "gesetz": "UStG", "frage": "#1252 Welcher Umsatzsteuersatz gilt für Taxifahrten innerhalb einer Stadt?", "antworten": ["Der ermäßigte Umsatzsteuersatz von 7 % gilt für Taxifahrten innerhalb einer Gemeinde oder bis zu einer Strecke von 50 km (§ 12 Abs. 2 Nr. 10 UStG).", "Der Regelsteuersatz von 19 % gilt, da Fahrten innerhalb einer Stadt als Ortsverkehr nicht begünstigt sind (§ 12 Abs. 1 UStG).", "Der ermäßigte Satz von 7 % gilt für alle Taxifahrten unabhängig von der Entfernung (§ 12 Abs. 2 Nr. 10 UStG)."], "richtig": 0, "erklaerung": "Der ermäßigte Umsatzsteuersatz von 7 % gilt für Taxifahrten innerhalb einer Gemeinde oder bis zu einer Strecke von 50 km (§ 12 Abs. 2 Nr. 10 UStG).", "schwierigkeit": "mittel"}, {"id": 1253, "gesetz": "UStG", "frage": "#1253 Wann gilt der reguläre Umsatzsteuersatz von 19 % für Taxifahrten?", "antworten": ["Wenn die Fahrt die Gemeindegrenze überschreitet und die Beförderungsstrecke mehr als 50 km beträgt (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "Wenn die Beförderungsstrecke mehr als 100 km beträgt oder die Landesgrenze überschritten wird (§ 12 Abs. 2 Nr. 10 UStG).", "Sobald die Fahrt die Gemeindegrenze überschreitet, unabhängig von der Länge der Strecke (§ 12 Abs. 2 Nr. 10 UStG)."], "richtig": 0, "erklaerung": "Wenn die Fahrt die Gemeindegrenze überschreitet und die Beförderungsstrecke mehr als 50 km beträgt (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "schwierigkeit": "schwer"}, {"id": 1254, "gesetz": "UStG", "frage": "#1254 Welche steuerliche Besonderheit gilt für Mietwagenunternehmen im Gegensatz zu Taxiunternehmen?", "antworten": ["Mietwagen sind umsatzsteuerfrei, da sie als Unternehmerleistung gelten, während Taxis 7 % abführen müssen (§ 4 UStG).", "Mietwagenfahrten unterliegen bis 50 km dem ermäßigten Satz von 7 %, wie Taxifahrten (§ 12 Abs. 2 Nr. 10 UStG).", "Mietwagenfahrten unterliegen immer dem regulären Steuersatz von 19 %, da § 12 Abs. 2 Nr. 10 UStG nur den Verkehr mit Taxen begünstigt (§ 12 Abs. 1 UStG)."], "richtig": 2, "erklaerung": "Mietwagenfahrten unterliegen immer dem regulären Steuersatz von 19 %, da § 12 Abs. 2 Nr. 10 UStG nur den Verkehr mit Taxen begünstigt (§ 12 Abs. 1 UStG).", "schwierigkeit": "leicht"}, {"id": 1255, "gesetz": "UStG", "frage": "#1255 Müssen Taxiunternehmen Umsatzsteuer auf Trinkgelder erheben?", "antworten": ["Trinkgeld ist immer steuerpflichtig, auch wenn angestellte Fahrer es für sich behalten (§ 10 UStG).", "Trinkgeld ist generell umsatzsteuerfrei, auch wenn es dem Unternehmer zufließt (§ 4 UStG).", "Trinkgeld, das der Unternehmer selbst erhält, gehört zum Entgelt und ist umsatzsteuerpflichtig; Trinkgeld, das angestellte Fahrer für sich behalten, nicht (§ 10 Abs. 1 UStG)."], "richtig": 2, "erklaerung": "Trinkgeld, das der Unternehmer selbst erhält, gehört zum Entgelt und ist umsatzsteuerpflichtig; Trinkgeld, das angestellte Fahrer für sich behalten, nicht (§ 10 Abs. 1 UStG).", "schwierigkeit": "mittel"}, {"id": 1256, "gesetz": "UStG", "frage": "#1256 Welche steuerlichen Pflichten hat ein Taxiunternehmer bezüglich Rechnungen?", "antworten": ["Bei Fahrten für Unternehmer muss er innerhalb von sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen; bis 250 € genügt eine Kleinbetragsrechnung (§ 14 UStG, § 33 UStDV).", "Er muss spätestens am Tag der Fahrt eine Rechnung aushändigen; eine vereinfachte Rechnung ist nie zulässig (§ 14 UStG).", "Er muss innerhalb von drei Monaten eine Rechnung ausstellen; Kleinbeträge bis 150 € genügen mit Quittung (§ 14 UStG)."], "richtig": 0, "erklaerung": "Bei Fahrten für Unternehmer muss er innerhalb von sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen; bis 250 € genügt eine Kleinbetragsrechnung (§ 14 UStG, § 33 UStDV).", "schwierigkeit": "schwer"}, {"id": 1257, "gesetz": "UStG", "frage": "#1257 Welche Angaben müssen auf einer ordnungsgemäßen Taxi-Rechnung stehen?", "antworten": ["Nur Name des Unternehmers, Fahrtdatum und Gesamtbetrag; Steuersatz und Steuerbetrag sind nie anzugeben (§ 14 UStG).", "Neben Datum und Betrag das amtliche Kennzeichen, die Konzessionsnummer und die Tarifstufe (§ 51 PBefG).", "Name und Anschrift von Unternehmer und Kunde, Steuernummer oder USt-IdNr., Datum, Rechnungsnummer, Leistung und Leistungszeitpunkt, Entgelt, Steuersatz und Steuerbetrag (§ 14 Abs. 4 UStG); bis 250 € verkürzt (§ 33 UStDV)."], "richtig": 2, "erklaerung": "Name und Anschrift von Unternehmer und Kunde, Steuernummer oder USt-IdNr., Datum, Rechnungsnummer, Leistung und Leistungszeitpunkt, Entgelt, Steuersatz und Steuerbetrag (§ 14 Abs. 4 UStG); bis 250 € verkürzt (§ 33 UStDV).", "schwierigkeit": "leicht"}, {"id": 1258, "gesetz": "UStG", "frage": "#1258 Darf ein Taxiunternehmen die Vorsteuer aus seinen Betriebsausgaben abziehen?", "antworten": ["Nein, Vorsteuer ist im Personenverkehr ausgeschlossen, weil der ermäßigte Steuersatz gilt (§ 15 Abs. 2 UStG).", "Ja, sofern es kein Kleinunternehmer ist und die Eingangsleistungen für das Unternehmen verwendet werden (§ 15 UStG).", "Ja, aber nur für Fahrzeuganschaffungen; laufende Kosten wie Treibstoff und Reparaturen sind nicht abziehbar (§ 15 UStG)."], "richtig": 1, "erklaerung": "Ja, sofern es kein Kleinunternehmer ist und die Eingangsleistungen für das Unternehmen verwendet werden (§ 15 UStG).", "schwierigkeit": "mittel"}, {"id": 1259, "gesetz": "UStG", "frage": "#1259 Kann ein Taxiunternehmen die Kleinunternehmerregelung nutzen?", "antworten": ["Ja, aber nur bei einem Fahrzeug; der Umsatz im Vorjahr darf 50.000 € nicht übersteigen (§ 19 UStG).", "Ja, wenn der Umsatz im Vorjahr 25.000 € und im laufenden Jahr 100.000 € nicht übersteigt (§ 19 UStG).", "Nein, Taxiunternehmen sind wegen der Genehmigungspflicht nach dem PBefG von der Kleinunternehmerregelung ausgeschlossen (§ 19 UStG)."], "richtig": 1, "erklaerung": "Ja, wenn der Umsatz im Vorjahr 25.000 € und im laufenden Jahr 100.000 € nicht übersteigt (§ 19 UStG).", "schwierigkeit": "schwer"}, {"id": 1260, "gesetz": "UStG", "frage": "#1260 Welche steuerlichen Vorteile und Nachteile hat die Kleinunternehmerregelung für ein Taxiunternehmen?", "antworten": ["Vorteil: Ermäßigter Steuersatz von 7 % auf alle Fahrten. Nachteil: Pflicht zur Bilanzierung (§ 19 UStG).", "Vorteil: Der Vorsteuerabzug erhöht sich um 10 %. Nachteil: Monatliche Voranmeldungen (§ 18 UStG).", "Vorteil: Keine Umsatzsteuerabführung an das Finanzamt. Nachteil: Kein Vorsteuerabzug möglich (§ 19 UStG)."], "richtig": 2, "erklaerung": "Vorteil: Keine Umsatzsteuerabführung an das Finanzamt. Nachteil: Kein Vorsteuerabzug möglich (§ 19 UStG).", "schwierigkeit": "leicht"}, {"id": 1261, "gesetz": "UStG", "frage": "#1261 Was gilt als steuerbarer Umsatz im Taxi- und Mietwagenverkehr?", "antworten": ["Nur Fahrten über Gemeindegrenzen hinaus; Fahrten innerhalb der Gemeinde sind nicht steuerbar (§ 3b UStG).", "Alle Beförderungsleistungen gegen Entgelt im Inland unterliegen der Umsatzsteuer (§ 1 Abs. 1 UStG).", "Nur unentgeltliche Beförderungen, etwa Fahrten für Angehörige oder Mitarbeiter (§ 3 Abs. 9a UStG)."], "richtig": 1, "erklaerung": "Alle Beförderungsleistungen gegen Entgelt im Inland unterliegen der Umsatzsteuer (§ 1 Abs. 1 UStG).", "schwierigkeit": "mittel"}, {"id": 1262, "gesetz": "UStG", "frage": "#1262 Wann entsteht die Umsatzsteuerpflicht bei Taxiunternehmen?", "antworten": ["Mit Ausstellung der Rechnung, unabhängig vom Zeitpunkt der Fahrt oder der Zahlung (§ 14 UStG).", "Erst mit Ablauf des Kalenderjahres, in dem die Fahrt ausgeführt wurde (§ 18 Abs. 3 UStG).", "Mit Ablauf des Voranmeldungszeitraums, in dem die Fahrt ausgeführt (Soll-Besteuerung) bzw. bei Ist-Besteuerung das Entgelt vereinnahmt wurde (§ 13 Abs. 1 Nr. 1 UStG)."], "richtig": 2, "erklaerung": "Mit Ablauf des Voranmeldungszeitraums, in dem die Fahrt ausgeführt (Soll-Besteuerung) bzw. bei Ist-Besteuerung das Entgelt vereinnahmt wurde (§ 13 Abs. 1 Nr. 1 UStG).", "schwierigkeit": "schwer"}, {"id": 1263, "gesetz": "UStG", "frage": "#1263 Wie oft müssen Taxiunternehmen ihre Umsatzsteuervoranmeldung abgeben?", "antworten": ["Monatlich für alle Unternehmen; eine Befreiung von der Voranmeldung ist ausgeschlossen (§ 18 UStG).", "Jährlich bis zum 31. Mai des Folgejahres; Voranmeldungen entfallen bei Taxiunternehmen (§ 18 Abs. 3 UStG).", "Vierteljährlich; monatlich, wenn die Umsatzsteuer des Vorjahres mehr als 9.000 € betrug; bei bis zu 2.000 € ist eine Befreiung möglich (§ 18 Abs. 2 UStG)."], "richtig": 2, "erklaerung": "Vierteljährlich; monatlich, wenn die Umsatzsteuer des Vorjahres mehr als 9.000 € betrug; bei bis zu 2.000 € ist eine Befreiung möglich (§ 18 Abs. 2 UStG).", "schwierigkeit": "leicht"}, {"id": 1264, "gesetz": "UStG", "frage": "#1264 Was passiert, wenn ein Taxiunternehmer keine Umsatzsteuer anmeldet?", "antworten": ["Es drohen Nachzahlungen, Zinsen und ggf. Bußgelder (§ 26a UStG).", "Das Finanzamt entzieht sofort die Taxigenehmigung und verhängt ein Berufsverbot (§ 25 PBefG).", "Nichts, da die Umsatzsteuer erst mit der Einkommensteuererklärung festgesetzt wird (§ 25 EStG)."], "richtig": 0, "erklaerung": "Es drohen Nachzahlungen, Zinsen und ggf. Bußgelder (§ 26a UStG).", "schwierigkeit": "mittel"}, {"id": 1265, "gesetz": "UStG", "frage": "#1265 Welche steuerlichen Verpflichtungen hat ein Taxiunternehmen gegenüber dem Finanzamt?", "antworten": ["Nur die Jahressteuererklärung; Voranmeldungen und Aufzeichnungen sind nur für Mietwagenunternehmen vorgeschrieben (§ 18 UStG).", "Umsatzsteuervoranmeldungen, Jahressteuererklärung und ordnungsgemäße Aufzeichnungen (§§ 18, 22 UStG).", "Anmeldung der Fahrzeuge beim Finanzamt, Abgabe der Fahrtenbücher und Zahlung der Kfz-Steuer (§ 1 KraftStG)."], "richtig": 1, "erklaerung": "Umsatzsteuervoranmeldungen, Jahressteuererklärung und ordnungsgemäße Aufzeichnungen (§§ 18, 22 UStG).", "schwierigkeit": "schwer"}, {"id": 1266, "gesetz": "UStG", "frage": "#1266 Wann darf ein Taxiunternehmen die vereinnahmten Entgelte als Besteuerungsgrundlage nutzen?", "antworten": ["Auf Antrag beim Finanzamt (Ist-Besteuerung), wenn der Gesamtumsatz im Vorjahr nicht mehr als 800.000 € betrug (§ 20 UStG).", "Automatisch bei jedem Unternehmen; ein Antrag ist nicht erforderlich (§ 20 UStG).", "Nur Kleinunternehmer mit einem Gesamtumsatz bis 25.000 € dürfen die Ist-Besteuerung nutzen (§ 19 UStG)."], "richtig": 0, "erklaerung": "Auf Antrag beim Finanzamt (Ist-Besteuerung), wenn der Gesamtumsatz im Vorjahr nicht mehr als 800.000 € betrug (§ 20 UStG).", "schwierigkeit": "leicht"}, {"id": 1267, "gesetz": "UStG", "frage": "#1267 Wann kann ein Taxiunternehmen die Soll-Besteuerung nutzen?", "antworten": ["Die Soll-Besteuerung (nach vereinbarten Entgelten) ist der Regelfall; sie gilt immer, wenn keine Ist-Besteuerung genehmigt wurde (§ 16 Abs. 1 UStG).", "Nur auf Antrag beim Finanzamt, wenn der Gesamtumsatz im Vorjahr höchstens 800.000 € betrug (§ 20 UStG).", "Nur wenn das Unternehmen bilanziert und im Handelsregister eingetragen ist (§ 242 HGB)."], "richtig": 0, "erklaerung": "Die Soll-Besteuerung (nach vereinbarten Entgelten) ist der Regelfall; sie gilt immer, wenn keine Ist-Besteuerung genehmigt wurde (§ 16 Abs. 1 UStG).", "schwierigkeit": "mittel"}, {"id": 1268, "gesetz": "UStG", "frage": "#1268 Darf ein Taxiunternehmen die Umsatzsteuer auf Fahrten ins Ausland erheben?", "antworten": ["Ja, aber nur, wenn der Fahrgast seinen Wohnsitz im Inland hat; sonst entfällt die Steuer (§ 3a UStG).", "Ja, für den inländischen Streckenanteil; nur der im Ausland zurückgelegte Teil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG).", "Nein, Fahrten ins Ausland sind insgesamt nicht steuerbar, sobald die Grenze überschritten wird (§ 3b UStG)."], "richtig": 1, "erklaerung": "Ja, für den inländischen Streckenanteil; nur der im Ausland zurückgelegte Teil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG).", "schwierigkeit": "schwer"}, {"id": 1269, "gesetz": "UStG", "frage": "#1269 Welche steuerlichen Regelungen gelten für den Verkauf eines Taxi-Fahrzeugs?", "antworten": ["Der Verkauf unterliegt der Umsatzsteuer, sofern kein Privatverkauf vorliegt (§ 3 UStG).", "Der Verkauf unterliegt der Umsatzsteuer nur, wenn der Käufer ebenfalls Taxiunternehmer ist (§ 2 UStG).", "Der Verkauf ist stets steuerfrei, da es sich um Anlagevermögen handelt (§ 4 UStG)."], "richtig": 0, "erklaerung": "Der Verkauf unterliegt der Umsatzsteuer, sofern kein Privatverkauf vorliegt (§ 3 UStG).", "schwierigkeit": "leicht"}, {"id": 1270, "gesetz": "UStG", "frage": "#1270 Wie wird die Umsatzsteuer bei Leasingfahrzeugen für Taxiunternehmen behandelt?", "antworten": ["Die monatlichen Leasingraten enthalten Umsatzsteuer, die als Vorsteuer abziehbar ist (§ 15 UStG).", "Die Umsatzsteuer aus Leasingraten ist nicht abziehbar, da der Leasinggeber Eigentümer des Fahrzeugs bleibt (§ 15 UStG).", "Leasingraten sind umsatzsteuerfrei, weil Leasing als Finanzierung gilt (§ 4 Nr. 8 UStG)."], "richtig": 0, "erklaerung": "Die monatlichen Leasingraten enthalten Umsatzsteuer, die als Vorsteuer abziehbar ist (§ 15 UStG).", "schwierigkeit": "mittel"}, {"id": 1271, "gesetz": "UStG", "frage": "#1271 Wie wird der Vorsteuerabzug bei gemischt genutzten Fahrzeugen im Taxi-Gewerbe geregelt?", "antworten": ["Die Vorsteuer ist stets nur anteilig nach dem Verhältnis von betrieblicher zu privater Nutzung abziehbar; die Privatnutzung bleibt unbesteuert (§ 15 Abs. 4 UStG).", "Bei mindestens 10 % betrieblicher Nutzung kann das Fahrzeug dem Unternehmen zugeordnet und die Vorsteuer voll abgezogen werden; die Privatnutzung ist dann als unentgeltliche Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG).", "Erst ab 50 % betrieblicher Nutzung ist die Zuordnung zum Unternehmen möglich; die Vorsteuer wird dann voll abgezogen (§ 15 Abs. 1 UStG)."], "richtig": 1, "erklaerung": "Bei mindestens 10 % betrieblicher Nutzung kann das Fahrzeug dem Unternehmen zugeordnet und die Vorsteuer voll abgezogen werden; die Privatnutzung ist dann als unentgeltliche Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG).", "schwierigkeit": "schwer"}, {"id": 1272, "gesetz": "UStG", "frage": "#1272 Wie werden Gutscheine für Taxifahrten umsatzsteuerlich behandelt?", "antworten": ["Gutscheine sind als gesetzliches Zahlungsmittel stets umsatzsteuerfrei, auch bei Einlösung (§ 4 UStG).", "Einzweck-Gutscheine unterliegen bereits bei Ausgabe der Umsatzsteuer, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 UStG).", "Alle Gutscheine unterliegen erst bei Einlösung der Umsatzsteuer, unabhängig vom Gutscheintyp (§ 13 UStG)."], "richtig": 1, "erklaerung": "Einzweck-Gutscheine unterliegen bereits bei Ausgabe der Umsatzsteuer, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 UStG).", "schwierigkeit": "leicht"}, {"id": 1273, "gesetz": "UStG", "frage": "#1273 Welche Umsatzsteuerregelungen gelten für die Personenbeförderung in Mietwagen?", "antworten": ["Mietwagenleistungen sind als Personenbeförderung nach § 4 UStG steuerfrei, wenn die Fahrt vorbestellt wurde.", "Für Mietwagen gilt 7 % bis 50 km, darüber 19 %, wie bei Taxen (§ 12 Abs. 2 Nr. 10 UStG).", "Mietwagenleistungen unterliegen grundsätzlich dem vollen Steuersatz von 19 % (§ 12 UStG)."], "richtig": 2, "erklaerung": "Mietwagenleistungen unterliegen grundsätzlich dem vollen Steuersatz von 19 % (§ 12 UStG).", "schwierigkeit": "mittel"}, {"id": 1274, "gesetz": "UStG", "frage": "#1274 Was passiert mit der Umsatzsteuer, wenn ein Taxiunternehmen steuerfreie Umsätze hat?", "antworten": ["Der Vorsteuerabzug kann anteilig entfallen (§ 15 Abs. 2 UStG).", "Das Unternehmen gilt insgesamt als Kleinunternehmer und ist von der Umsatzsteuer befreit (§ 19 UStG).", "Der Vorsteuerabzug bleibt stets in voller Höhe erhalten, unabhängig von der Art der Umsätze (§ 15 Abs. 1 UStG)."], "richtig": 0, "erklaerung": "Der Vorsteuerabzug kann anteilig entfallen (§ 15 Abs. 2 UStG).", "schwierigkeit": "schwer"}, {"id": 1275, "gesetz": "UStG", "frage": "#1275 Wann kann ein Taxiunternehmen auf die Steuerbefreiung nach § 4 UStG verzichten?", "antworten": ["Nur bei den in § 9 UStG genannten Umsätzen (z. B. Vermietung von Grundstücken) an andere Unternehmer für deren Unternehmen, um den Vorsteuerabzug zu erhalten (§ 9 Abs. 1 UStG).", "Jederzeit durch formlose Erklärung gegenüber jedem Kunden, auch bei Umsätzen an Privatpersonen (§ 9 UStG).", "Nie; ein Verzicht auf Steuerbefreiungen ist im Umsatzsteuerrecht ausgeschlossen (§ 4 UStG)."], "richtig": 0, "erklaerung": "Nur bei den in § 9 UStG genannten Umsätzen (z. B. Vermietung von Grundstücken) an andere Unternehmer für deren Unternehmen, um den Vorsteuerabzug zu erhalten (§ 9 Abs. 1 UStG).", "schwierigkeit": "leicht"}, {"id": 1276, "gesetz": "UStG", "frage": "#1276 Was ist die Differenzbesteuerung, und gilt sie für Taxiunternehmen?", "antworten": ["Sie ist die Besteuerung nach vereinnahmten Entgelten und gilt für Taxiunternehmen bis 800.000 € Umsatz (§ 20 UStG).", "Sie gilt für alle Unternehmer, die Fahrzeuge verkaufen, auch für Taxiunternehmen beim Verkauf ihrer Taxen (§ 25a UStG).", "Sie gilt für Gebrauchtwarenhändler, aber nicht für Taxiunternehmen, da sie regelmäßig Dienstleistungen erbringen (§ 25a UStG)."], "richtig": 2, "erklaerung": "Sie gilt für Gebrauchtwarenhändler, aber nicht für Taxiunternehmen, da sie regelmäßig Dienstleistungen erbringen (§ 25a UStG).", "schwierigkeit": "mittel"}, {"id": 1277, "gesetz": "UStG", "frage": "#1277 Welche Rolle spielt die Umsatzsteuer-Identifikationsnummer (USt-IdNr.) für Taxiunternehmen?", "antworten": ["Sie ist für innergemeinschaftliche Geschäfte erforderlich, aber im Inland meist nicht nötig (§ 27a UStG).", "Sie ersetzt die Steuernummer und wird vom Landkreis bei Erteilung der Taxigenehmigung vergeben (§ 27a UStG).", "Sie ist für jedes Taxiunternehmen Pflicht und muss auf jeder Fahrgastquittung stehen (§ 14 UStG)."], "richtig": 0, "erklaerung": "Sie ist für innergemeinschaftliche Geschäfte erforderlich, aber im Inland meist nicht nötig (§ 27a UStG).", "schwierigkeit": "schwer"}, {"id": 1278, "gesetz": "UStG", "frage": "#1278 Welche steuerlichen Regelungen gelten für Fahrten im Rahmen von Krankenbeförderungen?", "antworten": ["Krankenfahrten sind nur steuerfrei, wenn die Krankenkasse direkt abrechnet; bei Selbstzahlern entfällt die Befreiung (§ 4 Nr. 14 UStG).", "Nur Beförderungen kranker oder verletzter Personen in besonders dafür eingerichteten Fahrzeugen sind steuerfrei; Krankenfahrten im normalen Taxi sind steuerpflichtig (§ 4 Nr. 17 Buchst. b UStG).", "Krankenbeförderungen unterliegen stets dem Regelsteuersatz von 19 %; eine Steuerbefreiung gibt es nicht (§ 12 Abs. 1 UStG)."], "richtig": 1, "erklaerung": "Nur Beförderungen kranker oder verletzter Personen in besonders dafür eingerichteten Fahrzeugen sind steuerfrei; Krankenfahrten im normalen Taxi sind steuerpflichtig (§ 4 Nr. 17 Buchst. b UStG).", "schwierigkeit": "leicht"}, {"id": 1279, "gesetz": "UStG", "frage": "#1279 Darf ein Taxiunternehmer ohne Umsatzsteuer arbeiten, wenn er für gemeinnützige Zwecke fährt?", "antworten": ["Nein, Fahrten eines gewerblichen Taxiunternehmers bleiben auch im Auftrag gemeinnütziger Organisationen steuerpflichtig; § 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen (§ 4 Nr. 18 UStG).", "Ja, wenn der Taxiunternehmer die Einnahmen vollständig spendet; dann entfällt die Umsatzsteuer (§ 10b EStG).", "Ja, Fahrten für gemeinnützige Organisationen sind umsatzsteuerfrei, wenn eine Freistellungsbescheinigung des Finanzamts vorliegt (§ 4 Nr. 18 UStG)."], "richtig": 0, "erklaerung": "Nein, Fahrten eines gewerblichen Taxiunternehmers bleiben auch im Auftrag gemeinnütziger Organisationen steuerpflichtig; § 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen (§ 4 Nr. 18 UStG).", "schwierigkeit": "mittel"}, {"id": 1280, "gesetz": "UStG", "frage": "#1280 Wie werden steuerliche Fehler bei der Umsatzsteuer bereinigt?", "antworten": ["Nur durch einen Antrag auf Erlass beim Finanzamt; eine Berichtigung durch den Unternehmer selbst ist unzulässig (§ 227 AO).", "Fehlerhafte Voranmeldungen oder Erklärungen sind unverzüglich durch eine berichtigte Anmeldung zu korrigieren (§ 18 UStG, § 153 AO).", "Fehler müssen erst mit der Jahreserklärung des übernächsten Jahres korrigiert werden; eine sofortige Berichtigungspflicht besteht nicht (§ 149 AO)."], "richtig": 1, "erklaerung": "Fehlerhafte Voranmeldungen oder Erklärungen sind unverzüglich durch eine berichtigte Anmeldung zu korrigieren (§ 18 UStG, § 153 AO).", "schwierigkeit": "schwer"}, {"id": 1301, "gesetz": "UStDV", "frage": "#1301 Welche steuerlichen Vorschriften gelten für Taxi- und Mietwagenunternehmen laut UStDV?", "antworten": ["Die UStDV ergänzt das UStG und regelt die praktische Umsetzung, u. a. Rechnungsangaben, Fahrausweise, Nachweis- und Aufzeichnungspflichten (§§ 31–35, 63–65 UStDV).", "Die UStDV ersetzt das UStG für Kleinbetriebe und regelt dort den ermäßigten Steuersatz für Taxen (§ 12 UStDV).", "Die UStDV regelt Genehmigung und Tarife im Taxiverkehr und wird von den Ländern erlassen (§§ 39, 51 PBefG)."], "richtig": 0, "erklaerung": "Die UStDV ergänzt das UStG und regelt die praktische Umsetzung, u. a. Rechnungsangaben, Fahrausweise, Nachweis- und Aufzeichnungspflichten (§§ 31–35, 63–65 UStDV).", "schwierigkeit": "leicht"}, {"id": 1302, "gesetz": "UStDV", "frage": "#1302 Welche steuerlichen Nachweise müssen Taxiunternehmen für steuerfreie Umsätze führen?", "antworten": ["Der Nachweis richtet sich nach der jeweiligen Befreiung (z. B. Ausfuhr: §§ 8–13 UStDV); Taxifahrten sind in der Regel nicht steuerfrei. Steuerfreie Umsätze sind gesondert aufzuzeichnen (§ 22 UStG, § 63 UStDV).", "Es ist ein Nachweis der Beförderung durch Fahrtenbuch mit Ausweis des Fahrgastes zu führen; ohne diesen entfällt jede Steuerbefreiung (§ 17a UStDV).", "Taxiunternehmen müssen keine Nachweise führen; steuerfreie Umsätze müssen nicht gesondert aufgezeichnet werden (§ 22 UStG)."], "richtig": 0, "erklaerung": "Der Nachweis richtet sich nach der jeweiligen Befreiung (z. B. Ausfuhr: §§ 8–13 UStDV); Taxifahrten sind in der Regel nicht steuerfrei. Steuerfreie Umsätze sind gesondert aufzuzeichnen (§ 22 UStG, § 63 UStDV).", "schwierigkeit": "mittel"}, {"id": 1303, "gesetz": "UStDV", "frage": "#1303 Gilt der ermäßigte Umsatzsteuersatz von 7 % auch für Mietwagenunternehmen?", "antworten": ["Nein, Mietwagenunternehmen unterliegen immer dem regulären Umsatzsteuersatz von 19 %; begünstigt ist nur der Verkehr mit Taxen (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "Ja, wenn die Fahrt im Auftrag eines Unternehmers erfolgt und eine Rechnung ausgestellt wird (§ 14 UStG).", "Ja, Mietwagen werden wie Taxen mit 7 % besteuert, wenn die Fahrt innerhalb der Gemeinde bleibt (§ 12 Abs. 2 Nr. 10 UStG)."], "richtig": 0, "erklaerung": "Nein, Mietwagenunternehmen unterliegen immer dem regulären Umsatzsteuersatz von 19 %; begünstigt ist nur der Verkehr mit Taxen (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "schwierigkeit": "schwer"}, {"id": 1304, "gesetz": "UStDV", "frage": "#1304 Wie müssen Taxiunternehmen ihre Rechnungen ausstellen?", "antworten": ["Rechnungen sind nach den Vorgaben des Personenbeförderungsgesetzes auszustellen und müssen den Tarif der Genehmigungsbehörde enthalten (§ 39 PBefG).", "Es genügt stets eine formlose Quittung mit Betrag; Steuersatz und Rechnungsnummer sind nur auf Verlangen anzugeben (§ 14 UStG).", "Rechnungen müssen den Anforderungen der UStDV entsprechen und Angaben wie Steuersatz, Betrag und Rechnungsnummer enthalten (§§ 31-34 UStDV)."], "richtig": 2, "erklaerung": "Rechnungen müssen den Anforderungen der UStDV entsprechen und Angaben wie Steuersatz, Betrag und Rechnungsnummer enthalten (§§ 31-34 UStDV).", "schwierigkeit": "leicht"}, {"id": 1305, "gesetz": "UStDV", "frage": "#1305 Welche Vorschriften gibt es für Kleinbetragsrechnungen im Taxi- und Mietwagengewerbe?", "antworten": ["Vereinfachte Angaben sind nur bei Barzahlung bis 50 € zulässig; bei Kartenzahlung gilt immer die volle Rechnung (§ 34 UStDV).", "Bei einem Gesamtbetrag bis 150 € dürfen Name und Anschrift des Kunden entfallen, der Steuerbetrag muss aber getrennt ausgewiesen werden (§ 33 UStDV).", "Bei einem Gesamtbetrag bis 250 € sind vereinfachte Rechnungsangaben zulässig (§ 33 UStDV)."], "richtig": 2, "erklaerung": "Bei einem Gesamtbetrag bis 250 € sind vereinfachte Rechnungsangaben zulässig (§ 33 UStDV).", "schwierigkeit": "mittel"}, {"id": 1306, "gesetz": "UStDV", "frage": "#1306 Sind Fahrausweise im Taxigewerbe als Rechnungen anerkannt?", "antworten": ["Nein, Fahrausweise im Taxigewerbe gelten nie als Rechnung; es muss stets eine gesonderte Rechnung ausgestellt werden (§ 14 UStG).", "Nein, nur Fahrausweise der Eisenbahnen des Bundes gelten als Rechnungen (§ 34 UStDV).", "Ja, unter bestimmten Voraussetzungen gelten Fahrausweise als Rechnungen (§ 34 UStDV)."], "richtig": 2, "erklaerung": "Ja, unter bestimmten Voraussetzungen gelten Fahrausweise als Rechnungen (§ 34 UStDV).", "schwierigkeit": "schwer"}, {"id": 1307, "gesetz": "UStDV", "frage": "#1307 Welche Steuerpflichten hat ein Taxiunternehmen bei der Rechnungsstellung an Geschäftskunden?", "antworten": ["Er darf Rechnungen ohne Frist ausstellen, muss aber auf Verlangen sofort quittieren; E-Rechnungen sind bei Fahrten untersagt (§ 14 UStG).", "Er muss binnen sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen, grundsätzlich als E-Rechnung (Übergangsfristen); Kleinbetragsrechnungen und Fahrausweise sind ausgenommen (§ 14 UStG, §§ 33, 34 UStDV).", "Er muss innerhalb von 14 Tagen eine Papierrechnung ausstellen; die E-Rechnung ist nur für Behörden vorgeschrieben (§ 14 UStG)."], "richtig": 1, "erklaerung": "Er muss binnen sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen, grundsätzlich als E-Rechnung (Übergangsfristen); Kleinbetragsrechnungen und Fahrausweise sind ausgenommen (§ 14 UStG, §§ 33, 34 UStDV).", "schwierigkeit": "leicht"}, {"id": 1308, "gesetz": "UStDV", "frage": "#1308 Welche Besonderheiten gelten für die Buchführungspflicht von Taxiunternehmen?", "antworten": ["Taxiunternehmen müssen ihre Umsätze genau aufzeichnen und steuerlich nachweisen (§§ 63-65 UStDV).", "Taxiunternehmen sind von der Buchführung befreit, wenn sie ein Fahrtenbuch führen (§ 63 UStDV).", "Taxiunternehmen müssen jede Fahrt einzeln mit Fahrgastname und Anschrift aufzeichnen (§ 22 UStG)."], "richtig": 0, "erklaerung": "Taxiunternehmen müssen ihre Umsätze genau aufzeichnen und steuerlich nachweisen (§§ 63-65 UStDV).", "schwierigkeit": "mittel"}, {"id": 1309, "gesetz": "UStDV", "frage": "#1309 Was ist der buchmäßige Nachweis bei steuerfreien Leistungen?", "antworten": ["Die vierteljährliche Meldung steuerfreier Umsätze an das Finanzamt im Zuge der Voranmeldung (§ 18 UStG).", "Dokumentation über Art, Umfang und Empfänger der Leistung, um die Steuerbefreiung zu belegen (§ 21 UStDV).", "Eine Bescheinigung der IHK, dass das Unternehmen zur Umsatzsteuerbefreiung berechtigt ist (§ 4 UStG)."], "richtig": 1, "erklaerung": "Dokumentation über Art, Umfang und Empfänger der Leistung, um die Steuerbefreiung zu belegen (§ 21 UStDV).", "schwierigkeit": "schwer"}, {"id": 1310, "gesetz": "UStDV", "frage": "#1310 Welche steuerlichen Konsequenzen hat eine falsche Umsatzsteuererklärung für Taxiunternehmen?", "antworten": ["Falsche Angaben können zu Steuernachzahlungen, Bußgeldern oder Zinsforderungen führen (§ 26a UStG).", "Es drohen nur Verwarnungen; Bußgelder und Zinsen sind bei der Umsatzsteuer nicht vorgesehen (§ 26a UStG).", "Es droht der Entzug der Taxigenehmigung durch das Finanzamt (§ 25 PBefG)."], "richtig": 0, "erklaerung": "Falsche Angaben können zu Steuernachzahlungen, Bußgeldern oder Zinsforderungen führen (§ 26a UStG).", "schwierigkeit": "leicht"}, {"id": 1311, "gesetz": "UStDV", "frage": "#1311 Wann gilt eine Beförderungsleistung als im Inland steuerpflichtig?", "antworten": ["Wenn der Unternehmer seinen Sitz im Inland hat, ist die gesamte Fahrt steuerbar, auch im Ausland (§ 3a UStG).", "Soweit die Beförderung im Inland bewirkt wird; bei grenzüberschreitenden Fahrten ist nur der inländische Streckenanteil steuerbar (§ 3b Abs. 1 UStG, §§ 2–7 UStDV).", "Nur wenn Fahrer und Fahrgast Deutsche sind; für Ausländer entfällt die Besteuerung (§ 3a UStG)."], "richtig": 1, "erklaerung": "Soweit die Beförderung im Inland bewirkt wird; bei grenzüberschreitenden Fahrten ist nur der inländische Streckenanteil steuerbar (§ 3b Abs. 1 UStG, §§ 2–7 UStDV).", "schwierigkeit": "mittel"}, {"id": 1312, "gesetz": "UStDV", "frage": "#1312 Welche Regeln gelten für die Vorsteuerabzugsfähigkeit von Taxiunternehmen?", "antworten": ["Der Abzug ist nur für Fahrzeugkosten möglich; Bürokosten sind im Taxigewerbe ausgeschlossen (§ 15 Abs. 2 UStG).", "Unternehmer können die Vorsteuer abziehen, wenn die Leistung für das Unternehmen bezogen wurde und eine ordnungsgemäße Rechnung vorliegt (§ 15 Abs. 1 UStG).", "Die Vorsteuer ist nur abziehbar, wenn sie bar bezahlt wurde und der Lieferant im Handelsregister eingetragen ist (§ 15 UStG)."], "richtig": 1, "erklaerung": "Unternehmer können die Vorsteuer abziehen, wenn die Leistung für das Unternehmen bezogen wurde und eine ordnungsgemäße Rechnung vorliegt (§ 15 Abs. 1 UStG).", "schwierigkeit": "schwer"}, {"id": 1313, "gesetz": "UStDV", "frage": "#1313 Wann gilt eine Dauerfristverlängerung für die Umsatzsteuervoranmeldung?", "antworten": ["Auf Antrag verlängert sich die Frist um einen Monat; Monatszahler müssen dafür eine Sondervorauszahlung von 1/11 der Vorjahresvorauszahlungen leisten (§§ 46–48 UStDV).", "Die Frist verlängert sich automatisch um einen Monat für alle Unternehmer; die Sondervorauszahlung beträgt 10 % der Jahressteuer (§ 48 UStDV).", "Auf Antrag verlängert sich die Frist um drei Monate, ohne dass eine Sondervorauszahlung nötig ist (§ 46 UStDV)."], "richtig": 0, "erklaerung": "Auf Antrag verlängert sich die Frist um einen Monat; Monatszahler müssen dafür eine Sondervorauszahlung von 1/11 der Vorjahresvorauszahlungen leisten (§§ 46–48 UStDV).", "schwierigkeit": "leicht"}, {"id": 1314, "gesetz": "UStDV", "frage": "#1314 Wie wird die Umsatzsteuer bei Leasingfahrzeugen im Taxi-Gewerbe behandelt?", "antworten": ["Leasingraten enthalten Umsatzsteuer, die bei ordnungsgemäßer Rechnung als Vorsteuer abziehbar ist (§ 15 Abs. 1 UStG).", "Leasingraten sind umsatzsteuerfrei; ein Vorsteuerabzug entfällt deshalb (§ 4 Nr. 8 UStG).", "Der Vorsteuerabzug ist nur beim Kauf, nicht aber beim Leasing eines Fahrzeugs zulässig (§ 15 Abs. 1 UStG)."], "richtig": 0, "erklaerung": "Leasingraten enthalten Umsatzsteuer, die bei ordnungsgemäßer Rechnung als Vorsteuer abziehbar ist (§ 15 Abs. 1 UStG).", "schwierigkeit": "mittel"}, {"id": 1315, "gesetz": "UStDV", "frage": "#1315 Welche Anforderungen gelten für den Nachweis von steuerfreien Krankenfahrten?", "antworten": ["Krankenfahrten im Taxi sind steuerpflichtig; steuerfrei sind nur Beförderungen in besonders eingerichteten Fahrzeugen, deren Ausstattung nachzuweisen ist (§ 4 Nr. 17 Buchst. b UStG).", "Krankenfahrten sind nur steuerfrei, wenn die Krankenkasse direkt abrechnet; ein Nachweis ist nicht erforderlich (§ 4 Nr. 17 UStG).", "Alle Krankenfahrten sind steuerfrei; der Nachweis erfolgt durch das ärztliche Rezept (§ 4 Nr. 14 UStG)."], "richtig": 0, "erklaerung": "Krankenfahrten im Taxi sind steuerpflichtig; steuerfrei sind nur Beförderungen in besonders eingerichteten Fahrzeugen, deren Ausstattung nachzuweisen ist (§ 4 Nr. 17 Buchst. b UStG).", "schwierigkeit": "schwer"}, {"id": 1316, "gesetz": "UStDV", "frage": "#1316 Welche steuerlichen Regelungen gelten für innergemeinschaftliche Lieferungen von Taxi-Fahrzeugen?", "antworten": ["Unternehmer müssen den Gelangensnachweis erbringen (§§ 17a-17d UStDV).", "Sie sind stets steuerpflichtig; ein Nachweis ist nur bei Lieferungen in Drittländer nötig (§ 6 UStG).", "Der Nachweis erfolgt allein durch die Rechnung; ein Beleg über Transport oder Empfang ist nicht nötig (§ 14 UStG)."], "richtig": 0, "erklaerung": "Unternehmer müssen den Gelangensnachweis erbringen (§§ 17a-17d UStDV).", "schwierigkeit": "leicht"}, {"id": 1317, "gesetz": "UStDV", "frage": "#1317 Wann kann ein Taxiunternehmen die Steuerbefreiung für grenzüberschreitende Beförderungen nutzen?", "antworten": ["Nur bei Fahrten in EU-Länder; dann ist die gesamte Strecke steuerfrei (§ 4 Nr. 1 Buchst. b UStG).", "Immer vollständig; grenzüberschreitende Fahrten sind insgesamt steuerfrei (§ 4 Nr. 3 UStG).", "Gar nicht: Der inländische Streckenanteil ist steuerpflichtig, nur der Auslandsanteil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG)."], "richtig": 2, "erklaerung": "Gar nicht: Der inländische Streckenanteil ist steuerpflichtig, nur der Auslandsanteil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG).", "schwierigkeit": "mittel"}, {"id": 1318, "gesetz": "UStDV", "frage": "#1318 Welche steuerlichen Aufzeichnungspflichten haben Kleinunternehmer im Taxi-Gewerbe?", "antworten": ["Kleinunternehmer sind von allen Aufzeichnungen befreit; Rechnungen müssen den Steuerbetrag ausweisen (§ 19 UStG).", "Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV); in Rechnungen ist auf die Kleinunternehmerbefreiung hinzuweisen (§ 34a UStDV).", "Sie müssen Vorsteuerbeträge und Umsatzsteuer monatlich getrennt aufzeichnen und der Rechnung den Steuersatz beifügen (§ 22 UStG)."], "richtig": 1, "erklaerung": "Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV); in Rechnungen ist auf die Kleinunternehmerbefreiung hinzuweisen (§ 34a UStDV).", "schwierigkeit": "schwer"}, {"id": 1319, "gesetz": "UStDV", "frage": "#1319 Welche Regelungen gelten für Umsätze mit Gutscheinen im Taxigewerbe?", "antworten": ["Gutscheine sind als Zahlungsmittel stets umsatzsteuerfrei; nur bar bezahlte Fahrten werden besteuert (§ 4 UStG).", "Einzweck-Gutscheine unterliegen der Umsatzsteuer bereits bei Ausgabe, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 Abs. 13–15 UStG).", "Die Umsatzsteuer entsteht bei Gutscheinen erst, wenn der Gutschein verfällt (§ 13 UStG)."], "richtig": 1, "erklaerung": "Einzweck-Gutscheine unterliegen der Umsatzsteuer bereits bei Ausgabe, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 Abs. 13–15 UStG).", "schwierigkeit": "leicht"}, {"id": 1320, "gesetz": "UStDV", "frage": "#1320 Was passiert, wenn ein Taxiunternehmen irrtümlich den falschen Umsatzsteuersatz anwendet?", "antworten": ["Der Unternehmer schuldet nur den ausgewiesenen niedrigeren Betrag; das Finanzamt kann keine Nachzahlung verlangen (§ 14 UStG).", "Nichts, solange der Fahrgast die Rechnung nicht beanstandet; die Steuer bleibt wie ausgewiesen (§ 14 UStG).", "Das Finanzamt kann Steuernachzahlungen fordern, und Kunden könnten Vorsteuer nicht abziehen (§ 14c UStG)."], "richtig": 2, "erklaerung": "Das Finanzamt kann Steuernachzahlungen fordern, und Kunden könnten Vorsteuer nicht abziehen (§ 14c UStG).", "schwierigkeit": "mittel"}, {"id": 1321, "gesetz": "UStDV", "frage": "#1321 Wann kann ein Taxiunternehmen den Vorsteuerabzug für ein Fahrzeug geltend machen?", "antworten": ["Nur wenn es ausschließlich betrieblich genutzt wird; bei jeder Privatnutzung entfällt der Abzug (§ 15 Abs. 1b UStG).", "Wenn ein Fahrtenbuch geführt wird; ohne Fahrtenbuch ist der Vorsteuerabzug immer ausgeschlossen (§ 15 Abs. 4 UStG).", "Wenn das Fahrzeug zu mindestens 10 % unternehmerisch genutzt und dem Unternehmen zugeordnet wird; die Privatnutzung ist dann als Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG)."], "richtig": 2, "erklaerung": "Wenn das Fahrzeug zu mindestens 10 % unternehmerisch genutzt und dem Unternehmen zugeordnet wird; die Privatnutzung ist dann als Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG).", "schwierigkeit": "schwer"}, {"id": 1322, "gesetz": "UStDV", "frage": "#1322 Wie müssen Taxiunternehmen die Aufzeichnungspflichten für steuerfreie Umsätze erfüllen?", "antworten": ["Steuerfreie Umsätze sind getrennt von den steuerpflichtigen aufzuzeichnen und durch Belege nachzuweisen (§ 22 Abs. 2 UStG, § 63 UStDV).", "Steuerfreie Umsätze müssen nicht getrennt aufgezeichnet werden, da sie in der Umsatzsteuererklärung nicht erscheinen (§ 22 UStG).", "Sie sind nur in der Jahreserklärung anzugeben; Belege müssen nicht aufbewahrt werden (§ 14b UStG)."], "richtig": 0, "erklaerung": "Steuerfreie Umsätze sind getrennt von den steuerpflichtigen aufzuzeichnen und durch Belege nachzuweisen (§ 22 Abs. 2 UStG, § 63 UStDV).", "schwierigkeit": "leicht"}, {"id": 1323, "gesetz": "UStDV", "frage": "#1323 Welche steuerlichen Konsequenzen haben Fehler bei der Rechnungsstellung?", "antworten": ["Fehlerhafte Rechnungen müssen berichtigt werden, sonst drohen steuerliche Nachteile (§ 31 UStDV).", "Fehlerhafte Rechnungen sind nichtig; der Kunde muss die Leistung nicht bezahlen (§ 125 BGB).", "Es drohen keine Folgen, solange der Rechnungsbetrag bezahlt wurde; eine Korrektur ist nicht erlaubt (§ 14 UStG)."], "richtig": 0, "erklaerung": "Fehlerhafte Rechnungen müssen berichtigt werden, sonst drohen steuerliche Nachteile (§ 31 UStDV).", "schwierigkeit": "mittel"}, {"id": 1324, "gesetz": "UStDV", "frage": "#1324 Wie wird die Umsatzsteuer für Taxiunternehmen mit mehreren Standorten behandelt?", "antworten": ["Die Umsatzsteuer wird bei der Gemeinde mit dem höchsten Hebesatz erklärt, in der Betriebsstätten liegen (§ 16 GewStG).", "Alle Standorte bilden ein Unternehmen; die Umsatzsteuer wird einheitlich beim Finanzamt am Ort der Geschäftsleitung erklärt (§ 2 Abs. 1 UStG, § 21 AO).", "Jeder Standort ist ein eigenes Unternehmen und erklärt die Umsatzsteuer beim Finanzamt vor Ort (§ 2 UStG)."], "richtig": 1, "erklaerung": "Alle Standorte bilden ein Unternehmen; die Umsatzsteuer wird einheitlich beim Finanzamt am Ort der Geschäftsleitung erklärt (§ 2 Abs. 1 UStG, § 21 AO).", "schwierigkeit": "schwer"}, {"id": 1325, "gesetz": "UStDV", "frage": "#1325 Welche steuerlichen Regeln gelten für Taxiunternehmen mit ausländischen Fahrgästen?", "antworten": ["Fahrten mit ausländischen Fahrgästen sind steuerfrei, wenn der Fahrgast die Rückerstattung beantragt (§ 4 UStG).", "Keine besonderen: Fahrten im Inland sind auch für ausländische Fahrgäste steuerpflichtig, da die Beförderung dort ausgeführt wird, wo sie bewirkt wird (§ 3b Abs. 1 UStG).", "Es gilt der Steuersatz des Heimatlandes des Fahrgastes, sofern dieser in der EU wohnt (§ 3a UStG)."], "richtig": 1, "erklaerung": "Keine besonderen: Fahrten im Inland sind auch für ausländische Fahrgäste steuerpflichtig, da die Beförderung dort ausgeführt wird, wo sie bewirkt wird (§ 3b Abs. 1 UStG).", "schwierigkeit": "leicht"}, {"id": 1326, "gesetz": "UStDV", "frage": "#1326 Darf ein Taxiunternehmen eine Steuerbefreiung für gemeinnützige Fahrten nutzen?", "antworten": ["Nein, Fahrten eines gewerblichen Taxiunternehmers sind auch für gemeinnützige Auftraggeber steuerpflichtig (§ 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen).", "Ja, Fahrten für Pflegeheime und Krankenkassen sind stets steuerfrei (§ 4 Nr. 16 UStG).", "Ja, wenn die Fahrt im Auftrag einer gemeinnützigen Organisation erfolgt und diese eine Freistellungsbescheinigung vorlegt (§ 4 Nr. 18 UStG)."], "richtig": 0, "erklaerung": "Nein, Fahrten eines gewerblichen Taxiunternehmers sind auch für gemeinnützige Auftraggeber steuerpflichtig (§ 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen).", "schwierigkeit": "mittel"}, {"id": 1327, "gesetz": "UStDV", "frage": "#1327 Wie werden steuerfreie Fahrausweise im internationalen Verkehr behandelt?", "antworten": ["Sie gelten nur als Rechnung, wenn bescheinigt ist, welcher Anteil des Fahrpreises auf die Inlandsstrecke entfällt und welcher Steuersatz gilt (§ 34 Abs. 2 UStDV).", "Sie gelten nie als Rechnung; im internationalen Verkehr ist stets eine Einzelrechnung in Euro und Landeswährung zu erteilen (§ 14 UStG).", "Sie gelten stets als Rechnung, ohne dass Angaben zu Inlandsstrecke oder Steuersatz nötig sind (§ 34 UStDV)."], "richtig": 0, "erklaerung": "Sie gelten nur als Rechnung, wenn bescheinigt ist, welcher Anteil des Fahrpreises auf die Inlandsstrecke entfällt und welcher Steuersatz gilt (§ 34 Abs. 2 UStDV).", "schwierigkeit": "schwer"}, {"id": 1328, "gesetz": "UStDV", "frage": "#1328 Welche steuerlichen Aufzeichnungspflichten gelten für Kleinunternehmer im Taxigewerbe?", "antworten": ["Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV).", "Sie müssen nur die Umsatzsteuer aufzeichnen; die Entgelte selbst sind nicht aufzuzeichnen (§ 22 UStG).", "Kleinunternehmer müssen keinerlei Aufzeichnungen führen, da sie keine Umsatzsteuer schulden (§ 19 UStG)."], "richtig": 0, "erkl
