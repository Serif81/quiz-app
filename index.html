längerer Krankheit (§ 44 SGB IX)."], "richtig": 2, "erklaerung": "Ein Konzept zur schrittweisen Rückkehr in den Beruf nach längerer Krankheit (§ 44 SGB IX).", "schwierigkeit": "schwer"}, {"id": 925, "gesetz": "SGB IX", "frage": "#0925 Welche Regelungen gibt es zur Barrierefreiheit am Arbeitsplatz?", "antworten": ["Arbeitgeber müssen alle Arbeitsplätze unabhängig von den Beschäftigten bis zum Jahresende rollstuhlgerecht umbauen (§ 164 SGB IX).", "Arbeitgeber müssen geeignete Maßnahmen zur Beseitigung von Barrieren ergreifen (§ 164 SGB IX).", "Nur öffentliche Arbeitgeber müssen Maßnahmen ergreifen; private Unternehmen sind ausgenommen (§ 154 SGB IX)."], "richtig": 1, "erklaerung": "Arbeitgeber müssen geeignete Maßnahmen zur Beseitigung von Barrieren ergreifen (§ 164 SGB IX).", "schwierigkeit": "leicht"}, {"id": 926, "gesetz": "SGB IX", "frage": "#0926 Welche Bedeutung hat die unentgeltliche Beförderung schwerbehinderter Menschen?", "antworten": ["Schwerbehinderte werden nur im Taxigewerbe zum halben Tarif befördert; die Kosten trägt der Unternehmer (§ 229 SGB IX).", "Schwerbehinderte mit bestimmten Merkzeichen (z. B. G, aG, H, Gl) werden im öffentlichen Nahverkehr gegen Ausweis mit gültiger Wertmarke unentgeltlich befördert (§ 228 SGB IX).", "Alle Menschen mit einem Grad der Behinderung ab 30 werden ohne Wertmarke im gesamten Fernverkehr unentgeltlich befördert (§ 228 SGB IX)."], "richtig": 1, "erklaerung": "Schwerbehinderte mit bestimmten Merkzeichen (z. B. G, aG, H, Gl) werden im öffentlichen Nahverkehr gegen Ausweis mit gültiger Wertmarke unentgeltlich befördert (§ 228 SGB IX).", "schwierigkeit": "mittel"}, {"id": 927, "gesetz": "SGB IX", "frage": "#0927 Welche Unterstützung gibt es für schwerbehinderte Selbstständige?", "antworten": ["Sie können Zuschüsse zur Gründung oder Erhaltung ihrer Tätigkeit erhalten (§ 49 SGB IX).", "Sie sind von der Gewerbesteuer befreit und erhalten einen Zuschuss der Krankenkasse (§ 50 SGB IX).", "Sie erhalten die Ausgleichsabgabe anderer Unternehmen anteilig ausgezahlt (§ 160 SGB IX)."], "richtig": 0, "erklaerung": "Sie können Zuschüsse zur Gründung oder Erhaltung ihrer Tätigkeit erhalten (§ 49 SGB IX).", "schwierigkeit": "schwer"}, {"id": 928, "gesetz": "SGB IX", "frage": "#0928 Was passiert, wenn ein Unternehmen seine Pflichten nach dem SGB IX nicht erfüllt?", "antworten": ["Ausgleichsabgabe bei unbesetzten Pflichtplätzen (§ 160) und Geldbußen bis 10.000 € z. B. bei Verstößen gegen Anzeige- und Unterrichtungspflichten (§ 238 SGB IX).", "Entzug der Unternehmerzuverlässigkeit und Freiheitsstrafe bis zu einem Jahr (§ 154 SGB IX).", "Der Arbeitgeber muss den schwerbehinderten Beschäftigten Schadensersatz in Höhe von drei Monatsgehältern zahlen (§ 164 SGB IX)."], "richtig": 0, "erklaerung": "Ausgleichsabgabe bei unbesetzten Pflichtplätzen (§ 160) und Geldbußen bis 10.000 € z. B. bei Verstößen gegen Anzeige- und Unterrichtungspflichten (§ 238 SGB IX).", "schwierigkeit": "leicht"}, {"id": 929, "gesetz": "SGB IX", "frage": "#0929 Welche Rechte haben schwerbehinderte Arbeitnehmer in Bezug auf Mehrarbeit?", "antworten": ["Sie können sich von Mehrarbeit befreien lassen (§ 207 SGB IX).", "Sie sind von Mehrarbeit nur befreit, wenn ein amtsärztliches Gutachten vorliegt (§ 164 SGB IX).", "Sie müssen Mehrarbeit leisten, erhalten dafür aber stets einen Zuschlag von 50 % (§ 207 SGB IX)."], "richtig": 0, "erklaerung": "Sie können sich von Mehrarbeit befreien lassen (§ 207 SGB IX).", "schwierigkeit": "mittel"}, {"id": 930, "gesetz": "SGB IX", "frage": "#0930 Wie wird der Grad der Behinderung (GdB) festgestellt?", "antworten": ["Die Agentur für Arbeit stellt den GdB in Prozentwerten von 5 bis 100 fest (§ 152 SGB IX).", "Der Arbeitgeber stellt den GdB nach einer Untersuchung durch den Betriebsarzt fest (§ 152 SGB IX).", "Auf Antrag stellt die zuständige Behörde (meist Versorgungsamt) den GdB nach Zehnergraden fest (§ 152 SGB IX)."], "richtig": 2, "erklaerung": "Auf Antrag stellt die zuständige Behörde (meist Versorgungsamt) den GdB nach Zehnergraden fest (§ 152 SGB IX).", "schwierigkeit": "schwer"}, {"id": 951, "gesetz": "TzBfG", "frage": "#0951 Können Taxifahrer in Teilzeit arbeiten?", "antworten": ["Nein, im Taxigewerbe sind wegen der Schichtplanung nur Vollzeitverträge zulässig (§ 6 TzBfG).", "Ja, jeder Arbeitnehmer kann ab dem ersten Arbeitstag Teilzeit verlangen und der Arbeitgeber darf nicht ablehnen (§ 8 TzBfG).", "Ja, Arbeitnehmer können Teilzeit verlangen, sofern keine betrieblichen Gründe entgegenstehen (Betrieb > 15 Arbeitnehmer, > 6 Monate beschäftigt) (§§ 6, 8 TzBfG)."], "richtig": 2, "erklaerung": "Ja, Arbeitnehmer können Teilzeit verlangen, sofern keine betrieblichen Gründe entgegenstehen (Betrieb > 15 Arbeitnehmer, > 6 Monate beschäftigt) (§§ 6, 8 TzBfG).", "schwierigkeit": "leicht"}, {"id": 952, "gesetz": "TzBfG", "frage": "#0952 Welche Auswirkungen hat eine Teilzeitbeschäftigung für einen Taxifahrer?", "antworten": ["Er hat keinen Anspruch auf Entgeltfortzahlung im Krankheitsfall und keinen allgemeinen Kündigungsschutz (§ 4 TzBfG).", "Er darf vom Arbeitgeber jederzeit ohne seine Zustimmung auf Vollzeit hochgestuft werden (§ 8 TzBfG).", "Er hat die gleichen Rechte wie Vollzeitbeschäftigte und darf wegen der Teilzeit nicht schlechter behandelt werden (§ 4 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Er hat die gleichen Rechte wie Vollzeitbeschäftigte und darf wegen der Teilzeit nicht schlechter behandelt werden (§ 4 Abs. 1 TzBfG).", "schwierigkeit": "mittel"}, {"id": 953, "gesetz": "TzBfG", "frage": "#0953 Darf ein Taxiunternehmen eine Vollzeitstelle nur als solche ausschreiben?", "antworten": ["Nein, der Arbeitgeber muss jede Stelle zwingend zur Hälfte als Teilzeitstelle ausschreiben (§ 7 TzBfG).", "Nein, Arbeitgeber müssen prüfen, ob die Stelle auch als Teilzeitstelle angeboten werden kann (§ 7 Abs. 1 TzBfG).", "Ja, die Entscheidung über den Stellenzuschnitt liegt allein beim Arbeitgeber; eine Prüfpflicht gibt es nicht (§ 7 TzBfG)."], "richtig": 1, "erklaerung": "Nein, Arbeitgeber müssen prüfen, ob die Stelle auch als Teilzeitstelle angeboten werden kann (§ 7 Abs. 1 TzBfG).", "schwierigkeit": "schwer"}, {"id": 954, "gesetz": "TzBfG", "frage": "#0954 Haben Teilzeitbeschäftigte im Taxi- und Mietwagengewerbe Anspruch auf Mehrstunden?", "antworten": ["Nein, der Arbeitgeber muss freie Stellen ausschließlich extern ausschreiben; interne Bewerber werden nicht berücksichtigt (§ 7 TzBfG).", "Ja, Teilzeitkräfte haben einen unbedingten Anspruch auf Erhöhung der Arbeitszeit auf Vollzeit innerhalb von drei Monaten (§ 9 TzBfG).", "Nein, kein direkter Anspruch; wer den Wunsch in Textform angezeigt hat, ist bei der Besetzung eines entsprechenden freien Arbeitsplatzes bevorzugt zu berücksichtigen (§ 9 TzBfG)."], "richtig": 2, "erklaerung": "Nein, kein direkter Anspruch; wer den Wunsch in Textform angezeigt hat, ist bei der Besetzung eines entsprechenden freien Arbeitsplatzes bevorzugt zu berücksichtigen (§ 9 TzBfG).", "schwierigkeit": "leicht"}, {"id": 955, "gesetz": "TzBfG", "frage": "#0955 Können Taxiunternehmen befristete Arbeitsverträge abschließen?", "antworten": ["Nein, im Taxigewerbe sind befristete Arbeitsverträge grundsätzlich verboten (§ 14 TzBfG).", "Ja, mit Sachgrund (z. B. vorübergehender Bedarf, Erprobung) oder ohne Sachgrund bis zu zwei Jahre; die Befristung bedarf der Schriftform (§ 14 TzBfG).", "Ja, aber nur mit Sachgrund; eine Befristung ohne Sachgrund ist nie erlaubt und kann auch mündlich vereinbart werden (§ 14 TzBfG)."], "richtig": 1, "erklaerung": "Ja, mit Sachgrund (z. B. vorübergehender Bedarf, Erprobung) oder ohne Sachgrund bis zu zwei Jahre; die Befristung bedarf der Schriftform (§ 14 TzBfG).", "schwierigkeit": "mittel"}, {"id": 956, "gesetz": "TzBfG", "frage": "#0956 Was ist das Ziel des Teilzeit- und Befristungsgesetzes (TzBfG)?", "antworten": ["Die Sicherung von Mindestlöhnen für befristet und in Teilzeit Beschäftigte (§ 1 TzBfG).", "Die Regelung der Arbeitszeiten im Straßenverkehr und die Kontrolle der Lenk- und Ruhezeiten (§ 1 TzBfG).", "Die Förderung von Teilzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und befristet Beschäftigten (§ 1 TzBfG)."], "richtig": 2, "erklaerung": "Die Förderung von Teilzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und befristet Beschäftigten (§ 1 TzBfG).", "schwierigkeit": "schwer"}, {"id": 957, "gesetz": "TzBfG", "frage": "#0957 Wann gilt ein Arbeitnehmer als teilzeitbeschäftigt?", "antworten": ["Wenn er weniger als 20 Stunden pro Woche arbeitet, unabhängig von Vergleichspersonen (§ 2 TzBfG).", "Wenn seine regelmäßige Wochenarbeitszeit geringer ist als die eines vergleichbaren Vollzeitbeschäftigten (§ 2 Abs. 1 TzBfG).", "Wenn er nur an wenigen Tagen im Monat arbeitet und nicht sozialversicherungspflichtig ist (§ 8 SGB IV)."], "richtig": 1, "erklaerung": "Wenn seine regelmäßige Wochenarbeitszeit geringer ist als die eines vergleichbaren Vollzeitbeschäftigten (§ 2 Abs. 1 TzBfG).", "schwierigkeit": "leicht"}, {"id": 958, "gesetz": "TzBfG", "frage": "#0958 Wann gilt ein Arbeitnehmer als befristet beschäftigt?", "antworten": ["Wenn er nur an bestimmten Wochentagen arbeitet und seinen Vertrag jederzeit mit sofortiger Wirkung beenden kann (§ 12 TzBfG).", "Wenn er nur in der Probezeit beschäftigt ist, unabhängig vom Vertragsinhalt (§ 3 TzBfG).", "Wenn sein Arbeitsvertrag nur für eine bestimmte Zeit oder bis zur Erreichung eines Zwecks geschlossen wurde (§ 3 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Wenn sein Arbeitsvertrag nur für eine bestimmte Zeit oder bis zur Erreichung eines Zwecks geschlossen wurde (§ 3 Abs. 1 TzBfG).", "schwierigkeit": "mittel"}, {"id": 959, "gesetz": "TzBfG", "frage": "#0959 Welche Schutzmaßnahmen gelten für Teilzeitkräfte?", "antworten": ["Sie haben Anspruch auf einen Ausgleich von 10 % des Entgelts für den Verzicht auf Vollzeit (§ 4 TzBfG).", "Sie sind von der Wahl zum Betriebsrat und von der betrieblichen Altersversorgung ausgeschlossen (§ 4 TzBfG).", "Sie dürfen nicht wegen ihrer Teilzeitarbeit benachteiligt werden (§ 4 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Sie dürfen nicht wegen ihrer Teilzeitarbeit benachteiligt werden (§ 4 Abs. 1 TzBfG).", "schwierigkeit": "schwer"}, {"id": 960, "gesetz": "TzBfG", "frage": "#0960 Welche Schutzmaßnahmen gelten für befristet Beschäftigte?", "antworten": ["Sie müssen grundsätzlich die gleichen Arbeitsbedingungen wie unbefristet Beschäftigte haben (§ 4 Abs. 2 TzBfG).", "Sie erhalten stets 20 % mehr Lohn als unbefristet Beschäftigte, weil ihr Arbeitsverhältnis unsicher ist (§ 4 TzBfG).", "Sie dürfen von betrieblichen Sozialleistungen wie Weihnachtsgeld ausgeschlossen werden (§ 4 TzBfG)."], "richtig": 0, "erklaerung": "Sie müssen grundsätzlich die gleichen Arbeitsbedingungen wie unbefristet Beschäftigte haben (§ 4 Abs. 2 TzBfG).", "schwierigkeit": "leicht"}, {"id": 961, "gesetz": "TzBfG", "frage": "#0961 Muss der Arbeitgeber einen Wunsch auf Teilzeit genehmigen?", "antworten": ["Nein, der Arbeitgeber entscheidet frei und ohne Begründung (§ 8 TzBfG).", "Ja, sofern betriebliche Gründe nicht entgegenstehen (§ 8 Abs. 4 TzBfG).", "Ja, immer, sofern der Antrag sechs Monate vorher gestellt wurde, auch bei dringenden betrieblichen Gründen (§ 8 Abs. 2 TzBfG)."], "richtig": 1, "erklaerung": "Ja, sofern betriebliche Gründe nicht entgegenstehen (§ 8 Abs. 4 TzBfG).", "schwierigkeit": "mittel"}, {"id": 962, "gesetz": "TzBfG", "frage": "#0962 Wie lange muss ein Arbeitnehmer im Betrieb sein, um eine Verringerung seiner Arbeitszeit verlangen zu können?", "antworten": ["Es gibt keine Mindestdauer; der Anspruch besteht ab dem ersten Arbeitstag in jedem Betrieb mit Betriebsrat (§ 8 Abs. 1 TzBfG).", "Länger als sechs Monate; der Arbeitgeber muss in der Regel mehr als 15 Arbeitnehmer beschäftigen (§ 8 Abs. 1, 7 TzBfG).", "Länger als sechs Monate; die Betriebsgröße spielt keine Rolle, solange mindestens zehn Arbeitnehmer beschäftigt sind (§ 8 TzBfG)."], "richtig": 1, "erklaerung": "Länger als sechs Monate; der Arbeitgeber muss in der Regel mehr als 15 Arbeitnehmer beschäftigen (§ 8 Abs. 1, 7 TzBfG).", "schwierigkeit": "schwer"}, {"id": 963, "gesetz": "TzBfG", "frage": "#0963 Welche Frist muss ein Arbeitnehmer für den Antrag auf Teilzeit beachten?", "antworten": ["Spätestens sechs Wochen vor Beginn, auch mündlich (§ 8 Abs. 2 TzBfG).", "Spätestens ein Jahr vor Beginn gegenüber der Agentur für Arbeit (§ 8 Abs. 1 TzBfG).", "Der Antrag muss spätestens drei Monate vor Beginn in Textform gestellt werden (§ 8 Abs. 2 TzBfG)."], "richtig": 2, "erklaerung": "Der Antrag muss spätestens drei Monate vor Beginn in Textform gestellt werden (§ 8 Abs. 2 TzBfG).", "schwierigkeit": "leicht"}, {"id": 964, "gesetz": "TzBfG", "frage": "#0964 Welche Frist hat der Arbeitgeber für eine Antwort auf den Antrag auf Teilzeit?", "antworten": ["Der Arbeitgeber muss gar nicht antworten, solange der Betrieb weniger als 50 Mitarbeiter hat (§ 8 Abs. 7 TzBfG).", "Innerhalb von drei Werktagen nach Eingang des Antrags (§ 8 Abs. 3 TzBfG).", "Einen Monat vor dem gewünschten Beginn der Teilzeit (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Einen Monat vor dem gewünschten Beginn der Teilzeit (§ 8 Abs. 5 TzBfG).", "schwierigkeit": "mittel"}, {"id": 965, "gesetz": "TzBfG", "frage": "#0965 Kann der Arbeitgeber eine Teilzeitvereinbarung später rückgängig machen?", "antworten": ["Ja, die Teilzeit gilt automatisch nur für zwölf Monate und endet dann kraft Gesetzes (§ 9a TzBfG).", "Ja, jede Teilzeitvereinbarung darf der Arbeitgeber nach zwei Jahren einseitig auf Vollzeit zurückführen (§ 8 Abs. 5 TzBfG).", "Nein, die Verringerung nach § 8 ist unbefristet; der Arbeitgeber kann nur die Verteilung der Arbeitszeit unter engen Voraussetzungen ändern (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Nein, die Verringerung nach § 8 ist unbefristet; der Arbeitgeber kann nur die Verteilung der Arbeitszeit unter engen Voraussetzungen ändern (§ 8 Abs. 5 TzBfG).", "schwierigkeit": "schwer"}, {"id": 966, "gesetz": "TzBfG", "frage": "#0966 Wann ist eine Befristung ohne Sachgrund zulässig?", "antworten": ["Nur bis zu sechs Monate, ohne Verlängerungsmöglichkeit (§ 14 Abs. 3 TzBfG).", "Bis zu fünf Jahre, mit beliebig vielen Verlängerungen (§ 14 Abs. 2 TzBfG).", "Bis zu einer Gesamtdauer von zwei Jahren, mit höchstens dreimaliger Verlängerung (§ 14 Abs. 2 TzBfG)."], "richtig": 2, "erklaerung": "Bis zu einer Gesamtdauer von zwei Jahren, mit höchstens dreimaliger Verlängerung (§ 14 Abs. 2 TzBfG).", "schwierigkeit": "leicht"}, {"id": 967, "gesetz": "TzBfG", "frage": "#0967 Wann ist eine Befristung mit Sachgrund erlaubt?", "antworten": ["Wenn der Arbeitgeber wirtschaftliche Schwierigkeiten hat und die Agentur für Arbeit zustimmt (§ 14 Abs. 1 TzBfG).", "Wenn der betriebliche Bedarf nur vorübergehend besteht, eine Vertretung erforderlich ist oder eine Erprobung gewünscht wird (§ 14 Abs. 1 TzBfG).", "Wenn der Arbeitnehmer das 40. Lebensjahr vollendet hat (§ 14 Abs. 3 TzBfG)."], "richtig": 1, "erklaerung": "Wenn der betriebliche Bedarf nur vorübergehend besteht, eine Vertretung erforderlich ist oder eine Erprobung gewünscht wird (§ 14 Abs. 1 TzBfG).", "schwierigkeit": "mittel"}, {"id": 968, "gesetz": "TzBfG", "frage": "#0968 Kann eine Befristung durch Tarifvertrag verlängert werden?", "antworten": ["Ja, aber nur durch Betriebsvereinbarung; Tarifverträge dürfen nicht abweichen (§ 14 Abs. 2a TzBfG).", "Ja, die Höchstdauer und die Anzahl der Verlängerungen können tarifvertraglich abweichen (§ 14 Abs. 2 TzBfG).", "Nein, die Höchstdauer von zwei Jahren und die Zahl der Verlängerungen sind zwingend und tarifvertraglich nicht abdingbar (§ 14 Abs. 2 TzBfG)."], "richtig": 1, "erklaerung": "Ja, die Höchstdauer und die Anzahl der Verlängerungen können tarifvertraglich abweichen (§ 14 Abs. 2 TzBfG).", "schwierigkeit": "schwer"}, {"id": 969, "gesetz": "TzBfG", "frage": "#0969 Was passiert, wenn eine Befristung unwirksam ist?", "antworten": ["Das Arbeitsverhältnis wird in ein befristetes mit sechs Monaten Verlängerung umgewandelt (§ 14 TzBfG).", "Das Arbeitsverhältnis endet trotzdem zum vereinbarten Termin, der Arbeitnehmer erhält eine Entschädigung (§ 15 TzBfG).", "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG)."], "richtig": 2, "erklaerung": "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG).", "schwierigkeit": "leicht"}, {"id": 970, "gesetz": "TzBfG", "frage": "#0970 Welche Frist gilt für eine Klage gegen eine unwirksame Befristung?", "antworten": ["Zwei Monate nach Ende des befristeten Arbeitsvertrags (§ 17 TzBfG).", "Drei Wochen nach Ende des befristeten Arbeitsvertrags (§ 17 TzBfG).", "Sechs Monate nach Beginn des Arbeitsverhältnisses (§ 17 TzBfG)."], "richtig": 1, "erklaerung": "Drei Wochen nach Ende des befristeten Arbeitsvertrags (§ 17 TzBfG).", "schwierigkeit": "mittel"}, {"id": 971, "gesetz": "TzBfG", "frage": "#0971 Was ist Arbeit auf Abruf?", "antworten": ["Ein Verfahren, bei dem der Arbeitgeber Arbeitnehmer kurzfristig bei einem Verleiher abrufen kann (§ 1 AÜG).", "Eine Arbeitsform, bei der der Arbeitnehmer zusätzlich zur Hauptbeschäftigung für ein anderes Unternehmen tätig wird (§ 12 TzBfG).", "Eine Arbeitsform, bei der der Arbeitnehmer flexibel je nach Arbeitsanfall eingesetzt wird (§ 12 TzBfG)."], "richtig": 2, "erklaerung": "Eine Arbeitsform, bei der der Arbeitnehmer flexibel je nach Arbeitsanfall eingesetzt wird (§ 12 TzBfG).", "schwierigkeit": "schwer"}, {"id": 972, "gesetz": "TzBfG", "frage": "#0972 Welche Mindestarbeitszeit gilt bei Arbeit auf Abruf?", "antworten": ["Eine Mindestarbeitszeit besteht nicht; der Arbeitgeber legt die Einsätze frei fest (§ 12 TzBfG).", "Zehn Stunden pro Woche; täglich mindestens eine Stunde (§ 12 Abs. 1 TzBfG).", "Ist keine wöchentliche Arbeitszeit festgelegt, gelten 20 Stunden als vereinbart; täglich mindestens drei aufeinanderfolgende Stunden (§ 12 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Ist keine wöchentliche Arbeitszeit festgelegt, gelten 20 Stunden als vereinbart; täglich mindestens drei aufeinanderfolgende Stunden (§ 12 Abs. 1 TzBfG).", "schwierigkeit": "leicht"}, {"id": 973, "gesetz": "TzBfG", "frage": "#0973 Welche Ankündigungsfrist gilt bei Arbeit auf Abruf?", "antworten": ["Eine Ankündigung ist nicht nötig, solange der Arbeitnehmer telefonisch erreichbar ist (§ 12 TzBfG).", "Mindestens 24 Stunden im Voraus (§ 12 Abs. 3 TzBfG).", "Der Arbeitgeber muss die Arbeitszeit mindestens vier Tage im Voraus mitteilen (§ 12 Abs. 3 TzBfG)."], "richtig": 2, "erklaerung": "Der Arbeitgeber muss die Arbeitszeit mindestens vier Tage im Voraus mitteilen (§ 12 Abs. 3 TzBfG).", "schwierigkeit": "mittel"}, {"id": 974, "gesetz": "TzBfG", "frage": "#0974 Darf ein Arbeitgeber ein Arbeitsverhältnis kündigen, weil ein Arbeitnehmer nicht in Teilzeit wechseln will?", "antworten": ["Nein, eine Kündigung aus diesem Grund ist unwirksam (§ 11 TzBfG).", "Ja, der Arbeitgeber darf nach Ablauf von zwölf Monaten kündigen, wenn der Arbeitnehmer eine Änderung ablehnt (§ 2 KSchG).", "Ja, aber nur mit Zustimmung des Betriebsrats und gegen Zahlung einer Abfindung (§ 102 BetrVG)."], "richtig": 0, "erklaerung": "Nein, eine Kündigung aus diesem Grund ist unwirksam (§ 11 TzBfG).", "schwierigkeit": "schwer"}, {"id": 975, "gesetz": "TzBfG", "frage": "#0975 Muss ein Arbeitgeber befristet Beschäftigte über freie unbefristete Stellen informieren?", "antworten": ["Nein, der Arbeitgeber muss lediglich die Agentur für Arbeit über freie Stellen informieren (§ 18 TzBfG).", "Nein, die Information über freie Stellen erfolgt nur für unbefristet Beschäftigte (§ 18 TzBfG).", "Ja, der Arbeitgeber muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG)."], "richtig": 2, "erklaerung": "Ja, der Arbeitgeber muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG).", "schwierigkeit": "leicht"}, {"id": 976, "gesetz": "TzBfG", "frage": "#0976 Welche Behörde ist für die Einhaltung des TzBfG zuständig?", "antworten": ["Die Gewerbeaufsichtsbehörde, die Verstöße mit Bußgeld ahnden kann (§ 18 TzBfG).", "Die Agentur für Arbeit, die jede Befristung vorab genehmigen muss (§ 14 TzBfG).", "Keine Aufsichtsbehörde; Ansprüche werden vor dem Arbeitsgericht durchgesetzt, z. B. Befristungskontrollklage binnen drei Wochen (§ 17 TzBfG)."], "richtig": 2, "erklaerung": "Keine Aufsichtsbehörde; Ansprüche werden vor dem Arbeitsgericht durchgesetzt, z. B. Befristungskontrollklage binnen drei Wochen (§ 17 TzBfG).", "schwierigkeit": "mittel"}, {"id": 977, "gesetz": "TzBfG", "frage": "#0977 Welche Sanktionen drohen, wenn ein Arbeitgeber Teilzeitwünsche ignoriert?", "antworten": ["Bußgeld bis 5.000 € durch die Agentur für Arbeit und Pflicht zur Nachzahlung der Differenz zur Vollzeit (§ 8 TzBfG).", "Die Teilzeit gilt als abgelehnt; der Arbeitnehmer muss binnen drei Wochen Klage erheben (§ 17 TzBfG).", "Lehnt der Arbeitgeber nicht spätestens einen Monat vor Beginn in Textform ab, gilt die Teilzeit als vereinbart; im Übrigen Klage vor dem Arbeitsgericht (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Lehnt der Arbeitgeber nicht spätestens einen Monat vor Beginn in Textform ab, gilt die Teilzeit als vereinbart; im Übrigen Klage vor dem Arbeitsgericht (§ 8 Abs. 5 TzBfG).", "schwierigkeit": "schwer"}, {"id": 978, "gesetz": "TzBfG", "frage": "#0978 Welche Folgen hat eine unrechtmäßige Befristung?", "antworten": ["Der Arbeitnehmer kann nur Schadensersatz verlangen, das Arbeitsverhältnis endet aber wie vereinbart (§ 15 TzBfG).", "Die Befristung wird auf das gesetzliche Maximum von zwei Jahren gekürzt (§ 14 Abs. 2 TzBfG).", "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG)."], "richtig": 2, "erklaerung": "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG).", "schwierigkeit": "leicht"}, {"id": 979, "gesetz": "TzBfG", "frage": "#0979 Kann ein Arbeitnehmer, der in Teilzeit arbeitet, die Rückkehr zur Vollzeit verlangen?", "antworten": ["Nein, kein Rückkehranspruch; er ist aber bei freien Stellen bevorzugt zu berücksichtigen (§ 9). Bei Brückenteilzeit endet die Verringerung automatisch (§ 9a TzBfG).", "Ja, nach zwei Jahren hat er einen gesetzlichen Anspruch auf Rückkehr zur ursprünglichen Arbeitszeit (§ 9 TzBfG).", "Nein, ein Wechsel zurück ist ausgeschlossen; die Teilzeit gilt dauerhaft, auch bei der Brückenteilzeit (§ 8 TzBfG)."], "richtig": 0, "erklaerung": "Nein, kein Rückkehranspruch; er ist aber bei freien Stellen bevorzugt zu berücksichtigen (§ 9). Bei Brückenteilzeit endet die Verringerung automatisch (§ 9a TzBfG).", "schwierigkeit": "mittel"}, {"id": 980, "gesetz": "TzBfG", "frage": "#0980 Was passiert, wenn ein Arbeitgeber einen Antrag auf Teilzeit nicht rechtzeitig beantwortet?", "antworten": ["Der Antrag gilt als abgelehnt; der Arbeitnehmer muss Klage vor dem Arbeitsgericht erheben (§ 8 Abs. 5 TzBfG).", "Der Arbeitnehmer darf die Arbeitszeit eigenmächtig verringern, ohne eine Abmahnung zu riskieren (§ 8 TzBfG).", "Die Teilzeit gilt automatisch als bewilligt (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Die Teilzeit gilt automatisch als bewilligt (§ 8 Abs. 5 TzBfG).", "schwierigkeit": "schwer"}, {"id": 1001, "gesetz": "MiLoG", "frage": "#1001 Gilt das Mindestlohngesetz (MiLoG) für Taxifahrer?", "antworten": ["Ja, alle Arbeitnehmer, einschließlich Taxifahrer, haben Anspruch auf den gesetzlichen Mindestlohn (§ 1 MiLoG).", "Nur, wenn sie fest angestellt sind und mehr als 30 Stunden pro Woche arbeiten (§ 1 MiLoG).", "Nein, Taxifahrer sind als Fahrpersonal vom Mindestlohn ausgenommen und werden nach Tarif bezahlt (§ 22 MiLoG)."], "richtig": 0, "erklaerung": "Ja, alle Arbeitnehmer, einschließlich Taxifahrer, haben Anspruch auf den gesetzlichen Mindestlohn (§ 1 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1002, "gesetz": "MiLoG", "frage": "#1002 Wie hoch ist der aktuelle gesetzliche Mindestlohn für Taxifahrer?", "antworten": ["Seit 1.1.2026 brutto 13,90 € je Zeitstunde, ab 1.1.2027 14,60 € (§ 1 Abs. 2 MiLoG i. V. m. MiLoV).", "Brutto 15,50 € je Stunde, wobei für Taxifahrer ein Branchenmindestlohn von 17 € gilt (§ 1 Abs. 3 MiLoG).", "Seit 1.1.2026 brutto 12,82 € je Zeitstunde, ab 1.1.2027 13,50 € (§ 1 Abs. 2 MiLoG i. V. m. MiLoV)."], "richtig": 0, "erklaerung": "Seit 1.1.2026 brutto 13,90 € je Zeitstunde, ab 1.1.2027 14,60 € (§ 1 Abs. 2 MiLoG i. V. m. MiLoV).", "schwierigkeit": "mittel"}, {"id": 1003, "gesetz": "MiLoG", "frage": "#1003 Muss ein Taxiunternehmen den Mindestlohn auch bei Provisionslohn zahlen?", "antworten": ["Nein, bei Provisionslohn genügt die vereinbarte Umsatzbeteiligung, auch wenn der Mindestlohn rechnerisch unterschritten wird (§ 1 MiLoG).", "Ja, das Einkommen muss mindestens dem gesetzlichen Mindestlohn entsprechen, auch wenn es auf Umsatzprovision basiert (§ 1 Abs. 1 MiLoG).", "Ja, allerdings gilt der Mindestlohn bei Umsatzprovision nur für die Hälfte der geleisteten Stunden (§ 1 MiLoG)."], "richtig": 1, "erklaerung": "Ja, das Einkommen muss mindestens dem gesetzlichen Mindestlohn entsprechen, auch wenn es auf Umsatzprovision basiert (§ 1 Abs. 1 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1004, "gesetz": "MiLoG", "frage": "#1004 Darf ein Taxiunternehmer den Mindestlohn durch Trinkgelder ersetzen?", "antworten": ["Ja, aber nur bis zur Hälfte des Mindestlohns (§ 2 MiLoG).", "Nein, Trinkgelder zählen nicht zum Mindestlohn (§ 1 MiLoG).", "Ja, Trinkgelder dürfen vollständig angerechnet werden, wenn dies schriftlich vereinbart ist (§ 1 MiLoG)."], "richtig": 1, "erklaerung": "Nein, Trinkgelder zählen nicht zum Mindestlohn (§ 1 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1005, "gesetz": "MiLoG", "frage": "#1005 Welche Dokumentationspflichten hat ein Taxiunternehmen bezüglich der Arbeitszeiten?", "antworten": ["Beginn, Ende und Dauer der täglichen Arbeitszeit sind bis zum Ablauf des siebten Folgetages aufzuzeichnen und mindestens zwei Jahre aufzubewahren (§ 17 Abs. 1 MiLoG).", "Nur der Beginn der Arbeitszeit ist bis zum Ende der Woche aufzuzeichnen; die Aufbewahrung beträgt ein Jahr (§ 17 Abs. 1 MiLoG).", "Beginn, Ende und Dauer sind spätestens zum Monatsende einzutragen und fünf Jahre aufzubewahren (§ 17 MiLoG)."], "richtig": 0, "erklaerung": "Beginn, Ende und Dauer der täglichen Arbeitszeit sind bis zum Ablauf des siebten Folgetages aufzuzeichnen und mindestens zwei Jahre aufzubewahren (§ 17 Abs. 1 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1006, "gesetz": "MiLoG", "frage": "#1006 Wer hat Anspruch auf den gesetzlichen Mindestlohn?", "antworten": ["Alle Arbeitnehmerinnen und Arbeitnehmer, mit wenigen Ausnahmen (§ 22 MiLoG).", "Nur tarifungebundene Arbeitnehmer in Betrieben mit mehr als zehn Beschäftigten (§ 22 MiLoG).", "Alle Erwerbstätigen, einschließlich Selbstständiger und ehrenamtlich Tätiger, ohne Ausnahmen (§ 22 MiLoG)."], "richtig": 0, "erklaerung": "Alle Arbeitnehmerinnen und Arbeitnehmer, mit wenigen Ausnahmen (§ 22 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1007, "gesetz": "MiLoG", "frage": "#1007 Welche Ausnahmen vom Mindestlohn gibt es?", "antworten": ["Taxi- und Mietwagenfahrer sowie Beschäftigte im übrigen Verkehrsgewerbe (§ 22 MiLoG).", "Alle Teilzeitkräfte, Minijobber und Arbeitnehmer über 60 Jahre (§ 22 MiLoG).", "Auszubildende, Ehrenamtliche, bestimmte Praktikanten, Jugendliche unter 18 ohne Berufsabschluss sowie Langzeitarbeitslose in den ersten sechs Monaten (§ 22 MiLoG)."], "richtig": 2, "erklaerung": "Auszubildende, Ehrenamtliche, bestimmte Praktikanten, Jugendliche unter 18 ohne Berufsabschluss sowie Langzeitarbeitslose in den ersten sechs Monaten (§ 22 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1008, "gesetz": "MiLoG", "frage": "#1008 Darf ein Arbeitnehmer auf den Mindestlohn verzichten?", "antworten": ["Nein, ein Verzicht ist nur durch gerichtlichen Vergleich möglich, im Übrigen unwirksam; Verwirkung ist ausgeschlossen (§ 3 MiLoG).", "Ja, im Arbeitsvertrag jederzeit; der Anspruch verwirkt, wenn er sechs Monate nicht geltend gemacht wird (§ 3 MiLoG).", "Ja, durch einen schriftlichen Einzelvertrag, wenn der Arbeitnehmer dafür eine Ausgleichszahlung erhält (§ 3 MiLoG)."], "richtig": 0, "erklaerung": "Nein, ein Verzicht ist nur durch gerichtlichen Vergleich möglich, im Übrigen unwirksam; Verwirkung ist ausgeschlossen (§ 3 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1009, "gesetz": "MiLoG", "frage": "#1009 Wann muss der Mindestlohn gezahlt werden?", "antworten": ["Spätestens am 15. des Folgemonats (§ 2 Abs. 1 MiLoG).", "Gleichzeitig mit der Arbeitsleistung, also täglich am Ende der Schicht (§ 2 Abs. 1 MiLoG).", "Spätestens am letzten Bankarbeitstag des Folgemonats (§ 2 Abs. 1 MiLoG)."], "richtig": 2, "erklaerung": "Spätestens am letzten Bankarbeitstag des Folgemonats (§ 2 Abs. 1 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1010, "gesetz": "MiLoG", "frage": "#1010 Gilt der Mindestlohn auch für geringfügig Beschäftigte (Minijobs)?", "antworten": ["Nur, wenn sie zusätzlich in einem Hauptberuf sozialversicherungspflichtig beschäftigt sind (§ 22 MiLoG).", "Ja, Minijobber haben ebenfalls Anspruch auf den Mindestlohn (§ 22 MiLoG).", "Nein, Minijobber sind vom Mindestlohn ausgenommen und erhalten nur Pauschalbeträge (§ 22 MiLoG)."], "richtig": 1, "erklaerung": "Ja, Minijobber haben ebenfalls Anspruch auf den Mindestlohn (§ 22 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1011, "gesetz": "MiLoG", "frage": "#1011 Welche Behörde ist für die Kontrolle des Mindestlohns zuständig?", "antworten": ["Die Industrie- und Handelskammer, die Verstöße der Genehmigungsbehörde melden muss (§ 15 MiLoG).", "Die Zollverwaltung überprüft die Einhaltung des Mindestlohns (§ 14 MiLoG).", "Die Gewerbeaufsichtsämter der Länder (§ 14 MiLoG)."], "richtig": 1, "erklaerung": "Die Zollverwaltung überprüft die Einhaltung des Mindestlohns (§ 14 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1012, "gesetz": "MiLoG", "frage": "#1012 Welche Unterlagen müssen Arbeitgeber zur Kontrolle des Mindestlohns bereithalten?", "antworten": ["Arbeitsverträge, Lohnabrechnungen und Arbeitszeitnachweise (§ 17 MiLoG).", "Arbeitsverträge, Fahrtenbücher und Tachografenscheiben, die der Zoll auswertet (§ 19 MiLoG).", "Nur die Lohnabrechnungen der letzten sechs Monate und die Gewerbeanmeldung (§ 17 MiLoG)."], "richtig": 0, "erklaerung": "Arbeitsverträge, Lohnabrechnungen und Arbeitszeitnachweise (§ 17 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1013, "gesetz": "MiLoG", "frage": "#1013 Wie müssen Arbeitszeiten dokumentiert werden?", "antworten": ["Nur die tatsächliche Dauer wöchentlich, bis zum Ende des Folgemonats (§ 17 MiLoG).", "Beginn, Ende und Dauer der täglichen Arbeitszeit müssen bis spätestens zum siebten Folgetag erfasst werden (§ 17 MiLoG).", "Eine Dokumentation ist nicht erforderlich, wenn der Arbeitnehmer schriftlich darauf verzichtet (§ 17 MiLoG)."], "richtig": 1, "erklaerung": "Beginn, Ende und Dauer der täglichen Arbeitszeit müssen bis spätestens zum siebten Folgetag erfasst werden (§ 17 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1014, "gesetz": "MiLoG", "frage": "#1014 Welche Strafen drohen bei Verstößen gegen den Mindestlohn?", "antworten": ["Geldbußen bis 500.000 € bei Nichtzahlung, bis 50.000 € bei Aufzeichnungsverstößen, sonst bis 30.000 € (§ 21 Abs. 3 MiLoG).", "Geldbußen bis 5.000 € bei Nichtzahlung; für Aufzeichnungsverstöße gibt es keine Sanktionen (§ 21 MiLoG).", "Freiheitsstrafe bis zu zwei Jahren bei jeder Unterschreitung des Mindestlohns (§ 21 MiLoG)."], "richtig": 0, "erklaerung": "Geldbußen bis 500.000 € bei Nichtzahlung, bis 50.000 € bei Aufzeichnungsverstößen, sonst bis 30.000 € (§ 21 Abs. 3 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1015, "gesetz": "MiLoG", "frage": "#1015 Kann ein Unternehmen bei Mindestlohnverstößen von öffentlichen Aufträgen ausgeschlossen werden?", "antworten": ["Ja, aber nur für die Dauer von sechs Wochen und nur durch Entscheidung der Gewerbeaufsicht (§ 19 MiLoG).", "Nein, ein Ausschluss von Vergaben ist nur bei einer Verurteilung wegen Steuerhinterziehung zulässig (§ 21 MiLoG).", "Ja, Unternehmen können von der Vergabe öffentlicher Aufträge ausgeschlossen werden (§ 19 MiLoG)."], "richtig": 2, "erklaerung": "Ja, Unternehmen können von der Vergabe öffentlicher Aufträge ausgeschlossen werden (§ 19 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1016, "gesetz": "MiLoG", "frage": "#1016 Wer haftet für die Einhaltung des Mindestlohns?", "antworten": ["Die Zollverwaltung, die den Mindestlohn bei Nichtzahlung nachzahlt (§ 14 MiLoG).", "Der Arbeitnehmer selbst, der seinen Anspruch eigenverantwortlich prüfen muss (§ 3 MiLoG).", "Der Arbeitgeber haftet für die korrekte Zahlung des Mindestlohns (§ 20 MiLoG)."], "richtig": 2, "erklaerung": "Der Arbeitgeber haftet für die korrekte Zahlung des Mindestlohns (§ 20 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1017, "gesetz": "MiLoG", "frage": "#1017 Haftet auch ein Auftraggeber, wenn ein Subunternehmer den Mindestlohn nicht zahlt?", "antworten": ["Ja, aber nur wenn der Auftraggeber ein öffentlicher Auftraggeber ist; private Unternehmer haften nicht (§ 19 MiLoG).", "Ja, Auftraggeber haften für Verstöße von beauftragten Subunternehmen (§ 13 MiLoG).", "Nein, Subunternehmer haften allein für ihre Beschäftigten; der Auftraggeber bleibt stets frei (§ 13 MiLoG)."], "richtig": 1, "erklaerung": "Ja, Auftraggeber haften für Verstöße von beauftragten Subunternehmen (§ 13 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1018, "gesetz": "MiLoG", "frage": "#1018 Gibt es eine Verjährungsfrist für Ansprüche auf Mindestlohn?", "antworten": ["Ja, regelmäßig drei Jahre ab Jahresende; Verwirkung ist ausgeschlossen (§§ 195, 199 BGB, § 3 MiLoG).", "Ja, drei Jahre ab Entstehung des Anspruchs; Ansprüche verwirken, wenn sie nicht binnen zwölf Monaten geltend gemacht werden (§ 3 MiLoG).", "Nein, Mindestlohnansprüche verjähren nie, solange das Arbeitsverhältnis besteht (§ 3 MiLoG)."], "richtig": 0, "erklaerung": "Ja, regelmäßig drei Jahre ab Jahresende; Verwirkung ist ausgeschlossen (§§ 195, 199 BGB, § 3 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1019, "gesetz": "MiLoG", "frage": "#1019 Kann der Arbeitgeber vertraglich eine niedrigere Vergütung als den Mindestlohn festlegen?", "antworten": ["Ja, wenn der Arbeitnehmer schriftlich zustimmt und der Betriebsrat einverstanden ist (§ 3 MiLoG).", "Ja, in den ersten drei Monaten als Einarbeitungsphase (§ 22 MiLoG).", "Nein, solche Vereinbarungen sind unwirksam (§ 3 MiLoG)."], "richtig": 2, "erklaerung": "Nein, solche Vereinbarungen sind unwirksam (§ 3 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1020, "gesetz": "MiLoG", "frage": "#1020 Gilt der Mindestlohn auch bei Kurzarbeit?", "antworten": ["Für tatsächlich geleistete Stunden ja; für ausgefallene Stunden zahlt die Agentur für Arbeit Kurzarbeitergeld, das nicht dem Mindestlohn unterliegt (§ 1 MiLoG, §§ 95 ff. SGB III).", "Nein, bei Kurzarbeit entfällt der Mindestlohn vollständig, auch für geleistete Stunden (§ 1 MiLoG).", "Ja, auch für ausgefallene Stunden muss der Arbeitgeber den vollen Mindestlohn zahlen; die Agentur für Arbeit erstattet ihn (§ 98 SGB III)."], "richtig": 0, "erklaerung": "Für tatsächlich geleistete Stunden ja; für ausgefallene Stunden zahlt die Agentur für Arbeit Kurzarbeitergeld, das nicht dem Mindestlohn unterliegt (§ 1 MiLoG, §§ 95 ff. SGB III).", "schwierigkeit": "mittel"}, {"id": 1021, "gesetz": "MiLoG", "frage": "#1021 Gibt es Branchenmindestlöhne, die über dem gesetzlichen Mindestlohn liegen?", "antworten": ["Ja, für einige Branchen gelten höhere tarifliche Mindestlöhne (§ 1 Abs. 3 MiLoG).", "Ja, aber nur für Branchen mit mehr als 500.000 Beschäftigten, festgelegt durch die Mindestlohnkommission (§ 4 MiLoG).", "Nein, höhere Branchenmindestlöhne sind unzulässig; der gesetzliche Mindestlohn gilt als Obergrenze (§ 1 MiLoG)."], "richtig": 0, "erklaerung": "Ja, für einige Branchen gelten höhere tarifliche Mindestlöhne (§ 1 Abs. 3 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1022, "gesetz": "MiLoG", "frage": "#1022 Gilt der Mindestlohn auch für Saisonarbeitskräfte?", "antworten": ["Nein, Saisonarbeitskräfte sind für die ersten drei Monate vom Mindestlohn ausgenommen (§ 22 MiLoG).", "Ja, uneingeschränkt; bei kurzfristiger Beschäftigung kann lediglich Sozialversicherungsfreiheit bestehen (§ 22 Abs. 1 MiLoG, § 8 Abs. 1 Nr. 2 SGB IV).", "Ja, aber nur zur Hälfte, weil Unterkunft und Verpflegung als Entgelt angerechnet werden (§ 107 GewO)."], "richtig": 1, "erklaerung": "Ja, uneingeschränkt; bei kurzfristiger Beschäftigung kann lediglich Sozialversicherungsfreiheit bestehen (§ 22 Abs. 1 MiLoG, § 8 Abs. 1 Nr. 2 SGB IV).", "schwierigkeit": "leicht"}, {"id": 1023, "gesetz": "MiLoG", "frage": "#1023 Sind Praktikanten vom Mindestlohn ausgenommen?", "antworten": ["Ja, bei allen Praktika bis zu einer Dauer von sechs Monaten (§ 22 Abs. 1 MiLoG).", "Ja, bei Pflichtpraktika sowie bei freiwilligen Orientierungs- oder ausbildungsbegleitenden Praktika bis zu drei Monaten (§ 22 Abs. 1 MiLoG).", "Nein, alle Praktikanten haben ab dem ersten Tag Anspruch auf den Mindestlohn (§ 22 MiLoG)."], "richtig": 1, "erklaerung": "Ja, bei Pflichtpraktika sowie bei freiwilligen Orientierungs- oder ausbildungsbegleitenden Praktika bis zu drei Monaten (§ 22 Abs. 1 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1024, "gesetz": "MiLoG", "frage": "#1024 Welche Regelung gilt für Langzeitarbeitslose beim Mindestlohn?", "antworten": ["Sie erhalten in den ersten sechs Monaten 80 % des Mindestlohns; erst danach gilt der volle Satz (§ 22 MiLoG).", "Der Mindestlohn gilt für sie erst nach sechs Monaten ununterbrochener Beschäftigung (§ 22 Abs. 4 MiLoG).", "Der Mindestlohn gilt für sie uneingeschränkt vom ersten Tag an; eine Ausnahme besteht nur für Rentner (§ 22 MiLoG)."], "richtig": 1, "erklaerung": "Der Mindestlohn gilt für sie erst nach sechs Monaten ununterbrochener Beschäftigung (§ 22 Abs. 4 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1025, "gesetz": "MiLoG", "frage": "#1025 Gilt der Mindestlohn auch für ausländische Arbeitnehmer?", "antworten": ["Nein, der Mindestlohn gilt nur für Personen mit deutscher Staatsangehörigkeit (§ 20 MiLoG).", "Ja, wenn sie in Deutschland arbeiten (§ 20 MiLoG).", "Nur, wenn sie ihren Wohnsitz dauerhaft in Deutschland haben; Grenzpendler sind ausgenommen (§ 20 MiLoG)."], "richtig": 1, "erklaerung": "Ja, wenn sie in Deutschland arbeiten (§ 20 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1026, "gesetz": "MiLoG", "frage": "#1026 Müssen Arbeitgeber bei einer Mindestlohnerhöhung automatisch das Gehalt anpassen?", "antworten": ["Nein, eine Anpassung erfolgt nur, wenn der Arbeitnehmer sie innerhalb von drei Monaten schriftlich verlangt (§ 3 MiLoG).", "Ja, sobald der neue Mindestlohn in Kraft tritt (§ 1 Abs. 2 MiLoG).", "Nein, bestehende Arbeitsverträge behalten bis zum Ablauf des Kalenderjahres den bisherigen Satz (§ 1 MiLoG)."], "richtig": 1, "erklaerung": "Ja, sobald der neue Mindestlohn in Kraft tritt (§ 1 Abs. 2 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1027, "gesetz": "MiLoG", "frage": "#1027 Kann der Mindestlohn durch Sachleistungen ersetzt werden?", "antworten": ["Nein, der Mindestlohn ist in Geld zu zahlen; Sachbezüge dürfen den pfändbaren Teil des Arbeitsentgelts nicht übersteigen (§ 107 Abs. 2 GewO).", "Ja, wenn der Arbeitnehmer schriftlich einwilligt, auch vollständig durch Tank- und Warengutscheine (§ 2 MiLoG).", "Ja, Kost und Logis dürfen bis zur Hälfte auf den Mindestlohn angerechnet werden (§ 107 Abs. 2 GewO)."], "richtig": 0, "erklaerung": "Nein, der Mindestlohn ist in Geld zu zahlen; Sachbezüge dürfen den pfändbaren Teil des Arbeitsentgelts nicht übersteigen (§ 107 Abs. 2 GewO).", "schwierigkeit": "schwer"}, {"id": 1028, "gesetz": "MiLoG", "frage": "#1028 Wie oft wird der Mindestlohn angepasst?", "antworten": ["Jedes Jahr zum 1. Januar automatisch um die Inflationsrate (§ 9 MiLoG).", "Alle fünf Jahre durch Beschluss des Bundestages (§ 1 MiLoG).", "Alle zwei Jahre auf Vorschlag der Mindestlohnkommission (§ 9 MiLoG)."], "richtig": 2, "erklaerung": "Alle zwei Jahre auf Vorschlag der Mindestlohnkommission (§ 9 MiLoG).", "schwierigkeit": "leicht"}, {"id": 1029, "gesetz": "MiLoG", "frage": "#1029 Wer entscheidet über die Anpassung des Mindestlohns?", "antworten": ["Die Bundesagentur für Arbeit setzt ihn nach Anhörung der Tarifpartner durch Verwaltungsakt fest (§ 9 MiLoG).", "Der Bundestag legt den Mindestlohn unmittelbar durch Gesetz fest; die Kommission berät ihn nur (§ 1 MiLoG).", "Die Mindestlohnkommission (Sozialpartner und Wissenschaft) beschließt, die Bundesregierung setzt die Anpassung per Rechtsverordnung fest (§§ 1 Abs. 2, 4, 11 MiLoG)."], "richtig": 2, "erklaerung": "Die Mindestlohnkommission (Sozialpartner und Wissenschaft) beschließt, die Bundesregierung setzt die Anpassung per Rechtsverordnung fest (§§ 1 Abs. 2, 4, 11 MiLoG).", "schwierigkeit": "mittel"}, {"id": 1030, "gesetz": "MiLoG", "frage": "#1030 Welche Möglichkeiten hat ein Arbeitnehmer, wenn der Mindestlohn nicht gezahlt wird?", "antworten": ["Er kann sich an den Zoll (Finanzkontrolle Schwarzarbeit) wenden oder Lohnklage beim Arbeitsgericht erheben (§§ 1, 14 MiLoG).", "Er muss zuerst ein Schlichtungsverfahren bei der Mindestlohnkommission durchlaufen, bevor eine Klage zulässig ist (§ 9 MiLoG).", "Er kann sich an die Gewerbeaufsicht wenden oder Beschwerde bei der IHK einlegen; der Klageweg ist ausgeschlossen (§ 3 MiLoG)."], "richtig": 0, "erklaerung": "Er kann sich an den Zoll (Finanzkontrolle Schwarzarbeit) wenden oder Lohnklage beim Arbeitsgericht erheben (§§ 1, 14 MiLoG).", "schwierigkeit": "schwer"}, {"id": 1051, "gesetz": "BVV", "frage": "#1051 Welche Beiträge muss ein Taxiunternehmen für seine Angestellten abführen?", "antworten": ["Nur die Lohnsteuer und den Solidaritätszuschlag an das Finanzamt; die Sozialbeiträge zahlt der Fahrer selbst (§ 38 EStG).", "Ausschließlich Beiträge zur Unfallversicherung und zur Handwerkskammer (§ 150 SGB VII).", "Gesamtsozialversicherungsbeitrag (Kranken-, Pflege-, Renten-, Arbeitslosenversicherung), Umlagen U1/U2/U3 und Beiträge zur Berufsgenossenschaft (§ 28d SGB IV)."], "richtig": 2, "erklaerung": "Gesamtsozialversicherungsbeitrag (Kranken-, Pflege-, Renten-, Arbeitslosenversicherung), Umlagen U1/U2/U3 und Beiträge zur Berufsgenossenschaft (§ 28d SGB IV).", "schwierigkeit": "leicht"}, {"id": 1052, "gesetz": "BVV", "frage": "#1052 Wann müssen Taxiunternehmen die Sozialversicherungsbeiträge überweisen?", "antworten": ["Quartalsweise, jeweils am zehnten Tag nach Quartalsende (§ 28f SGB IV).", "Spätestens am drittletzten Bankarbeitstag des laufenden Monats in voraussichtlicher Höhe der Beitragsschuld (§ 23 Abs. 1 SGB IV).", "Spätestens am 15. des Folgemonats (§ 23 Abs. 1 SGB IV)."], "richtig": 1, "erklaerung": "Spätestens am drittletzten Bankarbeitstag des laufenden Monats in voraussichtlicher Höhe der Beitragsschuld (§ 23 Abs. 1 SGB IV).", "schwierigkeit": "mittel"}, {"id": 1053, "gesetz": "BVV", "frage": "#1053 Wie berechnet sich der Gesamtsozialversicherungsbeitrag für einen Taxifahrer?", "antworten": ["Der Beitrag wird auf Grundlage des beitragspflichtigen Arbeitsentgelts berechnet (§ 1 BVV).", "Der Beitrag wird allein nach dem Bruttoumsatz des Taxis berechnet, nicht nach dem Entgelt des Fahrers (§ 1 BVV).", "Der Beitrag wird als fester Pauschalbetrag je Fahrer unabhängig vom Entgelt festgesetzt (§ 3 BVV)."], "richtig": 0, "erklaerung": "Der Beitrag wird auf Grundlage des beitragspflichtigen Arbeitsentgelts berechnet (§ 1 BVV).", "schwierigkeit": "schwer"}, {"id": 1054, "gesetz": "BVV", "frage": "#1054 Welche Behörde überwacht die korrekte Abführung von Sozialversicherungsbeiträgen durch Taxiunternehmen?", "antworten": ["Die Industrie- und Handelskammer (§ 7 BVV).", "Die Deutsche Rentenversicherung (§ 7 BVV).", "Das Finanzamt (§ 7 BVV)."], "richtig": 1, "erklaerung": "Die Deutsche Rentenversicherung (§ 7 BVV).", "schwierigkeit": "leicht"}, {"id": 1055, "gesetz": "BVV", "frage": "#1055 Was passiert, wenn ein Taxiunternehmen die Sozialversicherungsbeiträge nicht rechtzeitig zahlt?", "antworten": ["Der Beitrag wird um 10 % erhöht und der Betrieb vorübergehend stillgelegt (§ 24 SGB IV).", "Es fallen Verzugszinsen von 5 % über dem Basiszinssatz pro Jahr an (§ 288 BGB).", "Es fallen Säumniszuschläge von 1 % je angefangenem Monat sowie ggf. Mahngebühren an (§ 24 SGB IV)."], "richtig": 2, "erklaerung": "Es fallen Säumniszuschläge von 1 % je angefangenem Monat sowie ggf. Mahngebühren an (§ 24 SGB IV).", "schwierigkeit": "mittel"}, {"id": 1056, "gesetz": "BVV", "frage": "#1056 Was regelt die Beitragsverfahrensverordnung (BVV)?", "antworten": ["Die Festsetzung der Beitragssätze zur Kranken-, Pflege- und Rentenversicherung (§ 1 BVV).", "Die Erhebung der Lohnsteuer und die Übermittlung der elektronischen Lohnsteuerbescheinigung (§ 41b EStG).", "Die Berechnung, Zahlung, Weiterleitung, Abrechnung und Prüfung des Gesamtsozialversicherungsbeitrags (§ 1 BVV)."], "richtig": 2, "erklaerung": "Die Berechnung, Zahlung, Weiterleitung, Abrechnung und Prüfung des Gesamtsozialversicherungsbeitrags (§ 1 BVV).", "schwierigkeit": "schwer"}, {"id": 1057, "gesetz": "BVV", "frage": "#1057 Wie wird der Gesamtsozialversicherungsbeitrag berechnet?", "antworten": ["Auf Basis des Mindestlohns, unabhängig vom tatsächlichen Entgelt (§ 1 BVV).", "Auf Basis des Jahresumsatzes des Unternehmens (§ 1 BVV).", "Auf Basis des Arbeitsentgelts bis zur Beitragsbemessungsgrenze (§ 1 Abs. 1 BVV)."], "richtig": 2, "erklaerung": "Auf Basis des Arbeitsentgelts bis zur Beitragsbemessungsgrenze (§ 1 Abs. 1 BVV).", "schwierigkeit": "leicht"}, {"id": 1058, "gesetz": "BVV", "frage": "#1058 Wie erfolgt die Rundung bei der Beitragsberechnung?", "antworten": ["Es wird immer abgerundet; Beträge unter einem Euro bleiben unberücksichtigt (§ 1 BVV).", "Das Gesamtergebnis wird auf zwei Dezimalstellen gerundet (§ 1 Abs. 2 BVV).", "Beträge werden stets auf volle Euro aufgerundet (§ 1 Abs. 2 BVV)."], "richtig": 1, "erklaerung": "Das Gesamtergebnis wird auf zwei Dezimalstellen gerundet (§ 1 Abs. 2 BVV).", "schwierigkeit": "mittel"}, {"id": 1059, "gesetz": "BVV", "frage": "#1059 Wer trägt die Sozialversicherungsbeiträge?", "antworten": ["Der Arbeitgeber trägt sie allein; nur die Lohnsteuer trägt der Arbeitnehmer (§ 2 BVV).", "Arbeitgeber und Arbeitnehmer tragen die Beiträge grundsätzlich je zur Hälfte, mit Ausnahmen (z. B. Kinderlosenzuschlag in der Pflegeversicherung) (§ 2 BVV, § 249 SGB V).", "Der Arbeitnehmer trägt die Beiträge zu zwei Dritteln, der Arbeitgeber zu einem Drittel (§ 249 SGB V)."], "richtig": 1, "erklaerung": "Arbeitgeber und Arbeitnehmer tragen die Beiträge grundsätzlich je zur Hälfte, mit Ausnahmen (z. B. Kinderlosenzuschlag in der Pflegeversicherung) (§ 2 BVV, § 249 SGB V).", "schwierigkeit": "schwer"}, {"id": 1060, "gesetz": "BVV", "frage": "#1060 Welche Frist gilt für die Abgabe von Beitragsnachweisen?", "antworten": ["Spätestens einen Monat nach Fälligkeit der Beiträge (§ 28f SGB IV).", "Spätestens zwei Arbeitstage vor Fälligkeit der Beiträge (§ 28f Abs. 3 SGB IV, § 26 DEÜV).", "Beitragsnachweise sind nur auf Verlangen der Einzugsstelle einzureichen (§ 26 DEÜV)."], "richtig": 1, "erklaerung": "Spätestens zwei Arbeitstage vor Fälligkeit der Beiträge (§ 28f Abs. 3 SGB IV, § 26 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1061, "gesetz": "BVV", "frage": "#1061 Wie müssen Sozialversicherungsbeiträge gezahlt werden?", "antworten": ["Ausschließlich per Lastschrift, wobei die Einzugsstelle den Betrag frei am 15. des Monats einzieht (§ 3 BVV).", "Nur bar an die Einzugsstelle oder per Wechsel; Überweisungen sind nicht zugelassen (§ 3 BVV).", "An die Einzugsstelle per Überweisung, Lastschrift, Scheck oder bar; Zahlungen in fremder Währung und durch Wechsel sind nicht zugelassen (§ 3 BVV)."], "richtig": 2, "erklaerung": "An die Einzugsstelle per Überweisung, Lastschrift, Scheck oder bar; Zahlungen in fremder Währung und durch Wechsel sind nicht zugelassen (§ 3 BVV).", "schwierigkeit": "mittel"}, {"id": 1062, "gesetz": "BVV", "frage": "#1062 Wie erfolgt die Beitragsweiterleitung durch die Einzugsstellen?", "antworten": ["Monatlich zum 15. des Folgemonats (§ 5 BVV).", "Die Einzugsstellen müssen die Beiträge täglich weiterleiten (§ 5 BVV).", "Quartalsweise, jeweils zum Quartalsende nach Abschluss der Abrechnung (§ 28k SGB IV)."], "richtig": 1, "erklaerung": "Die Einzugsstellen müssen die Beiträge täglich weiterleiten (§ 5 BVV).", "schwierigkeit": "schwer"}, {"id": 1063, "gesetz": "BVV", "frage": "#1063 Wie werden Beitragsnachweise erstellt?", "antworten": ["Der Steuerberater erstellt den Beitragsnachweis; eine elektronische Übermittlung ist untersagt (§ 26 DEÜV).", "Handschriftlich auf einem Vordruck der Berufsgenossenschaft, der per Post versandt wird (§ 28f SGB IV).", "Arbeitgeber übermitteln den Beitragsnachweis elektronisch aus einem systemgeprüften Programm an die Einzugsstelle (§ 28f Abs. 3 SGB IV, § 26 DEÜV)."], "richtig": 2, "erklaerung": "Arbeitgeber übermitteln den Beitragsnachweis elektronisch aus einem systemgeprüften Programm an die Einzugsstelle (§ 28f Abs. 3 SGB IV, § 26 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1064, "gesetz": "BVV", "frage": "#1064 Wie lange müssen Beitragsabrechnungen aufbewahrt werden?", "antworten": ["Bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres (§ 28f Abs. 1 SGB IV, § 9 Abs. 5 BVV); steuerliche Fristen bleiben unberührt.", "Drei Monate nach Zahlung der Beiträge (§ 9 BVV).", "Ein Jahr nach Ablauf des Beschäftigungsverhältnisses (§ 28f SGB IV)."], "richtig": 0, "erklaerung": "Bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres (§ 28f Abs. 1 SGB IV, § 9 Abs. 5 BVV); steuerliche Fristen bleiben unberührt.", "schwierigkeit": "mittel"}, {"id": 1065, "gesetz": "BVV", "frage": "#1065 Welche Daten müssen in den Entgeltunterlagen enthalten sein?", "antworten": ["Nur Name und Entgelt; Beschäftigungsbeginn und Einzugsstelle sind nicht aufzunehmen (§ 8 BVV).", "Name, Geburtsdatum, Anschrift, Beginn und Ende der Beschäftigung, Arbeitsentgelt, Beitragsgruppenschlüssel und Einzugsstelle (§ 8 Abs. 1 BVV).", "Name, Führerscheinklasse, Fahrzeugkennzeichen, Entgelt und Zahl der Fahrten (§ 8 BVV)."], "richtig": 1, "erklaerung": "Name, Geburtsdatum, Anschrift, Beginn und Ende der Beschäftigung, Arbeitsentgelt, Beitragsgruppenschlüssel und Einzugsstelle (§ 8 Abs. 1 BVV).", "schwierigkeit": "schwer"}, {"id": 1066, "gesetz": "BVV", "frage": "#1066 Welche Behörde ist für die Kontrolle der Sozialversicherungsbeiträge zuständig?", "antworten": ["Die Krankenkasse der Fahrer allein (§ 7 BVV).", "Die Rentenversicherungsträger (§ 7 BVV).", "Die Genehmigungsbehörde nach dem Personenbeförderungsgesetz (§ 7 BVV)."], "richtig": 1, "erklaerung": "Die Rentenversicherungsträger (§ 7 BVV).", "schwierigkeit": "leicht"}, {"id": 1067, "gesetz": "BVV", "frage": "#1067 Wie oft werden Taxiunternehmen auf ihre Sozialversicherungsbeiträge geprüft?", "antworten": ["Nur anlassbezogen bei Verdacht auf Schwarzarbeit; eine regelmäßige Prüfung ist nicht vorgesehen (§ 28p SGB IV).", "Jährlich, jeweils zum 31. März (§ 28p SGB IV).", "Mindestens alle vier Jahre (§ 28p Abs. 1 SGB IV)."], "richtig": 2, "erklaerung": "Mindestens alle vier Jahre (§ 28p Abs. 1 SGB IV).", "schwierigkeit": "mittel"}, {"id": 1068, "gesetz": "BVV", "frage": "#1068 Welche Folgen hat eine falsche Beitragsabrechnung?", "antworten": ["Eine pauschale Strafzahlung von 1.000 € je betroffenem Arbeitnehmer und Entzug der Genehmigung (§ 111 SGB IV).", "Nachforderungen per Prüfbescheid, Säumniszuschläge oder Bußgelder (§§ 24, 28p, 111 SGB IV).", "Ausschließlich eine Verwarnung; Nachforderungen sind nach Ablauf eines Jahres ausgeschlossen (§ 25 SGB IV)."], "richtig": 1, "erklaerung": "Nachforderungen per Prüfbescheid, Säumniszuschläge oder Bußgelder (§§ 24, 28p, 111 SGB IV).", "schwierigkeit": "schwer"}, {"id": 1069, "gesetz": "BVV", "frage": "#1069 Wie wird die Zahlung von Sozialversicherungsbeiträgen nachgewiesen?", "antworten": ["Der Arbeitgeber muss den Zahlungsbeleg jährlich beim Finanzamt einreichen (§ 41a EStG).", "Durch eine Quittung der Berufsgenossenschaft, die jährlich ausgestellt wird (§ 28f SGB IV).", "Die Beitragshöhe wird per elektronischem Beitragsnachweis gemeldet (§ 28f Abs. 3 SGB IV); als Tag der Zahlung gilt z. B. die Wertstellung bei der Einzugsstelle (§ 3 BVV)."], "richtig": 2, "erklaerung": "Die Beitragshöhe wird per elektronischem Beitragsnachweis gemeldet (§ 28f Abs. 3 SGB IV); als Tag der Zahlung gilt z. B. die Wertstellung bei der Einzugsstelle (§ 3 BVV).", "schwierigkeit": "leicht"}, {"id": 1070, "gesetz": "BVV", "frage": "#1070 Welche Sanktionen drohen bei Nichtzahlung der Beiträge?", "antworten": ["Entzug der Fahrerlaubnis zur Fahrgastbeförderung für alle Fahrer des Unternehmens (§ 266a StGB).", "Nur eine Ermahnung durch die Einzugsstelle; eine Strafverfolgung ist ausgeschlossen (§ 24 SGB IV).", "Säumniszuschläge, Zwangsvollstreckung und Strafbarkeit wegen Vorenthaltens von Arbeitsentgelt (§ 24 SGB IV, § 266a StGB)."], "richtig": 2, "erklaerung": "Säumniszuschläge, Zwangsvollstreckung und Strafbarkeit wegen Vorenthaltens von Arbeitsentgelt (§ 24 SGB IV, § 266a StGB).", "schwierigkeit": "mittel"}, {"id": 1071, "gesetz": "BVV", "frage": "#1071 Welche Beiträge müssen für Minijobber in Taxiunternehmen gezahlt werden?", "antworten": ["Pauschalbeiträge zur Kranken- und Rentenversicherung, ggf. RV-Eigenanteil des Minijobbers, Umlagen und ggf. Pauschsteuer an die Minijob-Zentrale (§ 249b SGB V, § 172 SGB VI).", "Volle Beiträge zu Kranken-, Pflege-, Renten- und Arbeitslosenversicherung wie bei regulär Beschäftigten (§ 28d SGB IV).", "Nur Beiträge zur Unfallversicherung; Kranken- und Rentenversicherung entfallen vollständig (§ 249b SGB V)."], "richtig": 0, "erklaerung": "Pauschalbeiträge zur Kranken- und Rentenversicherung, ggf. RV-Eigenanteil des Minijobbers, Umlagen und ggf. Pauschsteuer an die Minijob-Zentrale (§ 249b SGB V, § 172 SGB VI).", "schwierigkeit": "schwer"}, {"id": 1072, "gesetz": "BVV", "frage": "#1072 Wie werden Beiträge für kurzfristige Beschäftigungen berechnet?", "antworten": ["Pauschalbeiträge von insgesamt 28 % an die Minijob-Zentrale (§ 249b SGB V).", "Es gelten die vollen Beitragssätze, jedoch nur zur Hälfte (§ 20 SGB IV).", "Kurzfristige Beschäftigungen (max. drei Monate oder 70 Arbeitstage im Kalenderjahr) sind sozialversicherungsfrei; es fallen nur Umlagen und Unfallversicherung an (§ 8 Abs. 1 Nr. 2 SGB IV)."], "richtig": 2, "erklaerung": "Kurzfristige Beschäftigungen (max. drei Monate oder 70 Arbeitstage im Kalenderjahr) sind sozialversicherungsfrei; es fallen nur Umlagen und Unfallversicherung an (§ 8 Abs. 1 Nr. 2 SGB IV).", "schwierigkeit": "leicht"}, {"id": 1073, "gesetz": "BVV", "frage": "#1073 Wie werden Beiträge bei geringfügig entlohnten Beschäftigten abgerechnet?", "antworten": ["Über die regulären Beiträge zu allen Sozialversicherungszweigen an die Krankenkasse (§ 28d SGB IV).", "Der Arbeitgeber zahlt pauschal 30 % an die Berufsgenossenschaft (§ 150 SGB VII).", "Über Pauschalbeiträge des Arbeitgebers (KV 13 %, RV 15 %) an die Minijob-Zentrale (§ 249b SGB V, § 172 Abs. 3 SGB VI)."], "richtig": 2, "erklaerung": "Über Pauschalbeiträge des Arbeitgebers (KV 13 %, RV 15 %) an die Minijob-Zentrale (§ 249b SGB V, § 172 Abs. 3 SGB VI).", "schwierigkeit": "mittel"}, {"id": 1074, "gesetz": "BVV", "frage": "#1074 Welche Regelung gilt für Beiträge bei Altersteilzeit?", "antworten": ["Der Arbeitgeber muss keine Beiträge zahlen, da die Altersteilzeit beitragsfrei gestellt ist (§ 3 AltTZG).", "Der Arbeitnehmer muss die zusätzlichen Beiträge allein tragen (§ 168 SGB VI).", "Der Arbeitgeber muss zusätzliche Beiträge zur Rentenversicherung zahlen (§ 3 Abs. 1 Nr. 1 Buchst. b AltTZG; Aufzeichnung nach § 8 Abs. 1 Nr. 12 BVV)."], "richtig": 2, "erklaerung": "Der Arbeitgeber muss zusätzliche Beiträge zur Rentenversicherung zahlen (§ 3 Abs. 1 Nr. 1 Buchst. b AltTZG; Aufzeichnung nach § 8 Abs. 1 Nr. 12 BVV).", "schwierigkeit": "schwer"}, {"id": 1075, "gesetz": "BVV", "frage": "#1075 Wie werden Beiträge bei Krankheit eines Arbeitnehmers weitergeführt?", "antworten": ["Der Arbeitgeber zahlt weiter die vollen Beiträge bis zum Ende des Krankengeldbezugs (§ 249 SGB V).", "Die Beiträge entfallen sofort ab dem ersten Krankheitstag vollständig (§ 224 SGB V).", "Während der Entgeltfortzahlung (bis sechs Wochen) normal weiter; bei Bezug von Krankengeld entfallen die Arbeitgeberbeiträge (§ 3 EntgFG, § 224 SGB V)."], "richtig": 2, "erklaerung": "Während der Entgeltfortzahlung (bis sechs Wochen) normal weiter; bei Bezug von Krankengeld entfallen die Arbeitgeberbeiträge (§ 3 EntgFG, § 224 SGB V).", "schwierigkeit": "leicht"}, {"id": 1076, "gesetz": "BVV", "frage": "#1076 Wie erfolgt die Prüfung der Sozialversicherungsbeiträge durch die Rentenversicherung?", "antworten": ["Durch Befragung der Arbeitnehmer durch die Krankenkasse einmal pro Jahr (§ 28p SGB IV).", "Durch regelmäßige Betriebsprüfungen beim Arbeitgeber (§ 7 BVV).", "Durch das Finanzamt im Rahmen der Lohnsteuer-Außenprüfung, die alle Beitragsfragen abschließend klärt (§ 42f EStG)."], "richtig": 1, "erklaerung": "Durch regelmäßige Betriebsprüfungen beim Arbeitgeber (§ 7 BVV).", "schwierigkeit": "mittel"}, {"id": 1077, "gesetz": "BVV", "frage": "#1077 Welche Besonderheiten gibt es bei Saisonarbeitern?", "antworten": ["Saisonkräfte sind ab dem ersten Tag nur rentenversicherungsfrei, aber krankenversicherungspflichtig (§ 8 SGB IV).", "Saisonkräfte sind bei kurzfristiger Beschäftigung (max. drei Monate oder 70 Arbeitstage) sozialversicherungsfrei (§ 8 Abs. 1 Nr. 2 SGB IV).", "Saisonkräfte sind stets sozialversicherungspflichtig, auch bei kurzfristiger Beschäftigung von wenigen Wochen (§ 5 SGB IV)."], "richtig": 1, "erklaerung": "Saisonkräfte sind bei kurzfristiger Beschäftigung (max. drei Monate oder 70 Arbeitstage) sozialversicherungsfrei (§ 8 Abs. 1 Nr. 2 SGB IV).", "schwierigkeit": "schwer"}, {"id": 1078, "gesetz": "BVV", "frage": "#1078 Welche Angaben müssen Arbeitgeber für die Betriebsprüfung bereithalten?", "antworten": ["Nur die Gewerbeanmeldung und den Fahrzeugschein (§ 8 BVV).", "Die Bilanz und die Gewinn- und Verlustrechnung des Unternehmens (§ 238 HGB).", "Entgeltunterlagen, Beitragsnachweise, Lohnabrechnungen (§ 8 BVV)."], "richtig": 2, "erklaerung": "Entgeltunterlagen, Beitragsnachweise, Lohnabrechnungen (§ 8 BVV).", "schwierigkeit": "leicht"}, {"id": 1079, "gesetz": "BVV", "frage": "#1079 Wie erfolgt die Tilgung von Beitragsschulden?", "antworten": ["Der Arbeitgeber kann bestimmen, welche Schuld getilgt wird (z. B. vorrangig Arbeitnehmeranteile); sonst gilt: Auslagen, Gebühren, Beiträge, Säumniszuschläge, Zinsen, Bußgelder (§ 4 BVV).", "Die Einzugsstelle bestimmt allein die Tilgungsreihenfolge; der Arbeitgeber hat kein Bestimmungsrecht (§ 4 BVV).", "Zuerst werden Säumniszuschläge getilgt, dann Beiträge; Arbeitnehmeranteile werden nie vorrangig getilgt (§ 24 SGB IV)."], "richtig": 0, "erklaerung": "Der Arbeitgeber kann bestimmen, welche Schuld getilgt wird (z. B. vorrangig Arbeitnehmeranteile); sonst gilt: Auslagen, Gebühren, Beiträge, Säumniszuschläge, Zinsen, Bußgelder (§ 4 BVV).", "schwierigkeit": "mittel"}, {"id": 1080, "gesetz": "BVV", "frage": "#1080 Welche Rechte haben Arbeitgeber bei Prüfungen?", "antworten": ["Sie dürfen sich über die Ergebnisse informieren und eine Stellungnahme abgeben (§ 7 BVV).", "Sie dürfen die Herausgabe der Entgeltunterlagen verweigern, solange kein Gerichtsbeschluss vorliegt (§ 7 BVV).", "Sie dürfen die Prüfer ablehnen und eine Prüfung auf höchstens zwei Jahre verschieben (§ 28p SGB IV)."], "richtig": 0, "erklaerung": "Sie dürfen sich über die Ergebnisse informieren und eine Stellungnahme abgeben (§ 7 BVV).", "schwierigkeit": "schwer"}, {"id": 1101, "gesetz": "DEÜV", "frage": "#1101 Müssen Taxiunternehmen die Sozialversicherungsdaten ihrer Mitarbeiter melden?", "antworten": ["Ja, sie sind verpflichtet, die Meldungen zur Sozialversicherung nach den Vorgaben der DEÜV zu übermitteln (§ 1 DEÜV).", "Nur bei Mitarbeitern mit mehr als 20 Wochenarbeitsstunden (§ 3 DEÜV).", "Nein, die Meldungen übernehmen die Krankenkassen der Mitarbeiter (§ 28a SGB IV)."], "richtig": 0, "erklaerung": "Ja, sie sind verpflichtet, die Meldungen zur Sozialversicherung nach den Vorgaben der DEÜV zu übermitteln (§ 1 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1102, "gesetz": "DEÜV", "frage": "#1102 Welche Meldungen sind von Taxiunternehmen für ihre Fahrer notwendig?", "antworten": ["Nur die Jahresmeldung zum 31. Dezember; An- und Abmeldungen entfallen (§ 10 DEÜV).", "Anmeldung und Gewerbeummeldung bei der Genehmigungsbehörde sowie Fahrtenbuchmeldung (§ 6 DEÜV).", "Anmeldung, Abmeldung, Jahresmeldung und Entgeltmeldungen (§§ 6-12 DEÜV)."], "richtig": 2, "erklaerung": "Anmeldung, Abmeldung, Jahresmeldung und Entgeltmeldungen (§§ 6-12 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1103, "gesetz": "DEÜV", "frage": "#1103 Bis wann muss die Anmeldung eines neuen Taxifahrers bei der Sozialversicherung erfolgen?", "antworten": ["Spätestens mit der ersten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach Arbeitsbeginn (§ 6 DEÜV).", "Spätestens innerhalb von drei Monaten nach Beschäftigungsbeginn zusammen mit der ersten Jahresmeldung (§ 10 DEÜV).", "Spätestens am letzten Tag des Monats, in dem die Beschäftigung begonnen hat (§ 6 DEÜV)."], "richtig": 0, "erklaerung": "Spätestens mit der ersten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach Arbeitsbeginn (§ 6 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1104, "gesetz": "DEÜV", "frage": "#1104 Was ist eine Sofortmeldung und gilt sie für Taxiunternehmen?", "antworten": ["Eine Meldung bis zum Ende des Monats; sie gilt nur für das Baugewerbe und die Gebäudereinigung (§ 28a Abs. 4 SGB IV).", "Eine freiwillige Vorab-Meldung an die Krankenkasse, die für Taxiunternehmen nicht gilt (§ 7 DEÜV).", "Meldung des Beschäftigungsbeginns spätestens bei Arbeitsaufnahme an die Datenstelle der Rentenversicherung; Pflicht auch im Personenbeförderungsgewerbe, also für Taxi und Mietwagen (§ 7 DEÜV, § 28a Abs. 4 SGB IV)."], "richtig": 2, "erklaerung": "Meldung des Beschäftigungsbeginns spätestens bei Arbeitsaufnahme an die Datenstelle der Rentenversicherung; Pflicht auch im Personenbeförderungsgewerbe, also für Taxi und Mietwagen (§ 7 DEÜV, § 28a Abs. 4 SGB IV).", "schwierigkeit": "leicht"}, {"id": 1105, "gesetz": "DEÜV", "frage": "#1105 Welche Meldepflichten bestehen für geringfügig beschäftigte Fahrer (Minijobber) in Taxiunternehmen?", "antworten": ["Sie sind bei der Minijob-Zentrale an- und abzumelden (inkl. Sofortmeldung); ein Antrag auf Befreiung von der Rentenversicherungspflicht ist gesondert zu melden (§§ 5 Abs. 12, 13 DEÜV).", "Eine Meldung ist nicht erforderlich, solange der Verdienst unter der Geringfügigkeitsgrenze liegt (§ 8 SGB IV).", "Sie sind bei der Krankenkasse und beim Finanzamt anzumelden; die Minijob-Zentrale ist nicht zuständig (§ 5 DEÜV)."], "richtig": 0, "erklaerung": "Sie sind bei der Minijob-Zentrale an- und abzumelden (inkl. Sofortmeldung); ein Antrag auf Befreiung von der Rentenversicherungspflicht ist gesondert zu melden (§§ 5 Abs. 12, 13 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1106, "gesetz": "DEÜV", "frage": "#1106 Was regelt die Datenerfassungs- und -übermittlungsverordnung (DEÜV)?", "antworten": ["Die elektronische Erfassung und Übermittlung von Daten zur Sozialversicherung (§ 1 DEÜV).", "Das Verfahren zur Erhebung der Lohnsteuer und der Kirchensteuer (§ 41a EStG).", "Die Beitragszahlung und Einziehung von Sozialversicherungsbeiträgen durch die Einzugsstellen (§ 28h SGB IV)."], "richtig": 0, "erklaerung": "Die elektronische Erfassung und Übermittlung von Daten zur Sozialversicherung (§ 1 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1107, "gesetz": "DEÜV", "frage": "#1107 Wer ist zur Meldung von Sozialversicherungsdaten verpflichtet?", "antworten": ["Nur Arbeitnehmer selbst über ihre Krankenkasse (§ 2 DEÜV).", "Ausschließlich Steuerberater und das Finanzamt (§ 2 DEÜV).", "Arbeitgeber, Zahlstellen, Behörden und andere Institutionen (§ 2 DEÜV)."], "richtig": 2, "erklaerung": "Arbeitgeber, Zahlstellen, Behörden und andere Institutionen (§ 2 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1108, "gesetz": "DEÜV", "frage": "#1108 Für welche Personengruppen müssen Meldungen erfolgen?", "antworten": ["Nur versicherungspflichtige Vollzeitbeschäftigte; geringfügig Beschäftigte und Leiharbeiter sind ausgenommen (§ 3 DEÜV).", "Nur Beschäftigte mit deutscher Staatsangehörigkeit und Wohnsitz im Inland (§ 3 DEÜV).", "Alle versicherungspflichtigen Beschäftigten, geringfügig Beschäftigte, Leiharbeiter und Entgeltersatzleistungsbezieher (§ 3 DEÜV)."], "richtig": 2, "erklaerung": "Alle versicherungspflichtigen Beschäftigten, geringfügig Beschäftigte, Leiharbeiter und Entgeltersatzleistungsbezieher (§ 3 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1109, "gesetz": "DEÜV", "frage": "#1109 Welche Angaben müssen in einer Sozialversicherungsmeldung enthalten sein?", "antworten": ["Name, Führerscheinnummer, Taxi-Konzessionsnummer, Entgelt und Arbeitsstunden (§ 5 DEÜV).", "Name, Steuerklasse, Religionszugehörigkeit, Familienstand und Anzahl der Kinder (§ 28a SGB IV).", "Name, Geburtsdatum, Versicherungsnummer, Beschäftigungszeit, Entgelt und Beitragsgruppen (§ 28a Abs. 3 SGB IV, § 5 DEÜV)."], "richtig": 2, "erklaerung": "Name, Geburtsdatum, Versicherungsnummer, Beschäftigungszeit, Entgelt und Beitragsgruppen (§ 28a Abs. 3 SGB IV, § 5 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1110, "gesetz": "DEÜV", "frage": "#1110 Wie erfolgt die Meldung von beitragspflichtigem Arbeitsentgelt?", "antworten": ["Das Entgelt ist in vollen Beträgen zu melden, Beträge nach dem Komma werden kaufmännisch gerundet (§ 5 Abs. 4 DEÜV).", "Das Entgelt ist stets auf die nächsten 100 € abzurunden (§ 5 DEÜV).", "Das Entgelt ist in Cent zu melden, ohne Rundung (§ 5 DEÜV)."], "richtig": 0, "erklaerung": "Das Entgelt ist in vollen Beträgen zu melden, Beträge nach dem Komma werden kaufmännisch gerundet (§ 5 Abs. 4 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1111, "gesetz": "DEÜV", "frage": "#1111 Welche Meldungen sind für die Sozialversicherung erforderlich?", "antworten": ["Lohnsteueranmeldung, Umsatzsteuervoranmeldung sowie An- und Abmeldung bei der Berufsgenossenschaft (§§ 6-12 DEÜV).", "Nur die Anmeldung; alle weiteren Meldungen entfallen (§ 6 DEÜV).", "Anmeldung, Abmeldung, Jahresmeldung, Unterbrechungsmeldung und Meldung von Einmalzahlungen (§§ 6-12 DEÜV)."], "richtig": 2, "erklaerung": "Anmeldung, Abmeldung, Jahresmeldung, Unterbrechungsmeldung und Meldung von Einmalzahlungen (§§ 6-12 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1112, "gesetz": "DEÜV", "frage": "#1112 Wann muss eine Jahresmeldung erfolgen?", "antworten": ["Spätestens bis zum 15. Februar des Folgejahres für alle am 31. Dezember Beschäftigten (§ 10 DEÜV).", "Spätestens bis zum 31. März des Folgejahres für alle im Kalenderjahr Beschäftigten (§ 10 DEÜV).", "Jeweils zum 15. Januar, aber nur für Beschäftigte mit einem Entgelt über der Beitragsbemessungsgrenze (§ 10 DEÜV)."], "richtig": 0, "erklaerung": "Spätestens bis zum 15. Februar des Folgejahres für alle am 31. Dezember Beschäftigten (§ 10 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1113, "gesetz": "DEÜV", "frage": "#1113 Wann ist eine Unterbrechungsmeldung erforderlich?", "antworten": ["Bei Wegfall des Entgeltanspruchs für mindestens einen Kalendermonat wegen Krankengeld, Elternzeit o. Ä.; Meldung binnen zwei Wochen nach Ablauf des ersten Monats (§ 9 DEÜV).", "Bei jedem Wechsel der Krankenkasse des Arbeitnehmers; die Meldung ist sofort an die neue Krankenkasse zu richten (§ 6 DEÜV).", "Bei jeder Urlaubsabwesenheit von mehr als zwei Wochen; Meldung am ersten Tag der Abwesenheit (§ 9 DEÜV)."], "richtig": 0, "erklaerung": "Bei Wegfall des Entgeltanspruchs für mindestens einen Kalendermonat wegen Krankengeld, Elternzeit o. Ä.; Meldung binnen zwei Wochen nach Ablauf des ersten Monats (§ 9 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1114, "gesetz": "DEÜV", "frage": "#1114 Wann muss eine Abmeldung eines Arbeitnehmers erfolgen?", "antworten": ["Spätestens innerhalb von zwei Wochen nach Ablauf des Kalenderjahres, in dem die Beschäftigung endete (§ 8 DEÜV).", "Spätestens am letzten Arbeitstag des Beschäftigungsverhältnisses, andernfalls ist die Abmeldung unwirksam (§ 8 DEÜV).", "Spätestens mit der nächsten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach dem Ende der Beschäftigung (§ 8 DEÜV)."], "richtig": 2, "erklaerung": "Spätestens mit der nächsten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach dem Ende der Beschäftigung (§ 8 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1115, "gesetz": "DEÜV", "frage": "#1115 Was ist eine Insolvenzmeldung?", "antworten": ["Eine Anmeldung der Arbeitnehmer bei der Bundesagentur für Arbeit zur Beantragung von Kurzarbeitergeld (§ 8a DEÜV).", "Eine Meldung der Krankenkasse an das Insolvenzgericht über Beitragsrückstände des Arbeitgebers (§ 8a DEÜV).", "Eine spezielle Abmeldung bei Insolvenz des Unternehmens (§ 8a DEÜV)."], "richtig": 2, "erklaerung": "Eine spezielle Abmeldung bei Insolvenz des Unternehmens (§ 8a DEÜV).", "schwierigkeit": "schwer"}, {"id": 1116, "gesetz": "DEÜV", "frage": "#1116 Wie müssen die Meldungen übermittelt werden?", "antworten": ["Per Telefax an die Minijob-Zentrale, ersatzweise formlos per E-Mail an die Krankenkasse (§ 17 DEÜV).", "Schriftlich per Post oder persönlich bei der Einzugsstelle; eine elektronische Übermittlung ist ausgeschlossen (§ 17 DEÜV).", "Elektronisch über ein gesichertes Datenübertragungsverfahren (§ 17 DEÜV)."], "richtig": 2, "erklaerung": "Elektronisch über ein gesichertes Datenübertragungsverfahren (§ 17 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1117, "gesetz": "DEÜV", "frage": "#1117 Was passiert, wenn eine Meldung fehlerhafte Angaben enthält?", "antworten": ["Sie muss unverzüglich storniert und korrigiert werden (§ 14 DEÜV).", "Sie wird von der Krankenkasse selbstständig korrigiert; der Arbeitgeber muss nichts veranlassen (§ 13 DEÜV).", "Sie bleibt bis zum Jahresende unverändert und wird dann mit der Jahresmeldung berichtigt (§ 14 DEÜV)."], "richtig": 0, "erklaerung": "Sie muss unverzüglich storniert und korrigiert werden (§ 14 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1118, "gesetz": "DEÜV", "frage": "#1118 Welche technische Vorschrift gilt für die elektronische Datenübertragung?", "antworten": ["Sie muss als PDF-Dokument mit qualifizierter elektronischer Signatur erfolgen (§ 16 DEÜV).", "Sie muss im Standard XML-Format und UTF-8 codiert erfolgen (§ 16 DEÜV).", "Sie muss im CSV-Format mit ISO-8859-1-Kodierung erfolgen (§ 16 DEÜV)."], "richtig": 1, "erklaerung": "Sie muss im Standard XML-Format und UTF-8 codiert erfolgen (§ 16 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1119, "gesetz": "DEÜV", "frage": "#1119 Welche Rolle spielt die Rentenversicherung in der Datenverarbeitung?", "antworten": ["Sie zieht die Gesamtsozialversicherungsbeiträge ein und leitet sie an die Krankenkassen weiter (§ 28h SGB IV).", "Sie nimmt keine Meldedaten entgegen; diese gehen ausschließlich an das Finanzamt (§ 36 DEÜV).", "Sie speichert und verarbeitet die Meldedaten für die Sozialversicherungsträger (§ 36 DEÜV)."], "richtig": 2, "erklaerung": "Sie speichert und verarbeitet die Meldedaten für die Sozialversicherungsträger (§ 36 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1120, "gesetz": "DEÜV", "frage": "#1120 Wie werden fehlerhafte Meldungen behandelt?", "antworten": ["Sie werden von der Annahmestelle automatisch berichtigt und der Krankenkasse mit einem Hinweis weitergeleitet (§ 23 DEÜV).", "Sie werden von der Annahmestelle zurückgewiesen und müssen vom Arbeitgeber korrigiert werden (§ 23 DEÜV).", "Sie werden bis zur nächsten Betriebsprüfung gesammelt und dann vom Prüfer berichtigt (§ 28p SGB IV)."], "richtig": 1, "erklaerung": "Sie werden von der Annahmestelle zurückgewiesen und müssen vom Arbeitgeber korrigiert werden (§ 23 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1121, "gesetz": "DEÜV", "frage": "#1121 Welche Behörde überprüft die Einhaltung der DEÜV?", "antworten": ["Ausschließlich das Hauptzollamt prüft die Meldungen; die Rentenversicherung ist daran nicht beteiligt (§ 2 SchwarzArbG).", "Die Gewerbeaufsichtsämter prüfen die Einhaltung der Meldepflichten; Betriebsprüfungen führt die Bundesagentur für Arbeit durch (§ 28p SGB IV).", "Die Einzugsstellen (Krankenkassen) prüfen eingehende Meldungen (§ 33 DEÜV); bei Betriebsprüfungen prüft die Rentenversicherung (§ 28p SGB IV)."], "richtig": 2, "erklaerung": "Die Einzugsstellen (Krankenkassen) prüfen eingehende Meldungen (§ 33 DEÜV); bei Betriebsprüfungen prüft die Rentenversicherung (§ 28p SGB IV).", "schwierigkeit": "schwer"}, {"id": 1122, "gesetz": "DEÜV", "frage": "#1122 Wie oft werden Unternehmen hinsichtlich ihrer Sozialversicherungsmeldungen geprüft?", "antworten": ["Mindestens alle zwei Jahre durch die Krankenkasse des Arbeitnehmers (§ 28p Abs. 1 SGB IV).", "Mindestens alle vier Jahre im Rahmen der Betriebsprüfung der Rentenversicherung (§ 28p Abs. 1 SGB IV).", "Nur anlassbezogen bei Verdacht auf Schwarzarbeit; eine regelmäßige Prüfung ist nicht vorgesehen (§ 28p SGB IV)."], "richtig": 1, "erklaerung": "Mindestens alle vier Jahre im Rahmen der Betriebsprüfung der Rentenversicherung (§ 28p Abs. 1 SGB IV).", "schwierigkeit": "leicht"}, {"id": 1123, "gesetz": "DEÜV", "frage": "#1123 Welche Strafen drohen bei fehlerhaften oder unterlassenen Meldungen?", "antworten": ["Melde-Ordnungswidrigkeiten können mit Geldbuße bis 25.000 € geahndet werden (§ 111 SGB IV).", "Es droht ausschließlich ein Verwarnungsgeld von höchstens 55 €; ein Bußgeld ist nicht vorgesehen (§ 56 OWiG).", "Melde-Ordnungswidrigkeiten sind Straftaten und werden mit Freiheitsstrafe bis zu einem Jahr bestraft (§ 266a StGB)."], "richtig": 0, "erklaerung": "Melde-Ordnungswidrigkeiten können mit Geldbuße bis 25.000 € geahndet werden (§ 111 SGB IV).", "schwierigkeit": "mittel"}, {"id": 1124, "gesetz": "DEÜV", "frage": "#1124 Wann kann eine Meldung zurückgewiesen werden?", "antworten": ["Wenn die Beschäftigung weniger als einen Monat gedauert hat; kurzfristige Meldungen werden nicht angenommen (§ 33 DEÜV).", "Wenn sie unvollständig oder fehlerhaft ist oder falsche Schlüsselzahlen enthält (§ 33 DEÜV).", "Wenn sie erst nach 12 Uhr am letzten Tag der Meldefrist eingeht; verspätete Meldungen werden stets zurückgewiesen (§ 33 DEÜV)."], "richtig": 1, "erklaerung": "Wenn sie unvollständig oder fehlerhaft ist oder falsche Schlüsselzahlen enthält (§ 33 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1125, "gesetz": "DEÜV", "frage": "#1125 Welche Verpflichtungen haben Arbeitgeber bei der Speicherung der Meldungen?", "antworten": ["Sie sind nur bis zum Ende des Kalenderjahres aufzubewahren, in dem die Meldung erfolgte (§ 8 Abs. 2 BVV).", "Eine Aufbewahrung ist nicht nötig, da die Datenstelle der Rentenversicherung die Meldedaten dauerhaft speichert (§ 28f SGB IV).", "Die Meldedaten gehören zu den Entgeltunterlagen und sind bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres aufzubewahren (§ 8 Abs. 2 BVV, § 28f SGB IV)."], "richtig": 2, "erklaerung": "Die Meldedaten gehören zu den Entgeltunterlagen und sind bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres aufzubewahren (§ 8 Abs. 2 BVV, § 28f SGB IV).", "schwierigkeit": "leicht"}, {"id": 1126, "gesetz": "DEÜV", "frage": "#1126 Welche Besonderheiten gelten für geringfügig Beschäftigte in der Sozialversicherungsmeldung?", "antworten": ["Sie sind von jeder Meldepflicht befreit, solange das Entgelt unter der Geringfügigkeitsgrenze liegt (§ 8 SGB IV).", "Sie werden bei der Krankenkasse der Hauptbeschäftigung gemeldet; die Minijob-Zentrale ist dafür nie zuständig (§ 13 DEÜV).", "Ihre Daten müssen an die Minijob-Zentrale übermittelt werden (§ 13 DEÜV)."], "richtig": 2, "erklaerung": "Ihre Daten müssen an die Minijob-Zentrale übermittelt werden (§ 13 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1127, "gesetz": "DEÜV", "frage": "#1127 Wie werden Entgeltersatzleistungen (z. B. Krankengeld) gemeldet?", "antworten": ["Der Arbeitgeber meldet das Krankengeld mit der nächsten Entgeltmeldung selbst an die Krankenkasse (§ 38 DEÜV).", "Die Krankenkassen und anderen Leistungsträger sind zur Meldung an die Rentenversicherung verpflichtet (§ 38 DEÜV).", "Die Arbeitnehmer müssen den Bezug von Entgeltersatzleistungen binnen zwei Wochen selbst bei der Rentenversicherung melden (§ 38 DEÜV)."], "richtig": 1, "erklaerung": "Die Krankenkassen und anderen Leistungsträger sind zur Meldung an die Rentenversicherung verpflichtet (§ 38 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1128, "gesetz": "DEÜV", "frage": "#1128 Was passiert, wenn eine Versicherungsnummer nicht bekannt ist?", "antworten": ["Der Arbeitgeber darf den Arbeitnehmer erst nach Vorlage der Nummer beschäftigen; bis dahin ruht die Meldepflicht (§ 5 DEÜV).", "Der Arbeitgeber muss eine Nummernvergabe beantragen (§ 5 Abs. 6 DEÜV).", "Die Meldung kann ohne Versicherungsnummer unterbleiben; die Krankenkasse vergibt die Nummer später von Amts wegen (§ 5 DEÜV)."], "richtig": 1, "erklaerung": "Der Arbeitgeber muss eine Nummernvergabe beantragen (§ 5 Abs. 6 DEÜV).", "schwierigkeit": "leicht"}, {"id": 1129, "gesetz": "DEÜV", "frage": "#1129 Welche Meldepflichten bestehen für Leiharbeitnehmer?", "antworten": ["Der Verleihbetrieb muss Sozialversicherungsmeldungen vornehmen (§ 3 DEÜV).", "Der Entleiher muss die Meldungen vornehmen, da der Arbeitnehmer in seinem Betrieb arbeitet (§ 3 DEÜV).", "Die Meldungen übernimmt die Bundesagentur für Arbeit, die die Erlaubnis zur Arbeitnehmerüberlassung erteilt (§ 1 AÜG)."], "richtig": 0, "erklaerung": "Der Verleihbetrieb muss Sozialversicherungsmeldungen vornehmen (§ 3 DEÜV).", "schwierigkeit": "mittel"}, {"id": 1130, "gesetz": "DEÜV", "frage": "#1130 Welche Meldepflichten bestehen für Rentner, die weiterarbeiten?", "antworten": ["Ja, auch beschäftigte Rentner sind zu melden, ggf. wegen der Arbeitgeberanteile zur Renten- und Arbeitslosenversicherung (§ 3 DEÜV).", "Nur wenn sie vor Erreichen der Regelaltersgrenze arbeiten; danach entfällt die Meldepflicht vollständig (§ 3 DEÜV).", "Nein, Rentner mit Altersrente sind in jeder Beschäftigung von allen Meldungen befreit (§ 5 SGB VI)."], "richtig": 0, "erklaerung": "Ja, auch beschäftigte Rentner sind zu melden, ggf. wegen der Arbeitgeberanteile zur Renten- und Arbeitslosenversicherung (§ 3 DEÜV).", "schwierigkeit": "schwer"}, {"id": 1151, "gesetz": "BGB", "frage": "#1151 Welche gesetzlichen Grundlagen regeln das Arbeitsverhältnis von Taxi- und Mietwagenfahrern?", "antworten": ["Ausschließlich das Handelsgesetzbuch (HGB), da Fahrer als Kaufleute im Dienst des Unternehmers tätig sind (§ 59 HGB).", "Die allgemeinen arbeitsrechtlichen Vorschriften des BGB (§§ 611a ff. BGB) sowie das Arbeitszeitgesetz (ArbZG) und das Personenbeförderungsgesetz (PBefG).", "Allein das Personenbeförderungsgesetz (PBefG); das allgemeine Arbeitsrecht gilt für Fahrer nicht (§ 1 PBefG)."], "richtig": 1, "erklaerung": "Die allgemeinen arbeitsrechtlichen Vorschriften des BGB (§§ 611a ff. BGB) sowie das Arbeitszeitgesetz (ArbZG) und das Personenbeförderungsgesetz (PBefG).", "schwierigkeit": "leicht"}, {"id": 1152, "gesetz": "BGB", "frage": "#1152 Wie wird die Vergütung eines Taxifahrers geregelt, wenn keine ausdrückliche Vereinbarung getroffen wurde?", "antworten": ["Der Fahrer legt die Vergütung einseitig nach billigem Ermessen fest (§ 315 BGB).", "Falls keine feste Vergütung vereinbart wurde, gilt die übliche Vergütung (§ 612 BGB).", "Es gilt der gesetzliche Mindestlohn als Höchstgrenze; darüber hinaus besteht kein Anspruch (§ 1 MiLoG)."], "richtig": 1, "erklaerung": "Falls keine feste Vergütung vereinbart wurde, gilt die übliche Vergütung (§ 612 BGB).", "schwierigkeit": "mittel"}, {"id": 1153, "gesetz": "BGB", "frage": "#1153 Darf ein Taxiunternehmer von seinen Fahrern unbezahlte Arbeitszeiten verlangen?", "antworten": ["Ja, wenn dies im Arbeitsvertrag ausdrücklich vereinbart wurde, da Vertragsfreiheit auch den Mindestlohn abdingbar macht (§ 311 BGB).", "Nein, Arbeitszeit ist zu vergüten, mindestens mit dem Mindestlohn (§§ 611a, 612 BGB, § 1 MiLoG).", "Nur Wartezeiten ohne Fahrgast dürfen unvergütet bleiben, weil sie keine Arbeitsleistu
