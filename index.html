aerung": "Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV).", "schwierigkeit": "leicht"}, {"id": 1329, "gesetz": "UStDV", "frage": "#1329 Wie kann ein Taxiunternehmen seine Umsatzsteuererklärung berichtigen?", "antworten": ["Nur durch einen Antrag auf Erlass bei der Gemeinde; eine Berichtigung durch den Unternehmer ist nicht vorgesehen (§ 227 AO).", "Nur durch Einspruch gegen den Steuerbescheid innerhalb eines Monats; eine Berichtigung von Voranmeldungen ist ausgeschlossen (§ 355 AO).", "Durch Abgabe einer berichtigten Umsatzsteuererklärung bzw. -voranmeldung, sobald der Fehler erkannt wird (§ 153 AO, § 18 UStG)."], "richtig": 2, "erklaerung": "Durch Abgabe einer berichtigten Umsatzsteuererklärung bzw. -voranmeldung, sobald der Fehler erkannt wird (§ 153 AO, § 18 UStG).", "schwierigkeit": "mittel"}, {"id": 1330, "gesetz": "UStDV", "frage": "#1330 Welche Vorschriften gelten für steuerliche Nachweise bei innergemeinschaftlichen Lieferungen?", "antworten": ["Der Nachweis erfolgt allein durch die Zulassungsbescheinigung des Fahrzeugs bei der deutschen Zulassungsstelle (§ 17a UStDV).", "Es genügt die Rechnung mit der USt-IdNr. des Erwerbers; weitere Nachweise sind nicht erforderlich (§ 14 UStG).", "Gelangensnachweis und buchmäßiger Nachweis müssen eingehalten werden (§§ 17a–17d UStDV)."], "richtig": 2, "erklaerung": "Gelangensnachweis und buchmäßiger Nachweis müssen eingehalten werden (§§ 17a–17d UStDV).", "schwierigkeit": "schwer"}, {"id": 1351, "gesetz": "KraftStG", "frage": "#1351 Welche Steuerpflicht besteht für inländische Taxi- und Mietwagenunternehmen?", "antworten": ["Nur Fahrzeuge mit Verbrennungsmotor über 2.000 cm³ Hubraum unterliegen der Kraftfahrzeugsteuer (§ 8 KraftStG).", "Das Halten von inländischen Fahrzeugen zum Verkehr auf öffentlichen Straßen unterliegt der Kraftfahrzeugsteuer (§ 1 KraftStG).", "Nur Beförderungsleistungen gegen Entgelt; das Halten der Fahrzeuge selbst ist nicht steuerbar (§ 1 UStG)."], "richtig": 1, "erklaerung": "Das Halten von inländischen Fahrzeugen zum Verkehr auf öffentlichen Straßen unterliegt der Kraftfahrzeugsteuer (§ 1 KraftStG).", "schwierigkeit": "leicht"}, {"id": 1352, "gesetz": "KraftStG", "frage": "#1352 Welche Fahrzeuge sind von der Kraftfahrzeugsteuer befreit?", "antworten": ["Fahrzeuge bis 1.500 cm³ Hubraum sowie alle Fahrzeuge, die älter als zehn Jahre sind (§ 3 KraftStG).", "Alle Fahrzeuge mit Taxikonzession sind von der Kraftfahrzeugsteuer befreit, ebenso Mietwagen mit Genehmigung (§ 3 KraftStG).", "Fahrzeuge bestimmter Zwecke (z. B. Behörden-, Polizei-, Krankenfahrzeuge) sowie Elektrofahrzeuge bei Erstzulassung bis 31.12.2030, längstens bis 31.12.2035 (§§ 3, 3d KraftStG)."], "richtig": 2, "erklaerung": "Fahrzeuge bestimmter Zwecke (z. B. Behörden-, Polizei-, Krankenfahrzeuge) sowie Elektrofahrzeuge bei Erstzulassung bis 31.12.2030, längstens bis 31.12.2035 (§§ 3, 3d KraftStG).", "schwierigkeit": "mittel"}, {"id": 1353, "gesetz": "KraftStG", "frage": "#1353 Gibt es Steuervergünstigungen für Mietwagenunternehmen?", "antworten": ["Ja, Mietwagen sind wegen ihrer Beförderungsleistung von der Kraftfahrzeugsteuer befreit.", "Ja, Mietwagenunternehmen zahlen nur die Hälfte des Steuersatzes, wenn sie eine Genehmigung nach dem PBefG haben.", "Nein, für Mietwagenunternehmen gelten keine besonderen Steuervergünstigungen. Es gilt die allgemeine Kraftfahrzeugsteuerpflicht."], "richtig": 2, "erklaerung": "Nein, für Mietwagenunternehmen gelten keine besonderen Steuervergünstigungen. Es gilt die allgemeine Kraftfahrzeugsteuerpflicht.", "schwierigkeit": "schwer"}, {"id": 1354, "gesetz": "KraftStG", "frage": "#1354 Welche Anforderungen gelten für die Steuerermäßigung bei Schwerbehinderten?", "antworten": ["Fahrzeuge von schwerbehinderten Personen mit bestimmten Merkzeichen können eine Steuerermäßigung erhalten (§ 3a KraftStG).", "Die Ermäßigung gilt nur für Taxen, die Rollstuhlfahrer befördern, unabhängig vom Halter (§ 3 Nr. 4 KraftStG).", "Schwerbehinderte erhalten die Ermäßigung nur mit Nachweis des Pflegegrads 5 beim Finanzamt (§ 3 Nr. 5 KraftStG)."], "richtig": 0, "erklaerung": "Fahrzeuge von schwerbehinderten Personen mit bestimmten Merkzeichen können eine Steuerermäßigung erhalten (§ 3a KraftStG).", "schwierigkeit": "leicht"}, {"id": 1355, "gesetz": "KraftStG", "frage": "#1355 Wann endet die Steuerpflicht für ein Taxi oder einen Mietwagen?", "antworten": ["Mit der Abmeldung des Fahrzeugs oder der Stilllegung (§ 5 KraftStG).", "Mit der Mitteilung an das Finanzamt, dass das Fahrzeug nicht mehr im Taxigewerbe genutzt wird (§ 3 KraftStG).", "Mit Ablauf des Kalenderjahres, in dem die Genehmigung nach dem PBefG erlischt (§ 5 KraftStG)."], "richtig": 0, "erklaerung": "Mit der Abmeldung des Fahrzeugs oder der Stilllegung (§ 5 KraftStG).", "schwierigkeit": "mittel"}, {"id": 1356, "gesetz": "KraftStG", "frage": "#1356 Welche Steuerpflicht besteht für ausländische Mietwagen, die in Deutschland fahren?", "antworten": ["Ausländische Fahrzeuge sind steuerpflichtig, solange sie sich im Inland befinden; die Befreiung für vorübergehenden Aufenthalt entfällt bei entgeltlicher Personenbeförderung (§ 1 Abs. 1 Nr. 2, § 3 Nr. 13 KraftStG).", "Sie sind erst nach sechs Monaten Aufenthalt in Deutschland steuerpflichtig, auch bei entgeltlicher Beförderung (§ 3 Nr. 13 KraftStG).", "Ausländische Fahrzeuge sind in Deutschland nie steuerpflichtig, da die Steuer im Zulassungsstaat anfällt (§ 1 Abs. 1 Nr. 2 KraftStG)."], "richtig": 0, "erklaerung": "Ausländische Fahrzeuge sind steuerpflichtig, solange sie sich im Inland befinden; die Befreiung für vorübergehenden Aufenthalt entfällt bei entgeltlicher Personenbeförderung (§ 1 Abs. 1 Nr. 2, § 3 Nr. 13 KraftStG).", "schwierigkeit": "schwer"}, {"id": 1357, "gesetz": "KraftStG", "frage": "#1357 Welche Sonderregelungen gibt es für Elektro-Taxis?", "antworten": ["Elektrofahrzeuge mit Erstzulassung bis 31.12.2030 sind zehn Jahre, längstens bis 31.12.2035, steuerbefreit (§ 3d KraftStG).", "Elektro-Taxis sind dauerhaft und ohne zeitliche Begrenzung von der Kraftfahrzeugsteuer befreit (§ 3d KraftStG).", "Elektro-Taxis zahlen nur die Hälfte der Kraftfahrzeugsteuer für fünf Jahre (§ 9 KraftStG)."], "richtig": 0, "erklaerung": "Elektrofahrzeuge mit Erstzulassung bis 31.12.2030 sind zehn Jahre, längstens bis 31.12.2035, steuerbefreit (§ 3d KraftStG).", "schwierigkeit": "leicht"}, {"id": 1358, "gesetz": "KraftStG", "frage": "#1358 Welche Steuervergünstigungen gibt es für emissionsarme Dieselfahrzeuge?", "antworten": ["Emissionsarme Diesel-Pkw zahlen dauerhaft den halben Steuersatz, wenn sie die Euro-6-Norm erfüllen (§ 3b KraftStG).", "Keine mehr; die Befreiung für schadstoffreduzierte Diesel-Pkw ist 2013 ausgelaufen. Die Steuer richtet sich nach Hubraum und CO2-Ausstoß (§§ 3b, 9 KraftStG).", "Dieselfahrzeuge sind bis 2030 vollständig von der Kfz-Steuer befreit, sofern sie als Taxi zugelassen sind (§ 3 KraftStG)."], "richtig": 1, "erklaerung": "Keine mehr; die Befreiung für schadstoffreduzierte Diesel-Pkw ist 2013 ausgelaufen. Die Steuer richtet sich nach Hubraum und CO2-Ausstoß (§§ 3b, 9 KraftStG).", "schwierigkeit": "mittel"}, {"id": 1359, "gesetz": "KraftStG", "frage": "#1359 Wie wird die Steuer für ein Taxi berechnet?", "antworten": ["Die Steuer richtet sich nach Gesamtgewicht und Sitzplatzzahl; Hubraum und CO₂ spielen keine Rolle (§ 9 KraftStG).", "Die Steuer richtet sich allein nach dem Anschaffungspreis und dem Alter des Fahrzeugs (§ 8 KraftStG).", "Die Steuer richtet sich nach Hubraum, CO₂-Ausstoß und Fahrzeugtyp (§ 8 KraftStG)."], "richtig": 2, "erklaerung": "Die Steuer richtet sich nach Hubraum, CO₂-Ausstoß und Fahrzeugtyp (§ 8 KraftStG).", "schwierigkeit": "schwer"}, {"id": 1360, "gesetz": "KraftStG", "frage": "#1360 Wie wird die Kfz-Steuer für Mietwagen festgelegt?", "antworten": ["Für Mietwagen gilt der ermäßigte Steuersatz, weil sie dem öffentlichen Nahverkehr dienen (§ 3 KraftStG).", "Mietwagen zahlen einen pauschalen Gewerbetarif von 100 € je Jahr, unabhängig vom Antrieb (§ 9 KraftStG).", "Mietwagen unterliegen den regulären Steuersätzen, abhängig von Fahrzeugtyp und Emissionen (§ 9 KraftStG)."], "richtig": 2, "erklaerung": "Mietwagen unterliegen den regulären Steuersätzen, abhängig von Fahrzeugtyp und Emissionen (§ 9 KraftStG).", "schwierigkeit": "leicht"}, {"id": 1361, "gesetz": "KraftStG", "frage": "#1361 Wer ist Steuerschuldner für ein Taxi?", "antworten": ["Der Fahrzeughalter (§ 7 KraftStG).", "Die Taxizentrale, der das Unternehmen angeschlossen ist (§ 7 KraftStG).", "Der Fahrer, der das Fahrzeug überwiegend führt (§ 7 KraftStG)."], "richtig": 0, "erklaerung": "Der Fahrzeughalter (§ 7 KraftStG).", "schwierigkeit": "mittel"}, {"id": 1362, "gesetz": "KraftStG", "frage": "#1362 Welche Bedeutung hat der Begriff „Bemessungsgrundlage“ in der Kfz-Steuer?", "antworten": ["Die jährliche Fahrleistung, die der Halter beim Hauptzollamt angeben muss (§ 11 KraftStG).", "Die Höhe der Steuer wird anhand von Hubraum, Emissionen und Fahrzeugart bestimmt (§ 8 KraftStG).", "Der Wert des Fahrzeugs bei Erstzulassung, aus dem ein fester Prozentsatz als Steuer berechnet wird (§ 8 KraftStG)."], "richtig": 1, "erklaerung": "Die Höhe der Steuer wird anhand von Hubraum, Emissionen und Fahrzeugart bestimmt (§ 8 KraftStG).", "schwierigkeit": "schwer"}, {"id": 1363, "gesetz": "KraftStG", "frage": "#1363 Gibt es Steuerermäßigungen für Hybridfahrzeuge im Taxi-Gewerbe?", "antworten": ["Ja, Hybridfahrzeuge können eine geringere Kfz-Steuer haben, da sie auf Basis ihrer CO₂-Emissionen und des Hubraums besteuert werden (§ 9 KraftStG).", "Nein, Hybridfahrzeuge werden ausnahmslos wie reine Verbrenner besteuert (§ 9 KraftStG).", "Ja, Hybridfahrzeuge sind für die gesamte Lebensdauer des Fahrzeugs steuerfrei (§ 3d KraftStG)."], "richtig": 0, "erklaerung": "Ja, Hybridfahrzeuge können eine geringere Kfz-Steuer haben, da sie auf Basis ihrer CO₂-Emissionen und des Hubraums besteuert werden (§ 9 KraftStG).", "schwierigkeit": "leicht"}, {"id": 1364, "gesetz": "KraftStG", "frage": "#1364 Wie lange ist ein Fahrzeug nach der Stilllegung noch steuerpflichtig?", "antworten": ["Die Steuerpflicht besteht bis zum Ende des Kalenderjahres der Stilllegung fort (§ 5 Abs. 4 KraftStG).", "Die Steuerpflicht endet mit der Außerbetriebsetzung bei der Zulassungsstelle; maßgebend ist der spätere Tag von Eintragung und Entstempelung (§ 5 Abs. 4 KraftStG).", "Sie endet bereits mit dem Antrag des Halters beim Finanzamt, unabhängig von der Zulassungsstelle (§ 5 Abs. 1 KraftStG)."], "richtig": 1, "erklaerung": "Die Steuerpflicht endet mit der Außerbetriebsetzung bei der Zulassungsstelle; maßgebend ist der spätere Tag von Eintragung und Entstempelung (§ 5 Abs. 4 KraftStG).", "schwierigkeit": "mittel"}, {"id": 1365, "gesetz": "KraftStG", "frage": "#1365 Welche Konsequenzen drohen bei nicht gezahlter Kfz-Steuer?", "antworten": ["Die Steuerschuld verjährt nach zwei Monaten, wenn keine Mahnung erfolgt (§ 169 AO).", "Das Hauptzollamt entzieht dem Unternehmer die Taxikonzession dauerhaft (§ 25 PBefG).", "Das Fahrzeug kann zwangsstillgelegt werden, bis die Steuer entrichtet wurde (§ 14 KraftStG)."], "richtig": 2, "erklaerung": "Das Fahrzeug kann zwangsstillgelegt werden, bis die Steuer entrichtet wurde (§ 14 KraftStG).", "schwierigkeit": "schwer"}, {"id": 1366, "gesetz": "KraftStG", "frage": "#1366 Darf ein Taxi während eines Steuerverfahrens weiter betrieben werden?", "antworten": ["Nein, ab Einleitung des Verfahrens ruht die Betriebserlaubnis automatisch.", "Nein, bei jedem Steuerverfahren muss das Fahrzeug sofort abgemeldet werden.", "Ja, solange es zugelassen ist und die Steuer nicht rückständig ist."], "richtig": 2, "erklaerung": "Ja, solange es zugelassen ist und die Steuer nicht rückständig ist.", "schwierigkeit": "leicht"}, {"id": 1367, "gesetz": "KraftStG", "frage": "#1367 Welche Rolle spielt das Finanzamt bei der Kfz-Steuer für Taxiunternehmen?", "antworten": ["Die Zulassungsstelle zieht die Kfz-Steuer ein und leitet sie an das Finanzamt weiter, das den Bescheid erlässt.", "Das Finanzamt setzt die Kfz-Steuer fest und erhebt sie zusammen mit der Einkommensteuer.", "Keine; die Kfz-Steuer wird von der Zollverwaltung (Hauptzollämter) festgesetzt und erhoben, nicht vom Finanzamt."], "richtig": 2, "erklaerung": "Keine; die Kfz-Steuer wird von der Zollverwaltung (Hauptzollämter) festgesetzt und erhoben, nicht vom Finanzamt.", "schwierigkeit": "mittel"}, {"id": 1368, "gesetz": "KraftStG", "frage": "#1368 Wie wird die Steuer für Oldtimer-Taxis berechnet?", "antworten": ["Oldtimer mit H-Kennzeichen sind von der Kfz-Steuer befreit, solange sie gewerblich genutzt werden (§ 3 KraftStG).", "Oldtimer mit H-Kennzeichen haben eine pauschale Steuerregelung (§ 9 KraftStG).", "Oldtimer werden nach Hubraum und Schadstoffklasse wie alle anderen Fahrzeuge besteuert (§ 8 KraftStG)."], "richtig": 1, "erklaerung": "Oldtimer mit H-Kennzeichen haben eine pauschale Steuerregelung (§ 9 KraftStG).", "schwierigkeit": "schwer"}, {"id": 1369, "gesetz": "KraftStG", "frage": "#1369 Wie wird die Kfz-Steuer bei Fahrzeugen mit Saisonkennzeichen berechnet?", "antworten": ["Die Steuer wird nur für den Betriebszeitraum des Saisonkennzeichens tageweise erhoben (§ 5 Abs. 1 Nr. 5, § 11 Abs. 4 Nr. 3 KraftStG).", "Die Steuer wird monatlich vom Finanzamt nach den tatsächlichen Fahrtagen berechnet (§ 12 KraftStG).", "Die Steuer wird für das ganze Jahr erhoben, aber um die Hälfte ermäßigt (§ 9 KraftStG)."], "richtig": 0, "erklaerung": "Die Steuer wird nur für den Betriebszeitraum des Saisonkennzeichens tageweise erhoben (§ 5 Abs. 1 Nr. 5, § 11 Abs. 4 Nr. 3 KraftStG).", "schwierigkeit": "leicht"}, {"id": 1370, "gesetz": "KraftStG", "frage": "#1370 Welche Fristen gelten für die Steuerzahlung?", "antworten": ["Jährlich nachträglich zum 31. Dezember; Ratenzahlung ist ausgeschlossen (§ 12 KraftStG).", "Jährlich im Voraus; bei mehr als 500 € halbjährlich, bei mehr als 1.000 € vierteljährlich, jeweils mit Aufgeld (§ 11 KraftStG).", "Monatlich im Voraus jeweils zum Ersten des Monats per Lastschrift (§ 11 KraftStG)."], "richtig": 1, "erklaerung": "Jährlich im Voraus; bei mehr als 500 € halbjährlich, bei mehr als 1.000 € vierteljährlich, jeweils mit Aufgeld (§ 11 KraftStG).", "schwierigkeit": "mittel"}, {"id": 1371, "gesetz": "KraftStG", "frage": "#1371 Kann ein Taxiunternehmen eine Steuerbefreiung beantragen?", "antworten": ["Ja, Taxiunternehmen mit Konzession nach dem PBefG sind auf Antrag befreit.", "Ja, aber nur bei einem Fuhrpark von mehr als zehn Fahrzeugen.", "Nein, es gibt keine generelle Steuerbefreiung für Taxiunternehmen."], "richtig": 2, "erklaerung": "Nein, es gibt keine generelle Steuerbefreiung für Taxiunternehmen.", "schwierigkeit": "schwer"}, {"id": 1372, "gesetz": "KraftStG", "frage": "#1372 Wie wirkt sich eine Umrüstung eines Taxis auf die Steuer aus?", "antworten": ["Ändern sich Emissionen oder Antrieb, wird die Steuer ab der Änderung neu festgesetzt (§ 5 Abs. 3, §§ 8, 9 KraftStG).", "Nach der Umrüstung bleibt die Steuer unverändert, da sie sich nach der Erstzulassung richtet (§ 5 KraftStG).", "Die Umrüstung ist erst relevant, wenn sie dem Finanzamt bis Jahresende gemeldet wird; die Änderung wirkt dann rückwirkend zum 1. Januar (§ 12 KraftStG)."], "richtig": 0, "erklaerung": "Ändern sich Emissionen oder Antrieb, wird die Steuer ab der Änderung neu festgesetzt (§ 5 Abs. 3, §§ 8, 9 KraftStG).", "schwierigkeit": "leicht"}, {"id": 1373, "gesetz": "KraftStG", "frage": "#1373 Welche Auswirkungen hat ein Fahrzeugwechsel auf die Steuer?", "antworten": ["Für das alte Fahrzeug endet die Steuerpflicht mit der Abmeldung, für das neue beginnt sie mit der Zulassung (§ 5 Abs. 1 Nr. 1 KraftStG).", "Beim Wechsel wird die bereits gezahlte Steuer vollständig auf das neue Fahrzeug angerechnet (§ 12 KraftStG).", "Die Steuerpflicht des alten Fahrzeugs besteht bis zum Jahresende fort; das neue Fahrzeug ist im ersten Jahr steuerfrei (§ 5 KraftStG)."], "richtig": 0, "erklaerung": "Für das alte Fahrzeug endet die Steuerpflicht mit der Abmeldung, für das neue beginnt sie mit der Zulassung (§ 5 Abs. 1 Nr. 1 KraftStG).", "schwierigkeit": "mittel"}, {"id": 1374, "gesetz": "KraftStG", "frage": "#1374 Darf ein Mietwagen steuerfrei fahren?", "antworten": ["Ja, in den ersten zwölf Monaten nach der Erstzulassung gilt eine Steuerbefreiung für gewerbliche Fahrzeuge.", "Ja, wenn das Unternehmen seinen Sitz im Ausland hat und nur vorübergehend in Deutschland fährt.", "Nein, Mietwagen sind steuerpflichtig und unterliegen den normalen Steuersätzen."], "richtig": 2, "erklaerung": "Nein, Mietwagen sind steuerpflichtig und unterliegen den normalen Steuersätzen.", "schwierigkeit": "schwer"}, {"id": 1375, "gesetz": "KraftStG", "frage": "#1375 Kann eine Kfz-Steuer zu hoch angesetzt sein?", "antworten": ["Ja, dann kann binnen sechs Monaten Klage beim Verwaltungsgericht erhoben werden (§ 74 VwGO).", "Ja, bei fehlerhafter Berechnung kann binnen eines Monats Einspruch beim zuständigen Hauptzollamt eingelegt werden (§§ 347, 355 AO).", "Nein, die Steuer ist gesetzlich festgelegt; ein Rechtsbehelf ist nicht vorgesehen (§ 347 AO)."], "richtig": 1, "erklaerung": "Ja, bei fehlerhafter Berechnung kann binnen eines Monats Einspruch beim zuständigen Hauptzollamt eingelegt werden (§§ 347, 355 AO).", "schwierigkeit": "leicht"}, {"id": 1376, "gesetz": "KraftStG", "frage": "#1376 Welche Regelungen gelten für die Versteuerung von Dienstwagen?", "antworten": ["Die Steuer wird unabhängig von der gewerblichen oder privaten Nutzung erhoben.", "Bei privater Nutzung wird die Kfz-Steuer zusätzlich als geldwerter Vorteil beim Fahrer versteuert.", "Dienstwagen sind im Taxigewerbe steuerfrei, wenn sie überwiegend betrieblich genutzt werden."], "richtig": 0, "erklaerung": "Die Steuer wird unabhängig von der gewerblichen oder privaten Nutzung erhoben.", "schwierigkeit": "mittel"}, {"id": 1377, "gesetz": "KraftStG", "frage": "#1377 Wie wird die Steuer bei Leasingfahrzeugen geregelt?", "antworten": ["Für Leasingfahrzeuge entfällt die Kfz-Steuer, da der Leasinggeber sie bereits in der Leasingrate abführt (§ 3 KraftStG).", "Steuerschuldner ist, auf wen das Fahrzeug zugelassen ist, also je nach Vertrag der Leasinggeber oder der Leasingnehmer (§ 7 Nr. 1 KraftStG).", "Steuerschuldner ist immer der Leasingnehmer, da er das Fahrzeug nutzt, auch wenn es auf den Leasinggeber zugelassen ist (§ 7 KraftStG)."], "richtig": 1, "erklaerung": "Steuerschuldner ist, auf wen das Fahrzeug zugelassen ist, also je nach Vertrag der Leasinggeber oder der Leasingnehmer (§ 7 Nr. 1 KraftStG).", "schwierigkeit": "schwer"}, {"id": 1378, "gesetz": "KraftStG", "frage": "#1378 Was passiert mit der Kfz-Steuer bei Insolvenz eines Taxiunternehmens?", "antworten": ["Die Steuer wird vom Insolvenzgericht erlassen, wenn das Unternehmen zahlungsunfähig ist.", "Die Steuerpflicht bleibt bestehen, bis die Fahrzeuge offiziell abgemeldet sind.", "Die Steuerpflicht endet mit Eröffnung des Insolvenzverfahrens automatisch."], "richtig": 1, "erklaerung": "Die Steuerpflicht bleibt bestehen, bis die Fahrzeuge offiziell abgemeldet sind.", "schwierigkeit": "leicht"}, {"id": 1379, "gesetz": "KraftStG", "frage": "#1379 Kann ein Taxiunternehmen steuerliche Vorteile bei der Umrüstung auf alternative Antriebe nutzen?", "antworten": ["Ja, Gas-Taxis sind dauerhaft von der Kfz-Steuer befreit (§ 3b KraftStG).", "Ja, Elektro-Taxis sind temporär steuerbefreit (§ 3d KraftStG).", "Ja, umgerüstete Fahrzeuge zahlen dauerhaft nur die Hälfte der Kfz-Steuer (§ 9 KraftStG)."], "richtig": 1, "erklaerung": "Ja, Elektro-Taxis sind temporär steuerbefreit (§ 3d KraftStG).", "schwierigkeit": "mittel"}, {"id": 1380, "gesetz": "KraftStG", "frage": "#1380 Welche steuerlichen Pflichten bestehen für Taxiunternehmen mit mehreren Standorten?", "antworten": ["Jeder Standort muss die Kfz-Steuer beim örtlichen Finanzamt gesondert anmelden (§ 12 KraftStG).", "Die Steuer richtet sich nach dem Hebesatz der Gemeinde, in der das Fahrzeug überwiegend stationiert ist (§ 16 GewStG).", "Keine besonderen; die Kfz-Steuer ist bundeseinheitlich und fällt je zugelassenem Fahrzeug beim Halter an (§§ 1, 7 KraftStG)."], "richtig": 2, "erklaerung": "Keine besonderen; die Kfz-Steuer ist bundeseinheitlich und fällt je zugelassenem Fahrzeug beim Halter an (§§ 1, 7 KraftStG).", "schwierigkeit": "schwer"}, {"id": 1401, "gesetz": "EStG", "frage": "#1401 Welche steuerlichen Pflichten haben Taxi- und Mietwagenunternehmer?", "antworten": ["Sie müssen Einkünfte aus dem Gewerbebetrieb versteuern (§ 15 EStG).", "Sie müssen ihre Einkünfte als Einkünfte aus selbstständiger Arbeit versteuern (§ 18 EStG).", "Sie müssen nur Umsatzsteuer abführen; Einkommensteuer fällt für Taxiunternehmer nicht an (§ 12 UStG)."], "richtig": 0, "erklaerung": "Sie müssen Einkünfte aus dem Gewerbebetrieb versteuern (§ 15 EStG).", "schwierigkeit": "leicht"}, {"id": 1402, "gesetz": "EStG", "frage": "#1402 Wie wird der Gewinn für Taxiunternehmen ermittelt?", "antworten": ["Entweder durch Bilanzierung (§ 4 Abs. 1 EStG) oder durch Einnahmen-Überschuss-Rechnung (§ 4 Abs. 3 EStG).", "Durch einen pauschalen Ansatz von 30 % der Umsätze, den das Finanzamt festsetzt (§ 162 AO).", "Ausschließlich durch Bilanzierung; die Einnahmen-Überschuss-Rechnung ist Taxiunternehmern nicht erlaubt (§ 5 EStG)."], "richtig": 0, "erklaerung": "Entweder durch Bilanzierung (§ 4 Abs. 1 EStG) oder durch Einnahmen-Überschuss-Rechnung (§ 4 Abs. 3 EStG).", "schwierigkeit": "mittel"}, {"id": 1403, "gesetz": "EStG", "frage": "#1403 Welche Betriebsausgaben sind für Taxi- und Mietwagenunternehmen abzugsfähig?", "antworten": ["Auch private Lebenshaltungskosten, soweit sie der Aufrechterhaltung der Arbeitskraft des Unternehmers dienen (§ 12 EStG).", "Alle Aufwendungen, die betrieblich veranlasst sind, z. B. Fahrzeugkosten, Treibstoff, Reparaturen, Versicherungen (§ 4 Abs. 4 EStG).", "Nur Kosten, die unmittelbar mit Fahrten mit Fahrgästen zusammenhängen; Verwaltungs- und Versicherungskosten sind nicht abzugsfähig (§ 4 Abs. 4 EStG)."], "richtig": 1, "erklaerung": "Alle Aufwendungen, die betrieblich veranlasst sind, z. B. Fahrzeugkosten, Treibstoff, Reparaturen, Versicherungen (§ 4 Abs. 4 EStG).", "schwierigkeit": "schwer"}, {"id": 1404, "gesetz": "EStG", "frage": "#1404 Welche steuerlichen Vorteile bietet die Nutzung eines Elektro-Taxis?", "antworten": ["Sonderabschreibung von 75 % im Anschaffungsjahr für Elektrofahrzeuge, die vom 01.07.2025 bis 31.12.2027 angeschafft werden (§ 7 Abs. 2a EStG), sowie Befreiung von der Kfz-Steuer (§ 3d KraftStG).", "Eine Prämie von 6.000 € als Steuerermäßigung auf die Einkommensteuer für jedes Elektro-Taxi (§ 35 EStG).", "Vollständige Absetzung der Anschaffungskosten im Jahr der Anschaffung als Sofortabschreibung für alle Fahrzeuge (§ 6 Abs. 2 EStG)."], "richtig": 0, "erklaerung": "Sonderabschreibung von 75 % im Anschaffungsjahr für Elektrofahrzeuge, die vom 01.07.2025 bis 31.12.2027 angeschafft werden (§ 7 Abs. 2a EStG), sowie Befreiung von der Kfz-Steuer (§ 3d KraftStG).", "schwierigkeit": "leicht"}, {"id": 1405, "gesetz": "EStG", "frage": "#1405 Wie wird die private Nutzung eines Taxi-Fahrzeugs steuerlich behandelt?", "antworten": ["Die Privatnutzung ist steuerfrei, sofern das Fahrzeug überwiegend als Taxi genutzt wird (§ 3 EStG).", "Sie ist mit 5 % des Anschaffungspreises jährlich als Betriebseinnahme zu erfassen; ein Fahrtenbuch ist ausgeschlossen (§ 6 EStG).", "Die Privatnutzung ist als Entnahme zu versteuern, pauschal mit 1 % des Listenpreises monatlich oder nach Fahrtenbuch (§ 6 Abs. 1 Nr. 4 EStG)."], "richtig": 2, "erklaerung": "Die Privatnutzung ist als Entnahme zu versteuern, pauschal mit 1 % des Listenpreises monatlich oder nach Fahrtenbuch (§ 6 Abs. 1 Nr. 4 EStG).", "schwierigkeit": "mittel"}, {"id": 1406, "gesetz": "EStG", "frage": "#1406 Welche Regelungen gelten für den Abzug von Schuldzinsen im Taxigewerbe?", "antworten": ["Schuldzinsen sind nur abziehbar, wenn sie auf Darlehen für Fahrzeugkäufe entfallen; Kontokorrentzinsen sind nie abziehbar (§ 4 Abs. 4 EStG).", "Schuldzinsen sind im Taxigewerbe nicht abziehbar, sondern nur als Sonderausgaben in der Einkommensteuererklärung (§ 10 EStG).", "Betriebliche Schuldzinsen sind grundsätzlich voll abziehbar; nur bei Überentnahmen ist der Abzug eingeschränkt (§ 4 Abs. 4a EStG)."], "richtig": 2, "erklaerung": "Betriebliche Schuldzinsen sind grundsätzlich voll abziehbar; nur bei Überentnahmen ist der Abzug eingeschränkt (§ 4 Abs. 4a EStG).", "schwierigkeit": "schwer"}, {"id": 1407, "gesetz": "EStG", "frage": "#1407 Sind Trinkgelder für Taxifahrer steuerpflichtig?", "antworten": ["Nein, aber nur bis 100 € pro Monat; darüber hinaus sind sie lohnsteuerpflichtig, auch wenn sie freiwillig gezahlt werden (§ 3b EStG).", "Ja, Trinkgelder sind bei allen Fahrern voll lohnsteuerpflichtig und vom Arbeitgeber zu melden (§ 19 EStG).", "Nein, freiwillige Trinkgelder an angestellte Fahrer von Fahrgästen sind steuerfrei (§ 3 Nr. 51 EStG)."], "richtig": 2, "erklaerung": "Nein, freiwillige Trinkgelder an angestellte Fahrer von Fahrgästen sind steuerfrei (§ 3 Nr. 51 EStG).", "schwierigkeit": "leicht"}, {"id": 1408, "gesetz": "EStG", "frage": "#1408 Welche Abschreibungsregeln gelten für Taxifahrzeuge?", "antworten": ["Sofortabschreibung im Jahr der Anschaffung für alle Fahrzeuge, wenn sie als Taxi zugelassen sind (§ 6 Abs. 2 EStG).", "Linear über die Nutzungsdauer laut AfA-Tabelle (für Taxis 5 Jahre); für Anschaffungen vom 1.7.2025 bis 31.12.2027 ist auch degressive AfA möglich (§ 7 Abs. 1, 2 EStG).", "Linear über die Nutzungsdauer laut AfA-Tabelle (für Taxis 10 Jahre); eine degressive AfA ist nie möglich (§ 7 EStG)."], "richtig": 1, "erklaerung": "Linear über die Nutzungsdauer laut AfA-Tabelle (für Taxis 5 Jahre); für Anschaffungen vom 1.7.2025 bis 31.12.2027 ist auch degressive AfA möglich (§ 7 Abs. 1, 2 EStG).", "schwierigkeit": "mittel"}, {"id": 1409, "gesetz": "EStG", "frage": "#1409 Wie werden Leasingfahrzeuge im Taxiunternehmen steuerlich behandelt?", "antworten": ["Die Leasingraten sind Betriebsausgaben und voll abzugsfähig (§ 4 Abs. 4 EStG).", "Leasingraten sind nur zur Hälfte abzugsfähig; die andere Hälfte gilt als Privatentnahme (§ 4 Abs. 5 EStG).", "Leasingraten sind stets nicht abziehbar; das Fahrzeug wird beim Leasingnehmer aktiviert und abgeschrieben (§ 7 EStG)."], "richtig": 0, "erklaerung": "Die Leasingraten sind Betriebsausgaben und voll abzugsfähig (§ 4 Abs. 4 EStG).", "schwierigkeit": "schwer"}, {"id": 1410, "gesetz": "EStG", "frage": "#1410 Welche steuerlichen Erleichterungen gibt es für Investitionen in neue Fahrzeuge?", "antworten": ["Eine Investitionszulage von 10 % der Anschaffungskosten, die das Finanzamt als Zuschuss auszahlt (§ 7g EStG).", "Investitionsabzugsbetrag von bis zu 50 % der Anschaffungskosten (§ 7g EStG).", "Ein sofort absetzbarer Freibetrag von 1.000 € für jedes neue Fahrzeug (§ 6 Abs. 2 EStG)."], "richtig": 1, "erklaerung": "Investitionsabzugsbetrag von bis zu 50 % der Anschaffungskosten (§ 7g EStG).", "schwierigkeit": "leicht"}, {"id": 1411, "gesetz": "EStG", "frage": "#1411 Sind selbstständige Taxifahrer einkommensteuerpflichtig?", "antworten": ["Nein, selbstständige Taxifahrer zahlen nur Gewerbesteuer; die Einkommensteuer ist darin enthalten (§ 2 GewStG).", "Ja, sie müssen ihre Einkünfte als Gewerbebetrieb versteuern (§ 15 EStG).", "Ja, aber als Einkünfte aus selbstständiger Arbeit, die von der Gewerbesteuer befreit sind (§ 18 EStG)."], "richtig": 1, "erklaerung": "Ja, sie müssen ihre Einkünfte als Gewerbebetrieb versteuern (§ 15 EStG).", "schwierigkeit": "mittel"}, {"id": 1412, "gesetz": "EStG", "frage": "#1412 Wie werden Lohnzahlungen an angestellte Taxifahrer steuerlich behandelt?", "antworten": ["Als Betriebsausgaben (§ 4 Abs. 4 EStG), Lohnsteuer muss abgeführt werden (§ 38 EStG).", "Als Sonderausgaben des Unternehmers; Lohnsteuer wird erst beim Jahresabschluss einbehalten (§ 10 EStG).", "Als Entnahmen aus dem Betrieb; Lohnsteuer fällt nur für Fahrer mit Steuerklasse VI an (§ 6 EStG)."], "richtig": 0, "erklaerung": "Als Betriebsausgaben (§ 4 Abs. 4 EStG), Lohnsteuer muss abgeführt werden (§ 38 EStG).", "schwierigkeit": "schwer"}, {"id": 1413, "gesetz": "EStG", "frage": "#1413 Welche Steuerermäßigung gibt es für Nacht-, Sonn- und Feiertagszuschläge?", "antworten": ["Sie sind nur steuerfrei, wenn sie vom Betriebsrat genehmigt wurden (§ 87 BetrVG).", "Sie sind stets voll steuerpflichtig, da sie Teil des laufenden Arbeitslohns sind (§ 19 EStG).", "Diese sind bis zu bestimmten Grenzen steuerfrei (§ 3b EStG)."], "richtig": 2, "erklaerung": "Diese sind bis zu bestimmten Grenzen steuerfrei (§ 3b EStG).", "schwierigkeit": "leicht"}, {"id": 1414, "gesetz": "EStG", "frage": "#1414 Wie wird die Umsatzsteuer für Taxiunternehmen berechnet?", "antworten": ["Taxifahrten sind steuerfrei, Mietwagenfahrten unterliegen unabhängig von der Strecke dem ermäßigten Satz von 7 % (§ 4 UStG).", "Alle Taxifahrten unterliegen einheitlich dem ermäßigten Satz von 7 %, Mietwagenfahrten dem Regelsatz von 19 % (§ 12 UStG).", "Taxifahrten innerhalb der Gemeinde oder bis 50 km unterliegen dem ermäßigten Satz von 7 %, längere Taxifahrten und Mietwagenfahrten 19 % (§ 12 UStG)."], "richtig": 2, "erklaerung": "Taxifahrten innerhalb der Gemeinde oder bis 50 km unterliegen dem ermäßigten Satz von 7 %, längere Taxifahrten und Mietwagenfahrten 19 % (§ 12 UStG).", "schwierigkeit": "mittel"}, {"id": 1415, "gesetz": "EStG", "frage": "#1415 Welche Steuervergünstigungen gibt es für Kleinunternehmer im Taxi-Gewerbe?", "antworten": ["Es gilt die Kleinunternehmerregelung bei Vorjahresumsatz bis 25.000 € und Jahresumsatz bis 100.000 € (netto) mit Umsatzsteuerbefreiung (§ 19 UStG).", "Die Kleinunternehmerregelung gilt nur für Mietwagenunternehmer; Taxiunternehmer sind davon ausgeschlossen (§ 19 UStG).", "Kleinunternehmer zahlen eine pauschale Umsatzsteuer von 3 % auf ihre Umsätze und können die Vorsteuer weiter abziehen (§ 24 UStG)."], "richtig": 0, "erklaerung": "Es gilt die Kleinunternehmerregelung bei Vorjahresumsatz bis 25.000 € und Jahresumsatz bis 100.000 € (netto) mit Umsatzsteuerbefreiung (§ 19 UStG).", "schwierigkeit": "schwer"}, {"id": 1416, "gesetz": "EStG", "frage": "#1416 Wie wirkt sich ein Steuerklassenwechsel auf die Lohnsteuer eines Taxifahrers aus?", "antworten": ["Ein Wechsel der Steuerklasse kann die monatliche Lohnsteuerbelastung senken oder erhöhen (§ 38b EStG).", "Ein Wechsel der Steuerklasse verändert nur die Jahressteuerschuld, nicht die monatliche Lohnsteuer (§ 38b EStG).", "Ein Wechsel bewirkt, dass die Lohnsteuer vollständig entfällt, wenn der Ehepartner Alleinverdiener ist (§ 32a EStG)."], "richtig": 0, "erklaerung": "Ein Wechsel der Steuerklasse kann die monatliche Lohnsteuerbelastung senken oder erhöhen (§ 38b EStG).", "schwierigkeit": "leicht"}, {"id": 1417, "gesetz": "EStG", "frage": "#1417 Welche Regelungen gelten für Betriebsausgabenpauschalen im Taxigewerbe?", "antworten": ["Für gewerbliche Taxiunternehmer gibt es keine allgemeine Betriebsausgabenpauschale; abziehbar sind die tatsächlich nachgewiesenen Betriebsausgaben (§ 4 Abs. 4 EStG).", "Es besteht eine Pauschale von 0,30 € je gefahrenem Kilometer für Fahrzeugkosten; Einzelnachweise sind ausgeschlossen (§ 9 EStG).", "Es gibt eine Betriebsausgabenpauschale von 25 % der Einnahmen, die ohne Nachweis abgezogen werden darf (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Für gewerbliche Taxiunternehmer gibt es keine allgemeine Betriebsausgabenpauschale; abziehbar sind die tatsächlich nachgewiesenen Betriebsausgaben (§ 4 Abs. 4 EStG).", "schwierigkeit": "mittel"}, {"id": 1418, "gesetz": "EStG", "frage": "#1418 Wie werden Fahrtkosten eines selbstständigen Taxifahrers steuerlich behandelt?", "antworten": ["Fahrtkosten sind nur über die Entfernungspauschale abziehbar, auch für Fahrten zu Fahrgästen (§ 9 EStG).", "Fahrtkosten sind Sonderausgaben und mindern nur den Gesamtbetrag der Einkünfte (§ 10 EStG).", "Fahrtkosten für betriebliche Fahrten sind Betriebsausgaben (§ 4 Abs. 4 EStG)."], "richtig": 2, "erklaerung": "Fahrtkosten für betriebliche Fahrten sind Betriebsausgaben (§ 4 Abs. 4 EStG).", "schwierigkeit": "schwer"}, {"id": 1419, "gesetz": "EStG", "frage": "#1419 Gibt es steuerliche Vergünstigungen für Familienangehörige, die im Taxiunternehmen mitarbeiten?", "antworten": ["Ja, Löhne an mitarbeitende Angehörige sind steuerlich absetzbar, wenn sie fremdüblich sind (§ 4 Abs. 4 EStG).", "Nein, Löhne an Angehörige sind nie absetzbar, da sie Privatentnahmen darstellen (§ 12 EStG).", "Ja, aber nur bis zu einem Höchstbetrag von 450 € monatlich, unabhängig von der Fremdüblichkeit (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Ja, Löhne an mitarbeitende Angehörige sind steuerlich absetzbar, wenn sie fremdüblich sind (§ 4 Abs. 4 EStG).", "schwierigkeit": "leicht"}, {"id": 1420, "gesetz": "EStG", "frage": "#1420 Welche Steuervergünstigungen gibt es für Fahrten zwischen Wohnung und Betriebssitz?", "antworten": ["Die Kosten sind nur in Höhe der Entfernungspauschale von 0,38 € je Entfernungskilometer abziehbar (§ 4 Abs. 5 Satz 1 Nr. 6 i. V. m. § 9 Abs. 1 Satz 3 Nr. 4 EStG).", "Sie sind nicht abziehbar, da Wohnung und Betriebssitz im Privatbereich liegen (§ 12 EStG).", "Die Kosten sind in voller Höhe der tatsächlichen Fahrtkosten abziehbar, wenn das betriebliche Fahrzeug genutzt wird (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Die Kosten sind nur in Höhe der Entfernungspauschale von 0,38 € je Entfernungskilometer abziehbar (§ 4 Abs. 5 Satz 1 Nr. 6 i. V. m. § 9 Abs. 1 Satz 3 Nr. 4 EStG).", "schwierigkeit": "mittel"}, {"id": 1421, "gesetz": "EStG", "frage": "#1421 Müssen Taxifahrer für ihre Arbeitskleidung Steuern zahlen?", "antworten": ["Ja, aber nur, wenn der Arbeitgeber die Kleidung stellt; selbst gekaufte ist nie absetzbar (§ 9 EStG).", "Ja, Berufskleidung ist als geldwerter Vorteil immer lohnsteuerpflichtig (§ 19 EStG).", "Nein, typische Berufskleidung ist steuerfrei (§ 3 Nr. 31 EStG)."], "richtig": 2, "erklaerung": "Nein, typische Berufskleidung ist steuerfrei (§ 3 Nr. 31 EStG).", "schwierigkeit": "schwer"}, {"id": 1422, "gesetz": "EStG", "frage": "#1422 Wie werden Subventionen für umweltfreundliche Taxis steuerlich behandelt?", "antworten": ["Subventionen sind nur bei der Gewerbesteuer relevant; bei der Einkommensteuer bleiben sie unberücksichtigt (§ 7 GewStG).", "Subventionen sind stets steuerfrei und mindern nicht die Anschaffungskosten (§ 3 EStG).", "Subventionen können steuerfrei sein oder als Betriebseinnahme gelten (§ 3 EStG)."], "richtig": 2, "erklaerung": "Subventionen können steuerfrei sein oder als Betriebseinnahme gelten (§ 3 EStG).", "schwierigkeit": "leicht"}, {"id": 1423, "gesetz": "EStG", "frage": "#1423 Kann ein Taxiunternehmer seine Tankkosten steuerlich absetzen?", "antworten": ["Ja, wenn das Fahrzeug zum Betriebsvermögen gehört (§ 4 Abs. 4 EStG).", "Ja, aber nur zu 50 %, da das Fahrzeug auch privat nutzbar ist (§ 4 Abs. 5 EStG).", "Nein, Tankkosten sind Kosten der privaten Lebensführung (§ 12 EStG)."], "richtig": 0, "erklaerung": "Ja, wenn das Fahrzeug zum Betriebsvermögen gehört (§ 4 Abs. 4 EStG).", "schwierigkeit": "mittel"}, {"id": 1424, "gesetz": "EStG", "frage": "#1424 Sind Strafzettel von der Steuer absetzbar?", "antworten": ["Nein, Bußgelder und Strafzahlungen sind keine Betriebsausgaben (§ 4 Abs. 5 EStG).", "Ja, aber nur bis 500 € pro Jahr (§ 4 Abs. 5 Nr. 1 EStG).", "Ja, Bußgelder sind abziehbar, wenn sie während einer betrieblichen Fahrt entstehen (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Nein, Bußgelder und Strafzahlungen sind keine Betriebsausgaben (§ 4 Abs. 5 EStG).", "schwierigkeit": "schwer"}, {"id": 1425, "gesetz": "EStG", "frage": "#1425 Welche Steuerpflicht besteht bei der Abgabe eines Taxiunternehmens?", "antworten": ["Nur die Umsatzsteuer auf den Kaufpreis ist zu zahlen; Einkommensteuer fällt nicht an (§ 1 UStG).", "Der Gewinn aus dem Verkauf ist steuerpflichtig (§ 16 EStG).", "Der Gewinn aus dem Verkauf ist steuerfrei, wenn der Unternehmer das Taxi mindestens zehn Jahre betrieben hat (§ 23 EStG)."], "richtig": 1, "erklaerung": "Der Gewinn aus dem Verkauf ist steuerpflichtig (§ 16 EStG).", "schwierigkeit": "leicht"}, {"id": 1426, "gesetz": "EStG", "frage": "#1426 Wie werden Trinkgelder bei selbstständigen Taxifahrern behandelt?", "antworten": ["Trinkgelder sind Betriebseinnahmen, aber nur zu 50 % steuerpflichtig, weil sie freiwillig gezahlt werden (§ 15 EStG).", "Trinkgelder gehören zum Privatvermögen des Fahrers und sind nicht zu versteuern (§ 12 EStG).", "Trinkgelder sind bei selbstständigen Taxifahrern Betriebseinnahmen und voll steuerpflichtig; § 3 Nr. 51 EStG gilt nur für Arbeitnehmer (§ 15 EStG)."], "richtig": 2, "erklaerung": "Trinkgelder sind bei selbstständigen Taxifahrern Betriebseinnahmen und voll steuerpflichtig; § 3 Nr. 51 EStG gilt nur für Arbeitnehmer (§ 15 EStG).", "schwierigkeit": "mittel"}, {"id": 1427, "gesetz": "EStG", "frage": "#1427 Kann ein Taxiunternehmen Verluste steuerlich geltend machen?", "antworten": ["Ja, aber nur im selben Jahr; ein Vor- oder Rücktrag ist ausgeschlossen (§ 10d EStG).", "Nein, Verluste aus Gewerbebetrieb dürfen nie mit anderen Einkünften verrechnet werden (§ 15 EStG).", "Ja, Verluste können mit Gewinnen verrechnet oder vorgetragen werden (§ 10d EStG)."], "richtig": 2, "erklaerung": "Ja, Verluste können mit Gewinnen verrechnet oder vorgetragen werden (§ 10d EStG).", "schwierigkeit": "schwer"}, {"id": 1428, "gesetz": "EStG", "frage": "#1428 Welche steuerlichen Pflichten bestehen bei einem Wechsel von Taxifahrzeug auf Mietwagenbetrieb?", "antworten": ["Mit dem Wechsel entsteht ein Freiberufler-Status, und die Gewerbesteuer entfällt (§ 18 EStG).", "Der Wechsel gilt als Betriebsaufgabe; der Aufgabegewinn ist sofort zu versteuern (§ 16 EStG).", "Einkommen- und gewerbesteuerlich ändert sich nichts (weiter Gewerbebetrieb); umsatzsteuerlich gilt für Mietwagenfahrten aber stets 19 % (§ 15 EStG, § 12 UStG)."], "richtig": 2, "erklaerung": "Einkommen- und gewerbesteuerlich ändert sich nichts (weiter Gewerbebetrieb); umsatzsteuerlich gilt für Mietwagenfahrten aber stets 19 % (§ 15 EStG, § 12 UStG).", "schwierigkeit": "leicht"}, {"id": 1429, "gesetz": "EStG", "frage": "#1429 Wie wirkt sich die Anschaffung eines neuen Fahrzeugs auf die Steuer aus?", "antworten": ["Die Anschaffung ist steuerlich neutral, da sie nur zu einem Aktivtausch führt (§ 6 EStG).", "Das Fahrzeug kann abgeschrieben werden (§ 7 EStG).", "Die Anschaffungskosten sind im Jahr der Anschaffung stets vollständig als Betriebsausgabe absetzbar (§ 4 Abs. 4 EStG)."], "richtig": 1, "erklaerung": "Das Fahrzeug kann abgeschrieben werden (§ 7 EStG).", "schwierigkeit": "mittel"}, {"id": 1430, "gesetz": "EStG", "frage": "#1430 Wie lange müssen steuerliche Unterlagen von Taxiunternehmen aufbewahrt werden?", "antworten": ["Alle steuerlichen Unterlagen sind zehn Jahre aufzubewahren; danach dürfen auch Belege vernichtet werden (§ 147 AO).", "Bücher und Jahresabschlüsse sechs Jahre, Buchungsbelege und Rechnungen drei Jahre (§ 257 HGB).", "Bücher, Inventare und Jahresabschlüsse 10 Jahre, Buchungsbelege und Rechnungen 8 Jahre (§ 257 Abs. 4 HGB, § 14b UStG)."], "richtig": 2, "erklaerung": "Bücher, Inventare und Jahresabschlüsse 10 Jahre, Buchungsbelege und Rechnungen 8 Jahre (§ 257 Abs. 4 HGB, § 14b UStG).", "schwierigkeit": "schwer"}, {"id": 1451, "gesetz": "GewStG", "frage": "#1451 Welche Steuerpflicht gilt für Taxi- und Mietwagenunternehmen nach dem Gewerbesteuergesetz?", "antworten": ["Taxi- und Mietwagenunternehmen unterliegen als Gewerbebetriebe der Gewerbesteuer (§ 2 GewStG).", "Sie unterliegen der Gewerbesteuer nur, wenn sie im Handelsregister eingetragen sind (§ 2 GewStG).", "Als Freiberufler sind sie von der Gewerbesteuer befreit und zahlen nur Einkommensteuer (§ 18 EStG)."], "richtig": 0, "erklaerung": "Taxi- und Mietwagenunternehmen unterliegen als Gewerbebetriebe der Gewerbesteuer (§ 2 GewStG).", "schwierigkeit": "leicht"}, {"id": 1452, "gesetz": "GewStG", "frage": "#1452 Wie wird der Gewerbeertrag für Taxi- und Mietwagenunternehmen ermittelt?", "antworten": ["Der Gewerbeertrag wird vom Finanzamt anhand der Zahl der Fahrzeuge und Konzessionen pauschal geschätzt (§ 162 AO).", "Der Gewerbeertrag entspricht dem Umsatz des Unternehmens abzüglich der Umsatzsteuer (§ 7 GewStG).", "Der Gewerbeertrag ist der nach Einkommensteuer- oder Körperschaftsteuergesetz ermittelte Gewinn, bereinigt um Hinzurechnungen und Kürzungen (§ 7 GewStG)."], "richtig": 2, "erklaerung": "Der Gewerbeertrag ist der nach Einkommensteuer- oder Körperschaftsteuergesetz ermittelte Gewinn, bereinigt um Hinzurechnungen und Kürzungen (§ 7 GewStG).", "schwierigkeit": "mittel"}, {"id": 1453, "gesetz": "GewStG", "frage": "#1453 Gibt es einen Freibetrag für kleine Taxi- und Mietwagenunternehmen?", "antworten": ["Ja, für alle Gewerbebetriebe gilt unabhängig von der Rechtsform ein Freibetrag von 10.000 € (§ 11 GewStG).", "Nein, einen Freibetrag gibt es nur für Kapitalgesellschaften mit geringem Stammkapital (§ 11 GewStG).", "Ja, für natürliche Personen und Personengesellschaften gilt ein Freibetrag von 24.500 € (§ 11 Abs. 1 GewStG)."], "richtig": 2, "erklaerung": "Ja, für natürliche Personen und Personengesellschaften gilt ein Freibetrag von 24.500 € (§ 11 Abs. 1 GewStG).", "schwierigkeit": "schwer"}, {"id": 1454, "gesetz": "GewStG", "frage": "#1454 Welche Hinzurechnungen gelten für Taxi- und Mietwagenunternehmen?", "antworten": ["Hinzugerechnet werden die gezahlte Umsatzsteuer und die Kfz-Steuer in voller Höhe (§ 8 GewStG).", "Ein Teil der Miet-, Pacht- und Leasingaufwendungen sowie Zinsen auf betriebliche Schulden werden dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "Es werden dem Gewinn nur Zinsen hinzugerechnet; Mieten, Pachten und Leasing bleiben unberücksichtigt (§ 8 GewStG)."], "richtig": 1, "erklaerung": "Ein Teil der Miet-, Pacht- und Leasingaufwendungen sowie Zinsen auf betriebliche Schulden werden dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "schwierigkeit": "leicht"}, {"id": 1455, "gesetz": "GewStG", "frage": "#1455 Welche Kürzungen sind für Taxi- und Mietwagenunternehmen relevant?", "antworten": ["Gekürzt werden die Löhne der Fahrer in Höhe von 50 % (§ 9 GewStG).", "Gekürzt werden die gezahlte Kfz-Steuer und die Versicherungsprämien für Fahrzeuge (§ 9 GewStG).", "Die gezahlte Grundsteuer für betriebliche Grundstücke kann vom Gewerbeertrag gekürzt werden (§ 9 GewStG)."], "richtig": 2, "erklaerung": "Die gezahlte Grundsteuer für betriebliche Grundstücke kann vom Gewerbeertrag gekürzt werden (§ 9 GewStG).", "schwierigkeit": "mittel"}, {"id": 1456, "gesetz": "GewStG", "frage": "#1456 Wie wird die Gewerbesteuer berechnet?", "antworten": ["Gewerbeertrag mal Hebesatz der Gemeinde, ohne Freibetrag und Messzahl (§ 16 GewStG).", "Gewerbeertrag abzüglich Freibetrag × 3,5 % ergibt den Steuermessbetrag; dieser wird mit dem Hebesatz der Gemeinde multipliziert (§§ 11, 16 GewStG).", "Gewerbeertrag abzüglich Freibetrag mal 5 % ergibt den Messbetrag, der mit dem Hebesatz des Landes multipliziert wird (§ 11 GewStG)."], "richtig": 1, "erklaerung": "Gewerbeertrag abzüglich Freibetrag × 3,5 % ergibt den Steuermessbetrag; dieser wird mit dem Hebesatz der Gemeinde multipliziert (§§ 11, 16 GewStG).", "schwierigkeit": "schwer"}, {"id": 1457, "gesetz": "GewStG", "frage": "#1457 Wie hoch ist der Mindesthebesatz für die Gewerbesteuer?", "antworten": ["Der Mindesthebesatz beträgt 200 % (ab Erhebungszeitraum 2027: 280 %), kann aber von jeder Gemeinde individuell festgelegt werden (§ 16 GewStG).", "Es gibt keinen Mindesthebesatz; Gemeinden dürfen auch einen Hebesatz von 0 % festsetzen (§ 16 GewStG).", "Einheitlich 400 % bundesweit; Gemeinden dürfen davon nicht abweichen (§ 16 GewStG)."], "richtig": 0, "erklaerung": "Der Mindesthebesatz beträgt 200 % (ab Erhebungszeitraum 2027: 280 %), kann aber von jeder Gemeinde individuell festgelegt werden (§ 16 GewStG).", "schwierigkeit": "leicht"}, {"id": 1458, "gesetz": "GewStG", "frage": "#1458 Welche Steuererleichterungen gibt es für Taxiunternehmen?", "antworten": ["Ja, Taxiunternehmen sind als Teil des öffentlichen Nahverkehrs von der Gewerbesteuer befreit (§ 3 GewStG).", "Ja, Taxiunternehmen zahlen nur die Hälfte des Steuermessbetrags (§ 11 GewStG).", "Es gibt keine speziellen Steuererleichterungen für Taxiunternehmen, aber sie können allgemeine gewerbesteuerliche Kürzungen nutzen (§ 9 GewStG)."], "richtig": 2, "erklaerung": "Es gibt keine speziellen Steuererleichterungen für Taxiunternehmen, aber sie können allgemeine gewerbesteuerliche Kürzungen nutzen (§ 9 GewStG).", "schwierigkeit": "mittel"}, {"id": 1459, "gesetz": "GewStG", "frage": "#1459 Sind nebenberufliche Taxiunternehmer gewerbesteuerpflichtig?", "antworten": ["Ja, jeder Gewerbebetrieb ist gewerbesteuerpflichtig; Steuer fällt aber erst an, wenn der Gewerbeertrag den Freibetrag von 24.500 € übersteigt (§§ 2, 11 GewStG).", "Ja, und die Steuer fällt ab dem ersten Euro Gewerbeertrag an, da der Freibetrag nur Hauptberuflern zusteht (§ 11 GewStG).", "Nein, nebenberufliche Tätigkeiten sind gewerbesteuerfrei, solange der Hauptberuf einen anderen Bereich betrifft (§ 2 GewStG)."], "richtig": 0, "erklaerung": "Ja, jeder Gewerbebetrieb ist gewerbesteuerpflichtig; Steuer fällt aber erst an, wenn der Gewerbeertrag den Freibetrag von 24.500 € übersteigt (§§ 2, 11 GewStG).", "schwierigkeit": "schwer"}, {"id": 1460, "gesetz": "GewStG", "frage": "#1460 Welche Auswirkungen hat die Gewerbesteuerpflicht auf Mietwagenunternehmen?", "antworten": ["Mietwagenunternehmen sind gewerbesteuerfrei, da sie wie Taxis Personenverkehr betreiben und nur Taxis Gewerbebetriebe sind (§ 3 GewStG).", "Mietwagenunternehmen sind wie Taxiunternehmen Gewerbebetriebe und unterliegen der Gewerbesteuer; Sonderregelungen gibt es für beide nicht (§ 2 GewStG).", "Mietwagenunternehmen zahlen einen erhöhten Gewerbesteuermessbetrag, weil sie keine Beförderungspflicht haben (§ 11 GewStG)."], "richtig": 1, "erklaerung": "Mietwagenunternehmen sind wie Taxiunternehmen Gewerbebetriebe und unterliegen der Gewerbesteuer; Sonderregelungen gibt es für beide nicht (§ 2 GewStG).", "schwierigkeit": "leicht"}, {"id": 1461, "gesetz": "GewStG", "frage": "#1461 Welche Bedeutung hat die Betriebsstätte für die Gewerbesteuer?", "antworten": ["Die Gewerbesteuer wird vom Bundesland erhoben, in dem die Betriebsstätte liegt (§ 1 GewStG).", "Die Gewerbesteuer wird in der Gemeinde erhoben, in der der Unternehmer seinen privaten Wohnsitz hat (§ 4 GewStG).", "Die Gewerbesteuer wird in der Gemeinde erhoben, in der sich die Betriebsstätte befindet (§ 4 GewStG)."], "richtig": 2, "erklaerung": "Die Gewerbesteuer wird in der Gemeinde erhoben, in der sich die Betriebsstätte befindet (§ 4 GewStG).", "schwierigkeit": "mittel"}, {"id": 1462, "gesetz": "GewStG", "frage": "#1462 Wann endet die Gewerbesteuerpflicht für ein Taxiunternehmen?", "antworten": ["Mit Ablauf des Kalenderjahres, in dem die Taxikonzession ausgelaufen ist (§ 16 PBefG).", "Mit der tatsächlichen Einstellung des Betriebs; die Gewerbeabmeldung bei der Gemeinde ist zusätzlich vorzunehmen (§ 2 GewStG, § 14 GewO).", "Mit der Gewerbeabmeldung bei der Gemeinde; die tatsächliche Betriebseinstellung ist unerheblich (§ 14 GewO)."], "richtig": 1, "erklaerung": "Mit der tatsächlichen Einstellung des Betriebs; die Gewerbeabmeldung bei der Gemeinde ist zusätzlich vorzunehmen (§ 2 GewStG, § 14 GewO).", "schwierigkeit": "schwer"}, {"id": 1463, "gesetz": "GewStG", "frage": "#1463 Wie werden Leasingfahrzeuge gewerbesteuerlich behandelt?", "antworten": ["Leasingraten werden in voller Höhe dem Gewinn hinzugerechnet (§ 7 GewStG).", "Ein Teil der Leasingraten wird dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "Leasingraten sind gewerbesteuerlich nicht zu berücksichtigen (§ 9 GewStG)."], "richtig": 1, "erklaerung": "Ein Teil der Leasingraten wird dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "schwierigkeit": "leicht"}, {"id": 1464, "gesetz": "GewStG", "frage": "#1464 Welche Rolle spielt die Stadt oder Gemeinde bei der Gewerbesteuer?", "antworten": ["Die Gemeinde prüft nur die Gewerbeanmeldung; Festsetzung und Erhebung liegen beim Land (§ 1 GewStG).", "Die Gemeinde legt den Hebesatz fest und erhebt die Gewerbesteuer (§ 16 GewStG).", "Die Gemeinde setzt den Steuermessbetrag fest, das Finanzamt legt den Hebesatz fest (§ 14 GewStG)."], "richtig": 1, "erklaerung": "Die Gemeinde legt den Hebesatz fest und erhebt die Gewerbesteuer (§ 16 GewStG).", "schwierigkeit": "mittel"}, {"id": 1465, "gesetz": "GewStG", "frage": "#1465 Wie oft muss die Gewerbesteuer gezahlt werden?", "antworten": ["In vierteljährlichen Vorauszahlungen am 15. Februar, 15. Mai, 15. August und 15. November (§ 19 GewStG).", "Monatlich bis zum zehnten des Folgemonats (§ 19 GewStG).", "Einmal jährlich zum 31. Mai des Folgejahres (§ 19 GewStG)."], "richtig": 0, "erklaerung": "In vierteljährlichen Vorauszahlungen am 15. Februar, 15. Mai, 15. August und 15. November (§ 19 GewStG).", "schwierigkeit": "schwer"}, {"id": 1466, "gesetz": "GewStG", "frage": "#1466 Was passiert, wenn ein Taxiunternehmen zu hohe Gewerbesteuer gezahlt hat?", "antworten": ["Die Gemeinde verrechnet den Betrag mit der Kfz-Steuer des Folgejahres (§ 226 AO).", "Es erfolgt eine Erstattung nach der Steuererklärung (§ 20 GewStG).", "Eine Erstattung ist ausgeschlossen; Überzahlungen verfallen zugunsten der Gemeinde (§ 20 GewStG)."], "richtig": 1, "erklaerung": "Es erfolgt eine Erstattung nach der Steuererklärung (§ 20 GewStG).", "schwierigkeit": "leicht"}, {"id": 1467, "gesetz": "GewStG", "frage": "#1467 Muss ein Taxiunternehmen eine Gewerbesteuererklärung abgeben?", "antworten": ["Nein, die Gewerbesteuererklärung wird nur auf Anforderung der Gemeinde abgegeben (§ 14a GewStG).", "Ja, immer bis zum 31. März des Folgejahres bei der Gemeinde, in Papierform (§ 25 GewStDV).", "Ja, wenn der Gewerbeertrag 24.500 € übersteigt (bei Kapitalgesellschaften immer); die Erklärung ist elektronisch abzugeben (§ 14a GewStG, § 25 GewStDV)."], "richtig": 2, "erklaerung": "Ja, wenn der Gewerbeertrag 24.500 € übersteigt (bei Kapitalgesellschaften immer); die Erklärung ist elektronisch abzugeben (§ 14a GewStG, § 25 GewStDV).", "schwierigkeit": "mittel"}, {"id": 1468, "gesetz": "GewStG", "frage": "#1468 Gibt es steuerliche Vorteile für Elektro-Taxis in der Gewerbesteuer?", "antworten": ["Nein, aber Elektro-Taxis können über andere Steuererleichterungen wie die Kfz-Steuerbefreiung profitieren.", "Ja, für Elektro-Taxis gilt in allen Gemeinden ein ermäßigter Hebesatz von 100 %.", "Ja, Elektro-Taxis sind für fünf Jahre vollständig von der Gewerbesteuer befreit."], "richtig": 0, "erklaerung": "Nein, aber Elektro-Taxis können über andere Steuererleichterungen wie die Kfz-Steuerbefreiung profitieren.", "schwierigkeit": "schwer"}, {"id": 1469, "gesetz": "GewStG", "frage": "#1469 Was passiert mit der Gewerbesteuer, wenn ein Taxiunternehmen mehrere Standorte hat?", "antworten": ["Der Messbetrag wird auf die Gemeinden mit Betriebsstätten zerlegt, grundsätzlich nach dem Verhältnis der Arbeitslöhne (§§ 28, 29 GewStG).", "Der Messbetrag wird nach der Zahl der Fahrzeuge je Standort auf die Gemeinden aufgeteilt (§ 29 GewStG).", "Die Gewerbesteuer wird nur am Ort des Hauptsitzes erhoben; Zweigstellen bleiben unberücksichtigt (§ 4 GewStG)."], "richtig": 0, "erklaerung": "Der Messbetrag wird auf die Gemeinden mit Betriebsstätten zerlegt, grundsätzlich nach dem Verhältnis der Arbeitslöhne (§§ 28, 29 GewStG).", "schwierigkeit": "leicht"}, {"id": 1470, "gesetz": "GewStG", "frage": "#1470 Wie werden Gewinne aus dem Verkauf eines Taxiunternehmens besteuert?", "antworten": ["Bei Einzelunternehmern und natürlichen Personen als Mitunternehmern unterliegt der Veräußerungsgewinn nicht der Gewerbesteuer, nur der Einkommensteuer (§ 7 Satz 2 GewStG, § 16 EStG).", "Der Veräußerungsgewinn ist steuerfrei, wenn der Käufer das Unternehmen fortführt (§ 3 GewStG).", "Der Veräußerungsgewinn unterliegt stets in voller Höhe der Gewerbesteuer (§ 7 GewStG)."], "richtig": 0, "erklaerung": "Bei Einzelunternehmern und natürlichen Personen als Mitunternehmern unterliegt der Veräußerungsgewinn nicht der Gewerbesteuer, nur der Einkommensteuer (§ 7 Satz 2 GewStG, § 16 EStG).", "schwierigkeit": "mittel"}, {"id": 1471, "gesetz": "GewStG", "frage": "#1471 Welche Bedeutung hat der Gewerbesteuermessbetrag?", "antworten": ["Er bezeichnet den Freibetrag, den jedes Unternehmen vom Gewerbeertrag abziehen darf (§ 11 GewStG).", "Der Steuermessbetrag ist die Basis für die Berechnung der endgültigen Gewerbesteuer (§ 11 GewStG).", "Der Messbetrag ist der Betrag, den die Gemeinde als endgültige Gewerbesteuer einzieht (§ 16 GewStG)."], "richtig": 1, "erklaerung": "Der Steuermessbetrag ist die Basis für die Berechnung der endgültigen Gewerbesteuer (§ 11 GewStG).", "schwierigkeit": "schwer"}, {"id": 1472, "gesetz": "GewStG", "frage": "#1472 Wie wird der Gewerbeertrag berechnet, wenn ein Taxiunternehmen Verluste gemacht hat?", "antworten": ["Gewerbeverluste können mit zukünftigen Gewinnen verrechnet werden (§ 10a GewStG).", "Der Verlust kann nur auf das unmittelbar vorangegangene Jahr zurückgetragen werden (§ 10d EStG).", "Verluste sind für die Gewerbesteuer ohne Bedeutung und können weder vor- noch zurückgetragen werden (§ 10a GewStG)."], "richtig": 0, "erklaerung": "Gewerbeverluste können mit zukünftigen Gewinnen verrechnet werden (§ 10a GewStG).", "schwierigkeit": "leicht"}, {"id": 1473, "gesetz": "GewStG", "frage": "#1473 Welche Rolle spielen Hinzurechnungen für die Gewerbesteuer?", "antworten": ["Bestimmte Kosten wie Zinsen und Mieten werden dem Gewinn wieder zugerechnet, um die Steuerbemessungsgrundlage zu erhöhen (§ 8 GewStG).", "Sie dienen dazu, die Steuerlast zu senken, indem bestimmte Einnahmen vom Gewinn abgezogen werden (§ 9 GewStG).", "Hinzurechnungen betreffen ausschließlich Zinsen auf private Schulden des Unternehmers (§ 8 GewStG)."], "richtig": 0, "erklaerung": "Bestimmte Kosten wie Zinsen und Mieten werden dem Gewinn wieder zugerechnet, um die Steuerbemessungsgrundlage zu erhöhen (§ 8 GewStG).", "schwierigkeit": "mittel"}, {"id": 1474, "gesetz": "GewStG", "frage": "#1474 Welche Gewerbesteuerpflicht gilt für ein Taxiunternehmen, das ins Ausland expandiert?", "antworten": ["Es ist nur gewerbesteuerpflichtig, wenn auch die Geschäftsleitung im Inland liegt; eine Betriebsstätte allein genügt nicht (§ 2 GewStG).", "In Deutschland bleibt es gewerbesteuerpflichtig, sofern es eine Betriebsstätte im Inland hat (§ 2 GewStG).", "Mit der Expansion endet die inländische Gewerbesteuerpflicht, da der Gewinn im Ausland versteuert wird (§ 2 GewStG)."], "richtig": 1, "erklaerung": "In Deutschland bleibt es gewerbesteuerpflichtig, sofern es eine Betriebsstätte im Inland hat (§ 2 GewStG).", "schwierigkeit": "schwer"}, {"id": 1475, "gesetz": "GewStG", "frage": "#1475 Was passiert, wenn die Gewerbesteuer nicht gezahlt wird?", "antworten": ["Die Gemeinde kann nur mahnen; eine Vollstreckung ist erst nach gerichtlichem Urteil zulässig (§ 704 ZPO).", "Es fallen Verzugszinsen von 5 % über dem Basiszins an, und der Gerichtsvollzieher wird eingeschaltet (§ 288 BGB).", "Es fallen Säumniszuschläge von 1 % je angefangenem Monat an, und die Gemeinde kann vollstrecken (§ 240 AO)."], "richtig": 2, "erklaerung": "Es fallen Säumniszuschläge von 1 % je angefangenem Monat an, und die Gemeinde kann vollstrecken (§ 240 AO).", "schwierigkeit": "leicht"}, {"id": 1476, "gesetz": "GewStG", "frage": "#1476 Wie wirkt sich ein Rechtsformwechsel auf die Gewerbesteuer aus?", "antworten": ["Bei Umwandlung in eine GmbH entfällt die Gewerbesteuerpflicht für drei Jahre (§ 3 GewStG).", "Ein Rechtsformwechsel hat keinen Einfluss, da die Gewerbesteuerpflicht für jede Rechtsform gleich ist (§ 2 GewStG).", "Eine Umwandlung in eine Kapitalgesellschaft kann die Steuerpflicht beeinflussen (§ 2 GewStG)."], "richtig": 2, "erklaerung": "Eine Umwandlung in eine Kapitalgesellschaft kann die Steuerpflicht beeinflussen (§ 2 GewStG).", "schwierigkeit": "mittel"}, {"id": 1477, "gesetz": "GewStG", "frage": "#1477 Sind Einnahmen aus Subventionen oder Fördermitteln gewerbesteuerpflichtig?", "antworten": ["Nur wenn sie als Darlehen gewährt werden; Zuschüsse bleiben stets unberücksichtigt (§ 8 GewStG).", "Ja, wenn sie den Gewinn des Unternehmens erhöhen (§ 7 GewStG).", "Nein, Subventionen und Fördermittel sind generell gewerbesteuerfrei (§ 3 GewStG)."], "richtig": 1, "erklaerung": "Ja, wenn sie den Gewinn des Unternehmens erhöhen (§ 7 GewStG).", "schwierigkeit": "schwer"}, {"id": 1478, "gesetz": "GewStG", "frage": "#1478 Kann ein Taxiunternehmen durch Umstrukturierung Gewerbesteuer sparen?", "antworten": ["Nein, die Gewerbesteuer ist bundesweit einheitlich und kann weder durch Rechtsform noch durch Standort beeinflusst werden (§ 16 GewStG).", "Begrenzt; z. B. durch die Wahl der Rechtsform, eines Standorts mit niedrigem Hebesatz oder die Nutzung gesetzlicher Kürzungen (§§ 9, 16 GewStG).", "Ja, durch Verlegung des Firmensitzes ins Ausland kann die Gewerbesteuer vollständig vermieden werden, auch bei inländischen Fahrten (§ 2 GewStG)."], "richtig": 1, "erklaerung": "Begrenzt; z. B. durch die Wahl der Rechtsform, eines Standorts mit niedrigem Hebesatz oder die Nutzung gesetzlicher Kürzungen (§§ 9, 16 GewStG).", "schwierigkeit": "leicht"}, {"id": 1479, "gesetz": "GewStG", "frage": "#1479 Wie wird die Gewerbesteuer bei Unternehmensfusionen berechnet?", "antworten": ["Es gilt jeweils der höhere Gewerbeertrag der beteiligten Unternehmen fort (§ 10a GewStG).", "Die Gewerbesteuer entfällt bei Fusionen für zwei Jahre (§ 3 GewStG).", "Der Gewerbeertrag des fusionierten Unternehmens wird neu berechnet (§ 7 GewStG)."], "richtig": 2, "erklaerung": "Der Gewerbeertrag des fusionierten Unternehmens wird neu berechnet (§ 7 GewStG).", "schwierigkeit": "mittel"}, {"id": 1480, "gesetz": "GewStG", "frage": "#1480 Welche steuerlichen Vorteile bietet eine Holding-Struktur für ein Taxiunternehmen?", "antworten": ["Eine Holding ist von der Gewerbesteuer befreit, wenn sie keine eigenen Fahrzeuge betreibt (§ 3 GewStG).", "Gewinnanteile von Tochterunternehmen können unter bestimmten Voraussetzungen steuerlich begünstigt sein (§ 9 GewStG).", "Eine Holding mindert die Gewerbesteuer, weil Gewinne dort nur mit dem halben Hebesatz belastet werden (§ 16 GewStG)."], "richtig": 1, "erklaerung": "Gewinnanteile von Tochterunternehmen können unter bestimmten Voraussetzungen steuerlich begünstigt sein (§ 9 GewStG).", "schwierigkeit": "schwer"}];

// Schwierigkeit zuweisen (je 1/3)
const sq = [...ALL_QUESTIONS].sort((a,b)=>a.id-b.id);
const t3 = Math.ceil(sq.length/3);
sq.forEach((q,i)=>{ q.schwierigkeit = q.schwierigkeit || (i<t3?'leicht':i<t3*2?'mittel':'schwer'); });

let currentUser = null;
let stats = {richtig:[],falsch:[],gesehen:[]};
let quizQueue = [], quizIdx = 0, quizResults = [];
let selectedDiff = 'alle';

// ════ LOGIN ════
function checkCode(){
  const val = document.getElementById('code-input').value.trim().toUpperCase();
  if(CODES.includes(val)){
    currentUser = val;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.add('visible');
    showHome();
  } else {
    document.getElementById('login-error').textContent = '❌ Ungültiger Code. Bitte prüfen.';
    document.getElementById('code-input').value='';
  }
}
document.getElementById('code-input').addEventListener('keydown',e=>{ if(e.key==='Enter') checkCode(); });

function logout(){
  currentUser=null;
  stats={richtig:[],falsch:[],gesehen:[]};
  document.getElementById('code-input').value='';
  document.getElementById('login-error').textContent='';
  document.getElementById('app-screen').classList.remove('visible');
  document.getElementById('login-screen').classList.remove('hidden');
}

// ════ HOME ════
const DIFFS={
  leicht:{label:'Leicht',emoji:'🟢',farbe:'#3DD68C'},
  mittel:{label:'Mittel',emoji:'🟡',farbe:'#F5C842'},
  schwer:{label:'Schwer',emoji:'🔴',farbe:'#FF5A5A'},
  alle:  {label:'Alle Mix',emoji:'🎲',farbe:'#C9A84C'},
};

function showHome(){
  window.scrollTo(0,0);
  const total=ALL_QUESTIONS.length;
  const beherrscht=stats.richtig.length;
  const falsch=stats.falsch.length;
  const neu=total-stats.gesehen.length;
  const pct=Math.round(beherrscht/total*100);
  const counts={
    leicht:ALL_QUESTIONS.filter(q=>q.schwierigkeit==='leicht').length,
    mittel:ALL_QUESTIONS.filter(q=>q.schwierigkeit==='mittel').length,
    schwer:ALL_QUESTIONS.filter(q=>q.schwierigkeit==='schwer').length,
    alle:total
  };

  document.getElementById('main-content').innerHTML=`
  <div class="anim">
  <div class="stats-row">
    <div class="stat-box"><span class="stat-val" style="color:#C9A84C">${total}</span><span class="stat-lbl">§§</span></div>
    <div class="stat-box"><span class="stat-val" style="color:#3DD68C">${beherrscht}</span><span class="stat-lbl">✓</span></div>
    <div class="stat-box"><span class="stat-val" style="color:#FF5A5A">${falsch}</span><span class="stat-lbl">↺</span></div>
    <div class="stat-box"><span class="stat-val" style="color:#60A5FA">${neu}</span><span class="stat-lbl">○</span></div>
  </div>

  <div class="card">
    <div class="card-label">SCHWIERIGKEITSSTUFE WÄHLEN:</div>
    <div class="diff-grid">
      ${Object.entries(DIFFS).map(([k,v])=>`
        <button class="diff-btn" onclick="selectDiff('${k}')"
          style="border-color:${selectedDiff===k?v.farbe:'rgba(255,255,255,0.08)'};
                 background:${selectedDiff===k?v.farbe+'22':'var(--dark3)'}">
          <span style="font-size:20px">${v.emoji}</span>
          <span class="dlabel">${v.label}</span>
          <small>${counts[k]} Fragen</small>
        </button>`).join('')}
    </div>
  </div>

  <div class="card">
    <div class="card-label">NÄCHSTE RUNDE ENTHÄLT:</div>
    <div class="round-row"><span style="color:#FF5A5A">↺</span><span><b style="color:#FF5A5A">${falsch}</b> Wiederholungen (falsch beantwortet)</span></div>
    <div class="round-row"><span style="color:#60A5FA">★</span><span><b style="color:#60A5FA">${Math.min(neu,20)}</b> neue Fragen</span></div>
    <div class="round-row"><span style="color:#C9A84C">%</span><span>Fortschritt: <b style="color:#C9A84C">${pct}%</b> aller Fragen beherrscht</span></div>
  </div>

  <button class="primary-btn" onclick="startQuiz()">▶ Weiter lernen (${DIFFS[selectedDiff].label})</button>
  <button class="secondary-btn" onclick="showDetail()">📊 Lernstand nach Gesetz</button>
  <button class="danger-btn" onclick="resetProgress()">Fortschritt zurücksetzen</button>
  </div>`;
}

function selectDiff(d){ selectedDiff=d; showHome(); }

function resetProgress(){
  if(confirm('Fortschritt wirklich zurücksetzen?')){
    stats={richtig:[],falsch:[],gesehen:[]};
    showHome();
  }
}

// ════ QUIZ ════
function startQuiz(){
  let pool=selectedDiff==='alle'?ALL_QUESTIONS:ALL_QUESTIONS.filter(q=>q.schwierigkeit===selectedDiff);
  const shuffle=arr=>[...arr].sort(()=>Math.random()-0.5);
  const falschQ=pool.filter(q=>stats.falsch.includes(q.id));
  const neuQ=pool.filter(q=>!stats.gesehen.includes(q.id)&&!stats.falsch.includes(q.id));
  const restQ=pool.filter(q=>stats.gesehen.includes(q.id)&&!stats.falsch.includes(q.id));
  quizQueue=shuffle([...falschQ,...shuffle(neuQ).slice(0,20),...shuffle(restQ)]).slice(0,20);
  if(!quizQueue.length){alert('Alle Fragen beantwortet! Sehr gut!');return;}
  quizIdx=0; quizResults=[];
  showQuestion();
}

function showQuestion(){
  window.scrollTo(0,0);
  const q=quizQueue[quizIdx];
  const pct=Math.round(quizIdx/quizQueue.length*100);
  const letters=['A','B','C'];
  document.getElementById('main-content').innerHTML=`
  <div class="anim">
  <div class="prog-wrap">
    <div class="prog-top"><span>Frage ${quizIdx+1} von ${quizQueue.length}</span><span>${pct}%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:${pct}%"></div></div>
  </div>
  <div class="q-tag">${q.gesetz}</div>
  <div class="q-text">${q.frage}</div>
  <div class="answers" id="answers">
    ${q.antworten.map((a,i)=>`
      <button class="ans-btn" id="ans${i}" onclick="selectAnswer(${i})">
        <span class="letter">${letters[i]}</span><span>${a.replace(/^#\d{4}\s*/,'')}</span>
      </button>`).join('')}
  </div>
  <div class="feedback" id="feedback"></div>
  <button class="primary-btn" id="next-btn" style="display:none" onclick="nextQuestion()">
    ${quizIdx+1>=quizQueue.length?'Ergebnis anzeigen →':'Nächste Frage →'}
  </button>
  <button class="secondary-btn" style="margin-top:4px" onclick="showHome()">← Abbrechen</button>
  </div>`;
}

function selectAnswer(idx){
  const q=quizQueue[quizIdx];
  document.querySelectorAll('.ans-btn').forEach(b=>b.classList.add('locked'));
  const isOk=idx===q.richtig;
  quizResults.push({id:q.id,correct:isOk});
  document.getElementById('ans'+idx).classList.add(isOk?'correct':'wrong');
  if(!isOk) document.getElementById('ans'+q.richtig).classList.add('correct');
  document.querySelectorAll('.ans-btn').forEach((b,i)=>{
    if(i!==idx&&i!==q.richtig) b.style.opacity='0.3';
  });
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(isOk?'ok':'err');
  fb.innerHTML=`<b>${isOk?'✓ Richtig!':'✗ Leider falsch.'}</b>${q.erklaerung}`;
  document.getElementById('next-btn').style.display='block';
}

function nextQuestion(){
  const last=quizResults[quizResults.length-1];
  if(last){
    if(!stats.gesehen.includes(last.id)) stats.gesehen.push(last.id);
    if(last.correct){
      stats.richtig=[...new Set([...stats.richtig,last.id])];
      stats.falsch=stats.falsch.filter(id=>id!==last.id);
    }else{
      stats.falsch=[...new Set([...stats.falsch,last.id])];
      stats.richtig=stats.richtig.filter(id=>id!==last.id);
    }
  }
  quizIdx++;
  if(quizIdx>=quizQueue.length) showResult();
  else showQuestion();
}

// ════ RESULT ════
function showResult(){
  window.scrollTo(0,0);
  const correct=quizResults.filter(r=>r.correct).length;
  const pct=Math.round(correct/quizResults.length*100);
  const icon=pct>=70?'🏆':pct>=50?'📚':'💪';
  const title=pct>=70?'Sehr gut!':pct>=50?'Weiter üben!':'Nicht aufgeben!';
  document.getElementById('main-content').innerHTML=`
  <div class="result-screen anim">
    <div style="font-size:64px;margin-bottom:16px">${icon}</div>
    <div style="font-size:28px;font-weight:700;color:var(--gold);margin-bottom:8px">${title}</div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:20px">Dein Ergebnis</div>
    <div class="score-big">${pct}%</div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:32px">${correct} von ${quizResults.length} Fragen richtig</div>
    <button class="primary-btn" onclick="showHome()">Zurück zum Menü</button>
  </div>`;
}

// ════ DETAIL ════
function showDetail(){
  window.scrollTo(0,0);
  const gesetze=[...new Set(ALL_QUESTIONS.map(q=>q.gesetz))].sort();
  document.getElementById('main-content').innerHTML=`
  <div class="anim">
  <button class="secondary-btn" onclick="showHome()">← Zurück</button>
  <div style="font-size:18px;font-weight:700;margin-bottom:16px">📊 Lernstand nach Gesetz</div>
  ${gesetze.map(g=>{
    const qs=ALL_QUESTIONS.filter(q=>q.gesetz===g);
    const r=qs.filter(q=>stats.richtig.includes(q.id)).length;
    const pct=Math.round(r/qs.length*100);
    return `<div class="detail-item">
      <div style="font-weight:600;font-size:14px">${g}</div>
      <div class="detail-bar"><div class="detail-fill" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--muted)">${r} / ${qs.length} · ${pct}%</div>
    </div>`;
  }).join('')}
  </div>`;
}
</script>
</body>
</html>
