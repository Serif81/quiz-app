t, die objektiv gerechtfertigt ist (§ 8 AGG).", "Nur, wenn er dies in der Stellenausschreibung schriftlich begründet und die Gewerbeaufsicht zugestimmt hat (§ 8 AGG).", "Ja, jederzeit, da Unternehmer bei der Auswahl von Fahrern völlig frei sind (§ 7 AGG)."], "richtig": 0, "erklaerung": "Nur, wenn eine wesentliche berufliche Anforderung besteht, die objektiv gerechtfertigt ist (§ 8 AGG).", "schwierigkeit": "schwer"}, {"id": 504, "gesetz": "AGG", "frage": "#0504 Darf ein Fahrgast aufgrund seiner Herkunft abgelehnt werden?", "antworten": ["Nein, das wäre eine unzulässige Diskriminierung nach § 19 AGG.", "Ja, wenn der Fahrer sich unwohl fühlt, darf er die Beförderung nach eigenem Ermessen verweigern (§ 22 PBefG).", "Ja, bei Fahrgästen aus Nicht-EU-Staaten, da das AGG nur für EU-Bürger gilt (§ 2 AGG)."], "richtig": 0, "erklaerung": "Nein, das wäre eine unzulässige Diskriminierung nach § 19 AGG.", "schwierigkeit": "leicht"}, {"id": 505, "gesetz": "AGG", "frage": "#0505 Welche AGG-Vorschriften gelten für Mietwagenunternehmen?", "antworten": ["Keine; Mietwagenunternehmen sind als reine Vorbestellungsbetriebe vom AGG ausgenommen (§ 2 AGG).", "Strengere als für Taxiunternehmen, weil Mietwagen nicht der Beförderungspflicht unterliegen (§ 19 AGG).", "Die gleichen wie für Taxiunternehmen, insbesondere das Benachteiligungsverbot bei Anstellung und Dienstleistungen (§ 2, § 19 AGG)."], "richtig": 2, "erklaerung": "Die gleichen wie für Taxiunternehmen, insbesondere das Benachteiligungsverbot bei Anstellung und Dienstleistungen (§ 2, § 19 AGG).", "schwierigkeit": "mittel"}, {"id": 506, "gesetz": "AGG", "frage": "#0506 Was ist das Ziel des Allgemeinen Gleichbehandlungsgesetzes (AGG)?", "antworten": ["Benachteiligungen aus Gründen der Rasse oder wegen der ethnischen Herkunft, des Geschlechts, der Religion oder Weltanschauung, einer Behinderung, des Alters oder der sexuellen Identität zu verhindern oder zu beseitigen (§ 1 AGG).", "Die Gleichstellung der Löhne von Männern und Frauen sowie die Förderung von Teilzeitarbeit (§ 1 AGG).", "Benachteiligungen wegen der Staatsangehörigkeit, der politischen Überzeugung, des Familienstands oder der Parteizugehörigkeit zu verhindern (§ 1 AGG)."], "richtig": 0, "erklaerung": "Benachteiligungen aus Gründen der Rasse oder wegen der ethnischen Herkunft, des Geschlechts, der Religion oder Weltanschauung, einer Behinderung, des Alters oder der sexuellen Identität zu verhindern oder zu beseitigen (§ 1 AGG).", "schwierigkeit": "schwer"}, {"id": 507, "gesetz": "AGG", "frage": "#0507 In welchen Bereichen gilt das AGG?", "antworten": ["Nur im Arbeitsrecht, nicht bei Verträgen mit Kunden (§ 2 AGG).", "Im Arbeitsrecht, beim Zugang zu Gütern und Dienstleistungen, bei Sozialleistungen, Bildung und Wohnraum (§ 2 AGG).", "Nur im öffentlichen Dienst und bei staatlichen Leistungen, nicht in privaten Unternehmen (§ 6 AGG)."], "richtig": 1, "erklaerung": "Im Arbeitsrecht, beim Zugang zu Gütern und Dienstleistungen, bei Sozialleistungen, Bildung und Wohnraum (§ 2 AGG).", "schwierigkeit": "leicht"}, {"id": 508, "gesetz": "AGG", "frage": "#0508 Welche Benachteiligungen sind laut AGG verboten?", "antworten": ["Nur unmittelbare Benachteiligung; mittelbare Benachteiligung und Belästigung sind erlaubt (§ 3 AGG).", "Unmittelbare, mittelbare Benachteiligung, Belästigung, sexuelle Belästigung und Anweisung zur Benachteiligung (§ 3 AGG).", "Jede Ungleichbehandlung, auch bei sachlichem Grund, sowie unterschiedliche Entlohnung nach Leistung (§ 3 AGG)."], "richtig": 1, "erklaerung": "Unmittelbare, mittelbare Benachteiligung, Belästigung, sexuelle Belästigung und Anweisung zur Benachteiligung (§ 3 AGG).", "schwierigkeit": "mittel"}, {"id": 509, "gesetz": "AGG", "frage": "#0509 Wann liegt eine unmittelbare Benachteiligung vor?", "antworten": ["Wenn eine Person wegen eines AGG-Merkmals schlechter behandelt wird als eine andere in vergleichbarer Situation (§ 3 Abs. 1 AGG).", "Wenn scheinbar neutrale Vorschriften bestimmte Gruppen besonders benachteiligen (§ 3 Abs. 2 AGG).", "Wenn ein Arbeitgeber eine Person aus sachlichen Gründen, etwa wegen mangelnder Qualifikation, schlechter behandelt (§ 3 Abs. 1 AGG)."], "richtig": 0, "erklaerung": "Wenn eine Person wegen eines AGG-Merkmals schlechter behandelt wird als eine andere in vergleichbarer Situation (§ 3 Abs. 1 AGG).", "schwierigkeit": "schwer"}, {"id": 510, "gesetz": "AGG", "frage": "#0510 Wann liegt eine mittelbare Benachteiligung vor?", "antworten": ["Wenn scheinbar neutrale Vorschriften oder Praktiken bestimmte Gruppen benachteiligen, ohne gerechtfertigt zu sein (§ 3 Abs. 2 AGG).", "Wenn eine Person durch unerwünschte Verhaltensweisen in ihrer Würde verletzt wird (§ 3 Abs. 3 AGG).", "Wenn eine Person wegen eines AGG-Merkmals unmittelbar schlechter behandelt wird als eine andere (§ 3 Abs. 1 AGG)."], "richtig": 0, "erklaerung": "Wenn scheinbar neutrale Vorschriften oder Praktiken bestimmte Gruppen benachteiligen, ohne gerechtfertigt zu sein (§ 3 Abs. 2 AGG).", "schwierigkeit": "leicht"}, {"id": 511, "gesetz": "AGG", "frage": "#0511 Wer ist nach dem AGG vor Benachteiligung geschützt?", "antworten": ["Arbeitnehmer, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG).", "Nur Arbeitnehmer mit unbefristetem Vertrag; Auszubildende und Bewerber sind nicht erfasst (§ 6 AGG).", "Arbeitnehmer, Kunden und Fahrgäste sowie Lieferanten des Unternehmens (§ 6 AGG)."], "richtig": 0, "erklaerung": "Arbeitnehmer, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG).", "schwierigkeit": "mittel"}, {"id": 512, "gesetz": "AGG", "frage": "#0512 Wann ist eine unterschiedliche Behandlung im Arbeitsverhältnis zulässig?", "antworten": ["Wenn sie durch wesentliche berufliche Anforderungen gerechtfertigt ist (§ 8 AGG).", "Wenn der Arbeitgeber dafür wirtschaftliche Gründe hat, etwa niedrigere Personalkosten (§ 8 AGG).", "Wenn die Mehrheit der Belegschaft oder der Betriebsrat zustimmt (§ 7 AGG)."], "richtig": 0, "erklaerung": "Wenn sie durch wesentliche berufliche Anforderungen gerechtfertigt ist (§ 8 AGG).", "schwierigkeit": "schwer"}, {"id": 513, "gesetz": "AGG", "frage": "#0513 Darf ein Unternehmen gezielt Frauen oder Männer für eine Stelle suchen?", "antworten": ["Ja, jederzeit, da Arbeitgeber bei der Stellenausschreibung frei sind (§ 11 AGG).", "Nur, wenn das Geschlecht eine wesentliche berufliche Anforderung darstellt (§ 8 AGG).", "Nur, wenn der Betriebsrat dies in einer Betriebsvereinbarung ausdrücklich vorgesehen hat (§ 11 AGG)."], "richtig": 1, "erklaerung": "Nur, wenn das Geschlecht eine wesentliche berufliche Anforderung darstellt (§ 8 AGG).", "schwierigkeit": "leicht"}, {"id": 514, "gesetz": "AGG", "frage": "#0514 Was gilt für Religionsgemeinschaften bei der Personalauswahl?", "antworten": ["Nein, auch Religionsgemeinschaften dürfen bei der Auswahl nicht nach der Religion unterscheiden (§ 9 AGG).", "Sie dürfen Mitarbeiter nach ihrer Religion auswählen, wenn es für die Tätigkeit erforderlich ist (§ 9 AGG).", "Ja, aber nur bei Tätigkeiten im Ausland; im Inland gilt das Benachteiligungsverbot uneingeschränkt (§ 7 AGG)."], "richtig": 1, "erklaerung": "Sie dürfen Mitarbeiter nach ihrer Religion auswählen, wenn es für die Tätigkeit erforderlich ist (§ 9 AGG).", "schwierigkeit": "mittel"}, {"id": 515, "gesetz": "AGG", "frage": "#0515 Wann ist eine Ungleichbehandlung aufgrund des Alters erlaubt?", "antworten": ["Nur bei Beschäftigten über 65 Jahren, ohne weitere Voraussetzung (§ 8 AGG).", "Immer, wenn der Arbeitgeber dies im Arbeitsvertrag vereinbart hat (§ 10 AGG).", "Wenn sie objektiv gerechtfertigt ist, z. B. durch Renteneintrittsalter oder Jugendschutz (§ 10 AGG)."], "richtig": 2, "erklaerung": "Wenn sie objektiv gerechtfertigt ist, z. B. durch Renteneintrittsalter oder Jugendschutz (§ 10 AGG).", "schwierigkeit": "schwer"}, {"id": 516, "gesetz": "AGG", "frage": "#0516 Welche Maßnahmen muss ein Arbeitgeber gegen Diskriminierung ergreifen?", "antworten": ["Vorbeugende Maßnahmen und Schutzmaßnahmen für Beschäftigte (§ 12 AGG).", "Er muss alle Bewerbungen anonymisiert über die Antidiskriminierungsstelle abwickeln (§ 12 AGG).", "Er muss nur dann tätig werden, wenn ein Betroffener Klage erhebt (§ 12 AGG)."], "richtig": 0, "erklaerung": "Vorbeugende Maßnahmen und Schutzmaßnahmen für Beschäftigte (§ 12 AGG).", "schwierigkeit": "leicht"}, {"id": 517, "gesetz": "AGG", "frage": "#0517 Was muss ein Arbeitgeber bei Stellenanzeigen beachten?", "antworten": ["Er darf keine diskriminierenden Anforderungen stellen (§ 11 AGG).", "Er muss die Anzeige zuvor von der Antidiskriminierungsstelle genehmigen lassen (§ 11 AGG).", "Er muss das gewünschte Alter und Geschlecht der Bewerber in der Anzeige angeben (§ 11 AGG)."], "richtig": 0, "erklaerung": "Er darf keine diskriminierenden Anforderungen stellen (§ 11 AGG).", "schwierigkeit": "mittel"}, {"id": 518, "gesetz": "AGG", "frage": "#0518 Wie kann sich ein Arbeitnehmer gegen Diskriminierung wehren?", "antworten": ["Durch Beschwerde beim Arbeitgeber oder einer zuständigen Stelle (§ 13 AGG).", "Durch Beschwerde bei der Gewerbeaufsicht, die den Arbeitgeber bestraft (§ 17 AGG).", "Nur durch Klage vor dem Arbeitsgericht; eine Beschwerde im Betrieb ist ausgeschlossen (§ 13 AGG)."], "richtig": 0, "erklaerung": "Durch Beschwerde beim Arbeitgeber oder einer zuständigen Stelle (§ 13 AGG).", "schwierigkeit": "schwer"}, {"id": 519, "gesetz": "AGG", "frage": "#0519 Welche Sanktionen drohen Unternehmen bei Verstößen gegen das AGG?", "antworten": ["Bußgelder bis zu 50.000 €, die die Antidiskriminierungsstelle verhängt (§ 27 AGG).", "Schadensersatz- oder Entschädigungszahlungen (§ 15 AGG).", "Entzug der Taxikonzession durch die Genehmigungsbehörde (§ 25 PBefG)."], "richtig": 1, "erklaerung": "Schadensersatz- oder Entschädigungszahlungen (§ 15 AGG).", "schwierigkeit": "leicht"}, {"id": 520, "gesetz": "AGG", "frage": "#0520 Was passiert, wenn ein Arbeitnehmer sich gegen Diskriminierung wehrt?", "antworten": ["Der Arbeitgeber darf ihn versetzen, wenn dies betrieblich begründet ist (§ 16 AGG).", "Er darf nicht benachteiligt oder gekündigt werden (§ 16 AGG).", "Er muss die Beschwerde zurücknehmen, sobald der Arbeitgeber widerspricht (§ 13 AGG)."], "richtig": 1, "erklaerung": "Er darf nicht benachteiligt oder gekündigt werden (§ 16 AGG).", "schwierigkeit": "mittel"}, {"id": 521, "gesetz": "AGG", "frage": "#0521 Gilt das AGG auch für private Dienstleistungen und Verträge?", "antworten": ["Ja, insbesondere bei Massengeschäften oder bei Wohnungsvermietungen (§ 19 AGG).", "Nein, das AGG gilt nur im Arbeitsleben; Verträge unter Privatpersonen sind ausgenommen (§ 2 AGG).", "Ja, bei jedem privaten Vertrag, auch bei Verträgen mit besonderem Nähe- oder Vertrauensverhältnis (§ 19 AGG)."], "richtig": 0, "erklaerung": "Ja, insbesondere bei Massengeschäften oder bei Wohnungsvermietungen (§ 19 AGG).", "schwierigkeit": "schwer"}, {"id": 522, "gesetz": "AGG", "frage": "#0522 Darf ein Unternehmen einen Vertrag wegen der Religion eines Kunden verweigern?", "antworten": ["Nein, das wäre eine verbotene Diskriminierung (§ 19 AGG).", "Ja, die Religionsfreiheit des Unternehmers erlaubt jede Vertragsablehnung (Art. 4 GG).", "Ja, wenn der Kunde seine Religion offen zur Schau stellt (§ 20 AGG)."], "richtig": 0, "erklaerung": "Nein, das wäre eine verbotene Diskriminierung (§ 19 AGG).", "schwierigkeit": "leicht"}, {"id": 523, "gesetz": "AGG", "frage": "#0523 Wann ist eine Ungleichbehandlung im Zivilrecht erlaubt?", "antworten": ["Immer, wenn der Unternehmer dadurch Kosten spart; das gilt auch bei Rasse oder ethnischer Herkunft (§ 20 AGG).", "Nur bei Behinderung und Alter; bei Religion, Geschlecht und sexueller Identität ist jede Ungleichbehandlung verboten (§ 20 AGG).", "Wenn für die Ungleichbehandlung wegen Religion, Behinderung, Alter, sexueller Identität oder Geschlecht ein sachlicher Grund vorliegt, z. B. Gefahrenvermeidung; nie wegen Rasse oder ethnischer Herkunft (§ 20 AGG)."], "richtig": 2, "erklaerung": "Wenn für die Ungleichbehandlung wegen Religion, Behinderung, Alter, sexueller Identität oder Geschlecht ein sachlicher Grund vorliegt, z. B. Gefahrenvermeidung; nie wegen Rasse oder ethnischer Herkunft (§ 20 AGG).", "schwierigkeit": "mittel"}, {"id": 524, "gesetz": "AGG", "frage": "#0524 Welche Beweislast gilt im AGG-Fall?", "antworten": ["Der Benachteiligte muss die Diskriminierung vollständig beweisen; eine Beweislastumkehr gibt es nicht (§ 22 AGG).", "Der Benachteiligte muss Indizien vorlegen, dann muss die Gegenseite das Gegenteil beweisen (§ 22 AGG).", "Immer der Arbeitgeber oder Anbieter, schon bei bloßer Behauptung der Benachteiligung (§ 22 AGG)."], "richtig": 1, "erklaerung": "Der Benachteiligte muss Indizien vorlegen, dann muss die Gegenseite das Gegenteil beweisen (§ 22 AGG).", "schwierigkeit": "schwer"}, {"id": 525, "gesetz": "AGG", "frage": "#0525 Wie lange kann man Ansprüche wegen Diskriminierung geltend machen?", "antworten": ["Schriftlich innerhalb von zwei Monaten; bei Bewerbungen ab Zugang der Ablehnung, sonst ab Kenntnis der Benachteiligung (§ 15 Abs. 4 AGG).", "Innerhalb von drei Jahren ab dem Ende des Jahres, in dem der Anspruch entstand (§ 195 BGB).", "Innerhalb von sechs Monaten, mündlich beim Arbeitgeber (§ 15 Abs. 4 AGG)."], "richtig": 0, "erklaerung": "Schriftlich innerhalb von zwei Monaten; bei Bewerbungen ab Zugang der Ablehnung, sonst ab Kenntnis der Benachteiligung (§ 15 Abs. 4 AGG).", "schwierigkeit": "leicht"}, {"id": 526, "gesetz": "AGG", "frage": "#0526 Welche Aufgaben hat die Antidiskriminierungsstelle des Bundes?", "antworten": ["Kontrolle der Personalakten und Überwachung der Einstellungsverfahren in Betrieben (§ 27 AGG).", "Beratung, Aufklärung und Vermittlung bei Diskriminierungsfällen (§ 27 AGG).", "Verhängung von Bußgeldern und Entscheidung über Schadensersatzansprüche (§ 27 AGG)."], "richtig": 1, "erklaerung": "Beratung, Aufklärung und Vermittlung bei Diskriminierungsfällen (§ 27 AGG).", "schwierigkeit": "mittel"}, {"id": 527, "gesetz": "AGG", "frage": "#0527 Kann die Antidiskriminierungsstelle Unternehmen bestrafen?", "antworten": ["Nein, sie kann nur Empfehlungen aussprechen und beraten (§ 27 AGG).", "Ja, sie kann Betrieben die Gewerbeerlaubnis entziehen (§ 27 AGG).", "Ja, sie kann Bußgelder bis zu 10.000 € verhängen (§ 27 AGG)."], "richtig": 0, "erklaerung": "Nein, sie kann nur Empfehlungen aussprechen und beraten (§ 27 AGG).", "schwierigkeit": "schwer"}, {"id": 528, "gesetz": "AGG", "frage": "#0528 Welche Unterstützung können Betroffene bei der Antidiskriminierungsstelle erhalten?", "antworten": ["Übernahme der Anwaltskosten und Zahlung des Schadensersatzes (§ 27 Abs. 2 AGG).", "Direkte Weisung an den Arbeitgeber, die Kündigung zurückzunehmen (§ 27 Abs. 2 AGG).", "Information über Rechte, Vermittlung zwischen den Parteien (§ 27 Abs. 2 AGG)."], "richtig": 2, "erklaerung": "Information über Rechte, Vermittlung zwischen den Parteien (§ 27 Abs. 2 AGG).", "schwierigkeit": "leicht"}, {"id": 529, "gesetz": "AGG", "frage": "#0529 Welche Organisationen dürfen Betroffene in AGG-Verfahren unterstützen?", "antworten": ["Ausschließlich die Industrie- und Handelskammer sowie die Handwerkskammer (§ 23 AGG).", "Antidiskriminierungsverbände als Beistände (§ 23 AGG); bei groben Verstößen des Arbeitgebers können Betriebsrat oder eine im Betrieb vertretene Gewerkschaft gerichtlich vorgehen (§ 17 Abs. 2 AGG).", "Nur Rechtsanwälte; Verbände, Betriebsrat und Gewerkschaften dürfen nicht unterstützen (§ 23 AGG)."], "richtig": 1, "erklaerung": "Antidiskriminierungsverbände als Beistände (§ 23 AGG); bei groben Verstößen des Arbeitgebers können Betriebsrat oder eine im Betrieb vertretene Gewerkschaft gerichtlich vorgehen (§ 17 Abs. 2 AGG).", "schwierigkeit": "mittel"}, {"id": 530, "gesetz": "AGG", "frage": "#0530 Wie oft erstellt die Antidiskriminierungsstelle Berichte zum Stand der Gleichbehandlung?", "antworten": ["Alle vier Jahre (§ 27 Abs. 4 AGG).", "Jedes Jahr, gegenüber dem Bundesrat (§ 27 Abs. 4 AGG).", "Alle zwei Jahre, gegenüber dem Bundestag (§ 27 Abs. 4 AGG)."], "richtig": 0, "erklaerung": "Alle vier Jahre (§ 27 Abs. 4 AGG).", "schwierigkeit": "schwer"}, {"id": 551, "gesetz": "ArbSchG", "frage": "#0551 Welche Arbeitsschutzmaßnahmen müssen Taxiunternehmen treffen?", "antworten": ["Der Unternehmer muss die Fahrer regelmäßig von der Berufsgenossenschaft auf ihre Fahreignung testen lassen (§ 3 ArbSchG).", "Arbeitgeber müssen Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Fahrer ergreifen (§ 3 ArbSchG).", "Nur die Fahrer selbst sind für ihre Sicherheit verantwortlich; der Arbeitgeber muss nichts veranlassen (§ 15 ArbSchG)."], "richtig": 1, "erklaerung": "Arbeitgeber müssen Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Fahrer ergreifen (§ 3 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 552, "gesetz": "ArbSchG", "frage": "#0552 Sind Taxifahrer verpflichtet, Sicherheitsunterweisungen zu absolvieren?", "antworten": ["Ja, der Arbeitgeber muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG).", "Ja, die Unterweisung führt einmal jährlich die IHK durch (§ 12 ArbSchG).", "Nein, Unterweisungen sind nur für Beschäftigte in Produktionsbetrieben vorgeschrieben (§ 12 ArbSchG)."], "richtig": 0, "erklaerung": "Ja, der Arbeitgeber muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 553, "gesetz": "ArbSchG", "frage": "#0553 Welche Rolle spielt der Arbeitsschutz für selbstständige Mietwagenfahrer?", "antworten": ["Es gilt nur für Selbstständige mit eigenem Fahrzeug; angestellte Fahrer fallen unter die DGUV (§ 1 ArbSchG).", "Das ArbSchG gilt auch für Selbstständige, die für ihre eigene Sicherheit haften (§ 2 ArbSchG).", "Das ArbSchG gilt nur für Beschäftigte, nicht für Selbstständige, doch sie sollten sich an die Grundsätze des Arbeitsschutzes halten (§ 1 ArbSchG)."], "richtig": 2, "erklaerung": "Das ArbSchG gilt nur für Beschäftigte, nicht für Selbstständige, doch sie sollten sich an die Grundsätze des Arbeitsschutzes halten (§ 1 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 554, "gesetz": "ArbSchG", "frage": "#0554 Muss ein Taxiunternehmen eine Gefährdungsbeurteilung durchführen?", "antworten": ["Nein, die Gefährdungsbeurteilung ist nur für Betriebe mit mehr als 50 Beschäftigten vorgeschrieben (§ 5 ArbSchG).", "Nein, das übernimmt die Berufsgenossenschaft für jeden Betrieb von Amts wegen (§ 5 ArbSchG).", "Ja, jeder Arbeitgeber ist verpflichtet, die Arbeitsbedingungen zu beurteilen und Maßnahmen zu ergreifen (§ 5 ArbSchG)."], "richtig": 2, "erklaerung": "Ja, jeder Arbeitgeber ist verpflichtet, die Arbeitsbedingungen zu beurteilen und Maßnahmen zu ergreifen (§ 5 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 555, "gesetz": "ArbSchG", "frage": "#0555 Sind Taxis mit Erste-Hilfe-Ausrüstung auszustatten?", "antworten": ["Nein, Taxis benötigen keinen Verbandkasten, da im Notfall der Notruf genügt (§ 10 ArbSchG).", "Ja, ein Verbandkasten und ein Feuerlöscher sind in jedem Taxi Pflicht (§ 35h StVZO, § 10 ArbSchG).", "Ja, jedes Taxi muss einen Verbandkasten mitführen (§ 35h StVZO); zudem muss der Arbeitgeber für Erste Hilfe sorgen (§ 10 ArbSchG)."], "richtig": 2, "erklaerung": "Ja, jedes Taxi muss einen Verbandkasten mitführen (§ 35h StVZO); zudem muss der Arbeitgeber für Erste Hilfe sorgen (§ 10 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 556, "gesetz": "ArbSchG", "frage": "#0556 Was ist das Ziel des Arbeitsschutzgesetzes (ArbSchG)?", "antworten": ["Die Verbesserung der Sicherheit und des Gesundheitsschutzes der Beschäftigten bei der Arbeit (§ 1 ArbSchG).", "Die Regelung der Höchstarbeitszeit und der Ruhepausen der Beschäftigten (§ 1 ArbSchG).", "Die Sicherung der Arbeitsplätze und den Schutz vor Kündigungen aus gesundheitlichen Gründen (§ 1 ArbSchG)."], "richtig": 0, "erklaerung": "Die Verbesserung der Sicherheit und des Gesundheitsschutzes der Beschäftigten bei der Arbeit (§ 1 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 557, "gesetz": "ArbSchG", "frage": "#0557 Für wen gilt das ArbSchG?", "antworten": ["Nur für Beschäftigte in der Produktion und auf Baustellen; Dienstleistungsbetriebe sind ausgenommen (§ 1 ArbSchG).", "Nur für Arbeitnehmer in Betrieben mit mehr als zehn Beschäftigten (§ 2 ArbSchG).", "Für alle Beschäftigten (§ 2 Abs. 2 ArbSchG); ausgenommen sind Hausangestellte in privaten Haushalten sowie – soweit Sondervorschriften bestehen – Seeschiffe und Bergbau (§ 1 Abs. 2 ArbSchG)."], "richtig": 2, "erklaerung": "Für alle Beschäftigten (§ 2 Abs. 2 ArbSchG); ausgenommen sind Hausangestellte in privaten Haushalten sowie – soweit Sondervorschriften bestehen – Seeschiffe und Bergbau (§ 1 Abs. 2 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 558, "gesetz": "ArbSchG", "frage": "#0558 Welche Verpflichtungen haben Arbeitgeber im Arbeitsschutz?", "antworten": ["Sie müssen Gesundheitsschäden nur ersetzen, wenn Beschäftigte nachweisen, dass der Betrieb schuld war (§ 3 ArbSchG).", "Sie müssen Schutzmaßnahmen nur treffen, wenn die Aufsichtsbehörde dies im Einzelfall anordnet (§ 22 ArbSchG).", "Sie müssen alle erforderlichen Maßnahmen zum Schutz der Gesundheit und Sicherheit der Beschäftigten treffen (§ 3 ArbSchG)."], "richtig": 2, "erklaerung": "Sie müssen alle erforderlichen Maßnahmen zum Schutz der Gesundheit und Sicherheit der Beschäftigten treffen (§ 3 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 559, "gesetz": "ArbSchG", "frage": "#0559 Welche Grundsätze sind bei Arbeitsschutzmaßnahmen zu beachten?", "antworten": ["Gefahren sind vorrangig durch persönliche Schutzausrüstung zu bekämpfen; technische Maßnahmen sind nachrangig (§ 4 ArbSchG).", "Gefahren müssen vermieden oder minimiert, Arbeitsbedingungen sicher gestaltet und der Stand der Technik berücksichtigt werden (§ 4 ArbSchG).", "Es genügt der im Betrieb übliche Standard; neuere arbeitsmedizinische Erkenntnisse bleiben außer Betracht (§ 4 ArbSchG)."], "richtig": 1, "erklaerung": "Gefahren müssen vermieden oder minimiert, Arbeitsbedingungen sicher gestaltet und der Stand der Technik berücksichtigt werden (§ 4 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 560, "gesetz": "ArbSchG", "frage": "#0560 Was sind arbeitsbedingte Gefährdungen laut ArbSchG?", "antworten": ["U. a. Gestaltung des Arbeitsplatzes, physikalische, chemische und biologische Einwirkungen, Arbeitsmittel, Arbeitsabläufe und -zeit sowie psychische Belastungen (§ 5 Abs. 3 ArbSchG).", "Allein Unfälle auf der Fahrt und Verkehrsstörungen (§ 5 ArbSchG).", "Nur körperliche Belastungen wie Lärm und Heben; psychische Belastungen zählen nicht (§ 5 Abs. 3 ArbSchG)."], "richtig": 0, "erklaerung": "U. a. Gestaltung des Arbeitsplatzes, physikalische, chemische und biologische Einwirkungen, Arbeitsmittel, Arbeitsabläufe und -zeit sowie psychische Belastungen (§ 5 Abs. 3 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 561, "gesetz": "ArbSchG", "frage": "#0561 Was ist eine Gefährdungsbeurteilung?", "antworten": ["Die Bewertung der Fahrer durch Fahrgäste und Vorgesetzte zur Leistungsbeurteilung (§ 5 ArbSchG).", "Die ärztliche Untersuchung jedes Beschäftigten zur Feststellung der Arbeitstauglichkeit (§ 11 ArbSchG).", "Die systematische Analyse der Arbeitsbedingungen, um Risiken für Beschäftigte zu erkennen und Maßnahmen abzuleiten (§ 5 ArbSchG)."], "richtig": 2, "erklaerung": "Die systematische Analyse der Arbeitsbedingungen, um Risiken für Beschäftigte zu erkennen und Maßnahmen abzuleiten (§ 5 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 562, "gesetz": "ArbSchG", "frage": "#0562 Welche Dokumentationspflichten hat der Arbeitgeber im Arbeitsschutz?", "antworten": ["Er muss sämtliche Arbeitszeiten und Gehälter der Beschäftigten monatlich der Berufsgenossenschaft melden (§ 6 ArbSchG).", "Er muss die Ergebnisse der Gefährdungsbeurteilung und ergriffene Maßnahmen dokumentieren (§ 6 ArbSchG).", "Er muss die Unterlagen nur auf Verlangen der Behörde erstellen; eine eigene Dokumentationspflicht besteht nicht (§ 6 ArbSchG)."], "richtig": 1, "erklaerung": "Er muss die Ergebnisse der Gefährdungsbeurteilung und ergriffene Maßnahmen dokumentieren (§ 6 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 563, "gesetz": "ArbSchG", "frage": "#0563 Welche Maßnahmen muss ein Arbeitgeber bei besonderen Gefahren treffen?", "antworten": ["Nur geschulte Beschäftigte dürfen in besonders gefährlichen Bereichen arbeiten (§ 9 ArbSchG).", "Die Tätigkeit ist nur mit schriftlicher Genehmigung der Polizei zulässig (§ 9 ArbSchG).", "Er muss gefährliche Bereiche abschließen und darf sie niemandem zugänglich machen, auch nicht geschulten Beschäftigten (§ 9 ArbSchG)."], "richtig": 0, "erklaerung": "Nur geschulte Beschäftigte dürfen in besonders gefährlichen Bereichen arbeiten (§ 9 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 564, "gesetz": "ArbSchG", "frage": "#0564 Wann ist eine arbeitsmedizinische Vorsorge notwendig?", "antworten": ["Nur bei Beschäftigten über 50 Jahren, und zwar auf Kosten der Beschäftigten (§ 11 ArbSchG).", "Auf Wunsch der Beschäftigten muss der Arbeitgeber regelmäßige Untersuchungen ermöglichen, außer laut Gefährdungsbeurteilung ist kein Gesundheitsschaden zu erwarten (§ 11 ArbSchG); Pflichtvorsorge regelt die ArbMedVV.", "Immer als Pflichtuntersuchung für alle Beschäftigten einmal jährlich, unabhängig von der Tätigkeit (§ 11 ArbSchG)."], "richtig": 1, "erklaerung": "Auf Wunsch der Beschäftigten muss der Arbeitgeber regelmäßige Untersuchungen ermöglichen, außer laut Gefährdungsbeurteilung ist kein Gesundheitsschaden zu erwarten (§ 11 ArbSchG); Pflichtvorsorge regelt die ArbMedVV.", "schwierigkeit": "mittel"}, {"id": 565, "gesetz": "ArbSchG", "frage": "#0565 Welche Aufgaben hat der Arbeitgeber in Notfallsituationen?", "antworten": ["Er muss einen Katastrophenschutzplan bei der Gemeinde einreichen und genehmigen lassen (§ 10 ArbSchG).", "Er muss lediglich den Rettungsdienst benachrichtigen; Brandbekämpfung und Evakuierung übernimmt die Feuerwehr (§ 10 ArbSchG).", "Er muss Maßnahmen zur Ersten Hilfe, Brandbekämpfung und Evakuierung sicherstellen (§ 10 ArbSchG)."], "richtig": 2, "erklaerung": "Er muss Maßnahmen zur Ersten Hilfe, Brandbekämpfung und Evakuierung sicherstellen (§ 10 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 566, "gesetz": "ArbSchG", "frage": "#0566 Welche Pflichten haben Arbeitnehmer im Arbeitsschutz?", "antworten": ["Sie müssen Schutzausrüstung auf eigene Kosten beschaffen und eigene Gefährdungsbeurteilungen erstellen (§ 15 ArbSchG).", "Sie müssen Sicherheitsvorschriften einhalten und Arbeitsmittel bestimmungsgemäß verwenden (§ 15 ArbSchG).", "Sie müssen Sicherheitsmaßnahmen nur beachten, wenn der Arbeitgeber sie persönlich überwacht (§ 15 ArbSchG)."], "richtig": 1, "erklaerung": "Sie müssen Sicherheitsvorschriften einhalten und Arbeitsmittel bestimmungsgemäß verwenden (§ 15 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 567, "gesetz": "ArbSchG", "frage": "#0567 Wann dürfen Arbeitnehmer eine Arbeit verweigern?", "antworten": ["Bei jeder möglichen Gefährdung, auch einer geringen, dürfen sie die Arbeit einstellen und trotzdem Lohn verlangen (§ 9 Abs. 3 ArbSchG).", "Nur nach vorheriger Genehmigung der Arbeitsschutzbehörde (§ 22 ArbSchG).", "Bei unmittelbarer erheblicher Gefahr dürfen sie sich durch sofortiges Verlassen des Arbeitsplatzes in Sicherheit bringen, ohne Nachteile zu erleiden (§ 9 Abs. 3 ArbSchG)."], "richtig": 2, "erklaerung": "Bei unmittelbarer erheblicher Gefahr dürfen sie sich durch sofortiges Verlassen des Arbeitsplatzes in Sicherheit bringen, ohne Nachteile zu erleiden (§ 9 Abs. 3 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 568, "gesetz": "ArbSchG", "frage": "#0568 Müssen Beschäftigte Sicherheitsmängel melden?", "antworten": ["Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG).", "Nein, sie dürfen Mängel nur der Berufsgenossenschaft melden, nicht dem Arbeitgeber (§ 16 ArbSchG).", "Nein, die Meldung ist freiwillig; nur Betriebsratsmitglieder trifft eine Pflicht (§ 16 ArbSchG)."], "richtig": 0, "erklaerung": "Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 569, "gesetz": "ArbSchG", "frage": "#0569 Welche Rechte haben Arbeitnehmer bei Arbeitsschutzverstößen?", "antworten": ["Sie dürfen den Arbeitsplatz sofort ohne Kündigung verlassen und Schadensersatz fordern (§ 17 ArbSchG).", "Sie können sich bei Verdacht auf unzureichende Schutzmaßnahmen an die zuständige Behörde wenden (§ 17 ArbSchG).", "Sie müssen sich zuerst an den Betriebsrat wenden; eine Beschwerde bei Behörden ist ihnen verboten (§ 17 ArbSchG)."], "richtig": 1, "erklaerung": "Sie können sich bei Verdacht auf unzureichende Schutzmaßnahmen an die zuständige Behörde wenden (§ 17 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 570, "gesetz": "ArbSchG", "frage": "#0570 Wie oft müssen Beschäftigte unterwiesen werden?", "antworten": ["Alle fünf Jahre durch einen externen Sicherheitsbeauftragten (§ 12 ArbSchG).", "Nur bei der Einstellung; weitere Unterweisungen sind nicht vorgesehen (§ 12 ArbSchG).", "Bei Einstellung, bei Veränderungen im Aufgabenbereich oder neuen Arbeitsmitteln vor Tätigkeitsbeginn und erforderlichenfalls regelmäßig (§ 12 ArbSchG); nach DGUV Vorschrift 1 mindestens einmal jährlich."], "richtig": 2, "erklaerung": "Bei Einstellung, bei Veränderungen im Aufgabenbereich oder neuen Arbeitsmitteln vor Tätigkeitsbeginn und erforderlichenfalls regelmäßig (§ 12 ArbSchG); nach DGUV Vorschrift 1 mindestens einmal jährlich.", "schwierigkeit": "mittel"}, {"id": 571, "gesetz": "ArbSchG", "frage": "#0571 Welche Behörden überwachen die Einhaltung des Arbeitsschutzgesetzes?", "antworten": ["Die Industrie- und Handelskammern als Selbstverwaltung der Wirtschaft (§ 21 ArbSchG).", "Die Bundesagentur für Arbeit in den örtlichen Arbeitsagenturen (§ 21 ArbSchG).", "Die zuständigen Arbeitsschutzbehörden der Länder (§ 21 ArbSchG)."], "richtig": 2, "erklaerung": "Die zuständigen Arbeitsschutzbehörden der Länder (§ 21 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 572, "gesetz": "ArbSchG", "frage": "#0572 Welche Konsequenzen drohen bei Verstößen gegen das ArbSchG?", "antworten": ["Geldbußen bis zu 30.000 € und in schweren Fällen Freiheitsstrafen bis zu einem Jahr (§ 25, § 26 ArbSchG).", "Ein Verwarnungsgeld von 55 € je Beschäftigtem; weitere Folgen gibt es nicht (§ 25 ArbSchG).", "Sofortiger Entzug der Gewerbeerlaubnis und lebenslange Sperre für den Unternehmer (§ 35 GewO)."], "richtig": 0, "erklaerung": "Geldbußen bis zu 30.000 € und in schweren Fällen Freiheitsstrafen bis zu einem Jahr (§ 25, § 26 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 573, "gesetz": "ArbSchG", "frage": "#0573 Welche Maßnahmen kann die Arbeitsschutzbehörde anordnen?", "antworten": ["Sie kann nur Empfehlungen aussprechen; verbindliche Anordnungen sind ihr verwehrt (§ 22 ArbSchG).", "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG).", "Sie kann Löhne festsetzen und Arbeitsverträge der Beschäftigten ändern (§ 22 ArbSchG)."], "richtig": 1, "erklaerung": "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 574, "gesetz": "ArbSchG", "frage": "#0574 Wie oft muss ein Betrieb im Rahmen des Arbeitsschutzes kontrolliert werden?", "antworten": ["Kontrollen finden nur auf Antrag des Arbeitgebers oder nach Unfällen statt (§ 21 ArbSchG).", "Eine feste Frist je Betrieb gibt es nicht; seit 2026 müssen die Länder jährlich mindestens 5 % der Betriebe besichtigen, ausgewählt nach Gefährdungspotenzial (§ 21 Abs. 1 ArbSchG).", "Jeder Betrieb muss mindestens alle fünf Jahre kontrolliert werden; die Länder bestimmen nur den Zeitpunkt (§ 21 ArbSchG)."], "richtig": 1, "erklaerung": "Eine feste Frist je Betrieb gibt es nicht; seit 2026 müssen die Länder jährlich mindestens 5 % der Betriebe besichtigen, ausgewählt nach Gefährdungspotenzial (§ 21 Abs. 1 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 575, "gesetz": "ArbSchG", "frage": "#0575 Wann können Beschäftigte eine Beschwerde bei der Arbeitsschutzbehörde einreichen?", "antworten": ["Wenn sie der Meinung sind, dass der Arbeitgeber nicht ausreichende Maßnahmen zum Schutz ihrer Gesundheit trifft (§ 17 ArbSchG).", "Nur, wenn mindestens die Hälfte der Belegschaft die Beschwerde unterstützt (§ 17 ArbSchG).", "Nur nach vorheriger Kündigung und mit Zustimmung des Betriebsrats (§ 17 ArbSchG)."], "richtig": 0, "erklaerung": "Wenn sie der Meinung sind, dass der Arbeitgeber nicht ausreichende Maßnahmen zum Schutz ihrer Gesundheit trifft (§ 17 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 576, "gesetz": "ArbSchG", "frage": "#0576 Welche besonderen Schutzmaßnahmen gelten für Nachtarbeit?", "antworten": ["Nachtarbeit ist nur mit Zustimmung des Betriebsrats zulässig und auf höchstens 12 Nächte je Quartal begrenzt (§ 6 ArbZG).", "Nachtarbeit ist arbeitswissenschaftlich zu gestalten, höchstens 8 (10) Stunden, mit Anspruch auf arbeitsmedizinische Untersuchung und ggf. Tagesarbeitsplatz (§ 6 ArbZG); Risiken sind in der Gefährdungsbeurteilung zu erfassen (§ 5 ArbSchG).", "Nachtarbeitnehmer dürfen höchstens 6 Stunden arbeiten und erhalten einen gesetzlichen Zuschlag von 50 % (§ 6 ArbZG)."], "richtig": 1, "erklaerung": "Nachtarbeit ist arbeitswissenschaftlich zu gestalten, höchstens 8 (10) Stunden, mit Anspruch auf arbeitsmedizinische Untersuchung und ggf. Tagesarbeitsplatz (§ 6 ArbZG); Risiken sind in der Gefährdungsbeurteilung zu erfassen (§ 5 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 577, "gesetz": "ArbSchG", "frage": "#0577 Welche Regelungen gelten für Beschäftigte mit besonderen Risiken?", "antworten": ["Besondere Regeln gibt es nicht; Schwangere, Jugendliche und Schwerbehinderte werden wie alle Beschäftigten behandelt (§ 4 ArbSchG).", "Spezielle Gefahren für besonders schutzbedürftige Gruppen sind zu berücksichtigen (§ 4 Nr. 6 ArbSchG); konkrete Regeln für Schwangere, Jugendliche und Schwerbehinderte enthalten MuSchG, JArbSchG und SGB IX.", "Besonders gefährdete Beschäftigte sind von allen Arbeitsplätzen mit Gefahren auszuschließen, Ausnahmen genehmigt das Gewerbeaufsichtsamt (§ 5 ArbSchG)."], "richtig": 1, "erklaerung": "Spezielle Gefahren für besonders schutzbedürftige Gruppen sind zu berücksichtigen (§ 4 Nr. 6 ArbSchG); konkrete Regeln für Schwangere, Jugendliche und Schwerbehinderte enthalten MuSchG, JArbSchG und SGB IX.", "schwierigkeit": "schwer"}, {"id": 578, "gesetz": "ArbSchG", "frage": "#0578 Wann darf von den Regelungen des ArbSchG abgewichen werden?", "antworten": ["Wenn durch Verordnungen spezielle Regelungen für bestimmte Berufe oder Tätigkeiten getroffen werden (§ 18 ArbSchG).", "Wenn Beschäftigte schriftlich auf den Arbeitsschutz verzichten (§ 15 ArbSchG).", "Wenn der Arbeitgeber und der Betriebsrat dies in einer Betriebsvereinbarung beschließen (§ 18 ArbSchG)."], "richtig": 0, "erklaerung": "Wenn durch Verordnungen spezielle Regelungen für bestimmte Berufe oder Tätigkeiten getroffen werden (§ 18 ArbSchG).", "schwierigkeit": "leicht"}, {"id": 579, "gesetz": "ArbSchG", "frage": "#0579 Wie werden arbeitsschutzrechtliche Maßnahmen europaweit geregelt?", "antworten": ["Durch Empfehlungen der EU-Kommission, die für Betriebe freiwillig bleiben (§ 19 ArbSchG).", "Durch EU-Richtlinien, die in nationales Recht umgesetzt werden (§ 19 ArbSchG).", "Durch einen internationalen Vertrag der Vereinten Nationen, der Deutschland unmittelbar bindet (§ 19 ArbSchG)."], "richtig": 1, "erklaerung": "Durch EU-Richtlinien, die in nationales Recht umgesetzt werden (§ 19 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 580, "gesetz": "ArbSchG", "frage": "#0580 Was ist die Gemeinsame Deutsche Arbeitsschutzstrategie?", "antworten": ["Eine Zusammenarbeit zwischen Bund, Ländern und Unfallversicherungsträgern zur Verbesserung des Arbeitsschutzes (§ 20a ArbSchG).", "Ein Zusammenschluss der Arbeitgeberverbände und Gewerkschaften zur Tarifpolitik (§ 20a ArbSchG).", "Ein Förderprogramm der EU für den Kauf besonders sicherer Arbeitsmittel (§ 20a ArbSchG)."], "richtig": 0, "erklaerung": "Eine Zusammenarbeit zwischen Bund, Ländern und Unfallversicherungsträgern zur Verbesserung des Arbeitsschutzes (§ 20a ArbSchG).", "schwierigkeit": "schwer"}, {"id": 601, "gesetz": "ASiG", "frage": "#0601 Muss ein Taxiunternehmen eine Fachkraft für Arbeitssicherheit bestellen?", "antworten": ["Ja, aber nur, wenn der Betriebsrat dies ausdrücklich verlangt (§ 9 ASiG).", "Ja, soweit erforderlich nach Betriebsart, Beschäftigtenzahl und Gefährdungen; konkretisiert durch DGUV Vorschrift 2, Betreuung ab dem ersten Arbeitnehmer (§ 5 ASiG).", "Nein, erst ab 100 Beschäftigten; kleinere Betriebe sind generell ausgenommen (§ 5 ASiG)."], "richtig": 1, "erklaerung": "Ja, soweit erforderlich nach Betriebsart, Beschäftigtenzahl und Gefährdungen; konkretisiert durch DGUV Vorschrift 2, Betreuung ab dem ersten Arbeitnehmer (§ 5 ASiG).", "schwierigkeit": "leicht"}, {"id": 602, "gesetz": "ASiG", "frage": "#0602 Welche Rolle spielen Betriebsärzte in Taxi- und Mietwagenbetrieben?", "antworten": ["Sie vertreten das Unternehmen gegenüber der Berufsgenossenschaft und erstellen allein die Gefährdungsbeurteilung (§ 3 ASiG).", "Sie überwachen die Lenk- und Ruhezeiten der Fahrer und werten die Fahrerkarten aus (§ 3 ASiG).", "Sie beraten das Unternehmen in Gesundheitsfragen und führen Vorsorgeuntersuchungen für Fahrer durch (§ 3 ASiG)."], "richtig": 2, "erklaerung": "Sie beraten das Unternehmen in Gesundheitsfragen und führen Vorsorgeuntersuchungen für Fahrer durch (§ 3 ASiG).", "schwierigkeit": "mittel"}, {"id": 603, "gesetz": "ASiG", "frage": "#0603 Welche Gefährdungen für Taxifahrer müssen bei der Arbeitssicherheit berücksichtigt werden?", "antworten": ["Risiken durch lange Sitzzeiten, Unfallgefahr, Überfälle und Stress; sie sind in der Gefährdungsbeurteilung zu ermitteln (§ 5 ArbSchG).", "Gefahren müssen nicht erfasst werden, solange die Fahrer die StVO beachten, da das Verkehrsrecht Vorrang hat (§ 5 ArbSchG).", "Allein Risiken durch Fahrzeugdefekte; psychische Belastungen und Überfälle sind nicht zu erfassen (§ 5 ArbSchG)."], "richtig": 0, "erklaerung": "Risiken durch lange Sitzzeiten, Unfallgefahr, Überfälle und Stress; sie sind in der Gefährdungsbeurteilung zu ermitteln (§ 5 ArbSchG).", "schwierigkeit": "schwer"}, {"id": 604, "gesetz": "ASiG", "frage": "#0604 Darf ein Taxiunternehmen Sicherheitsingenieure einsetzen?", "antworten": ["Ja, jederzeit; soweit erforderlich, muss er Fachkräfte für Arbeitssicherheit (z. B. Sicherheitsingenieure) sogar schriftlich bestellen (§ 5 ASiG).", "Nein, nur Betriebe mit Betriebsrat dürfen Sicherheitsingenieure einsetzen (§ 5 ASiG).", "Nein, die Bestellung ist ausschließlich über die Berufsgenossenschaft möglich; eigene Fachkräfte sind verboten (§ 19 ASiG)."], "richtig": 0, "erklaerung": "Ja, jederzeit; soweit erforderlich, muss er Fachkräfte für Arbeitssicherheit (z. B. Sicherheitsingenieure) sogar schriftlich bestellen (§ 5 ASiG).", "schwierigkeit": "leicht"}, {"id": 605, "gesetz": "ASiG", "frage": "#0605 Welche Pflicht hat ein Taxiunternehmer bezüglich der Arbeitsumgebung seiner Fahrer?", "antworten": ["Er muss nur die Verkehrssicherheit des Fahrzeugs gewährleisten; Sitz und Arbeitsumgebung sind Sache des Fahrers (§ 30 StVZO).", "Er muss die Arbeit so gestalten, dass Gefährdungen für Leben und Gesundheit vermieden bzw. gering gehalten werden, auch ergonomisch (§§ 3, 4 ArbSchG).", "Er muss ergonomische Maßnahmen nur auf ärztliche Anordnung ergreifen (§ 11 ArbSchG)."], "richtig": 1, "erklaerung": "Er muss die Arbeit so gestalten, dass Gefährdungen für Leben und Gesundheit vermieden bzw. gering gehalten werden, auch ergonomisch (§§ 3, 4 ArbSchG).", "schwierigkeit": "mittel"}, {"id": 606, "gesetz": "ASiG", "frage": "#0606 Was ist das Ziel des Arbeitssicherheitsgesetzes (ASiG)?", "antworten": ["Die Verbesserung des Arbeitsschutzes und der Unfallverhütung in Betrieben (§ 1 ASiG).", "Die Anerkennung von Betriebsärzten und Sicherheitsfachkräften durch die Industrie- und Handelskammern (§ 1 ASiG).", "Die Regelung der Haftung des Arbeitgebers bei Arbeitsunfällen und Berufskrankheiten (§ 1 ASiG)."], "richtig": 0, "erklaerung": "Die Verbesserung des Arbeitsschutzes und der Unfallverhütung in Betrieben (§ 1 ASiG).", "schwierigkeit": "schwer"}, {"id": 607, "gesetz": "ASiG", "frage": "#0607 Welche Betriebe müssen Betriebsärzte und Fachkräfte für Arbeitssicherheit bestellen?", "antworten": ["Nur Betriebe mit mehr als 500 Beschäftigten (§ 2 ASiG).", "Nur Betriebe des produzierenden Gewerbes und der Bauwirtschaft (§ 5 ASiG).", "Alle Betriebe mit Arbeitnehmern, soweit es nach Betriebsart, Beschäftigtenzahl und Organisation erforderlich ist (§§ 2, 5 ASiG)."], "richtig": 2, "erklaerung": "Alle Betriebe mit Arbeitnehmern, soweit es nach Betriebsart, Beschäftigtenzahl und Organisation erforderlich ist (§§ 2, 5 ASiG).", "schwierigkeit": "leicht"}, {"id": 608, "gesetz": "ASiG", "frage": "#0608 Welche Aufgaben haben Betriebsärzte nach dem ASiG?", "antworten": ["Ausstellung von Krankmeldungen und Entscheidung über die Kündigung erkrankter Beschäftigter (§ 3 ASiG).", "Beratung des Arbeitgebers, Durchführung von arbeitsmedizinischen Untersuchungen und Beobachtung des Arbeitsschutzes (§ 3 ASiG).", "Kontrolle der Arbeitszeiten und Überwachung der Fahrtenschreiber (§ 3 ASiG)."], "richtig": 1, "erklaerung": "Beratung des Arbeitgebers, Durchführung von arbeitsmedizinischen Untersuchungen und Beobachtung des Arbeitsschutzes (§ 3 ASiG).", "schwierigkeit": "mittel"}, {"id": 609, "gesetz": "ASiG", "frage": "#0609 Was sind die Hauptaufgaben von Fachkräften für Arbeitssicherheit?", "antworten": ["Durchführung der Hauptuntersuchung an Fahrzeugen und Überwachung der Lenk- und Ruhezeiten (§ 6 ASiG).", "Beratung des Arbeitgebers in Sicherheitsfragen (auch bei der Gefährdungsbeurteilung), sicherheitstechnische Überprüfung und Begehung der Arbeitsstätten (§ 6 ASiG).", "Behandlung verletzter Beschäftigter und Ausstellung von Arbeitsunfähigkeitsbescheinigungen (§ 6 ASiG)."], "richtig": 1, "erklaerung": "Beratung des Arbeitgebers in Sicherheitsfragen (auch bei der Gefährdungsbeurteilung), sicherheitstechnische Überprüfung und Begehung der Arbeitsstätten (§ 6 ASiG).", "schwierigkeit": "schwer"}, {"id": 610, "gesetz": "ASiG", "frage": "#0610 Wie müssen Betriebsärzte und Fachkräfte für Arbeitssicherheit bestellt werden?", "antworten": ["Mündlich durch den Arbeitgeber; eine schriftliche Form ist nur bei Fachkräften vorgesehen (§ 5 ASiG).", "Durch die Berufsgenossenschaft von Amts wegen, ohne Mitwirkung des Arbeitgebers (§ 12 ASiG).", "Schriftlich durch den Arbeitgeber, ggf. mit Zustimmung des Betriebsrats (§§ 2, 5, 9 Abs. 3 ASiG)."], "richtig": 2, "erklaerung": "Schriftlich durch den Arbeitgeber, ggf. mit Zustimmung des Betriebsrats (§§ 2, 5, 9 Abs. 3 ASiG).", "schwierigkeit": "leicht"}, {"id": 611, "gesetz": "ASiG", "frage": "#0611 Welche arbeitsmedizinischen Maßnahmen führen Betriebsärzte durch?", "antworten": ["Behandlung von Arbeitsunfällen und Krankschreibung der Beschäftigten (§ 3 ASiG).", "Führung der Personalakten und Entscheidung über die Eignung von Bewerbern (§ 3 ASiG).", "Gesundheitsüberwachung, Vorsorgeuntersuchungen und Beratung von Beschäftigten (§ 3 ASiG)."], "richtig": 2, "erklaerung": "Gesundheitsüberwachung, Vorsorgeuntersuchungen und Beratung von Beschäftigten (§ 3 ASiG).", "schwierigkeit": "mittel"}, {"id": 612, "gesetz": "ASiG", "frage": "#0612 Müssen Betriebsärzte regelmäßige Betriebsbegehungen durchführen?", "antworten": ["Nein, Begehungen sind ausschließlich Aufgabe der Aufsichtsbehörde (§ 3 ASiG).", "Ja, um Gefahren zu identifizieren und geeignete Maßnahmen vorzuschlagen (§ 3 ASiG).", "Nein, nur auf Weisung des Arbeitgebers und höchstens einmal in fünf Jahren (§ 3 ASiG)."], "richtig": 1, "erklaerung": "Ja, um Gefahren zu identifizieren und geeignete Maßnahmen vorzuschlagen (§ 3 ASiG).", "schwierigkeit": "schwer"}, {"id": 613, "gesetz": "ASiG", "frage": "#0613 Dürfen Betriebsärzte Krankmeldungen überprüfen?", "antworten": ["Ja, auf Verlangen des Arbeitgebers, um unberechtigte Fehlzeiten festzustellen (§ 3 ASiG).", "Ja, sie müssen jede Krankmeldung ärztlich bestätigen (§ 3 Abs. 3 ASiG).", "Nein, dies gehört nicht zu ihren Aufgaben (§ 3 Abs. 3 ASiG)."], "richtig": 2, "erklaerung": "Nein, dies gehört nicht zu ihren Aufgaben (§ 3 Abs. 3 ASiG).", "schwierigkeit": "leicht"}, {"id": 614, "gesetz": "ASiG", "frage": "#0614 Was muss ein Betriebsarzt tun, wenn er Gesundheitsgefährdungen feststellt?", "antworten": ["Den Arbeitgeber informieren und Maßnahmen zur Gefahrenbeseitigung vorschlagen (§ 3 ASiG).", "Die Aufsichtsbehörde informieren, die ohne Rücksprache mit dem Arbeitgeber Maßnahmen anordnet (§ 12 ASiG).", "Den Beschäftigten krankschreiben und ihn bis zur Beseitigung der Gefährdung freistellen (§ 3 ASiG)."], "richtig": 0, "erklaerung": "Den Arbeitgeber informieren und Maßnahmen zur Gefahrenbeseitigung vorschlagen (§ 3 ASiG).", "schwierigkeit": "mittel"}, {"id": 615, "gesetz": "ASiG", "frage": "#0615 Welche Anforderungen muss ein Betriebsarzt erfüllen?", "antworten": ["Er muss Facharzt für Allgemeinmedizin mit mindestens fünf Jahren Berufserfahrung sein (§ 4 ASiG).", "Er muss berechtigt sein, den ärztlichen Beruf auszuüben und über arbeitsmedizinische Fachkunde verfügen (§ 4 ASiG).", "Er muss von der Berufsgenossenschaft zugelassen sein und darf nicht im Betrieb angestellt sein (§ 4 ASiG)."], "richtig": 1, "erklaerung": "Er muss berechtigt sein, den ärztlichen Beruf auszuüben und über arbeitsmedizinische Fachkunde verfügen (§ 4 ASiG).", "schwierigkeit": "schwer"}, {"id": 616, "gesetz": "ASiG", "frage": "#0616 Welche Hauptaufgaben haben Fachkräfte für Arbeitssicherheit?", "antworten": ["Beratung des Arbeitgebers und der Beschäftigten in Fragen des Arbeitsschutzes und der Unfallverhütung (§ 6 ASiG).", "Ahndung von Verstößen gegen Arbeitsschutzvorschriften und Erlass von Bußgeldbescheiden (§ 6 ASiG).", "Überwachung der Lenk- und Ruhezeiten sowie Führung der Fahrerakten (§ 6 ASiG)."], "richtig": 0, "erklaerung": "Beratung des Arbeitgebers und der Beschäftigten in Fragen des Arbeitsschutzes und der Unfallverhütung (§ 6 ASiG).", "schwierigkeit": "leicht"}, {"id": 617, "gesetz": "ASiG", "frage": "#0617 Müssen Fachkräfte für Arbeitssicherheit regelmäßig Betriebsanlagen überprüfen?", "antworten": ["Nein, die Überprüfung von Anlagen ist allein Aufgabe der Prüfer bei der Hauptuntersuchung (§ 6 ASiG).", "Nein, sie dürfen Betriebsanlagen nur auf Weisung der Aufsichtsbehörde prüfen (§ 12 ASiG).", "Ja, insbesondere vor der Inbetriebnahme neuer Arbeitsmittel (§ 6 ASiG)."], "richtig": 2, "erklaerung": "Ja, insbesondere vor der Inbetriebnahme neuer Arbeitsmittel (§ 6 ASiG).", "schwierigkeit": "mittel"}, {"id": 618, "gesetz": "ASiG", "frage": "#0618 Welche Maßnahmen können Fachkräfte für Arbeitssicherheit vorschlagen?", "antworten": ["Nur Maßnahmen, die für den Betrieb keinerlei Kosten verursachen (§ 6 ASiG).", "Technische, organisatorische und persönliche Schutzmaßnahmen (§ 6 ASiG).", "Nur persönliche Schutzmaßnahmen; technische und organisatorische Maßnahmen beschließt der Betriebsrat (§ 6 ASiG)."], "richtig": 1, "erklaerung": "Technische, organisatorische und persönliche Schutzmaßnahmen (§ 6 ASiG).", "schwierigkeit": "schwer"}, {"id": 619, "gesetz": "ASiG", "frage": "#0619 Welche Anforderungen müssen Fachkräfte für Arbeitssicherheit erfüllen?", "antworten": ["Sie müssen über eine sicherheitstechnische Fachkunde verfügen (§ 7 ASiG).", "Sie müssen Ärzte mit arbeitsmedizinischer Fachkunde sein (§ 4 ASiG).", "Sie müssen eine Meisterprüfung im Taxi- und Mietwagengewerbe nachweisen (§ 7 ASiG)."], "richtig": 0, "erklaerung": "Sie müssen über eine sicherheitstechnische Fachkunde verfügen (§ 7 ASiG).", "schwierigkeit": "leicht"}, {"id": 620, "gesetz": "ASiG", "frage": "#0620 Sind Fachkräfte für Arbeitssicherheit gegenüber dem Arbeitgeber weisungsfrei?", "antworten": ["Ja, sie müssen ihre Fachkunde unabhängig anwenden (§ 8 ASiG).", "Nein, sie sind bei der Anwendung ihrer Fachkunde an Weisungen des Arbeitgebers gebunden (§ 8 ASiG).", "Nein, sie unterstehen den Weisungen der Aufsichtsbehörde, nicht des Arbeitgebers (§ 12 ASiG)."], "richtig": 0, "erklaerung": "Ja, sie müssen ihre Fachkunde unabhängig anwenden (§ 8 ASiG).", "schwierigkeit": "mittel"}, {"id": 621, "gesetz": "ASiG", "frage": "#0621 Müssen Betriebsärzte und Fachkräfte für Arbeitssicherheit zusammenarbeiten?", "antworten": ["Ja, jedoch nur im Rahmen der jährlichen Betriebsversammlung (§ 10 ASiG).", "Ja, insbesondere durch gemeinsame Betriebsbegehungen (§ 10 ASiG).", "Nein, ihre Aufgabenbereiche sind getrennt; eine Zusammenarbeit ist nur bei Betrieben mit mehr als 500 Beschäftigten vorgesehen (§ 10 ASiG)."], "richtig": 1, "erklaerung": "Ja, insbesondere durch gemeinsame Betriebsbegehungen (§ 10 ASiG).", "schwierigkeit": "schwer"}, {"id": 622, "gesetz": "ASiG", "frage": "#0622 Was ist ein Arbeitsschutzausschuss?", "antworten": ["Ein Ausschuss in Betrieben mit mehr als 100 Beschäftigten, der über Löhne und Arbeitszeiten entscheidet (§ 11 ASiG).", "Ein Ausschuss in Betrieben mit mehr als 20 Beschäftigten, der sich mit Fragen des Arbeitsschutzes befasst (§ 11 ASiG).", "Eine Landesbehörde, die die Einhaltung des Arbeitsschutzes in den Betrieben kontrolliert (§ 12 ASiG)."], "richtig": 1, "erklaerung": "Ein Ausschuss in Betrieben mit mehr als 20 Beschäftigten, der sich mit Fragen des Arbeitsschutzes befasst (§ 11 ASiG).", "schwierigkeit": "leicht"}, {"id": 623, "gesetz": "ASiG", "frage": "#0623 Welche Aufgaben hat der Arbeitsschutzausschuss?", "antworten": ["Beratung über Arbeitsschutzmaßnahmen und Unfallverhütung (§ 11 ASiG).", "Kontrolle der Arbeitnehmer und Verhängung von Disziplinarmaßnahmen (§ 11 ASiG).", "Festlegung von Löhnen und Arbeitszeiten der Beschäftigten (§ 11 ASiG)."], "richtig": 0, "erklaerung": "Beratung über Arbeitsschutzmaßnahmen und Unfallverhütung (§ 11 ASiG).", "schwierigkeit": "mittel"}, {"id": 624, "gesetz": "ASiG", "frage": "#0624 Wer ist Mitglied des Arbeitsschutzausschusses?", "antworten": ["Betriebsratsmitglieder und Gewerkschaftssekretäre, jedoch ohne Beteiligung des Arbeitgebers (§ 11 ASiG).", "Arbeitgeber, Betriebsratsmitglieder, Betriebsärzte, Fachkräfte für Arbeitssicherheit und Sicherheitsbeauftragte (§ 11 ASiG).", "Arbeitgeber, Betriebsratsmitglieder, Vertreter der Berufsgenossenschaft und der Aufsichtsbehörde (§ 11 ASiG)."], "richtig": 1, "erklaerung": "Arbeitgeber, Betriebsratsmitglieder, Betriebsärzte, Fachkräfte für Arbeitssicherheit und Sicherheitsbeauftragte (§ 11 ASiG).", "schwierigkeit": "schwer"}, {"id": 625, "gesetz": "ASiG", "frage": "#0625 Wie oft muss der Arbeitsschutzausschuss tagen?", "antworten": ["Mindestens einmal pro Quartal (§ 11 ASiG).", "Nur bei Bedarf, wenn die Aufsichtsbehörde dies anordnet (§ 12 ASiG).", "Einmal jährlich, spätestens zum Jahresende (§ 11 ASiG)."], "richtig": 0, "erklaerung": "Mindestens einmal pro Quartal (§ 11 ASiG).", "schwierigkeit": "leicht"}, {"id": 626, "gesetz": "ASiG", "frage": "#0626 Welche Behörde ist für die Überwachung des ASiG zuständig?", "antworten": ["Die Industrie- und Handelskammer (§ 13 ASiG).", "Das Bundesamt für Güterverkehr (§ 12 ASiG).", "Die zuständige Arbeitsschutzbehörde (§ 12 ASiG)."], "richtig": 2, "erklaerung": "Die zuständige Arbeitsschutzbehörde (§ 12 ASiG).", "schwierigkeit": "mittel"}, {"id": 627, "gesetz": "ASiG", "frage": "#0627 Welche Maßnahmen kann die Behörde bei Verstößen gegen das ASiG ergreifen?", "antworten": ["Sie kann nur Empfehlungen aussprechen; Anordnungen darf allein die Berufsgenossenschaft treffen (§ 12 ASiG).", "Sie kann Fachkräfte selbst bestellen und deren Vergütung festsetzen (§ 12 ASiG).", "Sie kann Anordnungen treffen und Maßnahmen verlangen (§ 12 ASiG)."], "richtig": 2, "erklaerung": "Sie kann Anordnungen treffen und Maßnahmen verlangen (§ 12 ASiG).", "schwierigkeit": "schwer"}, {"id": 628, "gesetz": "ASiG", "frage": "#0628 Welche Rechte haben Arbeitsschutzbehörden?", "antworten": ["Sie dürfen Arbeitsstätten nur mit richterlicher Genehmigung und nach Voranmeldung betreten (§ 13 ASiG).", "Sie dürfen Auskünfte verlangen, Arbeitsstätten während der Betriebszeit betreten und besichtigen (§ 13 ASiG) sowie Anordnungen treffen (§ 12 ASiG).", "Sie dürfen Beschäftigte entlassen und Arbeitsverträge ändern (§ 12 ASiG)."], "richtig": 1, "erklaerung": "Sie dürfen Auskünfte verlangen, Arbeitsstätten während der Betriebszeit betreten und besichtigen (§ 13 ASiG) sowie Anordnungen treffen (§ 12 ASiG).", "schwierigkeit": "leicht"}, {"id": 629, "gesetz": "ASiG", "frage": "#0629 Welche Sanktionen drohen bei Verstößen gegen das ASiG?", "antworten": ["Bußgelder bis 100.000 € bei jeder unterlassenen Bestellung, zusätzlich Freiheitsstrafe bis zu einem Jahr (§ 20 ASiG).", "Verwarnungsgelder bis 55 €, mehr nicht (§ 20 ASiG).", "Bußgelder bis 25.000 € bei Verstoß gegen eine vollziehbare Anordnung, bis 500 € bei Auskunfts- oder Besichtigungsverstößen (§ 20 ASiG)."], "richtig": 2, "erklaerung": "Bußgelder bis 25.000 € bei Verstoß gegen eine vollziehbare Anordnung, bis 500 € bei Auskunfts- oder Besichtigungsverstößen (§ 20 ASiG).", "schwierigkeit": "mittel"}, {"id": 630, "gesetz": "ASiG", "frage": "#0630 Wie kann ein Arbeitgeber seine Pflicht zur Bestellung von Fachkräften für Arbeitssicherheit noch erfüllen?", "antworten": ["Er kann sie erfüllen, indem er die Aufgaben selbst ohne jede Qualifikation wahrnimmt (§ 19 ASiG).", "Er kann die Pflicht auf die Berufsgenossenschaft übertragen, die sie kostenlos übernimmt (§ 19 ASiG).", "Er kann die Pflicht auch erfüllen, indem er einen überbetrieblichen Dienst mit den Aufgaben beauftragt (§ 19 ASiG)."], "richtig": 2, "erklaerung": "Er kann die Pflicht auch erfüllen, indem er einen überbetrieblichen Dienst mit den Aufgaben beauftragt (§ 19 ASiG).", "schwierigkeit": "schwer"}, {"id": 651, "gesetz": "JArbSchG", "frage": "#0651 Dürfen Jugendliche als Taxifahrer arbeiten?", "antworten": ["Ja, ab 16 Jahren mit Zustimmung der Eltern und Fahrerlaubnis der Klasse B (§ 22 JArbSchG).", "Ja, ab 18 Jahren, sobald sie die Fahrerlaubnis der Klasse B besitzen (§ 48 Abs. 4 FeV).", "Nein, die Fahrerlaubnis zur Fahrgastbeförderung setzt das vollendete 21. Lebensjahr voraus (§ 48 Abs. 4 Nr. 2 FeV)."], "richtig": 2, "erklaerung": "Nein, die Fahrerlaubnis zur Fahrgastbeförderung setzt das vollendete 21. Lebensjahr voraus (§ 48 Abs. 4 Nr. 2 FeV).", "schwierigkeit": "leicht"}, {"id": 652, "gesetz": "JArbSchG", "frage": "#0652 Dürfen Jugendliche in einem Taxiunternehmen beschäftigt werden?", "antworten": ["Ja, auch als Fahrer, wenn ein erfahrener Fahrer sie dabei beaufsichtigt (§ 22 JArbSchG).", "Ja, aber nur für nicht fahrerbezogene Tätigkeiten, z. B. Büroarbeit oder Fahrzeugpflege (§ 22 JArbSchG).", "Nein, Jugendliche dürfen in Taxiunternehmen gar nicht beschäftigt werden (§ 22 JArbSchG)."], "richtig": 1, "erklaerung": "Ja, aber nur für nicht fahrerbezogene Tätigkeiten, z. B. Büroarbeit oder Fahrzeugpflege (§ 22 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 653, "gesetz": "JArbSchG", "frage": "#0653 Welche Arbeitszeiten gelten für Jugendliche in Taxiunternehmen?", "antworten": ["Maximal 8 Stunden täglich und 40 Stunden wöchentlich (§ 8 JArbSchG).", "Maximal 9 Stunden täglich und 45 Stunden wöchentlich, im Taxigewerbe 48 Stunden (§ 8 JArbSchG).", "Maximal 8 Stunden täglich, aber ohne Wochenobergrenze, wenn ein Ausgleichszeitraum besteht (§ 3 ArbZG)."], "richtig": 0, "erklaerung": "Maximal 8 Stunden täglich und 40 Stunden wöchentlich (§ 8 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 654, "gesetz": "JArbSchG", "frage": "#0654 Dürfen Jugendliche in einem Taxiunternehmen nachts arbeiten?", "antworten": ["Nein, Jugendliche dürfen in der Regel nicht zwischen 20:00 und 6:00 Uhr beschäftigt werden (§ 14 JArbSchG).", "Ja, bis 23:00 Uhr, wenn sie älter als 16 Jahre sind (§ 14 JArbSchG).", "Ja, wenn die Eltern schriftlich zustimmen, in beliebigem Umfang (§ 14 JArbSchG)."], "richtig": 0, "erklaerung": "Nein, Jugendliche dürfen in der Regel nicht zwischen 20:00 und 6:00 Uhr beschäftigt werden (§ 14 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 655, "gesetz": "JArbSchG", "frage": "#0655 Sind Jugendliche von der Samstags- und Sonntagsruhe ausgenommen?", "antworten": ["Samstagsarbeit ist im Verkehrswesen verboten, Sonntagsarbeit im Taxigewerbe mit Freistellung erlaubt (§§ 16, 17 JArbSchG).", "Ja, Jugendliche sind von beidem ausgenommen, wenn der Betrieb Verkehrsleistungen erbringt (§ 16 JArbSchG).", "Samstagsarbeit ist im Verkehrswesen zulässig, mit Freistellung an einem anderen Tag derselben Woche; Sonntagsarbeit ist im Taxigewerbe verboten (§§ 16, 17 JArbSchG)."], "richtig": 2, "erklaerung": "Samstagsarbeit ist im Verkehrswesen zulässig, mit Freistellung an einem anderen Tag derselben Woche; Sonntagsarbeit ist im Taxigewerbe verboten (§§ 16, 17 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 656, "gesetz": "JArbSchG", "frage": "#0656 Was ist das Ziel des Jugendarbeitsschutzgesetzes (JArbSchG)?", "antworten": ["Die Sicherung von Ausbildungsplätzen und die Förderung der Berufsausbildung (§ 1 JArbSchG).", "Der Schutz von Jugendlichen vor Überlastung und gesundheitlichen Schäden bei der Arbeit (§ 1 JArbSchG).", "Die Regelung der Vergütung und des Urlaubs von Auszubildenden (§ 1 JArbSchG)."], "richtig": 1, "erklaerung": "Der Schutz von Jugendlichen vor Überlastung und gesundheitlichen Schäden bei der Arbeit (§ 1 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 657, "gesetz": "JArbSchG", "frage": "#0657 Für wen gilt das JArbSchG?", "antworten": ["Für alle Beschäftigten unter 18 Jahren, mit speziellen Regelungen für Kinder und Jugendliche (§§ 1, 2 JArbSchG).", "Nur für Auszubildende unter 21 Jahren (§ 2 JArbSchG).", "Nur für Schüler und Studenten bei Ferienjobs (§ 2 JArbSchG)."], "richtig": 0, "erklaerung": "Für alle Beschäftigten unter 18 Jahren, mit speziellen Regelungen für Kinder und Jugendliche (§§ 1, 2 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 658, "gesetz": "JArbSchG", "frage": "#0658 Wann gilt eine Person als Kind oder Jugendlicher im Sinne des JArbSchG?", "antworten": ["Kind: unter 14 Jahre, Jugendlicher: 14 bis unter 16 Jahre; ab 16 gilt man als Erwachsener (§ 2 JArbSchG).", "Kind: unter 15 Jahre, Jugendlicher: 15 bis unter 18 Jahre; Vollzeitschulpflichtige werden wie Kinder behandelt (§ 2 JArbSchG).", "Kind: unter 16 Jahre, Jugendlicher: 16 bis unter 21 Jahre (§ 1 JArbSchG)."], "richtig": 1, "erklaerung": "Kind: unter 15 Jahre, Jugendlicher: 15 bis unter 18 Jahre; Vollzeitschulpflichtige werden wie Kinder behandelt (§ 2 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 659, "gesetz": "JArbSchG", "frage": "#0659 Welche Arbeitszeitregelungen gelten für Jugendliche?", "antworten": ["Maximal 8 Stunden täglich und 48 Stunden wöchentlich, in Ausnahmen 9 Stunden täglich (§ 3 ArbZG).", "Maximal 8 Stunden täglich, 40 Stunden wöchentlich, in Ausnahmen 8,5 Stunden täglich (§ 8 JArbSchG).", "Maximal 10 Stunden täglich und 50 Stunden wöchentlich, in Ausnahmen 11 Stunden täglich (§ 8 JArbSchG)."], "richtig": 1, "erklaerung": "Maximal 8 Stunden täglich, 40 Stunden wöchentlich, in Ausnahmen 8,5 Stunden täglich (§ 8 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 660, "gesetz": "JArbSchG", "frage": "#0660 Wann haben Jugendliche Anspruch auf Ruhepausen?", "antworten": ["30 Minuten bei mehr als 4,5 Stunden Arbeit, 60 Minuten bei mehr als 6 Stunden (§ 11 JArbSchG).", "30 Minuten bei mehr als 6 Stunden Arbeit, 45 Minuten bei mehr als 9 Stunden (§ 4 ArbZG).", "15 Minuten bei mehr als 3 Stunden Arbeit, 30 Minuten bei mehr als 8 Stunden (§ 11 JArbSchG)."], "richtig": 0, "erklaerung": "30 Minuten bei mehr als 4,5 Stunden Arbeit, 60 Minuten bei mehr als 6 Stunden (§ 11 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 661, "gesetz": "JArbSchG", "frage": "#0661 Welche Arbeiten sind für Jugendliche verboten?", "antworten": ["Nur Arbeiten unter Tage und mit Sprengstoff; im Übrigen sind alle Arbeiten erlaubt (§ 24 JArbSchG).", "Gefährliche, gesundheitsschädliche, übermäßig belastende oder sittlich gefährdende Arbeiten (§ 22 JArbSchG).", "Alle Tätigkeiten, die nach 18:00 Uhr oder an Wochenenden stattfinden (§ 22 JArbSchG)."], "richtig": 1, "erklaerung": "Gefährliche, gesundheitsschädliche, übermäßig belastende oder sittlich gefährdende Arbeiten (§ 22 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 662, "gesetz": "JArbSchG", "frage": "#0662 Dürfen Jugendliche Akkordarbeit oder tempoabhängige Arbeit leisten?", "antworten": ["Ja, Akkordarbeit ist erlaubt, wenn der Stundenlohn mindestens den Mindestlohn erreicht (§ 23 JArbSchG).", "Grundsätzlich nein; Ausnahmen gelten für über 16-Jährige zur Ausbildung oder nach abgeschlossener Ausbildung unter fachkundiger Aufsicht (§ 23 JArbSchG).", "Grundsätzlich nein; Ausnahmen gelten schon für über 15-Jährige ohne Aufsicht, wenn die Eltern zustimmen (§ 23 JArbSchG)."], "richtig": 1, "erklaerung": "Grundsätzlich nein; Ausnahmen gelten für über 16-Jährige zur Ausbildung oder nach abgeschlossener Ausbildung unter fachkundiger Aufsicht (§ 23 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 663, "gesetz": "JArbSchG", "frage": "#0663 Welche Tätigkeiten dürfen Jugendliche unter Tage nicht ausführen?", "antworten": ["Nur Arbeiten mit Sprengstoff; sonstige Arbeiten unter Tage sind erlaubt (§ 24 JArbSchG).", "Arbeiten auf Baustellen in mehr als 3 m Höhe (§ 22 JArbSchG).", "Alle Arbeiten im Bergbau unter Tage (§ 24 JArbSchG)."], "richtig": 2, "erklaerung": "Alle Arbeiten im Bergbau unter Tage (§ 24 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 664, "gesetz": "JArbSchG", "frage": "#0664 Dürfen Jugendliche schwere körperliche Arbeiten verrichten?", "antworten": ["Ja, wenn der Arbeitgeber ihnen zusätzliche Pausen gewährt (§ 22 JArbSchG).", "Ja, ab 17 Jahren, wenn der Betriebsarzt zustimmt (§ 22 JArbSchG).", "Nein, Arbeiten, die ihre körperliche oder psychische Leistungsfähigkeit übersteigen, sind ausnahmslos verboten (§ 22 Abs. 1 Nr. 1 JArbSchG)."], "richtig": 2, "erklaerung": "Nein, Arbeiten, die ihre körperliche oder psychische Leistungsfähigkeit übersteigen, sind ausnahmslos verboten (§ 22 Abs. 1 Nr. 1 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 665, "gesetz": "JArbSchG", "frage": "#0665 Welche Arbeitsbereiche sind für Jugendliche besonders eingeschränkt?", "antworten": ["Ausschließlich Arbeiten unter Tage; Lärm, Strahlen und Chemikalien sind erlaubt (§ 24 JArbSchG).", "Arbeiten mit Lärm, Strahlen, gefährlichen Chemikalien oder in extremer Hitze/Kälte (§ 22 JArbSchG).", "Arbeiten am Bildschirm und im Büro; dort dürfen sie höchstens 2 Stunden täglich beschäftigt werden (§ 22 JArbSchG)."], "richtig": 1, "erklaerung": "Arbeiten mit Lärm, Strahlen, gefährlichen Chemikalien oder in extremer Hitze/Kälte (§ 22 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 666, "gesetz": "JArbSchG", "frage": "#0666 Wie viele freie Tage müssen Jugendliche pro Woche haben?", "antworten": ["Mindestens drei Ruhetage, davon zwei Sonntage (§ 15 JArbSchG).", "Mindestens einen Ruhetag, und zwar den Sonntag (§ 15 JArbSchG).", "Mindestens zwei Ruhetage (§ 15 JArbSchG)."], "richtig": 2, "erklaerung": "Mindestens zwei Ruhetage (§ 15 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 667, "gesetz": "JArbSchG", "frage": "#0667 Wann dürfen Jugendliche sonntags arbeiten?", "antworten": ["Nur in der Industrie und im Handwerk, nicht in Krankenanstalten und Gaststätten (§ 17 JArbSchG).", "Immer, wenn sie über 16 Jahre alt sind, auch im Taxigewerbe, mit Ersatzruhetag (§ 17 JArbSchG).", "Nur in den Bereichen des § 17 Abs. 2, z. B. Krankenanstalten, Gaststätten, Sport; mindestens zwei Sonntage im Monat frei, nicht im Taxigewerbe (§ 17 JArbSchG)."], "richtig": 2, "erklaerung": "Nur in den Bereichen des § 17 Abs. 2, z. B. Krankenanstalten, Gaststätten, Sport; mindestens zwei Sonntage im Monat frei, nicht im Taxigewerbe (§ 17 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 668, "gesetz": "JArbSchG", "frage": "#0668 Dürfen Jugendliche an Feiertagen arbeiten?", "antworten": ["Nein, an keinem Feiertag, auch nicht in Krankenanstalten (§ 18 JArbSchG).", "Ja, an allen gesetzlichen Feiertagen, wenn ein Ersatzruhetag gewährt wird (§ 18 JArbSchG).", "Nein, außer in den Bereichen des § 17 Abs. 2 (z. B. Gaststätten, Krankenanstalten), nicht am 25.12., 1.1., Ostersonntag und 1.5. (§ 18 JArbSchG)."], "richtig": 2, "erklaerung": "Nein, außer in den Bereichen des § 17 Abs. 2 (z. B. Gaststätten, Krankenanstalten), nicht am 25.12., 1.1., Ostersonntag und 1.5. (§ 18 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 669, "gesetz": "JArbSchG", "frage": "#0669 Welche Nachtruhezeiten gelten für Jugendliche?", "antworten": ["Beschäftigung nur zwischen 6:00 und 20:00 Uhr erlaubt, mit Ausnahmen für bestimmte Branchen (§ 14 JArbSchG).", "Beschäftigung nur zwischen 8:00 und 18:00 Uhr, ohne Ausnahmen für einzelne Branchen (§ 14 JArbSchG).", "Beschäftigung nur zwischen 6:00 und 22:00 Uhr, für über 16-Jährige in Gaststätten bis 24:00 Uhr (§ 14 JArbSchG)."], "richtig": 0, "erklaerung": "Beschäftigung nur zwischen 6:00 und 20:00 Uhr erlaubt, mit Ausnahmen für bestimmte Branchen (§ 14 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 670, "gesetz": "JArbSchG", "frage": "#0670 Welche Schichtzeit gilt für Jugendliche?", "antworten": ["Maximal 10 Stunden inklusive Pausen (§ 12 JArbSchG).", "Maximal 9 Stunden einschließlich Pausen, im Taxigewerbe 11 Stunden (§ 8 JArbSchG).", "Maximal 12 Stunden ohne Pausen; die Pausen werden zusätzlich gewährt (§ 12 JArbSchG)."], "richtig": 0, "erklaerung": "Maximal 10 Stunden inklusive Pausen (§ 12 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 671, "gesetz": "JArbSchG", "frage": "#0671 Welche ärztlichen Untersuchungen sind für jugendliche Arbeitnehmer vorgeschrieben?", "antworten": ["Nur die Erstuntersuchung; Nachuntersuchungen sind freiwillig (§ 32 JArbSchG).", "Erstuntersuchung nach drei Monaten und Nachuntersuchung nach zwei Jahren (§ 32, § 33 JArbSchG).", "Erstuntersuchung vor Arbeitsbeginn und Nachuntersuchung nach einem Jahr (§ 32, § 33 JArbSchG)."], "richtig": 2, "erklaerung": "Erstuntersuchung vor Arbeitsbeginn und Nachuntersuchung nach einem Jahr (§ 32, § 33 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 672, "gesetz": "JArbSchG", "frage": "#0672 Was passiert, wenn ein Jugendlicher die Nachuntersuchung nicht vorlegt?", "antworten": ["Ein Bußgeld von 55 € für den Jugendlichen persönlich (§ 33 JArbSchG).", "Beschäftigungsverbot bis zur Vorlage der Bescheinigung (§ 33 JArbSchG).", "Er darf zunächst weiterbeschäftigt werden, bis die Behörde die Beschäftigung untersagt (§ 33 JArbSchG)."], "richtig": 1, "erklaerung": "Beschäftigungsverbot bis zur Vorlage der Bescheinigung (§ 33 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 673, "gesetz": "JArbSchG", "frage": "#0673 Müssen Arbeitgeber die ärztlichen Untersuchungsbescheinigungen aufbewahren?", "antworten": ["Nein, die Bescheinigungen bleiben beim Jugendlichen und müssen dem Arbeitgeber nie vorgelegt werden (§ 41 JArbSchG).", "Ja, bis zum Ende der Beschäftigung, längstens bis zur Vollendung des 18. Lebensjahres; beim Ausscheiden sind sie auszuhändigen (§ 41 JArbSchG).", "Ja, zehn Jahre nach Ende der Beschäftigung (§ 41 JArbSchG)."], "richtig": 1, "erklaerung": "Ja, bis zum Ende der Beschäftigung, längstens bis zur Vollendung des 18. Lebensjahres; beim Ausscheiden sind sie auszuhändigen (§ 41 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 674, "gesetz": "JArbSchG", "frage": "#0674 Wer trägt die Kosten für die ärztlichen Untersuchungen?", "antworten": ["Der Arbeitgeber, der die Kosten nicht auf den Jugendlichen abwälzen darf (§ 44 JArbSchG).", "Das Land (§ 44 JArbSchG).", "Die Eltern des Jugendlichen; bei Auszubildenden der Ausbildungsbetrieb (§ 44 JArbSchG)."], "richtig": 1, "erklaerung": "Das Land (§ 44 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 675, "gesetz": "JArbSchG", "frage": "#0675 Wann ist eine außerordentliche Nachuntersuchung anzuordnen?", "antworten": ["Nur wenn der Arbeitgeber dies beantragt, um Fehlzeiten zu prüfen (§ 35 JArbSchG).", "Der Arzt soll sie anordnen bei Entwicklungsrückstand, gesundheitlichen Schwächen/Schäden oder noch unklaren Auswirkungen der Beschäftigung (§ 35 JArbSchG).", "Immer nach sechs Monaten Beschäftigung, auch ohne besonderen Anlass (§ 35 JArbSchG)."], "richtig": 1, "erklaerung": "Der Arzt soll sie anordnen bei Entwicklungsrückstand, gesundheitlichen Schwächen/Schäden oder noch unklaren Auswirkungen der Beschäftigung (§ 35 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 676, "gesetz": "JArbSchG", "frage": "#0676 Welche Behörde überwacht die Einhaltung des JArbSchG?", "antworten": ["Die Industrie- und Handelskammer (§ 51 JArbSchG).", "Die zuständigen Arbeitsschutzbehörden (§ 51 JArbSchG).", "Das Jugendamt (§ 51 JArbSchG)."], "richtig": 1, "erklaerung": "Die zuständigen Arbeitsschutzbehörden (§ 51 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 677, "gesetz": "JArbSchG", "frage": "#0677 Welche Sanktionen drohen bei Verstößen gegen das JArbSchG?", "antworten": ["Geldbußen bis zu 5.000 €; eine Freiheitsstrafe ist ausgeschlossen (§ 58 JArbSchG).", "Geldbußen bis zu 30.000 €, bei vorsätzlicher Gefährdung oder beharrlicher Wiederholung Freiheitsstrafe bis zu einem Jahr (§ 58 JArbSchG).", "Geldbußen bis zu 15.000 €, bei Wiederholung Freiheitsstrafe bis zu drei Jahren (§ 58 JArbSchG)."], "richtig": 1, "erklaerung": "Geldbußen bis zu 30.000 €, bei vorsätzlicher Gefährdung oder beharrlicher Wiederholung Freiheitsstrafe bis zu einem Jahr (§ 58 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 678, "gesetz": "JArbSchG", "frage": "#0678 Wann kann ein Betrieb eine Ausnahmegenehmigung erhalten?", "antworten": ["Wenn besondere betriebliche Bedingungen es erfordern und die Gesundheit nicht gefährdet wird (§ 54 JArbSchG).", "Wenn der Betriebsrat zustimmt, auch bei Gesundheitsgefährdung (§ 54 JArbSchG).", "Wenn der Jugendliche 16 Jahre alt ist und auf den Schutz verzichtet (§ 54 JArbSchG)."], "richtig": 0, "erklaerung": "Wenn besondere betriebliche Bedingungen es erfordern und die Gesundheit nicht gefährdet wird (§ 54 JArbSchG).", "schwierigkeit": "leicht"}, {"id": 679, "gesetz": "JArbSchG", "frage": "#0679 Wie oft müssen Unternehmen mit jugendlichen Beschäftigten kontrolliert werden?", "antworten": ["Nur wenn eine Beschwerde eines Jugendlichen vorliegt (§ 51 JArbSchG).", "Jährlich durch die Berufsgenossenschaft (§ 51 JArbSchG).", "In regelmäßigen Abständen durch die zuständige Aufsichtsbehörde (§ 51 JArbSchG)."], "richtig": 2, "erklaerung": "In regelmäßigen Abständen durch die zuständige Aufsichtsbehörde (§ 51 JArbSchG).", "schwierigkeit": "mittel"}, {"id": 680, "gesetz": "JArbSchG", "frage": "#0680 Welche Konsequenzen hat die Beschäftigung eines Jugendlichen ohne Erstuntersuchung?", "antworten": ["Keine, solange die Untersuchung innerhalb der ersten drei Monate nachgeholt wird (§ 32 JArbSchG).", "Verbot der Beschäftigung (§ 32 JArbSchG) und Bußgeld bis 30.000 € für den Arbeitgeber (§ 58 JArbSchG).", "Ein Bußgeld bis 1.000 €; ein Beschäftigungsverbot besteht nicht (§ 58 JArbSchG)."], "richtig": 1, "erklaerung": "Verbot der Beschäftigung (§ 32 JArbSchG) und Bußgeld bis 30.000 € für den Arbeitgeber (§ 58 JArbSchG).", "schwierigkeit": "schwer"}, {"id": 701, "gesetz": "KSchG", "frage": "#0701 Gilt das Kündigungsschutzgesetz (KSchG) für Taxi- und Mietwagenunternehmen?", "antworten": ["Nein, Taxi- und Mietwagenunternehmen sind als Verkehrsbetriebe vom KSchG ausgenommen (§ 23 KSchG).", "Ja, bereits ab dem ersten Arbeitnehmer (§ 23 KSchG).", "Ja, sofern das Unternehmen mehr als zehn Arbeitnehmer beschäftigt (§ 23 KSchG)."], "richtig": 2, "erklaerung": "Ja, sofern das Unternehmen mehr als zehn Arbeitnehmer beschäftigt (§ 23 KSchG).", "schwierigkeit": "leicht"}, {"id": 702, "gesetz": "KSchG", "frage": "#0702 Welche besonderen Kündigungsschutzregelungen gibt es für Taxi- und Mietwagenfahrer?", "antworten": ["Fahrer sind nur bei betriebsbedingter Kündigung geschützt; personen- und verhaltensbedingte Gründe sind ausgeschlossen (§ 1 KSchG).", "Das KSchG schützt Fahrer vor sozial ungerechtfertigten Kündigungen (§ 1 KSchG).", "Das KSchG gewährt Fahrern einen Anspruch auf Weiterbeschäftigung bis zum Rentenalter (§ 1 KSchG)."], "richtig": 1, "erklaerung": "Das KSchG schützt Fahrer vor sozial ungerechtfertigten Kündigungen (§ 1 KSchG).", "schwierigkeit": "mittel"}, {"id": 703, "gesetz": "KSchG", "frage": "#0703 Kann ein Taxiunternehmer einen Fahrer ohne Angabe von Gründen kündigen?", "antworten": ["Angeben muss er sie nicht, aber nach sechs Monaten in Betrieben mit mehr als zehn Arbeitnehmern braucht er einen sozial rechtfertigenden Grund (§§ 1, 23 KSchG).", "Nein, die Gründe müssen in der Kündigung genannt werden, sonst ist sie unwirksam (§ 1 KSchG).", "Ja, jederzeit; ab dem siebten Monat ist lediglich die Kündigungsfrist einzuhalten (§ 622 BGB)."], "richtig": 0, "erklaerung": "Angeben muss er sie nicht, aber nach sechs Monaten in Betrieben mit mehr als zehn Arbeitnehmern braucht er einen sozial rechtfertigenden Grund (§§ 1, 23 KSchG).", "schwierigkeit": "schwer"}, {"id": 704, "gesetz": "KSchG", "frage": "#0704 Welche Gründe rechtfertigen eine Kündigung eines Taxifahrers?", "antworten": ["Politische, religiöse und gewerkschaftliche Betätigung des Fahrers außerhalb der Arbeitszeit (§ 1 KSchG).", "Nur wirtschaftliche Gründe des Unternehmens; das Verhalten des Fahrers ist unerheblich (§ 1 KSchG).", "Personenbedingte, verhaltensbedingte oder betriebsbedingte Gründe (§ 1 Abs. 2 KSchG)."], "richtig": 2, "erklaerung": "Personenbedingte, verhaltensbedingte oder betriebsbedingte Gründe (§ 1 Abs. 2 KSchG).", "schwierigkeit": "leicht"}, {"id": 705, "gesetz": "KSchG", "frage": "#0705 Wie muss eine betriebsbedingte Kündigung in einem Taxiunternehmen begründet werden?", "antworten": ["Der Arbeitgeber muss nur nachweisen, dass der Fahrer abgemahnt wurde und der Betriebsrat zugestimmt hat (§ 1 Abs. 2 KSchG).", "Der Arbeitgeber muss dringende betriebliche Erfordernisse, fehlende Weiterbeschäftigungsmöglichkeit und eine korrekte Sozialauswahl nachweisen (§ 1 Abs. 2, 3 KSchG).", "Es genügt, dass die Kündigung wirtschaftlich sinnvoll ist; Weiterbeschäftigung und Sozialauswahl müssen nicht geprüft werden (§ 1 KSchG)."], "richtig": 1, "erklaerung": "Der Arbeitgeber muss dringende betriebliche Erfordernisse, fehlende Weiterbeschäftigungsmöglichkeit und eine korrekte Sozialauswahl nachweisen (§ 1 Abs. 2, 3 KSchG).", "schwierigkeit": "mittel"}, {"id": 706, "gesetz": "KSchG", "frage": "#0706 Wann gilt eine Kündigung als sozial ungerechtfertigt?", "antworten": ["Wenn sie nicht vom Betriebsrat genehmigt wurde (§ 102 BetrVG).", "Wenn sie nicht personen-, verhaltens- oder betriebsbedingt erfolgt (§ 1 Abs. 2 KSchG).", "Wenn die Kündigungsfrist nicht eingehalten wird (§ 622 BGB)."], "richtig": 1, "erklaerung": "Wenn sie nicht personen-, verhaltens- oder betriebsbedingt erfolgt (§ 1 Abs. 2 KSchG).", "schwierigkeit": "schwer"}, {"id": 707, "gesetz": "KSchG", "frage": "#0707 Wann genießt ein Arbeitnehmer Kündigungsschutz nach dem KSchG?", "antworten": ["Nach sechs Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als zehn Beschäftigten (§ 1 Abs. 1 KSchG).", "Ab dem ersten Arbeitstag in jedem Betrieb (§ 1 KSchG).", "Nach zwölf Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als 20 Beschäftigten (§ 23 KSchG)."], "richtig": 0, "erklaerung": "Nach sechs Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als zehn Beschäftigten (§ 1 Abs. 1 KSchG).", "schwierigkeit": "leicht"}, {"id": 708, "gesetz": "KSchG", "frage": "#0708 Welche Form muss eine Kündigung haben?", "antworten": ["Mündlich genügt, sofern ein Zeuge anwesend ist (§ 623 BGB).", "In Textform, also auch per E-Mail oder WhatsApp, wenn der Empfang bestätigt wird (§ 126b BGB).", "Schriftlich mit eigenhändiger Unterschrift des Arbeitgebers oder eines Bevollmächtigten; E-Mail, Fax oder SMS genügen nicht (§ 623 BGB)."], "richtig": 2, "erklaerung": "Schriftlich mit eigenhändiger Unterschrift des Arbeitgebers oder eines Bevollmächtigten; E-Mail, Fax oder SMS genügen nicht (§ 623 BGB).", "schwierigkeit": "mittel"}, {"id": 709, "gesetz": "KSchG", "frage": "#0709 Welche Fristen gelten für eine Kündigung durch den Arbeitgeber?", "antworten": ["Grundfrist vier Wochen zum 15. oder Monatsende; danach verlängern sie sich mit der Betriebszugehörigkeit (§ 622 BGB).", "Grundfrist zwei Wochen zum Monatsende; danach verlängern sie sich mit der Betriebszugehörigkeit (§ 622 BGB).", "Grundfrist vier Wochen zum Quartalsende, unabhängig von der Betriebszugehörigkeit (§ 622 Abs. 2 BGB)."], "richtig": 0, "erklaerung": "Grundfrist vier Wochen zum 15. oder Monatsende; danach verlängern sie sich mit der Betriebszugehörigkeit (§ 622 BGB).", "schwierigkeit": "schwer"}, {"id": 710, "gesetz": "KSchG", "frage": "#0710 Wann kann ein Arbeitnehmer gegen eine Kündigung klagen?", "antworten": ["Innerhalb von drei Wochen nach Zugang der Kündigung (§ 4 KSchG).", "Innerhalb von einem Monat nach der Kündigung (§ 4 KSchG).", "Innerhalb von sechs Wochen nach Ablauf der Kündigungsfrist (§ 4 KSchG)."], "richtig": 0, "erklaerung": "Innerhalb von drei Wochen nach Zugang der Kündigung (§ 4 KSchG).", "schwierigkeit": "leicht"}, {"id": 711, "gesetz": "KSchG", "frage": "#0711 Welche Arbeitnehmergruppen genießen besonderen Kündigungsschutz?", "antworten": ["Nur Schwerbehinderte und Schwangere; Betriebsratsmitglieder und Auszubildende können ordentlich gekündigt werden (§ 168 SGB IX).", "Schwerbehinderte (§ 168 SGB IX), Schwangere (§ 17 MuSchG), Betriebsratsmitglieder (§ 15 KSchG) und Auszubildende (§ 22 BBiG).", "Alle Arbeitnehmer über 50 Jahre und Beschäftigte mit mehr als 10 Jahren Betriebszugehörigkeit (§ 622 BGB)."], "richtig": 1, "erklaerung": "Schwerbehinderte (§ 168 SGB IX), Schwangere (§ 17 MuSchG), Betriebsratsmitglieder (§ 15 KSchG) und Auszubildende (§ 22 BBiG).", "schwierigkeit": "mittel"}, {"id": 712, "gesetz": "KSchG", "frage": "#0712 Welche Schutzbestimmungen gibt es für schwerbehinderte Taxifahrer?", "antworten": ["Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX).", "Die Kündigung darf nur mit Zustimmung des Betriebsrats erfolgen (§ 102 BetrVG).", "Die Kündigung bedarf der Zustimmung der Agentur für Arbeit (§ 168 SGB IX)."], "richtig": 0, "erklaerung": "Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX).", "schwierigkeit": "schwer"}, {"id": 713, "gesetz": "KSchG", "frage": "#0713 Welche Regelungen gelten für schwangere Arbeitnehmerinnen in Taxiunternehmen?", "antworten": ["Sie genießen Kündigungsschutz nur während der Mutterschutzfrist, also sechs Wochen vor bis acht Wochen nach der Geburt (§ 3 MuSchG).", "Sie genießen Kündigungsschutz ab dem fünften Schwangerschaftsmonat bis zwei Monate nach der Geburt (§ 17 MuSchG).", "Sie genießen Kündigungsschutz vom Beginn der Schwangerschaft bis vier Monate nach der Geburt (§ 17 MuSchG)."], "richtig": 2, "erklaerung": "Sie genießen Kündigungsschutz vom Beginn der Schwangerschaft bis vier Monate nach der Geburt (§ 17 MuSchG).", "schwierigkeit": "leicht"}, {"id": 714, "gesetz": "KSchG", "frage": "#0714 Welche Schutzregelungen gibt es für Betriebsratsmitglieder in Taxiunternehmen?", "antworten": ["Ordentliche Kündigung nur mit Zustimmung des Arbeitsgerichts; nachwirkender Schutz drei Jahre (§ 15 KSchG).", "Sie können wie alle anderen Arbeitnehmer ordentlich gekündigt werden, wenn der Betriebsrat angehört wurde (§ 102 BetrVG).", "Nur außerordentlich aus wichtigem Grund und mit Zustimmung des Betriebsrats; nachwirkender Schutz ein Jahr nach Amtsende (§ 15 KSchG, § 103 BetrVG)."], "richtig": 2, "erklaerung": "Nur außerordentlich aus wichtigem Grund und mit Zustimmung des Betriebsrats; nachwirkender Schutz ein Jahr nach Amtsende (§ 15 KSchG, § 103 BetrVG).", "schwierigkeit": "mittel"}, {"id": 715, "gesetz": "KSchG", "frage": "#0715 Welche Regelungen gelten für die Kündigung von Auszubildenden?", "antworten": ["Sie ist jederzeit mit einer Frist von vier Wochen möglich (§ 622 BGB).", "Sie ist nur bei betriebsbedingten Gründen und mit Zustimmung der IHK möglich (§ 22 BBiG).", "Eine Kündigung nach der Probezeit ist nur a
