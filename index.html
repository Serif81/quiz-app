gänger am Rand nicht gefährdet werden (§ 2 Abs. 2 StVO)."], "richtig": 1, "erklaerung": "Fahrzeuge müssen die Fahrbahn benutzen und möglichst weit rechts fahren (§ 2 StVO).", "schwierigkeit": "mittel"}, {"id": 303, "gesetz": "StraßenGesetz", "frage": "#0303 Wann muss ein Taxi im Winter mit speziellen Reifen ausgerüstet sein?", "antworten": ["Bei Glatteis, Schneeglätte, Schneematsch, Eisglätte oder Reifglätte müssen alle Räder mit Winterreifen ausgestattet sein (§ 2 Abs. 3a StVO).", "Nur bei Schneefall auf der gesamten Fahrstrecke; bei Glatteis genügen Sommerreifen mit Schneeketten (§ 2 Abs. 3 StVO).", "Von November bis März müssen Taxis immer mit Winterreifen ausgestattet sein, unabhängig von der Witterung (§ 3 Abs. 4 StVO)."], "richtig": 0, "erklaerung": "Bei Glatteis, Schneeglätte, Schneematsch, Eisglätte oder Reifglätte müssen alle Räder mit Winterreifen ausgestattet sein (§ 2 Abs. 3a StVO).", "schwierigkeit": "schwer"}, {"id": 304, "gesetz": "StraßenGesetz", "frage": "#0304 Darf ein Taxi auf einem Radweg fahren?", "antworten": ["Ja, aber nur zum Ein- und Aussteigen, ohne dass dies eines Zusatzzeichens bedarf (§ 12 StVO).", "Ja, Taxis dürfen Radwege immer benutzen, wenn sie dadurch schneller ans Ziel kommen (§ 2 Abs. 4 StVO).", "Nein, es sei denn, die Benutzung ist durch Zusatzzeichen erlaubt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 237 StVO)."], "richtig": 2, "erklaerung": "Nein, es sei denn, die Benutzung ist durch Zusatzzeichen erlaubt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 237 StVO).", "schwierigkeit": "leicht"}, {"id": 305, "gesetz": "StraßenGesetz", "frage": "#0305 Welche besonderen Vorschriften gelten für die Nutzung von Busspuren?", "antworten": ["Taxis dürfen Busspuren nur benutzen, wenn ein Zusatzzeichen dies erlaubt; an Bushaltestellen dürfen sie zum sofortigen Ein- und Aussteigen halten (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 245 StVO).", "Busspuren dürfen nur von Taxis mit Fahrgast befahren werden, leere Taxis nie (§ 41 StVO).", "Taxis dürfen Busspuren grundsätzlich immer benutzen, da sie öffentliche Verkehrsmittel sind (§ 2 StVO)."], "richtig": 0, "erklaerung": "Taxis dürfen Busspuren nur benutzen, wenn ein Zusatzzeichen dies erlaubt; an Bushaltestellen dürfen sie zum sofortigen Ein- und Aussteigen halten (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 245 StVO).", "schwierigkeit": "mittel"}, {"id": 306, "gesetz": "StraßenGesetz", "frage": "#0306 Wie muss die Geschwindigkeit im Straßenverkehr angepasst werden?", "antworten": ["Es genügt, die zulässige Höchstgeschwindigkeit einzuhalten; die Verhältnisse brauchen nicht berücksichtigt zu werden (§ 3 Abs. 3 StVO).", "Die Geschwindigkeit muss stets 10 % unter der zulässigen Höchstgeschwindigkeit liegen (§ 3 Abs. 2 StVO).", "Die Geschwindigkeit muss den Straßen-, Verkehrs-, Sicht- und Wetterverhältnissen sowie den persönlichen Fähigkeiten angepasst werden (§ 3 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "Die Geschwindigkeit muss den Straßen-, Verkehrs-, Sicht- und Wetterverhältnissen sowie den persönlichen Fähigkeiten angepasst werden (§ 3 Abs. 1 StVO).", "schwierigkeit": "schwer"}, {"id": 307, "gesetz": "StraßenGesetz", "frage": "#0307 Welche Höchstgeschwindigkeit gilt innerorts für Taxis?", "antworten": ["60 km/h, da Taxis als Fahrzeuge im Personenverkehr schneller fahren dürfen (§ 3 Abs. 2 StVO).", "50 km/h, wenn nicht durch Verkehrszeichen eine andere Geschwindigkeit vorgegeben ist (§ 3 Abs. 3 StVO).", "30 km/h, wenn nicht durch Verkehrszeichen eine andere Geschwindigkeit vorgegeben ist (§ 3 Abs. 3 StVO)."], "richtig": 1, "erklaerung": "50 km/h, wenn nicht durch Verkehrszeichen eine andere Geschwindigkeit vorgegeben ist (§ 3 Abs. 3 StVO).", "schwierigkeit": "leicht"}, {"id": 308, "gesetz": "StraßenGesetz", "frage": "#0308 Welche Höchstgeschwindigkeit gilt für Taxis auf Landstraßen?", "antworten": ["100 km/h, wenn keine andere Regelung besteht (§ 3 Abs. 3 StVO).", "120 km/h, wenn die Straße zwei Fahrstreifen je Richtung hat (§ 18 StVO).", "80 km/h, da Taxis gewerblich Personen befördern (§ 3 Abs. 3 StVO)."], "richtig": 0, "erklaerung": "100 km/h, wenn keine andere Regelung besteht (§ 3 Abs. 3 StVO).", "schwierigkeit": "mittel"}, {"id": 309, "gesetz": "StraßenGesetz", "frage": "#0309 Wie groß muss der Abstand zum vorausfahrenden Fahrzeug sein?", "antworten": ["Der Abstand muss nur bei Nässe vergrößert werden; sonst genügt eine Fahrzeuglänge (§ 3 StVO).", "Der Abstand muss immer mindestens 50 Meter betragen (§ 4 Abs. 3 StVO).", "So groß, dass auch bei plötzlichem Bremsen sicher gehalten werden kann (§ 4 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "So groß, dass auch bei plötzlichem Bremsen sicher gehalten werden kann (§ 4 Abs. 1 StVO).", "schwierigkeit": "schwer"}, {"id": 310, "gesetz": "StraßenGesetz", "frage": "#0310 Welche Abstandsregel gilt auf Autobahnen für Fahrzeuge über 3,5 Tonnen?", "antworten": ["Mindestens 50 m Abstand bei mehr als 50 km/h (§ 4 Abs. 3 StVO).", "Mindestens 100 m Abstand, wenn schneller als 80 km/h gefahren wird (§ 4 Abs. 2 StVO).", "Mindestens 25 m Abstand bei mehr als 80 km/h (§ 4 Abs. 3 StVO)."], "richtig": 0, "erklaerung": "Mindestens 50 m Abstand bei mehr als 50 km/h (§ 4 Abs. 3 StVO).", "schwierigkeit": "leicht"}, {"id": 311, "gesetz": "StraßenGesetz", "frage": "#0311 Wo darf überholt werden?", "antworten": ["Grundsätzlich links, außer wenn rechts überholen ausdrücklich erlaubt ist (§ 5 Abs. 1 StVO).", "Grundsätzlich rechts, damit der linke Fahrstreifen frei bleibt (§ 7 StVO).", "Überall dort, wo die Fahrbahn breit genug ist, in beliebiger Richtung (§ 6 StVO)."], "richtig": 0, "erklaerung": "Grundsätzlich links, außer wenn rechts überholen ausdrücklich erlaubt ist (§ 5 Abs. 1 StVO).", "schwierigkeit": "mittel"}, {"id": 312, "gesetz": "StraßenGesetz", "frage": "#0312 Wann ist das Überholen verboten?", "antworten": ["Wenn das überholte Fahrzeug ein Taxi ist oder die Straße mehr als zwei Fahrstreifen hat (§ 7 StVO).", "Nur bei Dunkelheit oder wenn die Geschwindigkeit weniger als 30 km/h beträgt (§ 5 Abs. 2 StVO).", "Bei unklarer Verkehrslage oder wenn es durch Verkehrszeichen untersagt ist (§ 5 Abs. 3 StVO)."], "richtig": 2, "erklaerung": "Bei unklarer Verkehrslage oder wenn es durch Verkehrszeichen untersagt ist (§ 5 Abs. 3 StVO).", "schwierigkeit": "schwer"}, {"id": 313, "gesetz": "StraßenGesetz", "frage": "#0313 Wann darf innerorts rechts überholt werden?", "antworten": ["Kfz bis 3,5 t dürfen innerorts auf Fahrbahnen mit mehreren markierten Fahrstreifen für eine Richtung den Fahrstreifen frei wählen und rechts schneller als links fahren (§ 7 Abs. 3 StVO).", "Innerorts darf nie rechts überholt werden; auch bei mehreren Fahrstreifen ist ein Rechtsüberholen verboten (§ 5 Abs. 1 StVO).", "Rechts überholt werden darf nur auf Straßen mit Zeichen 301 und nur von Fahrzeugen über 3,5 t (§ 7 Abs. 1 StVO)."], "richtig": 0, "erklaerung": "Kfz bis 3,5 t dürfen innerorts auf Fahrbahnen mit mehreren markierten Fahrstreifen für eine Richtung den Fahrstreifen frei wählen und rechts schneller als links fahren (§ 7 Abs. 3 StVO).", "schwierigkeit": "leicht"}, {"id": 314, "gesetz": "StraßenGesetz", "frage": "#0314 Wer hat Vorfahrt an einer Kreuzung ohne Verkehrszeichen?", "antworten": ["Das größere oder schwerere Fahrzeug hat Vorfahrt, unabhängig von der Richtung (§ 8 Abs. 2 StVO).", "Wer von links kommt, hat Vorfahrt, da der Rechtsverkehr dies vorgibt (§ 9 StVO).", "Wer von rechts kommt, hat Vorfahrt (§ 8 StVO)."], "richtig": 2, "erklaerung": "Wer von rechts kommt, hat Vorfahrt (§ 8 StVO).", "schwierigkeit": "mittel"}, {"id": 315, "gesetz": "StraßenGesetz", "frage": "#0315 Welche Regel gilt für Kreisverkehre mit Vorfahrtsschild?", "antworten": ["Fahrzeuge im Kreisverkehr haben Vorfahrt; bei der Einfahrt darf nicht geblinkt werden (§ 8 Abs. 1a StVO).", "Wer einfährt, hat Vorfahrt; im Kreis muss beim Verlassen nicht geblinkt werden (§ 9a StVO).", "Ein- und Ausfahrt sind zu blinken; Kreisverkehre ohne Vorfahrtsschild gelten als Kreuzung (§ 9 StVO)."], "richtig": 0, "erklaerung": "Fahrzeuge im Kreisverkehr haben Vorfahrt; bei der Einfahrt darf nicht geblinkt werden (§ 8 Abs. 1a StVO).", "schwierigkeit": "schwer"}, {"id": 316, "gesetz": "StraßenGesetz", "frage": "#0316 Wo ist das Halten verboten?", "antworten": ["Nur auf Autobahnen und Kraftfahrstraßen; innerorts ist das Halten generell erlaubt (§ 18 StVO).", "In Kurven bei Nässe, auf Parkplätzen sowie vor Geschäften (§ 13 StVO).", "In engen und unübersichtlichen Straßenstellen, in scharfen Kurven, auf Bahnübergängen oder auf Einfädelungs- und Ausfädelungsstreifen (§ 12 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "In engen und unübersichtlichen Straßenstellen, in scharfen Kurven, auf Bahnübergängen oder auf Einfädelungs- und Ausfädelungsstreifen (§ 12 Abs. 1 StVO).", "schwierigkeit": "leicht"}, {"id": 317, "gesetz": "StraßenGesetz", "frage": "#0317 Darf ein Taxi in zweiter Reihe halten?", "antworten": ["Ja, aber nur zum Ein- oder Aussteigenlassen von Fahrgästen, wenn die Verkehrslage es zulässt (§ 12 Abs. 4 StVO).", "Ja, ohne zeitliche Begrenzung, solange der Warnblinker eingeschaltet ist (§ 15 StVO).", "Nein, in zweiter Reihe zu halten ist Taxis grundsätzlich verboten (§ 12 Abs. 1 StVO)."], "richtig": 0, "erklaerung": "Ja, aber nur zum Ein- oder Aussteigenlassen von Fahrgästen, wenn die Verkehrslage es zulässt (§ 12 Abs. 4 StVO).", "schwierigkeit": "mittel"}, {"id": 318, "gesetz": "StraßenGesetz", "frage": "#0318 Wann wird aus Halten Parken?", "antworten": ["Wenn das Fahrzeug länger als drei Minuten steht oder der Fahrer es verlässt (§ 12 Abs. 2 StVO).", "Wenn der Motor abgestellt oder der Warnblinker eingeschaltet wird (§ 15 StVO).", "Sobald das Fahrzeug länger als eine Minute steht, auch wenn der Fahrer im Fahrzeug bleibt (§ 12 Abs. 3 StVO)."], "richtig": 0, "erklaerung": "Wenn das Fahrzeug länger als drei Minuten steht oder der Fahrer es verlässt (§ 12 Abs. 2 StVO).", "schwierigkeit": "schwer"}, {"id": 319, "gesetz": "StraßenGesetz", "frage": "#0319 Wo ist das Parken verboten?", "antworten": ["Auf Parkplätzen, an Taxiständen und auf Fahrbahnen mit Parkscheibenpflicht (§ 13 StVO).", "Unter anderem an Kreuzungen, vor Grundstückszufahrten, auf Gehwegen ohne entsprechende Markierung oder an Bushaltestellen (§ 12 Abs. 3 StVO).", "Nur auf Autobahnen und Kraftfahrstraßen; innerorts ist das Parken überall erlaubt (§ 18 StVO)."], "richtig": 1, "erklaerung": "Unter anderem an Kreuzungen, vor Grundstückszufahrten, auf Gehwegen ohne entsprechende Markierung oder an Bushaltestellen (§ 12 Abs. 3 StVO).", "schwierigkeit": "leicht"}, {"id": 320, "gesetz": "StraßenGesetz", "frage": "#0320 Darf ein Taxi auf einem Behindertenparkplatz stehen?", "antworten": ["Ja, Taxis dürfen dort jederzeit stehen, wenn sie einen behinderten Fahrgast erwarten (§ 12 StVO).", "Nein, Parken nur, wenn ein gültiger Parkausweis für schwerbehinderte Menschen (z. B. des beförderten Fahrgasts) gut lesbar ausliegt (§ 42 Abs. 2 i. V. m. Anlage 3 Zeichen 314 StVO).", "Ja, aber höchstens 15 Minuten, auch ohne Parkausweis, solange der Fahrer im Fahrzeug bleibt (§ 13 StVO)."], "richtig": 1, "erklaerung": "Nein, Parken nur, wenn ein gültiger Parkausweis für schwerbehinderte Menschen (z. B. des beförderten Fahrgasts) gut lesbar ausliegt (§ 42 Abs. 2 i. V. m. Anlage 3 Zeichen 314 StVO).", "schwierigkeit": "mittel"}, {"id": 321, "gesetz": "StraßenGesetz", "frage": "#0321 Wie müssen Fahrgäste in Taxis gesichert werden?", "antworten": ["Nur Fahrgäste auf den Vordersitzen müssen angeschnallt sein; auf den Rücksitzen besteht keine Pflicht (§ 21a StVO).", "Alle Personen müssen während der Fahrt Sicherheitsgurte anlegen (§ 21a StVO).", "Fahrgäste müssen sich nur außerorts anschnallen; Taxifahrer haften nicht für fehlende Gurtanlage (§ 22 StVO)."], "richtig": 1, "erklaerung": "Alle Personen müssen während der Fahrt Sicherheitsgurte anlegen (§ 21a StVO).", "schwierigkeit": "schwer"}, {"id": 322, "gesetz": "StraßenGesetz", "frage": "#0322 Welche Regelungen gelten für die Beförderung von Kindern in Taxis?", "antworten": ["Kinder bis 12 Jahre unter 150 cm brauchen eine geeignete Kinderrückhalteeinrichtung. In Taxen ist die Pflicht auf Rücksitzen auf zwei Kinder ab 9 kg beschränkt (mind. eine Sicherung für 9–18 kg); nicht bei regelmäßiger Kinderbeförderung (§ 21 Abs. 1a StVO).", "Kinder dürfen im Taxi stets auf dem Schoß der Eltern befördert werden, Kindersitze sind im Taxi nie vorgeschrieben (§ 21 Abs. 1 StVO).", "Kinder bis 14 Jahre brauchen immer einen Kindersitz, ohne Ausnahme für Taxen; das Bußgeld trifft die Eltern (§ 21a StVO)."], "richtig": 0, "erklaerung": "Kinder bis 12 Jahre unter 150 cm brauchen eine geeignete Kinderrückhalteeinrichtung. In Taxen ist die Pflicht auf Rücksitzen auf zwei Kinder ab 9 kg beschränkt (mind. eine Sicherung für 9–18 kg); nicht bei regelmäßiger Kinderbeförderung (§ 21 Abs. 1a StVO).", "schwierigkeit": "leicht"}, {"id": 323, "gesetz": "StraßenGesetz", "frage": "#0323 Darf ein Taxi mehr Fahrgäste mitnehmen, als Sitzplätze vorhanden sind?", "antworten": ["Ja, wenn die Fahrt weniger als 5 km beträgt und der Fahrer langsam fährt (§ 3 StVO).", "Nein, es dürfen nur so viele Fahrgäste befördert werden, wie Sitzplätze mit Sicherheitsgurten vorhanden sind (§ 21 StVO).", "Ja, in Taxis dürfen bis zu zwei Fahrgäste zusätzlich stehend befördert werden (§ 34 StVZO)."], "richtig": 1, "erklaerung": "Nein, es dürfen nur so viele Fahrgäste befördert werden, wie Sitzplätze mit Sicherheitsgurten vorhanden sind (§ 21 StVO).", "schwierigkeit": "mittel"}, {"id": 324, "gesetz": "StraßenGesetz", "frage": "#0324 Welche Vorschrift gilt für den Transport von Gepäck im Taxi?", "antworten": ["Gepäck darf nur im Fahrgastraum befördert werden; der Kofferraum ist Taxen vorbehalten (§ 23 StVO).", "Gepäck muss so verstaut sein, dass es die Verkehrssicherheit nicht beeinträchtigt (§ 22 Abs. 1 StVO).", "Gepäck ist nur zulässig, wenn es auf dem Dach mit Gurten befestigt wird (§ 31 StVZO)."], "richtig": 1, "erklaerung": "Gepäck muss so verstaut sein, dass es die Verkehrssicherheit nicht beeinträchtigt (§ 22 Abs. 1 StVO).", "schwierigkeit": "schwer"}, {"id": 325, "gesetz": "StraßenGesetz", "frage": "#0325 Wann müssen Fahrgäste in einem Taxi angeschnallt sein?", "antworten": ["Immer, es sei denn, sie sind von der Gurtpflicht befreit (§ 21a StVO).", "Nur bei Fahrten über 50 km; kürzere Strecken sind von der Pflicht ausgenommen (§ 22 StVO).", "Nur auf Autobahnen und Landstraßen; innerorts besteht keine Gurtpflicht (§ 21a StVO)."], "richtig": 0, "erklaerung": "Immer, es sei denn, sie sind von der Gurtpflicht befreit (§ 21a StVO).", "schwierigkeit": "leicht"}, {"id": 326, "gesetz": "StraßenGesetz", "frage": "#0326 Wann muss eine Rettungsgasse gebildet werden?", "antworten": ["Nur auf Autobahnen mit drei oder mehr Fahrstreifen; Fahrzeuge fahren dazu auf den Standstreifen (§ 2 StVO).", "Sobald Fahrzeuge auf Autobahnen oder Außerortsstraßen mit mindestens zwei Fahrstreifen für eine Richtung mit Schrittgeschwindigkeit fahren oder stehen; die Gasse ist zwischen dem äußerst linken und dem rechts daneben liegenden Fahrstreifen zu bilden (§ 11 Abs. 2 StVO).", "Erst wenn die Einsatzfahrzeuge mit Blaulicht und Martinshorn sichtbar sind und die Fahrzeuge stehen (§ 38 StVO)."], "richtig": 1, "erklaerung": "Sobald Fahrzeuge auf Autobahnen oder Außerortsstraßen mit mindestens zwei Fahrstreifen für eine Richtung mit Schrittgeschwindigkeit fahren oder stehen; die Gasse ist zwischen dem äußerst linken und dem rechts daneben liegenden Fahrstreifen zu bilden (§ 11 Abs. 2 StVO).", "schwierigkeit": "mittel"}, {"id": 327, "gesetz": "StraßenGesetz", "frage": "#0327 Welche Regeln gelten beim Annähern an einen Schulbus mit eingeschaltetem Warnblinklicht?", "antworten": ["Es darf immer vorbeigefahren werden, wenn die Fahrbahn breit genug ist; Warten ist nur auf Autobahnen nötig (§ 20 Abs. 1 StVO).", "Ein sich der Haltestelle nähernder Bus mit Warnblinklicht darf nicht überholt werden; am haltenden Bus nur mit Schrittgeschwindigkeit und ausreichendem Abstand vorbeifahren, wenn nötig warten (§ 20 Abs. 3 und 4 StVO).", "Ein Bus mit Warnblinklicht darf mit Tempo 50 überholt werden, wenn die Straße frei ist (§ 3 StVO)."], "richtig": 1, "erklaerung": "Ein sich der Haltestelle nähernder Bus mit Warnblinklicht darf nicht überholt werden; am haltenden Bus nur mit Schrittgeschwindigkeit und ausreichendem Abstand vorbeifahren, wenn nötig warten (§ 20 Abs. 3 und 4 StVO).", "schwierigkeit": "schwer"}, {"id": 328, "gesetz": "StraßenGesetz", "frage": "#0328 Was ist beim Einfahren aus Grundstücken zu beachten?", "antworten": ["Einfahren darf der Fahrer nur zwischen 6 und 22 Uhr, sonst ist eine Genehmigung der Gemeinde nötig (§ 12 StVO).", "Es muss nicht geblinkt werden; der Fahrer darf Vorfahrt erzwingen, wenn er zuerst erkannt wurde (§ 8 StVO).", "Eine Gefährdung anderer Verkehrsteilnehmer muss ausgeschlossen sein, erforderlichenfalls muss man sich einweisen lassen; das Einfahren ist mit dem Fahrtrichtungsanzeiger anzukündigen (§ 10 StVO)."], "richtig": 2, "erklaerung": "Eine Gefährdung anderer Verkehrsteilnehmer muss ausgeschlossen sein, erforderlichenfalls muss man sich einweisen lassen; das Einfahren ist mit dem Fahrtrichtungsanzeiger anzukündigen (§ 10 StVO).", "schwierigkeit": "leicht"}, {"id": 329, "gesetz": "StraßenGesetz", "frage": "#0329 Wann darf ein Taxi in einer Umweltzone fahren?", "antworten": ["Nur nach 22 Uhr oder mit einem Verbrennungsmotor der Euronorm 3 (§ 3 StVO).", "Immer, solange das Taxi gewerblich genutzt wird und eine Genehmigung der IHK vorliegt (§ 5 PBZugV).", "Nur mit einer gültigen Umweltplakette oder einer Sondergenehmigung (§ 40 BImSchG)."], "richtig": 2, "erklaerung": "Nur mit einer gültigen Umweltplakette oder einer Sondergenehmigung (§ 40 BImSchG).", "schwierigkeit": "mittel"}, {"id": 330, "gesetz": "StraßenGesetz", "frage": "#0330 Wann darf ein Taxi in einer Fußgängerzone fahren?", "antworten": ["Nur wenn ein Zusatzzeichen dies (ggf. zeitlich begrenzt) erlaubt oder eine Ausnahmegenehmigung vorliegt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 242.1, § 46 StVO).", "Nur zum Aussteigenlassen und nur nach 20 Uhr, auch ohne Zusatzzeichen (§ 12 StVO).", "Immer, da Taxis als öffentlicher Verkehr gelten und die Fußgängerzone befahren dürfen (§ 2 StVO)."], "richtig": 0, "erklaerung": "Nur wenn ein Zusatzzeichen dies (ggf. zeitlich begrenzt) erlaubt oder eine Ausnahmegenehmigung vorliegt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 242.1, § 46 StVO).", "schwierigkeit": "schwer"}, {"id": 351, "gesetz": "StraßenGesetz", "frage": "#0351 Wann ist ein Fahrzeug für den öffentlichen Straßenverkehr zugelassen?", "antworten": ["Wenn die Genehmigungsbehörde nach dem PBefG zugestimmt hat (§ 13 PBefG).", "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO).", "Wenn der Halter die Kfz-Steuer bezahlt hat und einen Gewerbeschein besitzt (§ 3 StVG)."], "richtig": 1, "erklaerung": "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO).", "schwierigkeit": "leicht"}, {"id": 352, "gesetz": "StraßenGesetz", "frage": "#0352 Wann kann eine Zulassung entzogen werden?", "antworten": ["Wenn das Fahrzeug nicht vorschriftsmäßig ist und Mängel nicht fristgerecht behoben werden; die Behörde kann den Betrieb beschränken oder untersagen (§ 5 FZV; für zulassungsfreie Fahrzeuge § 17 StVZO).", "Wenn der Halter seine Kfz-Steuer nicht bezahlt hat oder das Fahrzeug älter als 10 Jahre ist (§ 3 StVG).", "Wenn das Fahrzeug länger als drei Monate nicht benutzt wurde oder der Halter umzieht (§ 3 FZV)."], "richtig": 0, "erklaerung": "Wenn das Fahrzeug nicht vorschriftsmäßig ist und Mängel nicht fristgerecht behoben werden; die Behörde kann den Betrieb beschränken oder untersagen (§ 5 FZV; für zulassungsfreie Fahrzeuge § 17 StVZO).", "schwierigkeit": "mittel"}, {"id": 353, "gesetz": "StraßenGesetz", "frage": "#0353 Wann erlischt die Betriebserlaubnis eines Fahrzeugs?", "antworten": ["Wenn Änderungen vorgenommen werden, die die Fahrzeugart ändern, die Sicherheit gefährden oder das Abgas- bzw. Geräuschverhalten verschlechtern (§ 19 StVZO).", "Wenn der Halter das Fahrzeug an einen anderen vermietet oder die Fahrzeugfarbe ändert (§ 20 StVZO).", "Wenn das Fahrzeug einen Parkschaden erleidet oder die Hauptuntersuchung um einen Monat überschritten wird (§ 29 StVZO)."], "richtig": 0, "erklaerung": "Wenn Änderungen vorgenommen werden, die die Fahrzeugart ändern, die Sicherheit gefährden oder das Abgas- bzw. Geräuschverhalten verschlechtern (§ 19 StVZO).", "schwierigkeit": "schwer"}, {"id": 354, "gesetz": "StraßenGesetz", "frage": "#0354 Wer ist für die Erteilung der allgemeinen Betriebserlaubnis zuständig?", "antworten": ["Die örtliche Zulassungsstelle (§ 6 FZV).", "Die Industrie- und Handelskammer (§ 5 PBZugV).", "Das Kraftfahrt-Bundesamt (§ 20 StVZO)."], "richtig": 2, "erklaerung": "Das Kraftfahrt-Bundesamt (§ 20 StVZO).", "schwierigkeit": "leicht"}, {"id": 355, "gesetz": "StraßenGesetz", "frage": "#0355 Wann ist eine Einzelbetriebserlaubnis erforderlich?", "antworten": ["Wenn der Halter das Fahrzeug an einen neuen Unternehmer verkauft und ummelden lässt (§ 19 StVZO).", "Wenn das Fahrzeug älter als zehn Jahre ist und erneut zugelassen werden soll (§ 21 StVZO).", "Wenn das Fahrzeug nicht zu einem genehmigten Typ gehört (§ 21 StVZO)."], "richtig": 2, "erklaerung": "Wenn das Fahrzeug nicht zu einem genehmigten Typ gehört (§ 21 StVZO).", "schwierigkeit": "mittel"}, {"id": 356, "gesetz": "StraßenGesetz", "frage": "#0356 Welche Anforderungen müssen Fahrzeuge grundsätzlich erfüllen?", "antworten": ["Sie müssen mindestens die Abgasnorm Euro 6 erfüllen, die Höchstgeschwindigkeit ist auf 130 km/h zu begrenzen und Insassen sind durch Airbags zu schützen (§ 30 StVZO).", "Ihr Betrieb darf niemanden schädigen oder mehr als unvermeidbar gefährden, behindern oder belästigen; Insassen sind möglichst zu schützen; die Bauweise muss straßenschonend sein (§ 30 StVZO).", "Sie müssen nur bei der Erstzulassung verkehrssicher sein; spätere Veränderungen sind unerheblich, solange die HU bestanden wurde (§ 29 StVZO)."], "richtig": 1, "erklaerung": "Ihr Betrieb darf niemanden schädigen oder mehr als unvermeidbar gefährden, behindern oder belästigen; Insassen sind möglichst zu schützen; die Bauweise muss straßenschonend sein (§ 30 StVZO).", "schwierigkeit": "schwer"}, {"id": 357, "gesetz": "StraßenGesetz", "frage": "#0357 Welche Fahrzeugteile benötigen eine Bauartgenehmigung?", "antworten": ["Fahrzeugteile wie Bremsen, Beleuchtungseinrichtungen und Rückhaltesysteme (§ 22a StVZO).", "Nur Karosserieteile und Lackierungen, die das Aussehen des Fahrzeugs verändern (§ 22a StVZO).", "Zubehör wie Fußmatten, Sitzbezüge und Zierleisten (§ 22a StVZO)."], "richtig": 0, "erklaerung": "Fahrzeugteile wie Bremsen, Beleuchtungseinrichtungen und Rückhaltesysteme (§ 22a StVZO).", "schwierigkeit": "leicht"}, {"id": 358, "gesetz": "StraßenGesetz", "frage": "#0358 Welche Sicherheitsausstattung ist für Taxis Pflicht?", "antworten": ["Sicherheitsgurte nur auf den Vordersitzen, Warndreieck und Verbandkasten nach Wahl des Unternehmers; zusätzlich ein Funkgerät (§ 35a StVZO).", "Sicherheitsgurte (§ 35a), Warndreieck und Warnweste (§ 53a), Verbandkasten (§ 35h StVZO); zusätzlich für Taxen ein Fahrpreisanzeiger (§ 28 BOKraft).", "Sicherheitsgurte (§ 35a), Feuerlöscher und Rettungsdecke (§ 35h StVZO); zusätzlich für Taxen eine Alarmanlage (§ 28 BOKraft)."], "richtig": 1, "erklaerung": "Sicherheitsgurte (§ 35a), Warndreieck und Warnweste (§ 53a), Verbandkasten (§ 35h StVZO); zusätzlich für Taxen ein Fahrpreisanzeiger (§ 28 BOKraft).", "schwierigkeit": "mittel"}, {"id": 359, "gesetz": "StraßenGesetz", "frage": "#0359 Welche Anforderungen gelten für die Lenkung eines Fahrzeugs?", "antworten": ["Sie muss leichtes und sicheres Lenken gewährleisten, wenn nötig mit Lenkhilfe; bei deren Versagen muss die Lenkbarkeit erhalten bleiben (§ 38 StVZO).", "Sie muss zwingend mit einer Lenkhilfe ausgestattet sein; bei deren Versagen darf nur noch mit höchstens 50 km/h weitergefahren werden (§ 38 StVZO).", "Sie muss leichtes Lenken ermöglichen; ein Lenkradspiel von bis zu 30 Grad ist zulässig und die Lenkung wird nur bei der HU geprüft (§ 36 StVZO)."], "richtig": 0, "erklaerung": "Sie muss leichtes und sicheres Lenken gewährleisten, wenn nötig mit Lenkhilfe; bei deren Versagen muss die Lenkbarkeit erhalten bleiben (§ 38 StVZO).", "schwierigkeit": "schwer"}, {"id": 360, "gesetz": "StraßenGesetz", "frage": "#0360 Welche Anforderungen gelten für die Bereifung eines Fahrzeugs?", "antworten": ["Die Profiltiefe wird nur bei der HU geprüft; Reifen verschiedener Bauart dürfen beliebig gemischt werden (§ 36 StVZO).", "Reifen müssen eine ausreichende Profiltiefe haben und den Witterungsverhältnissen entsprechen (§ 36 StVZO).", "Reifen müssen bei Taxis nach 50.000 km erneuert werden, unabhängig vom Zustand (§ 36 StVZO)."], "richtig": 1, "erklaerung": "Reifen müssen eine ausreichende Profiltiefe haben und den Witterungsverhältnissen entsprechen (§ 36 StVZO).", "schwierigkeit": "leicht"}, {"id": 361, "gesetz": "StraßenGesetz", "frage": "#0361 Welche lichttechnischen Einrichtungen müssen Taxis haben?", "antworten": ["Abblendlicht, Schlussleuchten und Bremsleuchten; Warnblinkanlage nur bei Fahrten außerhalb geschlossener Ortschaften, zusätzlich Nebelschlussleuchte und Zusatzscheinwerfer (§§ 49a ff. StVZO).", "Scheinwerfer für Fern- und Abblendlicht, Begrenzungs-, Schluss- und Bremsleuchten, Fahrtrichtungsanzeiger, Warnblinkanlage und Kennzeichenbeleuchtung (§§ 49a ff. StVZO), zusätzlich das beleuchtbare Taxischild (§ 26 BOKraft).", "Scheinwerfer für Fern- und Abblendlicht, Schlussleuchten, Fahrtrichtungsanzeiger und Kennzeichenbeleuchtung (§§ 49a ff. StVZO), zusätzlich ein blaues Rundumlicht für Krankenfahrten (§ 26 BOKraft)."], "richtig": 1, "erklaerung": "Scheinwerfer für Fern- und Abblendlicht, Begrenzungs-, Schluss- und Bremsleuchten, Fahrtrichtungsanzeiger, Warnblinkanlage und Kennzeichenbeleuchtung (§§ 49a ff. StVZO), zusätzlich das beleuchtbare Taxischild (§ 26 BOKraft).", "schwierigkeit": "mittel"}, {"id": 362, "gesetz": "StraßenGesetz", "frage": "#0362 Wann darf ein Taxi eine zusätzliche Beleuchtung nutzen?", "antworten": ["Nur mit Einzelgenehmigung der Gemeinde, die für jedes Taxi, auch für das Taxischild, neu zu beantragen ist (§ 49a Abs. 2 StVZO).", "Immer, wenn sie weder blendet noch rot oder blau ist; Werbebeleuchtung ist ausdrücklich erlaubt (§ 49a Abs. 1 StVZO).", "Nur wenn sie vorgeschrieben oder für zulässig erklärt ist, z. B. das Taxischild nach § 26 Abs. 1 Nr. 2 BOKraft (§ 49a Abs. 1 StVZO)."], "richtig": 2, "erklaerung": "Nur wenn sie vorgeschrieben oder für zulässig erklärt ist, z. B. das Taxischild nach § 26 Abs. 1 Nr. 2 BOKraft (§ 49a Abs. 1 StVZO).", "schwierigkeit": "schwer"}, {"id": 363, "gesetz": "StraßenGesetz", "frage": "#0363 Welche Farbe muss das Taxidachzeichen haben, wenn es eingeschaltet ist?", "antworten": ["Grün: grüne Aufschrift „Taxi“ auf weißem Grund, die Innenbeleuchtung blinkt während der Fahrt (§ 26 BOKraft).", "Weiß: weiße Aufschrift „Taxi“ auf blauem Grund, die Innenbeleuchtung strahlt weißes Dauerlicht ab (§ 26 Abs. 1 Nr. 2 i. V. m. Anlage 1 BOKraft).", "Gelb: gelbe Aufschrift „Taxi“ auf schwarzem Grund, die Innenbeleuchtung strahlt gelbes Dauerlicht ab (§ 26 Abs. 1 Nr. 2 i. V. m. Anlage 1 BOKraft)."], "richtig": 2, "erklaerung": "Gelb: gelbe Aufschrift „Taxi“ auf schwarzem Grund, die Innenbeleuchtung strahlt gelbes Dauerlicht ab (§ 26 Abs. 1 Nr. 2 i. V. m. Anlage 1 BOKraft).", "schwierigkeit": "leicht"}, {"id": 364, "gesetz": "StraßenGesetz", "frage": "#0364 Wann muss die Warnblinkanlage eingeschaltet werden?", "antworten": ["Bei Nebel und bei Dunkelheit außerhalb geschlossener Ortschaften; am Stauende ist sie nicht zulässig (§ 16 StVO).", "Bei jedem Halten in zweiter Reihe und bei jedem Ein- und Aussteigen von Fahrgästen (§ 15 StVO).", "Beim Liegenbleiben an unübersichtlicher Stelle und beim Abschleppen; außerdem darf sie zur Warnung anderer, z. B. am Stauende, benutzt werden (§§ 15, 15a, 16 Abs. 2 StVO)."], "richtig": 2, "erklaerung": "Beim Liegenbleiben an unübersichtlicher Stelle und beim Abschleppen; außerdem darf sie zur Warnung anderer, z. B. am Stauende, benutzt werden (§§ 15, 15a, 16 Abs. 2 StVO).", "schwierigkeit": "mittel"}, {"id": 365, "gesetz": "StraßenGesetz", "frage": "#0365 Welche Beleuchtungseinrichtungen sind bei schlechten Sichtverhältnissen vorgeschrieben?", "antworten": ["Bei Sichtweite unter 150 m die Nebelschlussleuchte; bei Nebel, Schneefall oder Regen sind Nebelscheinwerfer statt Abblendlicht Pflicht (§ 17 Abs. 3 StVO).", "Bei erheblicher Sichtbehinderung durch Nebel, Schneefall oder Regen Abblendlicht (Nebelscheinwerfer zulässig); Nebelschlussleuchte nur bei Sichtweite unter 50 m durch Nebel (§ 17 Abs. 3 StVO).", "Bei Dunkelheit Abblendlicht, bei Regen zusätzlich die Nebelschlussleuchte ab 100 m Sichtweite; bei Nebel tagsüber genügt das Standlicht (§ 17 Abs. 1 StVO)."], "richtig": 1, "erklaerung": "Bei erheblicher Sichtbehinderung durch Nebel, Schneefall oder Regen Abblendlicht (Nebelscheinwerfer zulässig); Nebelschlussleuchte nur bei Sichtweite unter 50 m durch Nebel (§ 17 Abs. 3 StVO).", "schwierigkeit": "schwer"}, {"id": 366, "gesetz": "StraßenGesetz", "frage": "#0366 Welche Bremsen muss ein Fahrzeug haben?", "antworten": ["Nur eine Betriebsbremse; eine Feststellbremse ist nur bei Lkw und Bussen vorgeschrieben (§ 41 StVZO).", "Eine Betriebsbremse, eine Feststellbremse und ggf. eine Hilfsbremse (§ 41 StVZO).", "Eine Betriebsbremse und eine Motorbremse als Dauerbremse, jeweils mit eigener Prüfplakette (§ 29 StVZO)."], "richtig": 1, "erklaerung": "Eine Betriebsbremse, eine Feststellbremse und ggf. eine Hilfsbremse (§ 41 StVZO).", "schwierigkeit": "leicht"}, {"id": 367, "gesetz": "StraßenGesetz", "frage": "#0367 Was passiert, wenn die Bremsanlage nicht mehr vorschriftsmäßig funktioniert?", "antworten": ["Das Fahrzeug darf bis zur nächsten Werkstatt mit höchstens 30 km/h weitergefahren werden (§ 31 Abs. 2 StVZO, § 23 StVO).", "Der Fahrer darf Fahrgäste nur noch auf Kurzstrecken befördern; der Halter muss den Mangel binnen 14 Tagen beheben lassen (§ 29 StVZO).", "Das Fahrzeug darf nicht in Betrieb genommen werden; der Halter darf dies nicht anordnen oder zulassen (§ 31 Abs. 2 StVZO, § 23 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "Das Fahrzeug darf nicht in Betrieb genommen werden; der Halter darf dies nicht anordnen oder zulassen (§ 31 Abs. 2 StVZO, § 23 Abs. 1 StVO).", "schwierigkeit": "mittel"}, {"id": 368, "gesetz": "StraßenGesetz", "frage": "#0368 Was ist ein Antiblockiersystem (ABS)?", "antworten": ["Ein System, das beim Anfahren am Berg ein Zurückrollen des Fahrzeugs verhindert (§ 41b StVZO).", "Ein System, das bei Schleudergefahr einzelne Räder gezielt abbremst und so das Ausbrechen verhindert (§ 41b StVZO).", "Ein System, das das Blockieren der Räder beim Bremsen verhindert (§ 41b StVZO)."], "richtig": 2, "erklaerung": "Ein System, das das Blockieren der Räder beim Bremsen verhindert (§ 41b StVZO).", "schwierigkeit": "schwer"}, {"id": 369, "gesetz": "StraßenGesetz", "frage": "#0369 Welche Vorschrift gilt für die Mitführung von Unterlegkeilen?", "antworten": ["Kfz über 4 t zulässiges Gesamtgewicht brauchen mindestens einen Unterlegkeil, drei- und mehrachsige Fahrzeuge mindestens zwei (§ 41 Abs. 14 StVZO).", "Taxen und Mietwagen müssen stets zwei Unterlegkeile mitführen, andere Pkw keine (§ 41 Abs. 14 StVZO).", "Alle Kfz über 2,8 t zulässiges Gesamtgewicht benötigen vier Unterlegkeile (§ 41 Abs. 14 StVZO)."], "richtig": 0, "erklaerung": "Kfz über 4 t zulässiges Gesamtgewicht brauchen mindestens einen Unterlegkeil, drei- und mehrachsige Fahrzeuge mindestens zwei (§ 41 Abs. 14 StVZO).", "schwierigkeit": "leicht"}, {"id": 370, "gesetz": "StraßenGesetz", "frage": "#0370 Welche Funktion erfüllt der Geschwindigkeitsbegrenzer?", "antworten": ["Er hält automatisch den Abstand zum Vorausfahrenden ein und bremst bei Gefahr selbstständig (§ 57c StVZO).", "Er verhindert, dass das Fahrzeug eine bestimmte Geschwindigkeit überschreitet (§ 57c StVZO).", "Er zeichnet Geschwindigkeit sowie Lenk- und Ruhezeiten des Fahrers auf (§ 57c StVZO)."], "richtig": 1, "erklaerung": "Er verhindert, dass das Fahrzeug eine bestimmte Geschwindigkeit überschreitet (§ 57c StVZO).", "schwierigkeit": "mittel"}, {"id": 371, "gesetz": "StraßenGesetz", "frage": "#0371 Wann muss ein Fahrzeug zur Hauptuntersuchung (HU)?", "antworten": ["Pkw erstmals nach 36 Monaten, dann alle 24 Monate; auch Taxis und Mietwagen, solange sie weniger als 100.000 km jährlich fahren (§ 29 i. V. m. Anlage VIII StVZO).", "Pkw allgemein erstmals nach 36 Monaten, dann alle 24 Monate; Taxis und Mietwagen (Personenbeförderung nach PBefG) jedes Jahr (§ 29 i. V. m. Anlage VIII Nr. 2.1.2 StVZO).", "Pkw erstmals nach 24 Monaten, dann alle 12 Monate; Taxis und Mietwagen alle sechs Monate (§ 29 i. V. m. Anlage VIII Nr. 2.1.2 StVZO)."], "richtig": 1, "erklaerung": "Pkw allgemein erstmals nach 36 Monaten, dann alle 24 Monate; Taxis und Mietwagen (Personenbeförderung nach PBefG) jedes Jahr (§ 29 i. V. m. Anlage VIII Nr. 2.1.2 StVZO).", "schwierigkeit": "schwer"}, {"id": 372, "gesetz": "StraßenGesetz", "frage": "#0372 Was wird bei der Hauptuntersuchung überprüft?", "antworten": ["Nur den Zustand von Lack und Innenraum sowie die Sauberkeit des Fahrzeugs (§ 29 StVZO).", "Die Verkehrs- und Betriebssicherheit sowie die Umweltverträglichkeit des Fahrzeugs (§ 29 StVZO).", "Die Fahrtüchtigkeit des Fahrers und seine Fahrerlaubnis (§ 29 StVZO)."], "richtig": 1, "erklaerung": "Die Verkehrs- und Betriebssicherheit sowie die Umweltverträglichkeit des Fahrzeugs (§ 29 StVZO).", "schwierigkeit": "leicht"}, {"id": 373, "gesetz": "StraßenGesetz", "frage": "#0373 Welche Plakette wird nach bestandener HU vergeben?", "antworten": ["Die Prüfplakette (§ 29 StVZO).", "Die Betriebsplakette der Genehmigungsbehörde für Taxis (§ 13 PBefG).", "Die grüne Umweltplakette (§ 40 BImSchG)."], "richtig": 0, "erklaerung": "Die Prüfplakette (§ 29 StVZO).", "schwierigkeit": "mittel"}, {"id": 374, "gesetz": "StraßenGesetz", "frage": "#0374 Wann muss ein Taxi zur Abgasuntersuchung (AU)?", "antworten": ["Die Abgasuntersuchung ist Teil der HU und für Taxis damit jährlich fällig (§ 29 i. V. m. Anlage VIII StVZO).", "Nur bei Fahrzeugen mit Dieselmotor; Benzin-Taxis sind von der Abgasuntersuchung ausgenommen (§ 29 i. V. m. Anlage VIII StVZO).", "Sie ist unabhängig von der HU alle zwei Jahre fällig, auch für Taxis im 24-Monats-Rhythmus (§ 47a StVZO)."], "richtig": 0, "erklaerung": "Die Abgasuntersuchung ist Teil der HU und für Taxis damit jährlich fällig (§ 29 i. V. m. Anlage VIII StVZO).", "schwierigkeit": "schwer"}, {"id": 375, "gesetz": "StraßenGesetz", "frage": "#0375 Welche Konsequenzen hat eine nicht bestandene Hauptuntersuchung?", "antworten": ["Die Taxikonzession erlischt sofort und das Fahrzeug wird eingezogen (§ 29 StVZO).", "Es erhält eine Verwarnung und darf weiterfahren, bis die nächste HU in zwölf Monaten ansteht (§ 29 StVZO).", "Das Fahrzeug muss repariert und erneut geprüft werden; ggf. kann die Zulassung entzogen werden (§ 29 StVZO)."], "richtig": 2, "erklaerung": "Das Fahrzeug muss repariert und erneut geprüft werden; ggf. kann die Zulassung entzogen werden (§ 29 StVZO).", "schwierigkeit": "leicht"}, {"id": 376, "gesetz": "StraßenGesetz", "frage": "#0376 Müssen Taxis mit einem Fahrtenschreiber ausgestattet sein?", "antworten": ["Nur bei Fahrten über 50 km Entfernung vom Betriebssitz, sonst genügt der Fahrpreisanzeiger (§ 28 BOKraft).", "Ja, jedes Taxi braucht einen digitalen Fahrtenschreiber mit Fahrerkarte (VO (EU) Nr. 165/2014).", "Nein, weder Taxis noch Mietwagen; die Pflicht gilt erst für Fahrzeuge zur Personenbeförderung mit mehr als 9 Sitzplätzen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006, VO (EU) Nr. 165/2014)."], "richtig": 2, "erklaerung": "Nein, weder Taxis noch Mietwagen; die Pflicht gilt erst für Fahrzeuge zur Personenbeförderung mit mehr als 9 Sitzplätzen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006, VO (EU) Nr. 165/2014).", "schwierigkeit": "mittel"}, {"id": 377, "gesetz": "StraßenGesetz", "frage": "#0377 Welche Kennzeichnung müssen Taxis haben?", "antworten": ["Elfenbeinfarbener Anstrich nur in Gemeinden mit mehr als 100.000 Einwohnern; Taxischild und Ordnungsnummer sind überall freiwillig (§ 25 BOKraft).", "Weißer Anstrich (RAL 9010), beleuchtbares Taxischild auf dem Dach und Ordnungsnummer an der linken oberen Ecke der Windschutzscheibe (§§ 26, 27 BOKraft).", "Hellelfenbeinfarbener Anstrich (RAL 1015), beleuchtbares Taxischild auf dem Dach und Ordnungsnummer an der rechten unteren Ecke der Heckscheibe (§§ 26, 27 BOKraft)."], "richtig": 2, "erklaerung": "Hellelfenbeinfarbener Anstrich (RAL 1015), beleuchtbares Taxischild auf dem Dach und Ordnungsnummer an der rechten unteren Ecke der Heckscheibe (§§ 26, 27 BOKraft).", "schwierigkeit": "schwer"}, {"id": 378, "gesetz": "StraßenGesetz", "frage": "#0378 Welche Anforderungen gelten für die Sitze in einem Taxi?", "antworten": ["Sie müssen mit Lederbezug und Sitzheizung ausgestattet sein (§ 35a StVZO).", "Sie müssen stabil, bequem und sicher befestigt sein (§ 35a StVZO).", "Nur der Fahrersitz muss gesichert sein; die Rücksitze dürfen lose eingebaut werden (§ 35a StVZO)."], "richtig": 1, "erklaerung": "Sie müssen stabil, bequem und sicher befestigt sein (§ 35a StVZO).", "schwierigkeit": "leicht"}, {"id": 379, "gesetz": "StraßenGesetz", "frage": "#0379 Was muss ein Taxi-Unternehmer bei Änderungen am Fahrzeug beachten?", "antworten": ["Bei Änderungen, durch die die Betriebserlaubnis erlischt, ist eine Änderungsabnahme bzw. Begutachtung durch einen amtlich anerkannten Sachverständigen oder Prüfingenieur nötig; die Zulassungsbehörde ist ggf. zu informieren (§ 19 StVZO).", "Änderungen sind nur beim Motortausch meldepflichtig; Fahrwerk, Räder und Karosserie darf er frei verändern (§ 19 StVZO).", "Er muss jede Änderung binnen einer Woche der IHK melden; eine Abnahme ist nicht erforderlich (§ 13 PBefG)."], "richtig": 0, "erklaerung": "Bei Änderungen, durch die die Betriebserlaubnis erlischt, ist eine Änderungsabnahme bzw. Begutachtung durch einen amtlich anerkannten Sachverständigen oder Prüfingenieur nötig; die Zulassungsbehörde ist ggf. zu informieren (§ 19 StVZO).", "schwierigkeit": "mittel"}, {"id": 380, "gesetz": "StraßenGesetz", "frage": "#0380 Welche Vorschriften gelten für die Sicherheitsausstattung eines Mietwagens?", "antworten": ["Es gilt die für Pkw vorgeschriebene Ausrüstung (u. a. Gurte, Verbandkasten, Warndreieck, Warnweste nach §§ 35a, 35h, 53a StVZO) sowie die BOKraft, z. B. Ordnungsnummer nach § 27 Abs. 3 BOKraft.", "Es gelten strengere Vorschriften als für Taxis: zusätzlich Feuerlöscher und Rettungsdecke nach § 35h StVZO sowie ein Taxameter nach § 28 BOKraft.", "Mietwagen sind von der Pflicht zu Warndreieck und Warnweste befreit, weil sie nur auf Vorbestellung fahren (§ 53a StVZO, § 49 PBefG)."], "richtig": 0, "erklaerung": "Es gilt die für Pkw vorgeschriebene Ausrüstung (u. a. Gurte, Verbandkasten, Warndreieck, Warnweste nach §§ 35a, 35h, 53a StVZO) sowie die BOKraft, z. B. Ordnungsnummer nach § 27 Abs. 3 BOKraft.", "schwierigkeit": "schwer"}, {"id": 401, "gesetz": "FPersG", "frage": "#0401 Für wen gilt das Fahrpersonalgesetz (FPersG)?", "antworten": ["Nur für Fahrer von Lkw über 3,5 t im gewerblichen Güterverkehr (§ 1 Abs. 1 FPersG).", "Nur für selbstständige Fahrer, die Taxi oder Mietwagen auf eigene Rechnung fahren (§ 2 FPersG).", "Für Fahrer, Beifahrer und Schaffner von Kraftfahrzeugen und Straßenbahnen, die am öffentlichen Verkehr teilnehmen (§ 1 Abs. 1 FPersG)."], "richtig": 2, "erklaerung": "Für Fahrer, Beifahrer und Schaffner von Kraftfahrzeugen und Straßenbahnen, die am öffentlichen Verkehr teilnehmen (§ 1 Abs. 1 FPersG).", "schwierigkeit": "leicht"}, {"id": 402, "gesetz": "FPersG", "frage": "#0402 Welche Fahrzeuge sind vom FPersG ausgenommen?", "antworten": ["Fahrpersonal von Dienstfahrzeugen der Bundeswehr, Feuerwehr, des Katastrophenschutzes, der Polizei und des Zolls sowie von Kfz bis 2,8 t, außer es steht in einem Arbeitsverhältnis nach dem ArbZG (§ 1 Abs. 2 FPersG).", "Nur Fahrzeuge der Bundeswehr und der Polizei; Feuerwehr und Zoll unterliegen dem FPersG (§ 1 Abs. 2 FPersG).", "Fahrzeuge von Taxiunternehmen, die weniger als 50 km vom Betriebssitz entfernt eingesetzt werden (§ 1 Abs. 2 FPersG)."], "richtig": 0, "erklaerung": "Fahrpersonal von Dienstfahrzeugen der Bundeswehr, Feuerwehr, des Katastrophenschutzes, der Polizei und des Zolls sowie von Kfz bis 2,8 t, außer es steht in einem Arbeitsverhältnis nach dem ArbZG (§ 1 Abs. 2 FPersG).", "schwierigkeit": "mittel"}, {"id": 403, "gesetz": "FPersG", "frage": "#0403 Was regelt das FPersG vorrangig?", "antworten": ["Es regelt Tarifverträge, Urlaubsanspruch und Kündigungsschutz des Fahrpersonals (§ 2 FPersG).", "Es regelt Fahrerlaubnisklassen, Fahrerlaubnisentzug und Punkte für Berufskraftfahrer (§ 2 FPersG).", "Es regelt die Arbeitszeiten, Lenkzeiten, Ruhezeiten und Fahrtunterbrechungen des Fahrpersonals (§ 2 FPersG)."], "richtig": 2, "erklaerung": "Es regelt die Arbeitszeiten, Lenkzeiten, Ruhezeiten und Fahrtunterbrechungen des Fahrpersonals (§ 2 FPersG).", "schwierigkeit": "schwer"}, {"id": 404, "gesetz": "FPersG", "frage": "#0404 Welche gesetzliche Grundlage hat das FPersG für Arbeitszeiten?", "antworten": ["Es gibt keine eigene Regelung; für Fahrpersonal gilt ausschließlich das Arbeitszeitgesetz (§ 1 FPersG).", "Die Arbeitszeiten werden allein durch Arbeitsvertrag und Mindestlohngesetz geregelt (§ 1 MiLoG).", "Die Regelungen zur Arbeitszeitgestaltung gehen dem allgemeinen Arbeitszeitgesetz vor (§ 1 Abs. 1 FPersG)."], "richtig": 2, "erklaerung": "Die Regelungen zur Arbeitszeitgestaltung gehen dem allgemeinen Arbeitszeitgesetz vor (§ 1 Abs. 1 FPersG).", "schwierigkeit": "leicht"}, {"id": 405, "gesetz": "FPersG", "frage": "#0405 Welche maximale tägliche Lenkzeit ist für Fahrpersonal erlaubt?", "antworten": ["10 Stunden, die auf Wunsch des Fahrers beliebig um bis zu 2 Stunden verlängert werden dürfen (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "8 Stunden, Überschreitungen sind nur mit Genehmigung der Aufsichtsbehörde möglich (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "9 Stunden, zweimal pro Woche bis zu 10 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "9 Stunden, zweimal pro Woche bis zu 10 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "schwierigkeit": "mittel"}, {"id": 406, "gesetz": "FPersG", "frage": "#0406 Wie lange darf die maximale Wochenlenkzeit betragen?", "antworten": ["Maximal 48 Stunden, im Durchschnitt von vier Monaten, ohne Ausnahme (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 60 Stunden, jedoch nur bei Doppelbesetzung des Fahrzeugs (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 56 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "Maximal 56 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "schwierigkeit": "schwer"}, {"id": 407, "gesetz": "FPersG", "frage": "#0407 Wie lange beträgt die maximale Gesamtlenkzeit in zwei aufeinanderfolgenden Wochen?", "antworten": ["Maximal 100 Stunden, ohne Ausnahmen (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 90 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 112 Stunden, wenn in der zweiten Woche die Wochenruhezeit verlängert wird (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 1, "erklaerung": "Maximal 90 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "schwierigkeit": "leicht"}, {"id": 408, "gesetz": "FPersG", "frage": "#0408 Welche Fahrtunterbrechung ist für Berufskraftfahrer vorgeschrieben?", "antworten": ["Mindestens 60 Minuten nach 4,5 Stunden Lenkzeit, nur als zusammenhängende Pause (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Mindestens 45 Minuten nach 4,5 Stunden Lenkzeit, aufteilbar in 15 und 30 Minuten (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Mindestens 30 Minuten nach 6 Stunden Lenkzeit, aufteilbar in zwei Pausen zu je 15 Minuten (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 1, "erklaerung": "Mindestens 45 Minuten nach 4,5 Stunden Lenkzeit, aufteilbar in 15 und 30 Minuten (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "schwierigkeit": "mittel"}, {"id": 409, "gesetz": "FPersG", "frage": "#0409 Wie lang muss die tägliche Ruhezeit mindestens sein?", "antworten": ["9 Stunden, die nicht verkürzt werden dürfen (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "12 Stunden, einmal pro Woche verkürzbar auf 10 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "11 Stunden, dreimal pro Woche verkürzbar auf 9 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "11 Stunden, dreimal pro Woche verkürzbar auf 9 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "schwierigkeit": "schwer"}, {"id": 410, "gesetz": "FPersG", "frage": "#0410 Was gilt für die wöchentliche Ruhezeit des Fahrpersonals?", "antworten": ["Mindestens 36 Stunden, nicht verkürzbar (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Mindestens 24 Stunden, jede Woche jeweils am Sonntag (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Mindestens 45 Stunden, auf 24 Stunden verkürzbar, wenn ausgeglichen wird (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "Mindestens 45 Stunden, auf 24 Stunden verkürzbar, wenn ausgeglichen wird (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "schwierigkeit": "leicht"}, {"id": 411, "gesetz": "FPersG", "frage": "#0411 Darf eine reduzierte wöchentliche Ruhezeit im Fahrzeug verbracht werden?", "antworten": ["Nein, die Ruhezeit muss immer in einer festen Unterkunft verbracht werden, auch bei vorhandener Schlafkabine (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Ja, im Fahrzeug stets, sofern es auf einem bewachten öffentlichen Parkplatz steht (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Nein, es sei denn, das Fahrzeug ist mit einer geeigneten Schlafmöglichkeit ausgestattet (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "Nein, es sei denn, das Fahrzeug ist mit einer geeigneten Schlafmöglichkeit ausgestattet (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "schwierigkeit": "mittel"}, {"id": 412, "gesetz": "FPersG", "frage": "#0412 Was ist die maximale Schichtzeit für Fahrpersonal?", "antworten": ["Es gibt keine Begrenzung; maßgeblich ist allein, dass Lenkzeiten und Pausen eingehalten werden (Art. 6 VO (EG) Nr. 561/2006).", "13 Stunden innerhalb von 24 Stunden (bei 11 Stunden Ruhezeit), bei verkürzter Ruhezeit von 9 Stunden höchstens dreimal zwischen zwei Wochenruhezeiten bis 15 Stunden (Art. 8 VO (EG) Nr. 561/2006).", "12 Stunden innerhalb von 24 Stunden, bei verkürzter Ruhezeit höchstens zweimal bis zu 14 Stunden (Art. 8 VO (EG) Nr. 561/2006)."], "richtig": 1, "erklaerung": "13 Stunden innerhalb von 24 Stunden (bei 11 Stunden Ruhezeit), bei verkürzter Ruhezeit von 9 Stunden höchstens dreimal zwischen zwei Wochenruhezeiten bis 15 Stunden (Art. 8 VO (EG) Nr. 561/2006).", "schwierigkeit": "schwer"}, {"id": 413, "gesetz": "FPersG", "frage": "#0413 Wann ist eine Pause innerhalb der Arbeitszeit erforderlich?", "antworten": ["Spätestens nach 6 Stunden Arbeitszeit; insgesamt 30 Minuten bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden (§ 4 ArbZG).", "Nur bei mehr als 10 Stunden Arbeitszeit eine zusammenhängende Pause von 60 Minuten (§ 3 ArbZG).", "Spätestens nach 8 Stunden Arbeitszeit; insgesamt 20 Minuten bei mehr als 8 Stunden (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "Spätestens nach 6 Stunden Arbeitszeit; insgesamt 30 Minuten bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden (§ 4 ArbZG).", "schwierigkeit": "leicht"}, {"id": 414, "gesetz": "FPersG", "frage": "#0414 Welche Behörde ist für die Überwachung des Fahrpersonals zuständig?", "antworten": ["Das Kraftfahrt-Bundesamt in Flensburg (§ 4 Abs. 1 FPersG).", "Die durch die Landesregierung bestimmten Aufsichtsbehörden (§ 4 Abs. 1 FPersG).", "Die örtliche Industrie- und Handelskammer des Betriebssitzes (§ 4 Abs. 1 FPersG)."], "richtig": 1, "erklaerung": "Die durch die Landesregierung bestimmten Aufsichtsbehörden (§ 4 Abs. 1 FPersG).", "schwierigkeit": "mittel"}, {"id": 415, "gesetz": "FPersG", "frage": "#0415 Welche Aufgaben haben die Aufsichtsbehörden?", "antworten": ["Kontrolle von Arbeitszeiten, Fahrtenschreibern, Tätigkeitsnachweisen und Ruhezeiten (§ 4 Abs. 1a FPersG).", "Erteilung und Entzug der Taxikonzession sowie Überwachung der Tarifpflicht (§ 4 Abs. 1a FPersG).", "Abnahme der Hauptuntersuchung sowie Prüfung der Fahrerlaubnisse und der Fahreignung (§ 4 Abs. 1a FPersG)."], "richtig": 0, "erklaerung": "Kontrolle von Arbeitszeiten, Fahrtenschreibern, Tätigkeitsnachweisen und Ruhezeiten (§ 4 Abs. 1a FPersG).", "schwierigkeit": "schwer"}, {"id": 416, "gesetz": "FPersG", "frage": "#0416 Welche Verpflichtungen haben Unternehmer bezüglich Fahrerkarten?", "antworten": ["Unternehmer müssen die Daten der Fahrerkarten regelmäßig auslesen und ein Jahr lang speichern (§ 4 Abs. 3 FPersG).", "Sie müssen die Daten nur auf Anforderung der Polizei auslesen und nach 28 Tagen wieder löschen (§ 4 Abs. 3 FPersG).", "Unternehmer müssen die Fahrerkarten jährlich bei der Zulassungsbehörde verlängern lassen (§ 4 Abs. 3 FPersG)."], "richtig": 0, "erklaerung": "Unternehmer müssen die Daten der Fahrerkarten regelmäßig auslesen und ein Jahr lang speichern (§ 4 Abs. 3 FPersG).", "schwierigkeit": "leicht"}, {"id": 417, "gesetz": "FPersG", "frage": "#0417 Welche Strafen drohen Unternehmen bei Verstößen gegen Lenk- und Ruhezeiten?", "antworten": ["Verwarnungsgelder bis zu 500 € je Verstoß, ohne Eintragung (§ 8 FPersG).", "Geldbußen bis zu 100.000 €, bei Wiederholung zusätzlich Freiheitsstrafe bis zu zwei Jahren (§ 8 FPersG).", "Geldbußen bis zu 30.000 € (§ 8 FPersG)."], "richtig": 2, "erklaerung": "Geldbußen bis zu 30.000 € (§ 8 FPersG).", "schwierigkeit": "mittel"}, {"id": 418, "gesetz": "FPersG", "frage": "#0418 Welche Strafen drohen Fahrern bei Verstößen gegen Lenk- und Ruhezeiten?", "antworten": ["Geldbußen bis zu 5.000 € (§ 8 FPersG).", "Freiheitsstrafe bis zu einem Jahr bereits bei einmaliger Überschreitung der Lenkzeit (§ 8 FPersG).", "Verwarnungsgelder bis zu 55 € sowie Punkte in Flensburg (§ 8 FPersG)."], "richtig": 0, "erklaerung": "Geldbußen bis zu 5.000 € (§ 8 FPersG).", "schwierigkeit": "schwer"}, {"id": 419, "gesetz": "FPersG", "frage": "#0419 Welche Fahrzeuge müssen mit einem digitalen Fahrtenschreiber ausgestattet sein?", "antworten": ["Güterkraftfahrzeuge über 3,5 t (seit 1.7.2026 auch über 2,5 t im grenzüberschreitenden Güterverkehr) und Fahrzeuge für mehr als 9 Personen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006 i. V. m. VO (EU) Nr. 165/2014).", "Alle Pkw und Taxen, die gewerblich Personen befördern, unabhängig von der Sitzplatzzahl (Art. 2 VO (EG) Nr. 561/2006 i. V. m. VO (EU) Nr. 165/2014).", "Nur Fahrzeuge für mehr als 16 Personen und Güterkraftfahrzeuge über 12 t (Art. 3 VO (EG) Nr. 561/2006)."], "richtig": 0, "erklaerung": "Güterkraftfahrzeuge über 3,5 t (seit 1.7.2026 auch über 2,5 t im grenzüberschreitenden Güterverkehr) und Fahrzeuge für mehr als 9 Personen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006 i. V. m. VO (EU) Nr. 165/2014).", "schwierigkeit": "leicht"}, {"id": 420, "gesetz": "FPersG", "frage": "#0420 Wie lange müssen Fahrtenschreiberdaten aufbewahrt werden?", "antworten": ["6 Monate ab dem Zeitpunkt des Kopierens; Schaublätter und Ausdrucke 3 Monate (§ 4 Abs. 3 FPersG).", "1 Jahr ab dem Zeitpunkt des Kopierens; Schaublätter und Ausdrucke 1 Jahr nach Ablauf der Mitführpflicht (§ 4 Abs. 3 FPersG).", "5 Jahre ab dem Zeitpunkt des Auslesens, auch bei Schaublättern und Ausdrucken (§ 4 Abs. 3 FPersG)."], "richtig": 1, "erklaerung": "1 Jahr ab dem Zeitpunkt des Kopierens; Schaublätter und Ausdrucke 1 Jahr nach Ablauf der Mitführpflicht (§ 4 Abs. 3 FPersG).", "schwierigkeit": "mittel"}, {"id": 421, "gesetz": "FPersG", "frage": "#0421 Wer ist verpflichtet, Tätigkeitsnachweise mitzuführen?", "antworten": ["Nur der Unternehmer; Fahrer müssen nichts mitführen, da die Daten im Unternehmen gespeichert werden (§ 4 FPersG).", "Alle Fahrer von Fahrzeugen über 2,8 t, jedoch nur mit Aufzeichnungen der letzten 7 Tage (Art. 36 VO (EU) Nr. 165/2014).", "Fahrer fahrtenschreiberpflichtiger Fahrzeuge: Fahrerkarte bzw. Schaublätter und Aufzeichnungen des laufenden Tages und der vorausgehenden 28 Tage (Art. 36 VO (EU) Nr. 165/2014); Fahrer von Kfz über 2,8 bis 3,5 t nach § 1 Abs. 6 FPersV."], "richtig": 2, "erklaerung": "Fahrer fahrtenschreiberpflichtiger Fahrzeuge: Fahrerkarte bzw. Schaublätter und Aufzeichnungen des laufenden Tages und der vorausgehenden 28 Tage (Art. 36 VO (EU) Nr. 165/2014); Fahrer von Kfz über 2,8 bis 3,5 t nach § 1 Abs. 6 FPersV.", "schwierigkeit": "schwer"}, {"id": 422, "gesetz": "FPersG", "frage": "#0422 Gelten die EU-Lenk- und Ruhezeiten auch für Taxi- und Mietwagenfahrer?", "antworten": ["Ja, die VO (EG) Nr. 561/2006 gilt für alle Fahrer, die Fahrgäste gewerblich befördern, unabhängig von der Fahrzeuggröße (Art. 2 VO (EG) Nr. 561/2006).", "Nein, die VO (EG) Nr. 561/2006 gilt in der Personenbeförderung erst für Fahrzeuge mit mehr als 9 Sitzplätzen einschließlich Fahrer; für angestellte Taxi- und Mietwagenfahrer gilt das Arbeitszeitgesetz (Art. 2 Abs. 1 Buchst. b VO (EG) Nr. 561/2006).", "Ja, aber nur für Mietwagenfahrer, nicht für Taxifahrer, da Taxis dem Pflichtfahrgebiet unterliegen (§ 47 PBefG)."], "richtig": 1, "erklaerung": "Nein, die VO (EG) Nr. 561/2006 gilt in der Personenbeförderung erst für Fahrzeuge mit mehr als 9 Sitzplätzen einschließlich Fahrer; für angestellte Taxi- und Mietwagenfahrer gilt das Arbeitszeitgesetz (Art. 2 Abs. 1 Buchst. b VO (EG) Nr. 561/2006).", "schwierigkeit": "leicht"}, {"id": 423, "gesetz": "FPersG", "frage": "#0423 Welche Nachweise müssen Mietwagenfahrer über ihre Arbeitszeiten führen?", "antworten": ["Der Arbeitgeber muss nur Überstunden dokumentieren, und zwar monatlich, und 6 Monate aufbewahren (§ 16 Abs. 2 ArbZG).", "Die Fahrer führen ein Fahrtenbuch mit allen Fahrstrecken, das der Arbeitgeber 10 Jahre aufbewahrt (§ 147 AO).", "Der Arbeitgeber muss Beginn, Ende und Dauer der täglichen Arbeitszeit bis zum 7. Folgetag aufzeichnen und 2 Jahre aufbewahren (§ 17 MiLoG i. V. m. § 2a SchwarzArbG); Arbeitszeit über 8 Stunden zusätzlich nach § 16 Abs. 2 ArbZG."], "richtig": 2, "erklaerung": "Der Arbeitgeber muss Beginn, Ende und Dauer der täglichen Arbeitszeit bis zum 7. Folgetag aufzeichnen und 2 Jahre aufbewahren (§ 17 MiLoG i. V. m. § 2a SchwarzArbG); Arbeitszeit über 8 Stunden zusätzlich nach § 16 Abs. 2 ArbZG.", "schwierigkeit": "mittel"}, {"id": 424, "gesetz": "FPersG", "frage": "#0424 Dürfen Fahrer im Akkord oder nach Fahrstrecke bezahlt werden?", "antworten": ["Ja, die Vergütung nach gefahrenen Kilometern ist zulässig, sofern der Mindestlohn eingehalten wird (§ 3 FPersG).", "Nein, angestellte Fahrer dürfen nicht nach Fahrstrecke oder Gütermenge entlohnt werden, auch nicht über Prämien; zulässig sind nur Vergütungen, die die Verkehrssicherheit nicht gefährden (§ 3 FPersG).", "Nur für selbstständige Fahrer ist dies verboten; bei angestellten Fahrern liegt die Vergütungsform im Ermessen des Arbeitgebers (§ 3 FPersG)."], "richtig": 1, "erklaerung": "Nein, angestellte Fahrer dürfen nicht nach Fahrstrecke oder Gütermenge entlohnt werden, auch nicht über Prämien; zulässig sind nur Vergütungen, die die Verkehrssicherheit nicht gefährden (§ 3 FPersG).", "schwierigkeit": "schwer"}, {"id": 425, "gesetz": "FPersG", "frage": "#0425 Welche Verantwortung trägt der Unternehmer bezüglich Lenk- und Ruhezeiten?", "antworten": ["Er muss sicherstellen, dass die Fahrer die Vorschriften einhalten (§ 4 FPersG).", "Keine; die Verantwortung liegt allein beim Fahrer, der die Zeiten selbst überwachen muss (§ 4 FPersG).", "Er haftet nur, wenn er den Fahrer persönlich zum Verstoß angewiesen hat (§ 4 FPersG)."], "richtig": 0, "erklaerung": "Er muss sicherstellen, dass die Fahrer die Vorschriften einhalten (§ 4 FPersG).", "schwierigkeit": "leicht"}, {"id": 426, "gesetz": "FPersG", "frage": "#0426 Welche Aufbewahrungspflichten haben Taxiunternehmer?", "antworten": ["Fahrtenschreiberdaten 5 Jahre (§ 4 FPersG), Arbeitszeitaufzeichnungen 1 Jahr (§ 17 MiLoG), Abrechnungen und Buchungsbelege 3 Jahre (§ 195 BGB).", "Fahrtenschreiberdaten und Schaublätter 1 Jahr (§ 4 Abs. 3 FPersG), Arbeitszeitaufzeichnungen 2 Jahre (§ 17 MiLoG), Abrechnungen und Buchungsbelege 8 Jahre (§ 147 AO).", "Fahrtenschreiberdaten 6 Monate (§ 4 FPersG), Arbeitszeitaufzeichnungen 5 Jahre (§ 17 MiLoG), Abrechnungen und Buchungsbelege 10 Jahre (§ 257 HGB)."], "richtig": 1, "erklaerung": "Fahrtenschreiberdaten und Schaublätter 1 Jahr (§ 4 Abs. 3 FPersG), Arbeitszeitaufzeichnungen 2 Jahre (§ 17 MiLoG), Abrechnungen und Buchungsbelege 8 Jahre (§ 147 AO).", "schwierigkeit": "mittel"}, {"id": 427, "gesetz": "FPersG", "frage": "#0427 Welche Ordnungswidrigkeiten können nach dem FPersG geahndet werden?", "antworten": ["Verstöße gegen Mindestlohn, Kündigungsfristen und Urlaubsregelungen (§ 8 FPersG).", "Fehlende Gewerbeanmeldung, nicht ausgehängte Tarife und fehlendes Taxischild (§ 8 FPersG).", "Verstöße gegen Lenkzeiten, Ruhezeiten, Fahrtenschreiberpflichten, Arbeitszeitregelungen (§ 8 FPersG)."], "richtig": 2, "erklaerung": "Verstöße gegen Lenkzeiten, Ruhezeiten, Fahrtenschreiberpflichten, Arbeitszeitregelungen (§ 8 FPersG).", "schwierigkeit": "schwer"}, {"id": 428, "gesetz": "FPersG", "frage": "#0428 Welche Behörde ist für die Ahndung von Verstößen zuständig?", "antworten": ["Das Kraftfahrt-Bundesamt, bundesweit einheitlich (§ 9 FPersG).", "Die nach Landesrecht zuständige Verwaltungsbehörde, in deren Bezirk der Betriebssitz liegt; das BALM nur bei Unternehmen ohne Sitz oder Niederlassung in Deutschland (§ 9 FPersG).", "Die Industrie- und Handelskammer des Betriebssitzes (§ 9 FPersG)."], "richtig": 1, "erklaerung": "Die nach Landesrecht zuständige Verwaltungsbehörde, in deren Bezirk der Betriebssitz liegt; das BALM nur bei Unternehmen ohne Sitz oder Niederlassung in Deutschland (§ 9 FPersG).", "schwierigkeit": "leicht"}, {"id": 429, "gesetz": "FPersG", "frage": "#0429 Wie hoch können Strafen für Unternehmen ausfallen, die Fahrer zu Verstößen anweisen?", "antworten": ["Bis zu 100.000 € und zusätzlich Entzug der Genehmigung (§ 8 FPersG).", "Bis zu 5.000 €, gleich hoch wie beim Fahrer (§ 8 FPersG).", "Bis zu 30.000 € (§ 8 FPersG)."], "richtig": 2, "erklaerung": "Bis zu 30.000 € (§ 8 FPersG).", "schwierigkeit": "mittel"}, {"id": 430, "gesetz": "FPersG", "frage": "#0430 Was kann passieren, wenn ein Fahrer falsche Tätigkeitsnachweise führt?", "antworten": ["Geldbuße bis 5.000 € (§ 8 Abs. 1 Nr. 2, Abs. 2 FPersG); die Manipulation von Fahrtenschreiberaufzeichnungen kann als Fälschung technischer Aufzeichnungen strafbar sein (§ 268 StGB).", "Verwarnungsgeld bis 55 €; strafrechtliche Folgen sind ausgeschlossen (§ 8 FPersG).", "Entzug der Fahrerlaubnis auf Lebenszeit nach § 69 StGB; ein Bußgeld ist ausgeschlossen (§ 8 FPersG)."], "richtig": 0, "erklaerung": "Geldbuße bis 5.000 € (§ 8 Abs. 1 Nr. 2, Abs. 2 FPersG); die Manipulation von Fahrtenschreiberaufzeichnungen kann als Fälschung technischer Aufzeichnungen strafbar sein (§ 268 StGB).", "schwierigkeit": "schwer"}, {"id": 451, "gesetz": "ArbZG", "frage": "#0451 Was ist der Zweck des Arbeitszeitgesetzes (ArbZG)?", "antworten": ["Die Festlegung von Mindestlohn, Urlaubsanspruch und Lohnfortzahlung im Krankheitsfall (§ 1 ArbZG).", "Den Schutz der Arbeitgeber vor Überstundenansprüchen und die Verlängerung der Ladenöffnungszeiten (§ 1 ArbZG).", "Sicherheit und Gesundheitsschutz der Arbeitnehmer bei der Arbeitszeitgestaltung, Rahmenbedingungen für flexible Arbeitszeiten und Schutz der Sonn- und Feiertage als Tage der Arbeitsruhe (§ 1 ArbZG)."], "richtig": 2, "erklaerung": "Sicherheit und Gesundheitsschutz der Arbeitnehmer bei der Arbeitszeitgestaltung, Rahmenbedingungen für flexible Arbeitszeiten und Schutz der Sonn- und Feiertage als Tage der Arbeitsruhe (§ 1 ArbZG).", "schwierigkeit": "leicht"}, {"id": 452, "gesetz": "ArbZG", "frage": "#0452 Was versteht das ArbZG unter Arbeitszeit?", "antworten": ["Die Zeit vom Beginn bis zum Ende der Arbeit ohne Ruhepausen (§ 2 Abs. 1 ArbZG).", "Nur die Zeit, in der der Arbeitnehmer tatsächlich Fahrgäste befördert oder Aufträge ausführt (§ 2 Abs. 1 ArbZG).", "Die Zeit vom Betreten des Betriebsgeländes bis zum Verlassen, einschließlich der Ruhepausen (§ 2 Abs. 1 ArbZG)."], "richtig": 0, "erklaerung": "Die Zeit vom Beginn bis zum Ende der Arbeit ohne Ruhepausen (§ 2 Abs. 1 ArbZG).", "schwierigkeit": "mittel"}, {"id": 453, "gesetz": "ArbZG", "frage": "#0453 Wann gilt Nachtzeit gemäß ArbZG?", "antworten": ["Zwischen 23:00 und 6:00 Uhr, in Bäckereien und Konditoreien zwischen 22:00 und 5:00 Uhr (§ 2 Abs. 3 ArbZG).", "Zwischen 0:00 und 5:00 Uhr, ohne Sonderregelung für einzelne Branchen (§ 2 Abs. 4 ArbZG).", "Zwischen 20:00 und 6:00 Uhr, im Verkehrsgewerbe und in Gaststätten zwischen 22:00 und 5:00 Uhr (§ 14 JArbSchG)."], "richtig": 0, "erklaerung": "Zwischen 23:00 und 6:00 Uhr, in Bäckereien und Konditoreien zwischen 22:00 und 5:00 Uhr (§ 2 Abs. 3 ArbZG).", "schwierigkeit": "schwer"}, {"id": 454, "gesetz": "ArbZG", "frage": "#0454 Wie viele Stunden darf die tägliche Arbeitszeit maximal betragen?", "antworten": ["8 Stunden, ausnahmsweise bis zu 10 Stunden, wenn der Schnitt innerhalb von 6 Monaten 8 Stunden nicht überschreitet (§ 3 ArbZG).", "10 Stunden, in Ausnahmefällen bis zu 12 Stunden bei Zustimmung des Betriebsrats (§ 3 ArbZG).", "8 Stunden ohne jede Ausnahme; Überstunden sind generell verboten (§ 3 ArbZG)."], "richtig": 0, "erklaerung": "8 Stunden, ausnahmsweise bis zu 10 Stunden, wenn der Schnitt innerhalb von 6 Monaten 8 Stunden nicht überschreitet (§ 3 ArbZG).", "schwierigkeit": "leicht"}, {"id": 455, "gesetz": "ArbZG", "frage": "#0455 Unter welchen Bedingungen darf die Arbeitszeit über 10 Stunden verlängert werden?", "antworten": ["Durch einseitige Anordnung des Arbeitgebers, wenn der Arbeitnehmer schriftlich einwilligt (§ 7 Abs. 7 ArbZG).", "Nur durch Tarifvertrag oder Betriebsvereinbarung aufgrund eines Tarifvertrags, wenn regelmäßig und in erheblichem Umfang Arbeitsbereitschaft oder Bereitschaftsdienst anfällt (§ 7 Abs. 1 Nr. 1 Buchst. a ArbZG).", "Nur mit Genehmigung der Industrie- und Handelskammer für höchstens vier Wochen (§ 15 ArbZG)."], "richtig": 1, "erklaerung": "Nur durch Tarifvertrag oder Betriebsvereinbarung aufgrund eines Tarifvertrags, wenn regelmäßig und in erheblichem Umfang Arbeitsbereitschaft oder Bereitschaftsdienst anfällt (§ 7 Abs. 1 Nr. 1 Buchst. a ArbZG).", "schwierigkeit": "mittel"}, {"id": 456, "gesetz": "ArbZG", "frage": "#0456 Welche Pausenregelungen gibt es?", "antworten": ["30 Minuten Pause bei mehr als 6 Stunden Arbeit, 45 Minuten Pause bei mehr als 9 Stunden Arbeit (§ 4 ArbZG).", "30 Minuten Pause bei mehr als 4,5 Stunden Arbeit, 60 Minuten Pause bei mehr als 6 Stunden Arbeit (§ 11 JArbSchG).", "20 Minuten Pause bei mehr als 4 Stunden Arbeit, 40 Minuten Pause bei mehr als 8 Stunden Arbeit (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "30 Minuten Pause bei mehr als 6 Stunden Arbeit, 45 Minuten Pause bei mehr als 9 Stunden Arbeit (§ 4 ArbZG).", "schwierigkeit": "schwer"}, {"id": 457, "gesetz": "ArbZG", "frage": "#0457 Wann muss spätestens eine Pause eingelegt werden?", "antworten": ["Nach spätestens 4,5 Stunden Lenkzeit (Art. 7 VO (EG) Nr. 561/2006).", "Erst nach Ende der täglichen Höchstarbeitszeit von 10 Stunden (§ 3 ArbZG).", "Nach spätestens 6 Stunden Arbeitszeit (§ 4 ArbZG)."], "richtig": 2, "erklaerung": "Nach spätestens 6 Stunden Arbeitszeit (§ 4 ArbZG).", "schwierigkeit": "leicht"}, {"id": 458, "gesetz": "ArbZG", "frage": "#0458 Zählen Wartezeiten im Taxi- oder Mietwagenbetrieb als Arbeitszeit?", "antworten": ["Ja, Wartezeiten, in denen sich der Fahrer am Taxi bereithalten muss, sind Arbeitszeit (Arbeitsbereitschaft); Ruhepausen zählen nicht (§ 2 Abs. 1 ArbZG). § 21a ArbZG gilt für Taxis nicht.", "Nein, Wartezeiten sind unbezahlte Ruhezeit, da in ihnen keine Fahrgäste befördert werden (§ 2 Abs. 1 ArbZG).", "Nur Wartezeiten an Taxiständen ab 30 Minuten Dauer; kürzere Wartezeiten gelten als Freizeit (§ 21a ArbZG)."], "richtig": 0, "erklaerung": "Ja, Wartezeiten, in denen sich der Fahrer am Taxi bereithalten muss, sind Arbeitszeit (Arbeitsbereitschaft); Ruhepausen zählen nicht (§ 2 Abs. 1 ArbZG). § 21a ArbZG gilt für Taxis nicht.", "schwierigkeit": "mittel"}, {"id": 459, "gesetz": "ArbZG", "frage": "#0459 Wie lange muss die Ruhezeit zwischen zwei Arbeitsschichten betragen?", "antworten": ["Mindestens 10 Stunden, bei Nachtarbeit mindestens 12 Stunden (§ 5 Abs. 1 ArbZG).", "Mindestens 11 Stunden (§ 5 Abs. 1 ArbZG).", "Mindestens 12 Stunden; bei Schichtarbeit genügen 8 Stunden (§ 6 ArbZG)."], "richtig": 1, "erklaerung": "Mindestens 11 Stunden (§ 5 Abs. 1 ArbZG).", "schwierigkeit": "schwer"}, {"id": 460, "gesetz": "ArbZG", "frage": "#0460 Kann die Ruhezeit verkürzt werden?", "antworten": ["Nein, die Ruhezeit von 11 Stunden ist zwingend und kann nie verkürzt werden (§ 5 ArbZG).", "Ja, um bis zu 1 Stunde, wenn innerhalb eines Monats eine Ruhezeit auf mindestens 12 Stunden verlängert wird (§ 5 Abs. 2 ArbZG).", "Ja, um bis zu 3 Stunden, wenn der Betriebsrat zustimmt (§ 5 Abs. 2 ArbZG)."], "richtig": 1, "erklaerung": "Ja, um bis zu 1 Stunde, wenn innerhalb eines Monats eine Ruhezeit auf mindestens 12 Stunden verlängert wird (§ 5 Abs. 2 ArbZG).", "schwierigkeit": "leicht"}, {"id": 461, "gesetz": "ArbZG", "frage": "#0461 Welche Ruhezeiten gelten für Fahrer im Straßentransport?", "antworten": ["Mindestens 11 Stunden tägliche und 45 Stunden wöchentliche Ruhezeit nach EU-Verordnung (EG) Nr. 561/2006 (§ 21a Abs. 5 ArbZG).", "Mindestens 10 Stunden tägliche und 36 Stunden wöchentliche Ruhezeit nach dem Arbeitszeitgesetz (§ 5 ArbZG).", "Mindestens 9 Stunden tägliche und 24 Stunden wöchentliche Ruhezeit, die nicht verkürzt werden dürfen (Art. 8 VO (EG) Nr. 561/2006)."], "richtig": 0, "erklaerung": "Mindestens 11 Stunden tägliche und 45 Stunden wöchentliche Ruhezeit nach EU-Verordnung (EG) Nr. 561/2006 (§ 21a Abs. 5 ArbZG).", "schwierigkeit": "mittel"}, {"id": 462, "gesetz": "ArbZG", "frage": "#0462 Welche Arbeitszeitregelung gilt für Taxifahrer?", "antworten": ["Es gilt das Fahrpersonalgesetz mit der VO (EG) Nr. 561/2006, da Taxis gewerblich Personen befördern (§ 1 FPersG).", "Es gilt § 21a ArbZG, jedoch mit einer Wochenarbeitszeit von bis zu 60 Stunden ohne Ausgleich (§ 21a Abs. 4 ArbZG).", "Für angestellte Taxifahrer gilt das allgemeine ArbZG (§§ 3–6 ArbZG); § 21a ArbZG und die EU-Lenk- und Ruhezeiten gelten nicht, da Taxis höchstens 9 Personen befördern."], "richtig": 2, "erklaerung": "Für angestellte Taxifahrer gilt das allgemeine ArbZG (§§ 3–6 ArbZG); § 21a ArbZG und die EU-Lenk- und Ruhezeiten gelten nicht, da Taxis höchstens 9 Personen befördern.", "schwierigkeit": "schwer"}, {"id": 463, "gesetz": "ArbZG", "frage": "#0463 Welche Regelungen gelten für den Straßentransport?", "antworten": ["Maximal 45 Stunden Wochenarbeitszeit, verlängerbar auf 55 Stunden, wenn der Schnitt über 12 Monate nicht überschritten wird (§ 3 ArbZG).", "Maximal 48 Stunden Wochenarbeitszeit, verlängerbar auf 60 Stunden, wenn der Schnitt über 4 Monate 48 Stunden nicht überschreitet (§ 21a Abs. 4 ArbZG).", "Maximal 60 Stunden Wochenarbeitszeit ohne Ausgleichszeitraum; Bereitschaftszeiten zählen nicht mit (§ 21a Abs. 4 ArbZG)."], "richtig": 1, "erklaerung": "Maximal 48 Stunden Wochenarbeitszeit, verlängerbar auf 60 Stunden, wenn der Schnitt über 4 Monate 48 Stunden nicht überschreitet (§ 21a Abs. 4 ArbZG).", "schwierigkeit": "leicht"}, {"id": 464, "gesetz": "ArbZG", "frage": "#0464 Müssen Taxifahrer Ruhepausen einhalten?", "antworten": ["Ja, angestellte Taxifahrer haben Anspruch auf 30 Minuten Pause bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden Arbeitszeit, spätestens nach 6 Stunden (§ 4 ArbZG).", "Ja, angestellte Taxifahrer haben Anspruch auf 15 Minuten Pause nach 4,5 Stunden Lenkzeit und 45 Minuten nach 9 Stunden (Art. 7 VO (EG) Nr. 561/2006).", "Nein, Wartezeiten zählen als Pause, sodass eine gesonderte Pause entbehrlich ist (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "Ja, angestellte Taxifahrer haben Anspruch auf 30 Minuten Pause bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden Arbeitszeit, spätestens nach 6 Stunden (§ 4 ArbZG).", "schwierigkeit": "mittel"}, {"id": 465, "gesetz": "ArbZG", "frage": "#0465 Ist Sonntagsarbeit grundsätzlich erlaubt?", "antworten": ["Ja, mit schriftlicher Einwilligung des Arbeitnehmers und ohne weitere Voraussetzungen (§ 9 ArbZG).", "Ja, Sonntagsarbeit ist wie Werktagsarbeit erlaubt, wenn ein Zuschlag von 50 % gezahlt wird (§ 9 ArbZG).", "Nein, Arbeitnehmer dürfen von 0 bis 24 Uhr nicht beschäftigt werden (§ 9 Abs. 1 ArbZG)."], "richtig": 2, "erklaerung": "Nein, Arbeitnehmer dürfen von 0 bis 24 Uhr nicht beschäftigt werden (§ 9 Abs. 1 ArbZG).", "schwierigkeit": "schwer"}, {"id": 466, "gesetz": "ArbZG", "frage": "#0466 Gilt für Taxi- und Mietwagenfahrer die Sonn- und Feiertagsruhe?", "antworten": ["Nein, Taxi- und Mietwagenfahrer sind von der Sonn- und Feiertagsruhe vollständig ausgenommen; Ersatzruhetage entfallen (§ 10 ArbZG).", "Ja, sie dürfen sonntags nur arbeiten, wenn die Gemeinde dies für das Taxigewerbe zulässt, und höchstens 6 Stunden (§ 13 ArbZG).", "Grundsätzlich ja, doch dürfen sie als Beschäftigte in Verkehrsbetrieben an Sonn- und Feiertagen arbeiten; dafür sind Ersatzruhetage und 15 freie Sonntage zu gewähren (§ 10 Abs. 1 Nr. 10, § 11 ArbZG)."], "richtig": 2, "erklaerung": "Grundsätzlich ja, doch dürfen sie als Beschäftigte in Verkehrsbetrieben an Sonn- und Feiertagen arbeiten; dafür sind Ersatzruhetage und 15 freie Sonntage zu gewähren (§ 10 Abs. 1 Nr. 10, § 11 ArbZG).", "schwierigkeit": "leicht"}, {"id": 467, "gesetz": "ArbZG", "frage": "#0467 Welche Ausnahmen von der Sonn- und Feiertagsruhe gibt es?", "antworten": ["Banken, Versicherungen, Behörden und Büros (§ 10 Abs. 1 ArbZG).", "Notdienste, Krankenhäuser, Verkehrsbetriebe, Gastronomie, Rundfunk, Freizeitbetriebe u. a. (§ 10 Abs. 1 ArbZG).", "Nur Einrichtungen der Bundeswehr, Polizei und Feuerwehr; private Unternehmen sind nie ausgenommen (§ 10 ArbZG)."], "richtig": 1, "erklaerung": "Notdienste, Krankenhäuser, Verkehrsbetriebe, Gastronomie, Rundfunk, Freizeitbetriebe u. a. (§ 10 Abs. 1 ArbZG).", "schwierigkeit": "mittel"}, {"id": 468, "gesetz": "ArbZG", "frage": "#0468 Wie viele arbeitsfreie Sonntage müssen Arbeitnehmer pro Jahr haben?", "antworten": ["Mindestens 10 Sonntage, im Verkehrsgewerbe nur 6 (§ 11 Abs. 1 ArbZG).", "Mindestens 26 Sonntage, in jedem Halbjahr 13 (§ 11 Abs. 1 ArbZG).", "Mindestens 15 Sonntage (§ 11 Abs. 1 ArbZG)."], "richtig": 2, "erklaerung": "Mindestens 15 Sonntage (§ 11 Abs. 1 ArbZG).", "schwierigkeit": "schwer"}, {"id": 469, "gesetz": "ArbZG", "frage": "#0469 Wann muss ein Ersatzruhetag für Sonntagsarbeit gewährt werden?", "antworten": ["Innerhalb von sechs Monaten, wenn der Arbeitnehmer zustimmt (§ 11 Abs. 3 ArbZG).", "Innerhalb von zwei Wochen (§ 11 Abs. 3 ArbZG).", "Innerhalb von einem Monat (§ 11 Abs. 3 ArbZG)."], "richtig": 1, "erklaerung": "Innerhalb von zwei Wochen (§ 11 Abs. 3 ArbZG).", "schwierigkeit": "leicht"}, {"id": 470, "gesetz": "ArbZG", "frage": "#0470 Welche Arbeitszeitbegrenzungen gelten für Nachtarbeiter?", "antworten": ["Maximal 6 Stunden, ausnahmsweise 8 Stunden, wenn im Monatsdurchschnitt 6 Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG).", "Maximal 8 Stunden, ausnahmsweise 10 Stunden, wenn im Monatsdurchschnitt 8 Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG).", "Maximal 10 Stunden ohne Ausgleich; die Beschränkung gilt nur bei mehr als drei Nachtstunden (§ 6 Abs. 1 ArbZG)."], "richtig": 1, "erklaerung": "Maximal 8 Stunden, ausnahmsweise 10 Stunden, wenn im Monatsdurchschnitt 8 Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG).", "schwierigkeit": "mittel"}, {"id": 471, "gesetz": "ArbZG", "frage": "#0471 Haben Nachtarbeiter Anspruch auf Gesundheitsuntersuchungen?", "antworten": ["Nein, Untersuchungen sind nur als Pflichtvorsorge nach der ArbMedVV möglich; ein Anspruch besteht nicht (§ 6 ArbZG).", "Ja, alle 5 Jahre, ab 40 Jahren alle 2 Jahre, auf Kosten des Arbeitnehmers (§ 6 Abs. 3 ArbZG).", "Ja, alle 3 Jahre, ab 50 Jahren jährlich, auf Kosten des Arbeitgebers (§ 6 Abs. 3 ArbZG)."], "richtig": 2, "erklaerung": "Ja, alle 3 Jahre, ab 50 Jahren jährlich, auf Kosten des Arbeitgebers (§ 6 Abs. 3 ArbZG).", "schwierigkeit": "schwer"}, {"id": 472, "gesetz": "ArbZG", "frage": "#0472 Kann ein Nachtarbeiter auf einen Tagesarbeitsplatz wechseln?", "antworten": ["Ja, jederzeit auf eigenen Wunsch, unabhängig davon, ob ein geeigneter Tagesarbeitsplatz frei ist (§ 6 Abs. 4 ArbZG).", "Ja, wenn gesundheitliche Gründe, Kinderbetreuung oder Pflege eines Angehörigen vorliegen (§ 6 Abs. 4 ArbZG).", "Nein, der Arbeitgeber darf den Nachtarbeiter nach freiem Ermessen auf dem Nachtarbeitsplatz belassen (§ 6 Abs. 4 ArbZG)."], "richtig": 1, "erklaerung": "Ja, wenn gesundheitliche Gründe, Kinderbetreuung oder Pflege eines Angehörigen vorliegen (§ 6 Abs. 4 ArbZG).", "schwierigkeit": "leicht"}, {"id": 473, "gesetz": "ArbZG", "frage": "#0473 Müssen Arbeitgeber die Arbeitszeiten dokumentieren?", "antworten": ["Ja, die über 8 Stunden werktäglich hinausgehende Arbeitszeit ist aufzuzeichnen und 2 Jahre aufzubewahren (§ 16 Abs. 2 ArbZG); im Taxi- und Mietwagengewerbe die gesamte Arbeitszeit (§ 17 MiLoG).", "Ja, die gesamte Arbeitszeit ist täglich zu dokumentieren und 10 Jahre aufzubewahren (§ 147 AO).", "Nein, Arbeitszeiten dokumentieren nur die Arbeitnehmer selbst; der Arbeitgeber muss nichts aufbewahren (§ 16 ArbZG)."], "richtig": 0, "erklaerung": "Ja, die über 8 Stunden werktäglich hinausgehende Arbeitszeit ist aufzuzeichnen und 2 Jahre aufzubewahren (§ 16 Abs. 2 ArbZG); im Taxi- und Mietwagengewerbe die gesamte Arbeitszeit (§ 17 MiLoG).", "schwierigkeit": "mittel"}, {"id": 474, "gesetz": "ArbZG", "frage": "#0474 Welche Verantwortung trägt der Taxiunternehmer für die Arbeitszeiten?", "antworten": ["Er muss sicherstellen, dass die gesetzlichen Arbeitszeit-, Pausen- und Ruhezeitregelungen eingehalten werden (§§ 3–5, 16, 22 ArbZG).", "Er muss die Einhaltung nur bei Fahrern kontrollieren, die länger als ein Jahr beschäftigt sind (§ 16 ArbZG).", "Er muss nur die Höchstarbeitszeit überwachen; Pausen und Ruhezeiten sind Sache der Fahrer (§§ 3, 22 ArbZG)."], "richtig": 0, "erklaerung": "Er muss sicherstellen, dass die gesetzlichen Arbeitszeit-, Pausen- und Ruhezeitregelungen eingehalten werden (§§ 3–5, 16, 22 ArbZG).", "schwierigkeit": "schwer"}, {"id": 475, "gesetz": "ArbZG", "frage": "#0475 Welche Behörde ist für die Überwachung des Arbeitszeitgesetzes zuständig?", "antworten": ["Die Genehmigungsbehörde nach dem Personenbeförderungsgesetz (§ 17 ArbZG).", "Die zuständige Aufsichtsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG).", "Die zuständige Berufsgenossenschaft (§ 17 ArbZG)."], "richtig": 1, "erklaerung": "Die zuständige Aufsichtsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG).", "schwierigkeit": "leicht"}, {"id": 476, "gesetz": "ArbZG", "frage": "#0476 Welche Arbeitszeitverstöße gelten als Ordnungswidrigkeit?", "antworten": ["Nur Überschreitungen der täglichen Höchstarbeitszeit um mehr als 2 Stunden (§ 22 ArbZG).", "Verspätete Anmeldung von Arbeitnehmern bei der Sozialversicherung und Schwarzarbeit (§ 22 ArbZG).", "Überschreiten der Arbeitszeitgrenzen, keine Einhaltung von Ruhepausen oder Sonn- und Feiertagsruhe (§ 22 ArbZG)."], "richtig": 2, "erklaerung": "Überschreiten der Arbeitszeitgrenzen, keine Einhaltung von Ruhepausen oder Sonn- und Feiertagsruhe (§ 22 ArbZG).", "schwierigkeit": "mittel"}, {"id": 477, "gesetz": "ArbZG", "frage": "#0477 Welche Strafen drohen bei Verstößen gegen das ArbZG?", "antworten": ["Verwarnungsgelder bis zu 1.000 €; Geldbußen gibt es erst bei Wiederholung (§ 22 ArbZG).", "Geldbußen bis zu 100.000 €, bei Verstößen gegen die Sonntagsruhe bis zu 1 Mio. € (§ 22 ArbZG).", "Geldbußen bis zu 30.000 € (§ 22 ArbZG)."], "richtig": 2, "erklaerung": "Geldbußen bis zu 30.000 € (§ 22 ArbZG).", "schwierigkeit": "schwer"}, {"id": 478, "gesetz": "ArbZG", "frage": "#0478 Wie werden Verstöße gegen das ArbZG bestraft?", "antworten": ["Ausschließlich mit Geldbußen; Freiheitsstrafen sind im Arbeitszeitrecht ausgeschlossen (§ 22 ArbZG).", "Mit Geldbußen oder Freiheitsstrafe bis zu fünf Jahren, schon bei fahrlässigem Verstoß (§ 23 ArbZG).", "Mit Geldbußen oder in schweren Fällen mit Freiheitsstrafe bis zu einem Jahr (§ 23 ArbZG)."], "richtig": 2, "erklaerung": "Mit Geldbußen oder in schweren Fällen mit Freiheitsstrafe bis zu einem Jahr (§ 23 ArbZG).", "schwierigkeit": "leicht"}, {"id": 479, "gesetz": "ArbZG", "frage": "#0479 Wann macht sich ein Arbeitgeber strafbar?", "antworten": ["Wenn er Verstöße vorsätzlich begeht und dadurch Gesundheit oder Arbeitskraft eines Arbeitnehmers gefährdet oder sie beharrlich wiederholt (§ 23 ArbZG).", "Nur wenn ein Arbeitnehmer durch den Verstoß einen Arbeitsunfall erleidet (§ 22 ArbZG).", "Bei jedem Verstoß gegen Arbeitszeitgrenzen, auch bei einmaligem fahrlässigem Verstoß (§ 23 ArbZG)."], "richtig": 0, "erklaerung": "Wenn er Verstöße vorsätzlich begeht und dadurch Gesundheit oder Arbeitskraft eines Arbeitnehmers gefährdet oder sie beharrlich wiederholt (§ 23 ArbZG).", "schwierigkeit": "mittel"}, {"id": 480, "gesetz": "ArbZG", "frage": "#0480 Welche besonderen Regeln gelten für gefährliche Arbeiten?", "antworten": ["Die Bundesregierung kann zusätzliche Einschränkungen für gefährliche Tätigkeiten festlegen (§ 8 ArbZG).", "Für gefährliche Arbeiten gelten keine besonderen Regeln; es gelten nur die allgemeinen Höchstarbeitszeiten (§ 3 ArbZG).", "Der Arbeitgeber legt zusätzliche Einschränkungen selbst in einer Betriebsvereinbarung fest (§ 7 ArbZG)."], "richtig": 0, "erklaerung": "Die Bundesregierung kann zusätzliche Einschränkungen für gefährliche Tätigkeiten festlegen (§ 8 ArbZG).", "schwierigkeit": "schwer"}, {"id": 501, "gesetz": "AGG", "frage": "#0501 Darf ein Taxiunternehmer Bewerber wegen ihres Alters ablehnen?", "antworten": ["Ja, Bewerber über 60 Jahre darf er stets ablehnen, da Fahrer besonders fit sein müssen (§ 8 AGG).", "Grundsätzlich nein; zulässig nur, wenn die Ungleichbehandlung objektiv, angemessen und durch ein legitimes Ziel gerechtfertigt ist, z. B. gesetzliches Mindestalter (§§ 1, 7, 10 AGG).", "Ja, wenn sich Fahrgäste an älteren Fahrern stören, ist das ein zulässiger Grund (§ 20 AGG)."], "richtig": 1, "erklaerung": "Grundsätzlich nein; zulässig nur, wenn die Ungleichbehandlung objektiv, angemessen und durch ein legitimes Ziel gerechtfertigt ist, z. B. gesetzliches Mindestalter (§§ 1, 7, 10 AGG).", "schwierigkeit": "leicht"}, {"id": 502, "gesetz": "AGG", "frage": "#0502 Muss ein Taxiunternehmen barrierefreie Fahrzeuge bereitstellen?", "antworten": ["Ja, das AGG verpflichtet jedes Taxiunternehmen, mindestens ein rollstuhlgerechtes Fahrzeug vorzuhalten (§ 19 AGG).", "Das AGG verlangt keine barrierefreien Fahrzeuge, verbietet aber, Fahrgäste wegen einer Behinderung zu benachteiligen (§ 19 AGG); Pflichten können sich aus PBefG oder kommunalen Vorgaben ergeben.", "Nein, das AGG gilt nicht für Beförderungsverträge; Fahrgäste mit Behinderung dürfen abgelehnt werden (§ 2 AGG)."], "richtig": 1, "erklaerung": "Das AGG verlangt keine barrierefreien Fahrzeuge, verbietet aber, Fahrgäste wegen einer Behinderung zu benachteiligen (§ 19 AGG); Pflichten können sich aus PBefG oder kommunalen Vorgaben ergeben.", "schwierigkeit": "mittel"}, {"id": 503, "gesetz": "AGG", "frage": "#0503 Darf ein Taxiunternehmen bestimmte Fahrer bevorzugt einstellen?", "antworten": ["Nur, wenn eine wesentliche berufliche Anforderung besteh
