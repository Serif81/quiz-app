<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FaOnSa Taxi Quiz">
<meta name="theme-color" content="#0D1117">
<title>FaOnSa Taxi & Mietwagenverkehr</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;
  --dark:#0D1117;--dark2:#161B22;--dark3:#1E2530;
  --border:rgba(201,168,76,0.2);
  --text:#E8E6E1;--muted:#8B8680;
  --green:#3DD68C;--red:#FF5A5A;
  --green-bg:rgba(61,214,140,0.1);--red-bg:rgba(255,90,90,0.1);
}

body{
  background:var(--dark);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  background-image:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(201,168,76,0.1) 0%,transparent 70%);
}

/* ── LOGIN ── */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:32px 24px;gap:24px;
}
#login-screen.hidden{display:none;}

.login-badge{
  display:inline-block;background:rgba(201,168,76,0.15);border:1px solid var(--gold);
  color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:14px;
}
.login-title{font-size:28px;font-weight:700;margin-bottom:6px;text-align:center;}
.login-sub{color:var(--muted);font-size:14px;text-align:center;}
.login-card{
  width:100%;max-width:420px;background:var(--dark2);border:1px solid var(--border);
  border-radius:20px;padding:28px;
}
.login-label{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.login-input{
  width:100%;background:var(--dark3);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:14px 16px;color:var(--text);font-size:16px;
  font-family:inherit;outline:none;margin-bottom:16px;transition:border-color 0.2s;
}
.login-input:focus{border-color:var(--gold);}
.login-btn{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:var(--dark);border:none;border-radius:14px;padding:16px;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px;}

/* ── APP ── */
#app-screen{display:none;flex-direction:column;min-height:100vh;}
#app-screen.visible{display:flex;}

.app-header{
  position:sticky;top:0;z-index:10;
  background:rgba(13,17,23,0.95);backdrop-filter:blur(10px);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.header-title{font-size:15px;font-weight:700;color:var(--gold);}
.logout-btn{
  background:none;border:1px solid rgba(255,255,255,0.1);color:var(--muted);
  border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;
}

.app-main{flex:1;padding:16px;max-width:600px;width:100%;margin:0 auto;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.stat-box{
  background:var(--dark2);border:1px solid var(--border);border-radius:12px;
  padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.stat-val{font-size:22px;font-weight:700;line-height:1;}
.stat-lbl{font-size:10px;color:var(--muted);}

/* CARDS */
.card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.card-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}

.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.diff-btn{
  background:var(--dark3);border:2px solid rgba(255,255,255,0.08);border-radius:12px;
  padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:4px;transition:all 0.2s;font-family:inherit;
}
.diff-btn .dlabel{font-weight:600;font-size:14px;color:var(--text);}
.diff-btn small{font-size:11px;color:var(--muted);}

.round-row{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text);margin-bottom:10px;}
.round-row:last-child{margin-bottom:0;}

/* BUTTONS */
.primary-btn{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:var(--dark);border:none;border-radius:16px;padding:17px;
  font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;font-family:inherit;
  display:block;
}
.secondary-btn{
  width:100%;background:transparent;color:var(--text);
  border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:15px;
  font-size:15px;font-weight:500;cursor:pointer;margin-bottom:12px;font-family:inherit;
  display:block;
}
.danger-btn{
  width:100%;background:transparent;color:var(--red);
  border:1px solid rgba(255,90,90,0.3);border-radius:16px;padding:15px;
  font-size:15px;cursor:pointer;margin-bottom:12px;font-family:inherit;
  display:block;
}

/* PROGRESS */
.prog-wrap{margin-bottom:16px;}
.prog-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
.prog-bar{height:4px;background:var(--dark3);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:99px;transition:width 0.4s;}

/* QUESTION */
.q-tag{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.q-text{font-size:17px;line-height:1.55;color:var(--text);margin-bottom:22px;font-weight:500;}

/* ANSWERS */
.answers{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.ans-btn{
  background:var(--dark3);border:1px solid rgba(255,255,255,0.08);border-radius:14px;
  padding:13px 14px;color:var(--text);font-family:inherit;font-size:14px;
  cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:12px;
  transition:all 0.2s;line-height:1.45;width:100%;
}
.letter{
  width:28px;height:28px;min-width:28px;border-radius:8px;
  background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px;
}
.ans-btn.correct{background:var(--green-bg);border-color:var(--green);}
.ans-btn.correct .letter{background:var(--green);color:var(--dark);}
.ans-btn.wrong{background:var(--red-bg);border-color:var(--red);}
.ans-btn.wrong .letter{background:var(--red);color:#fff;}
.ans-btn.locked{cursor:default;}
.ans-btn.locked:not(.correct):not(.wrong){opacity:0.35;}

.feedback{
  border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.6;
  display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--green-bg);border:1px solid rgba(61,214,140,0.3);color:#5DF0A0;}
.feedback.err{background:var(--red-bg);border:1px solid rgba(255,90,90,0.3);color:#FF8080;}
.feedback b{display:block;margin-bottom:4px;font-size:14px;}

/* DETAIL */
.detail-item{
  background:var(--dark2);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:10px;
}
.detail-bar{height:6px;background:var(--dark);border-radius:99px;margin:8px 0 4px;}
.detail-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}

/* RESULT */
.result-screen{text-align:center;padding:40px 0;}
.score-big{font-size:80px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:8px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp 0.3s ease;}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen">
  <div style="text-align:center">
    <div class="login-badge">FaOnSa Prüfungsvorbereitung auf die Fachkundeprüfung</div>
    <div class="login-title">Taxi & Mietwagenverkehr</div>
    <div class="login-sub">Prüfungsvorbereitung · 915 Fragen</div>
  </div>
  <div class="login-card">
    <div class="login-label">Zugangscode eingeben</div>
    <input class="login-input" id="code-input" type="text" 
           placeholder="z.B. MUSTERMANN2024"
           autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <button class="login-btn" onclick="checkCode()">Zugang →</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app-screen">
  <div class="app-header">
    <div class="header-title">🚕 FaOnSa Taxi Quiz</div>
    <button class="logout-btn" onclick="logout()">Abmelden</button>
  </div>
  <div class="app-main" id="main-content"></div>
</div>

<script>
// ════════════════════════════════════════════
// ZUGANGSCODES – Zeile löschen = kein Zugang
// ════════════════════════════════════════════
const CODES = [
  "1DEMO2026",
  "2DEMO2026",
  "3DEMO2026",
  "4DEMO2026",
  "5DEMO2026",
  "6DEMO2026",
  "7DEMO2026",
  "8DEMO2026",
  "9DEMO2026",
  "10DEMO2026",
  "11DEMO2026",
  "12DEMO2026",
];

const ALL_QUESTIONS = [{"id": 1, "gesetz": "PBefG", "frage": "#0001 Was regelt das Personenbeförderungsgesetz (PBefG)?", "antworten": ["Das PBefG regelt die geschäftsmäßige oder entgeltliche Beförderung von Personen mit Straßenbahnen, Oberleitungsomnibussen und Kraftfahrzeugen (§ 1 Abs. 1 PBefG).", "Das PBefG regelt ausschließlich den öffentlichen Linienverkehr mit Bussen und Bahnen sowie die Fahrpläne und Fahrgastrechte im Nahverkehr (§ 42 PBefG).", "Das PBefG regelt die Zulassung, Ausrüstung und technische Überwachung aller Kraftfahrzeuge im Straßenverkehr (§ 1 Abs. 1 PBefG)."], "richtig": 0, "erklaerung": "Das PBefG regelt die geschäftsmäßige oder entgeltliche Beförderung von Personen mit Straßenbahnen, Oberleitungsomnibussen und Kraftfahrzeugen (§ 1 Abs. 1 PBefG).", "schwierigkeit": "leicht"}, {"id": 2, "gesetz": "PBefG", "frage": "#0002 Welche Verkehrsarten unterscheidet das PBefG?", "antworten": ["Linienverkehr (§§ 42–45 PBefG) und Gelegenheitsverkehr (§ 46 PBefG), wobei der Gelegenheitsverkehr nur aus Taxen (§ 47) und Mietwagen (§ 49) besteht; Ausflugsfahrten und Ferienziel-Reisen sind dem Linienverkehr zugeordnet (§ 2 PBefG).", "Linienverkehr (§§ 42–45 PBefG) und Gelegenheitsverkehr (§ 46 PBefG) mit den Formen Taxen (§ 47), Ausflugsfahrten/Ferienziel-Reisen (§ 48), Mietomnibusse/Mietwagen (§ 49) und gebündelter Bedarfsverkehr (§ 50); daneben Straßenbahn- und Obusverkehr (§ 2 PBefG).", "Nur Linienverkehr und Taxiverkehr; Mietwagen sind eine Unterart der Taxen und unterliegen denselben Vorschriften nach § 47 PBefG, einen gebündelten Bedarfsverkehr gibt es nicht."], "richtig": 1, "erklaerung": "Linienverkehr (§§ 42–45 PBefG) und Gelegenheitsverkehr (§ 46 PBefG) mit den Formen Taxen (§ 47), Ausflugsfahrten/Ferienziel-Reisen (§ 48), Mietomnibusse/Mietwagen (§ 49) und gebündelter Bedarfsverkehr (§ 50); daneben Straßenbahn- und Obusverkehr (§ 2 PBefG).", "schwierigkeit": "mittel"}, {"id": 3, "gesetz": "PBefG", "frage": "#0003 Welche Genehmigungspflichten bestehen im Personenverkehr?", "antworten": ["Wer entgeltlich oder geschäftsmäßig Personen mit Straßenbahnen, Obussen oder Kraftfahrzeugen befördert, braucht eine Genehmigung, soweit keine Ausnahme (z. B. § 1 Abs. 2 PBefG, Freistellungs-Verordnung) greift (§ 2 Abs. 1 PBefG).", "Eine Genehmigung brauchen nur Unternehmer mit mehr als drei Fahrzeugen; Kleinunternehmer mit bis zu drei Fahrzeugen sind nach der Freistellungs-Verordnung grundsätzlich befreit (§ 2 Abs. 1 PBefG).", "Genehmigungspflichtig ist nur die entgeltliche Beförderung; unentgeltliche, aber geschäftsmäßige Beförderungen sind stets genehmigungsfrei, ebenso Fahrten bis 50 km Entfernung (§ 2 Abs. 1 PBefG)."], "richtig": 0, "erklaerung": "Wer entgeltlich oder geschäftsmäßig Personen mit Straßenbahnen, Obussen oder Kraftfahrzeugen befördert, braucht eine Genehmigung, soweit keine Ausnahme (z. B. § 1 Abs. 2 PBefG, Freistellungs-Verordnung) greift (§ 2 Abs. 1 PBefG).", "schwierigkeit": "schwer"}, {"id": 4, "gesetz": "PBefG", "frage": "#0004 Wer erteilt die Genehmigung für Taxen oder Mietwagen?", "antworten": ["Die örtlich zuständige Genehmigungsbehörde (§ 11 PBefG).", "Die Industrie- und Handelskammer am Betriebssitz (§ 5 PBZugV).", "Das Kraftfahrt-Bundesamt in Flensburg (§ 20 StVZO)."], "richtig": 0, "erklaerung": "Die örtlich zuständige Genehmigungsbehörde (§ 11 PBefG).", "schwierigkeit": "leicht"}, {"id": 5, "gesetz": "PBefG", "frage": "#0005 Wie lange ist eine Taxikonzession gültig?", "antworten": ["Höchstens 10 Jahre (§ 16 Abs. 4 PBefG); bei Neubewerbern wird die Genehmigung zunächst für 5 Jahre erteilt (§ 13 Abs. 5 PBefG). Danach verlängert sie sich automatisch.", "Unbefristet, solange der Unternehmer die Berufszugangsvoraussetzungen erfüllt; nur alle 3 Jahre muss die Eignung neu nachgewiesen werden (§ 9 PBZugV).", "Höchstens 5 Jahre (§ 16 Abs. 4 PBefG); Neubewerbern wird die Taxigenehmigung für 2 Jahre erteilt (§ 13 Abs. 5 PBefG). Danach ist die Wiedererteilung zu beantragen."], "richtig": 2, "erklaerung": "Höchstens 5 Jahre (§ 16 Abs. 4 PBefG); Neubewerbern wird die Taxigenehmigung für 2 Jahre erteilt (§ 13 Abs. 5 PBefG). Danach ist die Wiedererteilung zu beantragen.", "schwierigkeit": "mittel"}, {"id": 6, "gesetz": "PBefG", "frage": "#0006 Welche Bedingungen müssen Unternehmer für eine Konzession erfüllen?", "antworten": ["Sicherheit und Leistungsfähigkeit des Betriebs (finanzielle Leistungsfähigkeit), Zuverlässigkeit, fachliche Eignung sowie Betriebssitz oder Niederlassung im Inland (§ 13 Abs. 1 PBefG); bei Taxen darf zudem das örtliche Taxengewerbe nicht in seiner Funktionsfähigkeit bedroht werden (§ 13 Abs. 4 PBefG).", "Ein Mindestalter von 25 Jahren, eine abgeschlossene kaufmännische Berufsausbildung und die deutsche Staatsangehörigkeit des Unternehmers (§ 13 Abs. 1 PBefG); bei Taxen zusätzlich der Nachweis eines Bedarfs je 1.000 Einwohner (§ 13 Abs. 4 PBefG).", "Ausreichender Kapitalbesitz von mindestens 50.000 € je Fahrzeug, polizeiliches Führungszeugnis und ein Betriebshof mit mindestens drei Stellplätzen; eine fachliche Eignung ist nicht erforderlich (§ 13 Abs. 1 PBefG)."], "richtig": 0, "erklaerung": "Sicherheit und Leistungsfähigkeit des Betriebs (finanzielle Leistungsfähigkeit), Zuverlässigkeit, fachliche Eignung sowie Betriebssitz oder Niederlassung im Inland (§ 13 Abs. 1 PBefG); bei Taxen darf zudem das örtliche Taxengewerbe nicht in seiner Funktionsfähigkeit bedroht werden (§ 13 Abs. 4 PBefG).", "schwierigkeit": "schwer"}, {"id": 7, "gesetz": "PBefG", "frage": "#0007 Was ist der Hauptunterschied zwischen Taxen und Mietwagen?", "antworten": ["Taxen werden an behördlich zugelassenen Stellen bereitgehalten, unterliegen Betriebs- und Beförderungspflicht (§§ 21, 22, 47 PBefG) und dem Taxitarif (§ 51 PBefG). Mietwagen führen nur am Betriebssitz oder in der Wohnung eingegangene Aufträge aus, unterliegen der Rückkehrpflicht und grundsätzlich keinem Tarif (§ 49 Abs. 4 PBefG; Mindestentgelte nach § 51a möglich).", "Taxen und Mietwagen unterscheiden sich nur durch die Fahrzeugfarbe und das Dachschild; Rechte und Pflichten wie Tarifbindung, Rückkehrpflicht und Bereithalten an Taxiständen sind identisch geregelt (§ 49 Abs. 4 PBefG).", "Taxen dürfen nur auf Bestellung fahren und sind frei im Tarif; Mietwagen werden an öffentlichen Stellen bereitgehalten, unterliegen der Betriebs- und Beförderungspflicht und müssen den Taxitarif anwenden (§ 47, § 49 Abs. 4 PBefG)."], "richtig": 0, "erklaerung": "Taxen werden an behördlich zugelassenen Stellen bereitgehalten, unterliegen Betriebs- und Beförderungspflicht (§§ 21, 22, 47 PBefG) und dem Taxitarif (§ 51 PBefG). Mietwagen führen nur am Betriebssitz oder in der Wohnung eingegangene Aufträge aus, unterliegen der Rückkehrpflicht und grundsätzlich keinem Tarif (§ 49 Abs. 4 PBefG; Mindestentgelte nach § 51a möglich).", "schwierigkeit": "leicht"}, {"id": 8, "gesetz": "PBefG", "frage": "#0008 Welche Betriebspflicht haben Taxiunternehmen?", "antworten": ["Taxiunternehmer müssen ihren Betrieb rund um die Uhr aufrechterhalten, auch an Sonn- und Feiertagen; Ausnahmen sind nicht zulässig (§ 47 Abs. 3 PBefG).", "Taxiunternehmer dürfen ihren Betrieb frei einstellen und Betriebszeiten nach Belieben festlegen; eine behördliche Regelung des Umfangs ist ausgeschlossen (§ 21 PBefG).", "Taxiunternehmer müssen den genehmigten Betrieb aufnehmen und während der Geltungsdauer aufrechterhalten (Betriebspflicht, § 21 PBefG); den Umfang kann die Landesregierung durch Rechtsverordnung regeln (§ 47 Abs. 3 PBefG)."], "richtig": 2, "erklaerung": "Taxiunternehmer müssen den genehmigten Betrieb aufnehmen und während der Geltungsdauer aufrechterhalten (Betriebspflicht, § 21 PBefG); den Umfang kann die Landesregierung durch Rechtsverordnung regeln (§ 47 Abs. 3 PBefG).", "schwierigkeit": "mittel"}, {"id": 9, "gesetz": "PBefG", "frage": "#0009 Sind Mietwagen ebenfalls betriebspflichtig?", "antworten": ["Ja, aber nur während der von der Genehmigungsbehörde festgelegten Betriebszeiten; außerhalb dieser Zeiten sind Mietwagen befreit (§ 49 Abs. 4 PBefG).", "Nein, Mietwagen haben keine Betriebspflicht und dürfen Fahrten ablehnen (§ 49 PBefG).", "Ja, Mietwagenunternehmer müssen ihren Betrieb wie Taxiunternehmer dauerhaft aufrechterhalten und Aufträge annehmen (§ 21 PBefG)."], "richtig": 1, "erklaerung": "Nein, Mietwagen haben keine Betriebspflicht und dürfen Fahrten ablehnen (§ 49 PBefG).", "schwierigkeit": "schwer"}, {"id": 10, "gesetz": "PBefG", "frage": "#0010 Wann darf ein Taxi eine Beförderung verweigern?", "antworten": ["Wenn die Voraussetzungen der Beförderungspflicht fehlen (§ 22 PBefG), die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 47 Abs. 4 PBefG) oder Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft).", "Wenn die Fahrt den Fahrer über seine tägliche Höchstarbeitszeit hinaus beschäftigen würde oder der Fahrgast Gepäck mitführt (§ 21 PBefG).", "Wenn der Fahrgast die Fahrt nicht im Voraus bezahlen kann oder das Fahrtziel nach Einschätzung des Fahrers zu nah liegt (§ 22 PBefG)."], "richtig": 0, "erklaerung": "Wenn die Voraussetzungen der Beförderungspflicht fehlen (§ 22 PBefG), die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 47 Abs. 4 PBefG) oder Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft).", "schwierigkeit": "leicht"}, {"id": 11, "gesetz": "PBefG", "frage": "#0011 Sind Taxen an feste Tarife gebunden?", "antworten": ["Ja, der Tarif wird vom Bundesverkehrsministerium bundeseinheitlich festgesetzt und gilt für alle Taxen in Deutschland gleichermaßen (§ 51 Abs. 1 PBefG).", "Nein, die Taxitarife sind nur unverbindliche Richtwerte; Unternehmer und Fahrgast können den Fahrpreis jederzeit frei vereinbaren (§ 51 Abs. 1 PBefG).", "Ja, die Beförderungsentgelte werden durch Rechtsverordnung der Landesregierung bzw. der von ihr ermächtigten Stelle (meist Kreis oder kreisfreie Stadt) als Taxitarif festgesetzt (§ 51 Abs. 1 PBefG)."], "richtig": 2, "erklaerung": "Ja, die Beförderungsentgelte werden durch Rechtsverordnung der Landesregierung bzw. der von ihr ermächtigten Stelle (meist Kreis oder kreisfreie Stadt) als Taxitarif festgesetzt (§ 51 Abs. 1 PBefG).", "schwierigkeit": "mittel"}, {"id": 12, "gesetz": "PBefG", "frage": "#0012 Gilt die Tarifpflicht auch für Mietwagen?", "antworten": ["Ja, Mietwagen müssen einen von der Genehmigungsbehörde festgelegten Höchstpreis je Kilometer einhalten, den sie nicht überschreiten dürfen (§ 49 Abs. 4 PBefG).", "Nein, das Entgelt im Mietwagenverkehr wird grundsätzlich frei vereinbart; die Genehmigungsbehörde kann jedoch tarifbezogene Regelungen, insbesondere Mindestbeförderungsentgelte, festlegen (§ 51a Abs. 1 PBefG).", "Ja, für Mietwagen gilt derselbe Taxitarif, den die Landesregierung festsetzt; Abweichungen sind nur mit Genehmigung der IHK zulässig (§ 51 Abs. 1 PBefG)."], "richtig": 1, "erklaerung": "Nein, das Entgelt im Mietwagenverkehr wird grundsätzlich frei vereinbart; die Genehmigungsbehörde kann jedoch tarifbezogene Regelungen, insbesondere Mindestbeförderungsentgelte, festlegen (§ 51a Abs. 1 PBefG).", "schwierigkeit": "schwer"}, {"id": 13, "gesetz": "PBefG", "frage": "#0013 Welche besonderen Merkmale müssen Taxen aufweisen?", "antworten": ["Blaues Ordnungsnummernschild an der Frontscheibe (§ 27 BOKraft), ein nicht beleuchtbares Taxischild und ein Fahrpreisanzeiger, der nur in Großstädten Pflicht ist (§ 26 BOKraft).", "Gelber Anstrich und ein Dachschild mit der Aufschrift „Taxi“ (§ 26 BOKraft), das Kennzeichen des Unternehmers auf der Fahrertür sowie ein Wegstreckenzähler, der nur bei längeren Fahrten genutzt wird (§ 28 BOKraft).", "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (Taxameter), der für jede Taxe Pflicht ist (§ 28 BOKraft)."], "richtig": 2, "erklaerung": "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (Taxameter), der für jede Taxe Pflicht ist (§ 28 BOKraft).", "schwierigkeit": "leicht"}, {"id": 14, "gesetz": "PBefG", "frage": "#0014 Welche Pflichten gelten für den Betriebssitz von Mietwagen?", "antworten": ["Der Mietwagen darf nach Auftragsende an einem beliebigen geeigneten Ort bereitgehalten werden, solange er mindestens 50 m von einem Taxistand entfernt steht (§ 49 Abs. 4 PBefG).", "Der Betriebssitz muss ständig besetzt sein und der Mietwagen muss spätestens nach 24 Stunden dorthin zurückkehren, auch wenn ein neuer Auftrag vorliegt (§ 21 PBefG).", "Nach Ausführung des Auftrags muss der Mietwagen unverzüglich zum Betriebssitz zurückkehren, es sei denn, er hat vor der Fahrt vom Betriebssitz oder der Wohnung oder während der Fahrt einen neuen Auftrag erhalten (§ 49 Abs. 4 PBefG)."], "richtig": 2, "erklaerung": "Nach Ausführung des Auftrags muss der Mietwagen unverzüglich zum Betriebssitz zurückkehren, es sei denn, er hat vor der Fahrt vom Betriebssitz oder der Wohnung oder während der Fahrt einen neuen Auftrag erhalten (§ 49 Abs. 4 PBefG).", "schwierigkeit": "mittel"}, {"id": 15, "gesetz": "PBefG", "frage": "#0015 Dürfen Mietwagen an Taxiständen bereitstehen?", "antworten": ["Nein, Mietwagen dürfen keine Fahrgäste an Taxiständen aufnehmen oder dort warten (§ 49 Abs. 4 PBefG).", "Ja, wenn der Mietwagenunternehmer eine Sondergenehmigung der Gemeinde besitzt, dürfen Mietwagen an Taxiständen auf Fahrgäste warten (§ 47 PBefG).", "Ja, aber nur zwischen 22 und 6 Uhr, wenn kein Taxi am Stand verfügbar ist (§ 49 Abs. 4 PBefG)."], "richtig": 0, "erklaerung": "Nein, Mietwagen dürfen keine Fahrgäste an Taxiständen aufnehmen oder dort warten (§ 49 Abs. 4 PBefG).", "schwierigkeit": "schwer"}, {"id": 16, "gesetz": "PBefG", "frage": "#0016 Welche Strafen drohen bei unerlaubtem Taxibetrieb?", "antworten": ["Es liegt eine Straftat vor, die mit Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe bestraft wird (§ 148 GewO).", "Es droht ausschließlich ein Verwarnungsgeld von bis zu 55 €; ein Bußgeldverfahren findet nicht statt (§ 56 OWiG).", "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG)."], "richtig": 2, "erklaerung": "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG).", "schwierigkeit": "leicht"}, {"id": 17, "gesetz": "PBefG", "frage": "#0017 Welche Konsequenzen drohen Taxiunternehmen, die sich nicht an die Tarifpflicht halten?", "antworten": ["Geldbuße bis zu 10.000 € (§ 61 Abs. 1 Nr. 3 Buchst. c, Abs. 2 PBefG); bei wiederholten Verstößen Widerruf der Genehmigung wegen Unzuverlässigkeit (§ 25 Abs. 1 PBefG).", "Geldstrafe bis zu 180 Tagessätzen wegen Betrugs und sofortige Stilllegung des Fahrzeugs durch die Zulassungsstelle (§ 263 StGB).", "Verwarnung durch die IHK und Entzug der Fahrerlaubnis zur Fahrgastbeförderung (§ 48 FeV); die Genehmigung bleibt unberührt."], "richtig": 0, "erklaerung": "Geldbuße bis zu 10.000 € (§ 61 Abs. 1 Nr. 3 Buchst. c, Abs. 2 PBefG); bei wiederholten Verstößen Widerruf der Genehmigung wegen Unzuverlässigkeit (§ 25 Abs. 1 PBefG).", "schwierigkeit": "mittel"}, {"id": 18, "gesetz": "PBefG", "frage": "#0018 Dürfen Mietwagen Krankenfahrten durchführen?", "antworten": ["Nein, Krankenfahrten sind dem Taxiverkehr vorbehalten; Mietwagen dürfen Patienten nicht befördern (§ 47 PBefG).", "Nein, Mietwagen dürfen Kranke nur befördern, wenn sie mit Liegevorrichtung und medizinisch geschultem Begleitpersonal ausgestattet sind (§ 49 Abs. 4 PBefG; § 133 SGB V).", "Ja, Krankenfahrten (sitzende Beförderung ohne medizinisch-fachliche Betreuung) sind mit Mietwagen auf Bestellung zulässig; die Abrechnung mit Krankenkassen setzt einen Vertrag mit der Kasse voraus (§ 49 Abs. 4 PBefG; § 133 SGB V)."], "richtig": 2, "erklaerung": "Ja, Krankenfahrten (sitzende Beförderung ohne medizinisch-fachliche Betreuung) sind mit Mietwagen auf Bestellung zulässig; die Abrechnung mit Krankenkassen setzt einen Vertrag mit der Kasse voraus (§ 49 Abs. 4 PBefG; § 133 SGB V).", "schwierigkeit": "schwer"}, {"id": 19, "gesetz": "PBefG", "frage": "#0019 Sind digitale Fahrtenvermittlungen für Taxi- und Mietwagen erlaubt?", "antworten": ["Ja, die Vermittlung über Apps/Plattformen ist zulässig; der Vermittler braucht keine eigene Genehmigung (§ 1 Abs. 3, § 2 Abs. 1b PBefG), die Beförderung selbst darf aber nur ein Unternehmer mit Genehmigung durchführen (§ 2 Abs. 1 PBefG).", "Nein, digitale Vermittlung ist verboten; Fahraufträge dürfen nur telefonisch oder am Taxistand angenommen werden (§ 47 PBefG).", "Ja, aber der Vermittler braucht eine eigene Genehmigung als Mietwagenunternehmer und muss einen Betriebssitz in jeder Stadt unterhalten, in der er vermittelt (§ 2 Abs. 1b PBefG)."], "richtig": 0, "erklaerung": "Ja, die Vermittlung über Apps/Plattformen ist zulässig; der Vermittler braucht keine eigene Genehmigung (§ 1 Abs. 3, § 2 Abs. 1b PBefG), die Beförderung selbst darf aber nur ein Unternehmer mit Genehmigung durchführen (§ 2 Abs. 1 PBefG).", "schwierigkeit": "leicht"}, {"id": 20, "gesetz": "PBefG", "frage": "#0020 Welche Dokumente muss ein Taxifahrer mitführen?", "antworten": ["Führerschein, Fahrzeugbrief (Zulassungsbescheinigung Teil II), Fahrtenbuch der letzten drei Monate sowie ein aktuelles Führungszeugnis (§ 4 FeV).", "Personalausweis, Gewerbeanmeldung, Nachweis der Haftpflichtversicherung und den letzten Bescheid über die Hauptuntersuchung (§ 14 GewO).", "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft)."], "richtig": 2, "erklaerung": "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft).", "schwierigkeit": "mittel"}, {"id": 21, "gesetz": "PBefG", "frage": "#0021 Welche Regeln gelten für Taxameter?", "antworten": ["Taxen müssen einen beleuchtbaren, geeichten Fahrpreisanzeiger oder ein konformitätsbewertetes softwarebasiertes System haben (§ 28 BOKraft); zudem ist eine zertifizierte technische Sicherheitseinrichtung (TSE) vorgeschrieben (§ 146a AO, KassenSichV).", "Ein Taxameter ist nur in Städten über 100.000 Einwohnern vorgeschrieben; auf dem Land genügt eine Preisliste im Fahrzeug (§ 28 BOKraft).", "Das Taxameter muss alle zwei Jahre vom Hersteller kalibriert werden; eine TSE ist ausschließlich für Registrierkassen, nicht für Taxameter vorgeschrieben (§ 28 BOKraft)."], "richtig": 0, "erklaerung": "Taxen müssen einen beleuchtbaren, geeichten Fahrpreisanzeiger oder ein konformitätsbewertetes softwarebasiertes System haben (§ 28 BOKraft); zudem ist eine zertifizierte technische Sicherheitseinrichtung (TSE) vorgeschrieben (§ 146a AO, KassenSichV).", "schwierigkeit": "schwer"}, {"id": 22, "gesetz": "PBefG", "frage": "#0022 Wann dürfen Mietwagen als Taxi eingesetzt werden?", "antworten": ["Immer dann, wenn alle Taxen im Ort ausgelastet sind, kann die Genehmigungsbehörde Mietwagen vorübergehend den Taxistand freigeben (§ 49 Abs. 4 PBefG).", "Niemals, Mietwagen dürfen nicht im Taxiverkehr fahren (§ 49 PBefG).", "Ja, Mietwagen dürfen im Taxiverkehr eingesetzt werden, wenn der Unternehmer zusätzlich eine Taxigenehmigung besitzt und das Fahrzeug entsprechend gekennzeichnet ist (§ 47 PBefG)."], "richtig": 1, "erklaerung": "Niemals, Mietwagen dürfen nicht im Taxiverkehr fahren (§ 49 PBefG).", "schwierigkeit": "leicht"}, {"id": 23, "gesetz": "PBefG", "frage": "#0023 Welche Mindestanforderung gilt für die finanzielle Leistungsfähigkeit von Taxiunternehmen?", "antworten": ["Mindestens 9.000 € für das erste und 5.000 € für jedes weitere Fahrzeug, wie sie für Kraftomnibusse nach Art. 7 VO (EG) Nr. 1071/2009 gelten (§ 2 Abs. 1 Nr. 1 PBZugV); eine Sonderregelung für Taxen gibt es nicht.", "Eigenkapital und Reserven von mindestens einem Viertel der Beträge nach Art. 7 VO (EG) Nr. 1071/2009 je Fahrzeug, also 2.250 € für das erste und 1.250 € für jedes weitere Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "Mindestens 5.000 € je Fahrzeug als Barguthaben bei einer Bank, nachzuweisen durch eine Bankbürgschaft (§ 2 Abs. 1 Nr. 1 PBZugV)."], "richtig": 1, "erklaerung": "Eigenkapital und Reserven von mindestens einem Viertel der Beträge nach Art. 7 VO (EG) Nr. 1071/2009 je Fahrzeug, also 2.250 € für das erste und 1.250 € für jedes weitere Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "schwierigkeit": "mittel"}, {"id": 24, "gesetz": "PBefG", "frage": "#0024 Wann kann eine Taxikonzession widerrufen werden?", "antworten": ["Nur bei einer rechtskräftigen Verurteilung zu einer Freiheitsstrafe; Verstöße gegen Steuer- oder Sozialrecht rechtfertigen keinen Widerruf (§ 25 PBefG).", "Wenn der Unternehmer die Konzession länger als 6 Monate nicht nutzt oder seinen Betriebssitz innerhalb derselben Gemeinde verlegt (§ 26 PBefG).", "Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG)."], "richtig": 2, "erklaerung": "Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG).", "schwierigkeit": "schwer"}, {"id": 25, "gesetz": "PBefG", "frage": "#0025 Welche Behörde ist für Genehmigungen im Personenverkehr zuständig?", "antworten": ["Die Industrie- und Handelskammer am Betriebssitz des Unternehmers (§ 5 PBZugV).", "Das Kraftfahrt-Bundesamt in Flensburg (§ 20 StVZO).", "Die von der Landesregierung bestimmte Genehmigungsbehörde (§ 11 PBefG)."], "richtig": 2, "erklaerung": "Die von der Landesregierung bestimmte Genehmigungsbehörde (§ 11 PBefG).", "schwierigkeit": "leicht"}, {"id": 26, "gesetz": "PBefG", "frage": "#0026 Welche besonderen Vorschriften gelten für die Personenbeförderung von Menschen mit Behinderung?", "antworten": ["Die Beförderungspflicht (§ 22, § 47 Abs. 4 PBefG) gilt auch für Menschen mit Behinderung; bei Taxen ist ab 20 Fahrzeugen je Unternehmer eine Mindestverfügbarkeit barrierefreier Fahrzeuge vorzusehen (Richtwert 5 %, § 64c PBefG).", "Die Beförderungspflicht gilt nicht für Rollstuhlfahrer; barrierefreie Fahrzeuge müssen erst ab 100 Fahrzeugen je Unternehmer vorgehalten werden (§ 22 PBefG).", "Menschen mit Behinderung dürfen nur befördert werden, wenn sie eine Begleitperson mitführen; jedes Taxi muss eine Rampe an Bord haben (§ 64c PBefG)."], "richtig": 0, "erklaerung": "Die Beförderungspflicht (§ 22, § 47 Abs. 4 PBefG) gilt auch für Menschen mit Behinderung; bei Taxen ist ab 20 Fahrzeugen je Unternehmer eine Mindestverfügbarkeit barrierefreier Fahrzeuge vorzusehen (Richtwert 5 %, § 64c PBefG).", "schwierigkeit": "mittel"}, {"id": 27, "gesetz": "PBefG", "frage": "#0027 Welche Voraussetzungen müssen Fahrer im gewerblichen Personenverkehr erfüllen?", "antworten": ["Fahrer benötigen eine Fahrerlaubnis zur Fahrgastbeförderung (u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehtest) und für Taxen/Mietwagen einen Fachkundenachweis (§ 48 Abs. 4 FeV). Eine Ortskundeprüfung ist nicht mehr vorgesehen.", "Mindestalter 18 Jahre, Klasse B seit einem Jahr, Ortskundeprüfung bei der IHK und ein Erste-Hilfe-Kurs, der alle zwei Jahre aufzufrischen ist (§ 48 FeV).", "Mindestalter 23 Jahre, Klasse B seit 3 Jahren sowie eine bestandene Ortskundeprüfung und eine psychologische Eignungsuntersuchung bei jeder Verlängerung (§ 48 Abs. 4 FeV)."], "richtig": 0, "erklaerung": "Fahrer benötigen eine Fahrerlaubnis zur Fahrgastbeförderung (u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehtest) und für Taxen/Mietwagen einen Fachkundenachweis (§ 48 Abs. 4 FeV). Eine Ortskundeprüfung ist nicht mehr vorgesehen.", "schwierigkeit": "schwer"}, {"id": 28, "gesetz": "PBefG", "frage": "#0028 Welche finanziellen Nachweise müssen Taxi- und Mietwagenunternehmen bei der Genehmigungsbehörde erbringen?", "antworten": ["Nur eine Bescheinigung der IHK über die bestandene Fachkundeprüfung und ein Kontoauszug der letzten zwölf Monate (§ 1 PBZugV).", "Der Jahresabschluss der letzten drei Jahre, testiert durch einen Steuerberater, sowie eine Bürgschaft in Höhe von 50.000 € (§ 2 Abs. 2 PBZugV); Bescheinigungen von Behörden sind nicht vorgesehen.", "Bescheinigungen in Steuersachen des Finanzamts, Unbedenklichkeitsbescheinigungen von Gemeinde, Sozialversicherungsträgern und Berufsgenossenschaft (höchstens 3 Monate alt) sowie eine Eigenkapitalbescheinigung bzw. bestätigte Vermögensübersicht (§ 2 Abs. 2 PBZugV)."], "richtig": 2, "erklaerung": "Bescheinigungen in Steuersachen des Finanzamts, Unbedenklichkeitsbescheinigungen von Gemeinde, Sozialversicherungsträgern und Berufsgenossenschaft (höchstens 3 Monate alt) sowie eine Eigenkapitalbescheinigung bzw. bestätigte Vermögensübersicht (§ 2 Abs. 2 PBZugV).", "schwierigkeit": "leicht"}, {"id": 29, "gesetz": "PBefG", "frage": "#0029 Wie oft werden Genehmigungsinhaber im Personenverkehr auf Einhaltung der Vorschriften überprüft?", "antworten": ["Im Taxen- und Mietwagenverkehr nur, wenn Zweifel am Fortbestehen der Berufszugangsvoraussetzungen bestehen (§ 9 Abs. 1 PBZugV); im Übrigen bei der Wiedererteilung der Genehmigung und im Rahmen der laufenden Aufsicht (§ 54 PBefG).", "Jährlich durch eine unangekündigte Prüfung der IHK, bei der alle Berufszugangsvoraussetzungen vollständig neu nachgewiesen werden müssen (§ 9 Abs. 1 PBZugV).", "Alle zwei Jahre durch das Finanzamt, das die Prüfung für die Genehmigungsbehörde übernimmt (§ 54 PBefG)."], "richtig": 0, "erklaerung": "Im Taxen- und Mietwagenverkehr nur, wenn Zweifel am Fortbestehen der Berufszugangsvoraussetzungen bestehen (§ 9 Abs. 1 PBZugV); im Übrigen bei der Wiedererteilung der Genehmigung und im Rahmen der laufenden Aufsicht (§ 54 PBefG).", "schwierigkeit": "mittel"}, {"id": 30, "gesetz": "PBefG", "frage": "#0030 Welche Hauptziele verfolgt das PBefG?", "antworten": ["Ziel ist die Förderung des Wettbewerbs durch möglichst freien Marktzugang; Genehmigungen werden jedem Antragsteller ohne weitere Prüfung erteilt (§ 13 PBefG).", "Das PBefG ordnet die entgeltliche oder geschäftsmäßige Personenbeförderung (§ 1 PBefG) durch Genehmigungspflicht und Berufszugangsregeln, um eine sichere, leistungsfähige und den öffentlichen Verkehrsinteressen entsprechende Verkehrsbedienung zu gewährleisten (§§ 2, 13 PBefG).", "Das PBefG dient vorrangig der Besteuerung des Gewerbes und der Sicherung kommunaler Einnahmen aus Konzessionsabgaben (§ 2 PBefG)."], "richtig": 1, "erklaerung": "Das PBefG ordnet die entgeltliche oder geschäftsmäßige Personenbeförderung (§ 1 PBefG) durch Genehmigungspflicht und Berufszugangsregeln, um eine sichere, leistungsfähige und den öffentlichen Verkehrsinteressen entsprechende Verkehrsbedienung zu gewährleisten (§§ 2, 13 PBefG).", "schwierigkeit": "schwer"}, {"id": 31, "gesetz": "PBefG", "frage": "#0031 Was bedeutet die Beförderungspflicht im PBefG?", "antworten": ["Fahrgäste dürfen nur befördert werden, wenn sie ihr Fahrtziel vorab bezahlt haben (§ 51 PBefG).", "Fahrgäste dürfen nicht ohne triftigen Grund abgelehnt werden (§ 22 PBefG).", "Der Fahrer ist verpflichtet, Fahrgäste zu jedem beliebigen Ziel im gesamten Bundesgebiet zu fahren (§ 47 PBefG)."], "richtig": 1, "erklaerung": "Fahrgäste dürfen nicht ohne triftigen Grund abgelehnt werden (§ 22 PBefG).", "schwierigkeit": "leicht"}, {"id": 32, "gesetz": "PBefG", "frage": "#0032 Was bedeutet die Tarifpflicht im PBefG?", "antworten": ["Innerhalb des Pflichtfahrbereichs gelten die festgesetzten Taxientgelte; sie dürfen nicht über- oder unterschritten werden (§ 51 Abs. 1, 5 i. V. m. § 39 Abs. 3 PBefG).", "Taxis müssen immer zum günstigsten Preis fahren und Fahrgäste auf die preiswerteste Route hinweisen (§ 22 PBefG).", "Taxiunternehmer sind verpflichtet, ihr Fahrzeug ständig am Taxistand bereitzuhalten (§ 21 PBefG)."], "richtig": 0, "erklaerung": "Innerhalb des Pflichtfahrbereichs gelten die festgesetzten Taxientgelte; sie dürfen nicht über- oder unterschritten werden (§ 51 Abs. 1, 5 i. V. m. § 39 Abs. 3 PBefG).", "schwierigkeit": "mittel"}, {"id": 33, "gesetz": "PBefG", "frage": "#0033 Welche Sorgfaltspflicht haben Fahrer im Personenverkehr?", "antworten": ["Sie müssen sicher und rücksichtsvoll fahren, um Fahrgäste nicht zu gefährden.", "Sie müssen nur die Straßenverkehrsregeln einhalten; weitere Sorgfaltspflichten gegenüber Fahrgästen bestehen nicht.", "Sie müssen die Fahrgäste während der Fahrt unterhalten und über Sehenswürdigkeiten informieren."], "richtig": 0, "erklaerung": "Sie müssen sicher und rücksichtsvoll fahren, um Fahrgäste nicht zu gefährden.", "schwierigkeit": "schwer"}, {"id": 34, "gesetz": "PBefG", "frage": "#0034 Worauf haben Fahrgäste im Personenverkehr Anspruch?", "antworten": ["Auf eine sichere und ordnungsgemäße Beförderung gemäß den gesetzlichen Vorschriften.", "Auf freie Wahl der Route und des Fahrers unabhängig vom Tarif.", "Auf kostenlose Beförderung bei Verspätung des Fahrers von mehr als 10 Minuten."], "richtig": 0, "erklaerung": "Auf eine sichere und ordnungsgemäße Beförderung gemäß den gesetzlichen Vorschriften.", "schwierigkeit": "leicht"}, {"id": 35, "gesetz": "PBefG", "frage": "#0035 Dürfen Fahrgäste den Fahrpreis frei verhandeln?", "antworten": ["Ja, der Fahrpreis darf im Taxi stets frei verhandelt werden; der Taxitarif gilt nur als Obergrenze (§ 51 PBefG).", "Nein, im Pflichtfahrbereich gilt der festgesetzte Taxitarif; Abweichungen nur über zugelassene Festpreise, Preiskorridore bei Bestellfahrten oder genehmigte Sondervereinbarungen (§ 51 PBefG). Außerhalb des Pflichtfahrbereichs ist das Entgelt frei zu vereinbaren (§ 37 Abs. 3 BOKraft).", "Ja, aber nur mit Zustimmung des Taxameters; ein Festpreis ist nur bei Fahrten über 50 km erlaubt (§ 51 Abs. 1 PBefG)."], "richtig": 1, "erklaerung": "Nein, im Pflichtfahrbereich gilt der festgesetzte Taxitarif; Abweichungen nur über zugelassene Festpreise, Preiskorridore bei Bestellfahrten oder genehmigte Sondervereinbarungen (§ 51 PBefG). Außerhalb des Pflichtfahrbereichs ist das Entgelt frei zu vereinbaren (§ 37 Abs. 3 BOKraft).", "schwierigkeit": "mittel"}, {"id": 36, "gesetz": "PBefG", "frage": "#0036 Welche technischen Vorschriften gelten für Fahrzeuge im Personenverkehr?", "antworten": ["Fahrzeuge müssen alle zwei Jahre zur Hauptuntersuchung; eine Prüfung der BOKraft-Vorschriften erfolgt nur durch die Genehmigungsbehörde (§ 29 StVZO).", "Fahrzeuge müssen den Vorschriften der BOKraft und StVZO entsprechen und jährlich zur Hauptuntersuchung, bei der auch die BOKraft-Vorschriften geprüft werden (§ 29 StVZO i. V. m. Anlage VIII; § 41 BOKraft).", "Fahrzeuge müssen nur den Vorschriften des PBefG entsprechen; die StVZO und die BOKraft gelten ausschließlich für Omnibusse (§ 41 BOKraft)."], "richtig": 1, "erklaerung": "Fahrzeuge müssen den Vorschriften der BOKraft und StVZO entsprechen und jährlich zur Hauptuntersuchung, bei der auch die BOKraft-Vorschriften geprüft werden (§ 29 StVZO i. V. m. Anlage VIII; § 41 BOKraft).", "schwierigkeit": "schwer"}, {"id": 37, "gesetz": "PBefG", "frage": "#0037 Was gilt für die Beförderung von Kindern im Taxi?", "antworten": ["Kinder dürfen im Taxi grundsätzlich ohne Sicherung auf dem Rücksitz mitfahren, da die Kinderrückhaltepflicht für Taxen nicht gilt (§ 21 StVO).", "Für Kinder unter 14 Jahren ist im Taxi ein Kindersitz zwingend, auch bei Fahrten innerorts; der Fahrer ist für jedes Kind bußgeldpflichtig (§ 21 Abs. 1a StVO).", "Kinder unter 12 Jahren und kleiner als 150 cm müssen auch im Taxi gesichert werden; Taxen müssen auf den Rücksitzen Rückhalteeinrichtungen für zwei Kinder ab 9 kg haben, davon mindestens eine für 9–18 kg – bei regelmäßiger Kinderbeförderung gilt die volle Pflicht (§ 21 Abs. 1a StVO)."], "richtig": 2, "erklaerung": "Kinder unter 12 Jahren und kleiner als 150 cm müssen auch im Taxi gesichert werden; Taxen müssen auf den Rücksitzen Rückhalteeinrichtungen für zwei Kinder ab 9 kg haben, davon mindestens eine für 9–18 kg – bei regelmäßiger Kinderbeförderung gilt die volle Pflicht (§ 21 Abs. 1a StVO).", "schwierigkeit": "leicht"}, {"id": 38, "gesetz": "PBefG", "frage": "#0038 Dürfen Fahrgäste mit Blindenhunden befördert werden?", "antworten": ["Ja, sie müssen mitgenommen werden, auch wenn Tiere sonst nicht erlaubt sind.", "Nein, der Fahrer darf Hunde grundsätzlich ablehnen, wenn Fahrzeug oder Kleidung verschmutzt werden könnten.", "Nein, Tiere dürfen im Taxi nie befördert werden; Blindenhunde benötigen eine Sondergenehmigung der Genehmigungsbehörde."], "richtig": 0, "erklaerung": "Ja, sie müssen mitgenommen werden, auch wenn Tiere sonst nicht erlaubt sind.", "schwierigkeit": "mittel"}, {"id": 39, "gesetz": "PBefG", "frage": "#0039 Was können Fahrgäste tun, wenn sie sich über eine Fahrt beschweren wollen?", "antworten": ["Sie können sich beim Taxiunternehmen oder der zuständigen Behörde melden.", "Sie müssen sich ausschließlich beim Verbraucherzentrale-Bundesverband beschweren; Taxiunternehmen sind nicht zuständig.", "Beschwerden sind nur innerhalb von 24 Stunden bei der Polizei möglich, später verfallen sie."], "richtig": 0, "erklaerung": "Sie können sich beim Taxiunternehmen oder der zuständigen Behörde melden.", "schwierigkeit": "schwer"}, {"id": 40, "gesetz": "PBefG", "frage": "#0040 Was sollte ein Fahrer tun, wenn ein Fahrgast nicht zahlen kann?", "antworten": ["Den Fahrgast sofort aus dem Fahrzeug werfen und die Fahrt unentgeltlich beenden.", "Ruhig bleiben, eine Lösung suchen und notfalls die Polizei rufen.", "Den Fahrgast festhalten, bis er Verwandte angerufen hat, und seinen Ausweis einbehalten."], "richtig": 1, "erklaerung": "Ruhig bleiben, eine Lösung suchen und notfalls die Polizei rufen.", "schwierigkeit": "leicht"}, {"id": 41, "gesetz": "PBefG", "frage": "#0041 Wie lange darf ein Taxifahrer pro Tag arbeiten?", "antworten": ["Werktäglich grundsätzlich 10 Stunden; Verlängerung auf bis zu 12 Stunden, wenn im Durchschnitt von 12 Monaten 10 Stunden nicht überschritten werden (§ 3 ArbZG).", "Täglich höchstens 12 Stunden, unabhängig von Ausgleichszeiträumen; für Taxifahrer gilt das Arbeitszeitgesetz nicht (§ 3 ArbZG).", "Werktäglich grundsätzlich 8 Stunden; Verlängerung auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Kalendermonaten oder 24 Wochen 8 Stunden werktäglich nicht überschritten werden (§ 3 ArbZG)."], "richtig": 2, "erklaerung": "Werktäglich grundsätzlich 8 Stunden; Verlängerung auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Kalendermonaten oder 24 Wochen 8 Stunden werktäglich nicht überschritten werden (§ 3 ArbZG).", "schwierigkeit": "mittel"}, {"id": 42, "gesetz": "PBefG", "frage": "#0042 Wann muss ein Fahrer eine Pause einlegen?", "antworten": ["Eine Pause ist erst nach 8 Stunden Arbeit vorgeschrieben und beträgt mindestens 15 Minuten, bei mehr als 10 Stunden 30 Minuten (§ 4 ArbZG).", "Länger als 6 Stunden hintereinander darf nicht ohne Ruhepause gearbeitet werden; bei mehr als 6 bis 9 Stunden mindestens 30 Minuten, bei mehr als 9 Stunden 45 Minuten Pause (§ 4 ArbZG).", "Spätestens nach 4,5 Stunden Arbeit ist eine Pause von mindestens 45 Minuten am Stück vorgeschrieben, die nicht in Teile gesplittet werden darf (§ 4 ArbZG)."], "richtig": 1, "erklaerung": "Länger als 6 Stunden hintereinander darf nicht ohne Ruhepause gearbeitet werden; bei mehr als 6 bis 9 Stunden mindestens 30 Minuten, bei mehr als 9 Stunden 45 Minuten Pause (§ 4 ArbZG).", "schwierigkeit": "schwer"}, {"id": 43, "gesetz": "PBefG", "frage": "#0043 Welche Dokumente muss ein Fahrer immer mitführen?", "antworten": ["Führerschein, Fahrzeugbrief (Zulassungsbescheinigung Teil II), Fahrtenbuch der letzten drei Monate und ein aktuelles Führungszeugnis (§ 4 FeV).", "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft).", "Personalausweis, Gewerbeanmeldung, Nachweis der Haftpflichtversicherung und den letzten Prüfbericht der Hauptuntersuchung (§ 14 GewO)."], "richtig": 1, "erklaerung": "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft).", "schwierigkeit": "leicht"}, {"id": 44, "gesetz": "PBefG", "frage": "#0044 Wie oft muss eine Taxikonzession erneuert werden?", "antworten": ["Eine Erneuerung ist nur alle 10 Jahre nötig; Neubewerber erhalten die Genehmigung gleich für 10 Jahre (§ 16 Abs. 4 PBefG).", "Die Genehmigung gilt höchstens 5 Jahre (bei Neubewerbern 2 Jahre) und muss danach neu beantragt (wiedererteilt) werden (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "Die Genehmigung muss jährlich erneuert werden, wobei bei jeder Verlängerung die Fachkundeprüfung wiederholt werden muss (§ 16 PBefG)."], "richtig": 1, "erklaerung": "Die Genehmigung gilt höchstens 5 Jahre (bei Neubewerbern 2 Jahre) und muss danach neu beantragt (wiedererteilt) werden (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "schwierigkeit": "mittel"}, {"id": 45, "gesetz": "PBefG", "frage": "#0045 Was versteht man unter dem Pflichtfahrbereich?", "antworten": ["Das gesamte Bundesland, in dem der Unternehmer seinen Betriebssitz hat; dort darf er nach Belieben Fahrgäste aufnehmen (§ 47 PBefG).", "Der Bereich, innerhalb dessen Taxen an Taxiständen bereitgehalten werden dürfen; die Beförderungspflicht gilt hingegen deutschlandweit (§ 22 PBefG).", "Das Gebiet, in dem die festgesetzten Taxitarife gelten; nur innerhalb dieses Bereichs besteht die Beförderungspflicht (§ 47 Abs. 4, § 51 Abs. 1 PBefG)."], "richtig": 2, "erklaerung": "Das Gebiet, in dem die festgesetzten Taxitarife gelten; nur innerhalb dieses Bereichs besteht die Beförderungspflicht (§ 47 Abs. 4, § 51 Abs. 1 PBefG).", "schwierigkeit": "schwer"}, {"id": 51, "gesetz": "PBZugV", "frage": "#0051 Was regelt die Berufszugangsverordnung für den Straßenpersonenverkehr (PBZugV)?", "antworten": ["Die PBZugV konkretisiert die Berufszugangsvoraussetzungen Zuverlässigkeit, finanzielle Leistungsfähigkeit und fachliche Eignung für die Genehmigung nach dem PBefG (§§ 1–3 PBZugV i. V. m. § 13 Abs. 1 PBefG).", "Die PBZugV legt die Arbeits- und Ruhezeiten des Fahrpersonals und die Höhe des Mindestlohns im Personenverkehr fest (§ 3 ArbZG).", "Die PBZugV regelt die Fahrzeugausrüstung und Kennzeichnung von Taxen und Mietwagen sowie deren Betriebspflichten im Alltag (§§ 25–30 BOKraft)."], "richtig": 0, "erklaerung": "Die PBZugV konkretisiert die Berufszugangsvoraussetzungen Zuverlässigkeit, finanzielle Leistungsfähigkeit und fachliche Eignung für die Genehmigung nach dem PBefG (§§ 1–3 PBZugV i. V. m. § 13 Abs. 1 PBefG).", "schwierigkeit": "leicht"}, {"id": 52, "gesetz": "PBZugV", "frage": "#0052 Welche drei Voraussetzungen müssen Unternehmer für eine Genehmigung erfüllen?", "antworten": ["Gültiger Führerschein der Klasse B, geeignetes Fahrzeug und Betriebshof am Sitz des Unternehmens (§ 13 PBefG).", "Persönliche Zuverlässigkeit (§ 1), Mindestalter von 25 Jahren (§ 2) und eine bestandene Ortskundeprüfung (§ 3 PBZugV).", "Persönliche Zuverlässigkeit (§ 1), finanzielle Leistungsfähigkeit (§ 2) und fachliche Eignung (§ 3 PBZugV)."], "richtig": 2, "erklaerung": "Persönliche Zuverlässigkeit (§ 1), finanzielle Leistungsfähigkeit (§ 2) und fachliche Eignung (§ 3 PBZugV).", "schwierigkeit": "mittel"}, {"id": 53, "gesetz": "PBZugV", "frage": "#0053 Für welche Arten des Straßenpersonenverkehrs gilt die PBZugV?", "antworten": ["Nur für den Linienverkehr mit Straßenbahnen und Obussen; Taxen und Mietwagen sind vollständig von der PBZugV ausgenommen (§ 1 PBZugV).", "Für den Taxen- und Mietwagenverkehr sowie den Verkehr mit Kraftomnibussen; für Taxen/Mietwagen gelten Sonderregeln, z. B. § 2 Abs. 1 Nr. 2, § 3 Abs. 2 und § 7 Abs. 1 Satz 2 PBZugV.", "Ausschließlich für Taxen; der Mietwagenverkehr und der Omnibusverkehr werden durch eigene Verordnungen geregelt (§ 2 Abs. 1 Nr. 2 PBZugV)."], "richtig": 1, "erklaerung": "Für den Taxen- und Mietwagenverkehr sowie den Verkehr mit Kraftomnibussen; für Taxen/Mietwagen gelten Sonderregeln, z. B. § 2 Abs. 1 Nr. 2, § 3 Abs. 2 und § 7 Abs. 1 Satz 2 PBZugV.", "schwierigkeit": "schwer"}, {"id": 54, "gesetz": "PBZugV", "frage": "#0054 Wann gilt ein Unternehmer als zuverlässig im Sinne der PBZugV?", "antworten": ["Wenn er in den letzten zehn Jahren nicht strafrechtlich verurteilt wurde und ein polizeiliches Führungszeugnis vorlegen kann (§ 13 PBefG).", "Wenn er mindestens fünf Jahre ohne Beanstandung im Taxigewerbe tätig war und über ein einwandfreies Fahrzeug verfügt (§ 2 PBZugV).", "Wenn keine hinreichenden Anhaltspunkte dafür vorliegen, dass bei der Führung des Unternehmens die für den Straßenpersonenverkehr geltenden Vorschriften missachtet oder die Allgemeinheit geschädigt oder gefährdet wird (§ 1 Abs. 1 PBZugV)."], "richtig": 2, "erklaerung": "Wenn keine hinreichenden Anhaltspunkte dafür vorliegen, dass bei der Führung des Unternehmens die für den Straßenpersonenverkehr geltenden Vorschriften missachtet oder die Allgemeinheit geschädigt oder gefährdet wird (§ 1 Abs. 1 PBZugV).", "schwierigkeit": "leicht"}, {"id": 55, "gesetz": "PBZugV", "frage": "#0055 Welche Verstöße können zur Unzuverlässigkeit führen?", "antworten": ["Nur Verstöße gegen das Straßenverkehrsrecht, etwa Geschwindigkeitsüberschreitungen; Verstöße gegen Steuer- oder Arbeitsrecht sind unerheblich (§ 1 PBZugV).", "Rechtskräftige Verurteilungen wegen schwerer Straftaten sowie schwere Verstöße gegen PBefG, Arbeits- und Sozialrecht, Verkehrsvorschriften, Abgabenpflichten (z. B. Steuerhinterziehung), Pflichtversicherungs- oder Umweltrecht (§ 1 Abs. 1 Satz 2 PBZugV).", "Jede einzelne Ordnungswidrigkeit, auch ein geringfügiger Parkverstoß, führt sofort zur Unzuverlässigkeit und zum Widerruf der Genehmigung (§ 1 Abs. 1 Satz 2 PBZugV)."], "richtig": 1, "erklaerung": "Rechtskräftige Verurteilungen wegen schwerer Straftaten sowie schwere Verstöße gegen PBefG, Arbeits- und Sozialrecht, Verkehrsvorschriften, Abgabenpflichten (z. B. Steuerhinterziehung), Pflichtversicherungs- oder Umweltrecht (§ 1 Abs. 1 Satz 2 PBZugV).", "schwierigkeit": "mittel"}, {"id": 56, "gesetz": "PBZugV", "frage": "#0056 Wie wird die persönliche Zuverlässigkeit überprüft?", "antworten": ["Durch Auskunft aus dem Fahreignungsregister des Kraftfahrt-Bundesamts und eine Bürgschaft in Höhe von 10.000 € (§ 1 Abs. 2 PBZugV).", "Durch ein persönliches Gespräch bei der IHK und ein Gutachten eines Amtsarztes über die Zuverlässigkeit des Unternehmers (§ 5 PBZugV).", "Durch Führungszeugnis (zur Vorlage bei einer Behörde), Auskunft aus dem Gewerbezentralregister, Bescheinigungen in Steuersachen und Unbedenklichkeitsbescheinigungen anderer Stellen (§ 1 Abs. 3 PBZugV)."], "richtig": 2, "erklaerung": "Durch Führungszeugnis (zur Vorlage bei einer Behörde), Auskunft aus dem Gewerbezentralregister, Bescheinigungen in Steuersachen und Unbedenklichkeitsbescheinigungen anderer Stellen (§ 1 Abs. 3 PBZugV).", "schwierigkeit": "schwer"}, {"id": 57, "gesetz": "PBZugV", "frage": "#0057 Warum ist finanzielle Leistungsfähigkeit eine Voraussetzung für die Genehmigung?", "antworten": ["Damit sichergestellt ist, dass das Unternehmen seine laufenden Kosten decken kann (§ 2 Abs. 1 PBZugV).", "Damit der Unternehmer die Fachkundeprüfung bezahlen und Fahrgäste bei Unfällen entschädigen kann (§ 3 PBZugV).", "Damit die Fahrer ihren Lohn nach dem Mindestlohngesetz erhalten und der Staat Steuern einnehmen kann (§ 2 PBZugV)."], "richtig": 0, "erklaerung": "Damit sichergestellt ist, dass das Unternehmen seine laufenden Kosten decken kann (§ 2 Abs. 1 PBZugV).", "schwierigkeit": "leicht"}, {"id": 58, "gesetz": "PBZugV", "frage": "#0058 Welche finanziellen Nachweise müssen vorgelegt werden?", "antworten": ["Steuerbescheinigungen, Unbedenklichkeitsbescheinigungen und Eigenkapitalnachweise (§ 2 Abs. 2 PBZugV).", "Eine Schufa-Auskunft und die Bilanz der letzten fünf Jahre, jeweils beglaubigt durch die IHK (§ 1 Abs. 3 PBZugV).", "Nur den Nachweis über die abgeschlossene Haftpflichtversicherung und den Kaufvertrag des Fahrzeugs (§ 2 Abs. 2 PBZugV)."], "richtig": 0, "erklaerung": "Steuerbescheinigungen, Unbedenklichkeitsbescheinigungen und Eigenkapitalnachweise (§ 2 Abs. 2 PBZugV).", "schwierigkeit": "mittel"}, {"id": 59, "gesetz": "PBZugV", "frage": "#0059 Welche finanzielle Mindestanforderung gilt für den Taxen- und Mietwagenverkehr?", "antworten": ["Mindestens das Doppelte der in der Verordnung (EG) Nr. 1071/2009 festgelegten Beträge für das erste Fahrzeug (§ 2 Abs. 1 Nr. 1 PBZugV).", "Mindestens ein Viertel der in der Verordnung (EG) Nr. 1071/2009 festgelegten Beträge pro Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "Ein Eigenkapital von mindestens 5.000 € je Fahrzeug, das auf einem Sperrkonto bei der IHK zu hinterlegen ist (§ 3 Abs. 2 PBZugV)."], "richtig": 1, "erklaerung": "Mindestens ein Viertel der in der Verordnung (EG) Nr. 1071/2009 festgelegten Beträge pro Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "schwierigkeit": "schwer"}, {"id": 60, "gesetz": "PBZugV", "frage": "#0060 Wie kann die fachliche Eignung nachgewiesen werden?", "antworten": ["Durch den Nachweis eines abgeschlossenen Studiums oder einer mindestens zehnjährigen Tätigkeit als Taxifahrer (§ 6 PBZugV).", "Nur durch die Fachkundeprüfung vor der IHK; Ausnahmen für Berufserfahrung oder andere Abschlüsse gibt es nicht (§ 4 PBZugV).", "Durch die Fachkundeprüfung vor der IHK (§ 4), eine als gleichwertig anerkannte Abschlussprüfung (§ 6) oder eine mindestens dreijährige leitende Tätigkeit in einem Taxi- oder Mietwagenunternehmen (§ 7 PBZugV)."], "richtig": 2, "erklaerung": "Durch die Fachkundeprüfung vor der IHK (§ 4), eine als gleichwertig anerkannte Abschlussprüfung (§ 6) oder eine mindestens dreijährige leitende Tätigkeit in einem Taxi- oder Mietwagenunternehmen (§ 7 PBZugV).", "schwierigkeit": "leicht"}, {"id": 61, "gesetz": "PBZugV", "frage": "#0061 Wie ist die Fachkundeprüfung aufgebaut?", "antworten": ["Sie besteht aus einer ausschließlich mündlichen Prüfung vor einem Prüfungsausschuss der Handwerkskammer (§ 5 PBZugV).", "Sie besteht aus schriftlichen Prüfungen (Multiple-Choice & Fallstudien) und ggf. einer mündlichen Prüfung (§ 4 PBZugV).", "Sie besteht aus einem praktischen Fahrtest im Taxi und einer Ortskundeprüfung (§ 48 FeV)."], "richtig": 1, "erklaerung": "Sie besteht aus schriftlichen Prüfungen (Multiple-Choice & Fallstudien) und ggf. einer mündlichen Prüfung (§ 4 PBZugV).", "schwierigkeit": "mittel"}, {"id": 62, "gesetz": "PBZugV", "frage": "#0062 Wie viele Punkte sind erforderlich, um die Prüfung zu bestehen?", "antworten": ["Mindestens 60 % der Gesamtpunkte, wobei jede Teilprüfung mindestens 50 % erreichen muss (§ 4 PBZugV).", "Mindestens 50 % der Gesamtpunkte, wobei jede Teilprüfung mindestens 30 % erreichen muss (§ 5 PBZugV).", "Mindestens 80 % der Gesamtpunkte; ein Nachweis in einzelnen Teilprüfungen ist nicht erforderlich (§ 4 PBZugV)."], "richtig": 0, "erklaerung": "Mindestens 60 % der Gesamtpunkte, wobei jede Teilprüfung mindestens 50 % erreichen muss (§ 4 PBZugV).", "schwierigkeit": "schwer"}, {"id": 63, "gesetz": "PBZugV", "frage": "#0063 Welche Themen umfasst die Fachkundeprüfung?", "antworten": ["Ortskunde, Fahrpraxis, Erste Hilfe und Kundenkommunikation (§ 48 FeV).", "Ausschließlich Personenbeförderungsrecht und Kfz-Technik; Steuer- und Arbeitsrecht sind nicht Prüfungsgegenstand (§ 3 PBZugV).", "Personenbeförderungs-, Straßenverkehrs-, Arbeits-, Sozialversicherungs-, Beförderungsvertrags- und Steuerrecht, kaufmännische und finanzielle Führung, technischer Betrieb sowie Verkehrssicherheit und Umweltschutz (§ 3 Abs. 2 i. V. m. Anlage 3 PBZugV)."], "richtig": 2, "erklaerung": "Personenbeförderungs-, Straßenverkehrs-, Arbeits-, Sozialversicherungs-, Beförderungsvertrags- und Steuerrecht, kaufmännische und finanzielle Führung, technischer Betrieb sowie Verkehrssicherheit und Umweltschutz (§ 3 Abs. 2 i. V. m. Anlage 3 PBZugV).", "schwierigkeit": "leicht"}, {"id": 64, "gesetz": "PBZugV", "frage": "#0064 Wer führt die Fachkundeprüfung durch?", "antworten": ["Das Kraftfahrt-Bundesamt in Flensburg (§ 20 StVZO).", "Die Industrie- und Handelskammern (IHK) (§ 5 PBZugV).", "Die örtliche Genehmigungsbehörde gemeinsam mit dem Finanzamt (§ 11 PBefG)."], "richtig": 1, "erklaerung": "Die Industrie- und Handelskammern (IHK) (§ 5 PBZugV).", "schwierigkeit": "mittel"}, {"id": 65, "gesetz": "PBZugV", "frage": "#0065 Welche alternativen Nachweise gibt es zur Fachkundeprüfung?", "antworten": ["Der Nachweis einer Ausbildung zum Berufskraftfahrer sowie eine Bescheinigung des Arbeitgebers über drei Jahre Fahrtätigkeit (§ 6 PBZugV).", "Ein abgeschlossenes Studium der Betriebswirtschaft oder eine leitende Tätigkeit von mindestens 10 Jahren, die nicht länger als 5 Jahre zurückliegt (§ 7 PBZugV).", "Als gleichwertig anerkannte Abschlussprüfungen (§ 6 PBZugV) oder eine leitende Tätigkeit von mindestens 5 Jahren, im Taxen- und Mietwagenverkehr mindestens 3 Jahren, die nicht länger als 2 Jahre zurückliegt (§ 7 PBZugV)."], "richtig": 2, "erklaerung": "Als gleichwertig anerkannte Abschlussprüfungen (§ 6 PBZugV) oder eine leitende Tätigkeit von mindestens 5 Jahren, im Taxen- und Mietwagenverkehr mindestens 3 Jahren, die nicht länger als 2 Jahre zurückliegt (§ 7 PBZugV).", "schwierigkeit": "schwer"}, {"id": 66, "gesetz": "PBZugV", "frage": "#0066 Wie lange darf eine leitende Tätigkeit zurückliegen, um anerkannt zu werden?", "antworten": ["Sie muss unmittelbar bis zum Tag der Antragstellung bestanden haben; eine Unterbrechung ist nicht zulässig (§ 6 PBZugV).", "Sie muss in den letzten zwei Jahren vor Antragstellung ausgeübt worden sein (§ 7 PBZugV).", "Sie darf höchstens zehn Jahre zurückliegen, solange sie ununterbrochen ausgeübt wurde (§ 7 PBZugV)."], "richtig": 1, "erklaerung": "Sie muss in den letzten zwei Jahren vor Antragstellung ausgeübt worden sein (§ 7 PBZugV).", "schwierigkeit": "leicht"}, {"id": 67, "gesetz": "PBZugV", "frage": "#0067 Wie oft werden Unternehmen auf Einhaltung der Berufszugangsvoraussetzungen überprüft?", "antworten": ["Grundsätzlich regelmäßig, mindestens alle 5 Jahre; im Taxen- und Mietwagenverkehr jedoch nur, wenn Zweifel am Fortbestehen der Voraussetzungen bestehen. Ein Verfahren auf Erneuerung der Genehmigung ersetzt die Kontrolle (§ 9 Abs. 1, 4 PBZugV).", "Einmal jährlich durch die IHK; im Taxen- und Mietwagenverkehr erfolgt die Kontrolle zusätzlich bei jedem Fahrzeugwechsel (§ 54 PBefG).", "Nur bei der Erstgenehmigung; später finden keine Kontrollen mehr statt, auch bei Zweifeln nicht (§ 9 Abs. 4 PBZugV)."], "richtig": 0, "erklaerung": "Grundsätzlich regelmäßig, mindestens alle 5 Jahre; im Taxen- und Mietwagenverkehr jedoch nur, wenn Zweifel am Fortbestehen der Voraussetzungen bestehen. Ein Verfahren auf Erneuerung der Genehmigung ersetzt die Kontrolle (§ 9 Abs. 1, 4 PBZugV).", "schwierigkeit": "mittel"}, {"id": 68, "gesetz": "PBZugV", "frage": "#0068 Was passiert, wenn die finanzielle Leistungsfähigkeit nicht mehr gegeben ist?", "antworten": ["Die Genehmigung erlischt automatisch am Tag des Wegfalls, ohne dass eine Frist zur Nachbesserung eingeräumt wird (§ 25 PBefG).", "Der Unternehmer muss innerhalb von 14 Tagen einen Bürgen stellen, sonst wird das Fahrzeug von der Zulassungsstelle stillgelegt (§ 2 PBZugV).", "Eine Frist von maximal 6 Monaten zur Nachbesserung kann eingeräumt werden (§ 9 PBZugV)."], "richtig": 2, "erklaerung": "Eine Frist von maximal 6 Monaten zur Nachbesserung kann eingeräumt werden (§ 9 PBZugV).", "schwierigkeit": "schwer"}, {"id": 69, "gesetz": "PBZugV", "frage": "#0069 Welche Konsequenzen drohen bei Verstößen gegen die PBZugV?", "antworten": ["Die Genehmigung bleibt bestehen; es wird lediglich ein Eintrag im Fahreignungsregister in Flensburg vorgenommen (§ 4 StVG).", "Bei jedem Verstoß droht eine Freiheitsstrafe bis zu einem Jahr nach der PBZugV (§ 148 GewO).", "Entfallen die Berufszugangsvoraussetzungen, ist die Genehmigung zu widerrufen (§ 25 Abs. 1 PBefG); Verstöße gegen das PBefG und seine Verordnungen können mit Geldbuße geahndet werden (§ 61 PBefG)."], "richtig": 2, "erklaerung": "Entfallen die Berufszugangsvoraussetzungen, ist die Genehmigung zu widerrufen (§ 25 Abs. 1 PBefG); Verstöße gegen das PBefG und seine Verordnungen können mit Geldbuße geahndet werden (§ 61 PBefG).", "schwierigkeit": "leicht"}, {"id": 70, "gesetz": "PBZugV", "frage": "#0070 Welche Anforderungen gelten für Fahrzeuge im Taxen- und Mietwagenverkehr?", "antworten": ["Sie müssen mindestens neun Sitzplätze haben und alle zwei Jahre von der IHK abgenommen werden (§ 48 PBefG).", "Sie müssen vier Türen, ein Faxgerät und ein Fahrtenschreiber haben; ein Fahrpreisanzeiger ist bei Taxen freiwillig (§ 17 BOKraft).", "Sie müssen verkehrssicher sein und u. a. zwei Türen rechts und eine Alarmanlage haben, Taxen zudem hell-elfenbeinfarbenen Anstrich, Taxischild, Fahrpreisanzeiger und Navigationsgerät, Mietwagen einen Wegstreckenzähler (§§ 25–30 BOKraft)."], "richtig": 2, "erklaerung": "Sie müssen verkehrssicher sein und u. a. zwei Türen rechts und eine Alarmanlage haben, Taxen zudem hell-elfenbeinfarbenen Anstrich, Taxischild, Fahrpreisanzeiger und Navigationsgerät, Mietwagen einen Wegstreckenzähler (§§ 25–30 BOKraft).", "schwierigkeit": "mittel"}, {"id": 71, "gesetz": "PBZugV", "frage": "#0071 Welche Sozialvorschriften gelten für Taxi- und Mietwagenunternehmer?", "antworten": ["Nur das Handelsgesetzbuch und das Bürgerliche Gesetzbuch; arbeitsrechtliche Sondervorschriften gelten für Taxiunternehmer nicht (§ 1 PBZugV).", "Insbesondere das Arbeitszeitgesetz (Arbeitszeit, Ruhepausen, Ruhezeiten), das Mindestlohngesetz und das Sozialversicherungsrecht (ArbZG, MiLoG, SGB IV; vgl. Anlage 3 Nr. 1.3, 1.4 PBZugV).", "Die Lenk- und Ruhezeitenverordnung (EG) Nr. 561/2006 mit Fahrtenschreiber, die für jedes Taxi unabhängig von der Größe gilt (§ 1 FPersG)."], "richtig": 1, "erklaerung": "Insbesondere das Arbeitszeitgesetz (Arbeitszeit, Ruhepausen, Ruhezeiten), das Mindestlohngesetz und das Sozialversicherungsrecht (ArbZG, MiLoG, SGB IV; vgl. Anlage 3 Nr. 1.3, 1.4 PBZugV).", "schwierigkeit": "schwer"}, {"id": 72, "gesetz": "PBZugV", "frage": "#0072 Welche Strafen drohen, wenn ein Taxi- oder Mietwagenbetrieb ohne Genehmigung arbeitet?", "antworten": ["Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); die PBZugV regelt dies nicht.", "Es liegt eine Straftat vor, die mit Freiheitsstrafe bis zu einem Jahr oder Geldstrafe geahndet wird (§ 148 GewO i. V. m. § 2 PBZugV).", "Es droht ausschließlich der Widerruf des Gewerbes; ein Bußgeld kann nach der PBZugV nicht verhängt werden (§ 35 GewO)."], "richtig": 0, "erklaerung": "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); die PBZugV regelt dies nicht.", "schwierigkeit": "leicht"}, {"id": 73, "gesetz": "PBZugV", "frage": "#0073 Welche Dokumente muss ein Taxiunternehmer mitführen?", "antworten": ["Genehmigungsurkunde oder gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG), Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I sowie die geltenden Tarifvorschriften (§ 10 BOKraft).", "Personalausweis, Gewerbeanmeldung, Nachweis der Haftpflichtversicherung und den letzten Prüfbericht der Hauptuntersuchung (§ 14 GewO).", "Fahrzeugbrief (Zulassungsbescheinigung Teil II), Fahrtenbuch der letzten drei Monate und Fahrgastliste des Vortags (§ 4 FeV)."], "richtig": 0, "erklaerung": "Genehmigungsurkunde oder gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG), Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I sowie die geltenden Tarifvorschriften (§ 10 BOKraft).", "schwierigkeit": "mittel"}, {"id": 74, "gesetz": "PBZugV", "frage": "#0074 Wann kann eine Genehmigung für den Taxi- oder Mietwagenverkehr widerrufen werden?", "antworten": ["Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG).", "Nur wenn der Unternehmer rechtskräftig verurteilt wurde; Verstöße gegen Sozial- oder Steuerrecht rechtfertigen keinen Widerruf (§ 25 PBefG).", "Wenn die Genehmigung länger als drei Monate nicht genutzt wird oder der Unternehmer das Fahrzeug wechselt (§ 26 PBefG)."], "richtig": 0, "erklaerung": "Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG).", "schwierigkeit": "schwer"}, {"id": 75, "gesetz": "PBZugV", "frage": "#0075 Welche Vorteile hat eine Fachkundeprüfung für Unternehmer?", "antworten": ["Unternehmer erhalten nach bestandener Prüfung einen Rabatt auf die Kfz-Versicherung und können Fahrer günstiger einstellen.", "Unternehmer lernen die gesetzlichen Pflichten und wirtschaftlichen Grundlagen des Betriebs.", "Die Prüfung berechtigt dazu, den Taxitarif eigenständig festzulegen und Fahrzeuge ohne Hauptuntersuchung zu betreiben."], "richtig": 1, "erklaerung": "Unternehmer lernen die gesetzlichen Pflichten und wirtschaftlichen Grundlagen des Betriebs.", "schwierigkeit": "leicht"}, {"id": 76, "gesetz": "PBZugV", "frage": "#0076 Welche Bedeutung hat die PBZugV für die Qualität im Personenverkehr?", "antworten": ["Sie stellt sicher, dass nur qualifizierte und zuverlässige Unternehmer tätig sind.", "Sie legt die Fahrpreise im Taxiverkehr fest und regelt die Höhe der Gebühren für Taxistände.", "Sie sorgt dafür, dass Fahrzeuge regelmäßig lackiert und gereinigt werden und Fahrer eine einheitliche Kleidung tragen."], "richtig": 0, "erklaerung": "Sie stellt sicher, dass nur qualifizierte und zuverlässige Unternehmer tätig sind.", "schwierigkeit": "mittel"}, {"id": 77, "gesetz": "PBZugV", "frage": "#0077 Welche Behörde ist für die Kontrolle der Berufszugangsvoraussetzungen zuständig?", "antworten": ["Die örtliche Genehmigungsbehörde (§ 9 PBZugV).", "Das Kraftfahrt-Bundesamt in Flensburg (§ 20 StVZO).", "Die Handwerkskammer des Bezirks, in dem der Betrieb liegt (§ 5 PBZugV)."], "richtig": 0, "erklaerung": "Die örtliche Genehmigungsbehörde (§ 9 PBZugV).", "schwierigkeit": "schwer"}, {"id": 78, "gesetz": "PBZugV", "frage": "#0078 Welche Dokumente müssen Unternehmen im Straßenpersonenverkehr bei einer Kontrolle vorlegen können?", "antworten": ["Genehmigungsurkunde, Nachweis der finanziellen Leistungsfähigkeit, Nachweise über die fachliche Eignung sowie Steuer- und Sozialversicherungsnachweise (§ 9 PBZugV).", "Fahrtenbuch, Nachweis der Fahrzeugfinanzierung, Mitgliedsbescheinigung der IHK und Auszug aus dem Handelsregister (§ 54 PBefG).", "Gewerbeanmeldung, Personalausweis des Inhabers, Arbeitsverträge sowie ein Nachweis über die abgeschlossene Haftpflichtversicherung (§ 14 GewO)."], "richtig": 0, "erklaerung": "Genehmigungsurkunde, Nachweis der finanziellen Leistungsfähigkeit, Nachweise über die fachliche Eignung sowie Steuer- und Sozialversicherungsnachweise (§ 9 PBZugV).", "schwierigkeit": "leicht"}, {"id": 79, "gesetz": "PBZugV", "frage": "#0079 Wie lange ist eine Genehmigung für den Taxen- oder Mietwagenverkehr gültig?", "antworten": ["Höchstens 5 Jahre, bei Neubewerbern im Taxenverkehr 2 Jahre; danach ist die Wiedererteilung zu beantragen (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "Unbefristet, solange der Unternehmer die Gewerbeanmeldung aufrechterhält; nur alle 3 Jahre erfolgt eine Überprüfung (§ 9 PBZugV).", "Höchstens 10 Jahre, bei Neubewerbern im Taxenverkehr 5 Jahre; danach verlängert sie sich automatisch (§ 16 Abs. 4 PBefG)."], "richtig": 0, "erklaerung": "Höchstens 5 Jahre, bei Neubewerbern im Taxenverkehr 2 Jahre; danach ist die Wiedererteilung zu beantragen (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "schwierigkeit": "mittel"}, {"id": 80, "gesetz": "PBZugV", "frage": "#0080 Welche Rolle spielt die PBZugV für die Sicherheit im Straßenpersonenverkehr?", "antworten": ["Sie sorgt dafür, dass ausschließlich Unternehmer mit mindestens zehn Fahrzeugen Genehmigungen erhalten (§ 13 PBefG).", "Sie stellt sicher, dass nur zuverlässige, finanziell leistungsfähige und fachlich geeignete Unternehmer am gewerblichen Personenverkehr teilnehmen (§§ 1–3 PBZugV).", "Sie schreibt vor, dass alle Fahrzeuge jährlich vom Kraftfahrt-Bundesamt geprüft und Fahrer auf Alkohol getestet werden (§ 25 BOKraft)."], "richtig": 1, "erklaerung": "Sie stellt sicher, dass nur zuverlässige, finanziell leistungsfähige und fachlich geeignete Unternehmer am gewerblichen Personenverkehr teilnehmen (§§ 1–3 PBZugV).", "schwierigkeit": "schwer"}, {"id": 101, "gesetz": "BOKraft", "frage": "#0101 Was ist die BOKraft und was regelt sie?", "antworten": ["Die BOKraft ist eine Verordnung zur Berufsausbildung im Taxigewerbe und regelt Lehrpläne und Prüfungen für Fahrer (§ 48 FeV).", "Die BOKraft (Verordnung über den Betrieb von Kraftfahrunternehmen im Personenverkehr) regelt ausschließlich die Preise und Tarife im Taxen- und Mietwagenverkehr (§ 51 BOKraft).", "Die BOKraft (Verordnung über den Betrieb von Kraftfahrunternehmen im Personenverkehr) legt Sicherheits- und Betriebsvorschriften für Taxen, Mietwagen, Omnibusse und Linienverkehr fest (§ 1 BOKraft)."], "richtig": 2, "erklaerung": "Die BOKraft (Verordnung über den Betrieb von Kraftfahrunternehmen im Personenverkehr) legt Sicherheits- und Betriebsvorschriften für Taxen, Mietwagen, Omnibusse und Linienverkehr fest (§ 1 BOKraft).", "schwierigkeit": "leicht"}, {"id": 102, "gesetz": "BOKraft", "frage": "#0102 Welche Unternehmen unterliegen der BOKraft?", "antworten": ["Alle Unternehmen, die Güter oder Personen mit Fahrzeugen über 3,5 t befördern (§ 1 Abs. 2 BOKraft).", "Nur Taxiunternehmen; Mietwagen und Omnibusunternehmen unterliegen eigenen Vorschriften (§ 1 BOKraft).", "Alle Unternehmen, die Fahrgäste mit Kraftfahrzeugen oder Obussen befördern, soweit sie dem PBefG unterliegen, also entgeltlich oder geschäftsmäßig befördern (§ 1 Abs. 1 BOKraft)."], "richtig": 2, "erklaerung": "Alle Unternehmen, die Fahrgäste mit Kraftfahrzeugen oder Obussen befördern, soweit sie dem PBefG unterliegen, also entgeltlich oder geschäftsmäßig befördern (§ 1 Abs. 1 BOKraft).", "schwierigkeit": "mittel"}, {"id": 103, "gesetz": "BOKraft", "frage": "#0103 Was ist die wichtigste Grundregel der BOKraft?", "antworten": ["Fahrzeuge und Betrieb müssen so geführt werden, dass die Sicherheit und Ordnung gewährleistet sind (§ 2 BOKraft).", "Fahrer müssen immer die kürzeste Route wählen und sämtliche Fahrgäste mit Namen ansprechen (§ 7 BOKraft).", "Der Unternehmer muss jedes Fahrzeug mindestens einmal wöchentlich vom Kraftfahrt-Bundesamt prüfen lassen (§ 3 BOKraft)."], "richtig": 0, "erklaerung": "Fahrzeuge und Betrieb müssen so geführt werden, dass die Sicherheit und Ordnung gewährleistet sind (§ 2 BOKraft).", "schwierigkeit": "schwer"}, {"id": 104, "gesetz": "BOKraft", "frage": "#0104 Welche Pflichten hat ein Unternehmer im Taxen- und Mietwagenverkehr?", "antworten": ["Er muss die Fahrer nur einmalig bei der Einstellung belehren; spätere Kontrollen sind nicht vorgeschrieben (§ 7 BOKraft).", "Er muss die Fahrpreise der Konkurrenz beobachten und seine Preise stets leicht darunter ansetzen (§ 37 BOKraft).", "Er muss sicherstellen, dass alle Vorschriften der BOKraft eingehalten werden und die Fahrzeuge in ordnungsgemäßem Zustand sind (§ 3 Abs. 1 BOKraft)."], "richtig": 2, "erklaerung": "Er muss sicherstellen, dass alle Vorschriften der BOKraft eingehalten werden und die Fahrzeuge in ordnungsgemäßem Zustand sind (§ 3 Abs. 1 BOKraft).", "schwierigkeit": "leicht"}, {"id": 105, "gesetz": "BOKraft", "frage": "#0105 Wann ist ein Betriebsleiter erforderlich?", "antworten": ["Ein Betriebsleiter ist für jedes Unternehmen verpflichtend und muss bei der IHK eine zusätzliche Prüfung ablegen (§ 4 BOKraft).", "Die Bestellung ist grundsätzlich freiwillig; die Genehmigungsbehörde kann sie anordnen und soll dies insbesondere bei Unternehmen mit regelmäßig mehr als zehn Fahrzeugen tun (§ 4 Abs. 1 BOKraft).", "Er ist erst bei Unternehmen mit mehr als hundert Fahrzeugen erforderlich und wird dann von der IHK bestimmt (§ 4 Abs. 3 BOKraft)."], "richtig": 1, "erklaerung": "Die Bestellung ist grundsätzlich freiwillig; die Genehmigungsbehörde kann sie anordnen und soll dies insbesondere bei Unternehmen mit regelmäßig mehr als zehn Fahrzeugen tun (§ 4 Abs. 1 BOKraft).", "schwierigkeit": "mittel"}, {"id": 106, "gesetz": "BOKraft", "frage": "#0106 Welche Meldepflichten hat ein Taxi- oder Mietwagenunternehmer?", "antworten": ["Er muss jede Fahrt, auch kleine Beschädigungen, innerhalb von 24 Stunden dem Finanzamt melden (§ 6 BOKraft).", "Er muss der Genehmigungsbehörde unverzüglich Betriebsvorkommnisse mit öffentlichem Aufsehen sowie Unfälle mit Getöteten oder Schwerverletzten melden; Betriebsstörungen sind nur im Obus- und Linienverkehr meldepflichtig (§ 6 BOKraft).", "Er muss nur Unfälle melden, bei denen ein Totalschaden am Fahrzeug entstanden ist; Verletzte sind nicht meldepflichtig (§ 7 BOKraft)."], "richtig": 1, "erklaerung": "Er muss der Genehmigungsbehörde unverzüglich Betriebsvorkommnisse mit öffentlichem Aufsehen sowie Unfälle mit Getöteten oder Schwerverletzten melden; Betriebsstörungen sind nur im Obus- und Linienverkehr meldepflichtig (§ 6 BOKraft).", "schwierigkeit": "schwer"}, {"id": 107, "gesetz": "BOKraft", "frage": "#0107 Welche Pflichten hat das Fahrpersonal im Fahrdienst?", "antworten": ["Fahrer müssen sich rücksichtsvoll, umsichtig und verantwortungsvoll verhalten (§ 7 BOKraft).", "Fahrer müssen die Höchstgeschwindigkeit generell um 10 km/h unterschreiten, um Fahrgäste zu schonen (§ 3 StVO).", "Fahrer müssen Fahrgäste stets duzen und dürfen Gespräche nicht ablehnen (§ 11 BOKraft)."], "richtig": 0, "erklaerung": "Fahrer müssen sich rücksichtsvoll, umsichtig und verantwortungsvoll verhalten (§ 7 BOKraft).", "schwierigkeit": "leicht"}, {"id": 108, "gesetz": "BOKraft", "frage": "#0108 Wie muss sich das Fahrpersonal gegenüber Fahrgästen verhalten?", "antworten": ["Rücksichtsvoll und besonnen (§ 8 Abs. 1 BOKraft).", "Sie dürfen den Fahrgästen nur bei Nachfrage antworten und Gepäck nicht anfassen (§ 15 BOKraft).", "Sie dürfen Fahrgäste bei Verspätung zurechtweisen und müssen Trinkgeld verlangen (§ 8 Abs. 2 BOKraft)."], "richtig": 0, "erklaerung": "Rücksichtsvoll und besonnen (§ 8 Abs. 1 BOKraft).", "schwierigkeit": "mittel"}, {"id": 109, "gesetz": "BOKraft", "frage": "#0109 Wann darf ein Fahrer nicht arbeiten?", "antworten": ["Wenn er einen Schnupfen hat oder ein Angehöriger sich im Urlaub befindet; Erkrankungen müssen erst nach Dienstende gemeldet werden (§ 9 BOKraft).", "Wenn er länger als 4 Stunden gefahren ist oder weniger als 8 Stunden geschlafen hat (§ 4 ArbZG).", "Wenn er oder ein Angehöriger seiner häuslichen Gemeinschaft an bestimmten ansteckenden Krankheiten nach dem Infektionsschutzgesetz leidet oder eine Krankheit seine Fahreignung beeinträchtigt; Erkrankungen sind dem Unternehmer unverzüglich anzuzeigen (§ 9 BOKraft)."], "richtig": 2, "erklaerung": "Wenn er oder ein Angehöriger seiner häuslichen Gemeinschaft an bestimmten ansteckenden Krankheiten nach dem Infektionsschutzgesetz leidet oder eine Krankheit seine Fahreignung beeinträchtigt; Erkrankungen sind dem Unternehmer unverzüglich anzuzeigen (§ 9 BOKraft).", "schwierigkeit": "schwer"}, {"id": 110, "gesetz": "BOKraft", "frage": "#0110 Wie müssen Fundsachen behandelt werden?", "antworten": ["Der Fahrer muss nach jeder Fahrt prüfen, ob Gegenstände zurückgeblieben sind, und Fundsachen, die nicht sofort zurückgegeben werden können, unverzüglich an die Fundstelle des Betriebs oder die von der Genehmigungsbehörde benannte Stelle abliefern (§ 11 BOKraft).", "Fundsachen darf der Fahrer nach 24 Stunden behalten, wenn sich der Besitzer nicht gemeldet hat (§ 965 BGB).", "Fundsachen sind innerhalb von drei Tagen bei der Polizei abzugeben; im Fahrzeug darf nichts zurückbleiben (§ 12 BOKraft)."], "richtig": 0, "erklaerung": "Der Fahrer muss nach jeder Fahrt prüfen, ob Gegenstände zurückgeblieben sind, und Fundsachen, die nicht sofort zurückgegeben werden können, unverzüglich an die Fundstelle des Betriebs oder die von der Genehmigungsbehörde benannte Stelle abliefern (§ 11 BOKraft).", "schwierigkeit": "leicht"}, {"id": 111, "gesetz": "BOKraft", "frage": "#0111 Wann dürfen Fahrgäste von der Beförderung ausgeschlossen werden?", "antworten": ["Wenn sie zu zweit im Fahrzeug sitzen oder ihr Fahrtziel weniger als 2 km entfernt ist (§ 22 PBefG).", "Wenn sie eine Gefahr für die Sicherheit oder Ordnung darstellen (§ 13 BOKraft).", "Wenn sie zu viel Gepäck dabeihaben oder keinen Fahrpreis im Voraus bezahlen (§ 15 BOKraft)."], "richtig": 1, "erklaerung": "Wenn sie eine Gefahr für die Sicherheit oder Ordnung darstellen (§ 13 BOKraft).", "schwierigkeit": "mittel"}, {"id": 112, "gesetz": "BOKraft", "frage": "#0112 Welche Regeln gelten für das Verhalten der Fahrgäste?", "antworten": ["Kein Öffnen von Türen während der Fahrt, keine Sachbeschädigung, keine Belästigung anderer Personen (§ 14 BOKraft).", "Fahrgäste dürfen während der Fahrt rauchen, solange der Fahrer zustimmt, und Türen nach Absprache öffnen (§ 14 BOKraft).", "Fahrgäste müssen vor Fahrtantritt den Fa
