züglich Betriebsvorkommnisse mit öffentlichem Aufsehen sowie Unfälle mit Getöteten oder Schwerverletzten melden; Betriebsstörungen sind nur im Obus- und Linienverkehr meldepflichtig (§ 6 BOKraft)."}, {"id": 107, "gesetz": "BOKraft", "frage": "#0107 Welche Pflichten hat das Fahrpersonal im Fahrdienst?", "antworten": ["Fahrer müssen sich rücksichtsvoll, umsichtig und verantwortungsvoll verhalten (§ 7 BOKraft).", "Fahrer müssen den Anweisungen der Fahrgäste zur Fahrweise stets folgen (§ 7 BOKraft).", "Fahrer müssen vorrangig die Einnahmen maximieren und Leerfahrten vermeiden (§ 7 BOKraft)."], "richtig": 0, "erklaerung": "Fahrer müssen sich rücksichtsvoll, umsichtig und verantwortungsvoll verhalten (§ 7 BOKraft)."}, {"id": 108, "gesetz": "BOKraft", "frage": "#0108 Wie muss sich das Fahrpersonal gegenüber Fahrgästen verhalten?", "antworten": ["Rücksichtsvoll und besonnen (§ 8 Abs. 1 BOKraft).", "Zurückhaltend, Gespräche sind untersagt (§ 8 Abs. 1 BOKraft).", "Ausschließlich förmlich und auf Deutsch (§ 8 Abs. 1 BOKraft)."], "richtig": 0, "erklaerung": "Rücksichtsvoll und besonnen (§ 8 Abs. 1 BOKraft)."}, {"id": 109, "gesetz": "BOKraft", "frage": "#0109 Wann darf ein Fahrer nicht arbeiten?", "antworten": ["Wenn er mehr als 3 Punkte im Fahreignungsregister hat oder an mehr als fünf Tagen in Folge gearbeitet hat; Krankheiten muss er nur der Genehmigungsbehörde, nicht dem Unternehmer anzeigen (§ 9 BOKraft).", "Nur wenn er eine ärztliche Arbeitsunfähigkeitsbescheinigung vorlegt; ansteckende Krankheiten von Angehörigen sind unerheblich, und Erkrankungen müssen dem Unternehmer erst nach drei Tagen angezeigt werden (§ 9 BOKraft).", "Wenn er oder ein Angehöriger seiner häuslichen Gemeinschaft an bestimmten ansteckenden Krankheiten nach dem Infektionsschutzgesetz leidet oder eine Krankheit seine Fahreignung beeinträchtigt; Erkrankungen sind dem Unternehmer unverzüglich anzuzeigen (§ 9 BOKraft)."], "richtig": 2, "erklaerung": "Wenn er oder ein Angehöriger seiner häuslichen Gemeinschaft an bestimmten ansteckenden Krankheiten nach dem Infektionsschutzgesetz leidet oder eine Krankheit seine Fahreignung beeinträchtigt; Erkrankungen sind dem Unternehmer unverzüglich anzuzeigen (§ 9 BOKraft)."}, {"id": 110, "gesetz": "BOKraft", "frage": "#0110 Wie müssen Fundsachen behandelt werden?", "antworten": ["Der Fahrer muss nach jeder Fahrt prüfen, ob Gegenstände zurückgeblieben sind, und Fundsachen, die nicht sofort zurückgegeben werden können, unverzüglich an die Fundstelle des Betriebs oder die von der Genehmigungsbehörde benannte Stelle abliefern (§ 11 BOKraft).", "Der Fahrer darf Fundsachen bis zu einem Wert von 50 € behalten; wertvollere Gegenstände muss er innerhalb von vier Wochen beim Fundbüro der Gemeinde abgeben, eine Prüfung des Fahrzeugs nach jeder Fahrt ist nicht vorgeschrieben (§ 11 BOKraft).", "Der Fahrer muss Fundsachen bis zum Schichtende im Fahrzeug aufbewahren und dem nächsten Fahrgast zeigen; meldet sich niemand, gehen sie nach 24 Stunden in das Eigentum des Unternehmers über (§ 11 BOKraft)."], "richtig": 0, "erklaerung": "Der Fahrer muss nach jeder Fahrt prüfen, ob Gegenstände zurückgeblieben sind, und Fundsachen, die nicht sofort zurückgegeben werden können, unverzüglich an die Fundstelle des Betriebs oder die von der Genehmigungsbehörde benannte Stelle abliefern (§ 11 BOKraft)."}, {"id": 111, "gesetz": "BOKraft", "frage": "#0111 Wann dürfen Fahrgäste von der Beförderung ausgeschlossen werden?", "antworten": ["Nur wenn sie früher bereits eine Fahrt nicht bezahlt haben (§ 13 BOKraft).", "Wenn sie eine Gefahr für die Sicherheit oder Ordnung darstellen (§ 13 BOKraft).", "Wenn sie kein Bargeld, sondern nur eine Karte zur Zahlung haben (§ 13 BOKraft)."], "richtig": 1, "erklaerung": "Wenn sie eine Gefahr für die Sicherheit oder Ordnung darstellen (§ 13 BOKraft)."}, {"id": 112, "gesetz": "BOKraft", "frage": "#0112 Welche Regeln gelten für das Verhalten der Fahrgäste?", "antworten": ["Kein Öffnen von Türen während der Fahrt, keine Sachbeschädigung, keine Belästigung anderer Personen (§ 14 BOKraft).", "Pflicht zur Vorauszahlung, Sitzplatzzuweisung durch den Fahrer und Sprechverbot während der Fahrt (§ 14 BOKraft).", "Fahrgäste dürfen nur hinten sitzen, kein Gepäck im Innenraum, Anschnallpflicht nur auf Autobahnen (§ 14 BOKraft)."], "richtig": 0, "erklaerung": "Kein Öffnen von Türen während der Fahrt, keine Sachbeschädigung, keine Belästigung anderer Personen (§ 14 BOKraft)."}, {"id": 113, "gesetz": "BOKraft", "frage": "#0113 Welche Vorschriften gibt es zur Mitnahme von Gepäck?", "antworten": ["Gepäck darf nur im Kofferraum befördert werden. Tiere sind ausnahmslos verboten (§ 15 BOKraft).", "Pro Fahrgast ist höchstens ein Gepäckstück erlaubt. Gefährliche Stoffe sind bis 5 kg zulässig (§ 15 BOKraft).", "Gepäck muss so verstaut werden, dass es keine Fahrgäste gefährdet. Gefährliche Stoffe sind verboten (§ 15 BOKraft)."], "richtig": 2, "erklaerung": "Gepäck muss so verstaut werden, dass es keine Fahrgäste gefährdet. Gefährliche Stoffe sind verboten (§ 15 BOKraft)."}, {"id": 114, "gesetz": "BOKraft", "frage": "#0114 Welche Fahrzeuge dürfen im Personenverkehr eingesetzt werden?", "antworten": ["Nur Fahrzeuge, die nicht älter als acht Jahre sind und weniger als 300.000 km Laufleistung haben (§ 17 BOKraft).", "Fahrzeuge mit mindestens zwei Achsen und vier Rädern, die den gesetzlichen Vorschriften entsprechen (§ 17 BOKraft).", "Nur Fahrzeuge mit Elektro- oder Hybridantrieb, die mindestens die Abgasnorm Euro 7 erfüllen (§ 17 BOKraft)."], "richtig": 1, "erklaerung": "Fahrzeuge mit mindestens zwei Achsen und vier Rädern, die den gesetzlichen Vorschriften entsprechen (§ 17 BOKraft)."}, {"id": 115, "gesetz": "BOKraft", "frage": "#0115 Welche Sicherheitsausrüstung müssen Fahrzeuge haben?", "antworten": ["Nur ein Warndreieck (§ 53a StVZO); Erste-Hilfe-Material ist entbehrlich, wenn der Fahrer einen Erste-Hilfe-Kurs nachweist (§ 18 BOKraft). Feuerlöscher und Defibrillator sind in jeder Taxe Pflicht (§ 35g StVZO).", "Feuerlöscher und Erste-Hilfe-Material (§ 35h StVZO), Warndreieck (§ 53a StVZO); Winterreifen ganzjährig unabhängig von der Witterung (§ 18 BOKraft). Eine Warnweste ist nur in Kraftomnibussen Pflicht (§ 35g StVZO).", "Erste-Hilfe-Material (§ 35h StVZO), Warndreieck und Warnweste (§ 53a StVZO); je nach Straßen- und Witterungsverhältnissen Winterreifen, Schneeketten u. a. (§ 18 BOKraft). Ein Feuerlöscher ist nur in Kraftomnibussen Pflicht (§ 35g StVZO)."], "richtig": 2, "erklaerung": "Erste-Hilfe-Material (§ 35h StVZO), Warndreieck und Warnweste (§ 53a StVZO); je nach Straßen- und Witterungsverhältnissen Winterreifen, Schneeketten u. a. (§ 18 BOKraft). Ein Feuerlöscher ist nur in Kraftomnibussen Pflicht (§ 35g StVZO)."}, {"id": 116, "gesetz": "BOKraft", "frage": "#0116 Welche Sicherheitsvorkehrungen müssen Taxen und Mietwagen haben?", "antworten": ["Mindestens zwei Türen auf der rechten Fahrzeugseite und eine Alarmanlage (§ 25 BOKraft).", "Eine Trennscheibe zwischen Fahrer- und Fahrgastraum und eine Videokamera (§ 25 BOKraft).", "Mindestens eine Schiebetür auf der linken Seite und ein Notrufknopf für Fahrgäste (§ 25 BOKraft)."], "richtig": 0, "erklaerung": "Mindestens zwei Türen auf der rechten Fahrzeugseite und eine Alarmanlage (§ 25 BOKraft)."}, {"id": 117, "gesetz": "BOKraft", "frage": "#0117 Wie müssen Taxen gekennzeichnet sein?", "antworten": ["Beliebige Lackierung und ein Magnetschild „Taxi“ an beiden Vordertüren (§ 26 BOKraft).", "Verkehrsgelbe Lackierung (RAL 1023) und ein beleuchtbares Taxischild (§ 26 BOKraft).", "Hell-elfenbeinfarbene Lackierung (RAL 1015) und ein beleuchtbares Taxischild (§ 26 BOKraft)."], "richtig": 2, "erklaerung": "Hell-elfenbeinfarbene Lackierung (RAL 1015) und ein beleuchtbares Taxischild (§ 26 BOKraft)."}, {"id": 118, "gesetz": "BOKraft", "frage": "#0118 Welche Kennzeichnungspflichten gelten für Mietwagen?", "antworten": ["Mietwagen müssen ein beleuchtbares Dachschild mit der Aufschrift „Mietwagen“ führen (§ 26 BOKraft).", "Mietwagen müssen ein blaues Ordnungsnummernschild an der Heckscheibe haben (§ 27 BOKraft).", "Mietwagen müssen hell-elfenbeinfarben lackiert sein und ein gelbes Seitenschild haben (§ 27 BOKraft)."], "richtig": 1, "erklaerung": "Mietwagen müssen ein blaues Ordnungsnummernschild an der Heckscheibe haben (§ 27 BOKraft)."}, {"id": 119, "gesetz": "BOKraft", "frage": "#0119 Müssen Mietwagen mit einem Fahrpreisanzeiger ausgestattet sein?", "antworten": ["Nein, sie benötigen stattdessen einen leicht ablesbaren Wegstreckenzähler oder ein konformitätsbewertetes softwarebasiertes System; das Eichrecht gilt (§ 30 BOKraft).", "Nein, sie benötigen weder Fahrpreisanzeiger noch Wegstreckenzähler; das Entgelt wird ausschließlich vorab schriftlich vereinbart (§ 30 BOKraft).", "Ja, Mietwagen benötigen wie Taxen einen geeichten Fahrpreisanzeiger; ein Wegstreckenzähler genügt nur außerhalb des Pflichtfahrbereichs (§ 30 BOKraft)."], "richtig": 0, "erklaerung": "Nein, sie benötigen stattdessen einen leicht ablesbaren Wegstreckenzähler oder ein konformitätsbewertetes softwarebasiertes System; das Eichrecht gilt (§ 30 BOKraft)."}, {"id": 120, "gesetz": "BOKraft", "frage": "#0120 Wie müssen Fahrpreise im Taxenverkehr berechnet werden?", "antworten": ["Nach dem Fahrpreisanzeiger oder nach dem im Rahmen des Bestellvorgangs vereinbarten Entgelt; bei Zielen außerhalb des Pflichtfahrbereichs ist das Entgelt vorher frei zu vereinbaren (§ 37 BOKraft).", "Nur nach einer vorab vereinbarten Pauschale; der Fahrpreisanzeiger dient allein der Kontrolle durch die Genehmigungsbehörde und ist für die Abrechnung unerheblich (§ 37 BOKraft).", "Nach Ermessen des Fahrers anhand der Fahrzeit; bei Zielen außerhalb des Pflichtfahrbereichs gilt zwingend der Taxitarif weiter, eine freie Vereinbarung ist unzulässig (§ 37 BOKraft)."], "richtig": 0, "erklaerung": "Nach dem Fahrpreisanzeiger oder nach dem im Rahmen des Bestellvorgangs vereinbarten Entgelt; bei Zielen außerhalb des Pflichtfahrbereichs ist das Entgelt vorher frei zu vereinbaren (§ 37 BOKraft)."}, {"id": 121, "gesetz": "BOKraft", "frage": "#0121 Wann darf ein Taxi sein Taxischild beleuchtet haben?", "antworten": ["Das Taxischild muss während eines Fahrtauftrags beleuchtet sein, damit andere Verkehrsteilnehmer die Taxe erkennen; ohne Fahrgast ist die Beleuchtung im Pflichtfahrbereich auszuschalten (§ 39 BOKraft).", "Im Pflichtfahrbereich muss das Taxischild beleuchtet sein, wenn keine Fahrtaufträge ausgeführt werden (außer am Taxenstand); während eines Fahrtauftrags muss die Beleuchtung ausgeschaltet sein (§ 39 BOKraft).", "Das Taxischild muss rund um die Uhr beleuchtet sein, auch während Fahrtaufträgen und am Taxenstand; ein Ausschalten ist nur außerhalb des Pflichtfahrbereichs erlaubt (§ 39 BOKraft)."], "richtig": 1, "erklaerung": "Im Pflichtfahrbereich muss das Taxischild beleuchtet sein, wenn keine Fahrtaufträge ausgeführt werden (außer am Taxenstand); während eines Fahrtauftrags muss die Beleuchtung ausgeschaltet sein (§ 39 BOKraft)."}, {"id": 122, "gesetz": "BOKraft", "frage": "#0122 Wie oft müssen Taxen und Mietwagen technisch überprüft werden?", "antworten": ["Alle zwei Jahre zur Hauptuntersuchung wie private Pkw (§ 29 StVZO i. V. m. Anlage VIII); die BOKraft-Vorschriften prüft nur einmalig die IHK (§ 41 BOKraft), eine Prüfung vor dem ersten Einsatz entfällt (§ 42 BOKraft).", "Einmal jährlich zur Hauptuntersuchung (§ 29 StVZO i. V. m. Anlage VIII), bei der auch die BOKraft-Vorschriften geprüft werden (§ 41 BOKraft); vor dem ersten Einsatz ist eine außerordentliche HU nötig (§ 42 BOKraft).", "Halbjährlich zur Hauptuntersuchung (§ 29 StVZO i. V. m. Anlage VIII) und zusätzlich monatlich zur Sicherheitsprüfung (§ 41 BOKraft); vor dem ersten Einsatz genügt eine Abnahme durch die IHK (§ 42 BOKraft)."], "richtig": 1, "erklaerung": "Einmal jährlich zur Hauptuntersuchung (§ 29 StVZO i. V. m. Anlage VIII), bei der auch die BOKraft-Vorschriften geprüft werden (§ 41 BOKraft); vor dem ersten Einsatz ist eine außerordentliche HU nötig (§ 42 BOKraft)."}, {"id": 123, "gesetz": "BOKraft", "frage": "#0123 Welche Verstöße können als Ordnungswidrigkeiten geahndet werden?", "antworten": ["Ausschließlich Verstöße gegen die Vorschriften zur Fahrzeugfarbe; alle übrigen Pflichten sind nicht bußgeldbewehrt (§ 45 BOKraft).", "Nur Verstöße der Fahrgäste; Unternehmer und Fahrpersonal können nach der BOKraft nicht mit Bußgeld belegt werden (§ 45 BOKraft).", "Verstöße gegen Sicherheitsvorschriften, Kennzeichnungspflichten oder Fahrpreisregelungen (§ 45 BOKraft)."], "richtig": 2, "erklaerung": "Verstöße gegen Sicherheitsvorschriften, Kennzeichnungspflichten oder Fahrpreisregelungen (§ 45 BOKraft)."}, {"id": 124, "gesetz": "BOKraft", "frage": "#0124 Was passiert, wenn eine Alarmanlage im Taxi ausgelöst wird?", "antworten": ["Die Hupe ertönt in Intervallen, Scheinwerfer und hintere Fahrtrichtungsanzeiger blinken; zusätzlich kann das Taxischild blinken (§ 25 Abs. 2 BOKraft).", "Der Motor wird automatisch abgeschaltet und alle Türen verriegeln, bis die Polizei am Fahrzeug eintrifft (§ 25 Abs. 2 BOKraft).", "Ein stiller Alarm wird per Funk an die Polizei gesendet; Hupe und Lichter bleiben aus, um den Täter nicht zu warnen (§ 25 Abs. 2 BOKraft)."], "richtig": 0, "erklaerung": "Die Hupe ertönt in Intervallen, Scheinwerfer und hintere Fahrtrichtungsanzeiger blinken; zusätzlich kann das Taxischild blinken (§ 25 Abs. 2 BOKraft)."}, {"id": 125, "gesetz": "BOKraft", "frage": "#0125 Dürfen Mietwagen an Taxiständen warten?", "antworten": ["Ja, wenn dort keine Taxe bereitsteht (Zeichen 229 StVO); der Mietwagen muss dann aber ein deutlich sichtbares Mietwagenschild führen, damit keine Verwechslungsgefahr mit Taxen besteht (§ 49 Abs. 4 PBefG).", "Ja, nachts zwischen 0 und 6 Uhr dürfen Mietwagen Taxenstände nutzen, wenn die Taxenzentrale nicht besetzt ist (Zeichen 229 StVO); tagsüber gilt für sie dort ein Halteverbot (§ 49 Abs. 4 PBefG).", "Nein, an Taxenständen dürfen nur bereitgehaltene Taxen halten (Zeichen 229 StVO); Mietwagen dürfen auch sonst nicht so bereitgehalten werden, dass Verwechslungsgefahr mit Taxen besteht (§ 49 Abs. 4 PBefG)."], "richtig": 2, "erklaerung": "Nein, an Taxenständen dürfen nur bereitgehaltene Taxen halten (Zeichen 229 StVO); Mietwagen dürfen auch sonst nicht so bereitgehalten werden, dass Verwechslungsgefahr mit Taxen besteht (§ 49 Abs. 4 PBefG)."}, {"id": 126, "gesetz": "BOKraft", "frage": "#0126 Darf in Taxen oder Mietwagen geraucht werden?", "antworten": ["In Taxen und Mietwagen ist Rauchen erlaubt, wenn alle Fahrgäste und der Fahrer zustimmen (§ 1 Abs. 1 Nr. 2, § 2 Nr. 2 BNichtrSchG); ein Verbot kann nur die Genehmigungsbehörde anordnen. Die BOKraft regelt nur das Rauchen in Bussen.", "In Taxen gilt ein gesetzliches Rauchverbot (§ 1 Abs. 1 Nr. 2, § 2 Nr. 2 BNichtrSchG); für Mietwagen gibt es kein gesetzliches Verbot, der Unternehmer kann es aber anordnen. Die BOKraft selbst enthält kein Rauchverbot.", "In Taxen und Mietwagen gilt gleichermaßen ein Rauchverbot, das ausschließlich in § 8 Abs. 3 BOKraft geregelt ist; das BNichtrSchG gilt nur für Busse im Linienverkehr und für Eisenbahnen."], "richtig": 1, "erklaerung": "In Taxen gilt ein gesetzliches Rauchverbot (§ 1 Abs. 1 Nr. 2, § 2 Nr. 2 BNichtrSchG); für Mietwagen gibt es kein gesetzliches Verbot, der Unternehmer kann es aber anordnen. Die BOKraft selbst enthält kein Rauchverbot."}, {"id": 127, "gesetz": "BOKraft", "frage": "#0127 Welche Behörde ist für die Kontrolle der BOKraft-Vorschriften zuständig?", "antworten": ["Die örtliche IHK als Aufsichtsbehörde (§ 54 Abs. 1 PBefG); sie kann u. a. Fahrzeuge stilllegen und Bußgelder verhängen (§ 54a PBefG).", "Das Kraftfahrt-Bundesamt als Aufsichtsbehörde (§ 54 Abs. 1 PBefG); die Länder haben keine eigenen Kontrollbefugnisse (§ 54a PBefG).", "Die Genehmigungsbehörde als Aufsichtsbehörde (§ 54 Abs. 1 PBefG); sie kann u. a. Bücher einsehen und Auskünfte verlangen (§ 54a PBefG)."], "richtig": 2, "erklaerung": "Die Genehmigungsbehörde als Aufsichtsbehörde (§ 54 Abs. 1 PBefG); sie kann u. a. Bücher einsehen und Auskünfte verlangen (§ 54a PBefG)."}, {"id": 128, "gesetz": "BOKraft", "frage": "#0128 Welche Bedeutung hat die BOKraft für die Sicherheit im Personenverkehr?", "antworten": ["Warndreieck, Erste-Hilfe-Material, Feuerlöscher und ggf. Winterreifen (§18 BOKraft).", "Ja, sofern sie gewerblich betrieben werden (§1 BOKraft).", "Sie stellt sicher, dass nur sichere und ordnungsgemäße Fahrzeuge und Betriebe am Straßenpersonenverkehr teilnehmen."], "richtig": 2, "erklaerung": "Sie stellt sicher, dass nur sichere und ordnungsgemäße Fahrzeuge und Betriebe am Straßenpersonenverkehr teilnehmen."}, {"id": 129, "gesetz": "BOKraft", "frage": "#0129 Gilt die BOKraft auch für Mietwagen mit Chauffeurdiensten?", "antworten": ["Nur bei mehr als acht Fahrgastplätzen (§ 1 BOKraft).", "Ja, sofern sie gewerblich betrieben werden (§ 1 BOKraft).", "Nein, Chauffeurdienste sind stets ausgenommen (§ 1 BOKraft)."], "richtig": 1, "erklaerung": "Ja, sofern sie gewerblich betrieben werden (§ 1 BOKraft)."}, {"id": 130, "gesetz": "BOKraft", "frage": "#0130 Was ist das Hauptziel der BOKraft?", "antworten": ["Ein umweltfreundlicher Betrieb durch Begrenzung der Fahrzeugemissionen und Förderung von Elektrofahrzeugen im Taxen- und Mietwagenverkehr (§ 2 BOKraft).", "Ein sicherer und ordnungsgemäßer Betrieb, der dem Vertrauen der Fahrgäste in eine sichere und ordnungsgemäße Beförderung gerecht wird (§ 2 BOKraft).", "Die Sicherung der Wirtschaftlichkeit der Verkehrsunternehmen durch Begrenzung des Wettbewerbs und Festlegung von Mindestpreisen (§ 2 BOKraft)."], "richtig": 1, "erklaerung": "Ein sicherer und ordnungsgemäßer Betrieb, der dem Vertrauen der Fahrgäste in eine sichere und ordnungsgemäße Beförderung gerecht wird (§ 2 BOKraft)."}, {"id": 151, "gesetz": "GewO", "frage": "#0151 Was ist der Grundsatz der Gewerbefreiheit?", "antworten": ["Ja, mehrere Gewerbeanmeldungen sind möglich (§ 3 GewO).", "Jeder kann ein Gewerbe betreiben, soweit keine gesetzlichen Beschränkungen bestehen (§ 1 GewO).", "Das Gewerbe kann unter besonderen Bedingungen weitergeführt werden (§ 12 GewO)."], "richtig": 1, "erklaerung": "Jeder kann ein Gewerbe betreiben, soweit keine gesetzlichen Beschränkungen bestehen (§ 1 GewO)."}, {"id": 152, "gesetz": "GewO", "frage": "#0152 Wann muss ein Gewerbe angemeldet werden?", "antworten": ["Erst wenn der Jahresumsatz 22.000 € übersteigt, beim Finanzamt; vorher genügt die Genehmigung nach dem PBefG (§ 14 Abs. 1 GewO).", "Innerhalb von drei Monaten nach Beginn des selbständigen Betriebs bei der zuständigen Industrie- und Handelskammer (§ 14 Abs. 1 GewO).", "Gleichzeitig mit dem Beginn des selbständigen Betriebs bei der zuständigen Behörde, in der Regel dem Gewerbeamt (§ 14 Abs. 1 GewO)."], "richtig": 2, "erklaerung": "Gleichzeitig mit dem Beginn des selbständigen Betriebs bei der zuständigen Behörde, in der Regel dem Gewerbeamt (§ 14 Abs. 1 GewO)."}, {"id": 153, "gesetz": "GewO", "frage": "#0153 Welche Arten von Gewerben unterscheidet die GewO?", "antworten": ["Stehendes Gewerbe, Reisegewerbe und Marktgewerbe. Das Taxi- und Taxengewerbe fällt unter das stehende Gewerbe.", "Neben der Gewerbeanmeldung eine Erlaubnis gemäß PBefG, die das Gewerbe regelt (§ 14 GewO i.V.m. PBefG).", "Stehendes Gewerbe, Reisegewerbe und Marktgewerbe. Das Taxi- und Mietwagengewerbe fällt unter das stehende Gewerbe."], "richtig": 2, "erklaerung": "Stehendes Gewerbe, Reisegewerbe und Marktgewerbe. Das Taxi- und Mietwagengewerbe fällt unter das stehende Gewerbe."}, {"id": 154, "gesetz": "GewO", "frage": "#0154 Was ist der Unterschied zwischen einem Reisegewerbe und einem stehenden Gewerbe?", "antworten": ["Stehendes Gewerbe: Ausübung von einer gewerblichen Niederlassung aus, keine Reisegewerbekarte. Reisegewerbe: Tätigkeit ohne vorhergehende Bestellung außerhalb der Niederlassung oder ohne eine solche; erfordert grundsätzlich eine Reisegewerbekarte (§ 55 GewO).", "Stehendes Gewerbe: Tätigkeit ohne feste Niederlassung, erfordert eine Reisegewerbekarte. Reisegewerbe: Ausübung ausschließlich von einer gewerblichen Niederlassung aus auf vorherige Bestellung; keine Anzeige erforderlich (§ 55 GewO).", "Stehendes Gewerbe: Tätigkeit nur innerhalb der Wohnsitzgemeinde. Reisegewerbe: jede Tätigkeit außerhalb der Wohnsitzgemeinde, auch auf vorherige Bestellung; erfordert stets eine Erlaubnis der IHK (§ 55 GewO)."], "richtig": 0, "erklaerung": "Stehendes Gewerbe: Ausübung von einer gewerblichen Niederlassung aus, keine Reisegewerbekarte. Reisegewerbe: Tätigkeit ohne vorhergehende Bestellung außerhalb der Niederlassung oder ohne eine solche; erfordert grundsätzlich eine Reisegewerbekarte (§ 55 GewO)."}, {"id": 155, "gesetz": "GewO", "frage": "#0155 Welche Behörde ist für Gewerbeanmeldungen zuständig?", "antworten": ["Vor Aufnahme der gewerblichen Tätigkeit beim zuständigen Gewerbeamt (§ 14 GewO).", "Das örtliche Gewerbeamt oder die Ordnungsbehörde.", "Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO)."], "richtig": 1, "erklaerung": "Das örtliche Gewerbeamt oder die Ordnungsbehörde."}, {"id": 156, "gesetz": "GewO", "frage": "#0156 Warum unterliegt das Taxi- und Mietwagengewerbe der GewO?", "antworten": ["Weil es ein gewerbliches Unternehmen ist, das eine gewerbliche Anmeldung benötigt (§ 14 GewO).", "Nein, nur wenn sie als selbstständige Unternehmer tätig sind.", "Wenn der Gewerbetreibende als unzuverlässig gilt (§ 35 GewO)."], "richtig": 0, "erklaerung": "Weil es ein gewerbliches Unternehmen ist, das eine gewerbliche Anmeldung benötigt (§ 14 GewO)."}, {"id": 157, "gesetz": "GewO", "frage": "#0157 Welche gewerberechtlichen Pflichten hat ein Taxi- oder Mietwagenunternehmen?", "antworten": ["Jeder kann ein Gewerbe betreiben, soweit keine gesetzlichen Beschränkungen bestehen (§ 1 GewO).", "Gewerbeanmeldung, Einhaltung der Vorschriften der GewO und der Beförderungspflichten.", "Gewerbeanmeldung, Einhaltung der Vorschriften der GewO und der Betriebspflichten."], "richtig": 2, "erklaerung": "Gewerbeanmeldung, Einhaltung der Vorschriften der GewO und der Betriebspflichten."}, {"id": 158, "gesetz": "GewO", "frage": "#0158 Welche zusätzlichen Genehmigungen braucht ein Taxi- oder Mietwagenbetrieb?", "antworten": ["Neben der Gewerbeanzeige (§ 14 GewO) lediglich eine Erlaubnis der IHK nach bestandener Fachkundeprüfung; eine PBefG-Genehmigung ist nur im Linienverkehr nötig (§§ 2, 47, 49 PBefG).", "Neben der Gewerbeanzeige (§ 14 GewO) eine Genehmigung nach dem Personenbeförderungsgesetz für den Taxen- bzw. Mietwagenverkehr (§§ 2, 47, 49 PBefG).", "Neben der Gewerbeanzeige (§ 14 GewO) eine Reisegewerbekarte, da Taxen und Mietwagen außerhalb der Niederlassung tätig werden (§ 55 GewO); eine PBefG-Genehmigung ist entbehrlich."], "richtig": 1, "erklaerung": "Neben der Gewerbeanzeige (§ 14 GewO) eine Genehmigung nach dem Personenbeförderungsgesetz für den Taxen- bzw. Mietwagenverkehr (§§ 2, 47, 49 PBefG)."}, {"id": 159, "gesetz": "GewO", "frage": "#0159 Was passiert, wenn ein Taxi- oder Mietwagenbetrieb ohne Gewerbeanmeldung betrieben wird?", "antworten": ["Ordnungswidrigkeit mit Geldbuße bis zu 50.000 € (§ 146 Abs. 2 Nr. 2, Abs. 3 GewO); außerdem erlischt die PBefG-Genehmigung kraft Gesetzes (§ 35 GewO).", "Straftat mit Freiheitsstrafe bis zu einem Jahr (§ 148 GewO); zudem wird das Gewerbe automatisch und ohne Prüfung der Zuverlässigkeit untersagt (§ 35 GewO).", "Ordnungswidrigkeit mit Geldbuße bis zu 1.000 € (§ 146 Abs. 2 Nr. 2, Abs. 3 GewO); eine Gewerbeuntersagung setzt dagegen Unzuverlässigkeit voraus (§ 35 GewO)."], "richtig": 2, "erklaerung": "Ordnungswidrigkeit mit Geldbuße bis zu 1.000 € (§ 146 Abs. 2 Nr. 2, Abs. 3 GewO); eine Gewerbeuntersagung setzt dagegen Unzuverlässigkeit voraus (§ 35 GewO)."}, {"id": 160, "gesetz": "GewO", "frage": "#0160 Was bedeutet „überwachungsbedürftiges Gewerbe“ und betrifft es Taxi- und Mietwagenbetriebe?", "antworten": ["Unerlaubte Gewerbeausübung, Missachtung einer Gewerbeuntersagung, Verstöße gegen Meldepflichten (§ 148 GewO).", "Überwachungsbedürftige Gewerbe unterliegen besonderen Kontrollen (§ 38 GewO). Das Taxi- und Mietwagengewerbe ist kein überwachungsbedürftiges Gewerbe nach § 38 GewO, benötigt aber eine Genehmigung nach PBefG.", "Überwachungsbedürftige Gewerbe unterliegen besonderen Kontrollen (§ 38 GewO). Das Taxi- und Taxengewerbe ist kein überwachungsbedürftiges Gewerbe nach § 38 GewO, benötigt aber eine Genehmigung nach PBefG."], "richtig": 1, "erklaerung": "Überwachungsbedürftige Gewerbe unterliegen besonderen Kontrollen (§ 38 GewO). Das Taxi- und Mietwagengewerbe ist kein überwachungsbedürftiges Gewerbe nach § 38 GewO, benötigt aber eine Genehmigung nach PBefG."}, {"id": 161, "gesetz": "GewO", "frage": "#0161 Wann kann eine Gewerbeuntersagung erfolgen?", "antworten": ["Ja, auch Mietwagenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO).", "Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO).", "Wenn der Gewerbetreibende als unzuverlässig gilt (§ 35 GewO)."], "richtig": 2, "erklaerung": "Wenn der Gewerbetreibende als unzuverlässig gilt (§ 35 GewO)."}, {"id": 162, "gesetz": "GewO", "frage": "#0162 Welche Auswirkungen hat eine Gewerbeuntersagung?", "antworten": ["Die Untersagung gilt nur in der Gemeinde des Betriebssitzes; in anderen Gemeinden darf das Gewerbe nach neuer Anzeige sofort fortgeführt werden (§ 146 Abs. 1 Nr. 1, § 148 GewO).", "Der Unternehmer darf das Gewerbe nicht weiterführen; Zuwiderhandlungen sind Ordnungswidrigkeiten (§ 146 Abs. 1 Nr. 1 GewO), bei beharrlicher Wiederholung oder Gefährdung Straftaten (§ 148 GewO).", "Der Unternehmer darf das Gewerbe noch sechs Monate zur Abwicklung fortführen; Zuwiderhandlungen danach bleiben folgenlos, da die GewO hierfür keine Sanktionen vorsieht (§ 146 Abs. 1 Nr. 1, § 148 GewO)."], "richtig": 1, "erklaerung": "Der Unternehmer darf das Gewerbe nicht weiterführen; Zuwiderhandlungen sind Ordnungswidrigkeiten (§ 146 Abs. 1 Nr. 1 GewO), bei beharrlicher Wiederholung oder Gefährdung Straftaten (§ 148 GewO)."}, {"id": 163, "gesetz": "GewO", "frage": "#0163 Muss eine Verlegung des Betriebssitzes gemeldet werden?", "antworten": ["Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO).", "Nein, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO).", "Es enthält Einträge zu gewerberechtlichen Verstößen, die sich auf die Erlaubniserteilung auswirken können (§ 149 GewO)."], "richtig": 0, "erklaerung": "Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO)."}, {"id": 164, "gesetz": "GewO", "frage": "#0164 Wann muss ein Gewerbe abgemeldet werden?", "antworten": ["Bußgelder, Gewerbeuntersagung oder strafrechtliche Konsequenzen (§§ 144-148 GewO).", "Bei vollständiger Aufgabe der Tätigkeit oder bei Geschäftsaufgabe (§ 14 GewO).", "Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO)."], "richtig": 1, "erklaerung": "Bei vollständiger Aufgabe der Tätigkeit oder bei Geschäftsaufgabe (§ 14 GewO)."}, {"id": 165, "gesetz": "GewO", "frage": "#0165 Welche steuerlichen Pflichten entstehen durch eine Gewerbeanmeldung?", "antworten": ["Es drohen Bußgelder und eine mögliche Gewerbeuntersagung (§ 144 GewO).", "Nach Ablauf der Tilgungsfrist, je nach Art der Eintragung (§§ 149-153 GewO).", "Anmeldung beim Finanzamt, Abgabe von Steuererklärungen und ggf. Gewerbesteuerzahlung."], "richtig": 2, "erklaerung": "Anmeldung beim Finanzamt, Abgabe von Steuererklärungen und ggf. Gewerbesteuerzahlung."}, {"id": 166, "gesetz": "GewO", "frage": "#0166 Welche Folgen hat eine Insolvenz für ein Gewerbe?", "antworten": ["Während eines Insolvenzverfahrens muss das Gewerbe ruhen, bis der Insolvenzverwalter eine neue Gewerbeanzeige erstattet (§ 12 GewO); die PBefG-Genehmigung geht bei Taxen und Mietwagen automatisch auf die Gläubiger über.", "Mit Eröffnung des Insolvenzverfahrens ist das Gewerbe zwingend zu untersagen und alle Zulassungen erlöschen automatisch (§ 12 GewO); die PBefG-Genehmigung bleibt stets unberührt, da die finanzielle Leistungsfähigkeit nicht erneut geprüft wird.", "Während eines Insolvenzverfahrens darf das Gewerbe nicht wegen Unzuverlässigkeit aufgrund ungeordneter Vermögensverhältnisse untersagt oder eine Zulassung deshalb widerrufen werden (§ 12 GewO); die finanzielle Leistungsfähigkeit nach PBefG bleibt davon unberührt."], "richtig": 2, "erklaerung": "Während eines Insolvenzverfahrens darf das Gewerbe nicht wegen Unzuverlässigkeit aufgrund ungeordneter Vermögensverhältnisse untersagt oder eine Zulassung deshalb widerrufen werden (§ 12 GewO); die finanzielle Leistungsfähigkeit nach PBefG bleibt davon unberührt."}, {"id": 167, "gesetz": "GewO", "frage": "#0167 Brauchen Taxi- oder Mietwagenfahrer eine eigene Gewerbeanmeldung?", "antworten": ["Ja, nur wenn sie als selbstständige Unternehmer tätig sind.", "Nein, nur wenn sie als selbstständige Unternehmer tätig sind.", "Nein, nur wenn sie als selbstständige Fahrer tätig sind."], "richtig": 1, "erklaerung": "Nein, nur wenn sie als selbstständige Unternehmer tätig sind."}, {"id": 168, "gesetz": "GewO", "frage": "#0168 Welche gewerberechtlichen Pflichten hat ein selbstständiger Taxiunternehmer?", "antworten": ["Überwachungsbedürftige Gewerbe unterliegen besonderen Kontrollen (§ 38 GewO). Das Taxi- und Mietwagengewerbe ist kein überwachungsbedürftiges Gewerbe nach § 38 GewO, benötigt aber eine Genehmigung nach PBefG.", "Vor Aufnahme der gewerblichen Tätigkeit beim zuständigen Gewerbeamt (§ 14 GewO).", "Gewerbeanmeldung, Steuerpflichten, Einhaltung der gewerberechtlichen Vorschriften."], "richtig": 2, "erklaerung": "Gewerbeanmeldung, Steuerpflichten, Einhaltung der gewerberechtlichen Vorschriften."}, {"id": 169, "gesetz": "GewO", "frage": "#0169 Kann eine natürliche Person mehrere Gewerbe betreiben?", "antworten": ["Nein, mehrere Gewerbeanmeldungen sind möglich (§ 3 GewO).", "Nach Ablauf der Tilgungsfrist, je nach Art der Eintragung (§§ 149-153 GewO).", "Ja, mehrere Gewerbeanmeldungen sind möglich (§ 3 GewO)."], "richtig": 2, "erklaerung": "Ja, mehrere Gewerbeanmeldungen sind möglich (§ 3 GewO)."}, {"id": 170, "gesetz": "GewO", "frage": "#0170 Welche Rolle spielt die persönliche Zuverlässigkeit für die Gewerbeausübung?", "antworten": ["Bei vollständiger Aufgabe der Tätigkeit oder bei Geschäftsaufgabe (§ 14 GewO).", "Wenn der Grund für die Unzuverlässigkeit beseitigt ist und eine erneute Erlaubnis erteilt wird.", "Unzuverlässige Personen können vom Gewerbebetrieb ausgeschlossen werden (§ 35 GewO)."], "richtig": 2, "erklaerung": "Unzuverlässige Personen können vom Gewerbebetrieb ausgeschlossen werden (§ 35 GewO)."}, {"id": 171, "gesetz": "GewO", "frage": "#0171 Welche Strafen drohen bei Verstößen gegen die GewO?", "antworten": ["Überwachungsbedürftige Gewerbe unterliegen besonderen Kontrollen (§ 38 GewO). Das Taxi- und Mietwagengewerbe ist kein überwachungsbedürftiges Gewerbe nach § 38 GewO, benötigt aber eine Genehmigung nach PBefG.", "Bußgelder, Gewerbeuntersagung oder strafrechtliche Konsequenzen (§§ 144-148 GewO).", "Das örtliche Gewerbeamt oder die Ordnungsbehörde."], "richtig": 1, "erklaerung": "Bußgelder, Gewerbeuntersagung oder strafrechtliche Konsequenzen (§§ 144-148 GewO)."}, {"id": 172, "gesetz": "GewO", "frage": "#0172 Welche Verstöße gegen die GewO sind strafbar?", "antworten": ["Strafbar ist bereits jede einmalige Ordnungswidrigkeit nach der GewO, wenn sie ein Unternehmer mit mehr als fünf Beschäftigten begeht (§ 148 GewO); Verstöße gegen die Anzeigepflicht sind dagegen überhaupt nicht sanktioniert (§ 146 GewO).", "Jeder Verstoß gegen die Anzeigepflicht nach § 14 GewO ist eine Straftat mit Freiheitsstrafe bis zu drei Jahren (§ 148 GewO); der Betrieb trotz Untersagung ist dagegen nur eine Ordnungswidrigkeit, die mit Verwarnungsgeld geahndet wird (§ 146 GewO).", "Strafbar ist nur die beharrliche Wiederholung bestimmter Ordnungswidrigkeiten (z. B. Betrieb trotz Untersagung) oder eine dadurch verursachte Gefährdung von Leben, Gesundheit oder bedeutenden Sachwerten (§ 148 GewO); Verstöße gegen die Anzeigepflicht sind Ordnungswidrigkeiten (§ 146 GewO)."], "richtig": 2, "erklaerung": "Strafbar ist nur die beharrliche Wiederholung bestimmter Ordnungswidrigkeiten (z. B. Betrieb trotz Untersagung) oder eine dadurch verursachte Gefährdung von Leben, Gesundheit oder bedeutenden Sachwerten (§ 148 GewO); Verstöße gegen die Anzeigepflicht sind Ordnungswidrigkeiten (§ 146 GewO)."}, {"id": 173, "gesetz": "GewO", "frage": "#0173 Wann gilt eine Gewerbeuntersagung als aufgehoben?", "antworten": ["Nicht automatisch: Auf Antrag ist die Ausübung wieder zu gestatten, wenn keine Unzuverlässigkeit mehr vorliegt; vor Ablauf eines Jahres nur aus besonderen Gründen (§ 35 Abs. 6 GewO).", "Automatisch nach Ablauf von drei Jahren, ohne dass ein Antrag gestellt werden muss; vorher ist eine Wiedergestattung ausgeschlossen (§ 35 Abs. 6 GewO).", "Automatisch, sobald der Unternehmer eine neue Gewerbeanzeige erstattet und ein Führungszeugnis vorlegt; eine Wartefrist besteht nicht (§ 35 Abs. 6 GewO)."], "richtig": 0, "erklaerung": "Nicht automatisch: Auf Antrag ist die Ausübung wieder zu gestatten, wenn keine Unzuverlässigkeit mehr vorliegt; vor Ablauf eines Jahres nur aus besonderen Gründen (§ 35 Abs. 6 GewO)."}, {"id": 174, "gesetz": "GewO", "frage": "#0174 Wie werden Einträge im Gewerbezentralregister gelöscht?", "antworten": ["Gewerbeanmeldung, Steuerpflichten, Einhaltung der gewerberechtlichen Vorschriften.", "Ja, auch Mietwagenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO).", "Nach Ablauf der Tilgungsfrist, je nach Art der Eintragung (§§ 149-153 GewO)."], "richtig": 2, "erklaerung": "Nach Ablauf der Tilgungsfrist, je nach Art der Eintragung (§§ 149-153 GewO)."}, {"id": 175, "gesetz": "GewO", "frage": "#0175 Welche Rolle spielt das Gewerbezentralregister für Taxi- und Mietwagenunternehmen?", "antworten": ["Ja, jede Änderung des Betriebssitzes muss beim Gewerbeamt angezeigt werden (§ 14 GewO).", "Es enthält Einträge zu gewerberechtlichen Verstößen, die sich auf die Erlaubniserteilung auswirken können (§ 149 GewO).", "Digitale Vermittlungsdienste unterliegen ebenfalls der Gewerbeanmeldung und gewerberechtlichen Kontrolle (§ 14 GewO)."], "richtig": 1, "erklaerung": "Es enthält Einträge zu gewerberechtlichen Verstößen, die sich auf die Erlaubniserteilung auswirken können (§ 149 GewO)."}, {"id": 176, "gesetz": "GewO", "frage": "#0176 Darf ein Taxi- oder Mietwagenbetrieb an eine andere Person übertragen werden?", "antworten": ["Ja, die Übertragung der Rechte und Pflichten aus der Genehmigung bedarf der Genehmigung; bei Taxen nur zusammen mit dem ganzen Unternehmen oder wesentlichen Teilen (§ 2 Abs. 2 Nr. 2, Abs. 3 PBefG). Der Erwerber muss sein Gewerbe anzeigen (§ 14 GewO).", "Nein, die Genehmigung ist höchstpersönlich und kann in keinem Fall übertragen werden, auch nicht zusammen mit dem ganzen Unternehmen; der Erwerber muss stets eine Neuerteilung beantragen (§ 2 Abs. 2 Nr. 2, Abs. 3 PBefG).", "Ja, die Genehmigung kann ohne Zustimmung der Behörde frei verkauft oder vermietet werden, bei Taxen auch einzeln ohne das Unternehmen (§ 2 Abs. 2 Nr. 2, Abs. 3 PBefG). Eine Gewerbeanzeige des Erwerbers ist entbehrlich (§ 14 GewO)."], "richtig": 0, "erklaerung": "Ja, die Übertragung der Rechte und Pflichten aus der Genehmigung bedarf der Genehmigung; bei Taxen nur zusammen mit dem ganzen Unternehmen oder wesentlichen Teilen (§ 2 Abs. 2 Nr. 2, Abs. 3 PBefG). Der Erwerber muss sein Gewerbe anzeigen (§ 14 GewO)."}, {"id": 177, "gesetz": "GewO", "frage": "#0177 Welche besonderen Anforderungen gibt es für Taxi- und Mietwagenbetriebe bei der Buchführung?", "antworten": ["Neben den allgemeinen Buchführungs- und Aufzeichnungspflichten (§§ 140 ff. AO, § 22 UStG) müssen Taxameter und Wegstreckenzähler mit TSE aufzeichnen (§ 146a AO, KassenSichV); Mietwagenunternehmer müssen Auftragseingänge erfassen und ein Jahr aufbewahren (§ 49 Abs. 4 PBefG).", "Taxi- und Mietwagenbetriebe sind von den allgemeinen Buchführungspflichten befreit (§§ 140 ff. AO, § 22 UStG); es genügt ein handschriftliches Kassenbuch ohne TSE (§ 146a AO, KassenSichV), Aufträge müssen nur einen Monat aufbewahrt werden (§ 49 Abs. 4 PBefG).", "Neben den allgemeinen Pflichten (§§ 140 ff. AO, § 22 UStG) muss eine TSE nur in Mietwagen eingesetzt werden (§ 146a AO, KassenSichV); Taxiunternehmer müssen zusätzlich alle Fahrtaufträge zehn Jahre bei der Genehmigungsbehörde hinterlegen (§ 49 Abs. 4 PBefG)."], "richtig": 0, "erklaerung": "Neben den allgemeinen Buchführungs- und Aufzeichnungspflichten (§§ 140 ff. AO, § 22 UStG) müssen Taxameter und Wegstreckenzähler mit TSE aufzeichnen (§ 146a AO, KassenSichV); Mietwagenunternehmer müssen Auftragseingänge erfassen und ein Jahr aufbewahren (§ 49 Abs. 4 PBefG)."}, {"id": 178, "gesetz": "GewO", "frage": "#0178 Welche Auswirkungen haben gewerberechtliche Verstöße auf eine Betriebserlaubnis?", "antworten": ["Gewerberechtliche Verstöße haben keinen Einfluss auf die PBefG-Genehmigung (§ 25 PBefG); zuständig ist allein das Gewerbeamt, das den Betrieb nur durch eine Untersagung nach § 35 GewO beenden kann (§ 35 Abs. 8 GewO).", "Jeder gewerberechtliche Verstoß führt automatisch zum Erlöschen der PBefG-Genehmigung (§ 25 PBefG); zusätzlich ist stets eine Gewerbeuntersagung nach § 35 GewO auszusprechen (§ 35 Abs. 8 GewO).", "Verstöße können die Zuverlässigkeit entfallen lassen; dann ist die PBefG-Genehmigung zu widerrufen (§ 25 PBefG). Eine Gewerbeuntersagung nach § 35 GewO ist insoweit ausgeschlossen (§ 35 Abs. 8 GewO)."], "richtig": 2, "erklaerung": "Verstöße können die Zuverlässigkeit entfallen lassen; dann ist die PBefG-Genehmigung zu widerrufen (§ 25 PBefG). Eine Gewerbeuntersagung nach § 35 GewO ist insoweit ausgeschlossen (§ 35 Abs. 8 GewO)."}, {"id": 179, "gesetz": "GewO", "frage": "#0179 Muss ein Mietwagenunternehmen auch eine Gewerbeanmeldung haben?", "antworten": ["Ja, auch Taxenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO).", "Nein, auch Mietwagenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO).", "Ja, auch Mietwagenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO)."], "richtig": 2, "erklaerung": "Ja, auch Mietwagenbetriebe sind gewerberechtlich meldepflichtig (§ 14 GewO)."}, {"id": 180, "gesetz": "GewO", "frage": "#0180 Welche gewerberechtlichen Vorschriften gelten für digitale Vermittlungsdienste für Mietwagen?", "antworten": ["Digitale Vermittlungsdienste unterliegen ebenfalls der Gewerbeanmeldung und gewerberechtlichen Kontrolle (§ 14 GewO).", "Das örtliche Gewerbeamt oder die Ordnungsbehörde.", "Gewerbeanmeldung, Steuerpflichten, Einhaltung der gewerberechtlichen Vorschriften."], "richtig": 0, "erklaerung": "Digitale Vermittlungsdienste unterliegen ebenfalls der Gewerbeanmeldung und gewerberechtlichen Kontrolle (§ 14 GewO)."}, {"id": 201, "gesetz": "FeV", "frage": "#0201 Wer benötigt eine Fahrerlaubnis zur Fahrgastbeförderung (FzF)?", "antworten": ["Nur Personen, die Fahrgäste gewerblich in Kraftomnibussen befördern (§ 48 FeV). Taxi- und Mietwagenfahrer benötigen lediglich die Klasse B (§ 48 Abs. 2 Nr. 4 FeV).", "Alle Personen, die Fahrgäste befördern, auch privat und unentgeltlich (§ 48 FeV). Ausnahme: Fahrer, die die Klasse B seit mehr als zehn Jahren besitzen (§ 48 Abs. 2 Nr. 4 FeV).", "Personen, die Fahrgäste gewerblich in Taxen, Mietwagen oder Krankenkraftwagen befördern (§ 48 FeV). Ausnahme: Fahrer mit Fahrerlaubnis der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV)."], "richtig": 2, "erklaerung": "Personen, die Fahrgäste gewerblich in Taxen, Mietwagen oder Krankenkraftwagen befördern (§ 48 FeV). Ausnahme: Fahrer mit Fahrerlaubnis der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV)."}, {"id": 202, "gesetz": "FeV", "frage": "#0202 Welche Voraussetzungen müssen für den Erwerb einer Fahrerlaubnis zur Fahrgastbeförderung erfüllt sein?", "antworten": ["Mindestalter 25 Jahre, Klasse B seit mindestens 5 Jahren, zusätzlich eine Fahrerlaubnis der Klasse D, ein Führungszeugnis sowie eine medizinisch-psychologische Untersuchung (MPU) für alle Bewerber; ein Sehtest ist nicht erforderlich (§ 48 Abs. 4 FeV).", "Mindestalter 21 Jahre (19 bei Beschränkung auf Krankenkraftwagen), Klasse B seit mindestens 2 Jahren, Führungszeugnis und Auskunft aus dem Fahreignungsregister, geistige und körperliche Eignung, Sehvermögen sowie für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV).", "Mindestalter 18 Jahre (16 bei Beschränkung auf Krankenkraftwagen), Klasse B seit mindestens 6 Monaten, Erste-Hilfe-Kurs, eine Ortskundeprüfung für Taxen sowie für Mietwagen ein Fachkundenachweis der IHK; ein Führungszeugnis ist nicht erforderlich (§ 48 Abs. 4 FeV)."], "richtig": 1, "erklaerung": "Mindestalter 21 Jahre (19 bei Beschränkung auf Krankenkraftwagen), Klasse B seit mindestens 2 Jahren, Führungszeugnis und Auskunft aus dem Fahreignungsregister, geistige und körperliche Eignung, Sehvermögen sowie für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV)."}, {"id": 203, "gesetz": "FeV", "frage": "#0203 Welche ärztlichen Untersuchungen sind für die Fahrerlaubnis zur Fahrgastbeförderung erforderlich?", "antworten": ["Entzug oder Nichtverlängerung der FzF (§ 46 FeV).", "Das Fahren ist nicht mehr erlaubt; erneute Prüfung und Gesundheitscheck sind erforderlich (§ 24 FeV).", "Allgemeine gesundheitliche Untersuchung; Untersuchung des Sehvermögens (§ 48 Abs. 4 FeV, Anlage 5 & 6)."], "richtig": 2, "erklaerung": "Allgemeine gesundheitliche Untersuchung; Untersuchung des Sehvermögens (§ 48 Abs. 4 FeV, Anlage 5 & 6)."}, {"id": 204, "gesetz": "FeV", "frage": "#0204 Wie lange ist eine Fahrerlaubnis zur Fahrgastbeförderung gültig?", "antworten": ["Sie wird unbefristet erteilt und gilt, solange die allgemeine Fahrerlaubnis der Klasse B besteht; eine erneute Prüfung der Eignung findet erst ab dem 60. Lebensjahr statt (§ 48 Abs. 5 FeV).", "Sie wird für höchstens zwei Jahre erteilt und kann nicht verlängert werden; nach Ablauf ist eine vollständig neue Fahrerlaubnis einschließlich Fachkundeprüfung zu erwerben (§ 48 Abs. 5 FeV).", "Sie wird für höchstens fünf Jahre erteilt und auf Antrag jeweils um bis zu fünf Jahre verlängert, wenn Eignung, Sehvermögen und die Gewähr für die besondere Verantwortung erneut nachgewiesen werden (§ 48 Abs. 5 FeV)."], "richtig": 2, "erklaerung": "Sie wird für höchstens fünf Jahre erteilt und auf Antrag jeweils um bis zu fünf Jahre verlängert, wenn Eignung, Sehvermögen und die Gewähr für die besondere Verantwortung erneut nachgewiesen werden (§ 48 Abs. 5 FeV)."}, {"id": 205, "gesetz": "FeV", "frage": "#0205 Welche Strafen drohen, wenn jemand ohne Fahrerlaubnis zur Fahrgastbeförderung ein Taxi fährt?", "antworten": ["Freiheitsstrafe bis zu einem Jahr oder Geldstrafe als Straftat (§ 21 StVG), auch wenn eine gültige Fahrerlaubnis der Klasse B vorliegt; zudem wird die Fahrerlaubnis stets für mindestens zwei Jahre entzogen.", "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt.", "Keine Sanktion für den Fahrer, da die Fahrerlaubnis zur Fahrgastbeförderung eine reine Ordnungsvorschrift ohne Bußgeldbewehrung ist (§ 48 Abs. 1 FeV); haftbar ist allein der Unternehmer."], "richtig": 1, "erklaerung": "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt."}, {"id": 206, "gesetz": "FeV", "frage": "#0206 Muss eine Fahrerlaubnis zur Fahrgastbeförderung in der Taxe oder dem Mietwagen mitgeführt werden?", "antworten": ["Ja, der Führerschein zur Fahrgastbeförderung ist bei der Fahrgastbeförderung neben dem Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV).", "Nein, es genügt, wenn der Führerschein zur Fahrgastbeförderung im Betrieb aufbewahrt und nach einer Kontrolle innerhalb einer Woche bei der Polizei vorgelegt wird (§ 48 Abs. 3 FeV).", "Nein, die Berechtigung ist im allgemeinen Kartenführerschein elektronisch gespeichert, sodass ein gesonderter Führerschein zur Fahrgastbeförderung nicht mitzuführen ist (§ 48 Abs. 3 FeV)."], "richtig": 0, "erklaerung": "Ja, der Führerschein zur Fahrgastbeförderung ist bei der Fahrgastbeförderung neben dem Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV)."}, {"id": 207, "gesetz": "FeV", "frage": "#0207 Welche gesundheitlichen Anforderungen müssen Fahrer im Taxi- und Mietwagenverkehr erfüllen?", "antworten": ["Sie dürfen keine Erkrankungen oder Einschränkungen haben, die ihre Fahreignung beeinträchtigen (z. B. schwere Seh- oder Hörprobleme, Epilepsie) (§ 11 FeV).", "Nein, jede gewerbliche Personenbeförderung erfordert eine gültige FzF (§ 48 FeV).", "Geldstrafe oder Freiheitsstrafe (§ 21 StVG)."], "richtig": 0, "erklaerung": "Sie dürfen keine Erkrankungen oder Einschränkungen haben, die ihre Fahreignung beeinträchtigen (z. B. schwere Seh- oder Hörprobleme, Epilepsie) (§ 11 FeV)."}, {"id": 208, "gesetz": "FeV", "frage": "#0208 Welche Bedeutung hat das Führungszeugnis für die Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Das Führungszeugnis dient allein dem Nachweis der Ortskunde und ist nur bei der Ersterteilung vorzulegen; bei der Verlängerung genügt eine einfache Auskunft aus dem Gewerbezentralregister (§ 48 Abs. 4 Nr. 2a FeV).", "Mit dem Führungszeugnis weist der Bewerber seine körperliche und geistige Eignung nach; eine Auskunft aus dem Fahreignungsregister ist dagegen nicht erforderlich (§ 48 Abs. 4 Nr. 2a FeV).", "Mit einem Führungszeugnis (§ 30 Abs. 5 BZRG) und einer Auskunft aus dem Fahreignungsregister muss der Bewerber nachweisen, dass er die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung bietet (§ 48 Abs. 4 Nr. 2a FeV)."], "richtig": 2, "erklaerung": "Mit einem Führungszeugnis (§ 30 Abs. 5 BZRG) und einer Auskunft aus dem Fahreignungsregister muss der Bewerber nachweisen, dass er die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung bietet (§ 48 Abs. 4 Nr. 2a FeV)."}, {"id": 209, "gesetz": "FeV", "frage": "#0209 Wann kann eine Fahrerlaubnis zur Fahrgastbeförderung entzogen werden?", "antworten": ["Nur bei einer rechtskräftigen Verurteilung wegen einer Verkehrsstraftat; die Entziehung der allgemeinen Fahrerlaubnis lässt die Fahrerlaubnis zur Fahrgastbeförderung dagegen unberührt (§ 48 Abs. 9 FeV).", "Nur wenn der Fahrer innerhalb eines Jahres mehr als drei Ordnungswidrigkeiten nach dem PBefG begeht; gesundheitliche Mängel führen lediglich zu Auflagen, nie zur Entziehung (§ 48 Abs. 4 FeV).", "Wenn eine Voraussetzung nach § 48 Abs. 4 FeV wegfällt, z. B. körperliche/geistige Eignung oder die Gewähr für die besondere Verantwortung; sie erlischt auch mit der Entziehung der allgemeinen Fahrerlaubnis (§ 48 Abs. 9 FeV)."], "richtig": 2, "erklaerung": "Wenn eine Voraussetzung nach § 48 Abs. 4 FeV wegfällt, z. B. körperliche/geistige Eignung oder die Gewähr für die besondere Verantwortung; sie erlischt auch mit der Entziehung der allgemeinen Fahrerlaubnis (§ 48 Abs. 9 FeV)."}, {"id": 210, "gesetz": "FeV", "frage": "#0210 Welche Fahrerlaubnisklasse ist für das Führen eines Taxis erforderlich?", "antworten": ["Ja, sie muss jederzeit vorzeigbar sein (§ 4 Abs. 2 FeV).", "Die Klasse B mit einer gültigen Fahrerlaubnis zur Fahrgastbeförderung (FzF) (§ 48 FeV).", "Die Klasse B mit einer gültigen Unternehmerlaubnis zur Fahrgastbeförderung (FzF) (§ 48 FeV)."], "richtig": 1, "erklaerung": "Die Klasse B mit einer gültigen Fahrerlaubnis zur Fahrgastbeförderung (FzF) (§ 48 FeV)."}, {"id": 211, "gesetz": "FeV", "frage": "#0211 Welche Fahrerlaubnisklasse ist für das Führen eines Mietwagens erforderlich?", "antworten": ["Klasse B mit einer Unternehmerlaubnis zur Fahrgastbeförderung, falls gewerblich (§ 48 FeV).", "Klasse B mit einer Fahrerlaubnis zur Fahrgastbeförderung, falls gewerblich (§ 48 FeV).", "Ja, sie muss jederzeit vorzeigbar sein (§ 4 Abs. 2 FeV)."], "richtig": 1, "erklaerung": "Klasse B mit einer Fahrerlaubnis zur Fahrgastbeförderung, falls gewerblich (§ 48 FeV)."}, {"id": 212, "gesetz": "FeV", "frage": "#0212 Darf ein Mietwagenfahrer ohne Fahrerlaubnis zur Fahrgastbeförderung arbeiten?", "antworten": ["Nein, die FzF ist verpflichtend – außer der Fahrer besitzt die Fahrerlaubnisklasse B bereits seit mindestens fünf Jahren (§ 48 Abs. 2 Nr. 4 FeV).", "Nein, für die gewerbliche Personenbeförderung ist die FzF verpflichtend – außer der Fahrer besitzt die Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV).", "Ja, für Mietwagen ist die FzF nicht erforderlich, da sie nur vorbestellte Aufträge ausführen; die Pflicht besteht nur für Taxifahrer (§ 48 Abs. 1 FeV)."], "richtig": 1, "erklaerung": "Nein, für die gewerbliche Personenbeförderung ist die FzF verpflichtend – außer der Fahrer besitzt die Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV)."}, {"id": 213, "gesetz": "FeV", "frage": "#0213 Dürfen Fahrten ohne gültige Fahrerlaubnis zur Fahrgastbeförderung durchgeführt werden?", "antworten": ["Ja, in den ersten drei Monaten nach Antragstellung genügt die Antragsbestätigung der Fahrerlaubnisbehörde (§ 48 Abs. 2 Nr. 4 FeV).", "Nein – Ausnahme: Fahrten innerhalb des Pflichtfahrbereichs dürfen auch allein mit Klasse B durchgeführt werden (§ 48 Abs. 2 Nr. 4 FeV).", "Nein, jede gewerbliche Personenbeförderung erfordert eine gültige FzF – Ausnahme: Inhaber der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV)."], "richtig": 2, "erklaerung": "Nein, jede gewerbliche Personenbeförderung erfordert eine gültige FzF – Ausnahme: Inhaber der Klasse D oder D1 (§ 48 Abs. 2 Nr. 4 FeV)."}, {"id": 214, "gesetz": "FeV", "frage": "#0214 Welche Sonderregelung gilt für Mietwagen im Gegensatz zu Taxen?", "antworten": ["Mindestalter: 21 Jahre (bzw. 19 Jahre bei Ausbildungsberufen im Personenverkehr); Besitz einer gültigen Fahrerlaubnis der Klasse B seit mindestens zwei Jahren; Nachweis über geistige und körperliche Eignung (§ 48 FeV).", "Taxen dürfen nur nach vorheriger Bestellung eingesetzt werden und nicht an Taxiständen warten (§ 49 PBefG).", "Mietwagen dürfen nur nach vorheriger Bestellung eingesetzt werden und nicht an Taxiständen warten (§ 49 PBefG)."], "richtig": 2, "erklaerung": "Mietwagen dürfen nur nach vorheriger Bestellung eingesetzt werden und nicht an Taxiständen warten (§ 49 PBefG)."}, {"id": 215, "gesetz": "FeV", "frage": "#0215 Was passiert, wenn ein Fahrer seine gesundheitlichen Anforderungen nicht mehr erfüllt?", "antworten": ["Der Unternehmer muss den Fahrer bei der Genehmigungsbehörde abmelden; die Erlaubnis bleibt bestehen (§ 25 PBefG).", "Die Fahrerlaubnis zur Fahrgastbeförderung wird entzogen bzw. nicht verlängert (§ 48 Abs. 5, 9 FeV).", "Die Erlaubnis bleibt bis zum Ablauf ihrer Geltungsdauer gültig; erst die Verlängerung wird versagt (§ 48 Abs. 5 FeV)."], "richtig": 1, "erklaerung": "Die Fahrerlaubnis zur Fahrgastbeförderung wird entzogen bzw. nicht verlängert (§ 48 Abs. 5, 9 FeV)."}, {"id": 216, "gesetz": "FeV", "frage": "#0216 Wie oft muss eine Fahrerlaubnis zur Fahrgastbeförderung erneuert werden?", "antworten": ["Alle drei Jahre; nachzuweisen sind Führungszeugnis und ein neuer Fachkundenachweis, ab 65 Jahren zusätzlich ein Gutachten des Betriebsarztes des Arbeitgebers (§ 48 Abs. 5, 6 FeV).", "Spätestens alle fünf Jahre; nachzuweisen sind ärztliche Eignung, Sehvermögen sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister, ab 60 Jahren zusätzlich Leistungstests (§ 48 Abs. 5, 6 FeV).", "Spätestens alle zehn Jahre; nachzuweisen sind nur ärztliche Eignung und Sehvermögen, ab 50 Jahren zusätzlich eine medizinisch-psychologische Untersuchung (§ 48 Abs. 5, 6 FeV)."], "richtig": 1, "erklaerung": "Spätestens alle fünf Jahre; nachzuweisen sind ärztliche Eignung, Sehvermögen sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister, ab 60 Jahren zusätzlich Leistungstests (§ 48 Abs. 5, 6 FeV)."}, {"id": 217, "gesetz": "FeV", "frage": "#0217 Welche Fristen gelten für die Beantragung einer Verlängerung der Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Der Antrag ist frühestens einen Monat vor Ablauf zulässig; ein früher gestellter Antrag wird von der Behörde ohne Prüfung zurückgewiesen (§ 48 Abs. 5 FeV).", "Eine gesetzliche Antragsfrist besteht nicht; der Antrag sollte wegen der Bearbeitungszeit rechtzeitig (z. B. drei Monate) vor Ablauf gestellt werden (§ 48 Abs. 5 FeV).", "Der Antrag muss spätestens sechs Monate vor Ablauf gestellt werden; danach ist eine Verlängerung ausgeschlossen und die Prüfung zu wiederholen (§ 48 Abs. 5 FeV)."], "richtig": 1, "erklaerung": "Eine gesetzliche Antragsfrist besteht nicht; der Antrag sollte wegen der Bearbeitungszeit rechtzeitig (z. B. drei Monate) vor Ablauf gestellt werden (§ 48 Abs. 5 FeV)."}, {"id": 218, "gesetz": "FeV", "frage": "#0218 Welche Nachweise müssen für die Verlängerung einer Fahrerlaubnis zur Fahrgastbeförderung erbracht werden?", "antworten": ["Nachweis einer bestandenen Ortskundeprüfung, des Sehvermögens sowie eine Bescheinigung des Unternehmers über die bisherige Tätigkeit; ab 50 Jahren zusätzlich eine MPU (§ 48 Abs. 5, 6 FeV).", "Nachweis der geistigen und körperlichen Eignung, des Sehvermögens sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister; ab 60 Jahren zusätzliche Leistungstests (§ 48 Abs. 5, 6 FeV).", "Nur ein aktuelles Führungszeugnis und ein Erste-Hilfe-Nachweis; ärztliche Untersuchungen sind erst ab 70 Jahren erforderlich, dann jedoch jährlich (§ 48 Abs. 5, 6 FeV)."], "richtig": 1, "erklaerung": "Nachweis der geistigen und körperlichen Eignung, des Sehvermögens sowie Führungszeugnis und Auskunft aus dem Fahreignungsregister; ab 60 Jahren zusätzliche Leistungstests (§ 48 Abs. 5, 6 FeV)."}, {"id": 219, "gesetz": "FeV", "frage": "#0219 Welche Konsequenzen drohen, wenn eine Fahrerlaubnis zur Fahrgastbeförderung abläuft?", "antworten": ["Bis zu drei Monate nach Ablauf darf weiter befördert werden (Kulanzfrist); danach ist eine vollständige Ersterteilung mit erneuter Fachkundeprüfung erforderlich (§ 48 Abs. 6 i. V. m. § 24 Abs. 2 FeV).", "Ohne gültige Erlaubnis darf nicht mehr befördert werden (Ordnungswidrigkeit). Eine erneute Prüfung ist nicht nötig; die Neuerteilung erfolgt unter den Voraussetzungen der Verlängerung (§ 48 Abs. 6 i. V. m. § 24 Abs. 2 FeV).", "Jede Beförderung nach Ablauf ist eine Straftat nach § 21 StVG; die Neuerteilung setzt immer eine erneute Fachkundeprüfung und eine MPU voraus (§ 48 Abs. 6 i. V. m. § 24 Abs. 2 FeV)."], "richtig": 1, "erklaerung": "Ohne gültige Erlaubnis darf nicht mehr befördert werden (Ordnungswidrigkeit). Eine erneute Prüfung ist nicht nötig; die Neuerteilung erfolgt unter den Voraussetzungen der Verlängerung (§ 48 Abs. 6 i. V. m. § 24 Abs. 2 FeV)."}, {"id": 220, "gesetz": "FeV", "frage": "#0220 Was ist bei einer Neuerteilung der Fahrerlaubnis zur Fahrgastbeförderung zu beachten?", "antworten": ["Die Neuerteilung ist frühestens fünf Jahre nach der Entziehung zulässig; zuständig ist ausschließlich die IHK, die eine erneute Ortskundeprüfung abnimmt (§ 20 FeV).", "Nach Entziehung oder Verzicht genügt ein vereinfachtes Verlängerungsverfahren mit ärztlichem Attest; eine MPU darf bei der Neuerteilung nicht angeordnet werden (§ 20 FeV).", "Für die Neuerteilung nach Entziehung oder Verzicht gelten die Vorschriften für die Ersterteilung, also alle Voraussetzungen des § 48 Abs. 4 FeV; ggf. kann eine MPU angeordnet werden (§ 20 FeV)."], "richtig": 2, "erklaerung": "Für die Neuerteilung nach Entziehung oder Verzicht gelten die Vorschriften für die Ersterteilung, also alle Voraussetzungen des § 48 Abs. 4 FeV; ggf. kann eine MPU angeordnet werden (§ 20 FeV)."}, {"id": 221, "gesetz": "FeV", "frage": "#0221 Welche Strafen drohen bei Fahren ohne Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Nur ein Verwarnungsgeld (§ 56 OWiG); weitergehende Sanktionen sind auch dann ausgeschlossen, wenn zusätzlich die allgemeine Fahrerlaubnis fehlt.", "Freiheitsstrafe bis zu einem Jahr oder Geldstrafe nach § 21 StVG, da die FzF als eigene Fahrerlaubnisklasse gilt; ein bloßes Bußgeld ist nicht vorgesehen.", "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); Geld- oder Freiheitsstrafe nach § 21 StVG nur, wenn auch die allgemeine Fahrerlaubnis fehlt."], "richtig": 2, "erklaerung": "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); Geld- oder Freiheitsstrafe nach § 21 StVG nur, wenn auch die allgemeine Fahrerlaubnis fehlt."}, {"id": 222, "gesetz": "FeV", "frage": "#0222 Was passiert, wenn ein Fahrer unter Alkohol- oder Drogeneinfluss erwischt wird?", "antworten": ["Bußgeld und Fahrverbot (§ 24a StVG) bzw. Strafe und Entziehung der Fahrerlaubnis (§§ 316, 69 StGB), ggf. MPU (§§ 13, 14 FeV); im Taxi-/Mietwagendienst ist Alkohol während des Dienstes ohnehin verboten (§ 8 Abs. 3 Nr. 1, Abs. 5 BOKraft).", "Nur ein Verwarnungsgeld, da für Taxifahrer als Berufskraftfahrer eine erhöhte Promillegrenze von 0,8 gilt (§ 24a StVG); ein Alkoholverbot während des Dienstes enthält die BOKraft nicht, nur ein Rauchverbot (§ 8 BOKraft).", "Ausschließlich arbeitsrechtliche Folgen durch den Unternehmer (Abmahnung); Bußgeld, Fahrverbot oder Entziehung der Fahrerlaubnis kommen nur bei einem Unfall mit Personenschaden in Betracht (§§ 316, 69 StGB; § 8 Abs. 3 BOKraft)."], "richtig": 0, "erklaerung": "Bußgeld und Fahrverbot (§ 24a StVG) bzw. Strafe und Entziehung der Fahrerlaubnis (§§ 316, 69 StGB), ggf. MPU (§§ 13, 14 FeV); im Taxi-/Mietwagendienst ist Alkohol während des Dienstes ohnehin verboten (§ 8 Abs. 3 Nr. 1, Abs. 5 BOKraft)."}, {"id": 223, "gesetz": "FeV", "frage": "#0223 Welche Konsequenzen drohen bei Verstößen gegen die Auflagen der Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Alle fünf Jahre nach einer erneuten ärztlichen Untersuchung (§ 48 Abs. 4 FeV).", "Entzug oder Nichtverlängerung der FzF (§ 46 FeV).", "Geldstrafe oder Freiheitsstrafe (§ 21 StVG)."], "richtig": 1, "erklaerung": "Entzug oder Nichtverlängerung der FzF (§ 46 FeV)."}, {"id": 224, "gesetz": "FeV", "frage": "#0224 Wann muss ein Taxi- oder Mietwagenfahrer eine medizinisch-psychologische Untersuchung (MPU) absolvieren?", "antworten": ["Bei Eignungszweifeln, z. B. Alkohol- oder Drogenproblematik oder erheblichen Verkehrs- bzw. Straftaten (§§ 11, 13, 14 FeV), sowie bei Bedenken an der Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 8 FeV).", "Bei jedem Erstantrag ab dem 60. Lebensjahr sowie bei jeder Verlängerung nach Vollendung des 65. Lebensjahres, unabhängig von konkreten Eignungszweifeln (§§ 11, 13, 14 FeV; § 48 Abs. 5 FeV).", "Regelmäßig alle fünf Jahre bei der Verlängerung der FzF, ohne dass Eignungszweifel vorliegen müssen; Alkohol- oder Drogenauffälligkeiten spielen dafür keine Rolle (§ 48 Abs. 8 FeV)."], "richtig": 0, "erklaerung": "Bei Eignungszweifeln, z. B. Alkohol- oder Drogenproblematik oder erheblichen Verkehrs- bzw. Straftaten (§§ 11, 13, 14 FeV), sowie bei Bedenken an der Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 8 FeV)."}, {"id": 225, "gesetz": "FeV", "frage": "#0225 Was geschieht, wenn ein Fahrer wiederholt gegen die Vorschriften des Personenbeförderungsgesetzes (PBefG) verstößt?", "antworten": ["PBefG-Verstöße betreffen ausschließlich den Unternehmer; für den Fahrer haben sie weder Folgen für die Fahrerlaubnis zur Fahrgastbeförderung noch Bußgelder (§ 48 Abs. 8 FeV, § 45 BOKraft).", "Die Genehmigungsbehörde zieht nach dem dritten Verstoß automatisch auch die allgemeine Fahrerlaubnis ein; Bußgelder sind daneben ausgeschlossen (§ 48 Abs. 9 FeV, § 61 PBefG).", "Bestehen dadurch Zweifel an der Gewähr für die besondere Verantwortung, kann die Fahrerlaubnis zur Fahrgastbeförderung entzogen werden (§ 48 Abs. 8, 9 FeV); daneben drohen Bußgelder (§ 61 PBefG, § 45 BOKraft)."], "richtig": 2, "erklaerung": "Bestehen dadurch Zweifel an der Gewähr für die besondere Verantwortung, kann die Fahrerlaubnis zur Fahrgastbeförderung entzogen werden (§ 48 Abs. 8, 9 FeV); daneben drohen Bußgelder (§ 61 PBefG, § 45 BOKraft)."}, {"id": 226, "gesetz": "FeV", "frage": "#0226 Welche Sanktionen drohen, wenn ein Taxi- oder Mietwagenunternehmen Fahrer ohne gültige Fahrerlaubnis zur Fahrgastbeförderung beschäftigt?", "antworten": ["Nur der Fahrer handelt ordnungswidrig; den Unternehmer trifft keine Verantwortung, und auch wiederholte Verstöße wirken sich nicht auf die Genehmigung aus, da diese an das Fahrzeug gebunden ist (§ 48 Abs. 7, § 75 Nr. 12 FeV; § 25 PBefG).", "Ordnungswidrigkeit des Halters/Unternehmers, der die Beförderung ohne Fahrerlaubnis zur Fahrgastbeförderung anordnet oder zulässt (§ 48 Abs. 7, § 75 Nr. 12 FeV); wiederholte Verstöße gefährden seine Zuverlässigkeit bis zum Widerruf der Genehmigung (§ 25 PBefG).", "Der Unternehmer begeht eine Straftat mit Freiheitsstrafe bis zu drei Jahren; schon beim ersten Verstoß erlischt die Genehmigung kraft Gesetzes und kann frühestens nach fünf Jahren neu beantragt werden (§ 26 PBefG)."], "richtig": 1, "erklaerung": "Ordnungswidrigkeit des Halters/Unternehmers, der die Beförderung ohne Fahrerlaubnis zur Fahrgastbeförderung anordnet oder zulässt (§ 48 Abs. 7, § 75 Nr. 12 FeV); wiederholte Verstöße gefährden seine Zuverlässigkeit bis zum Widerruf der Genehmigung (§ 25 PBefG)."}, {"id": 227, "gesetz": "FeV", "frage": "#0227 Welche Anforderungen gelten an die Ortskunde für Taxifahrer?", "antworten": ["Eine Ortskundeprüfung gibt es nicht mehr; für Taxen, Mietwagen und gebündelten Bedarfsverkehr ist aber ein Fachkundenachweis vorzulegen, z. B. per Bescheinigung einer von der Landesbehörde bestimmten Stelle (§ 48 Abs. 4 Nr. 7 FeV).", "Ein Nachweis ist nur in Gemeinden über 50.000 Einwohnern nötig und erfolgt durch eine Bescheinigung des Taxiunternehmers über eine dreimonatige Einarbeitung (§ 48 Abs. 4 Nr. 7 FeV).", "Taxifahrer müssen weiterhin eine Ortskundeprüfung bei der Fahrerlaubnisbehörde ablegen; für Mietwagenfahrer ist dagegen kein Fach- oder Ortskundenachweis erforderlich (§ 48 Abs. 4 Nr. 7 FeV)."], "richtig": 0, "erklaerung": "Eine Ortskundeprüfung gibt es nicht mehr; für Taxen, Mietwagen und gebündelten Bedarfsverkehr ist aber ein Fachkundenachweis vorzulegen, z. B. per Bescheinigung einer von der Landesbehörde bestimmten Stelle (§ 48 Abs. 4 Nr. 7 FeV)."}, {"id": 228, "gesetz": "FeV", "frage": "#0228 Welche Fahrzeuge benötigen eine Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Gesundheitsprüfung und Sehtest (§ 48 Abs. 4 FeV).", "Taxis, Mietwagen und Krankenkraftwagen (§ 48 FeV).", "Taxis, Taxen und Krankenkraftwagen (§ 48 FeV)."], "richtig": 1, "erklaerung": "Taxis, Mietwagen und Krankenkraftwagen (§ 48 FeV)."}, {"id": 229, "gesetz": "FeV", "frage": "#0229 Wann darf eine Fahrerlaubnis zur Fahrgastbeförderung versagt werden?", "antworten": ["Nur wenn der Bewerber im Fahreignungsregister mit mindestens acht Punkten eingetragen ist; Gesundheit und Sehvermögen werden erst bei der Verlängerung geprüft (§ 48 Abs. 4 FeV).", "Wenn der Bewerber keinen Arbeitsvertrag mit einem Taxi- oder Mietwagenunternehmen vorlegt oder seinen Wohnsitz nicht im Pflichtfahrbereich hat (§ 48 Abs. 4 FeV).", "Wenn eine Voraussetzung des § 48 Abs. 4 FeV fehlt, z. B. Mindestalter, gesundheitliche Eignung, Sehvermögen, Fachkunde oder die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 4 FeV)."], "richtig": 2, "erklaerung": "Wenn eine Voraussetzung des § 48 Abs. 4 FeV fehlt, z. B. Mindestalter, gesundheitliche Eignung, Sehvermögen, Fachkunde oder die Gewähr für die besondere Verantwortung bei der Fahrgastbeförderung (§ 48 Abs. 4 FeV)."}, {"id": 230, "gesetz": "FeV", "frage": "#0230 Welche Vorschriften gelten für die Mitführung der Fahrerlaubnis zur Fahrgastbeförderung?", "antworten": ["Er ist anstelle des allgemeinen Führerscheins mitzuführen, da er diesen ersetzt, und nur der Polizei, nicht anderen Stellen auszuhändigen (§ 48 Abs. 3 FeV).", "Der Führerschein zur Fahrgastbeförderung muss nur im Betrieb hinterlegt werden; im Fahrzeug genügt der allgemeine Führerschein (§ 48 Abs. 3 FeV).", "Der Führerschein zur Fahrgastbeförderung ist neben dem allgemeinen Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV)."], "richtig": 2, "erklaerung": "Der Führerschein zur Fahrgastbeförderung ist neben dem allgemeinen Führerschein mitzuführen und zuständigen Personen auf Verlangen auszuhändigen (§ 48 Abs. 3 FeV)."}, {"id": 251, "gesetz": "StraßenGesetz", "frage": "#0251 Welche Fahrerlaubnisklasse wird für den Taxi- oder Mietwagenverkehr benötigt?", "antworten": ["Klasse BE und zusätzlich ein Fachkundenachweis der IHK für Taxiunternehmer (§ 2 Abs. 1, 3 StVG; § 13 PBefG).", "Klasse B und zusätzlich die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 1, 3 StVG; § 48 FeV).", "Klasse C1 und zusätzlich die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 1, 3 StVG; § 48 FeV)."], "richtig": 1, "erklaerung": "Klasse B und zusätzlich die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 1, 3 StVG; § 48 FeV)."}, {"id": 252, "gesetz": "StraßenGesetz", "frage": "#0252 Welche zusätzlichen Voraussetzungen sind für die Fahrgastbeförderung erforderlich?", "antworten": ["Die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 3 StVG): u. a. Mindestalter 18, Klasse B seit 1 Jahr, Erste-Hilfe-Kurs und für Taxi/Mietwagen eine Ortskundeprüfung bei der IHK (§ 48 Abs. 4 FeV).", "Die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 3 StVG): u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehvermögen und für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV).", "Die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 3 StVG): u. a. Mindestalter 25, Klasse B seit 5 Jahren, MPU, Unternehmer-Fachkundeprüfung und eine Arbeitgeberbescheinigung (§ 48 Abs. 4 FeV)."], "richtig": 1, "erklaerung": "Die Fahrerlaubnis zur Fahrgastbeförderung (§ 2 Abs. 3 StVG): u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehvermögen und für Taxi/Mietwagen ein Fachkundenachweis (§ 48 Abs. 4 FeV)."}, {"id": 253, "gesetz": "StraßenGesetz", "frage": "#0253 Wann ist eine Fahrerlaubnis auf Probe erforderlich?", "antworten": ["Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 2 Jahre (§ 2a StVG).", "Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 1 Jahre (§ 2a StVG).", "Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 3 Jahre (§ 2a StVG)."], "richtig": 0, "erklaerung": "Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 2 Jahre (§ 2a StVG)."}, {"id": 254, "gesetz": "StraßenGesetz", "frage": "#0254 Welche Faktoren können zur Entziehung der Fahrerlaubnis führen?", "antworten": ["Wiederholte Verstöße gegen Verkehrsvorschriften oder Fahruntüchtigkeit (§ 3 StVG).", "Ein Taxi-Dachzeichen sowie eine Konzessionsnummer auf der Heckscheibe (§ 49a StVZO).", "So groß, dass auch bei plötzlichem Bremsen sicher gehalten werden kann (§ 4 Abs. 1 StVO)."], "richtig": 0, "erklaerung": "Wiederholte Verstöße gegen Verkehrsvorschriften oder Fahruntüchtigkeit (§ 3 StVG)."}, {"id": 255, "gesetz": "StraßenGesetz", "frage": "#0255 Welche Erlaubnis ist für die gewerbliche Personenbeförderung erforderlich?", "antworten": ["Die Fahrerlaubnis zur Fahrgastbeförderung (umgangssprachlich „P-Schein“), nachgewiesen durch den Führerschein zur Fahrgastbeförderung (§ 2 Abs. 3 StVG, § 48 FeV).", "Die Fahrerlaubnis der Klasse D1 („Busführerschein“), die für jede entgeltliche Beförderung im Pkw vorgeschrieben ist (§ 2 Abs. 3 StVG, § 48 FeV).", "Eine Reisegewerbekarte nach der Gewerbeordnung, die jeder Fahrer vor Fahrtantritt beim Ordnungsamt beantragen muss (§ 2 Abs. 3 StVG, § 48 FeV)."], "richtig": 0, "erklaerung": "Die Fahrerlaubnis zur Fahrgastbeförderung (umgangssprachlich „P-Schein“), nachgewiesen durch den Führerschein zur Fahrgastbeförderung (§ 2 Abs. 3 StVG, § 48 FeV)."}, {"id": 256, "gesetz": "StraßenGesetz", "frage": "#0256 Welche Gesundheitsanforderungen müssen Taxifahrer erfüllen?", "antworten": ["Nachweis über körperliche und geistige Eignung (§ 2 Abs. 4 StVG).", "Fahrzeugteile wie Bremsen, Beleuchtungseinrichtungen und Rückhaltesysteme (§ 22a StVZO).", "Wenn das Fahrzeug nicht zu einem genehmigten Typ gehört (§ 21 StVZO)."], "richtig": 0, "erklaerung": "Nachweis über körperliche und geistige Eignung (§ 2 Abs. 4 StVG)."}, {"id": 257, "gesetz": "StraßenGesetz", "frage": "#0257 Wie oft muss die Eignung für den Personenbeförderungsschein überprüft werden?", "antworten": ["Alle 5 Jahre (§ 48 FeV).", "Alle 3 Jahre (§ 48 FeV).", "Alle 10 Jahre (§ 48 FeV)."], "richtig": 0, "erklaerung": "Alle 5 Jahre (§ 48 FeV)."}, {"id": 258, "gesetz": "StraßenGesetz", "frage": "#0258 Welche Strafe droht bei Fahrgastbeförderung ohne gültige Erlaubnis?", "antworten": ["Freiheitsstrafe bis zu einem Jahr oder Geldstrafe (§ 21 StVG), da die Fahrerlaubnis zur Fahrgastbeförderung wie eine Führerscheinklasse behandelt wird.", "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); § 21 StVG greift nur, wenn auch die allgemeine Fahrerlaubnis fehlt.", "Geldbuße nur für den Unternehmer (§ 61 PBefG); der Fahrer selbst bleibt sanktionslos, solange er die allgemeine Fahrerlaubnis der Klasse B besitzt."], "richtig": 1, "erklaerung": "Geldbuße als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); § 21 StVG greift nur, wenn auch die allgemeine Fahrerlaubnis fehlt."}, {"id": 259, "gesetz": "StraßenGesetz", "frage": "#0259 Welche Dokumente muss ein Taxifahrer während der Fahrt mitführen?", "antworten": ["Führerschein und Führerschein zur Fahrgastbeförderung (§ 4 Abs. 2, § 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die Tarifvorschriften (§ 10 BOKraft).", "Nur den allgemeinen Führerschein und den Personalausweis; Genehmigungsurkunde und Tarifvorschriften sind am Betriebssitz aufzubewahren und dürfen nicht im Fahrzeug mitgeführt werden (§ 17 Abs. 4 PBefG, § 10 BOKraft).", "Führerschein und Führerschein zur Fahrgastbeförderung, Zulassungsbescheinigung Teil II, das Original des Fachkundenachweises des Unternehmers (§ 13 PBefG) sowie ein Fahrtenbuch mit allen Fahrten des Tages (§ 10 BOKraft)."], "richtig": 0, "erklaerung": "Führerschein und Führerschein zur Fahrgastbeförderung (§ 4 Abs. 2, § 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die Tarifvorschriften (§ 10 BOKraft)."}, {"id": 260, "gesetz": "StraßenGesetz", "frage": "#0260 Wann muss ein Fahrtenbuch geführt werden?", "antworten": ["Das Kraftfahrt-Bundesamt (§ 20 StVZO).", "Bei behördlicher Anordnung nach Verkehrsverstößen (§ 31a StVZO).", "Wenn das Fahrzeug nicht mehr vorschriftsmäßig ist oder eine Gefährdung zu erwarten ist (§ 17 StVZO)."], "richtig": 1, "erklaerung": "Bei behördlicher Anordnung nach Verkehrsverstößen (§ 31a StVZO)."}, {"id": 261, "gesetz": "StraßenGesetz", "frage": "#0261 Wer haftet für Verkehrsverstöße mit einem Taxi oder Mietwagen?", "antworten": ["Für Verkehrsordnungswidrigkeiten haften Unternehmer und Fahrer gemeinsam zu gleichen Teilen (§ 25a StVG). Für Unfallschäden haftet nur die Taxizentrale, die den Auftrag vermittelt hat (§ 18 StVG).", "Für Verkehrsordnungswidrigkeiten grundsätzlich der Fahrer; der Halter trägt bei Halt- und Parkverstößen ggf. die Kosten (§ 25a StVG). Für Unfallschäden haftet der Halter verschuldensunabhängig (§ 7 StVG), der Fahrer bei vermutetem Verschulden (§ 18 StVG).", "Für alle Verkehrsverstöße haftet stets der Halter, auch wenn ein angestellter Fahrer gefahren ist (§ 25a StVG). Für Unfallschäden haftet allein der Fahrer, der Halter nur bei eigenem Verschulden (§ 7 StVG)."], "richtig": 1, "erklaerung": "Für Verkehrsordnungswidrigkeiten grundsätzlich der Fahrer; der Halter trägt bei Halt- und Parkverstößen ggf. die Kosten (§ 25a StVG). Für Unfallschäden haftet der Halter verschuldensunabhängig (§ 7 StVG), der Fahrer bei vermutetem Verschulden (§ 18 StVG)."}, {"id": 262, "gesetz": "StraßenGesetz", "frage": "#0262 Welche Behörde ist für die Zulassung eines Taxis zuständig?", "antworten": ["Wenn auf der Fahrbahn mehrere markierte Fahrstreifen für eine Richtung vorhanden sind (§ 7 Abs. 3 StVO).", "Die örtliche Zulassungsstelle (§ 1 StVG).", "Sie müssen verkehrssicher, umweltfreundlich und straßenschonend sein (§ 30 StVZO)."], "richtig": 1, "erklaerung": "Die örtliche Zulassungsstelle (§ 1 StVG)."}, {"id": 263, "gesetz": "StraßenGesetz", "frage": "#0263 Welche Farbe müssen Taxis in Deutschland haben?", "antworten": ["Verkehrsgelb (RAL 1023), bundesweit vorgeschrieben (§ 26 Abs. 1 Nr. 1 BOKraft); Ausnahmen kann nur das Bundesverkehrsministerium zulassen (§ 43 BOKraft).", "Hell-elfenbein (RAL 1015), bundesweit vorgeschrieben (§ 26 Abs. 1 Nr. 1 BOKraft); Ausnahmen können die zuständigen Landesbehörden zulassen (§ 43 BOKraft).", "Hell-elfenbein (RAL 1015), aber nur in Gemeinden über 100.000 Einwohnern; im Übrigen ist die Farbe frei wählbar (§ 26 Abs. 1 Nr. 1 BOKraft)."], "richtig": 1, "erklaerung": "Hell-elfenbein (RAL 1015), bundesweit vorgeschrieben (§ 26 Abs. 1 Nr. 1 BOKraft); Ausnahmen können die zuständigen Landesbehörden zulassen (§ 43 BOKraft)."}, {"id": 264, "gesetz": "StraßenGesetz", "frage": "#0264 Welche Kennzeichnung muss ein Taxi haben?", "antworten": ["Gelber Anstrich und beleuchtbares Taxischild mit Aufschrift „Taxi“ (§ 26 BOKraft), Ordnungsnummer auf der Motorhaube (§ 27 BOKraft) sowie ein Wegstreckenzähler (§ 30 BOKraft).", "Hell-elfenbeinfarbener Anstrich, Firmenname und Telefonnummer auf beiden Vordertüren (§ 26 BOKraft) sowie eine Ordnungsnummer neben dem vorderen Kennzeichen (§ 27 BOKraft).", "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild mit Aufschrift „Taxi“ (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (§ 28 BOKraft)."], "richtig": 2, "erklaerung": "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild mit Aufschrift „Taxi“ (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (§ 28 BOKraft)."}, {"id": 265, "gesetz": "StraßenGesetz", "frage": "#0265 Was passiert, wenn ein Taxifahrer ohne Personenbeförderungsschein fährt?", "antworten": ["Nur der Unternehmer erhält ein Bußgeld (§ 61 PBefG); für den Fahrer selbst bleibt das Fahren ohne Personenbeförderungsschein folgenlos (§ 24 StVG).", "Bußgeld als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt.", "Eine Straftat nach § 21 StVG mit Freiheitsstrafe bis zu einem Jahr oder Geldstrafe, auch wenn die allgemeine Fahrerlaubnis vorhanden ist."], "richtig": 1, "erklaerung": "Bußgeld als Ordnungswidrigkeit (§ 48 Abs. 1, § 75 Nr. 12 FeV i. V. m. § 24 StVG); eine Straftat nach § 21 StVG liegt nur vor, wenn auch die allgemeine Fahrerlaubnis fehlt."}, {"id": 266, "gesetz": "StraßenGesetz", "frage": "#0266 Welche Strafen drohen bei überhöhter Geschwindigkeit im Taxi?", "antworten": ["Geldbuße, ggf. Abschleppen des Fahrzeugs (§ 12 StVO).", "Ein Taxi-Dachzeichen sowie eine Konzessionsnummer auf der Heckscheibe (§ 49a StVZO).", "Punkte in Flensburg, Bußgeld, ggf. Fahrverbot (§ 4 StVG)."], "richtig": 2, "erklaerung": "Punkte in Flensburg, Bußgeld, ggf. Fahrverbot (§ 4 StVG)."}, {"id": 267, "gesetz": "StraßenGesetz", "frage": "#0267 Welche Konsequenzen hat die Beförderung von Fahrgästen ohne gültige Konzession?", "antworten": ["Ordnungswidrigkeit mit Geldbuße bis zu 5.000 € (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); auf die Zuverlässigkeit für künftige Genehmigungen hat dies keinen Einfluss (§ 13 Abs. 1 Nr. 2 PBefG).", "Straftat mit Freiheitsstrafe bis zu zwei Jahren (§ 61 Abs. 1 Nr. 1 PBefG); zudem gilt eine gesetzliche Sperrfrist von zehn Jahren für jede neue Genehmigung (§ 13 Abs. 1 Nr. 2 PBefG).", "Ordnungswidrigkeit mit Geldbuße bis zu 20.000 € (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); zudem kann das die Zuverlässigkeit für künftige Genehmigungen in Frage stellen (§ 13 Abs. 1 Nr. 2 PBefG)."], "richtig": 2, "erklaerung": "Ordnungswidrigkeit mit Geldbuße bis zu 20.000 € (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); zudem kann das die Zuverlässigkeit für künftige Genehmigungen in Frage stellen (§ 13 Abs. 1 Nr. 2 PBefG)."}, {"id": 268, "gesetz": "StraßenGesetz", "frage": "#0268 Wann kann ein Taxiunternehmen seine Konzession verlieren?", "antworten": ["Bei Unterschreiten eines gesetzlichen Mindestumsatzes oder wenn der Unternehmer nicht selbst mitfährt (§ 25 PBefG); sie erlischt außerdem bei jedem Fahrzeugwechsel und ist dann vollständig neu zu beantragen (§ 26 PBefG).", "Nur durch Zeitablauf; während der Geltungsdauer ist ein Widerruf ausgeschlossen, auch bei Wegfall der Zuverlässigkeit (§ 25 PBefG); bei Verlegung des Betriebssitzes geht sie automatisch auf die neue Gemeinde über (§ 26 PBefG).", "Bei Wegfall von Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachlicher Eignung (Widerrufspflicht) oder bei wiederholten Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG); sie erlischt bei Verlegung des Betriebssitzes in eine andere Gemeinde (§ 26 PBefG)."], "richtig": 2, "erklaerung": "Bei Wegfall von Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachlicher Eignung (Widerrufspflicht) oder bei wiederholten Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG); sie erlischt bei Verlegung des Betriebssitzes in eine andere Gemeinde (§ 26 PBefG)."}, {"id": 269, "gesetz": "StraßenGesetz", "frage": "#0269 Welche technischen Anforderungen muss ein Taxi oder Mietwagen erfüllen?", "antworten": ["Nur eine gültige Hauptuntersuchung (§ 29 StVZO); zusätzliche Ausrüstungsvorschriften bestehen nicht, ein Fahrpreisanzeiger ist bei Taxen freiwillig (§§ 25–30 BOKraft).", "Gültige Hauptuntersuchung (§ 29 StVZO) und die BOKraft-Ausrüstung: u. a. Trennwand zum Fahrgastraum und Klimaanlage, bei Taxen und Mietwagen ein geeichter Fahrpreisanzeiger (§§ 25–30 BOKraft).", "Gültige Hauptuntersuchung (§ 29 StVZO) und die BOKraft-Ausrüstung: u. a. zwei Türen rechts und Alarmanlage, bei Taxen geeichter Fahrpreisanzeiger, bei Mietwagen Wegstreckenzähler (§§ 25–30 BOKraft)."], "richtig": 2, "erklaerung": "Gültige Hauptuntersuchung (§ 29 StVZO) und die BOKraft-Ausrüstung: u. a. zwei Türen rechts und Alarmanlage, bei Taxen geeichter Fahrpreisanzeiger, bei Mietwagen Wegstreckenzähler (§§ 25–30 BOKraft)."}, {"id": 270, "gesetz": "StraßenGesetz", "frage": "#0270 Wie oft muss die Hauptuntersuchung (HU) für Taxis und Mietwagen durchgeführt werden?", "antworten": ["Alle 24 Monate (§ 29 StVZO).", "Alle 6 Monate (§ 29 StVZO).", "Alle 12 Monate (§ 29 StVZO)."], "richtig": 2, "erklaerung": "Alle 12 Monate (§ 29 StVZO)."}, {"id": 271, "gesetz": "StraßenGesetz", "frage": "#0271 Welche Pflichten hat ein Taxifahrer bei der täglichen Abfahrtkontrolle?", "antworten": ["Sichtkontrolle des Fahrzeugs, Prüfung der Beleuchtung, Reifen und Bremsen (§ 23 StVO).", "Sicherheitsgurte, Warndreieck, Verbandskasten und je nach Ausstattung eine Taxameteranlage (§ 35a StVZO).", "Wenn das Fahrzeug länger als drei Minuten steht oder der Fahrer es verlässt (§ 12 Abs. 2 StVO)."], "richtig": 0, "erklaerung": "Sichtkontrolle des Fahrzeugs, Prüfung der Beleuchtung, Reifen und Bremsen (§ 23 StVO)."}, {"id": 272, "gesetz": "StraßenGesetz", "frage": "#0272 Was ist zu tun, wenn das Taxi während der Fahrt eine Panne hat?", "antworten": ["Warnblinklicht einschalten, die Fahrgäste sofort aussteigen lassen und den vollen Fahrpreis bis zum ursprünglichen Fahrtziel verlangen (§ 15 StVO).", "Warnblinklicht einschalten, die Pannenstelle mit Warndreieck sichern (§ 15 StVO), Fahrgäste informieren und falls nötig ein Ersatzfahrzeug organisieren.", "Motor abstellen und im Fahrzeug auf die Polizei warten; ein Warndreieck muss bei Taxen nicht aufgestellt werden (§ 15 StVO)."], "richtig": 1, "erklaerung": "Warnblinklicht einschalten, die Pannenstelle mit Warndreieck sichern (§ 15 StVO)
