<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FaOnSa Taxi Quiz">
<meta name="theme-color" content="#0D1117">
<title>FaOnSa Taxi & Mietwagenverkehr</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;
  --dark:#0D1117;--dark2:#161B22;--dark3:#1E2530;
  --border:rgba(201,168,76,0.2);
  --text:#E8E6E1;--muted:#8B8680;
  --green:#3DD68C;--red:#FF5A5A;
  --green-bg:rgba(61,214,140,0.1);--red-bg:rgba(255,90,90,0.1);
}

body{
  background:var(--dark);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  background-image:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(201,168,76,0.1) 0%,transparent 70%);
}

/* ── LOGIN ── */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:32px 24px;gap:24px;
}
#login-screen.hidden{display:none;}

.login-badge{
  display:inline-block;background:rgba(201,168,76,0.15);border:1px solid var(--gold);
  color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:14px;
}
.login-title{font-size:28px;font-weight:700;margin-bottom:6px;text-align:center;}
.login-sub{color:var(--muted);font-size:14px;text-align:center;}
.login-card{
  width:100%;max-width:420px;background:var(--dark2);border:1px solid var(--border);
  border-radius:20px;padding:28px;
}
.login-label{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.login-input{
  width:100%;background:var(--dark3);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:14px 16px;color:var(--text);font-size:16px;
  font-family:inherit;outline:none;margin-bottom:16px;transition:border-color 0.2s;
}
.login-input:focus{border-color:var(--gold);}
.login-btn{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:var(--dark);border:none;border-radius:14px;padding:16px;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px;}

/* ── APP ── */
#app-screen{display:none;flex-direction:column;min-height:100vh;}
#app-screen.visible{display:flex;}

.app-header{
  position:sticky;top:0;z-index:10;
  background:rgba(13,17,23,0.95);backdrop-filter:blur(10px);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.header-title{font-size:15px;font-weight:700;color:var(--gold);}
.logout-btn{
  background:none;border:1px solid rgba(255,255,255,0.1);color:var(--muted);
  border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;
}

.app-main{flex:1;padding:16px;max-width:600px;width:100%;margin:0 auto;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.stat-box{
  background:var(--dark2);border:1px solid var(--border);border-radius:12px;
  padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.stat-val{font-size:22px;font-weight:700;line-height:1;}
.stat-lbl{font-size:10px;color:var(--muted);}

/* CARDS */
.card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.card-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}

.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.diff-btn{
  background:var(--dark3);border:2px solid rgba(255,255,255,0.08);border-radius:12px;
  padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:4px;transition:all 0.2s;font-family:inherit;
}
.diff-btn .dlabel{font-weight:600;font-size:14px;color:var(--text);}
.diff-btn small{font-size:11px;color:var(--muted);}

.round-row{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text);margin-bottom:10px;}
.round-row:last-child{margin-bottom:0;}

/* BUTTONS */
.primary-btn{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:var(--dark);border:none;border-radius:16px;padding:17px;
  font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;font-family:inherit;
  display:block;
}
.secondary-btn{
  width:100%;background:transparent;color:var(--text);
  border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:15px;
  font-size:15px;font-weight:500;cursor:pointer;margin-bottom:12px;font-family:inherit;
  display:block;
}
.danger-btn{
  width:100%;background:transparent;color:var(--red);
  border:1px solid rgba(255,90,90,0.3);border-radius:16px;padding:15px;
  font-size:15px;cursor:pointer;margin-bottom:12px;font-family:inherit;
  display:block;
}

/* PROGRESS */
.prog-wrap{margin-bottom:16px;}
.prog-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
.prog-bar{height:4px;background:var(--dark3);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:99px;transition:width 0.4s;}

/* QUESTION */
.q-tag{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.q-text{font-size:17px;line-height:1.55;color:var(--text);margin-bottom:22px;font-weight:500;}

/* ANSWERS */
.answers{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.ans-btn{
  background:var(--dark3);border:1px solid rgba(255,255,255,0.08);border-radius:14px;
  padding:13px 14px;color:var(--text);font-family:inherit;font-size:14px;
  cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:12px;
  transition:all 0.2s;line-height:1.45;width:100%;
}
.letter{
  width:28px;height:28px;min-width:28px;border-radius:8px;
  background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px;
}
.ans-btn.correct{background:var(--green-bg);border-color:var(--green);}
.ans-btn.correct .letter{background:var(--green);color:var(--dark);}
.ans-btn.wrong{background:var(--red-bg);border-color:var(--red);}
.ans-btn.wrong .letter{background:var(--red);color:#fff;}
.ans-btn.locked{cursor:default;}
.ans-btn.locked:not(.correct):not(.wrong){opacity:0.35;}

.feedback{
  border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.6;
  display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--green-bg);border:1px solid rgba(61,214,140,0.3);color:#5DF0A0;}
.feedback.err{background:var(--red-bg);border:1px solid rgba(255,90,90,0.3);color:#FF8080;}
.feedback b{display:block;margin-bottom:4px;font-size:14px;}

/* DETAIL */
.detail-item{
  background:var(--dark2);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:10px;
}
.detail-bar{height:6px;background:var(--dark);border-radius:99px;margin:8px 0 4px;}
.detail-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}

/* RESULT */
.result-screen{text-align:center;padding:40px 0;}
.score-big{font-size:80px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:8px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp 0.3s ease;}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen">
  <div style="text-align:center">
    <div class="login-badge">IHK Fachkundeprüfung</div>
    <div class="login-title">Taxi & Mietwagenverkehr</div>
    <div class="login-sub">Prüfungsvorbereitung · 915 Fragen</div>
  </div>
  <div class="login-card">
    <div class="login-label">Zugangscode eingeben</div>
    <input class="login-input" id="code-input" type="text" 
           placeholder="z.B. MUSTERMANN2024"
           autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <button class="login-btn" onclick="checkCode()">Zugang →</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app-screen">
  <div class="app-header">
    <div class="header-title">🚕 FaOnSa Taxi Quiz</div>
    <button class="logout-btn" onclick="logout()">Abmelden</button>
  </div>
  <div class="app-main" id="main-content"></div>
</div>

<script>
// ════════════════════════════════════════════
// ZUGANGSCODES – Zeile löschen = kein Zugang
// ════════════════════════════════════════════
const CODES = [
  "MUSTERMANN2024",
  "SCHMIDT2024",
  "MUELLER2024",
  "DEMO2024",
];

const ALL_QUESTIONS = [{"id": 1, "gesetz": "PBefG", "frage": "#0001 Was regelt das Personenbeförderungsgesetz (PBefG)?", "antworten": ["Das PBefG regelt die geschäftsmäßige oder entgeltliche Beförderung von Personen mit Straßenbahnen, Oberleitungsomnibussen und Kraftfahrzeugen (§ 1 Abs. 1 PBefG).", "Das PBefG regelt ausschließlich die entgeltliche Beförderung von Personen mit Taxen und Mietwagen; Straßenbahnen und Omnibusse fallen unter die BOKraft (§ 1 Abs. 1 PBefG).", "Das PBefG regelt die gewerbliche Beförderung von Personen und Gütern mit Kraftfahrzeugen auf öffentlichen Straßen einschließlich der Eisenbahnen (§ 1 Abs. 1 PBefG)."], "richtig": 0, "erklaerung": "Das PBefG regelt die geschäftsmäßige oder entgeltliche Beförderung von Personen mit Straßenbahnen, Oberleitungsomnibussen und Kraftfahrzeugen (§ 1 Abs. 1 PBefG)."}, {"id": 2, "gesetz": "PBefG", "frage": "#0002 Welche Verkehrsarten unterscheidet das PBefG?", "antworten": ["Nur Linienverkehr (§ 42 PBefG) und Taxenverkehr (§ 47 PBefG); Mietwagen, Ausflugsfahrten und gebündelter Bedarfsverkehr gelten als genehmigungsfreier Gelegenheitsverkehr nach § 1 Abs. 2 PBefG und werden vom PBefG nicht weiter erfasst.", "Linienverkehr (§§ 42–45 PBefG) und Gelegenheitsverkehr (§ 46 PBefG) mit den Formen Taxen (§ 47), Ausflugsfahrten/Ferienziel-Reisen (§ 48), Mietomnibusse/Mietwagen (§ 49) und gebündelter Bedarfsverkehr (§ 50); daneben Straßenbahn- und Obusverkehr (§ 2 PBefG).", "Öffentlicher Verkehr (§§ 42–45 PBefG) und Individualverkehr (§ 46 PBefG); zum Individualverkehr zählen Taxen, Mietwagen und Krankenfahrten, während Ausflugsfahrten und Ferienziel-Reisen als Linienverkehr gelten (§ 43 PBefG)."], "richtig": 1, "erklaerung": "Linienverkehr (§§ 42–45 PBefG) und Gelegenheitsverkehr (§ 46 PBefG) mit den Formen Taxen (§ 47), Ausflugsfahrten/Ferienziel-Reisen (§ 48), Mietomnibusse/Mietwagen (§ 49) und gebündelter Bedarfsverkehr (§ 50); daneben Straßenbahn- und Obusverkehr (§ 2 PBefG)."}, {"id": 3, "gesetz": "PBefG", "frage": "#0003 Welche Genehmigungspflichten bestehen im Personenverkehr?", "antworten": ["Wer entgeltlich oder geschäftsmäßig Personen mit Straßenbahnen, Obussen oder Kraftfahrzeugen befördert, braucht eine Genehmigung, soweit keine Ausnahme (z. B. § 1 Abs. 2 PBefG, Freistellungs-Verordnung) greift (§ 2 Abs. 1 PBefG).", "Eine Genehmigung ist nur für den Linienverkehr erforderlich; Gelegenheitsverkehr mit Taxen oder Mietwagen bedarf lediglich einer Gewerbeanmeldung und einer Eintragung bei der IHK (§ 2 Abs. 1 PBefG).", "Eine Genehmigung braucht nur, wer Fahrzeuge mit mehr als acht Fahrgastplätzen einsetzt; Pkw-Beförderungen gegen Entgelt sind genehmigungsfrei, wenn sie beim Gewerbeamt angezeigt werden (§ 2 Abs. 1 PBefG)."], "richtig": 0, "erklaerung": "Wer entgeltlich oder geschäftsmäßig Personen mit Straßenbahnen, Obussen oder Kraftfahrzeugen befördert, braucht eine Genehmigung, soweit keine Ausnahme (z. B. § 1 Abs. 2 PBefG, Freistellungs-Verordnung) greift (§ 2 Abs. 1 PBefG)."}, {"id": 4, "gesetz": "PBefG", "frage": "#0004 Wer erteilt die Genehmigung für Taxen oder Mietwagen?", "antworten": ["Die örtlich zuständige Genehmigungsbehörde (§ 11 PBefG).", "Das Kraftfahrt-Bundesamt in Flensburg (§ 11 PBefG).", "Die zuständige Industrie- und Handelskammer (§ 11 PBefG)."], "richtig": 0, "erklaerung": "Die örtlich zuständige Genehmigungsbehörde (§ 11 PBefG)."}, {"id": 5, "gesetz": "PBefG", "frage": "#0005 Wie lange ist eine Taxikonzession gültig?", "antworten": ["Höchstens 10 Jahre (§ 16 Abs. 4 PBefG); Neubewerbern wird die Taxigenehmigung für 5 Jahre erteilt (§ 13 Abs. 5 PBefG). Danach verlängert sie sich automatisch.", "Unbefristet, solange der Betrieb ausgeübt wird (§ 16 Abs. 4 PBefG); Neubewerber erhalten zunächst eine Probegenehmigung für 1 Jahr (§ 13 Abs. 5 PBefG). Danach ist sie umzuschreiben.", "Höchstens 5 Jahre (§ 16 Abs. 4 PBefG); Neubewerbern wird die Taxigenehmigung für 2 Jahre erteilt (§ 13 Abs. 5 PBefG). Danach ist die Wiedererteilung zu beantragen."], "richtig": 2, "erklaerung": "Höchstens 5 Jahre (§ 16 Abs. 4 PBefG); Neubewerbern wird die Taxigenehmigung für 2 Jahre erteilt (§ 13 Abs. 5 PBefG). Danach ist die Wiedererteilung zu beantragen."}, {"id": 6, "gesetz": "PBefG", "frage": "#0006 Welche Bedingungen müssen Unternehmer für eine Konzession erfüllen?", "antworten": ["Sicherheit und Leistungsfähigkeit des Betriebs (finanzielle Leistungsfähigkeit), Zuverlässigkeit, fachliche Eignung sowie Betriebssitz oder Niederlassung im Inland (§ 13 Abs. 1 PBefG); bei Taxen darf zudem das örtliche Taxengewerbe nicht in seiner Funktionsfähigkeit bedroht werden (§ 13 Abs. 4 PBefG).", "Zuverlässigkeit und fachliche Eignung genügen, die finanzielle Leistungsfähigkeit wird nur im Linienverkehr geprüft (§ 13 Abs. 1 PBefG); bei Taxen darf die Zahl der Genehmigungen bundesweit 50 je 10.000 Einwohner nicht übersteigen (§ 13 Abs. 4 PBefG).", "Ein Mindestfuhrpark von drei Fahrzeugen, ein Meisterbrief im Kfz-Handwerk, Zuverlässigkeit sowie ein Wohnsitz in der Genehmigungsgemeinde (§ 13 Abs. 1 PBefG); bei Taxen ist zudem eine Ortskundeprüfung des Unternehmers vorgeschrieben (§ 13 Abs. 4 PBefG)."], "richtig": 0, "erklaerung": "Sicherheit und Leistungsfähigkeit des Betriebs (finanzielle Leistungsfähigkeit), Zuverlässigkeit, fachliche Eignung sowie Betriebssitz oder Niederlassung im Inland (§ 13 Abs. 1 PBefG); bei Taxen darf zudem das örtliche Taxengewerbe nicht in seiner Funktionsfähigkeit bedroht werden (§ 13 Abs. 4 PBefG)."}, {"id": 7, "gesetz": "PBefG", "frage": "#0007 Was ist der Hauptunterschied zwischen Taxen und Mietwagen?", "antworten": ["Taxen werden an behördlich zugelassenen Stellen bereitgehalten, unterliegen Betriebs- und Beförderungspflicht (§§ 21, 22, 47 PBefG) und dem Taxitarif (§ 51 PBefG). Mietwagen führen nur am Betriebssitz oder in der Wohnung eingegangene Aufträge aus, unterliegen der Rückkehrpflicht und grundsätzlich keinem Tarif (§ 49 Abs. 4 PBefG; Mindestentgelte nach § 51a möglich).", "Taxen und Mietwagen unterliegen gleichermaßen Betriebs-, Beförderungs- und Tarifpflicht (§§ 21, 22, 51 PBefG). Der Unterschied liegt allein in der Fahrzeuggröße: Mietwagen dürfen bis zu neun Sitzplätze haben, Taxen höchstens fünf; zudem brauchen Mietwagen keine eigene Genehmigung (§ 49 Abs. 4 PBefG).", "Mietwagen werden an behördlich zugelassenen Stellen bereitgehalten und unterliegen der Betriebs- und Beförderungspflicht (§§ 21, 22, 49 PBefG). Taxen dürfen nur am Betriebssitz eingegangene Aufträge ausführen, müssen danach zurückkehren und vereinbaren ihr Entgelt frei (§ 47 Abs. 4 PBefG; Mindestentgelte nur nach § 51a)."], "richtig": 0, "erklaerung": "Taxen werden an behördlich zugelassenen Stellen bereitgehalten, unterliegen Betriebs- und Beförderungspflicht (§§ 21, 22, 47 PBefG) und dem Taxitarif (§ 51 PBefG). Mietwagen führen nur am Betriebssitz oder in der Wohnung eingegangene Aufträge aus, unterliegen der Rückkehrpflicht und grundsätzlich keinem Tarif (§ 49 Abs. 4 PBefG; Mindestentgelte nach § 51a möglich)."}, {"id": 8, "gesetz": "PBefG", "frage": "#0008 Welche Betriebspflicht haben Taxiunternehmen?", "antworten": ["Taxiunternehmer müssen jedes Fahrzeug täglich mindestens 16 Stunden einsetzen (Betriebspflicht, § 21 PBefG); Verstöße ahndet die IHK durch Entzug der Fachkundebescheinigung des Unternehmers (§ 47 Abs. 3 PBefG).", "Taxiunternehmer müssen den Betrieb nur aufnehmen, wenn ausreichend Nachfrage besteht, und dürfen ihn jederzeit ohne Zustimmung ruhen lassen (§ 21 PBefG); den Umfang bestimmt allein der Unternehmer im Rahmen der Gewerbefreiheit (§ 47 Abs. 3 PBefG).", "Taxiunternehmer müssen den genehmigten Betrieb aufnehmen und während der Geltungsdauer aufrechterhalten (Betriebspflicht, § 21 PBefG); den Umfang kann die Landesregierung durch Rechtsverordnung regeln (§ 47 Abs. 3 PBefG)."], "richtig": 2, "erklaerung": "Taxiunternehmer müssen den genehmigten Betrieb aufnehmen und während der Geltungsdauer aufrechterhalten (Betriebspflicht, § 21 PBefG); den Umfang kann die Landesregierung durch Rechtsverordnung regeln (§ 47 Abs. 3 PBefG)."}, {"id": 9, "gesetz": "PBefG", "frage": "#0009 Sind Mietwagen ebenfalls betriebspflichtig?", "antworten": ["Ja, aber nur während der in der Genehmigung festgelegten Betriebszeiten (§ 21 PBefG).", "Nein, Mietwagen haben keine Betriebspflicht und dürfen Fahrten ablehnen (§ 49 PBefG).", "Ja, Mietwagen unterliegen wie Taxen der Betriebs- und Beförderungspflicht (§ 49 PBefG)."], "richtig": 1, "erklaerung": "Nein, Mietwagen haben keine Betriebspflicht und dürfen Fahrten ablehnen (§ 49 PBefG)."}, {"id": 10, "gesetz": "PBefG", "frage": "#0010 Wann darf ein Taxi eine Beförderung verweigern?", "antworten": ["Wenn die Voraussetzungen der Beförderungspflicht fehlen (§ 22 PBefG), die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 47 Abs. 4 PBefG) oder Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft).", "Jederzeit ohne Angabe von Gründen, da die Beförderungspflicht nur für den Linienverkehr gilt (§ 22 PBefG); im Taxenverkehr entscheidet allein der Fahrer, ob er eine Fahrt innerhalb oder außerhalb des Pflichtfahrbereichs annimmt (§ 47 Abs. 4 PBefG, § 13 BOKraft).", "Wenn die Fahrt kürzer als 3 km ist, der Fahrgast nicht im Voraus bezahlt oder Gepäck mitführt (§ 22 PBefG); eine Gefährdung durch den Fahrgast berechtigt dagegen nicht zur Ablehnung, da im Taxenverkehr eine uneingeschränkte Beförderungspflicht gilt (§ 13 BOKraft)."], "richtig": 0, "erklaerung": "Wenn die Voraussetzungen der Beförderungspflicht fehlen (§ 22 PBefG), die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 47 Abs. 4 PBefG) oder Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft)."}, {"id": 11, "gesetz": "PBefG", "frage": "#0011 Sind Taxen an feste Tarife gebunden?", "antworten": ["Ja, die Beförderungsentgelte werden bundeseinheitlich durch Rechtsverordnung des Bundesverkehrsministeriums festgesetzt und gelten in allen Ländern gleichermaßen als Taxitarif (§ 51 Abs. 1 PBefG).", "Nein, Taxiunternehmer legen ihre Fahrpreise frei fest und müssen sie lediglich im Fahrzeug aushängen; die Genehmigungsbehörde prüft nur, ob sie angemessen sind (§ 51 Abs. 1 PBefG).", "Ja, die Beförderungsentgelte werden durch Rechtsverordnung der Landesregierung bzw. der von ihr ermächtigten Stelle (meist Kreis oder kreisfreie Stadt) als Taxitarif festgesetzt (§ 51 Abs. 1 PBefG)."], "richtig": 2, "erklaerung": "Ja, die Beförderungsentgelte werden durch Rechtsverordnung der Landesregierung bzw. der von ihr ermächtigten Stelle (meist Kreis oder kreisfreie Stadt) als Taxitarif festgesetzt (§ 51 Abs. 1 PBefG)."}, {"id": 12, "gesetz": "PBefG", "frage": "#0012 Gilt die Tarifpflicht auch für Mietwagen?", "antworten": ["Nein, das Entgelt im Mietwagenverkehr ist stets frei vereinbar; die Genehmigungsbehörde darf weder Mindest- noch Höchstentgelte festlegen, da dies nur im Taxenverkehr zulässig ist (§ 51a Abs. 1 PBefG).", "Nein, das Entgelt im Mietwagenverkehr wird grundsätzlich frei vereinbart; die Genehmigungsbehörde kann jedoch tarifbezogene Regelungen, insbesondere Mindestbeförderungsentgelte, festlegen (§ 51a Abs. 1 PBefG).", "Ja, für Mietwagen gilt der örtliche Taxitarif entsprechend; er darf lediglich um bis zu 20 % unterschritten werden, weitere Abweichungen muss die Genehmigungsbehörde genehmigen (§ 51a Abs. 1 PBefG)."], "richtig": 1, "erklaerung": "Nein, das Entgelt im Mietwagenverkehr wird grundsätzlich frei vereinbart; die Genehmigungsbehörde kann jedoch tarifbezogene Regelungen, insbesondere Mindestbeförderungsentgelte, festlegen (§ 51a Abs. 1 PBefG)."}, {"id": 13, "gesetz": "PBefG", "frage": "#0013 Welche besonderen Merkmale müssen Taxen aufweisen?", "antworten": ["Beliebige Farbe mit seitlicher Aufschrift „Taxi“ (§ 26 BOKraft), Konzessionsnummer im amtlichen Kennzeichen (§ 27 BOKraft) sowie ein Wegstreckenzähler, der den Taxameter in Großstädten ersetzen darf (§ 28 BOKraft).", "Verkehrsgelber Anstrich (RAL 1023) und Taxischild auf dem Dach (§ 26 BOKraft), Ordnungsnummer auf der Motorhaube (§ 27 BOKraft) sowie ein Taxameter, der nur für Fahrten außerhalb des Pflichtfahrbereichs Pflicht ist (§ 28 BOKraft).", "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (Taxameter), der für jede Taxe Pflicht ist (§ 28 BOKraft)."], "richtig": 2, "erklaerung": "Hell-elfenbeinfarbener Anstrich und beleuchtbares Taxischild (§ 26 BOKraft), Ordnungsnummer an der Heckscheibe (§ 27 BOKraft) sowie ein geeichter Fahrpreisanzeiger (Taxameter), der für jede Taxe Pflicht ist (§ 28 BOKraft)."}, {"id": 14, "gesetz": "PBefG", "frage": "#0014 Welche Pflichten gelten für den Betriebssitz von Mietwagen?", "antworten": ["Nach Ausführung des Auftrags darf der Mietwagen bis zu 30 Minuten am Zielort warten und dort neue Fahrgäste aufnehmen; zum Betriebssitz muss er erst am Ende der Schicht zurückkehren (§ 49 Abs. 4 PBefG).", "Nach jeder Fahrt muss der Mietwagen zum nächstgelegenen Taxenstand fahren und sich dort bereithalten, sofern er nicht über eine Vermittlungs-App bereits einen neuen Auftrag erhalten hat (§ 49 Abs. 4 PBefG).", "Nach Ausführung des Auftrags muss der Mietwagen unverzüglich zum Betriebssitz zurückkehren, es sei denn, er hat vor der Fahrt vom Betriebssitz oder der Wohnung oder während der Fahrt einen neuen Auftrag erhalten (§ 49 Abs. 4 PBefG)."], "richtig": 2, "erklaerung": "Nach Ausführung des Auftrags muss der Mietwagen unverzüglich zum Betriebssitz zurückkehren, es sei denn, er hat vor der Fahrt vom Betriebssitz oder der Wohnung oder während der Fahrt einen neuen Auftrag erhalten (§ 49 Abs. 4 PBefG)."}, {"id": 15, "gesetz": "PBefG", "frage": "#0015 Dürfen Mietwagen an Taxiständen bereitstehen?", "antworten": ["Nein, Mietwagen dürfen keine Fahrgäste an Taxiständen aufnehmen oder dort warten (§ 49 Abs. 4 PBefG).", "Ja, wenn alle Taxen am Stand besetzt sind und der Mietwagen deutlich gekennzeichnet ist (§ 49 Abs. 4 PBefG).", "Ja, nachts zwischen 22 und 6 Uhr dürfen Mietwagen an Taxiständen auf Fahrgäste warten (§ 47 Abs. 4 PBefG)."], "richtig": 0, "erklaerung": "Nein, Mietwagen dürfen keine Fahrgäste an Taxiständen aufnehmen oder dort warten (§ 49 Abs. 4 PBefG)."}, {"id": 16, "gesetz": "PBefG", "frage": "#0016 Welche Strafen drohen bei unerlaubtem Taxibetrieb?", "antworten": ["Es liegt eine Straftat vor, die mit Freiheitsstrafe bis zu einem Jahr oder Geldstrafe geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG).", "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 5.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG).", "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG)."], "richtig": 2, "erklaerung": "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG)."}, {"id": 17, "gesetz": "PBefG", "frage": "#0017 Welche Konsequenzen drohen Taxiunternehmen, die sich nicht an die Tarifpflicht halten?", "antworten": ["Geldbuße bis zu 10.000 € (§ 61 Abs. 1 Nr. 3 Buchst. c, Abs. 2 PBefG); bei wiederholten Verstößen Widerruf der Genehmigung wegen Unzuverlässigkeit (§ 25 Abs. 1 PBefG).", "Lediglich ein Verwarnungsgeld bis zu 55 € (§ 61 Abs. 1 Nr. 3 Buchst. c PBefG); ein Widerruf der Genehmigung ist wegen Tarifverstößen generell ausgeschlossen (§ 25 Abs. 1 PBefG).", "Geldbuße bis zu 50.000 € (§ 61 Abs. 1 Nr. 3 Buchst. c, Abs. 2 PBefG); bereits beim ersten Verstoß zwingender Widerruf der Genehmigung ohne Ermessen (§ 25 Abs. 1 PBefG)."], "richtig": 0, "erklaerung": "Geldbuße bis zu 10.000 € (§ 61 Abs. 1 Nr. 3 Buchst. c, Abs. 2 PBefG); bei wiederholten Verstößen Widerruf der Genehmigung wegen Unzuverlässigkeit (§ 25 Abs. 1 PBefG)."}, {"id": 18, "gesetz": "PBefG", "frage": "#0018 Dürfen Mietwagen Krankenfahrten durchführen?", "antworten": ["Nein, Krankenfahrten dürfen ausschließlich mit Taxen oder Krankenkraftwagen durchgeführt werden; Mietwagen sind dafür nach dem PBefG ausdrücklich ausgeschlossen (§ 49 Abs. 4 PBefG; § 133 SGB V).", "Ja, Krankenfahrten sind mit Mietwagen zulässig und können ohne Vertrag mit jeder Krankenkasse direkt abgerechnet werden, sofern der Fahrer eine Erste-Hilfe-Schulung nachweist (§ 49 Abs. 4 PBefG; § 133 SGB V).", "Ja, Krankenfahrten (sitzende Beförderung ohne medizinisch-fachliche Betreuung) sind mit Mietwagen auf Bestellung zulässig; die Abrechnung mit Krankenkassen setzt einen Vertrag mit der Kasse voraus (§ 49 Abs. 4 PBefG; § 133 SGB V)."], "richtig": 2, "erklaerung": "Ja, Krankenfahrten (sitzende Beförderung ohne medizinisch-fachliche Betreuung) sind mit Mietwagen auf Bestellung zulässig; die Abrechnung mit Krankenkassen setzt einen Vertrag mit der Kasse voraus (§ 49 Abs. 4 PBefG; § 133 SGB V)."}, {"id": 19, "gesetz": "PBefG", "frage": "#0019 Sind digitale Fahrtenvermittlungen für Taxi- und Mietwagen erlaubt?", "antworten": ["Ja, die Vermittlung über Apps/Plattformen ist zulässig; der Vermittler braucht keine eigene Genehmigung (§ 1 Abs. 3, § 2 Abs. 1b PBefG), die Beförderung selbst darf aber nur ein Unternehmer mit Genehmigung durchführen (§ 2 Abs. 1 PBefG).", "Nein, die Vermittlung von Taxi- und Mietwagenfahrten über Apps ist nach dem PBefG verboten; Aufträge dürfen nur telefonisch oder am Betriebssitz angenommen werden (§ 1 Abs. 3, § 2 Abs. 1b PBefG).", "Ja, aber der Plattformbetreiber braucht eine eigene Taxi- oder Mietwagengenehmigung; die über ihn vermittelten Fahrer dürfen dann auch ohne eigene Unternehmergenehmigung befördern (§ 1 Abs. 3, § 2 Abs. 1b PBefG)."], "richtig": 0, "erklaerung": "Ja, die Vermittlung über Apps/Plattformen ist zulässig; der Vermittler braucht keine eigene Genehmigung (§ 1 Abs. 3, § 2 Abs. 1b PBefG), die Beförderung selbst darf aber nur ein Unternehmer mit Genehmigung durchführen (§ 2 Abs. 1 PBefG)."}, {"id": 20, "gesetz": "PBefG", "frage": "#0020 Welche Dokumente muss ein Taxifahrer mitführen?", "antworten": ["Nur den allgemeinen Führerschein (§ 48 Abs. 3 FeV); Genehmigungsurkunde und Zulassungsbescheinigung Teil I verbleiben im Betrieb (§ 17 Abs. 4 PBefG), die Tarifvorschriften sind nur in Mietwagen mitzuführen (§ 10 BOKraft).", "Personalausweis und Fahrzeugschein, die Fachkundebescheinigung des Unternehmers (§ 48 Abs. 3 FeV), das Fahrtenbuch der letzten drei Monate (§ 17 Abs. 4 PBefG) sowie den Nachweis über die letzte Hauptuntersuchung (§ 10 BOKraft).", "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft)."], "richtig": 2, "erklaerung": "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft)."}, {"id": 21, "gesetz": "PBefG", "frage": "#0021 Welche Regeln gelten für Taxameter?", "antworten": ["Taxen müssen einen beleuchtbaren, geeichten Fahrpreisanzeiger oder ein konformitätsbewertetes softwarebasiertes System haben (§ 28 BOKraft); zudem ist eine zertifizierte technische Sicherheitseinrichtung (TSE) vorgeschrieben (§ 146a AO, KassenSichV).", "Taxen müssen nur einen geeichten Wegstreckenzähler haben; Fahrpreisanzeiger sind lediglich für Fahrten außerhalb des Pflichtfahrbereichs vorgeschrieben (§ 28 BOKraft), eine TSE ist für Taxameter nicht erforderlich (§ 146a AO, KassenSichV).", "Ein Taxameter ist entbehrlich, wenn der Fahrer jede Quittung von Hand ausstellt (§ 28 BOKraft); eine zertifizierte technische Sicherheitseinrichtung ist nur für Mietwagenbetriebe mit mehr als fünf Fahrzeugen vorgeschrieben (§ 146a AO, KassenSichV)."], "richtig": 0, "erklaerung": "Taxen müssen einen beleuchtbaren, geeichten Fahrpreisanzeiger oder ein konformitätsbewertetes softwarebasiertes System haben (§ 28 BOKraft); zudem ist eine zertifizierte technische Sicherheitseinrichtung (TSE) vorgeschrieben (§ 146a AO, KassenSichV)."}, {"id": 22, "gesetz": "PBefG", "frage": "#0022 Wann dürfen Mietwagen als Taxi eingesetzt werden?", "antworten": ["Immer, sofern sie einen geeichten Taxameter eingebaut haben (§ 47 PBefG).", "Niemals, Mietwagen dürfen nicht im Taxiverkehr fahren (§ 49 PBefG).", "Nachts und an Feiertagen, wenn nicht genügend Taxen verfügbar sind (§ 49 PBefG)."], "richtig": 1, "erklaerung": "Niemals, Mietwagen dürfen nicht im Taxiverkehr fahren (§ 49 PBefG)."}, {"id": 23, "gesetz": "PBefG", "frage": "#0023 Welche Mindestanforderung gilt für die finanzielle Leistungsfähigkeit von Taxiunternehmen?", "antworten": ["Eigenkapital und Reserven von mindestens der Hälfte der Beträge nach Art. 7 VO (EG) Nr. 1071/2009, also 4.500 € für das erste und 2.500 € für jedes weitere Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "Eigenkapital und Reserven von mindestens einem Viertel der Beträge nach Art. 7 VO (EG) Nr. 1071/2009 je Fahrzeug, also 2.250 € für das erste und 1.250 € für jedes weitere Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "Eigenkapital und Reserven in voller Höhe der Beträge nach Art. 7 VO (EG) Nr. 1071/2009, also 9.000 € für das erste und 5.000 € für jedes weitere Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV)."], "richtig": 1, "erklaerung": "Eigenkapital und Reserven von mindestens einem Viertel der Beträge nach Art. 7 VO (EG) Nr. 1071/2009 je Fahrzeug, also 2.250 € für das erste und 1.250 € für jedes weitere Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV)."}, {"id": 24, "gesetz": "PBefG", "frage": "#0024 Wann kann eine Taxikonzession widerrufen werden?", "antworten": ["Die Genehmigung kann nur widerrufen werden, wenn der Unternehmer rechtskräftig zu einer Freiheitsstrafe von mehr als zwei Jahren verurteilt wurde; Verstöße gegen arbeits-, sozial- oder steuerrechtliche Pflichten sind kein Widerrufsgrund (§ 25 PBefG).", "Die Genehmigung kann widerrufen werden, wenn der Unternehmer innerhalb eines Jahres weniger als 1.000 Fahrten durchführt; bei Wegfall der fachlichen Eignung oder Zuverlässigkeit erlischt sie erst mit Ablauf ihrer Geltungsdauer (§ 25 PBefG).", "Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG)."], "richtig": 2, "erklaerung": "Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG)."}, {"id": 25, "gesetz": "PBefG", "frage": "#0025 Welche Behörde ist für Genehmigungen im Personenverkehr zuständig?", "antworten": ["Die örtlich zuständige Industrie- und Handelskammer (§ 11 PBefG).", "Das Bundesministerium für Verkehr als oberste Bundesbehörde (§ 11 PBefG).", "Die von der Landesregierung bestimmte Genehmigungsbehörde (§ 11 PBefG)."], "richtig": 2, "erklaerung": "Die von der Landesregierung bestimmte Genehmigungsbehörde (§ 11 PBefG)."}, {"id": 26, "gesetz": "PBefG", "frage": "#0026 Welche besonderen Vorschriften gelten für die Personenbeförderung von Menschen mit Behinderung?", "antworten": ["Die Beförderungspflicht (§ 22, § 47 Abs. 4 PBefG) gilt auch für Menschen mit Behinderung; bei Taxen ist ab 20 Fahrzeugen je Unternehmer eine Mindestverfügbarkeit barrierefreier Fahrzeuge vorzusehen (Richtwert 5 %, § 64c PBefG).", "Menschen mit Behinderung sind von der Beförderungspflicht ausgenommen (§ 22, § 47 Abs. 4 PBefG); jedes Taxiunternehmen muss bereits ab dem ersten Fahrzeug mindestens ein barrierefreies Fahrzeug vorhalten (§ 64c PBefG).", "Die Beförderungspflicht (§ 22, § 47 Abs. 4 PBefG) gilt nur bei Voranmeldung von 24 Stunden; bei Taxen ist ab 5 Fahrzeugen je Unternehmer mindestens die Hälfte barrierefrei auszustatten (Pflichtquote 50 %, § 64c PBefG)."], "richtig": 0, "erklaerung": "Die Beförderungspflicht (§ 22, § 47 Abs. 4 PBefG) gilt auch für Menschen mit Behinderung; bei Taxen ist ab 20 Fahrzeugen je Unternehmer eine Mindestverfügbarkeit barrierefreier Fahrzeuge vorzusehen (Richtwert 5 %, § 64c PBefG)."}, {"id": 27, "gesetz": "PBefG", "frage": "#0027 Welche Voraussetzungen müssen Fahrer im gewerblichen Personenverkehr erfüllen?", "antworten": ["Fahrer benötigen eine Fahrerlaubnis zur Fahrgastbeförderung (u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehtest) und für Taxen/Mietwagen einen Fachkundenachweis (§ 48 Abs. 4 FeV). Eine Ortskundeprüfung ist nicht mehr vorgesehen.", "Fahrer benötigen eine Fahrerlaubnis zur Fahrgastbeförderung (u. a. Mindestalter 18, Klasse B seit 1 Jahr, Führungszeugnis) und für Taxen zusätzlich eine bestandene Ortskundeprüfung bei der IHK (§ 48 Abs. 4 FeV). Ein Fachkundenachweis ist nur für Mietwagenfahrer vorgesehen.", "Fahrer benötigen lediglich die Fahrerlaubnis der Klasse D und einen Erste-Hilfe-Kurs (§ 48 Abs. 4 FeV); ein Fachkundenachweis ist nur für den Unternehmer selbst erforderlich, eine ärztliche Untersuchung entfällt bei Fahrern unter 50 Jahren."], "richtig": 0, "erklaerung": "Fahrer benötigen eine Fahrerlaubnis zur Fahrgastbeförderung (u. a. Mindestalter 21, Klasse B seit 2 Jahren, Führungszeugnis, ärztliche Eignung, Sehtest) und für Taxen/Mietwagen einen Fachkundenachweis (§ 48 Abs. 4 FeV). Eine Ortskundeprüfung ist nicht mehr vorgesehen."}, {"id": 28, "gesetz": "PBefG", "frage": "#0028 Welche finanziellen Nachweise müssen Taxi- und Mietwagenunternehmen bei der Genehmigungsbehörde erbringen?", "antworten": ["Eine Bankbürgschaft über 50.000 € je Fahrzeug, die Einkommensteuerbescheide der letzten fünf Jahre sowie eine SCHUFA-Auskunft, die höchstens 12 Monate alt sein darf; Unbedenklichkeitsbescheinigungen sind nicht erforderlich (§ 2 Abs. 2 PBZugV).", "Eine Bestätigung der IHK über die bestandene Fachkundeprüfung, ein Kontoauszug mit mindestens 10.000 € Guthaben sowie die Gewerbeanmeldung; Bescheinigungen des Finanzamts werden erst bei der Wiedererteilung verlangt (§ 2 Abs. 2 PBZugV).", "Bescheinigungen in Steuersachen des Finanzamts, Unbedenklichkeitsbescheinigungen von Gemeinde, Sozialversicherungsträgern und Berufsgenossenschaft (höchstens 3 Monate alt) sowie eine Eigenkapitalbescheinigung bzw. bestätigte Vermögensübersicht (§ 2 Abs. 2 PBZugV)."], "richtig": 2, "erklaerung": "Bescheinigungen in Steuersachen des Finanzamts, Unbedenklichkeitsbescheinigungen von Gemeinde, Sozialversicherungsträgern und Berufsgenossenschaft (höchstens 3 Monate alt) sowie eine Eigenkapitalbescheinigung bzw. bestätigte Vermögensübersicht (§ 2 Abs. 2 PBZugV)."}, {"id": 29, "gesetz": "PBefG", "frage": "#0029 Wie oft werden Genehmigungsinhaber im Personenverkehr auf Einhaltung der Vorschriften überprüft?", "antworten": ["Im Taxen- und Mietwagenverkehr nur, wenn Zweifel am Fortbestehen der Berufszugangsvoraussetzungen bestehen (§ 9 Abs. 1 PBZugV); im Übrigen bei der Wiedererteilung der Genehmigung und im Rahmen der laufenden Aufsicht (§ 54 PBefG).", "Im Taxen- und Mietwagenverkehr jährlich durch eine unangekündigte Betriebsprüfung der IHK (§ 9 Abs. 1 PBZugV); bei der Wiedererteilung der Genehmigung findet dagegen keine erneute Prüfung statt (§ 54 PBefG).", "Im Taxen- und Mietwagenverkehr zwingend alle 2 Jahre durch Vorlage sämtlicher Nachweise bei der Genehmigungsbehörde, unabhängig davon, ob Zweifel bestehen (§ 9 Abs. 1 PBZugV; § 54 PBefG)."], "richtig": 0, "erklaerung": "Im Taxen- und Mietwagenverkehr nur, wenn Zweifel am Fortbestehen der Berufszugangsvoraussetzungen bestehen (§ 9 Abs. 1 PBZugV); im Übrigen bei der Wiedererteilung der Genehmigung und im Rahmen der laufenden Aufsicht (§ 54 PBefG)."}, {"id": 30, "gesetz": "PBefG", "frage": "#0030 Welche Hauptziele verfolgt das PBefG?", "antworten": ["Das PBefG soll vorrangig den Wettbewerb zwischen Taxi- und Mietwagenunternehmen fördern, indem es Marktzugang und Preise vollständig freigibt (§ 1 PBefG); eine Genehmigungspflicht besteht nur für Linienverkehre mit Omnibussen (§§ 2, 13 PBefG).", "Das PBefG ordnet die entgeltliche oder geschäftsmäßige Personenbeförderung (§ 1 PBefG) durch Genehmigungspflicht und Berufszugangsregeln, um eine sichere, leistungsfähige und den öffentlichen Verkehrsinteressen entsprechende Verkehrsbedienung zu gewährleisten (§§ 2, 13 PBefG).", "Das PBefG dient in erster Linie dem Umweltschutz durch Begrenzung des motorisierten Individualverkehrs (§ 1 PBefG) und regelt dazu vor allem Emissionsgrenzwerte, Fahrverbote und die Kfz-Steuer für Taxen und Mietwagen (§§ 2, 13 PBefG)."], "richtig": 1, "erklaerung": "Das PBefG ordnet die entgeltliche oder geschäftsmäßige Personenbeförderung (§ 1 PBefG) durch Genehmigungspflicht und Berufszugangsregeln, um eine sichere, leistungsfähige und den öffentlichen Verkehrsinteressen entsprechende Verkehrsbedienung zu gewährleisten (§§ 2, 13 PBefG)."}, {"id": 31, "gesetz": "PBefG", "frage": "#0031 Was bedeutet die Beförderungspflicht im PBefG?", "antworten": ["Fahrgäste müssen nur befördert werden, wenn sie vorab reserviert haben (§ 22 PBefG).", "Fahrgäste dürfen nicht ohne triftigen Grund abgelehnt werden (§ 22 PBefG).", "Jeder Fahrgast muss ausnahmslos befördert werden, auch bei Gefährdung (§ 22 PBefG)."], "richtig": 1, "erklaerung": "Fahrgäste dürfen nicht ohne triftigen Grund abgelehnt werden (§ 22 PBefG)."}, {"id": 32, "gesetz": "PBefG", "frage": "#0032 Was bedeutet die Tarifpflicht im PBefG?", "antworten": ["Innerhalb des Pflichtfahrbereichs gelten die festgesetzten Taxientgelte; sie dürfen nicht über- oder unterschritten werden (§ 51 Abs. 1, 5 i. V. m. § 39 Abs. 3 PBefG).", "Die festgesetzten Taxientgelte sind reine Höchstpreise; im Pflichtfahrbereich dürfen sie unterschritten, aber nicht überschritten werden (§ 51 Abs. 1, 5 i. V. m. § 39 Abs. 3 PBefG).", "Die festgesetzten Taxientgelte sind unverbindliche Richtwerte, von denen Fahrer und Fahrgast im Pflichtfahrbereich frei abweichen dürfen (§ 51 Abs. 1, 5 i. V. m. § 39 Abs. 3 PBefG)."], "richtig": 0, "erklaerung": "Innerhalb des Pflichtfahrbereichs gelten die festgesetzten Taxientgelte; sie dürfen nicht über- oder unterschritten werden (§ 51 Abs. 1, 5 i. V. m. § 39 Abs. 3 PBefG)."}, {"id": 33, "gesetz": "PBefG", "frage": "#0033 Welche Sorgfaltspflicht haben Fahrer im Personenverkehr?", "antworten": ["Sie müssen sicher und rücksichtsvoll fahren, um Fahrgäste nicht zu gefährden.", "Nur bei Gefährdung der Sicherheit oder unangemessenem Verhalten des Fahrgasts (§47 Abs. 1 PBefG).", "Taxen sind öffentlich verfügbar, haben eine Beförderungspflicht und unterliegen festen Tarifen (§47 PBefG). Mietwagen dürfen nur nach vorheriger Bestellung fahren, haben keine Tarifbindung und unterliegen der Rückkehrpflicht (§49 PBefG)."], "richtig": 0, "erklaerung": "Sie müssen sicher und rücksichtsvoll fahren, um Fahrgäste nicht zu gefährden."}, {"id": 34, "gesetz": "PBefG", "frage": "#0034 Worauf haben Fahrgäste im Personenverkehr Anspruch?", "antworten": ["Auf eine sichere und ordnungsgemäße Beförderung gemäß den gesetzlichen Vorschriften.", "In der Regel mindestens alle fünf Jahre, spätestens jedoch bei einer Verlängerung der Genehmigung (§15 PBefG).", "Ja, sie müssen mitgenommen werden, auch wenn Tiere sonst nicht erlaubt sind."], "richtig": 0, "erklaerung": "Auf eine sichere und ordnungsgemäße Beförderung gemäß den gesetzlichen Vorschriften."}, {"id": 35, "gesetz": "PBefG", "frage": "#0035 Dürfen Fahrgäste den Fahrpreis frei verhandeln?", "antworten": ["Ja, Fahrgast und Fahrer können im Pflichtfahrbereich jederzeit einen Pauschalpreis vereinbaren, sofern er den Taxitarif um höchstens 20 % unterschreitet (§ 51 PBefG). Außerhalb des Pflichtfahrbereichs gilt der Taxitarif dagegen zwingend weiter (§ 37 Abs. 3 BOKraft).", "Nein, im Pflichtfahrbereich gilt der festgesetzte Taxitarif; Abweichungen nur über zugelassene Festpreise, Preiskorridore bei Bestellfahrten oder genehmigte Sondervereinbarungen (§ 51 PBefG). Außerhalb des Pflichtfahrbereichs ist das Entgelt frei zu vereinbaren (§ 37 Abs. 3 BOKraft).", "Nein, der Taxitarif gilt ausnahmslos; Festpreise, Preiskorridore und Sondervereinbarungen sind generell unzulässig (§ 51 PBefG). Auch außerhalb des Pflichtfahrbereichs muss stets nach dem Taxameter abgerechnet werden (§ 37 Abs. 3 BOKraft)."], "richtig": 1, "erklaerung": "Nein, im Pflichtfahrbereich gilt der festgesetzte Taxitarif; Abweichungen nur über zugelassene Festpreise, Preiskorridore bei Bestellfahrten oder genehmigte Sondervereinbarungen (§ 51 PBefG). Außerhalb des Pflichtfahrbereichs ist das Entgelt frei zu vereinbaren (§ 37 Abs. 3 BOKraft)."}, {"id": 36, "gesetz": "PBefG", "frage": "#0036 Welche technischen Vorschriften gelten für Fahrzeuge im Personenverkehr?", "antworten": ["Fahrzeuge müssen nur der StVZO entsprechen und wie Privat-Pkw alle zwei Jahre zur Hauptuntersuchung; die BOKraft-Vorschriften prüft gesondert die IHK (§ 29 StVZO i. V. m. Anlage VIII; § 41 BOKraft).", "Fahrzeuge müssen den Vorschriften der BOKraft und StVZO entsprechen und jährlich zur Hauptuntersuchung, bei der auch die BOKraft-Vorschriften geprüft werden (§ 29 StVZO i. V. m. Anlage VIII; § 41 BOKraft).", "Fahrzeuge müssen halbjährlich zur Hauptuntersuchung und zusätzlich vierteljährlich zur Sicherheitsprüfung; die BOKraft-Vorschriften werden dabei nicht geprüft (§ 29 StVZO i. V. m. Anlage VIII; § 41 BOKraft)."], "richtig": 1, "erklaerung": "Fahrzeuge müssen den Vorschriften der BOKraft und StVZO entsprechen und jährlich zur Hauptuntersuchung, bei der auch die BOKraft-Vorschriften geprüft werden (§ 29 StVZO i. V. m. Anlage VIII; § 41 BOKraft)."}, {"id": 37, "gesetz": "PBefG", "frage": "#0037 Was gilt für die Beförderung von Kindern im Taxi?", "antworten": ["Kinder unter 6 Jahren und kleiner als 120 cm müssen gesichert werden, im Taxi gilt jedoch eine generelle Ausnahme: Taxen müssen keine Rückhalteeinrichtungen mitführen, und Kinder dürfen stets auf dem Schoß eines Erwachsenen mitfahren (§ 21 Abs. 1a StVO).", "Kinder unter 14 Jahren und kleiner als 160 cm dürfen im Taxi nur auf dem Beifahrersitz befördert werden; Taxen müssen für jeden Sitzplatz eine eigene Rückhalteeinrichtung für alle Gewichtsklassen ab 0 kg mitführen (§ 21 Abs. 1a StVO).", "Kinder unter 12 Jahren und kleiner als 150 cm müssen auch im Taxi gesichert werden; Taxen müssen auf den Rücksitzen Rückhalteeinrichtungen für zwei Kinder ab 9 kg haben, davon mindestens eine für 9–18 kg – bei regelmäßiger Kinderbeförderung gilt die volle Pflicht (§ 21 Abs. 1a StVO)."], "richtig": 2, "erklaerung": "Kinder unter 12 Jahren und kleiner als 150 cm müssen auch im Taxi gesichert werden; Taxen müssen auf den Rücksitzen Rückhalteeinrichtungen für zwei Kinder ab 9 kg haben, davon mindestens eine für 9–18 kg – bei regelmäßiger Kinderbeförderung gilt die volle Pflicht (§ 21 Abs. 1a StVO)."}, {"id": 38, "gesetz": "PBefG", "frage": "#0038 Dürfen Fahrgäste mit Blindenhunden befördert werden?", "antworten": ["Ja, sie müssen mitgenommen werden, auch wenn Tiere sonst nicht erlaubt sind.", "Nein, sie müssen mitgenommen werden, auch wenn Tiere sonst nicht erlaubt sind.", "Ja, das Beförderungsentgelt wird von der Genehmigungsbehörde festgelegt (§39 PBefG)."], "richtig": 0, "erklaerung": "Ja, sie müssen mitgenommen werden, auch wenn Tiere sonst nicht erlaubt sind."}, {"id": 39, "gesetz": "PBefG", "frage": "#0039 Was können Fahrgäste tun, wenn sie sich über eine Fahrt beschweren wollen?", "antworten": ["Sie können sich beim Taxiunternehmen oder der zuständigen Behörde melden.", "Ja, aber nur für konzessionierte Unternehmen und Fahrer (§51 PBefG).", "Ja, sie müssen mitgenommen werden, auch wenn Tiere sonst nicht erlaubt sind."], "richtig": 0, "erklaerung": "Sie können sich beim Taxiunternehmen oder der zuständigen Behörde melden."}, {"id": 40, "gesetz": "PBefG", "frage": "#0040 Was sollte ein Fahrer tun, wenn ein Fahrgast nicht zahlen kann?", "antworten": ["Taxen sind öffentlich verfügbar, haben eine Beförderungspflicht und unterliegen festen Tarifen (§47 PBefG). Mietwagen dürfen nur nach vorheriger Bestellung fahren, haben keine Tarifbindung und unterliegen der Rückkehrpflicht (§49 PBefG).", "Ruhig bleiben, eine Lösung suchen und notfalls die Polizei rufen.", "Die Sicherstellung eines geordneten, sicheren, wirtschaftlichen und nachhaltigen Personenverkehrs, insbesondere im öffentlichen Interesse (§1 PBefG)."], "richtig": 1, "erklaerung": "Ruhig bleiben, eine Lösung suchen und notfalls die Polizei rufen."}, {"id": 41, "gesetz": "PBefG", "frage": "#0041 Wie lange darf ein Taxifahrer pro Tag arbeiten?", "antworten": ["Werktäglich grundsätzlich 8 Stunden ohne jede Verlängerungsmöglichkeit; Mehrarbeit ist im Taxigewerbe nur mit Erlaubnis der Genehmigungsbehörde nach dem PBefG zulässig (§ 3 ArbZG).", "Werktäglich grundsätzlich 10 Stunden; Verlängerung auf bis zu 12 Stunden, wenn im Durchschnitt von 12 Kalendermonaten 10 Stunden werktäglich nicht überschritten werden (§ 3 ArbZG).", "Werktäglich grundsätzlich 8 Stunden; Verlängerung auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Kalendermonaten oder 24 Wochen 8 Stunden werktäglich nicht überschritten werden (§ 3 ArbZG)."], "richtig": 2, "erklaerung": "Werktäglich grundsätzlich 8 Stunden; Verlängerung auf bis zu 10 Stunden, wenn im Durchschnitt von 6 Kalendermonaten oder 24 Wochen 8 Stunden werktäglich nicht überschritten werden (§ 3 ArbZG)."}, {"id": 42, "gesetz": "PBefG", "frage": "#0042 Wann muss ein Fahrer eine Pause einlegen?", "antworten": ["Länger als 8 Stunden hintereinander darf nicht ohne Ruhepause gearbeitet werden; bei mehr als 8 bis 10 Stunden mindestens 15 Minuten, bei mehr als 10 Stunden 30 Minuten Pause (§ 4 ArbZG).", "Länger als 6 Stunden hintereinander darf nicht ohne Ruhepause gearbeitet werden; bei mehr als 6 bis 9 Stunden mindestens 30 Minuten, bei mehr als 9 Stunden 45 Minuten Pause (§ 4 ArbZG).", "Länger als 4,5 Stunden hintereinander darf nicht ohne Ruhepause gearbeitet werden; bei mehr als 6 bis 9 Stunden mindestens 45 Minuten, bei mehr als 9 Stunden 60 Minuten Pause (§ 4 ArbZG)."], "richtig": 1, "erklaerung": "Länger als 6 Stunden hintereinander darf nicht ohne Ruhepause gearbeitet werden; bei mehr als 6 bis 9 Stunden mindestens 30 Minuten, bei mehr als 9 Stunden 45 Minuten Pause (§ 4 ArbZG)."}, {"id": 43, "gesetz": "PBefG", "frage": "#0043 Welche Dokumente muss ein Fahrer immer mitführen?", "antworten": ["Nur den allgemeinen Führerschein (§ 48 Abs. 3 FeV); Genehmigungsurkunde und Zulassungsbescheinigung Teil I verbleiben im Betrieb (§ 17 Abs. 4 PBefG), Tarifvorschriften sind nur in Mietwagen mitzuführen (§ 10 BOKraft).", "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft).", "Personalausweis, Fahrzeugschein und die Fachkundebescheinigung des Unternehmers (§ 48 Abs. 3 FeV), ein Fahrtenbuch der letzten drei Monate (§ 17 Abs. 4 PBefG) sowie den Nachweis über die letzte Hauptuntersuchung (§ 10 BOKraft)."], "richtig": 1, "erklaerung": "Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I, die Genehmigungsurkunde oder eine gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG) sowie die geltenden Tarifvorschriften (§ 10 BOKraft)."}, {"id": 44, "gesetz": "PBefG", "frage": "#0044 Wie oft muss eine Taxikonzession erneuert werden?", "antworten": ["Die Genehmigung muss jährlich erneuert werden; Neubewerber müssen sie in den ersten 2 Jahren sogar halbjährlich neu beantragen (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "Die Genehmigung gilt höchstens 5 Jahre (bei Neubewerbern 2 Jahre) und muss danach neu beantragt (wiedererteilt) werden (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "Die Genehmigung gilt höchstens 10 Jahre (bei Neubewerbern 5 Jahre) und verlängert sich danach automatisch, sofern kein Widerruf erfolgt ist (§ 16 Abs. 4, § 13 Abs. 5 PBefG)."], "richtig": 1, "erklaerung": "Die Genehmigung gilt höchstens 5 Jahre (bei Neubewerbern 2 Jahre) und muss danach neu beantragt (wiedererteilt) werden (§ 16 Abs. 4, § 13 Abs. 5 PBefG)."}, {"id": 45, "gesetz": "PBefG", "frage": "#0045 Was versteht man unter dem Pflichtfahrbereich?", "antworten": ["Das Gebiet, in dem Mietwagen Fahrgäste aufnehmen dürfen; nur innerhalb dieses Bereichs gilt für sie die Rückkehrpflicht (§ 47 Abs. 4, § 51 Abs. 1 PBefG).", "Das Gebiet, in dem der Taxifahrer Ortskunde nachweisen muss; Taxitarife und Beförderungspflicht gelten dort jedoch nicht (§ 47 Abs. 4, § 51 Abs. 1 PBefG).", "Das Gebiet, in dem die festgesetzten Taxitarife gelten; nur innerhalb dieses Bereichs besteht die Beförderungspflicht (§ 47 Abs. 4, § 51 Abs. 1 PBefG)."], "richtig": 2, "erklaerung": "Das Gebiet, in dem die festgesetzten Taxitarife gelten; nur innerhalb dieses Bereichs besteht die Beförderungspflicht (§ 47 Abs. 4, § 51 Abs. 1 PBefG)."}, {"id": 51, "gesetz": "PBZugV", "frage": "#0051 Was regelt die Berufszugangsverordnung für den Straßenpersonenverkehr (PBZugV)?", "antworten": ["Die PBZugV konkretisiert die Berufszugangsvoraussetzungen Zuverlässigkeit, finanzielle Leistungsfähigkeit und fachliche Eignung für die Genehmigung nach dem PBefG (§§ 1–3 PBZugV i. V. m. § 13 Abs. 1 PBefG).", "Die PBZugV regelt die Voraussetzungen der Fahrerlaubnis zur Fahrgastbeförderung, insbesondere Mindestalter, Ortskunde und ärztliche Eignung der angestellten Fahrer (§§ 1–3 PBZugV i. V. m. § 13 Abs. 1 PBefG).", "Die PBZugV regelt die technischen Anforderungen an Taxen und Mietwagen, insbesondere Anstrich, Taxameter und Alarmanlage, als Voraussetzung für die Genehmigung nach dem PBefG (§§ 1–3 PBZugV i. V. m. § 13 Abs. 1 PBefG)."], "richtig": 0, "erklaerung": "Die PBZugV konkretisiert die Berufszugangsvoraussetzungen Zuverlässigkeit, finanzielle Leistungsfähigkeit und fachliche Eignung für die Genehmigung nach dem PBefG (§§ 1–3 PBZugV i. V. m. § 13 Abs. 1 PBefG)."}, {"id": 52, "gesetz": "PBZugV", "frage": "#0052 Welche drei Voraussetzungen müssen Unternehmer für eine Genehmigung erfüllen?", "antworten": ["Persönliche Zuverlässigkeit (§ 1), ausreichende Ortskunde (§ 2) und ein Mindestfuhrpark von zwei Fahrzeugen (§ 3 PBZugV).", "Fahrerlaubnis zur Fahrgastbeförderung (§ 1), Betriebshaftpflichtversicherung (§ 2) und Meistertitel (§ 3 PBZugV).", "Persönliche Zuverlässigkeit (§ 1), finanzielle Leistungsfähigkeit (§ 2) und fachliche Eignung (§ 3 PBZugV)."], "richtig": 2, "erklaerung": "Persönliche Zuverlässigkeit (§ 1), finanzielle Leistungsfähigkeit (§ 2) und fachliche Eignung (§ 3 PBZugV)."}, {"id": 53, "gesetz": "PBZugV", "frage": "#0053 Für welche Arten des Straßenpersonenverkehrs gilt die PBZugV?", "antworten": ["Nur für den Linienverkehr mit Kraftomnibussen; der Taxen- und Mietwagenverkehr ist abschließend in der BOKraft geregelt, die PBZugV enthält dafür keine Sonderregeln (§ 1 PBZugV).", "Für den Taxen- und Mietwagenverkehr sowie den Verkehr mit Kraftomnibussen; für Taxen/Mietwagen gelten Sonderregeln, z. B. § 2 Abs. 1 Nr. 2, § 3 Abs. 2 und § 7 Abs. 1 Satz 2 PBZugV.", "Für den Güterkraftverkehr sowie den Taxen- und Mietwagenverkehr; für Kraftomnibusse gelten Sonderregeln, z. B. § 2 Abs. 1 Nr. 2, § 3 Abs. 2 und § 7 Abs. 1 Satz 2 PBZugV."], "richtig": 1, "erklaerung": "Für den Taxen- und Mietwagenverkehr sowie den Verkehr mit Kraftomnibussen; für Taxen/Mietwagen gelten Sonderregeln, z. B. § 2 Abs. 1 Nr. 2, § 3 Abs. 2 und § 7 Abs. 1 Satz 2 PBZugV."}, {"id": 54, "gesetz": "PBZugV", "frage": "#0054 Wann gilt ein Unternehmer als zuverlässig im Sinne der PBZugV?", "antworten": ["Wenn er mindestens fünf Jahre Berufserfahrung im Taxi- oder Mietwagengewerbe nachweist und weder im Fahreignungsregister noch im Bundeszentralregister irgendeine Eintragung hat (§ 1 Abs. 1 PBZugV).", "Wenn er Mitglied der örtlichen Taxi-Innung oder Taxizentrale ist und die IHK auf Grundlage der Empfehlung zweier Mitbewerber seine Vertrauenswürdigkeit bestätigt hat (§ 1 Abs. 1 PBZugV).", "Wenn keine hinreichenden Anhaltspunkte dafür vorliegen, dass bei der Führung des Unternehmens die für den Straßenpersonenverkehr geltenden Vorschriften missachtet oder die Allgemeinheit geschädigt oder gefährdet wird (§ 1 Abs. 1 PBZugV)."], "richtig": 2, "erklaerung": "Wenn keine hinreichenden Anhaltspunkte dafür vorliegen, dass bei der Führung des Unternehmens die für den Straßenpersonenverkehr geltenden Vorschriften missachtet oder die Allgemeinheit geschädigt oder gefährdet wird (§ 1 Abs. 1 PBZugV)."}, {"id": 55, "gesetz": "PBZugV", "frage": "#0055 Welche Verstöße können zur Unzuverlässigkeit führen?", "antworten": ["Ausschließlich Verurteilungen zu Freiheitsstrafen von mehr als drei Jahren; Verstöße gegen Arbeits-, Sozial- oder Steuerrecht bleiben für die Zuverlässigkeit unberücksichtigt, solange sie nur Ordnungswidrigkeiten sind (§ 1 Abs. 1 Satz 2 PBZugV).", "Rechtskräftige Verurteilungen wegen schwerer Straftaten sowie schwere Verstöße gegen PBefG, Arbeits- und Sozialrecht, Verkehrsvorschriften, Abgabenpflichten (z. B. Steuerhinterziehung), Pflichtversicherungs- oder Umweltrecht (§ 1 Abs. 1 Satz 2 PBZugV).", "Nur Verkehrsverstöße mit mindestens 8 Punkten im Fahreignungsregister; Steuerhinterziehung oder Verstöße gegen Pflichtversicherungs- und Umweltrecht sind für die Zuverlässigkeit unerheblich (§ 1 Abs. 1 Satz 2 PBZugV)."], "richtig": 1, "erklaerung": "Rechtskräftige Verurteilungen wegen schwerer Straftaten sowie schwere Verstöße gegen PBefG, Arbeits- und Sozialrecht, Verkehrsvorschriften, Abgabenpflichten (z. B. Steuerhinterziehung), Pflichtversicherungs- oder Umweltrecht (§ 1 Abs. 1 Satz 2 PBZugV)."}, {"id": 56, "gesetz": "PBZugV", "frage": "#0056 Wie wird die persönliche Zuverlässigkeit überprüft?", "antworten": ["Durch ein ärztliches Gutachten, eine medizinisch-psychologische Untersuchung (MPU) und eine SCHUFA-Auskunft über private Schulden und Kredite des Bewerbers (§ 1 Abs. 3 PBZugV).", "Durch eine persönliche Befragung bei der IHK, ein Leumundszeugnis des Bürgermeisters und eine Selbstauskunft über Vorstrafen ohne weitere Belege (§ 1 Abs. 3 PBZugV).", "Durch Führungszeugnis (zur Vorlage bei einer Behörde), Auskunft aus dem Gewerbezentralregister, Bescheinigungen in Steuersachen und Unbedenklichkeitsbescheinigungen anderer Stellen (§ 1 Abs. 3 PBZugV)."], "richtig": 2, "erklaerung": "Durch Führungszeugnis (zur Vorlage bei einer Behörde), Auskunft aus dem Gewerbezentralregister, Bescheinigungen in Steuersachen und Unbedenklichkeitsbescheinigungen anderer Stellen (§ 1 Abs. 3 PBZugV)."}, {"id": 57, "gesetz": "PBZugV", "frage": "#0057 Warum ist finanzielle Leistungsfähigkeit eine Voraussetzung für die Genehmigung?", "antworten": ["Damit sichergestellt ist, dass das Unternehmen seine laufenden Kosten decken kann (§ 2 Abs. 1 PBZugV).", "Damit das Unternehmen Unfallopfer auch ohne Kfz-Haftpflichtversicherung entschädigen kann (§ 2 Abs. 1 PBZugV).", "Damit die Genehmigungsbehörde Gebühren für die laufende Aufsicht erheben kann (§ 2 Abs. 1 PBZugV)."], "richtig": 0, "erklaerung": "Damit sichergestellt ist, dass das Unternehmen seine laufenden Kosten decken kann (§ 2 Abs. 1 PBZugV)."}, {"id": 58, "gesetz": "PBZugV", "frage": "#0058 Welche finanziellen Nachweise müssen vorgelegt werden?", "antworten": ["Steuerbescheinigungen, Unbedenklichkeitsbescheinigungen und Eigenkapitalnachweise (§ 2 Abs. 2 PBZugV).", "Einkommensteuerbescheide der letzten fünf Jahre und eine SCHUFA-Auskunft (§ 2 Abs. 2 PBZugV).", "Eine Bankbürgschaft über 50.000 € und ein aktueller Kontoauszug (§ 2 Abs. 2 PBZugV)."], "richtig": 0, "erklaerung": "Steuerbescheinigungen, Unbedenklichkeitsbescheinigungen und Eigenkapitalnachweise (§ 2 Abs. 2 PBZugV)."}, {"id": 59, "gesetz": "PBZugV", "frage": "#0059 Welche finanzielle Mindestanforderung gilt für den Taxen- und Mietwagenverkehr?", "antworten": ["Mindestens die Hälfte der in der Verordnung (EG) Nr. 1071/2009 festgelegten Beträge pro Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "Mindestens ein Viertel der in der Verordnung (EG) Nr. 1071/2009 festgelegten Beträge pro Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV).", "Ein pauschales Eigenkapital von 50.000 €, unabhängig von der Zahl der eingesetzten Fahrzeuge (§ 2 Abs. 1 Nr. 2 PBZugV)."], "richtig": 1, "erklaerung": "Mindestens ein Viertel der in der Verordnung (EG) Nr. 1071/2009 festgelegten Beträge pro Fahrzeug (§ 2 Abs. 1 Nr. 2 PBZugV)."}, {"id": 60, "gesetz": "PBZugV", "frage": "#0060 Wie kann die fachliche Eignung nachgewiesen werden?", "antworten": ["Durch die Meisterprüfung vor der Handwerkskammer (§ 4), ein Hochschulstudium beliebiger Fachrichtung (§ 6) oder eine mindestens zehnjährige Tätigkeit als Fahrer im Personenverkehr (§ 7 PBZugV).", "Durch eine Ortskundeprüfung bei der Genehmigungsbehörde (§ 4), einen Führerschein zur Fahrgastbeförderung (§ 6) oder eine mindestens einjährige Tätigkeit als angestellter Taxifahrer (§ 7 PBZugV).", "Durch die Fachkundeprüfung vor der IHK (§ 4), eine als gleichwertig anerkannte Abschlussprüfung (§ 6) oder eine mindestens dreijährige leitende Tätigkeit in einem Taxi- oder Mietwagenunternehmen (§ 7 PBZugV)."], "richtig": 2, "erklaerung": "Durch die Fachkundeprüfung vor der IHK (§ 4), eine als gleichwertig anerkannte Abschlussprüfung (§ 6) oder eine mindestens dreijährige leitende Tätigkeit in einem Taxi- oder Mietwagenunternehmen (§ 7 PBZugV)."}, {"id": 61, "gesetz": "PBZugV", "frage": "#0061 Wie ist die Fachkundeprüfung aufgebaut?", "antworten": ["Sie besteht ausschließlich aus einer praktischen Fahrprüfung im Stadtverkehr und einer Ortskundeprüfung (§ 4 PBZugV).", "Sie besteht aus schriftlichen Prüfungen (Multiple-Choice & Fallstudien) und ggf. einer mündlichen Prüfung (§ 4 PBZugV).", "Sie besteht nur aus einer mündlichen Prüfung vor der Genehmigungsbehörde; schriftliche Teile entfallen (§ 4 PBZugV)."], "richtig": 1, "erklaerung": "Sie besteht aus schriftlichen Prüfungen (Multiple-Choice & Fallstudien) und ggf. einer mündlichen Prüfung (§ 4 PBZugV)."}, {"id": 62, "gesetz": "PBZugV", "frage": "#0062 Wie viele Punkte sind erforderlich, um die Prüfung zu bestehen?", "antworten": ["Mindestens 60 % der Gesamtpunkte, wobei jede Teilprüfung mindestens 50 % erreichen muss (§ 4 PBZugV).", "Mindestens 75 % der Gesamtpunkte, wobei jede Teilprüfung mindestens 60 % erreichen muss (§ 4 PBZugV).", "Mindestens 50 % der Gesamtpunkte, wobei jede Teilprüfung mindestens 30 % erreichen muss (§ 4 PBZugV)."], "richtig": 0, "erklaerung": "Mindestens 60 % der Gesamtpunkte, wobei jede Teilprüfung mindestens 50 % erreichen muss (§ 4 PBZugV)."}, {"id": 63, "gesetz": "PBZugV", "frage": "#0063 Welche Themen umfasst die Fachkundeprüfung?", "antworten": ["Nur Personenbeförderungs- und Straßenverkehrsrecht; kaufmännische und finanzielle Führung, Arbeits-, Sozialversicherungs- und Steuerrecht sind seit der PBefG-Novelle 2021 kein Prüfungsstoff mehr (§ 3 Abs. 2 i. V. m. Anlage 3 PBZugV).", "Ortskunde, Erste Hilfe, Kfz-Reparatur, Fremdsprachen, Kundenkommunikation sowie Stadtgeografie und Sehenswürdigkeiten des Pflichtfahrbereichs; Steuer- und Sozialversicherungsrecht sind nicht Gegenstand der Prüfung (§ 3 Abs. 2 i. V. m. Anlage 3 PBZugV).", "Personenbeförderungs-, Straßenverkehrs-, Arbeits-, Sozialversicherungs-, Beförderungsvertrags- und Steuerrecht, kaufmännische und finanzielle Führung, technischer Betrieb sowie Verkehrssicherheit und Umweltschutz (§ 3 Abs. 2 i. V. m. Anlage 3 PBZugV)."], "richtig": 2, "erklaerung": "Personenbeförderungs-, Straßenverkehrs-, Arbeits-, Sozialversicherungs-, Beförderungsvertrags- und Steuerrecht, kaufmännische und finanzielle Führung, technischer Betrieb sowie Verkehrssicherheit und Umweltschutz (§ 3 Abs. 2 i. V. m. Anlage 3 PBZugV)."}, {"id": 64, "gesetz": "PBZugV", "frage": "#0064 Wer führt die Fachkundeprüfung durch?", "antworten": ["Die örtlichen Genehmigungsbehörden (§ 5 PBZugV).", "Die Industrie- und Handelskammern (IHK) (§ 5 PBZugV).", "Die Handwerkskammern (HWK) (§ 5 PBZugV)."], "richtig": 1, "erklaerung": "Die Industrie- und Handelskammern (IHK) (§ 5 PBZugV)."}, {"id": 65, "gesetz": "PBZugV", "frage": "#0065 Welche alternativen Nachweise gibt es zur Fachkundeprüfung?", "antworten": ["Jede kaufmännische Berufsausbildung (§ 6 PBZugV) oder eine leitende Tätigkeit von mindestens 10 Jahren, im Taxen- und Mietwagenverkehr mindestens 8 Jahren, die nicht länger als 5 Jahre zurückliegt (§ 7 PBZugV).", "Ein Führerschein zur Fahrgastbeförderung (§ 6 PBZugV) oder eine Tätigkeit als angestellter Fahrer von mindestens 2 Jahren, im Taxen- und Mietwagenverkehr 1 Jahr, die beliebig lange zurückliegen darf (§ 7 PBZugV).", "Als gleichwertig anerkannte Abschlussprüfungen (§ 6 PBZugV) oder eine leitende Tätigkeit von mindestens 5 Jahren, im Taxen- und Mietwagenverkehr mindestens 3 Jahren, die nicht länger als 2 Jahre zurückliegt (§ 7 PBZugV)."], "richtig": 2, "erklaerung": "Als gleichwertig anerkannte Abschlussprüfungen (§ 6 PBZugV) oder eine leitende Tätigkeit von mindestens 5 Jahren, im Taxen- und Mietwagenverkehr mindestens 3 Jahren, die nicht länger als 2 Jahre zurückliegt (§ 7 PBZugV)."}, {"id": 66, "gesetz": "PBZugV", "frage": "#0066 Wie lange darf eine leitende Tätigkeit zurückliegen, um anerkannt zu werden?", "antworten": ["Sie kann beliebig lange zurückliegen; eine zeitliche Grenze besteht nicht (§ 7 PBZugV).", "Sie muss in den letzten zwei Jahren vor Antragstellung ausgeübt worden sein (§ 7 PBZugV).", "Sie darf höchstens sechs Monate vor Antragstellung beendet worden sein (§ 7 PBZugV)."], "richtig": 1, "erklaerung": "Sie muss in den letzten zwei Jahren vor Antragstellung ausgeübt worden sein (§ 7 PBZugV)."}, {"id": 67, "gesetz": "PBZugV", "frage": "#0067 Wie oft werden Unternehmen auf Einhaltung der Berufszugangsvoraussetzungen überprüft?", "antworten": ["Grundsätzlich regelmäßig, mindestens alle 5 Jahre; im Taxen- und Mietwagenverkehr jedoch nur, wenn Zweifel am Fortbestehen der Voraussetzungen bestehen. Ein Verfahren auf Erneuerung der Genehmigung ersetzt die Kontrolle (§ 9 Abs. 1, 4 PBZugV).", "Grundsätzlich jährlich; im Taxen- und Mietwagenverkehr zusätzlich unangekündigt durch die IHK. Ein Verfahren auf Erneuerung der Genehmigung ersetzt die Kontrolle nicht, sondern findet gesondert statt (§ 9 Abs. 1, 4 PBZugV).", "Grundsätzlich alle 10 Jahre; im Taxen- und Mietwagenverkehr jedoch ausnahmslos alle 2 Jahre, auch ohne Zweifel am Fortbestehen der Voraussetzungen. Eine Erneuerung der Genehmigung ersetzt die Kontrolle nicht (§ 9 Abs. 1, 4 PBZugV)."], "richtig": 0, "erklaerung": "Grundsätzlich regelmäßig, mindestens alle 5 Jahre; im Taxen- und Mietwagenverkehr jedoch nur, wenn Zweifel am Fortbestehen der Voraussetzungen bestehen. Ein Verfahren auf Erneuerung der Genehmigung ersetzt die Kontrolle (§ 9 Abs. 1, 4 PBZugV)."}, {"id": 68, "gesetz": "PBZugV", "frage": "#0068 Was passiert, wenn die finanzielle Leistungsfähigkeit nicht mehr gegeben ist?", "antworten": ["Die Genehmigung erlischt sofort kraft Gesetzes; eine Nachfrist ist ausgeschlossen (§ 9 PBZugV).", "Eine Frist von mindestens 24 Monaten zur Nachbesserung muss gewährt werden (§ 9 PBZugV).", "Eine Frist von maximal 6 Monaten zur Nachbesserung kann eingeräumt werden (§ 9 PBZugV)."], "richtig": 2, "erklaerung": "Eine Frist von maximal 6 Monaten zur Nachbesserung kann eingeräumt werden (§ 9 PBZugV)."}, {"id": 69, "gesetz": "PBZugV", "frage": "#0069 Welche Konsequenzen drohen bei Verstößen gegen die PBZugV?", "antworten": ["Entfallen die Berufszugangsvoraussetzungen, ruht die Genehmigung lediglich bis zum nächsten Erneuerungsantrag (§ 25 Abs. 1 PBefG); Verstöße gegen die PBZugV sind stets Straftaten mit Freiheitsstrafe bis zu zwei Jahren (§ 61 PBefG).", "Entfallen die Berufszugangsvoraussetzungen, entscheidet die IHK über eine Abmahnung (§ 25 Abs. 1 PBefG); Geldbußen sind ausgeschlossen, da weder PBefG noch PBZugV Sanktionen für solche Verstöße vorsehen (§ 61 PBefG).", "Entfallen die Berufszugangsvoraussetzungen, ist die Genehmigung zu widerrufen (§ 25 Abs. 1 PBefG); Verstöße gegen das PBefG und seine Verordnungen können mit Geldbuße geahndet werden (§ 61 PBefG)."], "richtig": 2, "erklaerung": "Entfallen die Berufszugangsvoraussetzungen, ist die Genehmigung zu widerrufen (§ 25 Abs. 1 PBefG); Verstöße gegen das PBefG und seine Verordnungen können mit Geldbuße geahndet werden (§ 61 PBefG)."}, {"id": 70, "gesetz": "PBZugV", "frage": "#0070 Welche Anforderungen gelten für Fahrzeuge im Taxen- und Mietwagenverkehr?", "antworten": ["Sie müssen verkehrssicher sein und u. a. eine Trennscheibe zwischen Fahrer und Fahrgast haben, Taxen zudem schwarzen Anstrich und Funkgerät, Mietwagen ein beleuchtetes Mietwagenschild auf dem Dach (§§ 25–30 BOKraft).", "Sie müssen verkehrssicher sein und u. a. vier Türen rechts und eine Videokamera haben, Taxen zudem verkehrsgelben Anstrich, Dachschild und Wegstreckenzähler, Mietwagen einen geeichten Fahrpreisanzeiger (§§ 25–30 BOKraft).", "Sie müssen verkehrssicher sein und u. a. zwei Türen rechts und eine Alarmanlage haben, Taxen zudem hell-elfenbeinfarbenen Anstrich, Taxischild, Fahrpreisanzeiger und Navigationsgerät, Mietwagen einen Wegstreckenzähler (§§ 25–30 BOKraft)."], "richtig": 2, "erklaerung": "Sie müssen verkehrssicher sein und u. a. zwei Türen rechts und eine Alarmanlage haben, Taxen zudem hell-elfenbeinfarbenen Anstrich, Taxischild, Fahrpreisanzeiger und Navigationsgerät, Mietwagen einen Wegstreckenzähler (§§ 25–30 BOKraft)."}, {"id": 71, "gesetz": "PBZugV", "frage": "#0071 Welche Sozialvorschriften gelten für Taxi- und Mietwagenunternehmer?", "antworten": ["Insbesondere die EU-Lenk- und Ruhezeitenverordnung mit digitalem Fahrtenschreiber und das Berufskraftfahrerqualifikationsgesetz (VO (EG) Nr. 561/2006, BKrFQG; vgl. Anlage 3 Nr. 1.3, 1.4 PBZugV).", "Insbesondere das Arbeitszeitgesetz (Arbeitszeit, Ruhepausen, Ruhezeiten), das Mindestlohngesetz und das Sozialversicherungsrecht (ArbZG, MiLoG, SGB IV; vgl. Anlage 3 Nr. 1.3, 1.4 PBZugV).", "Insbesondere Bundesurlaubsgesetz und Tarifvertragsgesetz; Mindestlohn und Arbeitszeitgesetz gelten im Taxigewerbe wegen der Wartezeiten nicht (BUrlG, TVG; vgl. Anlage 3 Nr. 1.3, 1.4 PBZugV)."], "richtig": 1, "erklaerung": "Insbesondere das Arbeitszeitgesetz (Arbeitszeit, Ruhepausen, Ruhezeiten), das Mindestlohngesetz und das Sozialversicherungsrecht (ArbZG, MiLoG, SGB IV; vgl. Anlage 3 Nr. 1.3, 1.4 PBZugV)."}, {"id": 72, "gesetz": "PBZugV", "frage": "#0072 Welche Strafen drohen, wenn ein Taxi- oder Mietwagenbetrieb ohne Genehmigung arbeitet?", "antworten": ["Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); die PBZugV regelt dies nicht.", "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 2.500 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); zuständig ist die IHK.", "Es liegt eine Straftat vor, die nach § 9 PBZugV mit Freiheitsstrafe bis zu einem Jahr oder Geldstrafe geahndet wird; das PBefG selbst regelt dies nicht."], "richtig": 0, "erklaerung": "Es liegt eine Ordnungswidrigkeit vor, die mit einer Geldbuße bis zu 20.000 € geahndet werden kann (§ 61 Abs. 1 Nr. 1, Abs. 2 PBefG); die PBZugV regelt dies nicht."}, {"id": 73, "gesetz": "PBZugV", "frage": "#0073 Welche Dokumente muss ein Taxiunternehmer mitführen?", "antworten": ["Genehmigungsurkunde oder gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG), Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I sowie die geltenden Tarifvorschriften (§ 10 BOKraft).", "Die Gewerbeanmeldung im Original (§ 14 GewO), die Fachkundebescheinigung der IHK (§ 48 Abs. 3 FeV), das Fahrtenbuch sowie die Kfz-Steuerbescheide aller Fahrzeuge des Betriebs (§ 10 BOKraft).", "Nur die Zulassungsbescheinigung Teil II und den Versicherungsschein (§ 17 Abs. 4 PBefG); Führerscheine und Tarifvorschriften müssen nicht mitgeführt werden, da sie elektronisch abrufbar sind (§ 10 BOKraft)."], "richtig": 0, "erklaerung": "Genehmigungsurkunde oder gekürzte amtliche Ausfertigung (§ 17 Abs. 4 PBefG), Führerschein und Führerschein zur Fahrgastbeförderung (§ 48 Abs. 3 FeV), Zulassungsbescheinigung Teil I sowie die geltenden Tarifvorschriften (§ 10 BOKraft)."}, {"id": 74, "gesetz": "PBZugV", "frage": "#0074 Wann kann eine Genehmigung für den Taxi- oder Mietwagenverkehr widerrufen werden?", "antworten": ["Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG).", "Die Genehmigung kann nur auf Antrag der IHK widerrufen werden, wenn der Unternehmer die Fachkundeprüfung nicht innerhalb von zwei Jahren wiederholt; Verstöße gegen Steuer- oder Sozialrecht sind kein Widerrufsgrund (§ 25 PBefG).", "Die Genehmigung kann nur widerrufen werden, wenn der Betrieb länger als drei Jahre ruht; entfallen Zuverlässigkeit oder finanzielle Leistungsfähigkeit, bleibt sie bis zum Ablauf ihrer Geltungsdauer bestehen (§ 25 PBefG)."], "richtig": 0, "erklaerung": "Die Genehmigung ist zu widerrufen, wenn Sicherheit/Leistungsfähigkeit, Zuverlässigkeit oder fachliche Eignung entfallen; sie kann widerrufen werden bei wiederholten oder schweren Verstößen gegen arbeits-, sozial- oder steuerrechtliche Pflichten (§ 25 PBefG)."}, {"id": 75, "gesetz": "PBZugV", "frage": "#0075 Welche Vorteile hat eine Fachkundeprüfung für Unternehmer?", "antworten": ["Fahrer lernen die gesetzlichen Pflichten und wirtschaftlichen Grundlagen des Betriebs.", "Unternehmer lernen die gesetzlichen Pflichten und wirtschaftlichen Grundlagen des Betriebs.", "Sie stellt sicher, dass nur zuverlässige, finanziell leistungsfähige und fachlich geeignete Unternehmer am gewerblichen Personenverkehr teilnehmen (§1 PBZugV)."], "richtig": 1, "erklaerung": "Unternehmer lernen die gesetzlichen Pflichten und wirtschaftlichen Grundlagen des Betriebs."}, {"id": 76, "gesetz": "PBZugV", "frage": "#0076 Welche Bedeutung hat die PBZugV für die Qualität im Personenverkehr?", "antworten": ["Sie stellt sicher, dass nur qualifizierte und zuverlässige Unternehmer tätig sind.", "Sie stellt sicher, dass nur qualifizierte und zuverlässige Fahrer tätig sind.", "Die Industrie- und Handelskammern (IHK) (§5 PBZugV)."], "richtig": 0, "erklaerung": "Sie stellt sicher, dass nur qualifizierte und zuverlässige Unternehmer tätig sind."}, {"id": 77, "gesetz": "PBZugV", "frage": "#0077 Welche Behörde ist für die Kontrolle der Berufszugangsvoraussetzungen zuständig?", "antworten": ["Die örtliche Genehmigungsbehörde (§ 9 PBZugV).", "Die örtlich zuständige IHK (§ 9 PBZugV).", "Das Kraftfahrt-Bundesamt (§ 9 PBZugV)."], "richtig": 0, "erklaerung": "Die örtliche Genehmigungsbehörde (§ 9 PBZugV)."}, {"id": 78, "gesetz": "PBZugV", "frage": "#0078 Welche Dokumente müssen Unternehmen im Straßenpersonenverkehr bei einer Kontrolle vorlegen können?", "antworten": ["Genehmigungsurkunde, Nachweis der finanziellen Leistungsfähigkeit, Nachweise über die fachliche Eignung sowie Steuer- und Sozialversicherungsnachweise (§ 9 PBZugV).", "Fahrtenbuch, Tankquittungen der letzten zwölf Monate, Werkstattrechnungen sowie die Personalausweise aller angestellten Fahrer (§ 9 PBZugV).", "Nur die Gewerbeanmeldung und den Fahrzeugschein; Nachweise über Eignung und Finanzen verbleiben ausschließlich bei der IHK (§ 9 PBZugV)."], "richtig": 0, "erklaerung": "Genehmigungsurkunde, Nachweis der finanziellen Leistungsfähigkeit, Nachweise über die fachliche Eignung sowie Steuer- und Sozialversicherungsnachweise (§ 9 PBZugV)."}, {"id": 79, "gesetz": "PBZugV", "frage": "#0079 Wie lange ist eine Genehmigung für den Taxen- oder Mietwagenverkehr gültig?", "antworten": ["Höchstens 5 Jahre, bei Neubewerbern im Taxenverkehr 2 Jahre; danach ist die Wiedererteilung zu beantragen (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "Unbefristet, bei Neubewerbern im Taxenverkehr gilt zunächst 1 Jahr Probezeit; danach unbegrenzt (§ 16 Abs. 4, § 13 Abs. 5 PBefG).", "Höchstens 10 Jahre, bei Neubewerbern im Taxenverkehr 5 Jahre; danach verlängert sie sich automatisch (§ 16 Abs. 4, § 13 Abs. 5 PBefG)."], "richtig": 0, "erklaerung": "Höchstens 5 Jahre, bei Neubewerbern im Taxenverkehr 2 Jahre; danach ist die Wiedererteilung zu beantragen (§ 16 Abs. 4, § 13 Abs. 5 PBefG)."}, {"id": 80, "gesetz": "PBZugV", "frage": "#0080 Welche Rolle spielt die PBZugV für die Sicherheit im Straßenpersonenverkehr?", "antworten": ["Sie begrenzt die Zahl der Taxen je Gemeinde, um ruinösen Wettbewerb und dadurch entstehende Sicherheitsmängel zu vermeiden (§§ 1–3 PBZugV).", "Sie stellt sicher, dass nur zuverlässige, finanziell leistungsfähige und fachlich geeignete Unternehmer am gewerblichen Personenverkehr teilnehmen (§§ 1–3 PBZugV).", "Sie schreibt die technische Ausstattung der Fahrzeuge wie Alarmanlage und Taxameter vor und regelt die Hauptuntersuchung (§§ 1–3 PBZugV)."], "richtig": 1, "erklaerung": "Sie stellt sicher, dass nur zuverlässige, finanziell leistungsfähige und fachlich geeignete Unternehmer am gewerblichen Personenverkehr teilnehmen (§§ 1–3 PBZugV)."}, {"id": 101, "gesetz": "BOKraft", "frage": "#0101 Was ist die BOKraft und was regelt sie?", "antworten": ["Die BOKraft (Bundesordnung für Kraftfahrer) legt die Ausbildungs- und Prüfungsvorschriften für Berufskraftfahrer im Güter- und Personenverkehr fest (§ 1 BOKraft).", "Die BOKraft (Berufsordnung für Kraftfahrunternehmer) regelt Berufszugang, Fachkundeprüfung und finanzielle Leistungsfähigkeit von Taxi- und Mietwagenunternehmern (§ 1 BOKraft).", "Die BOKraft (Verordnung über den Betrieb von Kraftfahrunternehmen im Personenverkehr) legt Sicherheits- und Betriebsvorschriften für Taxen, Mietwagen, Omnibusse und Linienverkehr fest (§ 1 BOKraft)."], "richtig": 2, "erklaerung": "Die BOKraft (Verordnung über den Betrieb von Kraftfahrunternehmen im Personenverkehr) legt Sicherheits- und Betriebsvorschriften für Taxen, Mietwagen, Omnibusse und Linienverkehr fest (§ 1 BOKraft)."}, {"id": 102, "gesetz": "BOKraft", "frage": "#0102 Welche Unternehmen unterliegen der BOKraft?", "antworten": ["Alle Halter von Kraftfahrzeugen, die Personen befördern, auch unentgeltlich und im privaten Rahmen, etwa bei Fahrgemeinschaften (§ 1 Abs. 1 BOKraft).", "Nur Unternehmen mit mehr als fünf Fahrzeugen im Linien- oder Taxenverkehr; Mietwagenunternehmen und Kleinbetriebe sind von ihr ausgenommen (§ 1 Abs. 1 BOKraft).", "Alle Unternehmen, die Fahrgäste mit Kraftfahrzeugen oder Obussen befördern, soweit sie dem PBefG unterliegen, also entgeltlich oder geschäftsmäßig befördern (§ 1 Abs. 1 BOKraft)."], "richtig": 2, "erklaerung": "Alle Unternehmen, die Fahrgäste mit Kraftfahrzeugen oder Obussen befördern, soweit sie dem PBefG unterliegen, also entgeltlich oder geschäftsmäßig befördern (§ 1 Abs. 1 BOKraft)."}, {"id": 103, "gesetz": "BOKraft", "frage": "#0103 Was ist die wichtigste Grundregel der BOKraft?", "antworten": ["Fahrzeuge und Betrieb müssen so geführt werden, dass die Sicherheit und Ordnung gewährleistet sind (§ 2 BOKraft).", "Fahrzeuge und Betrieb müssen so geführt werden, dass ein möglichst hoher Gewinn erzielt wird (§ 2 BOKraft).", "Fahrzeuge dürfen ausschließlich vom Unternehmer selbst oder seinen Familienangehörigen geführt werden (§ 2 BOKraft)."], "richtig": 0, "erklaerung": "Fahrzeuge und Betrieb müssen so geführt werden, dass die Sicherheit und Ordnung gewährleistet sind (§ 2 BOKraft)."}, {"id": 104, "gesetz": "BOKraft", "frage": "#0104 Welche Pflichten hat ein Unternehmer im Taxen- und Mietwagenverkehr?", "antworten": ["Er muss lediglich die Genehmigungsurkunde aufbewahren; für den Zustand der Fahrzeuge und die Einhaltung der BOKraft ist allein der Fahrer verantwortlich (§ 3 Abs. 1 BOKraft).", "Er muss jedes Fahrzeug wöchentlich bei einer anerkannten Prüforganisation untersuchen lassen und die Berichte der IHK vorlegen (§ 3 Abs. 1 BOKraft).", "Er muss sicherstellen, dass alle Vorschriften der BOKraft eingehalten werden und die Fahrzeuge in ordnungsgemäßem Zustand sind (§ 3 Abs. 1 BOKraft)."], "richtig": 2, "erklaerung": "Er muss sicherstellen, dass alle Vorschriften der BOKraft eingehalten werden und die Fahrzeuge in ordnungsgemäßem Zustand sind (§ 3 Abs. 1 BOKraft)."}, {"id": 105, "gesetz": "BOKraft", "frage": "#0105 Wann ist ein Betriebsleiter erforderlich?", "antworten": ["Die Bestellung ist für jedes Taxi- und Mietwagenunternehmen ab dem ersten Fahrzeug zwingend vorgeschrieben; der Betriebsleiter muss selbst die Fachkundeprüfung bestanden haben (§ 4 Abs. 1 BOKraft).", "Die Bestellung ist grundsätzlich freiwillig; die Genehmigungsbehörde kann sie anordnen und soll dies insbesondere bei Unternehmen mit regelmäßig mehr als zehn Fahrzeugen tun (§ 4 Abs. 1 BOKraft).", "Die Bestellung ist ausschließlich freiwillig; die Genehmigungsbehörde kann sie auch bei Unternehmen mit mehr als hundert Fahrzeugen nicht anordnen (§ 4 Abs. 1 BOKraft)."], "richtig": 1, "erklaerung": "Die Bestellung ist grundsätzlich freiwillig; die Genehmigungsbehörde kann sie anordnen und soll dies insbesondere bei Unternehmen mit regelmäßig mehr als zehn Fahrzeugen tun (§ 4 Abs. 1 BOKraft)."}, {"id": 106, "gesetz": "BOKraft", "frage": "#0106 Welche Meldepflichten hat ein Taxi- oder Mietwagenunternehmer?", "antworten": ["Er muss der IHK monatlich alle Fahrten und Einnahmen melden; Unfälle sind nur bei Sachschäden über 10.000 € anzuzeigen, Betriebsvorkommnisse mit öffentlichem Aufsehen sind nicht meldepflichtig (§ 6 BOKraft).", "Er muss der Genehmigungsbehörde unverzüglich Betriebsvorkommnisse mit öffentlichem Aufsehen sowie Unfälle mit Getöteten oder Schwerverletzten melden; Betriebsstörungen sind nur im Obus- und Linienverkehr meldepflichtig (§ 6 BOKraft).", "Er muss der Genehmigungsbehörde jede Betriebsstörung, jeden Fahrzeugausfall und jeden Bagatellunfall binnen 24 Stunden melden; Unfälle mit Getöteten oder Verletzten meldet allein die Polizei (§ 6 BOKraft)."], "richtig": 1, "erklaerung": "Er muss der Genehmigungsbehörde unver
