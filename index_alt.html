sverfahren (§ 17 DEÜV).", "Der Arbeitgeber muss eine Nummernvergabe beantragen (§ 5 Abs. 6 DEÜV)."], "richtig": 0, "erklaerung": "Sie muss unverzüglich storniert und korrigiert werden (§ 14 DEÜV)."}, {"id": 1118, "gesetz": "DEÜV", "frage": "#1118 Welche technische Vorschrift gilt für die elektronische Datenübertragung?", "antworten": ["Ordnungswidrigkeiten können mit Bußgeldern geahndet werden (§ 41 DEÜV).", "Sie muss im Standard XML-Format und UTF-8 codiert erfolgen (§ 16 DEÜV).", "Anmeldung, Abmeldung, Jahresmeldung und Entgeltmeldungen (§§ 6-12 DEÜV)."], "richtig": 1, "erklaerung": "Sie muss im Standard XML-Format und UTF-8 codiert erfolgen (§ 16 DEÜV)."}, {"id": 1119, "gesetz": "DEÜV", "frage": "#1119 Welche Rolle spielt die Rentenversicherung in der Datenverarbeitung?", "antworten": ["Ordnungswidrigkeiten können mit Bußgeldern geahndet werden (§ 41 DEÜV).", "Der Arbeitgeber muss eine Nummernvergabe beantragen (§ 5 Abs. 6 DEÜV).", "Sie speichert und verarbeitet die Meldedaten für die Sozialversicherungsträger (§ 36 DEÜV)."], "richtig": 2, "erklaerung": "Sie speichert und verarbeitet die Meldedaten für die Sozialversicherungsträger (§ 36 DEÜV)."}, {"id": 1120, "gesetz": "DEÜV", "frage": "#1120 Wie werden fehlerhafte Meldungen behandelt?", "antworten": ["Das Entgelt ist in vollen Beträgen zu melden, Beträge nach dem Komma werden kaufmännisch gerundet (§ 5 Abs. 4 DEÜV).", "Sie werden von der Annahmestelle zurückgewiesen und müssen vom Arbeitgeber korrigiert werden (§ 23 DEÜV).", "Sie werden von der Annahmestelle zurückgewiesen und müssen vom Arbeitnehmer korrigiert werden (§ 23 DEÜV)."], "richtig": 1, "erklaerung": "Sie werden von der Annahmestelle zurückgewiesen und müssen vom Arbeitgeber korrigiert werden (§ 23 DEÜV)."}, {"id": 1121, "gesetz": "DEÜV", "frage": "#1121 Welche Behörde überprüft die Einhaltung der DEÜV?", "antworten": ["Die Bundesagentur für Arbeit prüft eingehende Meldungen (§ 33 DEÜV); bei Betriebsprüfungen prüft das Hauptzollamt allein (§ 28p SGB IV).", "Das Finanzamt prüft eingehende Meldungen im Rahmen der Lohnsteuer-Außenprüfung (§ 33 DEÜV); bei Betriebsprüfungen prüft die Gewerbeaufsicht (§ 28p SGB IV).", "Die Einzugsstellen (Krankenkassen) prüfen eingehende Meldungen (§ 33 DEÜV); bei Betriebsprüfungen prüft die Rentenversicherung (§ 28p SGB IV)."], "richtig": 2, "erklaerung": "Die Einzugsstellen (Krankenkassen) prüfen eingehende Meldungen (§ 33 DEÜV); bei Betriebsprüfungen prüft die Rentenversicherung (§ 28p SGB IV)."}, {"id": 1122, "gesetz": "DEÜV", "frage": "#1122 Wie oft werden Unternehmen hinsichtlich ihrer Sozialversicherungsmeldungen geprüft?", "antworten": ["Jährlich im Rahmen der Betriebsprüfung durch die zuständige Krankenkasse (§ 28p Abs. 1 SGB IV).", "Mindestens alle vier Jahre im Rahmen der Betriebsprüfung der Rentenversicherung (§ 28p Abs. 1 SGB IV).", "Mindestens alle zehn Jahre im Rahmen der Außenprüfung durch das Finanzamt am Betriebssitz (§ 28p Abs. 1 SGB IV)."], "richtig": 1, "erklaerung": "Mindestens alle vier Jahre im Rahmen der Betriebsprüfung der Rentenversicherung (§ 28p Abs. 1 SGB IV)."}, {"id": 1123, "gesetz": "DEÜV", "frage": "#1123 Welche Strafen drohen bei fehlerhaften oder unterlassenen Meldungen?", "antworten": ["Melde-Ordnungswidrigkeiten können mit Geldbuße bis 25.000 € geahndet werden (§ 111 SGB IV).", "Melde-Ordnungswidrigkeiten können nur mit einem Verwarnungsgeld bis 55 € geahndet werden (§ 111 SGB IV).", "Unterlassene Meldungen sind stets Straftaten mit Freiheitsstrafe bis zu zwei Jahren (§ 111 SGB IV)."], "richtig": 0, "erklaerung": "Melde-Ordnungswidrigkeiten können mit Geldbuße bis 25.000 € geahndet werden (§ 111 SGB IV)."}, {"id": 1124, "gesetz": "DEÜV", "frage": "#1124 Wann kann eine Meldung zurückgewiesen werden?", "antworten": ["Die Einzugsstellen der Sozialversicherung, insbesondere die Rentenversicherung (§ 33 DEÜV).", "Wenn sie unvollständig oder fehlerhaft ist oder falsche Schlüsselzahlen enthält (§ 33 DEÜV).", "Ihre Daten müssen an die Minijob-Zentrale übermittelt werden (§ 13 DEÜV)."], "richtig": 1, "erklaerung": "Wenn sie unvollständig oder fehlerhaft ist oder falsche Schlüsselzahlen enthält (§ 33 DEÜV)."}, {"id": 1125, "gesetz": "DEÜV", "frage": "#1125 Welche Verpflichtungen haben Arbeitgeber bei der Speicherung der Meldungen?", "antworten": ["Die Meldedaten müssen nur bis zur Eingangsbestätigung der Krankenkasse aufbewahrt werden und sind danach zu löschen (§ 8 Abs. 2 BVV, § 28f SGB IV).", "Die Meldedaten sind ausschließlich in Papierform und mindestens 30 Jahre nach Ende der Beschäftigung aufzubewahren (§ 8 Abs. 2 BVV, § 28f SGB IV).", "Die Meldedaten gehören zu den Entgeltunterlagen und sind bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres aufzubewahren (§ 8 Abs. 2 BVV, § 28f SGB IV)."], "richtig": 2, "erklaerung": "Die Meldedaten gehören zu den Entgeltunterlagen und sind bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres aufzubewahren (§ 8 Abs. 2 BVV, § 28f SGB IV)."}, {"id": 1126, "gesetz": "DEÜV", "frage": "#1126 Welche Besonderheiten gelten für geringfügig Beschäftigte in der Sozialversicherungsmeldung?", "antworten": ["Eine spezielle Abmeldung bei Insolvenz des Unternehmens (§ 8a DEÜV).", "Die Krankenkassen und anderen Leistungsträger sind zur Meldung an die Rentenversicherung verpflichtet (§ 38 DEÜV).", "Ihre Daten müssen an die Minijob-Zentrale übermittelt werden (§ 13 DEÜV)."], "richtig": 2, "erklaerung": "Ihre Daten müssen an die Minijob-Zentrale übermittelt werden (§ 13 DEÜV)."}, {"id": 1127, "gesetz": "DEÜV", "frage": "#1127 Wie werden Entgeltersatzleistungen (z. B. Krankengeld) gemeldet?", "antworten": ["Ja, sie sind verpflichtet, die Meldungen zur Sozialversicherung nach den Vorgaben der DEÜV zu übermitteln (§ 1 DEÜV).", "Die Krankenkassen und anderen Leistungsträger sind zur Meldung an die Rentenversicherung verpflichtet (§ 38 DEÜV).", "Der Verleihbetrieb muss Sozialversicherungsmeldungen vornehmen (§ 3 DEÜV)."], "richtig": 1, "erklaerung": "Die Krankenkassen und anderen Leistungsträger sind zur Meldung an die Rentenversicherung verpflichtet (§ 38 DEÜV)."}, {"id": 1128, "gesetz": "DEÜV", "frage": "#1128 Was passiert, wenn eine Versicherungsnummer nicht bekannt ist?", "antworten": ["Die elektronische Erfassung und Übermittlung von Daten zur Sozialversicherung (§ 1 DEÜV).", "Der Arbeitgeber muss eine Nummernvergabe beantragen (§ 5 Abs. 6 DEÜV).", "Der Arbeitnehmer muss eine Nummernvergabe beantragen (§ 5 Abs. 6 DEÜV)."], "richtig": 1, "erklaerung": "Der Arbeitgeber muss eine Nummernvergabe beantragen (§ 5 Abs. 6 DEÜV)."}, {"id": 1129, "gesetz": "DEÜV", "frage": "#1129 Welche Meldepflichten bestehen für Leiharbeitnehmer?", "antworten": ["Der Verleihbetrieb muss Sozialversicherungsmeldungen vornehmen (§ 3 DEÜV).", "Spätestens mit der ersten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach Arbeitsbeginn (§ 6 DEÜV).", "Die Einzugsstellen der Sozialversicherung, insbesondere die Rentenversicherung (§ 33 DEÜV)."], "richtig": 0, "erklaerung": "Der Verleihbetrieb muss Sozialversicherungsmeldungen vornehmen (§ 3 DEÜV)."}, {"id": 1130, "gesetz": "DEÜV", "frage": "#1130 Welche Meldepflichten bestehen für Rentner, die weiterarbeiten?", "antworten": ["Ja, auch beschäftigte Rentner sind zu melden, ggf. wegen der Arbeitgeberanteile zur Renten- und Arbeitslosenversicherung (§ 3 DEÜV).", "Nur wenn sie mehr als 20 Stunden pro Woche arbeiten; Minijobs von Rentnern sind generell nicht meldepflichtig (§ 3 DEÜV).", "Keine; Altersrentner sind nach Erreichen der Regelaltersgrenze von allen Meldepflichten befreit, da sie versicherungsfrei sind (§ 3 DEÜV)."], "richtig": 0, "erklaerung": "Ja, auch beschäftigte Rentner sind zu melden, ggf. wegen der Arbeitgeberanteile zur Renten- und Arbeitslosenversicherung (§ 3 DEÜV)."}, {"id": 1151, "gesetz": "BGB", "frage": "#1151 Welche gesetzlichen Grundlagen regeln das Arbeitsverhältnis von Taxi- und Mietwagenfahrern?", "antworten": ["Ein Arbeitsvertrag kann mündlich oder schriftlich geschlossen werden, jedoch müssen die wesentlichen Bedingungen schriftlich festgehalten werden (§ 2 NachwG).", "Die allgemeinen arbeitsrechtlichen Vorschriften des BGB (§§ 611a ff. BGB) sowie das Arbeitszeitgesetz (ArbZG) und das Personenbeförderungsgesetz (PBefG).", "Dies kann eine Abmahnung oder in wiederholten Fällen eine Kündigung zur Folge haben (§ 626 BGB)."], "richtig": 1, "erklaerung": "Die allgemeinen arbeitsrechtlichen Vorschriften des BGB (§§ 611a ff. BGB) sowie das Arbeitszeitgesetz (ArbZG) und das Personenbeförderungsgesetz (PBefG)."}, {"id": 1152, "gesetz": "BGB", "frage": "#1152 Wie wird die Vergütung eines Taxifahrers geregelt, wenn keine ausdrückliche Vereinbarung getroffen wurde?", "antworten": ["Es muss klar, wahrheitsgemäß und wohlwollend formuliert sein (§ 109 GewO).", "Falls keine feste Vergütung vereinbart wurde, gilt die übliche Vergütung (§ 612 BGB).", "Nein, es sei denn, der Arbeitsvertrag oder eine betriebliche Regelung erlaubt dies (§ 315 BGB)."], "richtig": 1, "erklaerung": "Falls keine feste Vergütung vereinbart wurde, gilt die übliche Vergütung (§ 612 BGB)."}, {"id": 1153, "gesetz": "BGB", "frage": "#1153 Darf ein Taxiunternehmer von seinen Fahrern unbezahlte Arbeitszeiten verlangen?", "antworten": ["Ja, Zeiten ohne Fahrgast dürfen unbezahlt bleiben, wenn dies vereinbart ist (§§ 611a, 612 BGB, § 1 MiLoG).", "Nein, Arbeitszeit ist zu vergüten, mindestens mit dem Mindestlohn (§§ 611a, 612 BGB, § 1 MiLoG).", "Ja, bis zu zehn Stunden im Monat als Einarbeitungs- oder Rüstzeit ohne Vergütung (§§ 611a, 612 BGB, § 1 MiLoG)."], "richtig": 1, "erklaerung": "Nein, Arbeitszeit ist zu vergüten, mindestens mit dem Mindestlohn (§§ 611a, 612 BGB, § 1 MiLoG)."}, {"id": 1154, "gesetz": "BGB", "frage": "#1154 Welche Kündigungsfrist gilt für Taxi- und Mietwagenfahrer?", "antworten": ["Die gesetzlichen Kündigungsfristen gemäß § 622 BGB, abhängig von der Betriebszugehörigkeit.", "Wenn eine betriebsbedingte Kündigung mit einem Abfindungsangebot verbunden ist (§ 1a KSchG).", "Ja, nach dem Nachweisgesetz (NachwG) muss der Arbeitgeber die wesentlichen Vertragsbedingungen schriftlich festhalten."], "richtig": 0, "erklaerung": "Die gesetzlichen Kündigungsfristen gemäß § 622 BGB, abhängig von der Betriebszugehörigkeit."}, {"id": 1155, "gesetz": "BGB", "frage": "#1155 Hat ein Taxifahrer ein Recht auf einen schriftlichen Arbeitsvertrag?", "antworten": ["Ja, der Arbeitsvertrag ist nur in Schriftform wirksam; ein mündlich geschlossener Vertrag ist im Personenbeförderungsgewerbe nichtig (§ 2 NachwG).", "Nein, im Personenbeförderungsgewerbe genügt ein mündlicher Vertrag; ein schriftlicher Nachweis der Bedingungen ist entbehrlich (§ 2 NachwG).", "Der Vertrag ist formfrei, der Arbeitgeber muss aber die wesentlichen Bedingungen schriftlich nachweisen; Textform genügt im Personenbeförderungsgewerbe nicht (§ 2 NachwG)."], "richtig": 2, "erklaerung": "Der Vertrag ist formfrei, der Arbeitgeber muss aber die wesentlichen Bedingungen schriftlich nachweisen; Textform genügt im Personenbeförderungsgewerbe nicht (§ 2 NachwG)."}, {"id": 1156, "gesetz": "BGB", "frage": "#1156 Darf ein Taxiunternehmen einen Taxifahrer entlassen, weil dieser sich über schlechte Arbeitsbedingungen beschwert?", "antworten": ["Ja, eine Kündigung aus diesem Grund verstößt gegen das Maßregelungsverbot (§ 612a BGB).", "Nein, es sei denn, der Arbeitsvertrag oder eine betriebliche Regelung erlaubt dies (§ 315 BGB).", "Nein, eine Kündigung aus diesem Grund verstößt gegen das Maßregelungsverbot (§ 612a BGB)."], "richtig": 2, "erklaerung": "Nein, eine Kündigung aus diesem Grund verstößt gegen das Maßregelungsverbot (§ 612a BGB)."}, {"id": 1157, "gesetz": "BGB", "frage": "#1157 Was passiert mit dem Arbeitsverhältnis eines Taxifahrers, wenn das Taxiunternehmen verkauft wird?", "antworten": ["Die gesetzlichen Kündigungsfristen gemäß § 622 BGB, abhängig von der Betriebszugehörigkeit.", "Das Arbeitsverhältnis geht mit allen Rechten und Pflichten auf den neuen Arbeitgeber über (§ 613a BGB).", "Das Arbeitsverhältnis geht mit allen Rechten und Pflichten auf den neuen Arbeitnehmer über (§ 613a BGB)."], "richtig": 1, "erklaerung": "Das Arbeitsverhältnis geht mit allen Rechten und Pflichten auf den neuen Arbeitgeber über (§ 613a BGB)."}, {"id": 1158, "gesetz": "BGB", "frage": "#1158 Ist ein Taxifahrer verpflichtet, sein eigenes Fahrzeug für Fahrten zu nutzen?", "antworten": ["Nein, Arbeitsmittel stellt der Arbeitgeber; eine Nutzung des eigenen Fahrzeugs muss vereinbart und Aufwand ersetzt werden (§§ 611a, 670 BGB).", "Ja, auf Weisung muss jeder Fahrer sein Privatfahrzeug einsetzen und erhält dafür pauschal 0,30 € je km (§§ 611a, 670 BGB).", "Ja, wenn der Arbeitsvertrag es vorsieht; die Kosten trägt der Fahrer, da sie mit dem Lohn abgegolten sind (§§ 611a, 670 BGB)."], "richtig": 0, "erklaerung": "Nein, Arbeitsmittel stellt der Arbeitgeber; eine Nutzung des eigenen Fahrzeugs muss vereinbart und Aufwand ersetzt werden (§§ 611a, 670 BGB)."}, {"id": 1159, "gesetz": "BGB", "frage": "#1159 Darf ein Taxifahrer seinen Arbeitsplatz an eine andere Person weitergeben?", "antworten": ["Nein, die Arbeitsleistung muss persönlich erbracht werden, sofern keine andere Regelung getroffen wurde (§ 613 BGB).", "Ja, die Arbeitsleistung muss persönlich erbracht werden, sofern keine andere Regelung getroffen wurde (§ 613 BGB).", "Verträge können unwirksam sein, wenn eine Partei aufgrund ihrer Unerfahrenheit übervorteilt wurde (§ 138 BGB)."], "richtig": 0, "erklaerung": "Nein, die Arbeitsleistung muss persönlich erbracht werden, sofern keine andere Regelung getroffen wurde (§ 613 BGB)."}, {"id": 1160, "gesetz": "BGB", "frage": "#1160 Welche Regelungen gelten für die Bezahlung von Wartezeiten bei Taxifahrern?", "antworten": ["Standzeiten am Taxistand sind in der Regel Arbeitszeit (Arbeitsbereitschaft) und mindestens mit dem Mindestlohn zu vergüten (§ 611a BGB, § 1 MiLoG).", "Standzeiten am Taxistand sind nur mit der Hälfte des Mindestlohns zu vergüten, da keine volle Arbeitsleistung erfolgt und kein Fahrgast befördert wird (§ 611a BGB, § 1 MiLoG).", "Standzeiten am Taxistand gelten als Ruhezeit und müssen nicht vergütet werden, sondern nur Fahrzeiten mit Fahrgast (§ 611a BGB, § 1 MiLoG)."], "richtig": 0, "erklaerung": "Standzeiten am Taxistand sind in der Regel Arbeitszeit (Arbeitsbereitschaft) und mindestens mit dem Mindestlohn zu vergüten (§ 611a BGB, § 1 MiLoG)."}, {"id": 1161, "gesetz": "BGB", "frage": "#1161 Wann gilt ein Arbeitsvertrag als wirksam geschlossen?", "antworten": ["Wenn sich Arbeitgeber und Arbeitnehmer über die wesentlichen Vertragsbestandteile (Vergütung, Tätigkeit) geeinigt haben (§ 611a BGB).", "Wenn sich Arbeitgeber und Arbeitgeber über die wesentlichen Vertragsbestandteile (Vergütung, Tätigkeit) geeinigt haben (§ 611a BGB).", "Wenn sich Arbeitnehmer und Arbeitnehmer über die wesentlichen Vertragsbestandteile (Vergütung, Tätigkeit) geeinigt haben (§ 611a BGB)."], "richtig": 0, "erklaerung": "Wenn sich Arbeitgeber und Arbeitnehmer über die wesentlichen Vertragsbestandteile (Vergütung, Tätigkeit) geeinigt haben (§ 611a BGB)."}, {"id": 1162, "gesetz": "BGB", "frage": "#1162 Wann hat ein Arbeitnehmer Anspruch auf eine Abfindung nach einer Kündigung?", "antworten": ["Immer; nach § 1a KSchG steht jedem gekündigten Arbeitnehmer eine Abfindung von einem Monatsverdienst je Beschäftigungsjahr zu.", "Nur bei verhaltensbedingter Kündigung, wenn der Arbeitnehmer Kündigungsschutzklage erhebt (§ 1a KSchG; 0,25 Monatsverdienste je Jahr).", "Grundsätzlich nicht; nach § 1a KSchG, wenn bei betriebsbedingter Kündigung mit Abfindungshinweis keine Klage erhoben wird (0,5 Monatsverdienste je Jahr)."], "richtig": 2, "erklaerung": "Grundsätzlich nicht; nach § 1a KSchG, wenn bei betriebsbedingter Kündigung mit Abfindungshinweis keine Klage erhoben wird (0,5 Monatsverdienste je Jahr)."}, {"id": 1163, "gesetz": "BGB", "frage": "#1163 Welche Rechte hat ein Arbeitnehmer bei einer fristlosen Kündigung?", "antworten": ["Er kann innerhalb von zwei Wochen nach Zugang Widerspruch beim Arbeitgeber einlegen (§§ 4, 13 KSchG).", "Er kann innerhalb von drei Monaten nach Zugang Klage beim Amtsgericht erheben (§§ 4, 13 KSchG).", "Er kann innerhalb von drei Wochen nach Zugang Kündigungsschutzklage beim Arbeitsgericht erheben (§§ 4, 13 KSchG)."], "richtig": 2, "erklaerung": "Er kann innerhalb von drei Wochen nach Zugang Kündigungsschutzklage beim Arbeitsgericht erheben (§§ 4, 13 KSchG)."}, {"id": 1164, "gesetz": "BGB", "frage": "#1164 Welche Mindestanforderungen muss ein Arbeitszeugnis erfüllen?", "antworten": ["Ein Arbeitsvertrag verpflichtet zur persönlichen Arbeitsleistung, während ein Werkvertrag ein bestimmtes Ergebnis schuldet (§ 631 BGB).", "Bei grober Fahrlässigkeit oder Vorsatz (§ 823 BGB), in anderen Fällen kann eine Haftungserleichterung bestehen.", "Es muss klar, wahrheitsgemäß und wohlwollend formuliert sein (§ 109 GewO)."], "richtig": 2, "erklaerung": "Es muss klar, wahrheitsgemäß und wohlwollend formuliert sein (§ 109 GewO)."}, {"id": 1165, "gesetz": "BGB", "frage": "#1165 Wann verjährt ein Anspruch auf ausstehende Lohnzahlungen?", "antworten": ["Nach drei Jahren, beginnend mit dem Schluss des Jahres der Fälligkeit (§§ 195, 199 BGB).", "Nach zwei Jahren, beginnend mit dem Tag der Fälligkeit (§§ 195, 199 BGB).", "Nach zehn Jahren, beginnend mit dem Ende des Arbeitsverhältnisses oder der letzten Lohnabrechnung (§§ 195, 199 BGB)."], "richtig": 0, "erklaerung": "Nach drei Jahren, beginnend mit dem Schluss des Jahres der Fälligkeit (§§ 195, 199 BGB)."}, {"id": 1166, "gesetz": "BGB", "frage": "#1166 Welche Regelung gilt für den Urlaubsanspruch eines Arbeitnehmers?", "antworten": ["Wenn sich Arbeitgeber und Arbeitnehmer über die wesentlichen Vertragsbestandteile (Vergütung, Tätigkeit) geeinigt haben (§ 611a BGB).", "Verträge können unwirksam sein, wenn eine Partei aufgrund ihrer Unerfahrenheit übervorteilt wurde (§ 138 BGB).", "Mindestens vier Wochen gesetzlicher Mindesturlaub pro Jahr (§ 3 BUrlG)."], "richtig": 2, "erklaerung": "Mindestens vier Wochen gesetzlicher Mindesturlaub pro Jahr (§ 3 BUrlG)."}, {"id": 1167, "gesetz": "BGB", "frage": "#1167 Darf ein Arbeitgeber einseitig den Arbeitsort eines Arbeitnehmers ändern?", "antworten": ["Ja, im Rahmen des Weisungsrechts nach billigem Ermessen, soweit der Arbeitsort nicht im Arbeitsvertrag festgelegt ist (§ 106 GewO).", "Ja, jederzeit ohne Rücksicht auf die Interessen des Arbeitnehmers, auch wenn der Arbeitsort vertraglich festgelegt ist (§ 106 GewO).", "Nein, jede Änderung des Arbeitsortes erfordert eine Änderungskündigung, auch wenn der Vertrag keinen Ort festlegt (§ 106 GewO)."], "richtig": 0, "erklaerung": "Ja, im Rahmen des Weisungsrechts nach billigem Ermessen, soweit der Arbeitsort nicht im Arbeitsvertrag festgelegt ist (§ 106 GewO)."}, {"id": 1168, "gesetz": "BGB", "frage": "#1168 Wann ist eine Probezeit in einem Arbeitsvertrag zulässig?", "antworten": ["Nur bei gesetzlichem Anspruch (z. B. Pflegezeit, Elternzeit) oder mit Zustimmung des Arbeitgebers (§ 616 BGB).", "Ein Arbeitsvertrag verpflichtet zur persönlichen Arbeitsleistung, während ein Werkvertrag ein bestimmtes Ergebnis schuldet (§ 631 BGB).", "Sie darf maximal sechs Monate betragen (§ 622 Abs. 3 BGB)."], "richtig": 2, "erklaerung": "Sie darf maximal sechs Monate betragen (§ 622 Abs. 3 BGB)."}, {"id": 1169, "gesetz": "BGB", "frage": "#1169 Was passiert, wenn ein Arbeitnehmer ohne gültigen Grund nicht zur Arbeit erscheint?", "antworten": ["Der Arbeitgeber darf ohne Abmahnung eine Vertragsstrafe von einem Monatslohn einbehalten; eine Kündigung ist ausgeschlossen (§ 1 Abs. 2 KSchG, § 626 BGB).", "Dies kann eine Abmahnung und im Wiederholungsfall eine ordentliche oder fristlose Kündigung zur Folge haben (§ 1 Abs. 2 KSchG, § 626 BGB).", "Arbeitsrechtliche Folgen sind ausgeschlossen; der Arbeitgeber darf lediglich den Urlaubsanspruch um einen Tag kürzen (§ 1 Abs. 2 KSchG, § 626 BGB)."], "richtig": 1, "erklaerung": "Dies kann eine Abmahnung und im Wiederholungsfall eine ordentliche oder fristlose Kündigung zur Folge haben (§ 1 Abs. 2 KSchG, § 626 BGB)."}, {"id": 1170, "gesetz": "BGB", "frage": "#1170 Unter welchen Umständen kann ein Arbeitnehmer eine unbezahlte Freistellung verlangen?", "antworten": ["Jederzeit bis zu sechs Monate im Jahr ohne Begründung, wenn sie vier Wochen vorher beantragt wird; der Arbeitgeber muss stets zustimmen (§ 3 PflegeZG, § 15 BEEG).", "Nach fünf Jahren Betriebszugehörigkeit als Sabbatical, ohne dass es einer Zustimmung bedarf (§ 3 PflegeZG, § 15 BEEG).", "Nur bei gesetzlichem Anspruch (z. B. Pflegezeit, Elternzeit) oder mit Zustimmung des Arbeitgebers (§ 3 PflegeZG, § 15 BEEG)."], "richtig": 2, "erklaerung": "Nur bei gesetzlichem Anspruch (z. B. Pflegezeit, Elternzeit) oder mit Zustimmung des Arbeitgebers (§ 3 PflegeZG, § 15 BEEG)."}, {"id": 1171, "gesetz": "BGB", "frage": "#1171 Was ist der Unterschied zwischen einem Werkvertrag und einem Arbeitsvertrag?", "antworten": ["Ein Arbeitsvertrag verpflichtet zur persönlichen Arbeitsleistung, während ein Werkvertrag ein bestimmtes Ergebnis schuldet (§ 631 BGB).", "Wenn eine betriebsbedingte Kündigung mit einem Abfindungsangebot verbunden ist (§ 1a KSchG).", "Wenn der Arbeitnehmer vorsätzlich oder grob fahrlässig einen Schaden verursacht hat (§ 280 BGB)."], "richtig": 0, "erklaerung": "Ein Arbeitsvertrag verpflichtet zur persönlichen Arbeitsleistung, während ein Werkvertrag ein bestimmtes Ergebnis schuldet (§ 631 BGB)."}, {"id": 1172, "gesetz": "BGB", "frage": "#1172 Wann haftet ein Arbeitnehmer für Schäden, die er während der Arbeit verursacht?", "antworten": ["Voll bei Vorsatz und grober Fahrlässigkeit, anteilig bei mittlerer, nicht bei leichter Fahrlässigkeit (§§ 280, 619a BGB, innerbetrieblicher Schadensausgleich).", "Voll bei jeder Fahrlässigkeit, da der Arbeitnehmer nach allgemeinem Schuldrecht für jedes Verschulden einsteht (§§ 280, 619a BGB).", "Nur bei Vorsatz; bei jeder Form der Fahrlässigkeit trägt allein der Arbeitgeber oder seine Haftpflichtversicherung den Schaden (§§ 280, 619a BGB, innerbetrieblicher Schadensausgleich)."], "richtig": 0, "erklaerung": "Voll bei Vorsatz und grober Fahrlässigkeit, anteilig bei mittlerer, nicht bei leichter Fahrlässigkeit (§§ 280, 619a BGB, innerbetrieblicher Schadensausgleich)."}, {"id": 1173, "gesetz": "BGB", "frage": "#1173 Darf ein Arbeitnehmer während der Arbeitszeit für ein Konkurrenzunternehmen arbeiten?", "antworten": ["Ja, dies verstößt gegen die Treuepflicht und kann zur Kündigung führen (§ 60 HGB).", "Nein, die Arbeitsleistung muss persönlich erbracht werden, sofern keine andere Regelung getroffen wurde (§ 613 BGB).", "Nein, dies verstößt gegen die Treuepflicht und kann zur Kündigung führen (§ 60 HGB)."], "richtig": 2, "erklaerung": "Nein, dies verstößt gegen die Treuepflicht und kann zur Kündigung führen (§ 60 HGB)."}, {"id": 1174, "gesetz": "BGB", "frage": "#1174 Unter welchen Bedingungen kann ein Arbeitgeber Schadensersatz vom Arbeitnehmer fordern?", "antworten": ["Bei Vorsatz und grober Fahrlässigkeit voll, bei mittlerer Fahrlässigkeit anteilig; der Arbeitgeber muss das Verschulden beweisen (§§ 280, 619a BGB).", "Nur bei Vorsatz und begrenzt auf ein Monatsgehalt; bei grober Fahrlässigkeit haftet allein der Arbeitgeber (§§ 280, 619a BGB).", "Bei jeder Fahrlässigkeit voll; der Arbeitnehmer muss beweisen, dass ihn kein Verschulden trifft (§§ 280, 619a BGB)."], "richtig": 0, "erklaerung": "Bei Vorsatz und grober Fahrlässigkeit voll, bei mittlerer Fahrlässigkeit anteilig; der Arbeitgeber muss das Verschulden beweisen (§§ 280, 619a BGB)."}, {"id": 1175, "gesetz": "BGB", "frage": "#1175 Wie lange ist die gesetzliche Gewährleistungsfrist bei Werkverträgen nach BGB?", "antworten": ["Beim Werkvertrag verjähren Mängelansprüche bei Sachwerken stets in fünf Jahren ab Abnahme; beim Dienstvertrag gilt dasselbe ab dem Ende des Vertrags (§ 634a BGB).", "Beim Werkvertrag verjähren Mängelansprüche bei Sachwerken in sechs Monaten ab Übergabe, beim Dienstvertrag in einem Jahr (§ 634a BGB).", "Beim Dienstvertrag gibt es keine Gewährleistung; beim Werkvertrag verjähren Mängelansprüche bei Sachwerken in zwei Jahren ab Abnahme (§ 634a BGB)."], "richtig": 2, "erklaerung": "Beim Dienstvertrag gibt es keine Gewährleistung; beim Werkvertrag verjähren Mängelansprüche bei Sachwerken in zwei Jahren ab Abnahme (§ 634a BGB)."}, {"id": 1176, "gesetz": "BGB", "frage": "#1176 Wann kann ein Vertrag wegen Irrtums angefochten werden?", "antworten": ["Bei Inhalts- oder Erklärungsirrtum oder Irrtum über verkehrswesentliche Eigenschaften; die Anfechtung muss unverzüglich erfolgen (§§ 119, 121 BGB).", "Nur bei arglistiger Täuschung durch den Vertragspartner; die Anfechtung muss binnen zwei Wochen schriftlich beim örtlichen Amtsgericht erfolgen (§§ 119, 121 BGB).", "Bei jedem Motivirrtum, etwa über die Preisentwicklung; die Anfechtung muss innerhalb von drei Jahren erfolgen (§§ 119, 121 BGB)."], "richtig": 0, "erklaerung": "Bei Inhalts- oder Erklärungsirrtum oder Irrtum über verkehrswesentliche Eigenschaften; die Anfechtung muss unverzüglich erfolgen (§§ 119, 121 BGB)."}, {"id": 1177, "gesetz": "BGB", "frage": "#1177 Welche Bedeutung hat die „geschäftliche Unerfahrenheit“ bei Verträgen?", "antworten": ["Verträge sind nichtig, wenn die Unerfahrenheit ausgebeutet wird und ein auffälliges Missverhältnis von Leistung und Gegenleistung besteht (§ 138 Abs. 2 BGB).", "Verträge sind schwebend unwirksam und binnen 14 Tagen widerruflich, sobald ein Partner geschäftlich unerfahren ist (§ 138 Abs. 2 BGB).", "Unerfahrenheit allein macht den Vertrag nichtig, auch wenn Leistung und Gegenleistung angemessen sind (§ 138 Abs. 2 BGB)."], "richtig": 0, "erklaerung": "Verträge sind nichtig, wenn die Unerfahrenheit ausgebeutet wird und ein auffälliges Missverhältnis von Leistung und Gegenleistung besteht (§ 138 Abs. 2 BGB)."}, {"id": 1178, "gesetz": "BGB", "frage": "#1178 Wann sind Allgemeine Geschäftsbedingungen (AGB) unwirksam?", "antworten": ["AGB sind nur unwirksam, wenn der Kunde nicht schriftlich zugestimmt hat (§ 305 BGB); eine Inhaltskontrolle findet nicht statt (§ 307 BGB).", "Überraschende Klauseln werden nicht Vertragsbestandteil (§ 305c BGB), unangemessen benachteiligende sind unwirksam (§ 307 BGB).", "Überraschende Klauseln sind wirksam, wenn sie im Kleingedruckten stehen (§ 305c BGB); unwirksam sind AGB nur bei Sittenwidrigkeit (§ 138 BGB)."], "richtig": 1, "erklaerung": "Überraschende Klauseln werden nicht Vertragsbestandteil (§ 305c BGB), unangemessen benachteiligende sind unwirksam (§ 307 BGB)."}, {"id": 1179, "gesetz": "BGB", "frage": "#1179 Welche Formvorschriften gelten für Arbeitsverträge?", "antworten": ["Ein Arbeitsvertrag kann schriftlich oder schriftlich geschlossen werden, jedoch müssen die wesentlichen Bedingungen schriftlich festgehalten werden (§ 2 NachwG).", "Ein Arbeitsvertrag kann mündlich oder mündlich geschlossen werden, jedoch müssen die wesentlichen Bedingungen schriftlich festgehalten werden (§ 2 NachwG).", "Ein Arbeitsvertrag kann mündlich oder schriftlich geschlossen werden, jedoch müssen die wesentlichen Bedingungen schriftlich festgehalten werden (§ 2 NachwG)."], "richtig": 2, "erklaerung": "Ein Arbeitsvertrag kann mündlich oder schriftlich geschlossen werden, jedoch müssen die wesentlichen Bedingungen schriftlich festgehalten werden (§ 2 NachwG)."}, {"id": 1180, "gesetz": "BGB", "frage": "#1180 Was passiert, wenn ein Arbeitnehmer seine Pflichten aus dem Arbeitsvertrag nicht erfüllt?", "antworten": ["Der Arbeitgeber muss vor jeder Kündigung das Arbeitsgericht anrufen, das über die Pflichtverletzung entscheidet (§ 1 Abs. 2 KSchG, § 626 BGB).", "Der Arbeitgeber kann abmahnen und im Wiederholungsfall ordentlich oder bei schweren Verstößen fristlos kündigen (§ 1 Abs. 2 KSchG, § 626 BGB).", "Der Arbeitgeber darf den Lohn für den gesamten Monat einbehalten; eine Kündigung wegen Pflichtverletzungen ist ausgeschlossen (§ 1 Abs. 2 KSchG, § 626 BGB)."], "richtig": 1, "erklaerung": "Der Arbeitgeber kann abmahnen und im Wiederholungsfall ordentlich oder bei schweren Verstößen fristlos kündigen (§ 1 Abs. 2 KSchG, § 626 BGB)."}, {"id": 1201, "gesetz": "HGB_BGB", "frage": "#1201 Gilt ein Taxiunternehmen als Kaufmann im Sinne des HGB?", "antworten": ["Ja, wenn es ein Handelsgewerbe betreibt oder im Handelsregister eingetragen ist (§ 1 HGB).", "Der Arbeitgeber muss sechs Wochen lang Entgeltfortzahlung leisten (§ 3 EFZG).", "Nein, wenn es ein Handelsgewerbe betreibt oder im Handelsregister eingetragen ist (§ 1 HGB)."], "richtig": 0, "erklaerung": "Ja, wenn es ein Handelsgewerbe betreibt oder im Handelsregister eingetragen ist (§ 1 HGB)."}, {"id": 1202, "gesetz": "HGB_BGB", "frage": "#1202 Welche Bedeutung hat die Handelsregistereintragung für ein Taxiunternehmen?", "antworten": ["Wenn es von mehreren Kaufleuten gemeinsam geführt wird und im Handelsregister eingetragen ist (§ 6 HGB).", "Sie bewirkt, dass das Unternehmen automatisch als Kaufmann gilt und den Vorschriften des HGB unterliegt (§ 2 HGB).", "Er muss Bücher führen, eine Bilanz aufstellen und sich an kaufmännische Sorgfaltspflichten halten (§§ 238, 243 HGB)."], "richtig": 1, "erklaerung": "Sie bewirkt, dass das Unternehmen automatisch als Kaufmann gilt und den Vorschriften des HGB unterliegt (§ 2 HGB)."}, {"id": 1203, "gesetz": "HGB_BGB", "frage": "#1203 Welche Pflichten hat ein Taxiunternehmer als Kaufmann?", "antworten": ["Sie bewirkt, dass das Unternehmen automatisch als Kaufmann gilt und den Vorschriften des HGB unterliegt (§ 2 HGB).", "Es gelten die allgemeinen Buchführungspflichten nach HGB und UStG (§ 238 HGB).", "Er muss Bücher führen, eine Bilanz aufstellen und sich an kaufmännische Sorgfaltspflichten halten (§§ 238, 243 HGB)."], "richtig": 2, "erklaerung": "Er muss Bücher führen, eine Bilanz aufstellen und sich an kaufmännische Sorgfaltspflichten halten (§§ 238, 243 HGB)."}, {"id": 1204, "gesetz": "HGB_BGB", "frage": "#1204 Wie unterscheidet sich ein Gewerbetreibender von einem Kaufmann im Taxi- und Mietwagengewerbe?", "antworten": ["Es gelten die allgemeinen Buchführungspflichten nach HGB und UStG (§ 238 HGB).", "Ein Kaufmann unterliegt den Vorschriften des HGB, während ein Gewerbetreibender nach GewO und BGB behandelt wird.", "Sie bewirkt, dass das Unternehmen automatisch als Kaufmann gilt und den Vorschriften des HGB unterliegt (§ 2 HGB)."], "richtig": 1, "erklaerung": "Ein Kaufmann unterliegt den Vorschriften des HGB, während ein Gewerbetreibender nach GewO und BGB behandelt wird."}, {"id": 1205, "gesetz": "HGB_BGB", "frage": "#1205 Muss ein Taxiunternehmen ein kaufmännisch eingerichtetes Geschäft führen?", "antworten": ["Ja, aber die Firma muss unterscheidungskräftig sein und darf nicht irreführend wirken (§ 18 HGB).", "Nur, wenn der Betrieb nach Art und Umfang einen kaufmännischen Geschäftsbetrieb erfordert (§ 1 Abs. 2 HGB).", "Zahlung der Vergütung, Fürsorgepflicht, Schutzmaßnahmen nach ArbSchG (§ 241 Abs. 2 BGB)."], "richtig": 1, "erklaerung": "Nur, wenn der Betrieb nach Art und Umfang einen kaufmännischen Geschäftsbetrieb erfordert (§ 1 Abs. 2 HGB)."}, {"id": 1206, "gesetz": "HGB_BGB", "frage": "#1206 Welche Regelungen gelten für den Geschäftsverkehr eines Taxiunternehmens mit Fahrgästen?", "antworten": ["Der Unternehmer verliert die Verfügung über sein Vermögen, das Insolvenzgericht übernimmt die Verwaltung (§ 17 InsO).", "Die Beförderung basiert auf einem Beförderungsvertrag, der nach BGB und PBefG geregelt ist.", "Alle Arbeitsverhältnisse gehen auf den neuen Inhaber über (§ 613a BGB)."], "richtig": 1, "erklaerung": "Die Beförderung basiert auf einem Beförderungsvertrag, der nach BGB und PBefG geregelt ist."}, {"id": 1207, "gesetz": "HGB_BGB", "frage": "#1207 Welche Auswirkungen hat eine fehlerhafte Rechnung eines Taxiunternehmens?", "antworten": ["Eine fehlerhafte Rechnung ist endgültig nichtig und kann nicht berichtigt werden; zu hoch ausgewiesene Steuer schuldet allein der Kunde (§ 14c UStG, § 31 Abs. 5 UStDV).", "Fehlerhafte Rechnungen bleiben folgenlos, da der Kunde den Vorsteuerabzug behält; zu hoch ausgewiesene Steuer erstattet das Finanzamt dem Kunden automatisch mit dem nächsten Steuerbescheid (§ 14c UStG, § 31 Abs. 5 UStDV).", "Eine fehlerhafte Rechnung kann berichtigt werden; bis dahin kann der Kunde den Vorsteuerabzug verlieren, und zu hoch ausgewiesene Steuer schuldet der Unternehmer (§ 14c UStG, § 31 Abs. 5 UStDV)."], "richtig": 2, "erklaerung": "Eine fehlerhafte Rechnung kann berichtigt werden; bis dahin kann der Kunde den Vorsteuerabzug verlieren, und zu hoch ausgewiesene Steuer schuldet der Unternehmer (§ 14c UStG, § 31 Abs. 5 UStDV)."}, {"id": 1208, "gesetz": "HGB_BGB", "frage": "#1208 Darf ein Taxiunternehmen eine andere Firma führen als seinen eigenen Namen?", "antworten": ["Ja, aber die Firma muss unterscheidungskräftig sein und darf nicht irreführend wirken (§ 18 HGB).", "Die Haftung ist auf das Gesellschaftsvermögen begrenzt (§ 13 GmbHG).", "Nein, aber die Firma muss unterscheidungskräftig sein und darf nicht irreführend wirken (§ 18 HGB)."], "richtig": 0, "erklaerung": "Ja, aber die Firma muss unterscheidungskräftig sein und darf nicht irreführend wirken (§ 18 HGB)."}, {"id": 1209, "gesetz": "HGB_BGB", "frage": "#1209 Welche Haftung trifft den Unternehmer im Taxi- und Mietwagengewerbe?", "antworten": ["Der Einzelunternehmer haftet persönlich und unbeschränkt mit seinem gesamten Vermögen; bei GbR/OHG haften die Gesellschafter persönlich, bei der GmbH nur das Gesellschaftsvermögen (§ 721 BGB, § 126 HGB, § 13 Abs. 2 GmbHG).", "Der Einzelunternehmer haftet nur bis zur Höhe seines Eigenkapitals; bei GbR/OHG haften die Gesellschafter nur mit ihrer Einlage, bei der GmbH bis 25.000 € (§ 721 BGB, § 126 HGB, § 13 Abs. 2 GmbHG).", "Der Einzelunternehmer haftet nur mit dem Betriebsvermögen; bei GbR/OHG haftet nur das Gesellschaftsvermögen, bei der GmbH haften die Gesellschafter persönlich (§ 721 BGB, § 126 HGB, § 13 Abs. 2 GmbHG)."], "richtig": 0, "erklaerung": "Der Einzelunternehmer haftet persönlich und unbeschränkt mit seinem gesamten Vermögen; bei GbR/OHG haften die Gesellschafter persönlich, bei der GmbH nur das Gesellschaftsvermögen (§ 721 BGB, § 126 HGB, § 13 Abs. 2 GmbHG)."}, {"id": 1210, "gesetz": "HGB_BGB", "frage": "#1210 Darf ein Taxiunternehmen mehrere Geschäftsadressen führen?", "antworten": ["Ja, aber der Hauptsitz muss ins Handelsregister eingetragen werden (§ 29 HGB).", "Er muss Arbeitszeiten, Löhne und Sozialversicherungsabgaben dokumentieren (§ 238 HGB).", "Nein, aber der Hauptsitz muss ins Handelsregister eingetragen werden (§ 29 HGB)."], "richtig": 0, "erklaerung": "Ja, aber der Hauptsitz muss ins Handelsregister eingetragen werden (§ 29 HGB)."}, {"id": 1211, "gesetz": "HGB_BGB", "frage": "#1211 Gilt das HGB für das Arbeitsverhältnis von Taxi- und Mietwagenfahrern?", "antworten": ["Ja, sobald der Unternehmer im Handelsregister eingetragen ist, gilt für alle angestellten Fahrer und Aushilfen das HGB statt des BGB (§ 1 HGB, § 611a BGB).", "Ja, Taxifahrer sind Handlungsgehilfen, sodass sich ihr Arbeitsverhältnis ausschließlich nach den §§ 59 ff. HGB richtet.", "Nein, das Arbeitsverhältnis richtet sich nach dem BGB (§ 611a BGB) und den arbeitsrechtlichen Spezialgesetzen (z. B. KSchG, ArbZG, MiLoG)."], "richtig": 2, "erklaerung": "Nein, das Arbeitsverhältnis richtet sich nach dem BGB (§ 611a BGB) und den arbeitsrechtlichen Spezialgesetzen (z. B. KSchG, ArbZG, MiLoG)."}, {"id": 1212, "gesetz": "HGB_BGB", "frage": "#1212 Welche Pflichten hat der Arbeitgeber gegenüber seinen Fahrern nach HGB und BGB?", "antworten": ["Zahlung der Vergütung, Fürsorgepflicht, Schutzmaßnahmen nach ArbSchG (§ 241 Abs. 2 BGB).", "Nein, das Arbeitsrecht richtet sich nach dem BGB (§ 611a BGB) und dem Arbeitsrecht.", "Ja, wenn sie nicht weisungsgebunden sind; ansonsten handelt es sich um Scheinselbstständigkeit (§ 84 HGB)."], "richtig": 0, "erklaerung": "Zahlung der Vergütung, Fürsorgepflicht, Schutzmaßnahmen nach ArbSchG (§ 241 Abs. 2 BGB)."}, {"id": 1213, "gesetz": "HGB_BGB", "frage": "#1213 Welche Kündigungsfristen gelten für angestellte Taxifahrer?", "antworten": ["Die gesetzlichen Kündigungsfristen des BGB sind maßgeblich (§ 622 BGB).", "Eine fehlerhafte Rechnung kann nachträglich korrigiert werden, jedoch haftet der Unternehmer für Fehler (§ 14 UStG).", "Sie bewirkt, dass das Unternehmen automatisch als Kaufmann gilt und den Vorschriften des HGB unterliegt (§ 2 HGB)."], "richtig": 0, "erklaerung": "Die gesetzlichen Kündigungsfristen des BGB sind maßgeblich (§ 622 BGB)."}, {"id": 1214, "gesetz": "HGB_BGB", "frage": "#1214 Welche Rechte hat ein angestellter Taxifahrer bei Überstunden?", "antworten": ["Jede Überstunde ist zwingend mit einem gesetzlichen Zuschlag von 25 % zu vergüten, auch wenn sie weder angeordnet noch geduldet wurde (§ 612 Abs. 1 BGB).", "Angeordnete oder geduldete Überstunden sind zu vergüten oder durch Freizeit auszugleichen, wenn dies vereinbart ist oder eine Vergütung den Umständen nach zu erwarten ist (§ 612 Abs. 1 BGB).", "Überstunden sind mit dem Grundlohn abgegolten; ein Anspruch auf Vergütung oder Freizeitausgleich besteht nur bei leitenden Angestellten (§ 612 Abs. 1 BGB)."], "richtig": 1, "erklaerung": "Angeordnete oder geduldete Überstunden sind zu vergüten oder durch Freizeit auszugleichen, wenn dies vereinbart ist oder eine Vergütung den Umständen nach zu erwarten ist (§ 612 Abs. 1 BGB)."}, {"id": 1215, "gesetz": "HGB_BGB", "frage": "#1215 Darf ein Taxiunternehmen einen Fahrer zur Nutzung eines Privatwagens zwingen?", "antworten": ["Ja, wenn der Fahrer im Arbeitsvertrag eine Mobilitätsklausel unterschrieben hat; eine Kostenerstattung ist dann ausgeschlossen (§ 670 BGB analog).", "Nein, Arbeitsmittel muss grundsätzlich der Arbeitgeber stellen; die Nutzung des Privatwagens muss vereinbart werden, und die Kosten sind zu erstatten (§ 670 BGB analog).", "Ja, sofern das Privatfahrzeug als Taxi genehmigt ist; die Kosten trägt der Fahrer und kann sie als Werbungskosten absetzen (§ 670 BGB analog)."], "richtig": 1, "erklaerung": "Nein, Arbeitsmittel muss grundsätzlich der Arbeitgeber stellen; die Nutzung des Privatwagens muss vereinbart werden, und die Kosten sind zu erstatten (§ 670 BGB analog)."}, {"id": 1216, "gesetz": "HGB_BGB", "frage": "#1216 Welche Regelungen gelten für die Betriebsübernahme eines Taxiunternehmens?", "antworten": ["Bei einem Betriebsübergang enden alle Arbeitsverhältnisse automatisch; der neue Inhaber entscheidet frei, wen er übernimmt (§ 613a Abs. 1 und 6 BGB).", "Der neue Inhaber tritt nur in Arbeitsverhältnisse ein, die länger als sechs Monate bestehen; Widerspruch ist binnen drei Monaten möglich (§ 613a Abs. 1 und 6 BGB).", "Bei einem Betriebsübergang durch Rechtsgeschäft tritt der neue Inhaber in die bestehenden Arbeitsverhältnisse ein; die Arbeitnehmer können binnen eines Monats widersprechen (§ 613a Abs. 1 und 6 BGB)."], "richtig": 2, "erklaerung": "Bei einem Betriebsübergang durch Rechtsgeschäft tritt der neue Inhaber in die bestehenden Arbeitsverhältnisse ein; die Arbeitnehmer können binnen eines Monats widersprechen (§ 613a Abs. 1 und 6 BGB)."}, {"id": 1217, "gesetz": "HGB_BGB", "frage": "#1217 Kann ein Taxiunternehmen Fahrer als freie Mitarbeiter beschäftigen?", "antworten": ["Nein, im Taxigewerbe ist der Einsatz freier Mitarbeiter gesetzlich verboten; nur angestellte Fahrer dürfen eingesetzt werden (§ 611a BGB, § 7 SGB IV).", "Ja, wenn sie tatsächlich selbstständig und nicht weisungsgebunden sind; sonst liegt Scheinselbstständigkeit mit Sozialversicherungspflicht vor (§ 611a BGB, § 7 SGB IV).", "Ja, uneingeschränkt, wenn im Vertrag „freier Mitarbeiter“ steht; auf die tatsächliche Durchführung kommt es nicht an (§ 611a BGB, § 7 SGB IV)."], "richtig": 1, "erklaerung": "Ja, wenn sie tatsächlich selbstständig und nicht weisungsgebunden sind; sonst liegt Scheinselbstständigkeit mit Sozialversicherungspflicht vor (§ 611a BGB, § 7 SGB IV)."}, {"id": 1218, "gesetz": "HGB_BGB", "frage": "#1218 Welche Regelungen gibt es für den Krankheitsfall eines Taxifahrers?", "antworten": ["Der Arbeitgeber muss sechs Wochen lang Entgeltfortzahlung leisten (§ 3 EFZG).", "Der Arbeitnehmer muss sechs Wochen lang Entgeltfortzahlung leisten (§ 3 EFZG).", "Bei grober Fahrlässigkeit oder Vorsatz (§ 823 BGB)."], "richtig": 0, "erklaerung": "Der Arbeitgeber muss sechs Wochen lang Entgeltfortzahlung leisten (§ 3 EFZG)."}, {"id": 1219, "gesetz": "HGB_BGB", "frage": "#1219 Wann haftet ein Taxifahrer für Schäden am Fahrzeug?", "antworten": ["Bei Vorsatz und grober Fahrlässigkeit in der Regel voll, bei mittlerer Fahrlässigkeit anteilig, bei leichter Fahrlässigkeit nicht (innerbetrieblicher Schadensausgleich, §§ 280, 619a BGB).", "Immer in voller Höhe, sobald er den Schaden verursacht hat, unabhängig vom Grad des Verschuldens (innerbetrieblicher Schadensausgleich, §§ 280, 619a BGB).", "Nur bei Vorsatz; bei grober und mittlerer Fahrlässigkeit trägt allein der Arbeitgeber den gesamten Schaden (innerbetrieblicher Schadensausgleich, §§ 280, 619a BGB)."], "richtig": 0, "erklaerung": "Bei Vorsatz und grober Fahrlässigkeit in der Regel voll, bei mittlerer Fahrlässigkeit anteilig, bei leichter Fahrlässigkeit nicht (innerbetrieblicher Schadensausgleich, §§ 280, 619a BGB)."}, {"id": 1220, "gesetz": "HGB_BGB", "frage": "#1220 Welche Dokumentationspflichten hat ein Taxiunternehmer bezüglich seiner Arbeitnehmer?", "antworten": ["Er muss lediglich Fahrtenbücher und Taxameterdaten aufbewahren; die Lohnkonten führt die Krankenkasse für ihn (§ 17 MiLoG, § 16 ArbZG, § 41 EStG, § 28f SGB IV).", "Er muss Beginn, Ende und Dauer der Arbeitszeit aufzeichnen sowie Lohnkonten und Entgeltunterlagen führen (§ 17 MiLoG, § 16 ArbZG, § 41 EStG, § 28f SGB IV).", "Er muss nur Personalien und Bankverbindung der Fahrer erfassen; Arbeitszeiten sind im Taxigewerbe nicht aufzuzeichnen (§ 17 MiLoG, § 16 ArbZG, § 41 EStG, § 28f SGB IV)."], "richtig": 1, "erklaerung": "Er muss Beginn, Ende und Dauer der Arbeitszeit aufzeichnen sowie Lohnkonten und Entgeltunterlagen führen (§ 17 MiLoG, § 16 ArbZG, § 41 EStG, § 28f SGB IV)."}, {"id": 1221, "gesetz": "HGB_BGB", "frage": "#1221 Muss ein Taxiunternehmer eine Bilanz erstellen?", "antworten": ["Nein, Taxiunternehmer sind als Kleingewerbetreibende generell von der Bilanzierungspflicht befreit, unabhängig von Umsatz und Gewinn (§§ 241a, 242 HGB).", "Ja, wenn er Kaufmann ist; Einzelkaufleute mit nicht mehr als 600.000 € Umsatz und 60.000 € Jahresüberschuss sind befreit (§§ 241a, 242 HGB).", "Ja, wenn er Kaufmann ist; Einzelkaufleute mit nicht mehr als 800.000 € Umsatz und 80.000 € Jahresüberschuss sind befreit (§§ 241a, 242 HGB)."], "richtig": 2, "erklaerung": "Ja, wenn er Kaufmann ist; Einzelkaufleute mit nicht mehr als 800.000 € Umsatz und 80.000 € Jahresüberschuss sind befreit (§§ 241a, 242 HGB)."}, {"id": 1222, "gesetz": "HGB_BGB", "frage": "#1222 Welche Formvorschriften gelten für Taxi-Unternehmen im HGB?", "antworten": ["Auf Geschäftsbriefen eingetragener Kaufleute müssen Firma, Rechtsformzusatz, Ort der Niederlassung, Registergericht und Registernummer angegeben werden (§ 37a HGB).", "Auf Geschäftsbriefen müssen nur Name und Telefonnummer des Inhabers sowie die Nummer der Taxigenehmigung angegeben werden (§ 37a HGB).", "Auf Geschäftsbriefen eingetragener Kaufleute müssen Steuernummer, Bankverbindung, Konzessionsnummer und Zahl der Taxen stehen (§ 37a HGB)."], "richtig": 0, "erklaerung": "Auf Geschäftsbriefen eingetragener Kaufleute müssen Firma, Rechtsformzusatz, Ort der Niederlassung, Registergericht und Registernummer angegeben werden (§ 37a HGB)."}, {"id": 1223, "gesetz": "HGB_BGB", "frage": "#1223 Welche Vorschriften gelten für eine offene Handelsgesellschaft (OHG) im Taxi-Gewerbe?", "antworten": ["Die Gesellschafter haften für die Verbindlichkeiten der OHG persönlich, unbeschränkt und als Gesamtschuldner (§ 126 HGB).", "Die Gesellschafter haften für die Verbindlichkeiten der OHG nur bis zur Höhe ihrer Einlage und nur anteilig (§ 126 HGB).", "Für die Verbindlichkeiten der OHG haftet nur das Gesellschaftsvermögen; die Gesellschafter haften nicht persönlich (§ 126 HGB)."], "richtig": 0, "erklaerung": "Die Gesellschafter haften für die Verbindlichkeiten der OHG persönlich, unbeschränkt und als Gesamtschuldner (§ 126 HGB)."}, {"id": 1224, "gesetz": "HGB_BGB", "frage": "#1224 Welche Vorteile hat eine GmbH im Taxi-Gewerbe?", "antworten": ["Der Unternehmer haftet persönlich und unbeschränkt für alle Verbindlichkeiten (§ 13 HGB).", "Die Haftung ist auf das Gesellschaftsvermögen begrenzt (§ 13 GmbHG).", "Nur, wenn der Betrieb nach Art und Umfang einen kaufmännischen Geschäftsbetrieb erfordert (§ 1 Abs. 2 HGB)."], "richtig": 1, "erklaerung": "Die Haftung ist auf das Gesellschaftsvermögen begrenzt (§ 13 GmbHG)."}, {"id": 1225, "gesetz": "HGB_BGB", "frage": "#1225 Wann kann ein Taxiunternehmen einen Schadenersatzanspruch gegen einen Geschäftspartner geltend machen?", "antworten": ["Die Gesellschafter haften gesamtschuldnerisch für alle Verbindlichkeiten (§ 128 HGB).", "Bei Pflichtverletzung oder Vertragsbruch (§ 280 BGB).", "Er muss Bücher führen, eine Bilanz aufstellen und sich an kaufmännische Sorgfaltspflichten halten (§§ 238, 243 HGB)."], "richtig": 1, "erklaerung": "Bei Pflichtverletzung oder Vertragsbruch (§ 280 BGB)."}, {"id": 1226, "gesetz": "HGB_BGB", "frage": "#1226 Wann gilt ein Taxiunternehmen als Handelsgesellschaft?", "antworten": ["Sobald es mehr als fünf Taxen betreibt oder einen Jahresumsatz von über 250.000 € erzielt (§§ 6, 105 HGB, § 13 Abs. 3 GmbHG).", "Wenn es als Einzelunternehmen oder GbR im Gewerberegister eingetragen ist und eine Taxigenehmigung besitzt (§§ 6, 105 HGB, § 13 Abs. 3 GmbHG).", "Wenn es als OHG oder KG (gemeinsames Handelsgewerbe unter gemeinsamer Firma) oder als Kapitalgesellschaft wie die GmbH geführt wird (§§ 6, 105 HGB, § 13 Abs. 3 GmbHG)."], "richtig": 2, "erklaerung": "Wenn es als OHG oder KG (gemeinsames Handelsgewerbe unter gemeinsamer Firma) oder als Kapitalgesellschaft wie die GmbH geführt wird (§§ 6, 105 HGB, § 13 Abs. 3 GmbHG)."}, {"id": 1227, "gesetz": "HGB_BGB", "frage": "#1227 Welche Anforderungen gelten für die Rechnungslegung eines Taxiunternehmens?", "antworten": ["Es gelten die allgemeinen Buchführungspflichten nach HGB und UStG (§ 238 HGB).", "Der Unternehmer haftet persönlich und unbeschränkt für alle Verbindlichkeiten (§ 13 HGB).", "Ein Kaufmann unterliegt den Vorschriften des HGB, während ein Gewerbetreibender nach GewO und BGB behandelt wird."], "richtig": 0, "erklaerung": "Es gelten die allgemeinen Buchführungspflichten nach HGB und UStG (§ 238 HGB)."}, {"id": 1228, "gesetz": "HGB_BGB", "frage": "#1228 Welche Bedeutung hat das Handelsregister für Taxiunternehmen?", "antworten": ["Der Unternehmer haftet persönlich und unbeschränkt für alle Verbindlichkeiten (§ 13 HGB).", "Der Unternehmer verliert die Verfügung über sein Vermögen, das Insolvenzgericht übernimmt die Verwaltung (§ 17 InsO).", "Es dokumentiert die wichtigsten rechtlichen Tatsachen über das Unternehmen (§ 8 HGB)."], "richtig": 2, "erklaerung": "Es dokumentiert die wichtigsten rechtlichen Tatsachen über das Unternehmen (§ 8 HGB)."}, {"id": 1229, "gesetz": "HGB_BGB", "frage": "#1229 Kann ein Taxiunternehmen einen Handelsvertreter beschäftigen?", "antworten": ["Ja, der Handelsvertreter vermittelt Fahrdienste und erhält Provision (§ 84 HGB).", "Eine fehlerhafte Rechnung kann nachträglich korrigiert werden, jedoch haftet der Unternehmer für Fehler (§ 14 UStG).", "Nein, der Handelsvertreter vermittelt Fahrdienste und erhält Provision (§ 84 HGB)."], "richtig": 0, "erklaerung": "Ja, der Handelsvertreter vermittelt Fahrdienste und erhält Provision (§ 84 HGB)."}, {"id": 1230, "gesetz": "HGB_BGB", "frage": "#1230 Welche Folgen hat eine Insolvenz eines Taxiunternehmens?", "antworten": ["Der Unternehmer behält die volle Verfügungsbefugnis; der Insolvenzverwalter prüft lediglich einmal jährlich die Buchführung (§ 80 InsO).", "Mit Eröffnung des Insolvenzverfahrens erlischt die Taxigenehmigung automatisch, und alle Arbeitsverhältnisse enden sofort (§ 80 InsO).", "Mit Eröffnung des Insolvenzverfahrens verliert der Unternehmer die Verwaltungs- und Verfügungsbefugnis über sein Vermögen; sie geht auf den Insolvenzverwalter über (§ 80 InsO)."], "richtig": 2, "erklaerung": "Mit Eröffnung des Insolvenzverfahrens verliert der Unternehmer die Verwaltungs- und Verfügungsbefugnis über sein Vermögen; sie geht auf den Insolvenzverwalter über (§ 80 InsO)."}, {"id": 1251, "gesetz": "UStG", "frage": "#1251 Welche steuerlichen Regelungen gelten für Taxiunternehmen hinsichtlich der Umsatzsteuer?", "antworten": ["Fahrten über eine Entfernung von mehr als 50 km oder Fahrten, die nicht innerhalb einer Gemeinde erfolgen, unterliegen dem regulären Steuersatz von 19 % (§ 12 UStG).", "Taxiunternehmen unterliegen der Vorsteuerpflicht und müssen je nach Leistungsart den regulären oder ermäßigten Steuersatz anwenden (§ 1 UStG).", "Taxiunternehmen unterliegen der Umsatzsteuerpflicht und müssen je nach Leistungsart den regulären oder ermäßigten Steuersatz anwenden (§ 1 UStG)."], "richtig": 2, "erklaerung": "Taxiunternehmen unterliegen der Umsatzsteuerpflicht und müssen je nach Leistungsart den regulären oder ermäßigten Steuersatz anwenden (§ 1 UStG)."}, {"id": 1252, "gesetz": "UStG", "frage": "#1252 Welcher Umsatzsteuersatz gilt für Taxifahrten innerhalb einer Stadt?", "antworten": ["Der ermäßigte Umsatzsteuersatz von 7 % gilt für Taxifahrten innerhalb einer Gemeinde oder bis zu einer Strecke von 50 km (§ 12 Abs. 2 Nr. 10 UStG).", "Der ermäßigte Umsatzsteuersatz von 1 % gilt für Taxifahrten innerhalb einer Gemeinde oder bis zu einer Strecke von 50 km (§ 12 Abs. 2 Nr. 10 UStG).", "Der ermäßigte Umsatzsteuersatz von 17 % gilt für Taxifahrten innerhalb einer Gemeinde oder bis zu einer Strecke von 50 km (§ 12 Abs. 2 Nr. 10 UStG)."], "richtig": 0, "erklaerung": "Der ermäßigte Umsatzsteuersatz von 7 % gilt für Taxifahrten innerhalb einer Gemeinde oder bis zu einer Strecke von 50 km (§ 12 Abs. 2 Nr. 10 UStG)."}, {"id": 1253, "gesetz": "UStG", "frage": "#1253 Wann gilt der reguläre Umsatzsteuersatz von 19 % für Taxifahrten?", "antworten": ["Wenn die Fahrt die Gemeindegrenze überschreitet und die Beförderungsstrecke mehr als 50 km beträgt (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "Wenn die Beförderungsstrecke mehr als 30 km beträgt oder die Fahrt nachts zwischen 22 und 6 Uhr erfolgt (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "Wenn die Fahrt die Gemeindegrenze überschreitet, unabhängig von der Länge der Beförderungsstrecke (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG)."], "richtig": 0, "erklaerung": "Wenn die Fahrt die Gemeindegrenze überschreitet und die Beförderungsstrecke mehr als 50 km beträgt (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG)."}, {"id": 1254, "gesetz": "UStG", "frage": "#1254 Welche steuerliche Besonderheit gilt für Mietwagenunternehmen im Gegensatz zu Taxiunternehmen?", "antworten": ["Mietwagenfahrten sind innerhalb der Gemeinde und bis 50 km mit 7 % begünstigt, Taxifahrten dagegen unterliegen immer dem regulären Steuersatz von 19 % (§ 12 Abs. 2 Nr. 10 UStG).", "Mietwagenfahrten gelten als Fahrzeugvermietung und sind umsatzsteuerfrei, während Taxifahrten stets dem Satz von 7 % unterliegen (§ 4 Nr. 12 UStG).", "Mietwagenfahrten unterliegen immer dem regulären Steuersatz von 19 %, da § 12 Abs. 2 Nr. 10 UStG nur den Verkehr mit Taxen begünstigt (§ 12 Abs. 1 UStG)."], "richtig": 2, "erklaerung": "Mietwagenfahrten unterliegen immer dem regulären Steuersatz von 19 %, da § 12 Abs. 2 Nr. 10 UStG nur den Verkehr mit Taxen begünstigt (§ 12 Abs. 1 UStG)."}, {"id": 1255, "gesetz": "UStG", "frage": "#1255 Müssen Taxiunternehmen Umsatzsteuer auf Trinkgelder erheben?", "antworten": ["Ja, auf jedes Trinkgeld fallen 19 % Umsatzsteuer an, auch wenn angestellte Fahrer es vollständig für sich behalten (§ 10 Abs. 1 UStG).", "Alle Trinkgelder sind umsatzsteuerfrei, da sie freiwillig gezahlt werden, auch wenn der Unternehmer sie selbst erhält (§ 10 Abs. 1 UStG).", "Trinkgeld, das der Unternehmer selbst erhält, gehört zum Entgelt und ist umsatzsteuerpflichtig; Trinkgeld, das angestellte Fahrer für sich behalten, nicht (§ 10 Abs. 1 UStG)."], "richtig": 2, "erklaerung": "Trinkgeld, das der Unternehmer selbst erhält, gehört zum Entgelt und ist umsatzsteuerpflichtig; Trinkgeld, das angestellte Fahrer für sich behalten, nicht (§ 10 Abs. 1 UStG)."}, {"id": 1256, "gesetz": "UStG", "frage": "#1256 Welche steuerlichen Pflichten hat ein Taxiunternehmer bezüglich Rechnungen?", "antworten": ["Bei Fahrten für Unternehmer muss er innerhalb von sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen; bis 250 € genügt eine Kleinbetragsrechnung (§ 14 UStG, § 33 UStDV).", "Bei Fahrten für Unternehmer muss er binnen zwei Wochen eine Rechnung ausstellen; Kleinbetragsrechnungen sind im Taxigewerbe unzulässig (§ 14 UStG, § 33 UStDV).", "Er muss für jede Fahrt unabhängig vom Kunden eine Rechnung mit allen Pflichtangaben ausstellen; bis 150 € genügt eine Kleinbetragsrechnung (§ 14 UStG, § 33 UStDV)."], "richtig": 0, "erklaerung": "Bei Fahrten für Unternehmer muss er innerhalb von sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen; bis 250 € genügt eine Kleinbetragsrechnung (§ 14 UStG, § 33 UStDV)."}, {"id": 1257, "gesetz": "UStG", "frage": "#1257 Welche Angaben müssen auf einer ordnungsgemäßen Taxi-Rechnung stehen?", "antworten": ["Name des Fahrers, Taxinummer, Konzessionsnummer, Start- und Zielort, Fahrstrecke in km, Bruttobetrag und Unterschrift des Fahrgastes (§ 14 Abs. 4 UStG); bis 500 € verkürzt (§ 33 UStDV).", "Name und Anschrift des Unternehmers, Steuernummer, Datum und Bruttobetrag; Angaben zu Kunde, Steuersatz und Steuerbetrag sind entbehrlich (§ 14 Abs. 4 UStG); bis 1.000 € verkürzt (§ 33 UStDV).", "Name und Anschrift von Unternehmer und Kunde, Steuernummer oder USt-IdNr., Datum, Rechnungsnummer, Leistung und Leistungszeitpunkt, Entgelt, Steuersatz und Steuerbetrag (§ 14 Abs. 4 UStG); bis 250 € verkürzt (§ 33 UStDV)."], "richtig": 2, "erklaerung": "Name und Anschrift von Unternehmer und Kunde, Steuernummer oder USt-IdNr., Datum, Rechnungsnummer, Leistung und Leistungszeitpunkt, Entgelt, Steuersatz und Steuerbetrag (§ 14 Abs. 4 UStG); bis 250 € verkürzt (§ 33 UStDV)."}, {"id": 1258, "gesetz": "UStG", "frage": "#1258 Darf ein Taxiunternehmen die Vorsteuer aus seinen Betriebsausgaben abziehen?", "antworten": ["Ja, sofern es kein KleinFahrer ist und die Eingangsleistungen für das Unternehmen verwendet werden (§ 15 UStG).", "Ja, sofern es kein Kleinunternehmer ist und die Eingangsleistungen für das Unternehmen verwendet werden (§ 15 UStG).", "Nein, sofern es kein Kleinunternehmer ist und die Eingangsleistungen für das Unternehmen verwendet werden (§ 15 UStG)."], "richtig": 1, "erklaerung": "Ja, sofern es kein Kleinunternehmer ist und die Eingangsleistungen für das Unternehmen verwendet werden (§ 15 UStG)."}, {"id": 1259, "gesetz": "UStG", "frage": "#1259 Kann ein Taxiunternehmen die Kleinunternehmerregelung nutzen?", "antworten": ["Nein, Personenbeförderungsunternehmen sind von der Kleinunternehmerregelung ausgeschlossen (§ 19 UStG).", "Ja, wenn der Umsatz im Vorjahr 25.000 € und im laufenden Jahr 100.000 € nicht übersteigt (§ 19 UStG).", "Ja, wenn der Umsatz im Vorjahr 22.000 € und im laufenden Jahr 50.000 € nicht übersteigt (§ 19 UStG)."], "richtig": 1, "erklaerung": "Ja, wenn der Umsatz im Vorjahr 25.000 € und im laufenden Jahr 100.000 € nicht übersteigt (§ 19 UStG)."}, {"id": 1260, "gesetz": "UStG", "frage": "#1260 Welche steuerlichen Vorteile und Nachteile hat die Kleinunternehmerregelung für ein Taxiunternehmen?", "antworten": ["Vorteil: Keine Umsatzsteuerabführung an das Finanzamt. Nachteil: Kein Umsatzsteuerabzug möglich (§ 19 UStG).", "Vorteil: Keine Vorsteuerabführung an das Finanzamt. Nachteil: Kein Vorsteuerabzug möglich (§ 19 UStG).", "Vorteil: Keine Umsatzsteuerabführung an das Finanzamt. Nachteil: Kein Vorsteuerabzug möglich (§ 19 UStG)."], "richtig": 2, "erklaerung": "Vorteil: Keine Umsatzsteuerabführung an das Finanzamt. Nachteil: Kein Vorsteuerabzug möglich (§ 19 UStG)."}, {"id": 1261, "gesetz": "UStG", "frage": "#1261 Was gilt als steuerbarer Umsatz im Taxi- und Mietwagenverkehr?", "antworten": ["Alle Beförderungsleistungen gegen Entgelt im Inland unterliegen der Vorsteuer (§ 1 Abs. 1 UStG).", "Alle Beförderungsleistungen gegen Entgelt im Inland unterliegen der Umsatzsteuer (§ 1 Abs. 1 UStG).", "Name und Anschrift des Unternehmers, Datum, Beförderungsstrecke, Umsatzsteuerbetrag und Steuersatz (§ 14 Abs. 4 UStG)."], "richtig": 1, "erklaerung": "Alle Beförderungsleistungen gegen Entgelt im Inland unterliegen der Umsatzsteuer (§ 1 Abs. 1 UStG)."}, {"id": 1262, "gesetz": "UStG", "frage": "#1262 Wann entsteht die Umsatzsteuerpflicht bei Taxiunternehmen?", "antworten": ["Erst mit Abgabe der Umsatzsteuer-Jahreserklärung, unabhängig davon, wann die Fahrt ausgeführt oder bezahlt wurde (§ 13 Abs. 1 Nr. 1 UStG).", "Mit Ausstellung der Rechnung bzw. Quittung; wird keine Quittung erteilt, entsteht für die Fahrt keine Umsatzsteuer (§ 13 Abs. 1 Nr. 1 UStG).", "Mit Ablauf des Voranmeldungszeitraums, in dem die Fahrt ausgeführt (Soll-Besteuerung) bzw. bei Ist-Besteuerung das Entgelt vereinnahmt wurde (§ 13 Abs. 1 Nr. 1 UStG)."], "richtig": 2, "erklaerung": "Mit Ablauf des Voranmeldungszeitraums, in dem die Fahrt ausgeführt (Soll-Besteuerung) bzw. bei Ist-Besteuerung das Entgelt vereinnahmt wurde (§ 13 Abs. 1 Nr. 1 UStG)."}, {"id": 1263, "gesetz": "UStG", "frage": "#1263 Wie oft müssen Taxiunternehmen ihre Umsatzsteuervoranmeldung abgeben?", "antworten": ["Monatlich ohne Ausnahme; vierteljährlich nur bei Kleinunternehmern mit weniger als 1.000 € Steuer im Vorjahr (§ 18 Abs. 2 UStG).", "Jährlich; vierteljährlich erst, wenn die Umsatzsteuer des Vorjahres mehr als 25.000 € betrug; eine Befreiung ist nicht möglich, auch nicht auf Antrag (§ 18 Abs. 2 UStG).", "Vierteljährlich; monatlich, wenn die Umsatzsteuer des Vorjahres mehr als 9.000 € betrug; bei bis zu 2.000 € ist eine Befreiung möglich (§ 18 Abs. 2 UStG)."], "richtig": 2, "erklaerung": "Vierteljährlich; monatlich, wenn die Umsatzsteuer des Vorjahres mehr als 9.000 € betrug; bei bis zu 2.000 € ist eine Befreiung möglich (§ 18 Abs. 2 UStG)."}, {"id": 1264, "gesetz": "UStG", "frage": "#1264 Was passiert, wenn ein Taxiunternehmer keine Umsatzsteuer anmeldet?", "antworten": ["Es drohen Nachzahlungen, Zinsen und ggf. Bußgelder (§ 26a UStG).", "Der ermäßigte Umsatzsteuersatz von 7 % gilt für Taxifahrten innerhalb einer Gemeinde oder bis zu einer Strecke von 50 km (§ 12 Abs. 2 Nr. 10 UStG).", "Vorteil: Keine Umsatzsteuerabführung an das Finanzamt. Nachteil: Kein Vorsteuerabzug möglich (§ 19 UStG)."], "richtig": 0, "erklaerung": "Es drohen Nachzahlungen, Zinsen und ggf. Bußgelder (§ 26a UStG)."}, {"id": 1265, "gesetz": "UStG", "frage": "#1265 Welche steuerlichen Verpflichtungen hat ein Taxiunternehmen gegenüber dem Finanzamt?", "antworten": ["Nur eine jährliche Umsatzsteuererklärung; Voranmeldungen und Aufzeichnungen sind nicht vorgeschrieben (§§ 18, 22 UStG).", "Umsatzsteuervoranmeldungen, Jahressteuererklärung und ordnungsgemäße Aufzeichnungen (§§ 18, 22 UStG).", "Nur Voranmeldungen; die Jahreserklärung entfällt bei pünktlicher Abgabe aller Voranmeldungen (§§ 18, 22 UStG)."], "richtig": 1, "erklaerung": "Umsatzsteuervoranmeldungen, Jahressteuererklärung und ordnungsgemäße Aufzeichnungen (§§ 18, 22 UStG)."}, {"id": 1266, "gesetz": "UStG", "frage": "#1266 Wann darf ein Taxiunternehmen die vereinnahmten Entgelte als Besteuerungsgrundlage nutzen?", "antworten": ["Auf Antrag beim Finanzamt (Ist-Besteuerung), wenn der Gesamtumsatz im Vorjahr nicht mehr als 800.000 € betrug (§ 20 UStG).", "Automatisch ohne Antrag, wenn der Gesamtumsatz im Vorjahr nicht mehr als 250.000 € betrug (§ 20 UStG).", "Nur bei Kapitalgesellschaften auf Antrag, wenn der Gesamtumsatz im Vorjahr mehr als 800.000 € betrug und sie bilanzieren (§ 20 UStG)."], "richtig": 0, "erklaerung": "Auf Antrag beim Finanzamt (Ist-Besteuerung), wenn der Gesamtumsatz im Vorjahr nicht mehr als 800.000 € betrug (§ 20 UStG)."}, {"id": 1267, "gesetz": "UStG", "frage": "#1267 Wann kann ein Taxiunternehmen die Soll-Besteuerung nutzen?", "antworten": ["Die Soll-Besteuerung (nach vereinbarten Entgelten) ist der Regelfall; sie gilt immer, wenn keine Ist-Besteuerung genehmigt wurde (§ 16 Abs. 1 UStG).", "Nur auf Antrag beim Finanzamt und nur, wenn der Gesamtumsatz im Vorjahr 800.000 € übersteigt (§ 16 Abs. 1 UStG).", "Nur Mietwagenunternehmen dürfen sie nutzen; für Taxiunternehmen ist die Ist-Besteuerung gesetzlich vorgeschrieben (§ 16 Abs. 1 UStG)."], "richtig": 0, "erklaerung": "Die Soll-Besteuerung (nach vereinbarten Entgelten) ist der Regelfall; sie gilt immer, wenn keine Ist-Besteuerung genehmigt wurde (§ 16 Abs. 1 UStG)."}, {"id": 1268, "gesetz": "UStG", "frage": "#1268 Darf ein Taxiunternehmen die Umsatzsteuer auf Fahrten ins Ausland erheben?", "antworten": ["Ja, für die gesamte Strecke einschließlich Auslandsanteil, da der Unternehmer seinen Sitz in Deutschland hat und das Taxi dort zugelassen ist (§ 3b Abs. 1 UStG).", "Ja, für den inländischen Streckenanteil; nur der im Ausland zurückgelegte Teil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG).", "Nein, Fahrten ins Ausland sind insgesamt steuerfrei, auch für den im Inland zurückgelegten Streckenanteil (§ 3b Abs. 1 UStG)."], "richtig": 1, "erklaerung": "Ja, für den inländischen Streckenanteil; nur der im Ausland zurückgelegte Teil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG)."}, {"id": 1269, "gesetz": "UStG", "frage": "#1269 Welche steuerlichen Regelungen gelten für den Verkauf eines Taxi-Fahrzeugs?", "antworten": ["Der Verkauf unterliegt der Umsatzsteuer, sofern kein Privatverkauf vorliegt (§ 3 UStG).", "Der Verkauf unterliegt der Vorsteuer, sofern kein Privatverkauf vorliegt (§ 3 UStG).", "Der Verkauf unterliegt der Umsatzsteuer, sofern kein öffentlichverkauf vorliegt (§ 3 UStG)."], "richtig": 0, "erklaerung": "Der Verkauf unterliegt der Umsatzsteuer, sofern kein Privatverkauf vorliegt (§ 3 UStG)."}, {"id": 1270, "gesetz": "UStG", "frage": "#1270 Wie wird die Umsatzsteuer bei Leasingfahrzeugen für Taxiunternehmen behandelt?", "antworten": ["Die monatlichen Leasingraten enthalten Umsatzsteuer, die als Vorsteuer abziehbar ist (§ 15 UStG).", "Die monatlichen Leasingraten enthalten Vorsteuer, die als Vorsteuer abziehbar ist (§ 15 UStG).", "Die monatlichen Leasingraten enthalten Umsatzsteuer, die als Umsatzsteuer abziehbar ist (§ 15 UStG)."], "richtig": 0, "erklaerung": "Die monatlichen Leasingraten enthalten Umsatzsteuer, die als Vorsteuer abziehbar ist (§ 15 UStG)."}, {"id": 1271, "gesetz": "UStG", "frage": "#1271 Wie wird der Vorsteuerabzug bei gemischt genutzten Fahrzeugen im Taxi-Gewerbe geregelt?", "antworten": ["Bei gemischt genutzten Fahrzeugen ist der Vorsteuerabzug ausgeschlossen; nur ausschließlich betrieblich genutzte Taxen berechtigen dazu; die Vorsteuer kann erst beim späteren Verkauf geltend gemacht werden (§ 15 Abs. 1, § 3 Abs. 9a UStG).", "Bei mindestens 10 % betrieblicher Nutzung kann das Fahrzeug dem Unternehmen zugeordnet und die Vorsteuer voll abgezogen werden; die Privatnutzung ist dann als unentgeltliche Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG).", "Bei mindestens 50 % betrieblicher Nutzung ist die Vorsteuer zur Hälfte abziehbar; die Privatnutzung bleibt dann umsatzsteuerfrei und muss nicht gesondert erfasst werden (§ 15 Abs. 1, § 3 Abs. 9a UStG)."], "richtig": 1, "erklaerung": "Bei mindestens 10 % betrieblicher Nutzung kann das Fahrzeug dem Unternehmen zugeordnet und die Vorsteuer voll abgezogen werden; die Privatnutzung ist dann als unentgeltliche Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG)."}, {"id": 1272, "gesetz": "UStG", "frage": "#1272 Wie werden Gutscheine für Taxifahrten umsatzsteuerlich behandelt?", "antworten": ["Name und Anschrift des Unternehmers, Datum, Beförderungsstrecke, Umsatzsteuerbetrag und Steuersatz (§ 14 Abs. 4 UStG).", "Einzweck-Gutscheine unterliegen bereits bei Ausgabe der Umsatzsteuer, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 UStG).", "Einzweck-Gutscheine unterliegen bereits bei Ausgabe der Vorsteuer, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 UStG)."], "richtig": 1, "erklaerung": "Einzweck-Gutscheine unterliegen bereits bei Ausgabe der Umsatzsteuer, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 UStG)."}, {"id": 1273, "gesetz": "UStG", "frage": "#1273 Welche Umsatzsteuerregelungen gelten für die Personenbeförderung in Mietwagen?", "antworten": ["Mietwagenleistungen unterliegen grundsätzlich dem vollen Steuersatz von 29 % (§ 12 UStG).", "Mietwagenleistungen unterliegen grundsätzlich dem vollen Steuersatz von 9 % (§ 12 UStG).", "Mietwagenleistungen unterliegen grundsätzlich dem vollen Steuersatz von 19 % (§ 12 UStG)."], "richtig": 2, "erklaerung": "Mietwagenleistungen unterliegen grundsätzlich dem vollen Steuersatz von 19 % (§ 12 UStG)."}, {"id": 1274, "gesetz": "UStG", "frage": "#1274 Was passiert mit der Umsatzsteuer, wenn ein Taxiunternehmen steuerfreie Umsätze hat?", "antworten": ["Der Vorsteuerabzug kann anteilig entfallen (§ 15 Abs. 2 UStG).", "Der Umsatzsteuerabzug kann anteilig entfallen (§ 15 Abs. 2 UStG).", "Die monatlichen Leasingraten enthalten Umsatzsteuer, die als Vorsteuer abziehbar ist (§ 15 UStG)."], "richtig": 0, "erklaerung": "Der Vorsteuerabzug kann anteilig entfallen (§ 15 Abs. 2 UStG)."}, {"id": 1275, "gesetz": "UStG", "frage": "#1275 Wann kann ein Taxiunternehmen auf die Steuerbefreiung nach § 4 UStG verzichten?", "antworten": ["Nur bei den in § 9 UStG genannten Umsätzen (z. B. Vermietung von Grundstücken) an andere Unternehmer für deren Unternehmen, um den Vorsteuerabzug zu erhalten (§ 9 Abs. 1 UStG).", "Bei allen steuerfreien Umsätzen, auch an Privatpersonen, durch formlose mündliche Erklärung gegenüber dem Fahrgast vor Fahrtbeginn, um den Vorsteuerabzug zu erhalten (§ 9 Abs. 1 UStG).", "Nur bei Krankenfahrten nach § 4 Nr. 17 UStG an gesetzliche Krankenkassen, wenn diese schriftlich zustimmen, um den Vorsteuerabzug aus Fahrzeugkosten zu erhalten (§ 9 Abs. 1 UStG)."], "richtig": 0, "erklaerung": "Nur bei den in § 9 UStG genannten Umsätzen (z. B. Vermietung von Grundstücken) an andere Unternehmer für deren Unternehmen, um den Vorsteuerabzug zu erhalten (§ 9 Abs. 1 UStG)."}, {"id": 1276, "gesetz": "UStG", "frage": "#1276 Was ist die Differenzbesteuerung, und gilt sie für Taxiunternehmen?", "antworten": ["Mietwagenleistungen unterliegen grundsätzlich dem vollen Steuersatz von 19 % (§ 12 UStG).", "Nein, freiwillige Trinkgelder sind umsatzsteuerfrei (§ 1 Abs. 1 Nr. 1 UStG in Verbindung mit § 3 UStG).", "Sie gilt für Gebrauchtwarenhändler, aber nicht für Taxiunternehmen, da sie regelmäßig Dienstleistungen erbringen (§ 25a UStG)."], "richtig": 2, "erklaerung": "Sie gilt für Gebrauchtwarenhändler, aber nicht für Taxiunternehmen, da sie regelmäßig Dienstleistungen erbringen (§ 25a UStG)."}, {"id": 1277, "gesetz": "UStG", "frage": "#1277 Welche Rolle spielt die Umsatzsteuer-Identifikationsnummer (USt-IdNr.) für Taxiunternehmen?", "antworten": ["Sie ist für innergemeinschaftliche Geschäfte erforderlich, aber im Inland meist nicht nötig (§ 27a UStG).", "Einzweck-Gutscheine unterliegen bereits bei Ausgabe der Umsatzsteuer, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 UStG).", "Der Vorsteuerabzug kann anteilig entfallen (§ 15 Abs. 2 UStG)."], "richtig": 0, "erklaerung": "Sie ist für innergemeinschaftliche Geschäfte erforderlich, aber im Inland meist nicht nötig (§ 27a UStG)."}, {"id": 1278, "gesetz": "UStG", "frage": "#1278 Welche steuerlichen Regelungen gelten für Fahrten im Rahmen von Krankenbeförderungen?", "antworten": ["Alle Krankenfahrten im Auftrag einer Krankenkasse sind steuerfrei, auch wenn sie in einem normalen Taxi durchgeführt werden (§ 4 Nr. 17 Buchst. b UStG).", "Nur Beförderungen kranker oder verletzter Personen in besonders dafür eingerichteten Fahrzeugen sind steuerfrei; Krankenfahrten im normalen Taxi sind steuerpflichtig (§ 4 Nr. 17 Buchst. b UStG).", "Krankenfahrten im normalen Taxi sind steuerfrei, Fahrten in besonders eingerichteten Fahrzeugen unterliegen dagegen 19 % (§ 4 Nr. 17 Buchst. b UStG)."], "richtig": 1, "erklaerung": "Nur Beförderungen kranker oder verletzter Personen in besonders dafür eingerichteten Fahrzeugen sind steuerfrei; Krankenfahrten im normalen Taxi sind steuerpflichtig (§ 4 Nr. 17 Buchst. b UStG)."}, {"id": 1279, "gesetz": "UStG", "frage": "#1279 Darf ein Taxiunternehmer ohne Umsatzsteuer arbeiten, wenn er für gemeinnützige Zwecke fährt?", "antworten": ["Nein, Fahrten eines gewerblichen Taxiunternehmers bleiben auch im Auftrag gemeinnütziger Organisationen steuerpflichtig; § 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen (§ 4 Nr. 18 UStG).", "Ja, gewerbliche Taxiunternehmer werden auf Antrag selbst als gemeinnützig anerkannt, wenn sie überwiegend Vereine und Verbände befördern (§ 4 Nr. 18 UStG).", "Ja, Fahrten für gemeinnützige Organisationen sind steuerfrei, wenn der Auftraggeber eine Freistellungsbescheinigung vorlegt; § 4 Nr. 18 UStG gilt für alle Beförderer (§ 4 Nr. 18 UStG)."], "richtig": 0, "erklaerung": "Nein, Fahrten eines gewerblichen Taxiunternehmers bleiben auch im Auftrag gemeinnütziger Organisationen steuerpflichtig; § 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen (§ 4 Nr. 18 UStG)."}, {"id": 1280, "gesetz": "UStG", "frage": "#1280 Wie werden steuerliche Fehler bei der Umsatzsteuer bereinigt?", "antworten": ["Fehler werden erst bei der nächsten Außenprüfung durch das Finanzamt korrigiert; eine eigene Korrektur ist nicht vorgesehen (§ 18 UStG, § 153 AO).", "Fehlerhafte Voranmeldungen oder Erklärungen sind unverzüglich durch eine berichtigte Anmeldung zu korrigieren (§ 18 UStG, § 153 AO).", "Fehlerhafte Voranmeldungen sind ausschließlich durch eine Selbstanzeige bei der Staatsanwaltschaft zu korrigieren (§ 18 UStG, § 153 AO)."], "richtig": 1, "erklaerung": "Fehlerhafte Voranmeldungen oder Erklärungen sind unverzüglich durch eine berichtigte Anmeldung zu korrigieren (§ 18 UStG, § 153 AO)."}, {"id": 1301, "gesetz": "UStDV", "frage": "#1301 Welche steuerlichen Vorschriften gelten für Taxi- und Mietwagenunternehmen laut UStDV?", "antworten": ["Die UStDV ergänzt das UStG und regelt die praktische Umsetzung, u. a. Rechnungsangaben, Fahrausweise, Nachweis- und Aufzeichnungspflichten (§§ 31–35, 63–65 UStDV).", "Die UStDV regelt ausschließlich die Kraftfahrzeugsteuer für Taxen und Mietwagen einschließlich der Steuerbefreiungen für Elektrofahrzeuge bis zum Jahr 2030 (§§ 31–35, 63–65 UStDV).", "Die UStDV ersetzt für Personenbeförderer das UStG und legt eigene Steuersätze für Taxi- und Mietwagenfahrten fest (§§ 31–35, 63–65 UStDV)."], "richtig": 0, "erklaerung": "Die UStDV ergänzt das UStG und regelt die praktische Umsetzung, u. a. Rechnungsangaben, Fahrausweise, Nachweis- und Aufzeichnungspflichten (§§ 31–35, 63–65 UStDV)."}, {"id": 1302, "gesetz": "UStDV", "frage": "#1302 Welche steuerlichen Nachweise müssen Taxiunternehmen für steuerfreie Umsätze führen?", "antworten": ["Der Nachweis richtet sich nach der jeweiligen Befreiung (z. B. Ausfuhr: §§ 8–13 UStDV); Taxifahrten sind in der Regel nicht steuerfrei. Steuerfreie Umsätze sind gesondert aufzuzeichnen (§ 22 UStG, § 63 UStDV).", "Taxifahrten sind grundsätzlich steuerfrei; der Nachweis erfolgt allein durch den Taxameterausdruck, eine gesonderte Aufzeichnung ist nicht nötig. Belege müssen auch für Betriebsprüfungen nicht aufbewahrt werden (§ 22 UStG, § 63 UStDV).", "Für steuerfreie Umsätze genügt eine mündliche Bestätigung des Fahrgastes; Aufzeichnungen sind nur für steuerpflichtige Umsätze zu führen. Belege sind entbehrlich (§ 22 UStG, § 63 UStDV)."], "richtig": 0, "erklaerung": "Der Nachweis richtet sich nach der jeweiligen Befreiung (z. B. Ausfuhr: §§ 8–13 UStDV); Taxifahrten sind in der Regel nicht steuerfrei. Steuerfreie Umsätze sind gesondert aufzuzeichnen (§ 22 UStG, § 63 UStDV)."}, {"id": 1303, "gesetz": "UStDV", "frage": "#1303 Gilt der ermäßigte Umsatzsteuersatz von 7 % auch für Mietwagenunternehmen?", "antworten": ["Nein, Mietwagenunternehmen unterliegen immer dem regulären Umsatzsteuersatz von 19 %; begünstigt ist nur der Verkehr mit Taxen (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "Ja, aber nur für Mietwagenfahrten innerhalb der Gemeinde; Fahrten über die Gemeindegrenze hinaus unterliegen ab dem ersten gefahrenen Kilometer 19 % (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG).", "Ja, Mietwagen werden wie Taxen behandelt: innerhalb der Gemeinde oder bis 50 km gilt der ermäßigte Satz von 7 % (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG)."], "richtig": 0, "erklaerung": "Nein, Mietwagenunternehmen unterliegen immer dem regulären Umsatzsteuersatz von 19 %; begünstigt ist nur der Verkehr mit Taxen (§ 12 Abs. 1, Abs. 2 Nr. 10 UStG)."}, {"id": 1304, "gesetz": "UStDV", "frage": "#1304 Wie müssen Taxiunternehmen ihre Rechnungen ausstellen?", "antworten": ["Es gilt das Steuerrecht des Landes, in dem der Hauptsitz angemeldet ist (§ 3 UStG).", "Taxiunternehmen können eine Fristverlängerung beantragen, wenn sie eine Sondervorauszahlung leisten (§§ 46-48 UStDV).", "Rechnungen müssen den Anforderungen der UStDV entsprechen und Angaben wie Steuersatz, Betrag und Rechnungsnummer enthalten (§§ 31-34 UStDV)."], "richtig": 2, "erklaerung": "Rechnungen müssen den Anforderungen der UStDV entsprechen und Angaben wie Steuersatz, Betrag und Rechnungsnummer enthalten (§§ 31-34 UStDV)."}, {"id": 1305, "gesetz": "UStDV", "frage": "#1305 Welche Vorschriften gibt es für Kleinbetragsrechnungen im Taxi- und Mietwagengewerbe?", "antworten": ["Bei einem Nettobetrag bis 100 € kann ganz auf eine Rechnung verzichtet werden (§ 33 UStDV).", "Bei einem Gesamtbetrag bis 150 € sind vereinfachte Rechnungsangaben zulässig (§ 33 UStDV).", "Bei einem Gesamtbetrag bis 250 € sind vereinfachte Rechnungsangaben zulässig (§ 33 UStDV)."], "richtig": 2, "erklaerung": "Bei einem Gesamtbetrag bis 250 € sind vereinfachte Rechnungsangaben zulässig (§ 33 UStDV)."}, {"id": 1306, "gesetz": "UStDV", "frage": "#1306 Sind Fahrausweise im Taxigewerbe als Rechnungen anerkannt?", "antworten": ["Sie müssen ihre Umsätze lückenlos dokumentieren und steuerliche Vorteile nutzen (§ 65 UStDV).", "Nein, unter bestimmten Voraussetzungen gelten Fahrausweise als Rechnungen (§ 34 UStDV).", "Ja, unter bestimmten Voraussetzungen gelten Fahrausweise als Rechnungen (§ 34 UStDV)."], "richtig": 2, "erklaerung": "Ja, unter bestimmten Voraussetzungen gelten Fahrausweise als Rechnungen (§ 34 UStDV)."}, {"id": 1307, "gesetz": "UStDV", "frage": "#1307 Welche Steuerpflichten hat ein Taxiunternehmen bei der Rechnungsstellung an Geschäftskunden?", "antworten": ["Er muss binnen eines Monats eine Rechnung ausstellen, die stets auf Papier und vom Fahrer unterschrieben sein muss; Fahrausweise sind unzulässig (§ 14 UStG, §§ 33, 34 UStDV).", "Er muss binnen sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen, grundsätzlich als E-Rechnung (Übergangsfristen); Kleinbetragsrechnungen und Fahrausweise sind ausgenommen (§ 14 UStG, §§ 33, 34 UStDV).", "Rechnungen an Geschäftskunden sind nur auf ausdrückliches Verlangen auszustellen; stets genügt ein Taxameterbeleg ohne Steuerangaben (§ 14 UStG, §§ 33, 34 UStDV)."], "richtig": 1, "erklaerung": "Er muss binnen sechs Monaten eine Rechnung mit allen Pflichtangaben ausstellen, grundsätzlich als E-Rechnung (Übergangsfristen); Kleinbetragsrechnungen und Fahrausweise sind ausgenommen (§ 14 UStG, §§ 33, 34 UStDV)."}, {"id": 1308, "gesetz": "UStDV", "frage": "#1308 Welche Besonderheiten gelten für die Buchführungspflicht von Taxiunternehmen?", "antworten": ["Taxiunternehmen müssen ihre Umsätze genau aufzeichnen und steuerlich nachweisen (§§ 63-65 UStDV).", "Buchmäßiger Nachweis erforderlich, um Steuerfreiheit gemäß § 4 UStG zu belegen (§ 21 UStDV).", "Einzweck-Gutscheine unterliegen der Umsatzsteuer bereits bei Ausgabe, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 UStG, § 20 UStDV)."], "richtig": 0, "erklaerung": "Taxiunternehmen müssen ihre Umsätze genau aufzeichnen und steuerlich nachweisen (§§ 63-65 UStDV)."}, {"id": 1309, "gesetz": "UStDV", "frage": "#1309 Was ist der buchmäßige Nachweis bei steuerfreien Leistungen?", "antworten": ["Bei Fahrten ins Ausland, sofern der Nachweis gemäß § 8 UStDV geführt wird.", "Dokumentation über Art, Umfang und Empfänger der Leistung, um die Steuerbefreiung zu belegen (§ 21 UStDV).", "Unternehmer müssen den Gelangensnachweis erbringen (§§ 17a-17d UStDV)."], "richtig": 1, "erklaerung": "Dokumentation über Art, Umfang und Empfänger der Leistung, um die Steuerbefreiung zu belegen (§ 21 UStDV)."}, {"id": 1310, "gesetz": "UStDV", "frage": "#1310 Welche steuerlichen Konsequenzen hat eine falsche Umsatzsteuererklärung für Taxiunternehmen?", "antworten": ["Falsche Angaben können zu Steuernachzahlungen, Bußgeldern oder Zinsforderungen führen (§ 26a UStG).", "Sie müssen ihre Umsätze aufzeichnen und angeben, dass sie steuerfrei nach § 19 UStG arbeiten (§ 65 UStDV).", "Dokumentation über Art, Umfang und Empfänger der Leistung, um die Steuerbefreiung zu belegen (§ 21 UStDV)."], "richtig": 0, "erklaerung": "Falsche Angaben können zu Steuernachzahlungen, Bußgeldern oder Zinsforderungen führen (§ 26a UStG)."}, {"id": 1311, "gesetz": "UStDV", "frage": "#1311 Wann gilt eine Beförderungsleistung als im Inland steuerpflichtig?", "antworten": ["Wenn der Fahrgast seinen Wohnsitz im Inland hat; Beförderungen ausländischer Fahrgäste sind nicht steuerbar (§ 3b Abs. 1 UStG, §§ 2–7 UStDV).", "Soweit die Beförderung im Inland bewirkt wird; bei grenzüberschreitenden Fahrten ist nur der inländische Streckenanteil steuerbar (§ 3b Abs. 1 UStG, §§ 2–7 UStDV).", "Wenn der Unternehmer seinen Sitz oder Wohnsitz im Inland hat; dann ist die gesamte Strecke einschließlich des Auslandsanteils in Deutschland steuerbar (§ 3b Abs. 1 UStG, §§ 2–7 UStDV)."], "richtig": 1, "erklaerung": "Soweit die Beförderung im Inland bewirkt wird; bei grenzüberschreitenden Fahrten ist nur der inländische Streckenanteil steuerbar (§ 3b Abs. 1 UStG, §§ 2–7 UStDV)."}, {"id": 1312, "gesetz": "UStDV", "frage": "#1312 Welche Regeln gelten für die Vorsteuerabzugsfähigkeit von Taxiunternehmen?", "antworten": ["Taxiunternehmer sind wegen des ermäßigten Steuersatzes von 7 % grundsätzlich vom Vorsteuerabzug ausgeschlossen (§ 15 Abs. 1 UStG).", "Unternehmer können die Vorsteuer abziehen, wenn die Leistung für das Unternehmen bezogen wurde und eine ordnungsgemäße Rechnung vorliegt (§ 15 Abs. 1 UStG).", "Unternehmer können die Vorsteuer nur abziehen, wenn sie die Rechnung binnen zwei Wochen vollständig bezahlt haben (§ 15 Abs. 1 UStG)."], "richtig": 1, "erklaerung": "Unternehmer können die Vorsteuer abziehen, wenn die Leistung für das Unternehmen bezogen wurde und eine ordnungsgemäße Rechnung vorliegt (§ 15 Abs. 1 UStG)."}, {"id": 1313, "gesetz": "UStDV", "frage": "#1313 Wann gilt eine Dauerfristverlängerung für die Umsatzsteuervoranmeldung?", "antworten": ["Auf Antrag verlängert sich die Frist um einen Monat; Monatszahler müssen dafür eine Sondervorauszahlung von 1/11 der Vorjahresvorauszahlungen leisten (§§ 46–48 UStDV).", "Die Frist verlängert sich automatisch um zehn Tage; Monatszahler leisten eine Sondervorauszahlung von 1/12 der Jahressteuer (§§ 46–48 UStDV).", "Auf Antrag verlängert sich die Frist um zwei Monate; eine Sondervorauszahlung müssen nur Vierteljahreszahler leisten (§§ 46–48 UStDV)."], "richtig": 0, "erklaerung": "Auf Antrag verlängert sich die Frist um einen Monat; Monatszahler müssen dafür eine Sondervorauszahlung von 1/11 der Vorjahresvorauszahlungen leisten (§§ 46–48 UStDV)."}, {"id": 1314, "gesetz": "UStDV", "frage": "#1314 Wie wird die Umsatzsteuer bei Leasingfahrzeugen im Taxi-Gewerbe behandelt?", "antworten": ["Leasingraten enthalten Umsatzsteuer, die bei ordnungsgemäßer Rechnung als Vorsteuer abziehbar ist (§ 15 Abs. 1 UStG).", "Leasingraten sind umsatzsteuerfrei, daher ist ein Vorsteuerabzug bei Leasingfahrzeugen ausgeschlossen (§ 15 Abs. 1 UStG).", "Die Vorsteuer aus Leasingra
