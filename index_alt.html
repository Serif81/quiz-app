, Fahrgäste informieren und falls nötig ein Ersatzfahrzeug organisieren."}, {"id": 273, "gesetz": "StraßenGesetz", "frage": "#0273 Welche Pflichten hat ein Taxifahrer nach einem Unfall?", "antworten": ["Fahrgäste zuerst zum Ziel bringen, danach zur Unfallstelle zurückkehren und die Polizei rufen; Angaben zu Führerschein und Versicherung sind nur gegenüber der Polizei zu machen (§ 34 StVO, § 142 StGB).", "Unfallstelle zügig räumen, Name und Telefonnummer per Zettel hinterlassen und den Unfall binnen 48 Stunden dem Unternehmer melden; Erste Hilfe ist nur bei eigener Schuld zu leisten (§ 34 StVO, § 142 StGB).", "Sofort anhalten, Unfallstelle sichern, Verletzten helfen, Beteiligung angeben und auf Verlangen Name, Anschrift, Führerschein, Fahrzeugschein und Versicherung nennen; ist kein Feststellungsberechtigter da, angemessen warten (§ 34 StVO, § 142 StGB)."], "richtig": 2, "erklaerung": "Sofort anhalten, Unfallstelle sichern, Verletzten helfen, Beteiligung angeben und auf Verlangen Name, Anschrift, Führerschein, Fahrzeugschein und Versicherung nennen; ist kein Feststellungsberechtigter da, angemessen warten (§ 34 StVO, § 142 StGB)."}, {"id": 274, "gesetz": "StraßenGesetz", "frage": "#0274 Darf ein Taxifahrer nach einem Unfall die Unfallstelle verlassen?", "antworten": ["Nein, er muss in jedem Fall an der Unfallstelle bleiben, bis die Polizei eintrifft, auch wenn alle Beteiligten ihre Daten bereits ausgetauscht haben und nur ein geringer Sachschaden entstanden ist (§ 142 StGB).", "Ja, aber erst wenn er die Feststellung seiner Person, seines Fahrzeugs und seiner Beteiligung ermöglicht oder eine angemessene Zeit gewartet hat; dann muss er die Feststellungen unverzüglich nachträglich ermöglichen. Ein Zettel am Fahrzeug genügt nicht (§ 142 StGB).", "Ja, sofort, wenn er Fahrgäste befördert, da die Beförderungspflicht Vorrang hat; ein Zettel mit Name und Telefonnummer am beschädigten Fahrzeug genügt zur Erfüllung aller seiner Pflichten (§ 142 StGB)."], "richtig": 1, "erklaerung": "Ja, aber erst wenn er die Feststellung seiner Person, seines Fahrzeugs und seiner Beteiligung ermöglicht oder eine angemessene Zeit gewartet hat; dann muss er die Feststellungen unverzüglich nachträglich ermöglichen. Ein Zettel am Fahrzeug genügt nicht (§ 142 StGB)."}, {"id": 275, "gesetz": "StraßenGesetz", "frage": "#0275 Welche Erste-Hilfe-Maßnahmen sollte ein Taxifahrer kennen?", "antworten": ["Der fließende Verkehr darf nicht behindert oder gefährdet werden. Bei Unübersichtlichkeit muss eine Hilfsperson hinzugezogen werden (§ 10 StVO).", "Stabilisierung von Verletzten, Absichern der Unfallstelle, Notruf absetzen (§ 323c StGB – unterlassene Hilfeleistung).", "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO)."], "richtig": 1, "erklaerung": "Stabilisierung von Verletzten, Absichern der Unfallstelle, Notruf absetzen (§ 323c StGB – unterlassene Hilfeleistung)."}, {"id": 276, "gesetz": "StraßenGesetz", "frage": "#0276 Darf ein Fahrgast den Fahrpreis verweigern?", "antworten": ["Nein, der Fahrpreis ist aus dem Beförderungsvertrag geschuldet; zu zahlen ist nur das zulässige Tarifentgelt (§ 51 PBefG, § 37 BOKraft). Bis zur Erteilung einer verlangten Quittung darf der Fahrgast die Zahlung zurückhalten (§ 368 BGB).", "Ja, wenn er mit der gewählten Fahrstrecke unzufrieden ist, darf er die Zahlung vollständig verweigern (§ 51 PBefG, § 37 BOKraft). Eine Quittung kann er erst nach Zahlung und nur gegen Gebühr verlangen (§ 368 BGB).", "Nein, er muss stets den angezeigten Betrag zahlen, auch wenn dieser über dem zulässigen Tarifentgelt liegt (§ 51 PBefG, § 37 BOKraft). Einen Anspruch auf eine Quittung hat er im Taxiverkehr nicht (§ 368 BGB)."], "richtig": 0, "erklaerung": "Nein, der Fahrpreis ist aus dem Beförderungsvertrag geschuldet; zu zahlen ist nur das zulässige Tarifentgelt (§ 51 PBefG, § 37 BOKraft). Bis zur Erteilung einer verlangten Quittung darf der Fahrgast die Zahlung zurückhalten (§ 368 BGB)."}, {"id": 277, "gesetz": "StraßenGesetz", "frage": "#0277 Kann ein Taxifahrer einen Fahrgast ablehnen?", "antworten": ["Ja, jederzeit ohne Angabe von Gründen, z. B. bei kurzen Strecken, bei Fahrgästen mit viel Gepäck oder wenn sich eine Fahrt wirtschaftlich nicht lohnt, da im Taxiverkehr anders als im Linienverkehr keine Beförderungspflicht besteht (§ 13 BOKraft, § 22 PBefG).", "Ja, wenn Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft), oder wenn die Voraussetzungen der Beförderungspflicht fehlen bzw. die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 22, § 47 Abs. 4 PBefG).", "Nein, niemals; die Beförderungspflicht gilt ausnahmslos, auch bei betrunkenen oder gewalttätigen Fahrgästen, die andere Fahrgäste gefährden, und auch für Fahrten weit außerhalb des Pflichtfahrbereichs (§ 22, § 47 Abs. 4 PBefG)."], "richtig": 1, "erklaerung": "Ja, wenn Tatsachen die Annahme rechtfertigen, dass der Fahrgast eine Gefahr für Sicherheit und Ordnung oder für die Fahrgäste darstellt (§ 13 BOKraft), oder wenn die Voraussetzungen der Beförderungspflicht fehlen bzw. die Fahrt außerhalb des Pflichtfahrbereichs liegt (§ 22, § 47 Abs. 4 PBefG)."}, {"id": 278, "gesetz": "StraßenGesetz", "frage": "#0278 Welche Folgen hat eine Trunkenheitsfahrt für einen Taxifahrer?", "antworten": ["Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 2 Jahre (§ 2a StVG).", "Entzug der Fahrerlaubnis, Fahrverbot, hohe Geldstrafe (§ 24a StVG, § 316 StGB).", "Entzug der Unternehmerlaubnis, Fahrverbot, hohe Geldstrafe (§ 24a StVG, § 316 StGB)."], "richtig": 1, "erklaerung": "Entzug der Fahrerlaubnis, Fahrverbot, hohe Geldstrafe (§ 24a StVG, § 316 StGB)."}, {"id": 279, "gesetz": "StraßenGesetz", "frage": "#0279 Was passiert, wenn ein Taxi unter Verstoß gegen Umweltzonen-Bestimmungen fährt?", "antworten": ["Geldbuße (Regelsatz 80 €) und ein Punkt in Flensburg; Taxis sind als öffentliche Verkehrsmittel von der Plakettenpflicht befreit (Zeichen 270.1 StVO i. V. m. 35. BImSchV).", "Geldbuße (Regelsatz 100 €), kein Fahrverbot; ohne gültige Plakette darf in Umweltzonen nicht gefahren werden (Zeichen 270.1 StVO i. V. m. 35. BImSchV).", "Geldbuße (Regelsatz 250 €) und ein Monat Fahrverbot; ohne gültige Plakette darf in Umweltzonen nicht gefahren werden (Zeichen 270.1 StVO i. V. m. 35. BImSchV)."], "richtig": 1, "erklaerung": "Geldbuße (Regelsatz 100 €), kein Fahrverbot; ohne gültige Plakette darf in Umweltzonen nicht gefahren werden (Zeichen 270.1 StVO i. V. m. 35. BImSchV)."}, {"id": 280, "gesetz": "StraßenGesetz", "frage": "#0280 Welche Strafen drohen bei unerlaubtem Halten oder Parken im Halteverbot?", "antworten": ["Ja, aber nur zum Ein- oder Aussteigenlassen von Fahrgästen, wenn die Verkehrslage es zulässt (§ 12 Abs. 4 StVO).", "Geldbuße, ggf. Abschleppen des Fahrzeugs (§ 12 StVO).", "Stabilisierung von Verletzten, Absichern der Unfallstelle, Notruf absetzen (§ 323c StGB – unterlassene Hilfeleistung)."], "richtig": 1, "erklaerung": "Geldbuße, ggf. Abschleppen des Fahrzeugs (§ 12 StVO)."}, {"id": 301, "gesetz": "StraßenGesetz", "frage": "#0301 Welche Grundregeln gelten für alle Verkehrsteilnehmer?", "antworten": ["Ständige Vorsicht und gegenseitige Rücksichtnahme sind erforderlich. Niemand darf geschädigt, gefährdet oder unnötig behindert oder belästigt werden (§ 1 StVO).", "100 km/h, wenn keine andere Regelung besteht (§ 3 Abs. 3 StVO).", "Führerschein, Personenbeförderungsschein, Fahrzeugschein (§ 2 StVG)."], "richtig": 0, "erklaerung": "Ständige Vorsicht und gegenseitige Rücksichtnahme sind erforderlich. Niemand darf geschädigt, gefährdet oder unnötig behindert oder belästigt werden (§ 1 StVO)."}, {"id": 302, "gesetz": "StraßenGesetz", "frage": "#0302 Wo müssen Fahrzeuge grundsätzlich fahren?", "antworten": ["Sobald Fahrzeuge auf Autobahnen oder Straßen mit mindestens zwei Fahrstreifen für eine Richtung mit Schrittgeschwindigkeit fahren oder stehen (§ 11 Abs. 2 StVO).", "Fahrzeuge müssen die Fahrbahn benutzen und möglichst weit rechts fahren (§ 2 StVO).", "Sie muss leichtgängig, zuverlässig und mit einer wirksamen Lenkradsperre versehen sein (§ 38 StVZO)."], "richtig": 1, "erklaerung": "Fahrzeuge müssen die Fahrbahn benutzen und möglichst weit rechts fahren (§ 2 StVO)."}, {"id": 303, "gesetz": "StraßenGesetz", "frage": "#0303 Wann muss ein Taxi im Winter mit speziellen Reifen ausgerüstet sein?", "antworten": ["Bei Glatteis, Schneeglätte, Schneematsch, Eisglätte oder Reifglätte müssen alle Räder mit Winterreifen ausgestattet sein (§ 2 Abs. 3a StVO).", "Sichtkontrolle des Fahrzeugs, Prüfung der Beleuchtung, Reifen und Bremsen (§ 23 StVO).", "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO)."], "richtig": 0, "erklaerung": "Bei Glatteis, Schneeglätte, Schneematsch, Eisglätte oder Reifglätte müssen alle Räder mit Winterreifen ausgestattet sein (§ 2 Abs. 3a StVO)."}, {"id": 304, "gesetz": "StraßenGesetz", "frage": "#0304 Darf ein Taxi auf einem Radweg fahren?", "antworten": ["Ja, wenn der Radweg frei ist und Schrittgeschwindigkeit eingehalten wird (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 237 StVO).", "Ja, zum Ein- und Aussteigen von Fahrgästen jederzeit für kurze Strecken (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 237 StVO).", "Nein, es sei denn, die Benutzung ist durch Zusatzzeichen erlaubt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 237 StVO)."], "richtig": 2, "erklaerung": "Nein, es sei denn, die Benutzung ist durch Zusatzzeichen erlaubt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 237 StVO)."}, {"id": 305, "gesetz": "StraßenGesetz", "frage": "#0305 Welche besonderen Vorschriften gelten für die Nutzung von Busspuren?", "antworten": ["Taxis dürfen Busspuren nur benutzen, wenn ein Zusatzzeichen dies erlaubt; an Bushaltestellen dürfen sie zum sofortigen Ein- und Aussteigen halten (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 245 StVO).", "Taxis dürfen Busspuren nur mit Fahrgästen an Bord benutzen; an Bushaltestellen ist ihnen auch das Halten zum Ein- und Aussteigen verboten (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 245 StVO).", "Taxis dürfen Busspuren als Teil des ÖPNV immer benutzen, auch ohne Zusatzzeichen; an Bushaltestellen dürfen sie bis zu drei Minuten parken (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 245 StVO)."], "richtig": 0, "erklaerung": "Taxis dürfen Busspuren nur benutzen, wenn ein Zusatzzeichen dies erlaubt; an Bushaltestellen dürfen sie zum sofortigen Ein- und Aussteigen halten (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 245 StVO)."}, {"id": 306, "gesetz": "StraßenGesetz", "frage": "#0306 Wie muss die Geschwindigkeit im Straßenverkehr angepasst werden?", "antworten": ["Nein, es sei denn, der Fahrer verstößt gegen Tarifbestimmungen oder verweigert eine Quittung (§ 39 PBefG).", "Hellelfenbein (RAL 1015) nach § 26 PBefG (in vielen Städten vorgeschrieben).", "Die Geschwindigkeit muss den Straßen-, Verkehrs-, Sicht- und Wetterverhältnissen sowie den persönlichen Fähigkeiten angepasst werden (§ 3 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "Die Geschwindigkeit muss den Straßen-, Verkehrs-, Sicht- und Wetterverhältnissen sowie den persönlichen Fähigkeiten angepasst werden (§ 3 Abs. 1 StVO)."}, {"id": 307, "gesetz": "StraßenGesetz", "frage": "#0307 Welche Höchstgeschwindigkeit gilt innerorts für Taxis?", "antworten": ["Geldbuße, ggf. Abschleppen des Fahrzeugs (§ 12 StVO).", "50 km/h, wenn nicht durch Verkehrszeichen eine andere Geschwindigkeit vorgegeben ist (§ 3 Abs. 3 StVO).", "Die Verkehrs- und Betriebssicherheit sowie die Umweltverträglichkeit des Fahrzeugs (§ 29 StVZO)."], "richtig": 1, "erklaerung": "50 km/h, wenn nicht durch Verkehrszeichen eine andere Geschwindigkeit vorgegeben ist (§ 3 Abs. 3 StVO)."}, {"id": 308, "gesetz": "StraßenGesetz", "frage": "#0308 Welche Höchstgeschwindigkeit gilt für Taxis auf Landstraßen?", "antworten": ["100 km/h, wenn keine andere Regelung besteht (§ 3 Abs. 3 StVO).", "Hellelfenbein (RAL 1015) nach § 26 PBefG (in vielen Städten vorgeschrieben).", "Gültige Hauptuntersuchung, geeichter Fahrpreisanzeiger und betriebssichere Ausstattung (§ 29 StVZO)."], "richtig": 0, "erklaerung": "100 km/h, wenn keine andere Regelung besteht (§ 3 Abs. 3 StVO)."}, {"id": 309, "gesetz": "StraßenGesetz", "frage": "#0309 Wie groß muss der Abstand zum vorausfahrenden Fahrzeug sein?", "antworten": ["Punkte in Flensburg, Bußgeld, ggf. Fahrverbot (§ 4 StVG).", "Wenn Änderungen vorgenommen werden, die die Fahrzeugart ändern, die Sicherheit gefährden oder das Abgas- bzw. Geräuschverhalten verschlechtern (§ 19 StVZO).", "So groß, dass auch bei plötzlichem Bremsen sicher gehalten werden kann (§ 4 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "So groß, dass auch bei plötzlichem Bremsen sicher gehalten werden kann (§ 4 Abs. 1 StVO)."}, {"id": 310, "gesetz": "StraßenGesetz", "frage": "#0310 Welche Abstandsregel gilt auf Autobahnen für Fahrzeuge über 3,5 Tonnen?", "antworten": ["Mindestens 50 m Abstand bei mehr als 50 km/h (§ 4 Abs. 3 StVO).", "Alle Personen müssen während der Fahrt Sicherheitsgurte anlegen (§ 21a StVO).", "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO)."], "richtig": 0, "erklaerung": "Mindestens 50 m Abstand bei mehr als 50 km/h (§ 4 Abs. 3 StVO)."}, {"id": 311, "gesetz": "StraßenGesetz", "frage": "#0311 Wo darf überholt werden?", "antworten": ["Grundsätzlich links, außer wenn rechts überholen ausdrücklich erlaubt ist (§ 5 Abs. 1 StVO).", "Nein, es sei denn, es liegt keine Meldepflicht vor oder er hinterlässt seine Daten (§ 142 StGB – Unfallflucht).", "Nur wenn sie nach der StVZO erlaubt ist, z. B. das Taxi-Dachzeichen (§ 52 StVZO)."], "richtig": 0, "erklaerung": "Grundsätzlich links, außer wenn rechts überholen ausdrücklich erlaubt ist (§ 5 Abs. 1 StVO)."}, {"id": 312, "gesetz": "StraßenGesetz", "frage": "#0312 Wann ist das Überholen verboten?", "antworten": ["Nein, es sei denn, es liegt keine Meldepflicht vor oder er hinterlässt seine Daten (§ 142 StGB – Unfallflucht).", "Scheinwerfer für Fern- und Abblendlicht, Schlussleuchten, Bremsleuchten, Fahrtrichtungsanzeiger und eine Innenbeleuchtung (§ 49a StVZO).", "Bei unklarer Verkehrslage oder wenn es durch Verkehrszeichen untersagt ist (§ 5 Abs. 3 StVO)."], "richtig": 2, "erklaerung": "Bei unklarer Verkehrslage oder wenn es durch Verkehrszeichen untersagt ist (§ 5 Abs. 3 StVO)."}, {"id": 313, "gesetz": "StraßenGesetz", "frage": "#0313 Wann darf innerorts rechts überholt werden?", "antworten": ["Kfz bis 3,5 t dürfen innerorts auf Fahrbahnen mit mehreren markierten Fahrstreifen für eine Richtung den Fahrstreifen frei wählen und rechts schneller als links fahren (§ 7 Abs. 3 StVO).", "Rechts überholen ist innerorts ausnahmslos verboten; nur Krafträder dürfen an wartenden Fahrzeugen rechts vorbeifahren, wenn ausreichend Platz ist (§ 7 Abs. 3 StVO).", "Alle Kfz dürfen innerorts rechts überholen, sobald der Vorausfahrende die zulässige Höchstgeschwindigkeit unterschreitet, auch bei nur einem Fahrstreifen (§ 7 Abs. 3 StVO)."], "richtig": 0, "erklaerung": "Kfz bis 3,5 t dürfen innerorts auf Fahrbahnen mit mehreren markierten Fahrstreifen für eine Richtung den Fahrstreifen frei wählen und rechts schneller als links fahren (§ 7 Abs. 3 StVO)."}, {"id": 314, "gesetz": "StraßenGesetz", "frage": "#0314 Wer hat Vorfahrt an einer Kreuzung ohne Verkehrszeichen?", "antworten": ["Scheinwerfer für Fern- und Abblendlicht, Schlussleuchten, Bremsleuchten, Fahrtrichtungsanzeiger und eine Innenbeleuchtung (§ 49a StVZO).", "Nein, es sei denn, der Fahrer verstößt gegen Tarifbestimmungen oder verweigert eine Quittung (§ 39 PBefG).", "Wer von rechts kommt, hat Vorfahrt (§ 8 StVO)."], "richtig": 2, "erklaerung": "Wer von rechts kommt, hat Vorfahrt (§ 8 StVO)."}, {"id": 315, "gesetz": "StraßenGesetz", "frage": "#0315 Welche Regel gilt für Kreisverkehre mit Vorfahrtsschild?", "antworten": ["Fahrzeuge im Kreisverkehr haben Vorfahrt; bei der Einfahrt darf nicht geblinkt werden (§ 8 Abs. 1a StVO).", "Sofort anhalten, Unfallstelle sichern, Polizei rufen (bei Personen- oder Sachschaden), Personalien austauschen (§ 34 StVO).", "Bei behördlicher Anordnung nach Verkehrsverstößen (§ 31a StVZO)."], "richtig": 0, "erklaerung": "Fahrzeuge im Kreisverkehr haben Vorfahrt; bei der Einfahrt darf nicht geblinkt werden (§ 8 Abs. 1a StVO)."}, {"id": 316, "gesetz": "StraßenGesetz", "frage": "#0316 Wo ist das Halten verboten?", "antworten": ["Mietwagen müssen die gleiche Sicherheitsausstattung wie andere gewerblich genutzte Fahrzeuge aufweisen (§ 35a StVZO).", "Wer von rechts kommt, hat Vorfahrt (§ 8 StVO).", "In engen und unübersichtlichen Straßenstellen, in scharfen Kurven, auf Bahnübergängen oder auf Einfädelungs- und Ausfädelungsstreifen (§ 12 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "In engen und unübersichtlichen Straßenstellen, in scharfen Kurven, auf Bahnübergängen oder auf Einfädelungs- und Ausfädelungsstreifen (§ 12 Abs. 1 StVO)."}, {"id": 317, "gesetz": "StraßenGesetz", "frage": "#0317 Darf ein Taxi in zweiter Reihe halten?", "antworten": ["Ja, aber nur zum Ein- oder Aussteigenlassen von Fahrgästen, wenn die Verkehrslage es zulässt (§ 12 Abs. 4 StVO).", "Entzug der Fahrerlaubnis, Fahrverbot, hohe Geldstrafe (§ 24a StVG, § 316 StGB).", "Nein, aber nur zum Ein- oder Aussteigenlassen von Fahrgästen, wenn die Verkehrslage es zulässt (§ 12 Abs. 4 StVO)."], "richtig": 0, "erklaerung": "Ja, aber nur zum Ein- oder Aussteigenlassen von Fahrgästen, wenn die Verkehrslage es zulässt (§ 12 Abs. 4 StVO)."}, {"id": 318, "gesetz": "StraßenGesetz", "frage": "#0318 Wann wird aus Halten Parken?", "antworten": ["Wenn das Fahrzeug länger als drei Minuten steht oder der Fahrer es verlässt (§ 12 Abs. 2 StVO).", "Wenn Änderungen vorgenommen werden, die die Fahrzeugart ändern, die Sicherheit gefährden oder das Abgas- bzw. Geräuschverhalten verschlechtern (§ 19 StVZO).", "Wenn das Fahrzeug länger als drei Minuten steht oder der Unternehmer es verlässt (§ 12 Abs. 2 StVO)."], "richtig": 0, "erklaerung": "Wenn das Fahrzeug länger als drei Minuten steht oder der Fahrer es verlässt (§ 12 Abs. 2 StVO)."}, {"id": 319, "gesetz": "StraßenGesetz", "frage": "#0319 Wo ist das Parken verboten?", "antworten": ["Das Kraftfahrt-Bundesamt (§ 20 StVZO).", "Unter anderem an Kreuzungen, vor Grundstückszufahrten, auf Gehwegen ohne entsprechende Markierung oder an Bushaltestellen (§ 12 Abs. 3 StVO).", "Die örtliche Zulassungsstelle (§ 1 StVG)."], "richtig": 1, "erklaerung": "Unter anderem an Kreuzungen, vor Grundstückszufahrten, auf Gehwegen ohne entsprechende Markierung oder an Bushaltestellen (§ 12 Abs. 3 StVO)."}, {"id": 320, "gesetz": "StraßenGesetz", "frage": "#0320 Darf ein Taxi auf einem Behindertenparkplatz stehen?", "antworten": ["Ja, Taxis dürfen dort bis zu 30 Minuten parken, wenn sie auf einen Fahrgast warten, auch ohne Parkausweis (§ 42 Abs. 2 i. V. m. Anlage 3 Zeichen 314 StVO).", "Nein, Parken nur, wenn ein gültiger Parkausweis für schwerbehinderte Menschen (z. B. des beförderten Fahrgasts) gut lesbar ausliegt (§ 42 Abs. 2 i. V. m. Anlage 3 Zeichen 314 StVO).", "Ja, Taxis gelten als Fahrzeuge zur Beförderung behinderter Menschen und dürfen dort generell ohne Ausweis parken (§ 42 Abs. 2 i. V. m. Anlage 3 Zeichen 314 StVO)."], "richtig": 1, "erklaerung": "Nein, Parken nur, wenn ein gültiger Parkausweis für schwerbehinderte Menschen (z. B. des beförderten Fahrgasts) gut lesbar ausliegt (§ 42 Abs. 2 i. V. m. Anlage 3 Zeichen 314 StVO)."}, {"id": 321, "gesetz": "StraßenGesetz", "frage": "#0321 Wie müssen Fahrgäste in Taxis gesichert werden?", "antworten": ["100 km/h, wenn keine andere Regelung besteht (§ 3 Abs. 3 StVO).", "Alle Personen müssen während der Fahrt Sicherheitsgurte anlegen (§ 21a StVO).", "Technische Änderungen müssen von der Zulassungsstelle oder einer Prüforganisation abgenommen werden (§ 19 StVZO)."], "richtig": 1, "erklaerung": "Alle Personen müssen während der Fahrt Sicherheitsgurte anlegen (§ 21a StVO)."}, {"id": 322, "gesetz": "StraßenGesetz", "frage": "#0322 Welche Regelungen gelten für die Beförderung von Kindern in Taxis?", "antworten": ["Kinder bis 12 Jahre unter 150 cm brauchen eine geeignete Kinderrückhalteeinrichtung. In Taxen ist die Pflicht auf Rücksitzen auf zwei Kinder ab 9 kg beschränkt (mind. eine Sicherung für 9–18 kg); nicht bei regelmäßiger Kinderbeförderung (§ 21 Abs. 1a StVO).", "Kinder bis 14 Jahre unter 160 cm brauchen eine Kinderrückhalteeinrichtung. In Taxen entfällt die Pflicht vollständig; Kinder dürfen dort stets nur mit dem Erwachsenengurt gesichert werden (§ 21 Abs. 1a StVO).", "Kinder bis 12 Jahre unter 150 cm brauchen einen Kindersitz. In Taxen muss für jedes beförderte Kind ein passender Sitz vorhanden sein, mindestens drei Sitze aller Gewichtsklassen (§ 21 Abs. 1a StVO)."], "richtig": 0, "erklaerung": "Kinder bis 12 Jahre unter 150 cm brauchen eine geeignete Kinderrückhalteeinrichtung. In Taxen ist die Pflicht auf Rücksitzen auf zwei Kinder ab 9 kg beschränkt (mind. eine Sicherung für 9–18 kg); nicht bei regelmäßiger Kinderbeförderung (§ 21 Abs. 1a StVO)."}, {"id": 323, "gesetz": "StraßenGesetz", "frage": "#0323 Darf ein Taxi mehr Fahrgäste mitnehmen, als Sitzplätze vorhanden sind?", "antworten": ["Ja, es dürfen nur so viele Fahrgäste befördert werden, wie Sitzplätze mit Sicherheitsgurten vorhanden sind (§ 21 StVO).", "Nein, es dürfen nur so viele Fahrgäste befördert werden, wie Sitzplätze mit Sicherheitsgurten vorhanden sind (§ 21 StVO).", "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO)."], "richtig": 1, "erklaerung": "Nein, es dürfen nur so viele Fahrgäste befördert werden, wie Sitzplätze mit Sicherheitsgurten vorhanden sind (§ 21 StVO)."}, {"id": 324, "gesetz": "StraßenGesetz", "frage": "#0324 Welche Vorschrift gilt für den Transport von Gepäck im Taxi?", "antworten": ["Bei Ersterwerb einer Fahrerlaubnis, Probezeit beträgt 2 Jahre (§ 2a StVG).", "Gepäck muss so verstaut sein, dass es die Verkehrssicherheit nicht beeinträchtigt (§ 22 Abs. 1 StVO).", "Alle 5 Jahre (§ 48 FeV)."], "richtig": 1, "erklaerung": "Gepäck muss so verstaut sein, dass es die Verkehrssicherheit nicht beeinträchtigt (§ 22 Abs. 1 StVO)."}, {"id": 325, "gesetz": "StraßenGesetz", "frage": "#0325 Wann müssen Fahrgäste in einem Taxi angeschnallt sein?", "antworten": ["Immer, es sei denn, sie sind von der Gurtpflicht befreit (§ 21a StVO).", "Nein, es sei denn, der Fahrer verstößt gegen Tarifbestimmungen oder verweigert eine Quittung (§ 39 PBefG).", "Der Personenbeförderungsschein (§ 2 Abs. 3 StVG)."], "richtig": 0, "erklaerung": "Immer, es sei denn, sie sind von der Gurtpflicht befreit (§ 21a StVO)."}, {"id": 326, "gesetz": "StraßenGesetz", "frage": "#0326 Wann muss eine Rettungsgasse gebildet werden?", "antworten": ["Nur auf Autobahnen mit mindestens drei Fahrstreifen, sobald der Verkehr vollständig zum Stillstand gekommen ist; die Gasse ist zwischen dem mittleren und dem rechten Fahrstreifen zu bilden (§ 11 Abs. 2 StVO).", "Sobald Fahrzeuge auf Autobahnen oder Außerortsstraßen mit mindestens zwei Fahrstreifen für eine Richtung mit Schrittgeschwindigkeit fahren oder stehen; die Gasse ist zwischen dem äußerst linken und dem rechts daneben liegenden Fahrstreifen zu bilden (§ 11 Abs. 2 StVO).", "Erst wenn sich ein Einsatzfahrzeug mit Blaulicht und Martinshorn tatsächlich nähert und sichtbar ist; die Gasse ist durch Ausweichen aller Fahrzeuge auf den Standstreifen bzw. ganz nach rechts zu bilden (§ 11 Abs. 2 StVO)."], "richtig": 1, "erklaerung": "Sobald Fahrzeuge auf Autobahnen oder Außerortsstraßen mit mindestens zwei Fahrstreifen für eine Richtung mit Schrittgeschwindigkeit fahren oder stehen; die Gasse ist zwischen dem äußerst linken und dem rechts daneben liegenden Fahrstreifen zu bilden (§ 11 Abs. 2 StVO)."}, {"id": 327, "gesetz": "StraßenGesetz", "frage": "#0327 Welche Regeln gelten beim Annähern an einen Schulbus mit eingeschaltetem Warnblinklicht?", "antworten": ["Die Regeln gelten nur für den Gegenverkehr; Fahrzeuge in gleicher Fahrtrichtung dürfen den haltenden Bus mit normaler Geschwindigkeit überholen, wenn sie hupen (§ 20 Abs. 3 und 4 StVO).", "Ein sich der Haltestelle nähernder Bus mit Warnblinklicht darf nicht überholt werden; am haltenden Bus nur mit Schrittgeschwindigkeit und ausreichendem Abstand vorbeifahren, wenn nötig warten (§ 20 Abs. 3 und 4 StVO).", "Ein Bus mit Warnblinklicht darf mit höchstens 30 km/h überholt werden; am haltenden Bus darf mit 20 km/h vorbeigefahren werden, Warten ist nie erforderlich (§ 20 Abs. 3 und 4 StVO)."], "richtig": 1, "erklaerung": "Ein sich der Haltestelle nähernder Bus mit Warnblinklicht darf nicht überholt werden; am haltenden Bus nur mit Schrittgeschwindigkeit und ausreichendem Abstand vorbeifahren, wenn nötig warten (§ 20 Abs. 3 und 4 StVO)."}, {"id": 328, "gesetz": "StraßenGesetz", "frage": "#0328 Was ist beim Einfahren aus Grundstücken zu beachten?", "antworten": ["Es genügt, mit Schrittgeschwindigkeit einzufahren und zu hupen; ein Fahrtrichtungsanzeiger ist beim Einfahren aus Grundstücken nicht erforderlich (§ 10 StVO).", "Der fließende Verkehr muss dem Einfahrenden Vorrang gewähren, sofern dieser rechtzeitig blinkt; einweisen lassen muss man sich nur mit Lkw (§ 10 StVO).", "Eine Gefährdung anderer Verkehrsteilnehmer muss ausgeschlossen sein, erforderlichenfalls muss man sich einweisen lassen; das Einfahren ist mit dem Fahrtrichtungsanzeiger anzukündigen (§ 10 StVO)."], "richtig": 2, "erklaerung": "Eine Gefährdung anderer Verkehrsteilnehmer muss ausgeschlossen sein, erforderlichenfalls muss man sich einweisen lassen; das Einfahren ist mit dem Fahrtrichtungsanzeiger anzukündigen (§ 10 StVO)."}, {"id": 329, "gesetz": "StraßenGesetz", "frage": "#0329 Wann darf ein Taxi in einer Umweltzone fahren?", "antworten": ["Nein, es sei denn, es ist ausdrücklich durch Verkehrszeichen erlaubt (§ 2 Abs. 4 StVO).", "Bei wiederholten Verstößen gegen das Personenbeförderungsgesetz (§ 25 PBefG).", "Nur mit einer gültigen Umweltplakette oder einer Sondergenehmigung (§ 40 BImSchG)."], "richtig": 2, "erklaerung": "Nur mit einer gültigen Umweltplakette oder einer Sondergenehmigung (§ 40 BImSchG)."}, {"id": 330, "gesetz": "StraßenGesetz", "frage": "#0330 Wann darf ein Taxi in einer Fußgängerzone fahren?", "antworten": ["Nur wenn ein Zusatzzeichen dies (ggf. zeitlich begrenzt) erlaubt oder eine Ausnahmegenehmigung vorliegt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 242.1, § 46 StVO).", "Nachts zwischen 22 und 6 Uhr mit Schrittgeschwindigkeit, ohne dass es eines Zusatzzeichens bedarf (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 242.1, § 46 StVO).", "Jederzeit zum Ein- und Aussteigen von Fahrgästen, da Taxis als öffentliche Verkehrsmittel von Zeichen 242.1 generell ausgenommen sind (§ 41 Abs. 1 i. V. m. Anlage 2 StVO)."], "richtig": 0, "erklaerung": "Nur wenn ein Zusatzzeichen dies (ggf. zeitlich begrenzt) erlaubt oder eine Ausnahmegenehmigung vorliegt (§ 41 Abs. 1 i. V. m. Anlage 2 Zeichen 242.1, § 46 StVO)."}, {"id": 351, "gesetz": "StraßenGesetz", "frage": "#0351 Wann ist ein Fahrzeug für den öffentlichen Straßenverkehr zugelassen?", "antworten": ["Hellelfenbein (RAL 1015) nach § 26 PBefG (in vielen Städten vorgeschrieben).", "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO).", "Scheinwerfer für Fern- und Abblendlicht, Schlussleuchten, Bremsleuchten, Fahrtrichtungsanzeiger und eine Innenbeleuchtung (§ 49a StVZO)."], "richtig": 1, "erklaerung": "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO)."}, {"id": 352, "gesetz": "StraßenGesetz", "frage": "#0352 Wann kann eine Zulassung entzogen werden?", "antworten": ["Wenn das Fahrzeug nicht vorschriftsmäßig ist und Mängel nicht fristgerecht behoben werden; die Behörde kann den Betrieb beschränken oder untersagen (§ 5 FZV; für zulassungsfreie Fahrzeuge § 17 StVZO).", "Nur wenn die Kfz-Steuer länger als zwölf Monate nicht gezahlt wurde; technische Mängel berechtigen die Behörde nicht zur Untersagung des Betriebs (§ 5 FZV; § 17 StVZO).", "Automatisch bei jeder Überschreitung der HU-Frist um mehr als einen Monat; die Zulassung erlischt dann kraft Gesetzes ohne behördliche Entscheidung (§ 5 FZV; § 17 StVZO)."], "richtig": 0, "erklaerung": "Wenn das Fahrzeug nicht vorschriftsmäßig ist und Mängel nicht fristgerecht behoben werden; die Behörde kann den Betrieb beschränken oder untersagen (§ 5 FZV; für zulassungsfreie Fahrzeuge § 17 StVZO)."}, {"id": 353, "gesetz": "StraßenGesetz", "frage": "#0353 Wann erlischt die Betriebserlaubnis eines Fahrzeugs?", "antworten": ["Wenn Änderungen vorgenommen werden, die die Fahrzeugart ändern, die Sicherheit gefährden oder das Abgas- bzw. Geräuschverhalten verschlechtern (§ 19 StVZO).", "Dachzeichen „TAXI“ und geeichter Fahrpreisanzeiger (§ 47 PBefG).", "In engen und unübersichtlichen Straßenstellen, in scharfen Kurven, auf Bahnübergängen oder auf Einfädelungs- und Ausfädelungsstreifen (§ 12 Abs. 1 StVO)."], "richtig": 0, "erklaerung": "Wenn Änderungen vorgenommen werden, die die Fahrzeugart ändern, die Sicherheit gefährden oder das Abgas- bzw. Geräuschverhalten verschlechtern (§ 19 StVZO)."}, {"id": 354, "gesetz": "StraßenGesetz", "frage": "#0354 Wer ist für die Erteilung der allgemeinen Betriebserlaubnis zuständig?", "antworten": ["Es darf nur mit Schrittgeschwindigkeit und ausreichend Abstand passiert werden. Falls nötig, muss gewartet werden (§ 20 Abs. 2 StVO).", "Scheinwerfer für Fern- und Abblendlicht, Schlussleuchten, Bremsleuchten, Fahrtrichtungsanzeiger und eine Innenbeleuchtung (§ 49a StVZO).", "Das Kraftfahrt-Bundesamt (§ 20 StVZO)."], "richtig": 2, "erklaerung": "Das Kraftfahrt-Bundesamt (§ 20 StVZO)."}, {"id": 355, "gesetz": "StraßenGesetz", "frage": "#0355 Wann ist eine Einzelbetriebserlaubnis erforderlich?", "antworten": ["Es darf nur mit Schrittgeschwindigkeit und ausreichend Abstand passiert werden. Falls nötig, muss gewartet werden (§ 20 Abs. 2 StVO).", "Bei wiederholten Verstößen gegen das Personenbeförderungsgesetz (§ 25 PBefG).", "Wenn das Fahrzeug nicht zu einem genehmigten Typ gehört (§ 21 StVZO)."], "richtig": 2, "erklaerung": "Wenn das Fahrzeug nicht zu einem genehmigten Typ gehört (§ 21 StVZO)."}, {"id": 356, "gesetz": "StraßenGesetz", "frage": "#0356 Welche Anforderungen müssen Fahrzeuge grundsätzlich erfüllen?", "antworten": ["Sie müssen lediglich eine gültige Typgenehmigung besitzen; Belästigungen durch Lärm oder Abgase sind unerheblich, solange niemand verletzt wird (§ 30 StVZO).", "Ihr Betrieb darf niemanden schädigen oder mehr als unvermeidbar gefährden, behindern oder belästigen; Insassen sind möglichst zu schützen; die Bauweise muss straßenschonend sein (§ 30 StVZO).", "Ihr Betrieb darf niemanden verletzen; der Schutz der Insassen ist allein Sache des Herstellers und keine Anforderung an die Bauweise des Fahrzeugs (§ 30 StVZO)."], "richtig": 1, "erklaerung": "Ihr Betrieb darf niemanden schädigen oder mehr als unvermeidbar gefährden, behindern oder belästigen; Insassen sind möglichst zu schützen; die Bauweise muss straßenschonend sein (§ 30 StVZO)."}, {"id": 357, "gesetz": "StraßenGesetz", "frage": "#0357 Welche Fahrzeugteile benötigen eine Bauartgenehmigung?", "antworten": ["Fahrzeugteile wie Bremsen, Beleuchtungseinrichtungen und Rückhaltesysteme (§ 22a StVZO).", "Nur Fahrzeugteile wie Felgen, Sitzbezüge und Fußmatten (§ 22a StVZO).", "Ausnahmslos alle Fahrzeugteile, auch Radio und Navigationsgerät (§ 22a StVZO)."], "richtig": 0, "erklaerung": "Fahrzeugteile wie Bremsen, Beleuchtungseinrichtungen und Rückhaltesysteme (§ 22a StVZO)."}, {"id": 358, "gesetz": "StraßenGesetz", "frage": "#0358 Welche Sicherheitsausstattung ist für Taxis Pflicht?", "antworten": ["Sicherheitsgurte (§ 35a), Warndreieck (§ 53a), Verbandkasten (§ 35h StVZO); zusätzlich für Taxen ein Fahrtenschreiber (§ 57a StVZO).", "Sicherheitsgurte (§ 35a), Warndreieck und Warnweste (§ 53a), Verbandkasten (§ 35h StVZO); zusätzlich für Taxen ein Fahrpreisanzeiger (§ 28 BOKraft).", "Sicherheitsgurte (§ 35a), Feuerlöscher (§ 35g), Unterlegkeil (§ 41 StVZO); zusätzlich für Taxen eine Trennwand zum Fahrgastraum (§ 28 BOKraft)."], "richtig": 1, "erklaerung": "Sicherheitsgurte (§ 35a), Warndreieck und Warnweste (§ 53a), Verbandkasten (§ 35h StVZO); zusätzlich für Taxen ein Fahrpreisanzeiger (§ 28 BOKraft)."}, {"id": 359, "gesetz": "StraßenGesetz", "frage": "#0359 Welche Anforderungen gelten für die Lenkung eines Fahrzeugs?", "antworten": ["Sie muss leichtes und sicheres Lenken gewährleisten, wenn nötig mit Lenkhilfe; bei deren Versagen muss die Lenkbarkeit erhalten bleiben (§ 38 StVZO).", "Sie muss ohne Lenkhilfe auskommen, da Servolenkungen bei Taxen wegen der Ausfallgefahr unzulässig sind (§ 38 StVZO).", "Nur Fahrzeuge über 3,5 t brauchen eine Lenkhilfe; bei deren Versagen darf das Fahrzeug unlenkbar werden (§ 38 StVZO)."], "richtig": 0, "erklaerung": "Sie muss leichtes und sicheres Lenken gewährleisten, wenn nötig mit Lenkhilfe; bei deren Versagen muss die Lenkbarkeit erhalten bleiben (§ 38 StVZO)."}, {"id": 360, "gesetz": "StraßenGesetz", "frage": "#0360 Welche Anforderungen gelten für die Bereifung eines Fahrzeugs?", "antworten": ["Sicherung der Unfallstelle, Fahrgäste informieren und falls nötig Ersatzfahrzeug organisieren (§ 15 StVO).", "Reifen müssen eine ausreichende Profiltiefe haben und den Witterungsverhältnissen entsprechen (§ 36 StVZO).", "Es darf nur mit Schrittgeschwindigkeit und ausreichend Abstand passiert werden. Falls nötig, muss gewartet werden (§ 20 Abs. 2 StVO)."], "richtig": 1, "erklaerung": "Reifen müssen eine ausreichende Profiltiefe haben und den Witterungsverhältnissen entsprechen (§ 36 StVZO)."}, {"id": 361, "gesetz": "StraßenGesetz", "frage": "#0361 Welche lichttechnischen Einrichtungen müssen Taxis haben?", "antworten": ["Nur Abblendlicht, Schluss- und Bremsleuchten (§§ 49a ff. StVZO); Fahrtrichtungsanzeiger und Warnblinkanlage werden bei Taxen durch das beleuchtbare Taxischild ersetzt (§ 26 BOKraft).", "Scheinwerfer für Fern- und Abblendlicht, Begrenzungs-, Schluss- und Bremsleuchten, Fahrtrichtungsanzeiger, Warnblinkanlage und Kennzeichenbeleuchtung (§§ 49a ff. StVZO), zusätzlich das beleuchtbare Taxischild (§ 26 BOKraft).", "Scheinwerfer für Fernlicht, Nebelscheinwerfer, Rückfahrscheinwerfer und eine gelbe Rundumkennleuchte (§§ 49a ff. StVZO), zusätzlich ein blinkendes Taxischild bei jeder Fahrgastbeförderung (§ 26 BOKraft)."], "richtig": 1, "erklaerung": "Scheinwerfer für Fern- und Abblendlicht, Begrenzungs-, Schluss- und Bremsleuchten, Fahrtrichtungsanzeiger, Warnblinkanlage und Kennzeichenbeleuchtung (§§ 49a ff. StVZO), zusätzlich das beleuchtbare Taxischild (§ 26 BOKraft)."}, {"id": 362, "gesetz": "StraßenGesetz", "frage": "#0362 Wann darf ein Taxi eine zusätzliche Beleuchtung nutzen?", "antworten": ["Nur nachts und nur mit einer Genehmigung der IHK, z. B. für eine farbige Unterbodenbeleuchtung (§ 49a Abs. 1 StVZO).", "Jederzeit, solange die Beleuchtung nicht rot oder blau ist, z. B. Lichtleisten oder Werbebildschirme außen (§ 49a Abs. 1 StVZO).", "Nur wenn sie vorgeschrieben oder für zulässig erklärt ist, z. B. das Taxischild nach § 26 Abs. 1 Nr. 2 BOKraft (§ 49a Abs. 1 StVZO)."], "richtig": 2, "erklaerung": "Nur wenn sie vorgeschrieben oder für zulässig erklärt ist, z. B. das Taxischild nach § 26 Abs. 1 Nr. 2 BOKraft (§ 49a Abs. 1 StVZO)."}, {"id": 363, "gesetz": "StraßenGesetz", "frage": "#0363 Welche Farbe muss das Taxidachzeichen haben, wenn es eingeschaltet ist?", "antworten": ["Rot: weiße Aufschrift „Taxi“ auf schwarzem Grund, die Innenbeleuchtung strahlt rotes Blinklicht ab (§ 26 Abs. 1 Nr. 2 i. V. m. Anlage 1 BOKraft).", "Grün: weiße Aufschrift „Taxi“ auf grünem Grund, die Innenbeleuchtung strahlt grünes Dauerlicht ab (§ 26 Abs. 1 Nr. 2 i. V. m. Anlage 1 BOKraft).", "Gelb: gelbe Aufschrift „Taxi“ auf schwarzem Grund, die Innenbeleuchtung strahlt gelbes Dauerlicht ab (§ 26 Abs. 1 Nr. 2 i. V. m. Anlage 1 BOKraft)."], "richtig": 2, "erklaerung": "Gelb: gelbe Aufschrift „Taxi“ auf schwarzem Grund, die Innenbeleuchtung strahlt gelbes Dauerlicht ab (§ 26 Abs. 1 Nr. 2 i. V. m. Anlage 1 BOKraft)."}, {"id": 364, "gesetz": "StraßenGesetz", "frage": "#0364 Wann muss die Warnblinkanlage eingeschaltet werden?", "antworten": ["Nur bei Unfällen mit Personenschaden; beim Abschleppen ist sie verboten, dort ist stattdessen das Fernlicht einzuschalten (§§ 15, 15a, 16 Abs. 2 StVO).", "Bei jedem Halten in zweiter Reihe zum Ein- und Aussteigen von Fahrgästen sowie bei allen Fahrten mit Schrittgeschwindigkeit (§§ 15, 15a, 16 Abs. 2 StVO).", "Beim Liegenbleiben an unübersichtlicher Stelle und beim Abschleppen; außerdem darf sie zur Warnung anderer, z. B. am Stauende, benutzt werden (§§ 15, 15a, 16 Abs. 2 StVO)."], "richtig": 2, "erklaerung": "Beim Liegenbleiben an unübersichtlicher Stelle und beim Abschleppen; außerdem darf sie zur Warnung anderer, z. B. am Stauende, benutzt werden (§§ 15, 15a, 16 Abs. 2 StVO)."}, {"id": 365, "gesetz": "StraßenGesetz", "frage": "#0365 Welche Beleuchtungseinrichtungen sind bei schlechten Sichtverhältnissen vorgeschrieben?", "antworten": ["Bei Nebel Fernlicht und Nebelscheinwerfer; die Nebelschlussleuchte darf schon bei Sichtweite unter 150 m, auch bei starkem Regen, eingeschaltet werden (§ 17 Abs. 3 StVO).", "Bei erheblicher Sichtbehinderung durch Nebel, Schneefall oder Regen Abblendlicht (Nebelscheinwerfer zulässig); Nebelschlussleuchte nur bei Sichtweite unter 50 m durch Nebel (§ 17 Abs. 3 StVO).", "Nebelscheinwerfer ohne Abblendlicht genügen; die Nebelschlussleuchte ist bei Sichtweite unter 100 m Pflicht, auch bei Regen oder Schneefall (§ 17 Abs. 3 StVO)."], "richtig": 1, "erklaerung": "Bei erheblicher Sichtbehinderung durch Nebel, Schneefall oder Regen Abblendlicht (Nebelscheinwerfer zulässig); Nebelschlussleuchte nur bei Sichtweite unter 50 m durch Nebel (§ 17 Abs. 3 StVO)."}, {"id": 366, "gesetz": "StraßenGesetz", "frage": "#0366 Welche Bremsen muss ein Fahrzeug haben?", "antworten": ["Sie muss leichtgängig, zuverlässig und mit einer wirksamen Lenkradsperre versehen sein (§ 38 StVZO).", "Eine Betriebsbremse, eine Feststellbremse und ggf. eine Hilfsbremse (§ 41 StVZO).", "Wenn das Fahrzeug nicht zu einem genehmigten Typ gehört (§ 21 StVZO)."], "richtig": 1, "erklaerung": "Eine Betriebsbremse, eine Feststellbremse und ggf. eine Hilfsbremse (§ 41 StVZO)."}, {"id": 367, "gesetz": "StraßenGesetz", "frage": "#0367 Was passiert, wenn die Bremsanlage nicht mehr vorschriftsmäßig funktioniert?", "antworten": ["Das Fahrzeug darf bis zur nächsten Werkstatt mit Fahrgästen weiterbetrieben werden; den Halter trifft keine Verantwortung (§ 31 Abs. 2 StVZO, § 23 Abs. 1 StVO).", "Der Fahrer muss den Mangel binnen einer Woche melden; bis dahin darf das Fahrzeug langsam weiter genutzt werden (§ 31 Abs. 2 StVZO, § 23 Abs. 1 StVO).", "Das Fahrzeug darf nicht in Betrieb genommen werden; der Halter darf dies nicht anordnen oder zulassen (§ 31 Abs. 2 StVZO, § 23 Abs. 1 StVO)."], "richtig": 2, "erklaerung": "Das Fahrzeug darf nicht in Betrieb genommen werden; der Halter darf dies nicht anordnen oder zulassen (§ 31 Abs. 2 StVZO, § 23 Abs. 1 StVO)."}, {"id": 368, "gesetz": "StraßenGesetz", "frage": "#0368 Was ist ein Antiblockiersystem (ABS)?", "antworten": ["Hellelfenbein (RAL 1015) nach § 26 PBefG (in vielen Städten vorgeschrieben).", "Abblendlicht oder Nebelscheinwerfer, bei starkem Nebel zusätzlich die Nebelschlussleuchte (§ 53d StVZO).", "Ein System, das das Blockieren der Räder beim Bremsen verhindert (§ 41b StVZO)."], "richtig": 2, "erklaerung": "Ein System, das das Blockieren der Räder beim Bremsen verhindert (§ 41b StVZO)."}, {"id": 369, "gesetz": "StraßenGesetz", "frage": "#0369 Welche Vorschrift gilt für die Mitführung von Unterlegkeilen?", "antworten": ["Kfz über 4 t zulässiges Gesamtgewicht brauchen mindestens einen Unterlegkeil, drei- und mehrachsige Fahrzeuge mindestens zwei (§ 41 Abs. 14 StVZO).", "Kfz über 7,5 t zulässiges Gesamtgewicht brauchen einen Unterlegkeil, Pkw nur bei Fahrten im Gebirge (§ 41 Abs. 14 StVZO).", "Alle Kfz einschließlich Taxis brauchen mindestens zwei Unterlegkeile, Anhänger zusätzlich einen weiteren (§ 41 Abs. 14 StVZO)."], "richtig": 0, "erklaerung": "Kfz über 4 t zulässiges Gesamtgewicht brauchen mindestens einen Unterlegkeil, drei- und mehrachsige Fahrzeuge mindestens zwei (§ 41 Abs. 14 StVZO)."}, {"id": 370, "gesetz": "StraßenGesetz", "frage": "#0370 Welche Funktion erfüllt der Geschwindigkeitsbegrenzer?", "antworten": ["Nein, es sei denn, der Fahrer besitzt einen entsprechenden Parkausweis (§ 12 StVO).", "Er verhindert, dass das Fahrzeug eine bestimmte Geschwindigkeit überschreitet (§ 57c StVZO).", "Die Verkehrs- und Betriebssicherheit sowie die Umweltverträglichkeit des Fahrzeugs (§ 29 StVZO)."], "richtig": 1, "erklaerung": "Er verhindert, dass das Fahrzeug eine bestimmte Geschwindigkeit überschreitet (§ 57c StVZO)."}, {"id": 371, "gesetz": "StraßenGesetz", "frage": "#0371 Wann muss ein Fahrzeug zur Hauptuntersuchung (HU)?", "antworten": ["Pkw allgemein erstmals nach 36 Monaten, dann alle 24 Monate; für Taxis und Mietwagen gelten dieselben Fristen (§ 29 i. V. m. Anlage VIII Nr. 2.1.2 StVZO).", "Pkw allgemein erstmals nach 36 Monaten, dann alle 24 Monate; Taxis und Mietwagen (Personenbeförderung nach PBefG) jedes Jahr (§ 29 i. V. m. Anlage VIII Nr. 2.1.2 StVZO).", "Pkw allgemein erstmals nach 24 Monaten, dann alle 12 Monate; Taxis und Mietwagen alle 6 Monate (§ 29 i. V. m. Anlage VIII Nr. 2.1.2 StVZO)."], "richtig": 1, "erklaerung": "Pkw allgemein erstmals nach 36 Monaten, dann alle 24 Monate; Taxis und Mietwagen (Personenbeförderung nach PBefG) jedes Jahr (§ 29 i. V. m. Anlage VIII Nr. 2.1.2 StVZO)."}, {"id": 372, "gesetz": "StraßenGesetz", "frage": "#0372 Was wird bei der Hauptuntersuchung überprüft?", "antworten": ["100 km/h, wenn keine andere Regelung besteht (§ 3 Abs. 3 StVO).", "Die Verkehrs- und Betriebssicherheit sowie die Umweltverträglichkeit des Fahrzeugs (§ 29 StVZO).", "Kinder bis 12 Jahre und unter 150 cm Körpergröße müssen mit einem geeigneten Kindersitz gesichert werden. In Taxen besteht eine Befreiung für kurze Fahrten (§ 21 Abs. 1a StVO)."], "richtig": 1, "erklaerung": "Die Verkehrs- und Betriebssicherheit sowie die Umweltverträglichkeit des Fahrzeugs (§ 29 StVZO)."}, {"id": 373, "gesetz": "StraßenGesetz", "frage": "#0373 Welche Plakette wird nach bestandener HU vergeben?", "antworten": ["Die Prüfplakette (§ 29 StVZO).", "Immer, es sei denn, sie sind von der Gurtpflicht befreit (§ 21a StVO).", "Wer von rechts kommt, hat Vorfahrt (§ 8 StVO)."], "richtig": 0, "erklaerung": "Die Prüfplakette (§ 29 StVZO)."}, {"id": 374, "gesetz": "StraßenGesetz", "frage": "#0374 Wann muss ein Taxi zur Abgasuntersuchung (AU)?", "antworten": ["Die Abgasuntersuchung ist Teil der HU und für Taxis damit jährlich fällig (§ 29 i. V. m. Anlage VIII StVZO).", "Die Abgasuntersuchung ist für Taxis halbjährlich fällig, da sie gewerblich genutzt werden (§ 29 i. V. m. Anlage VIII StVZO).", "Die Abgasuntersuchung ist eine eigenständige Prüfung und für Taxis alle zwei Jahre unabhängig von der HU fällig (§ 47a StVZO)."], "richtig": 0, "erklaerung": "Die Abgasuntersuchung ist Teil der HU und für Taxis damit jährlich fällig (§ 29 i. V. m. Anlage VIII StVZO)."}, {"id": 375, "gesetz": "StraßenGesetz", "frage": "#0375 Welche Konsequenzen hat eine nicht bestandene Hauptuntersuchung?", "antworten": ["Nein, es sei denn, der Fahrer verstößt gegen Tarifbestimmungen oder verweigert eine Quittung (§ 39 PBefG).", "Wenn es den Vorschriften der StVZO und der StVO entspricht (§ 16 StVZO).", "Das Fahrzeug muss repariert und erneut geprüft werden; ggf. kann die Zulassung entzogen werden (§ 29 StVZO)."], "richtig": 2, "erklaerung": "Das Fahrzeug muss repariert und erneut geprüft werden; ggf. kann die Zulassung entzogen werden (§ 29 StVZO)."}, {"id": 376, "gesetz": "StraßenGesetz", "frage": "#0376 Müssen Taxis mit einem Fahrtenschreiber ausgestattet sein?", "antworten": ["Nur Mietwagen, da sie nicht dem Taxitarif unterliegen; Taxis zeichnen ihre Fahrten über den Fahrpreisanzeiger auf (Art. 2 VO (EG) Nr. 561/2006, VO (EU) Nr. 165/2014).", "Ja, alle Taxis und Mietwagen, da sie gewerblich Personen befördern; ausgenommen sind nur Fahrzeuge mit Elektroantrieb (Art. 2 VO (EG) Nr. 561/2006, VO (EU) Nr. 165/2014).", "Nein, weder Taxis noch Mietwagen; die Pflicht gilt erst für Fahrzeuge zur Personenbeförderung mit mehr als 9 Sitzplätzen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006, VO (EU) Nr. 165/2014)."], "richtig": 2, "erklaerung": "Nein, weder Taxis noch Mietwagen; die Pflicht gilt erst für Fahrzeuge zur Personenbeförderung mit mehr als 9 Sitzplätzen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006, VO (EU) Nr. 165/2014)."}, {"id": 377, "gesetz": "StraßenGesetz", "frage": "#0377 Welche Kennzeichnung müssen Taxis haben?", "antworten": ["Hellelfenbeinfarbener Anstrich (RAL 1015), Taxischild hinter der Frontscheibe und Ordnungsnummer auf dem amtlichen Kennzeichen (§§ 26, 27 BOKraft).", "Gelber Anstrich (RAL 1023), Taxischild auf dem Dach und Ordnungsnummer auf beiden Vordertüren in mindestens 10 cm Schrifthöhe (§§ 26, 27 BOKraft).", "Hellelfenbeinfarbener Anstrich (RAL 1015), beleuchtbares Taxischild auf dem Dach und Ordnungsnummer an der rechten unteren Ecke der Heckscheibe (§§ 26, 27 BOKraft)."], "richtig": 2, "erklaerung": "Hellelfenbeinfarbener Anstrich (RAL 1015), beleuchtbares Taxischild auf dem Dach und Ordnungsnummer an der rechten unteren Ecke der Heckscheibe (§§ 26, 27 BOKraft)."}, {"id": 378, "gesetz": "StraßenGesetz", "frage": "#0378 Welche Anforderungen gelten für die Sitze in einem Taxi?", "antworten": ["Die Verkehrs- und Betriebssicherheit sowie die Umweltverträglichkeit des Fahrzeugs (§ 29 StVZO).", "Sie müssen stabil, bequem und sicher befestigt sein (§ 35a StVZO).", "Grundsätzlich links, außer wenn rechts überholen ausdrücklich erlaubt ist (§ 5 Abs. 1 StVO)."], "richtig": 1, "erklaerung": "Sie müssen stabil, bequem und sicher befestigt sein (§ 35a StVZO)."}, {"id": 379, "gesetz": "StraßenGesetz", "frage": "#0379 Was muss ein Taxi-Unternehmer bei Änderungen am Fahrzeug beachten?", "antworten": ["Bei Änderungen, durch die die Betriebserlaubnis erlischt, ist eine Änderungsabnahme bzw. Begutachtung durch einen amtlich anerkannten Sachverständigen oder Prüfingenieur nötig; die Zulassungsbehörde ist ggf. zu informieren (§ 19 StVZO).", "Änderungen sind stets genehmigungsfrei, solange sie das zulässige Gesamtgewicht nicht erhöhen; es genügt eine formlose Mitteilung an die Genehmigungsbehörde nach dem PBefG binnen sechs Monaten (§ 19 StVZO).", "Jede noch so kleine Änderung, auch der Austausch von Fußmatten oder Scheibenwischern, erfordert eine Neuzulassung mit neuem Kennzeichen und eine erneute Abnahme durch die IHK (§ 19 StVZO)."], "richtig": 0, "erklaerung": "Bei Änderungen, durch die die Betriebserlaubnis erlischt, ist eine Änderungsabnahme bzw. Begutachtung durch einen amtlich anerkannten Sachverständigen oder Prüfingenieur nötig; die Zulassungsbehörde ist ggf. zu informieren (§ 19 StVZO)."}, {"id": 380, "gesetz": "StraßenGesetz", "frage": "#0380 Welche Vorschriften gelten für die Sicherheitsausstattung eines Mietwagens?", "antworten": ["Es gilt die für Pkw vorgeschriebene Ausrüstung (u. a. Gurte, Verbandkasten, Warndreieck, Warnweste nach §§ 35a, 35h, 53a StVZO) sowie die BOKraft, z. B. Ordnungsnummer nach § 27 Abs. 3 BOKraft.", "Für Mietwagen gelten keine besonderen Vorschriften; Gurte und Verbandkasten sind freiwillig, nur ein Warndreieck ist Pflicht (§§ 35a, 35h, 53a StVZO); die BOKraft gilt nur für Taxen.", "Es gilt die Taxi-Ausrüstung einschließlich Taxischild und geeichtem Fahrpreisanzeiger (§§ 26, 28 BOKraft) sowie zusätzlich ein Feuerlöscher und ein Fahrtenschreiber (§ 57a StVZO)."], "richtig": 0, "erklaerung": "Es gilt die für Pkw vorgeschriebene Ausrüstung (u. a. Gurte, Verbandkasten, Warndreieck, Warnweste nach §§ 35a, 35h, 53a StVZO) sowie die BOKraft, z. B. Ordnungsnummer nach § 27 Abs. 3 BOKraft."}, {"id": 401, "gesetz": "FPersG", "frage": "#0401 Für wen gilt das Fahrpersonalgesetz (FPersG)?", "antworten": ["Für Fahrer, Beifahrer und Schaffner von Kraftfahrzeugen und Straßenbahnen, die am privaten Verkehr teilnehmen (§ 1 Abs. 1 FPersG).", "Für Unternehmer, Beifahrer und Schaffner von Kraftfahrzeugen und Straßenbahnen, die am öffentlichen Verkehr teilnehmen (§ 1 Abs. 1 FPersG).", "Für Fahrer, Beifahrer und Schaffner von Kraftfahrzeugen und Straßenbahnen, die am öffentlichen Verkehr teilnehmen (§ 1 Abs. 1 FPersG)."], "richtig": 2, "erklaerung": "Für Fahrer, Beifahrer und Schaffner von Kraftfahrzeugen und Straßenbahnen, die am öffentlichen Verkehr teilnehmen (§ 1 Abs. 1 FPersG)."}, {"id": 402, "gesetz": "FPersG", "frage": "#0402 Welche Fahrzeuge sind vom FPersG ausgenommen?", "antworten": ["Fahrpersonal von Dienstfahrzeugen der Bundeswehr, Feuerwehr, des Katastrophenschutzes, der Polizei und des Zolls sowie von Kfz bis 2,8 t, außer es steht in einem Arbeitsverhältnis nach dem ArbZG (§ 1 Abs. 2 FPersG).", "Ausschließlich Fahrzeuge der Bundeswehr; alle übrigen Behördenfahrzeuge sowie Kfz jeder Gewichtsklasse unterliegen dem FPersG uneingeschränkt (§ 1 Abs. 2 FPersG).", "Fahrpersonal von Lkw über 7,5 t sowie von Reisebussen mit mehr als 20 Sitzplätzen, da für diese allein die EU-Verordnung gilt, außer es besteht ein Arbeitsverhältnis (§ 1 Abs. 2 FPersG)."], "richtig": 0, "erklaerung": "Fahrpersonal von Dienstfahrzeugen der Bundeswehr, Feuerwehr, des Katastrophenschutzes, der Polizei und des Zolls sowie von Kfz bis 2,8 t, außer es steht in einem Arbeitsverhältnis nach dem ArbZG (§ 1 Abs. 2 FPersG)."}, {"id": 403, "gesetz": "FPersG", "frage": "#0403 Was regelt das FPersG vorrangig?", "antworten": ["Die durch die Landesregierung bestimmten Aufsichtsbehörden (§ 4 Abs. 1 FPersG).", "Mindestens 45 Stunden, auf 24 Stunden verkürzbar, wenn ausgeglichen wird (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Es regelt die Arbeitszeiten, Lenkzeiten, Ruhezeiten und Fahrtunterbrechungen des Fahrpersonals (§ 2 FPersG)."], "richtig": 2, "erklaerung": "Es regelt die Arbeitszeiten, Lenkzeiten, Ruhezeiten und Fahrtunterbrechungen des Fahrpersonals (§ 2 FPersG)."}, {"id": 404, "gesetz": "FPersG", "frage": "#0404 Welche gesetzliche Grundlage hat das FPersG für Arbeitszeiten?", "antworten": ["Dienstfahrzeuge der Bundeswehr, Feuerwehr, Polizei, Katastrophenschutz sowie Fahrzeuge mit einem zulässigen Gesamtgewicht bis 2,8 t, sofern kein Arbeitszeitgesetz greift (§ 1 Abs. 2 FPersG).", "Mindestens 45 Minuten nach 4,5 Stunden Lenkzeit, aufteilbar in 15 und 30 Minuten (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Die Regelungen zur Arbeitszeitgestaltung gehen dem allgemeinen Arbeitszeitgesetz vor (§ 1 Abs. 1 FPersG)."], "richtig": 2, "erklaerung": "Die Regelungen zur Arbeitszeitgestaltung gehen dem allgemeinen Arbeitszeitgesetz vor (§ 1 Abs. 1 FPersG)."}, {"id": 405, "gesetz": "FPersG", "frage": "#0405 Welche maximale tägliche Lenkzeit ist für Fahrpersonal erlaubt?", "antworten": ["8 Stunden, zweimal pro Woche bis zu 10 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "10 Stunden, zweimal pro Woche bis zu 10 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "9 Stunden, zweimal pro Woche bis zu 10 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "9 Stunden, zweimal pro Woche bis zu 10 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."}, {"id": 406, "gesetz": "FPersG", "frage": "#0406 Wie lange darf die maximale Wochenlenkzeit betragen?", "antworten": ["Maximal 57 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 55 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 56 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "Maximal 56 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."}, {"id": 407, "gesetz": "FPersG", "frage": "#0407 Wie lange beträgt die maximale Gesamtlenkzeit in zwei aufeinanderfolgenden Wochen?", "antworten": ["Maximal 89 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 90 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Maximal 91 Stunden (§ 2 FPersG i. n ausgeglichen wird (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."}, {"id": 411, "gesetz": "FPersG", "frage": "#0411 Darf eine reduzierte wöchentliche Ruhezeit im Fahrzeug verbracht werden?", "antworten": ["Ja, es sei denn, das Fahrzeug ist mit einer geeigneten Schlafmöglichkeit ausgestattet (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Verstöße gegen Lenkzeiten, Ruhezeiten, Fahrtenschreiberpflichten, Arbeitszeitregelungen (§ 8 FPersG).", "Nein, es sei denn, das Fahrzeug ist mit einer geeigneten Schlafmöglichkeit ausgestattet (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 2, "erklaerung": "Nein, es sei denn, das Fahrzeug ist mit einer geeigneten Schlafmöglichkeit ausgestattet (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."}, {"id": 412, "gesetz": "FPersG", "frage": "#0412 Was ist die maximale Schichtzeit für Fahrpersonal?", "antworten": ["16 Stunden innerhalb von 24 Stunden (bei 8 Stunden Ruhezeit), bei verkürzter Ruhezeit von 6 Stunden höchstens zweimal wöchentlich bis 18 Stunden (Art. 8 VO (EG) Nr. 561/2006).", "13 Stunden innerhalb von 24 Stunden (bei 11 Stunden Ruhezeit), bei verkürzter Ruhezeit von 9 Stunden höchstens dreimal zwischen zwei Wochenruhezeiten bis 15 Stunden (Art. 8 VO (EG) Nr. 561/2006).", "10 Stunden innerhalb von 24 Stunden (bei 11 Stunden Ruhezeit), bei verkürzter Ruhezeit von 8 Stunden beliebig oft bis 14 Stunden (Art. 8 VO (EG) Nr. 561/2006)."], "richtig": 1, "erklaerung": "13 Stunden innerhalb von 24 Stunden (bei 11 Stunden Ruhezeit), bei verkürzter Ruhezeit von 9 Stunden höchstens dreimal zwischen zwei Wochenruhezeiten bis 15 Stunden (Art. 8 VO (EG) Nr. 561/2006)."}, {"id": 413, "gesetz": "FPersG", "frage": "#0413 Wann ist eine Pause innerhalb der Arbeitszeit erforderlich?", "antworten": ["Spätestens nach 6 Stunden Arbeitszeit; insgesamt 30 Minuten bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden (§ 4 ArbZG).", "Spätestens nach 8 Stunden Arbeitszeit; insgesamt 15 Minuten bei mehr als 6 und 30 Minuten bei mehr als 10 Stunden (§ 4 ArbZG).", "Spätestens nach 4,5 Stunden Arbeitszeit; insgesamt 45 Minuten bei mehr als 6 und 60 Minuten bei mehr als 9 Stunden (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "Spätestens nach 6 Stunden Arbeitszeit; insgesamt 30 Minuten bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden (§ 4 ArbZG)."}, {"id": 414, "gesetz": "FPersG", "frage": "#0414 Welche Behörde ist für die Überwachung des Fahrpersonals zuständig?", "antworten": ["11 Stunden, dreimal pro Woche verkürzbar auf 9 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Die durch die Landesregierung bestimmten Aufsichtsbehörden (§ 4 Abs. 1 FPersG).", "Die durch die Landesregierung bestimmten Genehmigungsbehörden (§ 4 Abs. 1 FPersG)."], "richtig": 1, "erklaerung": "Die durch die Landesregierung bestimmten Aufsichtsbehörden (§ 4 Abs. 1 FPersG)."}, {"id": 415, "gesetz": "FPersG", "frage": "#0415 Welche Aufgaben haben die Aufsichtsbehörden?", "antworten": ["Kontrolle von Arbeitszeiten, Fahrtenschreibern, Tätigkeitsnachweisen und Ruhezeiten (§ 4 Abs. 1a FPersG).", "Maximal 56 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Mindestens 45 Minuten nach 4,5 Stunden Lenkzeit, aufteilbar in 15 und 30 Minuten (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 0, "erklaerung": "Kontrolle von Arbeitszeiten, Fahrtenschreibern, Tätigkeitsnachweisen und Ruhezeiten (§ 4 Abs. 1a FPersG)."}, {"id": 416, "gesetz": "FPersG", "frage": "#0416 Welche Verpflichtungen haben Unternehmer bezüglich Fahrerkarten?", "antworten": ["Unternehmer müssen die Daten der Fahrerkarten regelmäßig auslesen und ein Jahr lang speichern (§ 4 Abs. 3 FPersG).", "Fahrer müssen die Daten der Fahrerkarten regelmäßig auslesen und ein Jahr lang speichern (§ 4 Abs. 3 FPersG).", "Unternehmer müssen die Daten der Unternehmerkarten regelmäßig auslesen und ein Jahr lang speichern (§ 4 Abs. 3 FPersG)."], "richtig": 0, "erklaerung": "Unternehmer müssen die Daten der Fahrerkarten regelmäßig auslesen und ein Jahr lang speichern (§ 4 Abs. 3 FPersG)."}, {"id": 417, "gesetz": "FPersG", "frage": "#0417 Welche Strafen drohen Unternehmen bei Verstößen gegen Lenk- und Ruhezeiten?", "antworten": ["13 Stunden, verlängerbar auf 15 Stunden bei entsprechendem Ausgleich (§ 2 FPersG).", "Spätestens nach 6 Stunden Arbeitszeit (§ 2 FPersG).", "Geldbußen bis zu 30.000 € (§ 8 FPersG)."], "richtig": 2, "erklaerung": "Geldbußen bis zu 30.000 € (§ 8 FPersG)."}, {"id": 418, "gesetz": "FPersG", "frage": "#0418 Welche Strafen drohen Fahrern bei Verstößen gegen Lenk- und Ruhezeiten?", "antworten": ["Geldbußen bis zu 5.000 € (§ 8 FPersG).", "Fahrtenbücher, Tätigkeitsnachweise und Abrechnungen müssen mindestens ein Jahr aufbewahrt werden (§ 4 Abs. 3 FPersG).", "Maximal 90 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006)."], "richtig": 0, "erklaerung": "Geldbußen bis zu 5.000 € (§ 8 FPersG)."}, {"id": 419, "gesetz": "FPersG", "frage": "#0419 Welche Fahrzeuge müssen mit einem digitalen Fahrtenschreiber ausgestattet sein?", "antworten": ["Güterkraftfahrzeuge über 3,5 t (seit 1.7.2026 auch über 2,5 t im grenzüberschreitenden Güterverkehr) und Fahrzeuge für mehr als 9 Personen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006 i. V. m. VO (EU) Nr. 165/2014).", "Alle gewerblich genutzten Kfz über 2,8 t einschließlich Taxis und Mietwagen sowie Fahrzeuge für mehr als 5 Personen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006 i. V. m. VO (EU) Nr. 165/2014).", "Nur Güterkraftfahrzeuge über 7,5 t und Fahrzeuge für mehr als 20 Personen einschließlich Fahrer; leichtere Fahrzeuge sind auch grenzüberschreitend befreit (Art. 2 VO (EG) Nr. 561/2006 i. V. m. VO (EU) Nr. 165/2014)."], "richtig": 0, "erklaerung": "Güterkraftfahrzeuge über 3,5 t (seit 1.7.2026 auch über 2,5 t im grenzüberschreitenden Güterverkehr) und Fahrzeuge für mehr als 9 Personen einschließlich Fahrer (Art. 2 VO (EG) Nr. 561/2006 i. V. m. VO (EU) Nr. 165/2014)."}, {"id": 420, "gesetz": "FPersG", "frage": "#0420 Wie lange müssen Fahrtenschreiberdaten aufbewahrt werden?", "antworten": ["2 Jahre ab dem Zeitpunkt des Kopierens; Schaublätter und Ausdrucke 6 Monate nach Ablauf der Mitführpflicht (§ 4 Abs. 3 FPersG).", "1 Jahr ab dem Zeitpunkt des Kopierens; Schaublätter und Ausdrucke 1 Jahr nach Ablauf der Mitführpflicht (§ 4 Abs. 3 FPersG).", "28 Tage ab dem Zeitpunkt der Aufzeichnung; Schaublätter und Ausdrucke müssen gar nicht aufbewahrt werden (§ 4 Abs. 3 FPersG)."], "richtig": 1, "erklaerung": "1 Jahr ab dem Zeitpunkt des Kopierens; Schaublätter und Ausdrucke 1 Jahr nach Ablauf der Mitführpflicht (§ 4 Abs. 3 FPersG)."}, {"id": 421, "gesetz": "FPersG", "frage": "#0421 Wer ist verpflichtet, Tätigkeitsnachweise mitzuführen?", "antworten": ["Nur der Unternehmer, der die Fahrerkarte im Betrieb verwahrt; Fahrer führen lediglich die Aufzeichnungen des laufenden Tages mit (Art. 36 VO (EU) Nr. 165/2014); Fahrer von Kfz bis 3,5 t sind generell befreit (§ 1 Abs. 6 FPersV).", "Alle Berufskraftfahrer einschließlich Taxi- und Mietwagenfahrer: Aufzeichnungen des laufenden Tages und der vorausgehenden 56 Tage (Art. 36 VO (EU) Nr. 165/2014); für Kfz bis 3,5 t gelten dieselben Pflichten (§ 1 Abs. 6 FPersV).", "Fahrer fahrtenschreiberpflichtiger Fahrzeuge: Fahrerkarte bzw. Schaublätter und Aufzeichnungen des laufenden Tages und der vorausgehenden 28 Tage (Art. 36 VO (EU) Nr. 165/2014); Fahrer von Kfz über 2,8 bis 3,5 t nach § 1 Abs. 6 FPersV."], "richtig": 2, "erklaerung": "Fahrer fahrtenschreiberpflichtiger Fahrzeuge: Fahrerkarte bzw. Schaublätter und Aufzeichnungen des laufenden Tages und der vorausgehenden 28 Tage (Art. 36 VO (EU) Nr. 165/2014); Fahrer von Kfz über 2,8 bis 3,5 t nach § 1 Abs. 6 FPersV."}, {"id": 422, "gesetz": "FPersG", "frage": "#0422 Gelten die EU-Lenk- und Ruhezeiten auch für Taxi- und Mietwagenfahrer?", "antworten": ["Ja, die VO (EG) Nr. 561/2006 gilt für jede gewerbliche Personenbeförderung unabhängig von der Sitzplatzzahl; das Arbeitszeitgesetz tritt dahinter vollständig zurück (Art. 2 Abs. 1 Buchst. b VO (EG) Nr. 561/2006).", "Nein, die VO (EG) Nr. 561/2006 gilt in der Personenbeförderung erst für Fahrzeuge mit mehr als 9 Sitzplätzen einschließlich Fahrer; für angestellte Taxi- und Mietwagenfahrer gilt das Arbeitszeitgesetz (Art. 2 Abs. 1 Buchst. b VO (EG) Nr. 561/2006).", "Nur bei Fahrten über 50 km vom Betriebssitz; im Nahbereich gelten für angestellte Taxi- und Mietwagenfahrer überhaupt keine Arbeitszeitvorschriften (Art. 2 Abs. 1 Buchst. b VO (EG) Nr. 561/2006)."], "richtig": 1, "erklaerung": "Nein, die VO (EG) Nr. 561/2006 gilt in der Personenbeförderung erst für Fahrzeuge mit mehr als 9 Sitzplätzen einschließlich Fahrer; für angestellte Taxi- und Mietwagenfahrer gilt das Arbeitszeitgesetz (Art. 2 Abs. 1 Buchst. b VO (EG) Nr. 561/2006)."}, {"id": 423, "gesetz": "FPersG", "frage": "#0423 Welche Nachweise müssen Mietwagenfahrer über ihre Arbeitszeiten führen?", "antworten": ["Der Fahrer muss nur bei Schichten über 10 Stunden ein Fahrtenbuch führen, das 6 Monate aufzubewahren ist (§ 17 MiLoG i. V. m. § 2a SchwarzArbG); sonst bestehen keine Aufzeichnungspflichten (§ 16 Abs. 2 ArbZG).", "Der Arbeitgeber muss nur die monatliche Gesamtarbeitszeit bis zum Monatsende erfassen und 5 Jahre aufbewahren (§ 17 MiLoG i. V. m. § 2a SchwarzArbG); Überstunden sind nicht gesondert zu erfassen (§ 16 Abs. 2 ArbZG).", "Der Arbeitgeber muss Beginn, Ende und Dauer der täglichen Arbeitszeit bis zum 7. Folgetag aufzeichnen und 2 Jahre aufbewahren (§ 17 MiLoG i. V. m. § 2a SchwarzArbG); Arbeitszeit über 8 Stunden zusätzlich nach § 16 Abs. 2 ArbZG."], "richtig": 2, "erklaerung": "Der Arbeitgeber muss Beginn, Ende und Dauer der täglichen Arbeitszeit bis zum 7. Folgetag aufzeichnen und 2 Jahre aufbewahren (§ 17 MiLoG i. V. m. § 2a SchwarzArbG); Arbeitszeit über 8 Stunden zusätzlich nach § 16 Abs. 2 ArbZG."}, {"id": 424, "gesetz": "FPersG", "frage": "#0424 Dürfen Fahrer im Akkord oder nach Fahrstrecke bezahlt werden?", "antworten": ["Ja, eine Bezahlung nach gefahrenen Kilometern ist ausdrücklich erlaubt, solange der Mindestlohn eingehalten wird; Prämien für schnelles Fahren sind ebenfalls zulässig (§ 3 FPersG).", "Nein, angestellte Fahrer dürfen nicht nach Fahrstrecke oder Gütermenge entlohnt werden, auch nicht über Prämien; zulässig sind nur Vergütungen, die die Verkehrssicherheit nicht gefährden (§ 3 FPersG).", "Nur bei Fahrern über 25 Jahren mit mindestens fünf Jahren Berufserfahrung; jüngere Fahrer dürfen ausschließlich im Stundenlohn bezahlt werden (§ 3 FPersG)."], "richtig": 1, "erklaerung": "Nein, angestellte Fahrer dürfen nicht nach Fahrstrecke oder Gütermenge entlohnt werden, auch nicht über Prämien; zulässig sind nur Vergütungen, die die Verkehrssicherheit nicht gefährden (§ 3 FPersG)."}, {"id": 425, "gesetz": "FPersG", "frage": "#0425 Welche Verantwortung trägt der Unternehmer bezüglich Lenk- und Ruhezeiten?", "antworten": ["Er muss sicherstellen, dass die Fahrer die Vorschriften einhalten (§ 4 FPersG).", "Für Fahrer, Beifahrer und Schaffner von Kraftfahrzeugen und Straßenbahnen, die am öffentlichen Verkehr teilnehmen (§ 1 Abs. 1 FPersG).", "Er muss sicherstellen, dass die Unternehmer die Vorschriften einhalten (§ 4 FPersG)."], "richtig": 0, "erklaerung": "Er muss sicherstellen, dass die Fahrer die Vorschriften einhalten (§ 4 FPersG)."}, {"id": 426, "gesetz": "FPersG", "frage": "#0426 Welche Aufbewahrungspflichten haben Taxiunternehmer?", "antworten": ["Fahrtenschreiberdaten und Schaublätter 2 Jahre (§ 4 Abs. 3 FPersG), Arbeitszeitaufzeichnungen 1 Jahr (§ 17 MiLoG), Abrechnungen und Buchungsbelege 6 Jahre (§ 147 AO).", "Fahrtenschreiberdaten und Schaublätter 1 Jahr (§ 4 Abs. 3 FPersG), Arbeitszeitaufzeichnungen 2 Jahre (§ 17 MiLoG), Abrechnungen und Buchungsbelege 8 Jahre (§ 147 AO).", "Fahrtenschreiberdaten und Schaublätter 28 Tage (§ 4 Abs. 3 FPersG), Arbeitszeitaufzeichnungen 5 Jahre (§ 17 MiLoG), Abrechnungen und Buchungsbelege 3 Jahre (§ 147 AO)."], "richtig": 1, "erklaerung": "Fahrtenschreiberdaten und Schaublätter 1 Jahr (§ 4 Abs. 3 FPersG), Arbeitszeitaufzeichnungen 2 Jahre (§ 17 MiLoG), Abrechnungen und Buchungsbelege 8 Jahre (§ 147 AO)."}, {"id": 427, "gesetz": "FPersG", "frage": "#0427 Welche Ordnungswidrigkeiten können nach dem FPersG geahndet werden?", "antworten": ["Geldbußen bis zu 30.000 € (§ 8 FPersG).", "Das Bundesamt für Logistik und Mobilität (BALM) (§ 9 FPersG).", "Verstöße gegen Lenkzeiten, Ruhezeiten, Fahrtenschreiberpflichten, Arbeitszeitregelungen (§ 8 FPersG)."], "richtig": 2, "erklaerung": "Verstöße gegen Lenkzeiten, Ruhezeiten, Fahrtenschreiberpflichten, Arbeitszeitregelungen (§ 8 FPersG)."}, {"id": 428, "gesetz": "FPersG", "frage": "#0428 Welche Behörde ist für die Ahndung von Verstößen zuständig?", "antworten": ["Ausschließlich das Bundesamt für Logistik und Mobilität (BALM), unabhängig vom Betriebssitz; die Länder haben für die Ahndung keine Zuständigkeit (§ 9 FPersG).", "Die nach Landesrecht zuständige Verwaltungsbehörde, in deren Bezirk der Betriebssitz liegt; das BALM nur bei Unternehmen ohne Sitz oder Niederlassung in Deutschland (§ 9 FPersG).", "Die Industrie- und Handelskammer, in deren Bezirk der Betriebssitz liegt; bei Unternehmen ohne Sitz in Deutschland die Bundespolizei (§ 9 FPersG)."], "richtig": 1, "erklaerung": "Die nach Landesrecht zuständige Verwaltungsbehörde, in deren Bezirk der Betriebssitz liegt; das BALM nur bei Unternehmen ohne Sitz oder Niederlassung in Deutschland (§ 9 FPersG)."}, {"id": 429, "gesetz": "FPersG", "frage": "#0429 Wie hoch können Strafen für Unternehmen ausfallen, die Fahrer zu Verstößen anweisen?", "antworten": ["Maximal 90 Stunden (§ 2 FPersG i.V.m. Verordnung (EG) Nr. 561/2006).", "Kontrolle von Arbeitszeiten, Fahrtenschreibern, Tätigkeitsnachweisen und Ruhezeiten (§ 4 Abs. 1a FPersG).", "Bis zu 30.000 € (§ 8 FPersG)."], "richtig": 2, "erklaerung": "Bis zu 30.000 € (§ 8 FPersG)."}, {"id": 430, "gesetz": "FPersG", "frage": "#0430 Was kann passieren, wenn ein Fahrer falsche Tätigkeitsnachweise führt?", "antworten": ["Geldbuße bis 5.000 € (§ 8 Abs. 1 Nr. 2, Abs. 2 FPersG); die Manipulation von Fahrtenschreiberaufzeichnungen kann als Fälschung technischer Aufzeichnungen strafbar sein (§ 268 StGB).", "Geldbuße bis 500 € (§ 8 Abs. 1 Nr. 2, Abs. 2 FPersG); die Manipulation von Fahrtenschreiberaufzeichnungen ist nie strafbar, sondern stets nur ordnungswidrig (§ 268 StGB).", "Geldbuße bis 50.000 € und automatischer Entzug der Fahrerlaubnis (§ 8 Abs. 1 Nr. 2, Abs. 2 FPersG); strafbar wegen Manipulation kann sich nur der Unternehmer machen (§ 268 StGB)."], "richtig": 0, "erklaerung": "Geldbuße bis 5.000 € (§ 8 Abs. 1 Nr. 2, Abs. 2 FPersG); die Manipulation von Fahrtenschreiberaufzeichnungen kann als Fälschung technischer Aufzeichnungen strafbar sein (§ 268 StGB)."}, {"id": 451, "gesetz": "ArbZG", "frage": "#0451 Was ist der Zweck des Arbeitszeitgesetzes (ArbZG)?", "antworten": ["Sicherung einer möglichst hohen Arbeitsleistung der Arbeitnehmer, Festlegung von Zuschlägen für Überstunden und Schutz der Samstage als Tage der Arbeitsruhe (§ 1 ArbZG).", "Schutz der Arbeitgeber vor übermäßigen Lohnforderungen, Regelung des Urlaubsanspruchs und Gleichstellung der Sonn- und Feiertage mit normalen Werktagen (§ 1 ArbZG).", "Sicherheit und Gesundheitsschutz der Arbeitnehmer bei der Arbeitszeitgestaltung, Rahmenbedingungen für flexible Arbeitszeiten und Schutz der Sonn- und Feiertage als Tage der Arbeitsruhe (§ 1 ArbZG)."], "richtig": 2, "erklaerung": "Sicherheit und Gesundheitsschutz der Arbeitnehmer bei der Arbeitszeitgestaltung, Rahmenbedingungen für flexible Arbeitszeiten und Schutz der Sonn- und Feiertage als Tage der Arbeitsruhe (§ 1 ArbZG)."}, {"id": 452, "gesetz": "ArbZG", "frage": "#0452 Was versteht das ArbZG unter Arbeitszeit?", "antworten": ["Die Zeit vom Beginn bis zum Ende der Arbeit ohne Ruhepausen (§ 2 Abs. 1 ArbZG).", "Schutz der Sicherheit und Gesundheit der Arbeitnehmer sowie die Regelung von Arbeits- und Ruhezeiten (§ 1 ArbZG).", "Nein, sie dürfen an Sonn- und Feiertagen arbeiten (§ 10 Abs. 1 ArbZG)."], "richtig": 0, "erklaerung": "Die Zeit vom Beginn bis zum Ende der Arbeit ohne Ruhepausen (§ 2 Abs. 1 ArbZG)."}, {"id": 453, "gesetz": "ArbZG", "frage": "#0453 Wann gilt Nachtzeit gemäß ArbZG?", "antworten": ["Zwischen 23:00 und 6:00 Uhr, in Bäckereien und Konditoreien zwischen 22:00 und 5:00 Uhr (§ 2 Abs. 3 ArbZG).", "Wenn Verstöße vorsätzlich begangen werden und Gesundheit oder Arbeitskraft gefährdet wird (§ 23 ArbZG).", "Ja, sie unterliegen den allgemeinen Regelungen des ArbZG und den EU-Vorschriften (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "Zwischen 23:00 und 6:00 Uhr, in Bäckereien und Konditoreien zwischen 22:00 und 5:00 Uhr (§ 2 Abs. 3 ArbZG)."}, {"id": 454, "gesetz": "ArbZG", "frage": "#0454 Wie viele Stunden darf die tägliche Arbeitszeit maximal betragen?", "antworten": ["8 Stunden, ausnahmsweise bis zu 10 Stunden, wenn der Schnitt innerhalb von 6 Monaten 8 Stunden nicht überschreitet (§ 3 ArbZG).", "12 Stunden, ausnahmsweise bis zu 10 Stunden, wenn der Schnitt innerhalb von 6 Monaten 8 Stunden nicht überschreitet (§ 3 ArbZG).", "4 Stunden, ausnahmsweise bis zu 10 Stunden, wenn der Schnitt innerhalb von 6 Monaten 8 Stunden nicht überschreitet (§ 3 ArbZG)."], "richtig": 0, "erklaerung": "8 Stunden, ausnahmsweise bis zu 10 Stunden, wenn der Schnitt innerhalb von 6 Monaten 8 Stunden nicht überschreitet (§ 3 ArbZG)."}, {"id": 455, "gesetz": "ArbZG", "frage": "#0455 Unter welchen Bedingungen darf die Arbeitszeit über 10 Stunden verlängert werden?", "antworten": ["Durch einfache Vereinbarung im Arbeitsvertrag, wenn der Arbeitnehmer zustimmt, ohne dass Arbeitsbereitschaft oder Bereitschaftsdienst anfallen muss (§ 7 Abs. 1 Nr. 1 Buchst. a ArbZG).", "Nur durch Tarifvertrag oder Betriebsvereinbarung aufgrund eines Tarifvertrags, wenn regelmäßig und in erheblichem Umfang Arbeitsbereitschaft oder Bereitschaftsdienst anfällt (§ 7 Abs. 1 Nr. 1 Buchst. a ArbZG).", "Jederzeit auf Anordnung des Arbeitgebers bei hohem Auftragsaufkommen, sofern innerhalb von vier Wochen ein Freizeitausgleich erfolgt (§ 7 Abs. 1 Nr. 1 Buchst. a ArbZG)."], "richtig": 1, "erklaerung": "Nur durch Tarifvertrag oder Betriebsvereinbarung aufgrund eines Tarifvertrags, wenn regelmäßig und in erheblichem Umfang Arbeitsbereitschaft oder Bereitschaftsdienst anfällt (§ 7 Abs. 1 Nr. 1 Buchst. a ArbZG)."}, {"id": 456, "gesetz": "ArbZG", "frage": "#0456 Welche Pausenregelungen gibt es?", "antworten": ["30 Minuten Pause bei mehr als 6 Stunden Arbeit, 45 Minuten Pause bei mehr als 9 Stunden Arbeit (§ 4 ArbZG).", "14 Minuten Pause bei mehr als 6 Stunden Arbeit, 45 Minuten Pause bei mehr als 9 Stunden Arbeit (§ 4 ArbZG).", "60 Minuten Pause bei mehr als 6 Stunden Arbeit, 45 Minuten Pause bei mehr als 9 Stunden Arbeit (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "30 Minuten Pause bei mehr als 6 Stunden Arbeit, 45 Minuten Pause bei mehr als 9 Stunden Arbeit (§ 4 ArbZG)."}, {"id": 457, "gesetz": "ArbZG", "frage": "#0457 Wann muss spätestens eine Pause eingelegt werden?", "antworten": ["Nach spätestens 3 Stunden Arbeitszeit (§ 4 ArbZG).", "Nach spätestens 12 Stunden Arbeitszeit (§ 4 ArbZG).", "Nach spätestens 6 Stunden Arbeitszeit (§ 4 ArbZG)."], "richtig": 2, "erklaerung": "Nach spätestens 6 Stunden Arbeitszeit (§ 4 ArbZG)."}, {"id": 458, "gesetz": "ArbZG", "frage": "#0458 Zählen Wartezeiten im Taxi- oder Mietwagenbetrieb als Arbeitszeit?", "antworten": ["Ja, Wartezeiten, in denen sich der Fahrer am Taxi bereithalten muss, sind Arbeitszeit (Arbeitsbereitschaft); Ruhepausen zählen nicht (§ 2 Abs. 1 ArbZG). § 21a ArbZG gilt für Taxis nicht.", "Nein, Wartezeiten am Taxistand gelten als Ruhepausen, sofern sie länger als 15 Minuten dauern, und werden nicht vergütet (§ 2 Abs. 1 ArbZG). Für Taxis gilt § 21a ArbZG.", "Nur zur Hälfte, da Wartezeiten als Bereitschaftsdienst gelten; Ruhepausen zählen dagegen voll zur Arbeitszeit (§ 2 Abs. 1 ArbZG). § 21a ArbZG gilt auch für Taxis."], "richtig": 0, "erklaerung": "Ja, Wartezeiten, in denen sich der Fahrer am Taxi bereithalten muss, sind Arbeitszeit (Arbeitsbereitschaft); Ruhepausen zählen nicht (§ 2 Abs. 1 ArbZG). § 21a ArbZG gilt für Taxis nicht."}, {"id": 459, "gesetz": "ArbZG", "frage": "#0459 Wie lange muss die Ruhezeit zwischen zwei Arbeitsschichten betragen?", "antworten": ["Mindestens 12 Stunden (§ 5 Abs. 1 ArbZG).", "Mindestens 11 Stunden (§ 5 Abs. 1 ArbZG).", "Mindestens 10 Stunden (§ 5 Abs. 1 ArbZG)."], "richtig": 1, "erklaerung": "Mindestens 11 Stunden (§ 5 Abs. 1 ArbZG)."}, {"id": 460, "gesetz": "ArbZG", "frage": "#0460 Kann die Ruhezeit verkürzt werden?", "antworten": ["Ja, um bis zu 2 Stunde, wenn innerhalb eines Monats eine Ruhezeit auf mindestens 12 Stunden verlängert wird (§ 5 Abs. 2 ArbZG).", "Ja, um bis zu 1 Stunde, wenn innerhalb eines Monats eine Ruhezeit auf mindestens 12 Stunden verlängert wird (§ 5 Abs. 2 ArbZG).", "Ja, um bis zu 3 Stunde, wenn innerhalb eines Monats eine Ruhezeit auf mindestens 12 Stunden verlängert wird (§ 5 Abs. 2 ArbZG)."], "richtig": 1, "erklaerung": "Ja, um bis zu 1 Stunde, wenn innerhalb eines Monats eine Ruhezeit auf mindestens 12 Stunden verlängert wird (§ 5 Abs. 2 ArbZG)."}, {"id": 461, "gesetz": "ArbZG", "frage": "#0461 Welche Ruhezeiten gelten für Fahrer im Straßentransport?", "antworten": ["Mindestens 11 Stunden tägliche und 45 Stunden wöchentliche Ruhezeit nach EU-Verordnung (EG) Nr. 561/2006 (§ 21a Abs. 5 ArbZG).", "Mindestens 10 Stunden tägliche und 45 Stunden wöchentliche Ruhezeit nach EU-Verordnung (EG) Nr. 561/2006 (§ 21a Abs. 5 ArbZG).", "Mindestens 12 Stunden tägliche und 45 Stunden wöchentliche Ruhezeit nach EU-Verordnung (EG) Nr. 561/2006 (§ 21a Abs. 5 ArbZG)."], "richtig": 0, "erklaerung": "Mindestens 11 Stunden tägliche und 45 Stunden wöchentliche Ruhezeit nach EU-Verordnung (EG) Nr. 561/2006 (§ 21a Abs. 5 ArbZG)."}, {"id": 462, "gesetz": "ArbZG", "frage": "#0462 Welche Arbeitszeitregelung gilt für Taxifahrer?", "antworten": ["Für Taxifahrer gilt die Sonderregel für Straßentransporte (§ 21a ArbZG) mit bis zu 60 Wochenstunden; zusätzlich gelten die EU-Lenk- und Ruhezeiten.", "Angestellte Taxifahrer sind vom ArbZG ausgenommen (§ 18 ArbZG); für sie gelten ausschließlich tarifliche Regelungen ohne gesetzliche Höchstgrenzen.", "Für angestellte Taxifahrer gilt das allgemeine ArbZG (§§ 3–6 ArbZG); § 21a ArbZG und die EU-Lenk- und Ruhezeiten gelten nicht, da Taxis höchstens 9 Personen befördern."], "richtig": 2, "erklaerung": "Für angestellte Taxifahrer gilt das allgemeine ArbZG (§§ 3–6 ArbZG); § 21a ArbZG und die EU-Lenk- und Ruhezeiten gelten nicht, da Taxis höchstens 9 Personen befördern."}, {"id": 463, "gesetz": "ArbZG", "frage": "#0463 Welche Regelungen gelten für den Straßentransport?", "antworten": ["Maximal 47 Stunden Wochenarbeitszeit, verlängerbar auf 60 Stunden, wenn der Schnitt über 4 Monate 48 Stunden nicht überschreitet (§ 21a Abs. 4 ArbZG).", "Maximal 48 Stunden Wochenarbeitszeit, verlängerbar auf 60 Stunden, wenn der Schnitt über 4 Monate 48 Stunden nicht überschreitet (§ 21a Abs. 4 ArbZG).", "Maximal 49 Stunden Wochenarbeitszeit, verlängerbar auf 60 Stunden, wenn der Schnitt über 4 Monate 48 Stunden nicht überschreitet (§ 21a Abs. 4 ArbZG)."], "richtig": 1, "erklaerung": "Maximal 48 Stunden Wochenarbeitszeit, verlängerbar auf 60 Stunden, wenn der Schnitt über 4 Monate 48 Stunden nicht überschreitet (§ 21a Abs. 4 ArbZG)."}, {"id": 464, "gesetz": "ArbZG", "frage": "#0464 Müssen Taxifahrer Ruhepausen einhalten?", "antworten": ["Ja, angestellte Taxifahrer haben Anspruch auf 30 Minuten Pause bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden Arbeitszeit, spätestens nach 6 Stunden (§ 4 ArbZG).", "Ja, angestellte Taxifahrer müssen nach jeweils 2 Stunden Fahrzeit eine Pause von 15 Minuten einlegen, unabhängig von der Gesamtdauer der Arbeitszeit (§ 4 ArbZG).", "Nein, Taxifahrer sind von der Pausenpflicht ausgenommen, da Wartezeiten am Taxistand als Pausen gelten; maßgeblich ist allein die Lenkzeit (§ 4 ArbZG)."], "richtig": 0, "erklaerung": "Ja, angestellte Taxifahrer haben Anspruch auf 30 Minuten Pause bei mehr als 6 und 45 Minuten bei mehr als 9 Stunden Arbeitszeit, spätestens nach 6 Stunden (§ 4 ArbZG)."}, {"id": 465, "gesetz": "ArbZG", "frage": "#0465 Ist Sonntagsarbeit grundsätzlich erlaubt?", "antworten": ["Nein, Arbeitgeber dürfen von 0 bis 24 Uhr nicht beschäftigt werden (§ 9 Abs. 1 ArbZG).", "Ja, Arbeitnehmer dürfen von 0 bis 24 Uhr nicht beschäftigt werden (§ 9 Abs. 1 ArbZG).", "Nein, Arbeitnehmer dürfen von 0 bis 24 Uhr nicht beschäftigt werden (§ 9 Abs. 1 ArbZG)."], "richtig": 2, "erklaerung": "Nein, Arbeitnehmer dürfen von 0 bis 24 Uhr nicht beschäftigt werden (§ 9 Abs. 1 ArbZG)."}, {"id": 466, "gesetz": "ArbZG", "frage": "#0466 Gilt für Taxi- und Mietwagenfahrer die Sonn- und Feiertagsruhe?", "antworten": ["Ja, ausnahmslos; Taxi- und Mietwagenfahrer dürfen an Sonn- und Feiertagen nur mit Genehmigung der Aufsichtsbehörde beschäftigt werden (§ 10 Abs. 1 Nr. 10, § 11 ArbZG).", "Nein, im Verkehrsgewerbe gilt keine Sonntagsruhe; Ersatzruhetage oder freie Sonntage müssen den Fahrern daher nicht gewährt werden (§ 10 Abs. 1 Nr. 10, § 11 ArbZG).", "Grundsätzlich ja, doch dürfen sie als Beschäftigte in Verkehrsbetrieben an Sonn- und Feiertagen arbeiten; dafür sind Ersatzruhetage und 15 freie Sonntage zu gewähren (§ 10 Abs. 1 Nr. 10, § 11 ArbZG)."], "richtig": 2, "erklaerung": "Grundsätzlich ja, doch dürfen sie als Beschäftigte in Verkehrsbetrieben an Sonn- und Feiertagen arbeiten; dafür sind Ersatzruhetage und 15 freie Sonntage zu gewähren (§ 10 Abs. 1 Nr. 10, § 11 ArbZG)."}, {"id": 467, "gesetz": "ArbZG", "frage": "#0467 Welche Ausnahmen von der Sonn- und Feiertagsruhe gibt es?", "antworten": ["Die Zeit vom Beginn bis zum Ende der Arbeit ohne Ruhepausen (§ 2 Abs. 1 ArbZG).", "Notdienste, Krankenhäuser, Verkehrsbetriebe, Gastronomie, Rundfunk, Freizeitbetriebe u. a. (§ 10 Abs. 1 ArbZG).", "Die zuständige Aufsichtsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG)."], "richtig": 1, "erklaerung": "Notdienste, Krankenhäuser, Verkehrsbetriebe, Gastronomie, Rundfunk, Freizeitbetriebe u. a. (§ 10 Abs. 1 ArbZG)."}, {"id": 468, "gesetz": "ArbZG", "frage": "#0468 Wie viele arbeitsfreie Sonntage müssen Arbeitnehmer pro Jahr haben?", "antworten": ["Mindestens 11 Stunden (§ 5 Abs. 1 ArbZG).", "Mit Geldbußen oder in schweren Fällen mit Freiheitsstrafe bis zu einem Jahr (§ 23 ArbZG).", "Mindestens 15 Sonntage (§ 11 Abs. 1 ArbZG)."], "richtig": 2, "erklaerung": "Mindestens 15 Sonntage (§ 11 Abs. 1 ArbZG)."}, {"id": 469, "gesetz": "ArbZG", "frage": "#0469 Wann muss ein Ersatzruhetag für Sonntagsarbeit gewährt werden?", "antworten": ["Mindestens 15 Sonntage (§ 11 Abs. 1 ArbZG).", "Innerhalb von zwei Wochen (§ 11 Abs. 3 ArbZG).", "Wenn regelmäßig Arbeitsbereitschaft oder Bereitschaftsdienst anfällt (§ 7 Abs. 1 ArbZG)."], "richtig": 1, "erklaerung": "Innerhalb von zwei Wochen (§ 11 Abs. 3 ArbZG)."}, {"id": 470, "gesetz": "ArbZG", "frage": "#0470 Welche Arbeitszeitbegrenzungen gelten für Nachtarbeiter?", "antworten": ["Maximal 12 Stunden, ausnahmsweise 10 Stunden, wenn im Monatsdurchschnitt 8 Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG).", "Maximal 8 Stunden, ausnahmsweise 10 Stunden, wenn im Monatsdurchschnitt 8 Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG).", "Maximal 4 Stunden, ausnahmsweise 10 Stunden, wenn im Monatsdurchschnitt 8 Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG)."], "richtig": 1, "erklaerung": "Maximal 8 Stunden, ausnahmsweise 10 Stunden, wenn im Monatsdurchschnitt 8 Stunden nicht überschritten werden (§ 6 Abs. 2 ArbZG)."}, {"id": 471, "gesetz": "ArbZG", "frage": "#0471 Haben Nachtarbeiter Anspruch auf Gesundheitsuntersuchungen?", "antworten": ["Ja, alle 5 Jahre, ab 50 Jahren jährlich, auf Kosten des Arbeitgebers (§ 6 Abs. 3 ArbZG).", "Ja, alle 2 Jahre, ab 50 Jahren jährlich, auf Kosten des Arbeitgebers (§ 6 Abs. 3 ArbZG).", "Ja, alle 3 Jahre, ab 50 Jahren jährlich, auf Kosten des Arbeitgebers (§ 6 Abs. 3 ArbZG)."], "richtig": 2, "
