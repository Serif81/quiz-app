ten ist nur zur Hälfte abziehbar, da Taxen auch privat genutzt werden können (§ 15 Abs. 1 UStG)."], "richtig": 0, "erklaerung": "Leasingraten enthalten Umsatzsteuer, die bei ordnungsgemäßer Rechnung als Vorsteuer abziehbar ist (§ 15 Abs. 1 UStG)."}, {"id": 1315, "gesetz": "UStDV", "frage": "#1315 Welche Anforderungen gelten für den Nachweis von steuerfreien Krankenfahrten?", "antworten": ["Krankenfahrten im Taxi sind steuerpflichtig; steuerfrei sind nur Beförderungen in besonders eingerichteten Fahrzeugen, deren Ausstattung nachzuweisen ist (§ 4 Nr. 17 Buchst. b UStG).", "Alle Krankenfahrten sind steuerfrei, sofern die Krankenkasse direkt bezahlt; ein besonderer Nachweis ist dann nicht erforderlich (§ 4 Nr. 17 Buchst. b UStG).", "Krankenfahrten im Taxi sind steuerfrei, wenn eine ärztliche Verordnung vorliegt, die als Nachweis aufzubewahren ist (§ 4 Nr. 17 Buchst. b UStG)."], "richtig": 0, "erklaerung": "Krankenfahrten im Taxi sind steuerpflichtig; steuerfrei sind nur Beförderungen in besonders eingerichteten Fahrzeugen, deren Ausstattung nachzuweisen ist (§ 4 Nr. 17 Buchst. b UStG)."}, {"id": 1316, "gesetz": "UStDV", "frage": "#1316 Welche steuerlichen Regelungen gelten für innergemeinschaftliche Lieferungen von Taxi-Fahrzeugen?", "antworten": ["Unternehmer müssen den Gelangensnachweis erbringen (§§ 17a-17d UStDV).", "Fahrer müssen den Gelangensnachweis erbringen (§§ 17a-17d UStDV).", "Unternehmen können die gezahlte Vorsteuer abziehen, wenn die Leistungen für das Unternehmen genutzt werden (§ 15 UStG, § 35 UStDV)."], "richtig": 0, "erklaerung": "Unternehmer müssen den Gelangensnachweis erbringen (§§ 17a-17d UStDV)."}, {"id": 1317, "gesetz": "UStDV", "frage": "#1317 Wann kann ein Taxiunternehmen die Steuerbefreiung für grenzüberschreitende Beförderungen nutzen?", "antworten": ["Wenn der Auslandsanteil mehr als die Hälfte der Strecke ausmacht; dann ist auch der Inlandsanteil steuerfrei und nicht beim Finanzamt anzumelden (§ 3b Abs. 1 UStG).", "Immer, wenn Start- oder Zielort im Ausland liegt; dann ist die gesamte Fahrt in Deutschland steuerfrei (§ 3b Abs. 1 UStG).", "Gar nicht: Der inländische Streckenanteil ist steuerpflichtig, nur der Auslandsanteil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG)."], "richtig": 2, "erklaerung": "Gar nicht: Der inländische Streckenanteil ist steuerpflichtig, nur der Auslandsanteil ist in Deutschland nicht steuerbar (§ 3b Abs. 1 UStG)."}, {"id": 1318, "gesetz": "UStDV", "frage": "#1318 Welche steuerlichen Aufzeichnungspflichten haben Kleinunternehmer im Taxi-Gewerbe?", "antworten": ["Sie müssen jede Fahrt einzeln mit Namen des Fahrgastes aufzeichnen (§ 65 UStDV); in Rechnungen ist der ermäßigte Steuersatz von 7 % anzugeben (§ 34a UStDV).", "Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV); in Rechnungen ist auf die Kleinunternehmerbefreiung hinzuweisen (§ 34a UStDV).", "Sie sind von allen Aufzeichnungspflichten befreit (§ 65 UStDV); in Rechnungen müssen sie dennoch 19 % Umsatzsteuer gesondert ausweisen (§ 34a UStDV)."], "richtig": 1, "erklaerung": "Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV); in Rechnungen ist auf die Kleinunternehmerbefreiung hinzuweisen (§ 34a UStDV)."}, {"id": 1319, "gesetz": "UStDV", "frage": "#1319 Welche Regelungen gelten für Umsätze mit Gutscheinen im Taxigewerbe?", "antworten": ["Alle Gutscheine sind umsatzsteuerfrei, da sie lediglich Zahlungsmittel darstellen, auch bei späterer Einlösung (§ 3 Abs. 13–15 UStG).", "Einzweck-Gutscheine unterliegen der Umsatzsteuer bereits bei Ausgabe, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 Abs. 13–15 UStG).", "Mehrzweck-Gutscheine unterliegen der Umsatzsteuer bereits bei Ausgabe, Einzweck-Gutscheine erst bei Einlösung (§ 3 Abs. 13–15 UStG)."], "richtig": 1, "erklaerung": "Einzweck-Gutscheine unterliegen der Umsatzsteuer bereits bei Ausgabe, Mehrzweck-Gutscheine erst bei Einlösung (§ 3 Abs. 13–15 UStG)."}, {"id": 1320, "gesetz": "UStDV", "frage": "#1320 Was passiert, wenn ein Taxiunternehmen irrtümlich den falschen Umsatzsteuersatz anwendet?", "antworten": ["Das Finanzamt kann Steuernachzahlungen fordern, und Kunden könnten Umsatzsteuer nicht abziehen (§ 14c UStG).", "Bei Fahrten ins Ausland, sofern der Nachweis gemäß § 8 UStDV geführt wird.", "Das Finanzamt kann Steuernachzahlungen fordern, und Kunden könnten Vorsteuer nicht abziehen (§ 14c UStG)."], "richtig": 2, "erklaerung": "Das Finanzamt kann Steuernachzahlungen fordern, und Kunden könnten Vorsteuer nicht abziehen (§ 14c UStG)."}, {"id": 1321, "gesetz": "UStDV", "frage": "#1321 Wann kann ein Taxiunternehmen den Vorsteuerabzug für ein Fahrzeug geltend machen?", "antworten": ["Wenn das Fahrzeug zu mindestens 50 % unternehmerisch genutzt wird; die Privatnutzung bleibt dann umsatzsteuerfrei (§ 15 Abs. 1, § 3 Abs. 9a UStG).", "Nur wenn das Fahrzeug neu angeschafft und ausschließlich als Taxi genutzt wird; Gebrauchtfahrzeuge sind ausgeschlossen (§ 15 Abs. 1, § 3 Abs. 9a UStG).", "Wenn das Fahrzeug zu mindestens 10 % unternehmerisch genutzt und dem Unternehmen zugeordnet wird; die Privatnutzung ist dann als Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG)."], "richtig": 2, "erklaerung": "Wenn das Fahrzeug zu mindestens 10 % unternehmerisch genutzt und dem Unternehmen zugeordnet wird; die Privatnutzung ist dann als Wertabgabe zu versteuern (§ 15 Abs. 1, § 3 Abs. 9a UStG)."}, {"id": 1322, "gesetz": "UStDV", "frage": "#1322 Wie müssen Taxiunternehmen die Aufzeichnungspflichten für steuerfreie Umsätze erfüllen?", "antworten": ["Steuerfreie Umsätze sind getrennt von den steuerpflichtigen aufzuzeichnen und durch Belege nachzuweisen (§ 22 Abs. 2 UStG, § 63 UStDV).", "Steuerfreie Umsätze sind nur in der Jahreserklärung pauschal zu schätzen; Belege sind dafür nicht erforderlich (§ 22 Abs. 2 UStG, § 63 UStDV).", "Steuerfreie Umsätze dürfen mit steuerpflichtigen zusammen aufgezeichnet werden, solange sie 10 % nicht übersteigen (§ 22 Abs. 2 UStG, § 63 UStDV)."], "richtig": 0, "erklaerung": "Steuerfreie Umsätze sind getrennt von den steuerpflichtigen aufzuzeichnen und durch Belege nachzuweisen (§ 22 Abs. 2 UStG, § 63 UStDV)."}, {"id": 1323, "gesetz": "UStDV", "frage": "#1323 Welche steuerlichen Konsequenzen haben Fehler bei der Rechnungsstellung?", "antworten": ["Fehlerhafte Rechnungen müssen berichtigt werden, sonst drohen steuerliche Nachteile (§ 31 UStDV).", "Unternehmer müssen einen buchmäßigen Nachweis gemäß §§ 13, 21 UStDV erbringen.", "Sie müssen ihre Umsätze lückenlos dokumentieren und steuerliche Vorteile nutzen (§ 65 UStDV)."], "richtig": 0, "erklaerung": "Fehlerhafte Rechnungen müssen berichtigt werden, sonst drohen steuerliche Nachteile (§ 31 UStDV)."}, {"id": 1324, "gesetz": "UStDV", "frage": "#1324 Wie wird die Umsatzsteuer für Taxiunternehmen mit mehreren Standorten behandelt?", "antworten": ["Die Umsatzsteuer wird nach der Zahl der Taxen auf die Finanzämter der Standorte aufgeteilt und dort jeweils erklärt und anteilig abgeführt (§ 2 Abs. 1 UStG, § 21 AO).", "Alle Standorte bilden ein Unternehmen; die Umsatzsteuer wird einheitlich beim Finanzamt am Ort der Geschäftsleitung erklärt (§ 2 Abs. 1 UStG, § 21 AO).", "Jeder Standort gilt als eigenes Unternehmen und gibt eine eigene Umsatzsteuererklärung beim örtlichen Finanzamt ab (§ 2 Abs. 1 UStG, § 21 AO)."], "richtig": 1, "erklaerung": "Alle Standorte bilden ein Unternehmen; die Umsatzsteuer wird einheitlich beim Finanzamt am Ort der Geschäftsleitung erklärt (§ 2 Abs. 1 UStG, § 21 AO)."}, {"id": 1325, "gesetz": "UStDV", "frage": "#1325 Welche steuerlichen Regeln gelten für Taxiunternehmen mit ausländischen Fahrgästen?", "antworten": ["Fahrten mit ausländischen Fahrgästen sind als Ausfuhrleistungen steuerfrei, wenn der Fahrgast seinen Reisepass vorlegt (§ 3b Abs. 1 UStG).", "Keine besonderen: Fahrten im Inland sind auch für ausländische Fahrgäste steuerpflichtig, da die Beförderung dort ausgeführt wird, wo sie bewirkt wird (§ 3b Abs. 1 UStG).", "Für ausländische Fahrgäste gilt stets der volle Steuersatz von 19 %, auch bei Taxifahrten innerhalb der Gemeinde (§ 3b Abs. 1 UStG)."], "richtig": 1, "erklaerung": "Keine besonderen: Fahrten im Inland sind auch für ausländische Fahrgäste steuerpflichtig, da die Beförderung dort ausgeführt wird, wo sie bewirkt wird (§ 3b Abs. 1 UStG)."}, {"id": 1326, "gesetz": "UStDV", "frage": "#1326 Darf ein Taxiunternehmen eine Steuerbefreiung für gemeinnützige Fahrten nutzen?", "antworten": ["Nein, Fahrten eines gewerblichen Taxiunternehmers sind auch für gemeinnützige Auftraggeber steuerpflichtig (§ 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen).", "Ja, gemeinnützige Fahrten werden auf Antrag mit dem Nullsteuersatz besteuert (§ 4 Nr. 18 UStG gilt für alle Personenbeförderer mit Taxigenehmigung).", "Ja, ist der Auftraggeber gemeinnützig, sind alle Fahrten in seinem Auftrag steuerfrei, auch Schüler- und Behindertenfahrten (§ 4 Nr. 18 UStG gilt für alle Fahrten im Auftrag gemeinnütziger Vereine)."], "richtig": 0, "erklaerung": "Nein, Fahrten eines gewerblichen Taxiunternehmers sind auch für gemeinnützige Auftraggeber steuerpflichtig (§ 4 Nr. 18 UStG gilt nur für nicht gewinnorientierte Einrichtungen)."}, {"id": 1327, "gesetz": "UStDV", "frage": "#1327 Wie werden steuerfreie Fahrausweise im internationalen Verkehr behandelt?", "antworten": ["Sie gelten nur als Rechnung, wenn bescheinigt ist, welcher Anteil des Fahrpreises auf die Inlandsstrecke entfällt und welcher Steuersatz gilt (§ 34 Abs. 2 UStDV).", "Sie gelten nie als Rechnung; für grenzüberschreitende Fahrten ist immer eine vollständige Rechnung nach § 14 UStG auszustellen (§ 34 Abs. 2 UStDV).", "Sie gelten stets als Rechnung, auch ohne Angabe von Steuersatz oder Inlandsanteil, wenn der Gesamtbetrag 250 € nicht übersteigt und vollständig bar bezahlt wurde (§ 34 Abs. 2 UStDV)."], "richtig": 0, "erklaerung": "Sie gelten nur als Rechnung, wenn bescheinigt ist, welcher Anteil des Fahrpreises auf die Inlandsstrecke entfällt und welcher Steuersatz gilt (§ 34 Abs. 2 UStDV)."}, {"id": 1328, "gesetz": "UStDV", "frage": "#1328 Welche steuerlichen Aufzeichnungspflichten gelten für Kleinunternehmer im Taxigewerbe?", "antworten": ["Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV).", "Sie sind von allen Aufzeichnungspflichten befreit, da sie keine Umsatzsteuer abführen (§ 65 UStDV).", "Sie müssen die Entgelte nach Steuersätzen getrennt sowie alle Vorsteuerbeträge aufzeichnen (§ 65 UStDV)."], "richtig": 0, "erklaerung": "Sie müssen die vereinnahmten Entgelte und unentgeltliche Wertabgaben aufzeichnen (§ 65 UStDV)."}, {"id": 1329, "gesetz": "UStDV", "frage": "#1329 Wie kann ein Taxiunternehmen seine Umsatzsteuererklärung berichtigen?", "antworten": ["Nur per Einspruch innerhalb eines Monats nach Abgabe; danach ist eine Berichtigung ausgeschlossen (§ 153 AO, § 18 UStG).", "Durch formlosen Anruf beim Finanzamt; eine schriftliche oder elektronische Korrektur ist nicht vorgesehen (§ 153 AO, § 18 UStG).", "Durch Abgabe einer berichtigten Umsatzsteuererklärung bzw. -voranmeldung, sobald der Fehler erkannt wird (§ 153 AO, § 18 UStG)."], "richtig": 2, "erklaerung": "Durch Abgabe einer berichtigten Umsatzsteuererklärung bzw. -voranmeldung, sobald der Fehler erkannt wird (§ 153 AO, § 18 UStG)."}, {"id": 1330, "gesetz": "UStDV", "frage": "#1330 Welche Vorschriften gelten für steuerliche Nachweise bei innergemeinschaftlichen Lieferungen?", "antworten": ["Für jede Lieferung ist eine Unbedenklichkeitsbescheinigung des Zolls vorzulegen (§§ 17a–17d UStDV).", "Es genügt eine Rechnung mit dem Hinweis „steuerfrei“; weitere Nachweise sind nicht nötig (§§ 17a–17d UStDV).", "Gelangensnachweis und buchmäßiger Nachweis müssen eingehalten werden (§§ 17a–17d UStDV)."], "richtig": 2, "erklaerung": "Gelangensnachweis und buchmäßiger Nachweis müssen eingehalten werden (§§ 17a–17d UStDV)."}, {"id": 1351, "gesetz": "KraftStG", "frage": "#1351 Welche Steuerpflicht besteht für inländische Taxi- und Mietwagenunternehmen?", "antworten": ["Ja, Elektro-Taxis sind temporär steuerbefreit (§ 3d KraftStG).", "Das Halten von inländischen Fahrzeugen zum Verkehr auf öffentlichen Straßen unterliegt der Kraftfahrzeugsteuer (§ 1 KraftStG).", "Das Halten von inländischen Fahrzeugen zum Verkehr auf privaten Straßen unterliegt der Kraftfahrzeugsteuer (§ 1 KraftStG)."], "richtig": 1, "erklaerung": "Das Halten von inländischen Fahrzeugen zum Verkehr auf öffentlichen Straßen unterliegt der Kraftfahrzeugsteuer (§ 1 KraftStG)."}, {"id": 1352, "gesetz": "KraftStG", "frage": "#1352 Welche Fahrzeuge sind von der Kraftfahrzeugsteuer befreit?", "antworten": ["Fahrzeuge bestimmter Zwecke (z. B. Behörden-, Polizei-, Taxifahrzeuge) sowie Elektro- und Hybridfahrzeuge bei Erstzulassung in Deutschland bis 31.12.2025, längstens bis 31.12.2030 (§§ 3, 3d KraftStG).", "Alle Taxen und Mietwagen wegen ihres Einsatzes im öffentlichen Verkehr sowie Hybridfahrzeuge bei Erstzulassung bis 31.12.2030 (§§ 3, 3d KraftStG).", "Fahrzeuge bestimmter Zwecke (z. B. Behörden-, Polizei-, Krankenfahrzeuge) sowie Elektrofahrzeuge bei Erstzulassung bis 31.12.2030, längstens bis 31.12.2035 (§§ 3, 3d KraftStG)."], "richtig": 2, "erklaerung": "Fahrzeuge bestimmter Zwecke (z. B. Behörden-, Polizei-, Krankenfahrzeuge) sowie Elektrofahrzeuge bei Erstzulassung bis 31.12.2030, längstens bis 31.12.2035 (§§ 3, 3d KraftStG)."}, {"id": 1353, "gesetz": "KraftStG", "frage": "#1353 Gibt es Steuervergünstigungen für Mietwagenunternehmen?", "antworten": ["Ja, für Mietwagenunternehmen gelten keine besonderen Steuervergünstigungen. Es gilt die allgemeine Kraftfahrzeugsteuerpflicht.", "Nein, für Taxenunternehmen gelten keine besonderen Steuervergünstigungen. Es gilt die allgemeine Kraftfahrzeugsteuerpflicht.", "Nein, für Mietwagenunternehmen gelten keine besonderen Steuervergünstigungen. Es gilt die allgemeine Kraftfahrzeugsteuerpflicht."], "richtig": 2, "erklaerung": "Nein, für Mietwagenunternehmen gelten keine besonderen Steuervergünstigungen. Es gilt die allgemeine Kraftfahrzeugsteuerpflicht."}, {"id": 1354, "gesetz": "KraftStG", "frage": "#1354 Welche Anforderungen gelten für die Steuerermäßigung bei Schwerbehinderten?", "antworten": ["Fahrzeuge von schwerbehinderten Personen mit bestimmten Merkzeichen können eine Steuerermäßigung erhalten (§ 3a KraftStG).", "Elektrofahrzeuge sind für eine befristete Zeit von der Steuer befreit (§ 3d KraftStG).", "Nein, Mietwagen sind steuerpflichtig und unterliegen den normalen Steuersätzen."], "richtig": 0, "erklaerung": "Fahrzeuge von schwerbehinderten Personen mit bestimmten Merkzeichen können eine Steuerermäßigung erhalten (§ 3a KraftStG)."}, {"id": 1355, "gesetz": "KraftStG", "frage": "#1355 Wann endet die Steuerpflicht für ein Taxi oder einen Mietwagen?", "antworten": ["Mit der Abmeldung des Fahrzeugs oder der Stilllegung (§ 5 KraftStG).", "Ja, solange es zugelassen ist und die Steuer nicht rückständig ist.", "Je nach Emissionsklasse kann die Steuer steigen oder fallen (§ 3b KraftStG)."], "richtig": 0, "erklaerung": "Mit der Abmeldung des Fahrzeugs oder der Stilllegung (§ 5 KraftStG)."}, {"id": 1356, "gesetz": "KraftStG", "frage": "#1356 Welche Steuerpflicht besteht für ausländische Mietwagen, die in Deutschland fahren?", "antworten": ["Ausländische Fahrzeuge sind steuerpflichtig, solange sie sich im Inland befinden; die Befreiung für vorübergehenden Aufenthalt entfällt bei entgeltlicher Personenbeförderung (§ 1 Abs. 1 Nr. 2, § 3 Nr. 13 KraftStG).", "Ausländische Fahrzeuge sind erst steuerpflichtig, wenn sie länger als zwei Jahre ununterbrochen im Inland bleiben, unabhängig von der Nutzung (§ 1 Abs. 1 Nr. 2, § 3 Nr. 13 KraftStG).", "Ausländische Mietwagen sind unbegrenzt steuerfrei, solange sie im Ausland zugelassen sind, auch bei entgeltlicher Personenbeförderung (§ 1 Abs. 1 Nr. 2, § 3 Nr. 13 KraftStG)."], "richtig": 0, "erklaerung": "Ausländische Fahrzeuge sind steuerpflichtig, solange sie sich im Inland befinden; die Befreiung für vorübergehenden Aufenthalt entfällt bei entgeltlicher Personenbeförderung (§ 1 Abs. 1 Nr. 2, § 3 Nr. 13 KraftStG)."}, {"id": 1357, "gesetz": "KraftStG", "frage": "#1357 Welche Sonderregelungen gibt es für Elektro-Taxis?", "antworten": ["Elektrofahrzeuge mit Erstzulassung bis 31.12.2030 sind zehn Jahre, längstens bis 31.12.2035, steuerbefreit (§ 3d KraftStG).", "Elektro-Taxis sind dauerhaft steuerfrei, solange sie als Taxi genutzt werden, unabhängig vom Datum der Erstzulassung (§ 3d KraftStG).", "Elektro-Taxis zahlen fünf Jahre lang den halben Steuersatz und danach den vollen Satz nach Hubraum (§ 3d KraftStG)."], "richtig": 0, "erklaerung": "Elektrofahrzeuge mit Erstzulassung bis 31.12.2030 sind zehn Jahre, längstens bis 31.12.2035, steuerbefreit (§ 3d KraftStG)."}, {"id": 1358, "gesetz": "KraftStG", "frage": "#1358 Welche Steuervergünstigungen gibt es für emissionsarme Dieselfahrzeuge?", "antworten": ["Schadstoffreduzierte Diesel-Pkw der Norm Euro 6 sind bis 31.12.2030 vollständig steuerbefreit; danach gilt der Steuersatz nach Hubraum und Baujahr des Fahrzeugs (§§ 3b, 9 KraftStG).", "Keine mehr; die Befreiung für schadstoffreduzierte Diesel-Pkw ist 2013 ausgelaufen. Die Steuer richtet sich nach Hubraum und CO2-Ausstoß (§§ 3b, 9 KraftStG).", "Diesel-Taxis mit Rußpartikelfilter erhalten dauerhaft einen Abschlag von 50 % auf den Hubraumanteil der Steuer (§§ 3b, 9 KraftStG)."], "richtig": 1, "erklaerung": "Keine mehr; die Befreiung für schadstoffreduzierte Diesel-Pkw ist 2013 ausgelaufen. Die Steuer richtet sich nach Hubraum und CO2-Ausstoß (§§ 3b, 9 KraftStG)."}, {"id": 1359, "gesetz": "KraftStG", "frage": "#1359 Wie wird die Steuer für ein Taxi berechnet?", "antworten": ["Mit der Abmeldung des Fahrzeugs oder der Stilllegung (§ 5 KraftStG).", "Ja, Elektro-Taxis sind temporär steuerbefreit (§ 3d KraftStG).", "Die Steuer richtet sich nach Hubraum, CO₂-Ausstoß und Fahrzeugtyp (§ 8 KraftStG)."], "richtig": 2, "erklaerung": "Die Steuer richtet sich nach Hubraum, CO₂-Ausstoß und Fahrzeugtyp (§ 8 KraftStG)."}, {"id": 1360, "gesetz": "KraftStG", "frage": "#1360 Wie wird die Kfz-Steuer für Mietwagen festgelegt?", "antworten": ["Bis zur offiziellen Abmeldung bei der Zulassungsstelle (§ 5 KraftStG).", "Taxen unterliegen den regulären Steuersätzen, abhängig von Fahrzeugtyp und Emissionen (§ 9 KraftStG).", "Mietwagen unterliegen den regulären Steuersätzen, abhängig von Fahrzeugtyp und Emissionen (§ 9 KraftStG)."], "richtig": 2, "erklaerung": "Mietwagen unterliegen den regulären Steuersätzen, abhängig von Fahrzeugtyp und Emissionen (§ 9 KraftStG)."}, {"id": 1361, "gesetz": "KraftStG", "frage": "#1361 Wer ist Steuerschuldner für ein Taxi?", "antworten": ["Der Fahrzeughalter (§ 7 KraftStG).", "Die Steuerpflicht bleibt bestehen, bis die Fahrzeuge offiziell abgemeldet sind.", "Der Leasingnehmer ist oft nicht steuerpflichtig; die Verantwortung liegt beim Halter."], "richtig": 0, "erklaerung": "Der Fahrzeughalter (§ 7 KraftStG)."}, {"id": 1362, "gesetz": "KraftStG", "frage": "#1362 Welche Bedeutung hat der Begriff „Bemessungsgrundlage“ in der Kfz-Steuer?", "antworten": ["Nein, für Mietwagenunternehmen gelten keine besonderen Steuervergünstigungen. Es gilt die allgemeine Kraftfahrzeugsteuerpflicht.", "Die Höhe der Steuer wird anhand von Hubraum, Emissionen und Fahrzeugart bestimmt (§ 8 KraftStG).", "Fahrzeuge, die ausschließlich für bestimmte Zwecke genutzt werden, wie z. B. Elektrofahrzeuge und besonders schadstoffarme Fahrzeuge (§ 3, § 3d KraftStG)."], "richtig": 1, "erklaerung": "Die Höhe der Steuer wird anhand von Hubraum, Emissionen und Fahrzeugart bestimmt (§ 8 KraftStG)."}, {"id": 1363, "gesetz": "KraftStG", "frage": "#1363 Gibt es Steuerermäßigungen für Hybridfahrzeuge im Taxi-Gewerbe?", "antworten": ["Ja, Hybridfahrzeuge können eine geringere Kfz-Steuer haben, da sie auf Basis ihrer CO₂-Emissionen und des Hubraums besteuert werden (§ 9 KraftStG).", "Nein, Hybridfahrzeuge können eine geringere Kfz-Steuer haben, da sie auf Basis ihrer CO₂-Emissionen und des Hubraums besteuert werden (§ 9 KraftStG).", "Das Fahrzeug kann zwangsstillgelegt werden, bis die Steuer entrichtet wurde (§ 14 KraftStG)."], "richtig": 0, "erklaerung": "Ja, Hybridfahrzeuge können eine geringere Kfz-Steuer haben, da sie auf Basis ihrer CO₂-Emissionen und des Hubraums besteuert werden (§ 9 KraftStG)."}, {"id": 1364, "gesetz": "KraftStG", "frage": "#1364 Wie lange ist ein Fahrzeug nach der Stilllegung noch steuerpflichtig?", "antworten": ["Die Steuerpflicht läuft nach der Außerbetriebsetzung noch bis zum Ende des Kalenderjahres weiter; maßgebend ist das Jahr der Erstzulassung des jeweiligen Fahrzeugs (§ 5 Abs. 4 KraftStG).", "Die Steuerpflicht endet mit der Außerbetriebsetzung bei der Zulassungsstelle; maßgebend ist der spätere Tag von Eintragung und Entstempelung (§ 5 Abs. 4 KraftStG).", "Die Steuerpflicht endet erst drei Monate nach der Außerbetriebsetzung; maßgebend ist der Eingang der Mitteilung beim Hauptzollamt (§ 5 Abs. 4 KraftStG)."], "richtig": 1, "erklaerung": "Die Steuerpflicht endet mit der Außerbetriebsetzung bei der Zulassungsstelle; maßgebend ist der spätere Tag von Eintragung und Entstempelung (§ 5 Abs. 4 KraftStG)."}, {"id": 1365, "gesetz": "KraftStG", "frage": "#1365 Welche Konsequenzen drohen bei nicht gezahlter Kfz-Steuer?", "antworten": ["Ja, solange es zugelassen ist und die Steuer nicht rückständig ist.", "Elektrofahrzeuge sind für eine befristete Zeit von der Steuer befreit (§ 3d KraftStG).", "Das Fahrzeug kann zwangsstillgelegt werden, bis die Steuer entrichtet wurde (§ 14 KraftStG)."], "richtig": 2, "erklaerung": "Das Fahrzeug kann zwangsstillgelegt werden, bis die Steuer entrichtet wurde (§ 14 KraftStG)."}, {"id": 1366, "gesetz": "KraftStG", "frage": "#1366 Darf ein Taxi während eines Steuerverfahrens weiter betrieben werden?", "antworten": ["Fahrzeuge von schwerbehinderten Personen mit bestimmten Merkzeichen können eine Steuerermäßigung erhalten (§ 3a KraftStG).", "Nein, solange es zugelassen ist und die Steuer nicht rückständig ist.", "Ja, solange es zugelassen ist und die Steuer nicht rückständig ist."], "richtig": 2, "erklaerung": "Ja, solange es zugelassen ist und die Steuer nicht rückständig ist."}, {"id": 1367, "gesetz": "KraftStG", "frage": "#1367 Welche Rolle spielt das Finanzamt bei der Kfz-Steuer für Taxiunternehmen?", "antworten": ["Das Finanzamt erhebt die Kfz-Steuer für gewerbliche Fahrzeuge, das Hauptzollamt nur für private Fahrzeuge.", "Das Finanzamt am Betriebssitz setzt die Kfz-Steuer jährlich im Voraus fest und zieht sie ein; der Zoll ist daran nicht beteiligt.", "Keine; die Kfz-Steuer wird von der Zollverwaltung (Hauptzollämter) festgesetzt und erhoben, nicht vom Finanzamt."], "richtig": 2, "erklaerung": "Keine; die Kfz-Steuer wird von der Zollverwaltung (Hauptzollämter) festgesetzt und erhoben, nicht vom Finanzamt."}, {"id": 1368, "gesetz": "KraftStG", "frage": "#1368 Wie wird die Steuer für Oldtimer-Taxis berechnet?", "antworten": ["Ja, Hybridfahrzeuge können eine geringere Kfz-Steuer haben, da sie auf Basis ihrer CO₂-Emissionen und des Hubraums besteuert werden (§ 9 KraftStG).", "Oldtimer mit H-Kennzeichen haben eine pauschale Steuerregelung (§ 9 KraftStG).", "Die Bundesfinanzverwaltung ist zuständig für die Erhebung und Verwaltung der Steuer (§ 1 KraftStG)."], "richtig": 1, "erklaerung": "Oldtimer mit H-Kennzeichen haben eine pauschale Steuerregelung (§ 9 KraftStG)."}, {"id": 1369, "gesetz": "KraftStG", "frage": "#1369 Wie wird die Kfz-Steuer bei Fahrzeugen mit Saisonkennzeichen berechnet?", "antworten": ["Die Steuer wird nur für den Betriebszeitraum des Saisonkennzeichens tageweise erhoben (§ 5 Abs. 1 Nr. 5, § 11 Abs. 4 Nr. 3 KraftStG).", "Die Steuer wird für das Saisonhalbjahr pauschal erhoben, unabhängig von der Länge des Betriebszeitraums (§ 5 Abs. 1 Nr. 5, § 11 Abs. 4 Nr. 3 KraftStG).", "Die Steuer wird stets für das volle Kalenderjahr erhoben, auch bei nur saisonaler Zulassung (§ 5 Abs. 1 Nr. 5, § 11 Abs. 4 Nr. 3 KraftStG)."], "richtig": 0, "erklaerung": "Die Steuer wird nur für den Betriebszeitraum des Saisonkennzeichens tageweise erhoben (§ 5 Abs. 1 Nr. 5, § 11 Abs. 4 Nr. 3 KraftStG)."}, {"id": 1370, "gesetz": "KraftStG", "frage": "#1370 Welche Fristen gelten für die Steuerzahlung?", "antworten": ["Jährlich im Nachhinein; bei mehr als 2.000 € in Monatsraten, ebenfalls ohne Aufgeld (§ 11 KraftStG).", "Jährlich im Voraus; bei mehr als 500 € halbjährlich, bei mehr als 1.000 € vierteljährlich, jeweils mit Aufgeld (§ 11 KraftStG).", "Monatlich im Voraus; bei weniger als 500 € jährlich auf Antrag, jeweils ohne Aufgeld (§ 11 KraftStG)."], "richtig": 1, "erklaerung": "Jährlich im Voraus; bei mehr als 500 € halbjährlich, bei mehr als 1.000 € vierteljährlich, jeweils mit Aufgeld (§ 11 KraftStG)."}, {"id": 1371, "gesetz": "KraftStG", "frage": "#1371 Kann ein Taxiunternehmen eine Steuerbefreiung beantragen?", "antworten": ["Die Höhe der Steuer wird anhand von Hubraum, Emissionen und Fahrzeugart bestimmt (§ 8 KraftStG).", "Ja, es gibt keine generelle Steuerbefreiung für Taxiunternehmen.", "Nein, es gibt keine generelle Steuerbefreiung für Taxiunternehmen."], "richtig": 2, "erklaerung": "Nein, es gibt keine generelle Steuerbefreiung für Taxiunternehmen."}, {"id": 1372, "gesetz": "KraftStG", "frage": "#1372 Wie wirkt sich eine Umrüstung eines Taxis auf die Steuer aus?", "antworten": ["Ändern sich Emissionen oder Antrieb, wird die Steuer ab der Änderung neu festgesetzt (§ 5 Abs. 3, §§ 8, 9 KraftStG).", "Eine Umrüstung hat keine Auswirkung; die Steuer bleibt bis zur nächsten Neuzulassung unverändert (§ 5 Abs. 3, §§ 8, 9 KraftStG).", "Die Steuer wird erst ab dem folgenden Kalenderjahr neu festgesetzt, unabhängig vom Umrüstungszeitpunkt (§ 5 Abs. 3, §§ 8, 9 KraftStG)."], "richtig": 0, "erklaerung": "Ändern sich Emissionen oder Antrieb, wird die Steuer ab der Änderung neu festgesetzt (§ 5 Abs. 3, §§ 8, 9 KraftStG)."}, {"id": 1373, "gesetz": "KraftStG", "frage": "#1373 Welche Auswirkungen hat ein Fahrzeugwechsel auf die Steuer?", "antworten": ["Für das alte Fahrzeug endet die Steuerpflicht mit der Abmeldung, für das neue beginnt sie mit der Zulassung (§ 5 Abs. 1 Nr. 1 KraftStG).", "Das neue Fahrzeug übernimmt automatisch den Steuerbescheid des alten, ohne dass eine neue Festsetzung erfolgt (§ 5 Abs. 1 Nr. 1 KraftStG).", "Die Steuer für das alte Fahrzeug läuft bis zum Jahresende weiter und wird erst danach auf das neue übertragen (§ 5 Abs. 1 Nr. 1 KraftStG)."], "richtig": 0, "erklaerung": "Für das alte Fahrzeug endet die Steuerpflicht mit der Abmeldung, für das neue beginnt sie mit der Zulassung (§ 5 Abs. 1 Nr. 1 KraftStG)."}, {"id": 1374, "gesetz": "KraftStG", "frage": "#1374 Darf ein Mietwagen steuerfrei fahren?", "antworten": ["Ja, Mietwagen sind steuerpflichtig und unterliegen den normalen Steuersätzen.", "Nein, Taxen sind steuerpflichtig und unterliegen den normalen Steuersätzen.", "Nein, Mietwagen sind steuerpflichtig und unterliegen den normalen Steuersätzen."], "richtig": 2, "erklaerung": "Nein, Mietwagen sind steuerpflichtig und unterliegen den normalen Steuersätzen."}, {"id": 1375, "gesetz": "KraftStG", "frage": "#1375 Kann eine Kfz-Steuer zu hoch angesetzt sein?", "antworten": ["Ja, bei fehlerhafter Berechnung kann binnen eines Jahres Widerspruch bei der Zulassungsstelle des Wohnorts des Halters eingelegt werden (§§ 347, 355 AO).", "Ja, bei fehlerhafter Berechnung kann binnen eines Monats Einspruch beim zuständigen Hauptzollamt eingelegt werden (§§ 347, 355 AO).", "Nein, die Kfz-Steuer wird maschinell berechnet und ist deshalb weder anfechtbar noch änderbar (§§ 347, 355 AO)."], "richtig": 1, "erklaerung": "Ja, bei fehlerhafter Berechnung kann binnen eines Monats Einspruch beim zuständigen Hauptzollamt eingelegt werden (§§ 347, 355 AO)."}, {"id": 1376, "gesetz": "KraftStG", "frage": "#1376 Welche Regelungen gelten für die Versteuerung von Dienstwagen?", "antworten": ["Die Steuer wird unabhängig von der gewerblichen oder privaten Nutzung erhoben.", "Die Steuer wird unabhängig von der gewerblichen oder öffentlichen Nutzung erhoben.", "Nein, es gibt keine generelle Steuerbefreiung für Taxiunternehmen."], "richtig": 0, "erklaerung": "Die Steuer wird unabhängig von der gewerblichen oder privaten Nutzung erhoben."}, {"id": 1377, "gesetz": "KraftStG", "frage": "#1377 Wie wird die Steuer bei Leasingfahrzeugen geregelt?", "antworten": ["Leasingfahrzeuge sind für die Dauer des Leasingvertrags von der Kfz-Steuer befreit; Steuer fällt erst danach beim späteren Käufer an (§ 7 Nr. 1 KraftStG).", "Steuerschuldner ist, auf wen das Fahrzeug zugelassen ist, also je nach Vertrag der Leasinggeber oder der Leasingnehmer (§ 7 Nr. 1 KraftStG).", "Steuerschuldner ist immer der Leasingnehmer, unabhängig davon, auf wen das Fahrzeug zugelassen ist (§ 7 Nr. 1 KraftStG)."], "richtig": 1, "erklaerung": "Steuerschuldner ist, auf wen das Fahrzeug zugelassen ist, also je nach Vertrag der Leasinggeber oder der Leasingnehmer (§ 7 Nr. 1 KraftStG)."}, {"id": 1378, "gesetz": "KraftStG", "frage": "#1378 Was passiert mit der Kfz-Steuer bei Insolvenz eines Taxiunternehmens?", "antworten": ["Ja, bei fehlerhafter Berechnung kann Einspruch beim Finanzamt eingelegt werden.", "Die Steuerpflicht bleibt bestehen, bis die Fahrzeuge offiziell abgemeldet sind.", "Steuerbefreiung für Fahrzeuge mit besonders niedrigen Schadstoffwerten (§ 3b KraftStG)."], "richtig": 1, "erklaerung": "Die Steuerpflicht bleibt bestehen, bis die Fahrzeuge offiziell abgemeldet sind."}, {"id": 1379, "gesetz": "KraftStG", "frage": "#1379 Kann ein Taxiunternehmen steuerliche Vorteile bei der Umrüstung auf alternative Antriebe nutzen?", "antworten": ["Nein, Elektro-Taxis sind temporär steuerbefreit (§ 3d KraftStG).", "Ja, Elektro-Taxis sind temporär steuerbefreit (§ 3d KraftStG).", "Die Bundesfinanzverwaltung ist zuständig für die Erhebung und Verwaltung der Steuer (§ 1 KraftStG)."], "richtig": 1, "erklaerung": "Ja, Elektro-Taxis sind temporär steuerbefreit (§ 3d KraftStG)."}, {"id": 1380, "gesetz": "KraftStG", "frage": "#1380 Welche steuerlichen Pflichten bestehen für Taxiunternehmen mit mehreren Standorten?", "antworten": ["Die Kfz-Steuer ist je Standort beim örtlichen Hauptzollamt zu erklären und richtet sich nach dem Hebesatz der Gemeinde (§§ 1, 7 KraftStG).", "Ab dem dritten Standort wird statt der Steuer je Fahrzeug eine Flottenpauschale je Standort erhoben (§§ 1, 7 KraftStG).", "Keine besonderen; die Kfz-Steuer ist bundeseinheitlich und fällt je zugelassenem Fahrzeug beim Halter an (§§ 1, 7 KraftStG)."], "richtig": 2, "erklaerung": "Keine besonderen; die Kfz-Steuer ist bundeseinheitlich und fällt je zugelassenem Fahrzeug beim Halter an (§§ 1, 7 KraftStG)."}, {"id": 1401, "gesetz": "EStG", "frage": "#1401 Welche steuerlichen Pflichten haben Taxi- und Mietwagenunternehmer?", "antworten": ["Sie müssen Einkünfte aus dem Gewerbebetrieb versteuern (§ 15 EStG).", "Nein, freiwillige Trinkgelder sind steuerfrei (§ 3 Nr. 51 EStG).", "Alle Aufwendungen, die betrieblich veranlasst sind, z. B. Fahrzeugkosten, Treibstoff, Reparaturen, Versicherungen (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Sie müssen Einkünfte aus dem Gewerbebetrieb versteuern (§ 15 EStG)."}, {"id": 1402, "gesetz": "EStG", "frage": "#1402 Wie wird der Gewinn für Taxiunternehmen ermittelt?", "antworten": ["Entweder durch Bilanzierung (§ 4 Abs. 1 EStG) oder durch Einnahmen-Überschuss-Rechnung (§ 4 Abs. 3 EStG).", "Nein, freiwillige Trinkgelder sind steuerfrei (§ 3 Nr. 51 EStG).", "Diese sind bis zu bestimmten Grenzen steuerfrei (§ 3b EStG)."], "richtig": 0, "erklaerung": "Entweder durch Bilanzierung (§ 4 Abs. 1 EStG) oder durch Einnahmen-Überschuss-Rechnung (§ 4 Abs. 3 EStG)."}, {"id": 1403, "gesetz": "EStG", "frage": "#1403 Welche Betriebsausgaben sind für Taxi- und Mietwagenunternehmen abzugsfähig?", "antworten": ["Schuldzinsen sind nur eingeschränkt als Betriebsausgaben abziehbar (§ 4 Abs. 4a EStG).", "Alle Aufwendungen, die betrieblich veranlasst sind, z. B. Fahrzeugkosten, Treibstoff, Reparaturen, Versicherungen (§ 4 Abs. 4 EStG).", "Ja, sie müssen ihre Einkünfte als Gewerbebetrieb versteuern (§ 15 EStG)."], "richtig": 1, "erklaerung": "Alle Aufwendungen, die betrieblich veranlasst sind, z. B. Fahrzeugkosten, Treibstoff, Reparaturen, Versicherungen (§ 4 Abs. 4 EStG)."}, {"id": 1404, "gesetz": "EStG", "frage": "#1404 Welche steuerlichen Vorteile bietet die Nutzung eines Elektro-Taxis?", "antworten": ["Sonderabschreibung von 75 % im Anschaffungsjahr für Elektrofahrzeuge, die vom 01.07.2025 bis 31.12.2027 angeschafft werden (§ 7 Abs. 2a EStG), sowie Befreiung von der Kfz-Steuer (§ 3d KraftStG).", "Sonderabschreibung von 50 % im Anschaffungsjahr für Elektrofahrzeuge, die vom 01.01.2023 bis 31.12.2025 angeschafft werden (§ 7 Abs. 2a EStG), sowie Befreiung von der Gewerbesteuer (§ 3d KraftStG).", "Sofortabzug der vollen Anschaffungskosten als Betriebsausgabe für alle ab 2024 angeschafften Elektrofahrzeuge (§ 7 Abs. 2a EStG) sowie ermäßigter Umsatzsteuersatz von 7 % (§ 3d KraftStG)."], "richtig": 0, "erklaerung": "Sonderabschreibung von 75 % im Anschaffungsjahr für Elektrofahrzeuge, die vom 01.07.2025 bis 31.12.2027 angeschafft werden (§ 7 Abs. 2a EStG), sowie Befreiung von der Kfz-Steuer (§ 3d KraftStG)."}, {"id": 1405, "gesetz": "EStG", "frage": "#1405 Wie wird die private Nutzung eines Taxi-Fahrzeugs steuerlich behandelt?", "antworten": ["Die Privatnutzung bleibt steuerfrei, wenn das Fahrzeug zu mehr als 50 % betrieblich als Taxi genutzt wird (§ 6 Abs. 1 Nr. 4 EStG).", "Die Privatnutzung ist als Entnahme zu versteuern, pauschal mit 0,03 % des Listenpreises je privat gefahrenem Kilometer (§ 6 Abs. 1 Nr. 4 EStG).", "Die Privatnutzung ist als Entnahme zu versteuern, pauschal mit 1 % des Listenpreises monatlich oder nach Fahrtenbuch (§ 6 Abs. 1 Nr. 4 EStG)."], "richtig": 2, "erklaerung": "Die Privatnutzung ist als Entnahme zu versteuern, pauschal mit 1 % des Listenpreises monatlich oder nach Fahrtenbuch (§ 6 Abs. 1 Nr. 4 EStG)."}, {"id": 1406, "gesetz": "EStG", "frage": "#1406 Welche Regelungen gelten für den Abzug von Schuldzinsen im Taxigewerbe?", "antworten": ["Schuldzinsen sind im Taxigewerbe generell nur zu 50 % abziehbar, da Taxen auch privat genutzt werden können (§ 4 Abs. 4a EStG).", "Betriebliche Schuldzinsen sind nur bis 2.050 € jährlich abziehbar; darüber hinaus ist der Abzug ausgeschlossen (§ 4 Abs. 4a EStG).", "Betriebliche Schuldzinsen sind grundsätzlich voll abziehbar; nur bei Überentnahmen ist der Abzug eingeschränkt (§ 4 Abs. 4a EStG)."], "richtig": 2, "erklaerung": "Betriebliche Schuldzinsen sind grundsätzlich voll abziehbar; nur bei Überentnahmen ist der Abzug eingeschränkt (§ 4 Abs. 4a EStG)."}, {"id": 1407, "gesetz": "EStG", "frage": "#1407 Sind Trinkgelder für Taxifahrer steuerpflichtig?", "antworten": ["Nur bis 1.224 € jährlich sind Trinkgelder an angestellte Fahrer steuerfrei (§ 3 Nr. 51 EStG).", "Ja, Trinkgelder sind bei angestellten Fahrern als Arbeitslohn voll lohnsteuerpflichtig (§ 3 Nr. 51 EStG).", "Nein, freiwillige Trinkgelder an angestellte Fahrer von Fahrgästen sind steuerfrei (§ 3 Nr. 51 EStG)."], "richtig": 2, "erklaerung": "Nein, freiwillige Trinkgelder an angestellte Fahrer von Fahrgästen sind steuerfrei (§ 3 Nr. 51 EStG)."}, {"id": 1408, "gesetz": "EStG", "frage": "#1408 Welche Abschreibungsregeln gelten für Taxifahrzeuge?", "antworten": ["Sofortabschreibung im Anschaffungsjahr als geringwertiges Wirtschaftsgut, wenn der Kaufpreis netto unter 50.000 € liegt (§ 7 Abs. 1, 2 EStG).", "Linear über die Nutzungsdauer laut AfA-Tabelle (für Taxis 5 Jahre); für Anschaffungen vom 1.7.2025 bis 31.12.2027 ist auch degressive AfA möglich (§ 7 Abs. 1, 2 EStG).", "Linear über die Nutzungsdauer laut AfA-Tabelle (für Taxis 8 Jahre); eine degressive AfA ist für Fahrzeuge generell ausgeschlossen (§ 7 Abs. 1, 2 EStG)."], "richtig": 1, "erklaerung": "Linear über die Nutzungsdauer laut AfA-Tabelle (für Taxis 5 Jahre); für Anschaffungen vom 1.7.2025 bis 31.12.2027 ist auch degressive AfA möglich (§ 7 Abs. 1, 2 EStG)."}, {"id": 1409, "gesetz": "EStG", "frage": "#1409 Wie werden Leasingfahrzeuge im Taxiunternehmen steuerlich behandelt?", "antworten": ["Die Leasingraten sind Betriebsausgaben und voll abzugsfähig (§ 4 Abs. 4 EStG).", "Die meisten Taxiunternehmen unterliegen der Regelbesteuerung mit 7 % Umsatzsteuer auf Beförderungsleistungen (§ 12 UStG).", "Schuldzinsen sind nur eingeschränkt als Betriebsausgaben abziehbar (§ 4 Abs. 4a EStG)."], "richtig": 0, "erklaerung": "Die Leasingraten sind Betriebsausgaben und voll abzugsfähig (§ 4 Abs. 4 EStG)."}, {"id": 1410, "gesetz": "EStG", "frage": "#1410 Welche steuerlichen Erleichterungen gibt es für Investitionen in neue Fahrzeuge?", "antworten": ["Investitionsabzugsbetrag von bis zu 25 % der Anschaffungskosten (§ 7g EStG).", "Investitionsabzugsbetrag von bis zu 50 % der Anschaffungskosten (§ 7g EStG).", "Investitionsabzugsbetrag von bis zu 75 % der Anschaffungskosten (§ 7g EStG)."], "richtig": 1, "erklaerung": "Investitionsabzugsbetrag von bis zu 50 % der Anschaffungskosten (§ 7g EStG)."}, {"id": 1411, "gesetz": "EStG", "frage": "#1411 Sind selbstständige Taxifahrer einkommensteuerpflichtig?", "antworten": ["Nein, sie müssen ihre Einkünfte als Gewerbebetrieb versteuern (§ 15 EStG).", "Ja, sie müssen ihre Einkünfte als Gewerbebetrieb versteuern (§ 15 EStG).", "Nein, freiwillige Trinkgelder sind steuerfrei (§ 3 Nr. 51 EStG)."], "richtig": 1, "erklaerung": "Ja, sie müssen ihre Einkünfte als Gewerbebetrieb versteuern (§ 15 EStG)."}, {"id": 1412, "gesetz": "EStG", "frage": "#1412 Wie werden Lohnzahlungen an angestellte Taxifahrer steuerlich behandelt?", "antworten": ["Als Betriebsausgaben (§ 4 Abs. 4 EStG), Lohnsteuer muss abgeführt werden (§ 38 EStG).", "Ja, Löhne an mitarbeitende Angehörige sind steuerlich absetzbar, wenn sie fremdüblich sind (§ 4 Abs. 4 EStG).", "Nein, typische Berufskleidung ist steuerfrei (§ 3 Nr. 31 EStG)."], "richtig": 0, "erklaerung": "Als Betriebsausgaben (§ 4 Abs. 4 EStG), Lohnsteuer muss abgeführt werden (§ 38 EStG)."}, {"id": 1413, "gesetz": "EStG", "frage": "#1413 Welche Steuerermäßigung gibt es für Nacht-, Sonn- und Feiertagszuschläge?", "antworten": ["Diese sind bis zu bestimmten Grenzen steuerpflichtig (§ 3b EStG).", "Grundsätzlich 10 Jahre (§ 147 AO).", "Diese sind bis zu bestimmten Grenzen steuerfrei (§ 3b EStG)."], "richtig": 2, "erklaerung": "Diese sind bis zu bestimmten Grenzen steuerfrei (§ 3b EStG)."}, {"id": 1414, "gesetz": "EStG", "frage": "#1414 Wie wird die Umsatzsteuer für Taxiunternehmen berechnet?", "antworten": ["Taxifahrten bis 100 km und Mietwagenfahrten bis 50 km unterliegen 7 %, alle längeren Fahrten dem Satz von 19 % (§ 12 UStG).", "Alle Taxi- und Mietwagenfahrten unterliegen einheitlich dem ermäßigten Satz von 7 %, unabhängig von der Länge der Strecke (§ 12 UStG).", "Taxifahrten innerhalb der Gemeinde oder bis 50 km unterliegen dem ermäßigten Satz von 7 %, längere Taxifahrten und Mietwagenfahrten 19 % (§ 12 UStG)."], "richtig": 2, "erklaerung": "Taxifahrten innerhalb der Gemeinde oder bis 50 km unterliegen dem ermäßigten Satz von 7 %, längere Taxifahrten und Mietwagenfahrten 19 % (§ 12 UStG)."}, {"id": 1415, "gesetz": "EStG", "frage": "#1415 Welche Steuervergünstigungen gibt es für Kleinunternehmer im Taxi-Gewerbe?", "antworten": ["Es gilt die Kleinunternehmerregelung bei Vorjahresumsatz bis 25.000 € und Jahresumsatz bis 100.000 € (netto) mit Umsatzsteuerbefreiung (§ 19 UStG).", "Es gilt die Kleinunternehmerregelung bei Vorjahresumsatz bis 22.000 € und Jahresumsatz bis 50.000 € (netto) mit Umsatzsteuerbefreiung und Vorsteuerabzug (§ 19 UStG).", "Kleinunternehmer erhalten einen ermäßigten Umsatzsteuersatz von 5 %, solange ihr Jahresgewinn unter 25.000 € liegt (§ 19 UStG)."], "richtig": 0, "erklaerung": "Es gilt die Kleinunternehmerregelung bei Vorjahresumsatz bis 25.000 € und Jahresumsatz bis 100.000 € (netto) mit Umsatzsteuerbefreiung (§ 19 UStG)."}, {"id": 1416, "gesetz": "EStG", "frage": "#1416 Wie wirkt sich ein Steuerklassenwechsel auf die Lohnsteuer eines Taxifahrers aus?", "antworten": ["Ein Wechsel der Steuerklasse kann die monatliche Lohnsteuerbelastung senken oder erhöhen (§ 38b EStG).", "Die Leasingraten sind Betriebsausgaben und voll abzugsfähig (§ 4 Abs. 4 EStG).", "Ja, Verluste können mit Gewinnen verrechnet oder vorgetragen werden (§ 10d EStG)."], "richtig": 0, "erklaerung": "Ein Wechsel der Steuerklasse kann die monatliche Lohnsteuerbelastung senken oder erhöhen (§ 38b EStG)."}, {"id": 1417, "gesetz": "EStG", "frage": "#1417 Welche Regelungen gelten für Betriebsausgabenpauschalen im Taxigewerbe?", "antworten": ["Für gewerbliche Taxiunternehmer gibt es keine allgemeine Betriebsausgabenpauschale; abziehbar sind die tatsächlich nachgewiesenen Betriebsausgaben (§ 4 Abs. 4 EStG).", "Für Taxiunternehmer gilt eine Pauschale von 0,30 € je gefahrenem Kilometer, mit der alle Betriebsausgaben abgegolten sind (§ 4 Abs. 4 EStG).", "Taxiunternehmer können pauschal 30 % ihrer Betriebseinnahmen als Betriebsausgaben abziehen, ohne Belege vorzulegen (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Für gewerbliche Taxiunternehmer gibt es keine allgemeine Betriebsausgabenpauschale; abziehbar sind die tatsächlich nachgewiesenen Betriebsausgaben (§ 4 Abs. 4 EStG)."}, {"id": 1418, "gesetz": "EStG", "frage": "#1418 Wie werden Fahrtkosten eines selbstständigen Taxifahrers steuerlich behandelt?", "antworten": ["Trinkgelder sind steuerfrei, wenn sie freiwillig sind (§ 3 Nr. 51 EStG).", "Grundsätzlich 10 Jahre (§ 147 AO).", "Fahrtkosten für betriebliche Fahrten sind Betriebsausgaben (§ 4 Abs. 4 EStG)."], "richtig": 2, "erklaerung": "Fahrtkosten für betriebliche Fahrten sind Betriebsausgaben (§ 4 Abs. 4 EStG)."}, {"id": 1419, "gesetz": "EStG", "frage": "#1419 Gibt es steuerliche Vergünstigungen für Familienangehörige, die im Taxiunternehmen mitarbeiten?", "antworten": ["Ja, Löhne an mitarbeitende Angehörige sind steuerlich absetzbar, wenn sie fremdüblich sind (§ 4 Abs. 4 EStG).", "Entweder tatsächliche Kosten oder pauschale Kilometerpauschale (§ 9 EStG).", "Nein, Löhne an mitarbeitende Angehörige sind steuerlich absetzbar, wenn sie fremdüblich sind (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Ja, Löhne an mitarbeitende Angehörige sind steuerlich absetzbar, wenn sie fremdüblich sind (§ 4 Abs. 4 EStG)."}, {"id": 1420, "gesetz": "EStG", "frage": "#1420 Welche Steuervergünstigungen gibt es für Fahrten zwischen Wohnung und Betriebssitz?", "antworten": ["Die Kosten sind nur in Höhe der Entfernungspauschale von 0,38 € je Entfernungskilometer abziehbar (§ 4 Abs. 5 Satz 1 Nr. 6 i. V. m. § 9 Abs. 1 Satz 3 Nr. 4 EStG).", "Die Kosten sind in voller Höhe abziehbar, da der Betriebssitz keine erste Tätigkeitsstätte im steuerlichen Sinne ist (§ 4 Abs. 5 Satz 1 Nr. 6 i. V. m. § 9 Abs. 1 Satz 3 Nr. 4 EStG).", "Die Kosten sind nur mit 0,30 € je gefahrenem Kilometer für Hin- und Rückweg abziehbar (§ 4 Abs. 5 Satz 1 Nr. 6 i. V. m. § 9 Abs. 1 Satz 3 Nr. 4 EStG)."], "richtig": 0, "erklaerung": "Die Kosten sind nur in Höhe der Entfernungspauschale von 0,38 € je Entfernungskilometer abziehbar (§ 4 Abs. 5 Satz 1 Nr. 6 i. V. m. § 9 Abs. 1 Satz 3 Nr. 4 EStG)."}, {"id": 1421, "gesetz": "EStG", "frage": "#1421 Müssen Taxifahrer für ihre Arbeitskleidung Steuern zahlen?", "antworten": ["Nein, typische Berufskleidung ist steuerpflichtig (§ 3 Nr. 31 EStG).", "Ja, typische Berufskleidung ist steuerfrei (§ 3 Nr. 31 EStG).", "Nein, typische Berufskleidung ist steuerfrei (§ 3 Nr. 31 EStG)."], "richtig": 2, "erklaerung": "Nein, typische Berufskleidung ist steuerfrei (§ 3 Nr. 31 EStG)."}, {"id": 1422, "gesetz": "EStG", "frage": "#1422 Wie werden Subventionen für umweltfreundliche Taxis steuerlich behandelt?", "antworten": ["Subventionen können steuerpflichtig sein oder als Betriebseinnahme gelten (§ 3 EStG).", "Trinkgelder sind steuerfrei, wenn sie freiwillig sind (§ 3 Nr. 51 EStG).", "Subventionen können steuerfrei sein oder als Betriebseinnahme gelten (§ 3 EStG)."], "richtig": 2, "erklaerung": "Subventionen können steuerfrei sein oder als Betriebseinnahme gelten (§ 3 EStG)."}, {"id": 1423, "gesetz": "EStG", "frage": "#1423 Kann ein Taxiunternehmer seine Tankkosten steuerlich absetzen?", "antworten": ["Ja, wenn das Fahrzeug zum Betriebsvermögen gehört (§ 4 Abs. 4 EStG).", "Nein, wenn das Fahrzeug zum Betriebsvermögen gehört (§ 4 Abs. 4 EStG).", "Alle Aufwendungen, die betrieblich veranlasst sind, z. B. Fahrzeugkosten, Treibstoff, Reparaturen, Versicherungen (§ 4 Abs. 4 EStG)."], "richtig": 0, "erklaerung": "Ja, wenn das Fahrzeug zum Betriebsvermögen gehört (§ 4 Abs. 4 EStG)."}, {"id": 1424, "gesetz": "EStG", "frage": "#1424 Sind Strafzettel von der Steuer absetzbar?", "antworten": ["Nein, Bußgelder und Strafzahlungen sind keine Betriebsausgaben (§ 4 Abs. 5 EStG).", "Ja, Bußgelder und Strafzahlungen sind keine Betriebsausgaben (§ 4 Abs. 5 EStG).", "Grundsätzlich 10 Jahre (§ 147 AO)."], "richtig": 0, "erklaerung": "Nein, Bußgelder und Strafzahlungen sind keine Betriebsausgaben (§ 4 Abs. 5 EStG)."}, {"id": 1425, "gesetz": "EStG", "frage": "#1425 Welche Steuerpflicht besteht bei der Abgabe eines Taxiunternehmens?", "antworten": ["Der Gewinn aus dem Verkauf ist steuerfrei (§ 16 EStG).", "Der Gewinn aus dem Verkauf ist steuerpflichtig (§ 16 EStG).", "Die Leasingraten sind Betriebsausgaben und voll abzugsfähig (§ 4 Abs. 4 EStG)."], "richtig": 1, "erklaerung": "Der Gewinn aus dem Verkauf ist steuerpflichtig (§ 16 EStG)."}, {"id": 1426, "gesetz": "EStG", "frage": "#1426 Wie werden Trinkgelder bei selbstständigen Taxifahrern behandelt?", "antworten": ["Trinkgelder sind bei selbstständigen Taxifahrern erst oberhalb von 1.224 € im Jahr als Betriebseinnahmen zu versteuern (§ 15 EStG).", "Trinkgelder sind auch bei selbstständigen Taxifahrern steuerfrei, da § 3 Nr. 51 EStG für alle Taxifahrer gleichermaßen gilt und keine Höchstgrenze kennt (§ 15 EStG).", "Trinkgelder sind bei selbstständigen Taxifahrern Betriebseinnahmen und voll steuerpflichtig; § 3 Nr. 51 EStG gilt nur für Arbeitnehmer (§ 15 EStG)."], "richtig": 2, "erklaerung": "Trinkgelder sind bei selbstständigen Taxifahrern Betriebseinnahmen und voll steuerpflichtig; § 3 Nr. 51 EStG gilt nur für Arbeitnehmer (§ 15 EStG)."}, {"id": 1427, "gesetz": "EStG", "frage": "#1427 Kann ein Taxiunternehmen Verluste steuerlich geltend machen?", "antworten": ["Es können pauschale Betriebsausgaben für Selbstständige geltend gemacht werden (§ 15 EStG).", "Nein, Verluste können mit Gewinnen verrechnet oder vorgetragen werden (§ 10d EStG).", "Ja, Verluste können mit Gewinnen verrechnet oder vorgetragen werden (§ 10d EStG)."], "richtig": 2, "erklaerung": "Ja, Verluste können mit Gewinnen verrechnet oder vorgetragen werden (§ 10d EStG)."}, {"id": 1428, "gesetz": "EStG", "frage": "#1428 Welche steuerlichen Pflichten bestehen bei einem Wechsel von Taxifahrzeug auf Mietwagenbetrieb?", "antworten": ["Der Wechsel gilt als Betriebsaufgabe mit Versteuerung der stillen Reserven; umsatzsteuerlich bleibt es beim ermäßigten Satz von 7 % für alle Fahrten (§ 15 EStG, § 12 UStG).", "Mietwagenbetriebe gelten als freiberufliche Tätigkeit ohne Gewerbesteuer; umsatzsteuerlich gilt bis 50 km weiterhin 7 % (§ 15 EStG, § 12 UStG).", "Einkommen- und gewerbesteuerlich ändert sich nichts (weiter Gewerbebetrieb); umsatzsteuerlich gilt für Mietwagenfahrten aber stets 19 % (§ 15 EStG, § 12 UStG)."], "richtig": 2, "erklaerung": "Einkommen- und gewerbesteuerlich ändert sich nichts (weiter Gewerbebetrieb); umsatzsteuerlich gilt für Mietwagenfahrten aber stets 19 % (§ 15 EStG, § 12 UStG)."}, {"id": 1429, "gesetz": "EStG", "frage": "#1429 Wie wirkt sich die Anschaffung eines neuen Fahrzeugs auf die Steuer aus?", "antworten": ["Nein, freiwillige Trinkgelder sind steuerfrei (§ 3 Nr. 51 EStG).", "Das Fahrzeug kann abgeschrieben werden (§ 7 EStG).", "Die normale Nutzungsdauer beträgt 6 Jahre, aber Sonderabschreibungen sind möglich (§ 7 Abs. 1 EStG)."], "richtig": 1, "erklaerung": "Das Fahrzeug kann abgeschrieben werden (§ 7 EStG)."}, {"id": 1430, "gesetz": "EStG", "frage": "#1430 Wie lange müssen steuerliche Unterlagen von Taxiunternehmen aufbewahrt werden?", "antworten": ["Bücher, Inventare und Jahresabschlüsse 6 Jahre, Buchungsbelege und Rechnungen 4 Jahre ab Ausstellung (§ 257 Abs. 4 HGB, § 14b UStG).", "Sämtliche Unterlagen einheitlich 10 Jahre, Handels- und Geschäftsbriefe 30 Jahre (§ 257 Abs. 4 HGB, § 14b UStG).", "Bücher, Inventare und Jahresabschlüsse 10 Jahre, Buchungsbelege und Rechnungen 8 Jahre (§ 257 Abs. 4 HGB, § 14b UStG)."], "richtig": 2, "erklaerung": "Bücher, Inventare und Jahresabschlüsse 10 Jahre, Buchungsbelege und Rechnungen 8 Jahre (§ 257 Abs. 4 HGB, § 14b UStG)."}, {"id": 1451, "gesetz": "GewStG", "frage": "#1451 Welche Steuerpflicht gilt für Taxi- und Mietwagenunternehmen nach dem Gewerbesteuergesetz?", "antworten": ["Taxi- und Mietwagenunternehmen unterliegen als Gewerbebetriebe der Gewerbesteuer (§ 2 GewStG).", "Es erfolgt eine Erstattung nach der Steuererklärung (§ 20 GewStG).", "Taxi- und Taxenunternehmen unterliegen als Gewerbebetriebe der Gewerbesteuer (§ 2 GewStG)."], "richtig": 0, "erklaerung": "Taxi- und Mietwagenunternehmen unterliegen als Gewerbebetriebe der Gewerbesteuer (§ 2 GewStG)."}, {"id": 1452, "gesetz": "GewStG", "frage": "#1452 Wie wird der Gewerbeertrag für Taxi- und Mietwagenunternehmen ermittelt?", "antworten": ["Die gezahlte Grundsteuer für betriebliche Grundstücke kann vom Gewerbeertrag gekürzt werden (§ 9 GewStG).", "Ja, durch strategische Kürzungen und Gestaltungsmöglichkeiten (§ 9 GewStG).", "Der Gewerbeertrag ist der nach Einkommensteuer- oder Körperschaftsteuergesetz ermittelte Gewinn, bereinigt um Hinzurechnungen und Kürzungen (§ 7 GewStG)."], "richtig": 2, "erklaerung": "Der Gewerbeertrag ist der nach Einkommensteuer- oder Körperschaftsteuergesetz ermittelte Gewinn, bereinigt um Hinzurechnungen und Kürzungen (§ 7 GewStG)."}, {"id": 1453, "gesetz": "GewStG", "frage": "#1453 Gibt es einen Freibetrag für kleine Taxi- und Mietwagenunternehmen?", "antworten": ["Ja, für natürliche Personen und Personengesellschaften gilt ein Freibetrag von 5.000 € je Betriebsstätte (§ 11 Abs. 1 GewStG).", "Ja, für alle Unternehmen einschließlich der GmbH gilt ein Freibetrag von 24.500 € (§ 11 Abs. 1 GewStG).", "Ja, für natürliche Personen und Personengesellschaften gilt ein Freibetrag von 24.500 € (§ 11 Abs. 1 GewStG)."], "richtig": 2, "erklaerung": "Ja, für natürliche Personen und Personengesellschaften gilt ein Freibetrag von 24.500 € (§ 11 Abs. 1 GewStG)."}, {"id": 1454, "gesetz": "GewStG", "frage": "#1454 Welche Hinzurechnungen gelten für Taxi- und Mietwagenunternehmen?", "antworten": ["Gewinnanteile von Tochterunternehmen können unter bestimmten Voraussetzungen steuerlich begünstigt sein (§ 9 GewStG).", "Ein Teil der Miet-, Pacht- und Leasingaufwendungen sowie Zinsen auf betriebliche Schulden werden dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "Nein, aber Elektro-Taxis können über andere Steuererleichterungen wie die Kfz-Steuerbefreiung profitieren."], "richtig": 1, "erklaerung": "Ein Teil der Miet-, Pacht- und Leasingaufwendungen sowie Zinsen auf betriebliche Schulden werden dem Gewinn wieder hinzugerechnet (§ 8 GewStG)."}, {"id": 1455, "gesetz": "GewStG", "frage": "#1455 Welche Kürzungen sind für Taxi- und Mietwagenunternehmen relevant?", "antworten": ["Ein Teil der Leasingraten wird dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "Der Gewerbeertrag des fusionierten Unternehmens wird neu berechnet (§ 7 GewStG).", "Die gezahlte Grundsteuer für betriebliche Grundstücke kann vom Gewerbeertrag gekürzt werden (§ 9 GewStG)."], "richtig": 2, "erklaerung": "Die gezahlte Grundsteuer für betriebliche Grundstücke kann vom Gewerbeertrag gekürzt werden (§ 9 GewStG)."}, {"id": 1456, "gesetz": "GewStG", "frage": "#1456 Wie wird die Gewerbesteuer berechnet?", "antworten": ["Gewerbeertrag abzüglich Freibetrag × 5 % ergibt den Steuermessbetrag; dieser wird durch den Hebesatz des Landes geteilt und auf volle Euro gerundet (§§ 11, 16 GewStG).", "Gewerbeertrag abzüglich Freibetrag × 3,5 % ergibt den Steuermessbetrag; dieser wird mit dem Hebesatz der Gemeinde multipliziert (§§ 11, 16 GewStG).", "Umsatz abzüglich Freibetrag × 3,5 % ergibt unmittelbar die Steuer; ein Hebesatz der Gemeinde wird nicht angewendet (§§ 11, 16 GewStG)."], "richtig": 1, "erklaerung": "Gewerbeertrag abzüglich Freibetrag × 3,5 % ergibt den Steuermessbetrag; dieser wird mit dem Hebesatz der Gemeinde multipliziert (§§ 11, 16 GewStG)."}, {"id": 1457, "gesetz": "GewStG", "frage": "#1457 Wie hoch ist der Mindesthebesatz für die Gewerbesteuer?", "antworten": ["Der Mindesthebesatz beträgt 200 % (ab Erhebungszeitraum 2027: 280 %), kann aber von jeder Gemeinde individuell festgelegt werden (§ 16 GewStG).", "Der Mindesthebesatz beträgt 100 % (ab Erhebungszeitraum 2027: 150 %) und darf nur mit Zustimmung des zuständigen Landesfinanzministeriums erhöht werden (§ 16 GewStG).", "Der Mindesthebesatz beträgt 400 % und ist bundesweit einheitlich festgelegt; die Gemeinden dürfen davon nicht abweichen (§ 16 GewStG)."], "richtig": 0, "erklaerung": "Der Mindesthebesatz beträgt 200 % (ab Erhebungszeitraum 2027: 280 %), kann aber von jeder Gemeinde individuell festgelegt werden (§ 16 GewStG)."}, {"id": 1458, "gesetz": "GewStG", "frage": "#1458 Welche Steuererleichterungen gibt es für Taxiunternehmen?", "antworten": ["In vierteljährlichen Vorauszahlungen am 15. Februar, 15. Mai, 15. August und 15. November (§ 19 GewStG).", "Die gezahlte Grundsteuer für betriebliche Grundstücke kann vom Gewerbeertrag gekürzt werden (§ 9 GewStG).", "Es gibt keine speziellen Steuererleichterungen für Taxiunternehmen, aber sie können allgemeine gewerbesteuerliche Kürzungen nutzen (§ 9 GewStG)."], "richtig": 2, "erklaerung": "Es gibt keine speziellen Steuererleichterungen für Taxiunternehmen, aber sie können allgemeine gewerbesteuerliche Kürzungen nutzen (§ 9 GewStG)."}, {"id": 1459, "gesetz": "GewStG", "frage": "#1459 Sind nebenberufliche Taxiunternehmer gewerbesteuerpflichtig?", "antworten": ["Ja, jeder Gewerbebetrieb ist gewerbesteuerpflichtig; Steuer fällt aber erst an, wenn der Gewerbeertrag den Freibetrag von 24.500 € übersteigt (§§ 2, 11 GewStG).", "Ja, und zwar ab dem ersten Euro Gewerbeertrag; der Freibetrag gilt nur für hauptberufliche Unternehmer (§§ 2, 11 GewStG).", "Nein, nebenberufliche Taxiunternehmer sind von der Gewerbesteuer befreit, solange ihr Umsatz unter 50.000 € liegt (§§ 2, 11 GewStG)."], "richtig": 0, "erklaerung": "Ja, jeder Gewerbebetrieb ist gewerbesteuerpflichtig; Steuer fällt aber erst an, wenn der Gewerbeertrag den Freibetrag von 24.500 € übersteigt (§§ 2, 11 GewStG)."}, {"id": 1460, "gesetz": "GewStG", "frage": "#1460 Welche Auswirkungen hat die Gewerbesteuerpflicht auf Mietwagenunternehmen?", "antworten": ["Mietwagenunternehmen sind im Gegensatz zu Taxiunternehmen gewerbesteuerfrei, da für sie keine Beförderungspflicht besteht (§ 2 GewStG).", "Mietwagenunternehmen sind wie Taxiunternehmen Gewerbebetriebe und unterliegen der Gewerbesteuer; Sonderregelungen gibt es für beide nicht (§ 2 GewStG).", "Für Mietwagenunternehmen gilt eine erhöhte Steuermesszahl von 5 %, für Taxiunternehmen die reguläre von 3,5 % (§ 2 GewStG)."], "richtig": 1, "erklaerung": "Mietwagenunternehmen sind wie Taxiunternehmen Gewerbebetriebe und unterliegen der Gewerbesteuer; Sonderregelungen gibt es für beide nicht (§ 2 GewStG)."}, {"id": 1461, "gesetz": "GewStG", "frage": "#1461 Welche Bedeutung hat die Betriebsstätte für die Gewerbesteuer?", "antworten": ["Ja, jedes Unternehmen mit Gewerbesteuerpflicht muss eine Steuererklärung einreichen (§ 14a GewStG).", "Ja, wenn die Einkünfte die Freigrenze von 24.500 € überschreiten (§ 11 GewStG).", "Die Gewerbesteuer wird in der Gemeinde erhoben, in der sich die Betriebsstätte befindet (§ 4 GewStG)."], "richtig": 2, "erklaerung": "Die Gewerbesteuer wird in der Gemeinde erhoben, in der sich die Betriebsstätte befindet (§ 4 GewStG)."}, {"id": 1462, "gesetz": "GewStG", "frage": "#1462 Wann endet die Gewerbesteuerpflicht für ein Taxiunternehmen?", "antworten": ["Allein mit der Gewerbeabmeldung; wird sie versäumt, besteht die Steuerpflicht auch ohne Betrieb und Umsätze unbegrenzt fort (§ 2 GewStG, § 14 GewO).", "Mit der tatsächlichen Einstellung des Betriebs; die Gewerbeabmeldung bei der Gemeinde ist zusätzlich vorzunehmen (§ 2 GewStG, § 14 GewO).", "Erst mit Widerruf der Taxigenehmigung durch die Behörde, auch wenn der Betrieb schon früher eingestellt wurde (§ 2 GewStG, § 14 GewO)."], "richtig": 1, "erklaerung": "Mit der tatsächlichen Einstellung des Betriebs; die Gewerbeabmeldung bei der Gemeinde ist zusätzlich vorzunehmen (§ 2 GewStG, § 14 GewO)."}, {"id": 1463, "gesetz": "GewStG", "frage": "#1463 Wie werden Leasingfahrzeuge gewerbesteuerlich behandelt?", "antworten": ["Ein Teil der Miet-, Pacht- und Leasingaufwendungen sowie Zinsen auf betriebliche Schulden werden dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "Ein Teil der Leasingraten wird dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "Ja, wenn sie den Gewinn des Unternehmens erhöhen (§ 7 GewStG)."], "richtig": 1, "erklaerung": "Ein Teil der Leasingraten wird dem Gewinn wieder hinzugerechnet (§ 8 GewStG)."}, {"id": 1464, "gesetz": "GewStG", "frage": "#1464 Welche Rolle spielt die Stadt oder Gemeinde bei der Gewerbesteuer?", "antworten": ["Es können Säumniszuschläge und Vollstreckungsmaßnahmen durch die Gemeinde erfolgen (§ 14b GewStG).", "Die Gemeinde legt den Hebesatz fest und erhebt die Gewerbesteuer (§ 16 GewStG).", "Ja, wenn die Einkünfte die Freigrenze von 24.500 € überschreiten (§ 11 GewStG)."], "richtig": 1, "erklaerung": "Die Gemeinde legt den Hebesatz fest und erhebt die Gewerbesteuer (§ 16 GewStG)."}, {"id": 1465, "gesetz": "GewStG", "frage": "#1465 Wie oft muss die Gewerbesteuer gezahlt werden?", "antworten": ["In vierteljährlichen Vorauszahlungen am 15. Februar, 15. Mai, 15. August und 15. November (§ 19 GewStG).", "Der Mindesthebesatz beträgt 200 %, kann aber von jeder Gemeinde individuell festgelegt werden (§ 16 GewStG).", "Der Steuermessbetrag ist die Basis für die Berechnung der endgültigen Gewerbesteuer (§ 11 GewStG)."], "richtig": 0, "erklaerung": "In vierteljährlichen Vorauszahlungen am 15. Februar, 15. Mai, 15. August und 15. November (§ 19 GewStG)."}, {"id": 1466, "gesetz": "GewStG", "frage": "#1466 Was passiert, wenn ein Taxiunternehmen zu hohe Gewerbesteuer gezahlt hat?", "antworten": ["Ja, wenn die Einkünfte die Freigrenze von 24.500 € überschreiten (§ 11 GewStG).", "Es erfolgt eine Erstattung nach der Steuererklärung (§ 20 GewStG).", "Ja, jedes Unternehmen mit Gewerbesteuerpflicht muss eine Steuererklärung einreichen (§ 14a GewStG)."], "richtig": 1, "erklaerung": "Es erfolgt eine Erstattung nach der Steuererklärung (§ 20 GewStG)."}, {"id": 1467, "gesetz": "GewStG", "frage": "#1467 Muss ein Taxiunternehmen eine Gewerbesteuererklärung abgeben?", "antworten": ["Nein, die Gewerbesteuer wird allein anhand der Einkommensteuererklärung festgesetzt; eine eigene Erklärung entfällt immer (§ 14a GewStG, § 25 GewStDV).", "Nur Kapitalgesellschaften; Einzelunternehmer reichen stattdessen formlos eine Gewinnmitteilung in Papierform bei der Gemeinde ein (§ 14a GewStG, § 25 GewStDV).", "Ja, wenn der Gewerbeertrag 24.500 € übersteigt (bei Kapitalgesellschaften immer); die Erklärung ist elektronisch abzugeben (§ 14a GewStG, § 25 GewStDV)."], "richtig": 2, "erklaerung": "Ja, wenn der Gewerbeertrag 24.500 € übersteigt (bei Kapitalgesellschaften immer); die Erklärung ist elektronisch abzugeben (§ 14a GewStG, § 25 GewStDV)."}, {"id": 1468, "gesetz": "GewStG", "frage": "#1468 Gibt es steuerliche Vorteile für Elektro-Taxis in der Gewerbesteuer?", "antworten": ["Nein, aber Elektro-Taxis können über andere Steuererleichterungen wie die Kfz-Steuerbefreiung profitieren.", "Die Steuer wird anteilig auf die Gemeinden aufgeteilt, in denen das Unternehmen tätig ist (§ 28 GewStG).", "Ja, aber Elektro-Taxis können über andere Steuererleichterungen wie die Kfz-Steuerbefreiung profitieren."], "richtig": 0, "erklaerung": "Nein, aber Elektro-Taxis können über andere Steuererleichterungen wie die Kfz-Steuerbefreiung profitieren."}, {"id": 1469, "gesetz": "GewStG", "frage": "#1469 Was passiert mit der Gewerbesteuer, wenn ein Taxiunternehmen mehrere Standorte hat?", "antworten": ["Der Messbetrag wird auf die Gemeinden mit Betriebsstätten zerlegt, grundsätzlich nach dem Verhältnis der Arbeitslöhne (§§ 28, 29 GewStG).", "Die gesamte Gewerbesteuer fällt allein in der Gemeinde des Hauptsitzes an; Nebenstandorte bleiben unberücksichtigt (§§ 28, 29 GewStG).", "Der Messbetrag wird zu gleichen Teilen auf alle Gemeinden mit Betriebsstätten verteilt, unabhängig von deren Größe und Arbeitslöhnen (§§ 28, 29 GewStG)."], "richtig": 0, "erklaerung": "Der Messbetrag wird auf die Gemeinden mit Betriebsstätten zerlegt, grundsätzlich nach dem Verhältnis der Arbeitslöhne (§§ 28, 29 GewStG)."}, {"id": 1470, "gesetz": "GewStG", "frage": "#1470 Wie werden Gewinne aus dem Verkauf eines Taxiunternehmens besteuert?", "antworten": ["Bei Einzelunternehmern und natürlichen Personen als Mitunternehmern unterliegt der Veräußerungsgewinn nicht der Gewerbesteuer, nur der Einkommensteuer (§ 7 Satz 2 GewStG, § 16 EStG).", "Bei Einzelunternehmern ist der Veräußerungsgewinn vollständig steuerfrei, wenn der Betrieb länger als zehn Jahre bestanden hat (§ 7 Satz 2 GewStG, § 16 EStG).", "Bei Einzelunternehmern unterliegt der Veräußerungsgewinn voll der Gewerbesteuer, dafür aber nicht der Einkommensteuer (§ 7 Satz 2 GewStG, § 16 EStG)."], "richtig": 0, "erklaerung": "Bei Einzelunternehmern und natürlichen Personen als Mitunternehmern unterliegt der Veräußerungsgewinn nicht der Gewerbesteuer, nur der Einkommensteuer (§ 7 Satz 2 GewStG, § 16 EStG)."}, {"id": 1471, "gesetz": "GewStG", "frage": "#1471 Welche Bedeutung hat der Gewerbesteuermessbetrag?", "antworten": ["Es können Säumniszuschläge und Vollstreckungsmaßnahmen durch die Gemeinde erfolgen (§ 14b GewStG).", "Der Steuer In Deutschland bleibt es gewerbesteuerpflichtig, sofern es eine Betriebsstätte im Inland hat (§ 2 GewStG)."}, {"id": 1475, "gesetz": "GewStG", "frage": "#1475 Was passiert, wenn die Gewerbesteuer nicht gezahlt wird?", "antworten": ["Es wird sofort ein Bußgeld von 10 % der Steuerschuld fällig, und die Taxigenehmigung ruht automatisch (§ 240 AO).", "Es fallen Säumniszuschläge von 0,5 % je angefangenem Monat an; eine Vollstreckung durch die Gemeinde ist ausgeschlossen (§ 240 AO).", "Es fallen Säumniszuschläge von 1 % je angefangenem Monat an, und die Gemeinde kann vollstrecken (§ 240 AO)."], "richtig": 2, "erklaerung": "Es fallen Säumniszuschläge von 1 % je angefangenem Monat an, und die Gemeinde kann vollstrecken (§ 240 AO)."}, {"id": 1476, "gesetz": "GewStG", "frage": "#1476 Wie wirkt sich ein Rechtsformwechsel auf die Gewerbesteuer aus?", "antworten": ["Ja, wenn die Einkünfte die Freigrenze von 24.500 € überschreiten (§ 11 GewStG).", "Ein Teil der Leasingraten wird dem Gewinn wieder hinzugerechnet (§ 8 GewStG).", "Eine Umwandlung in eine Kapitalgesellschaft kann die Steuerpflicht beeinflussen (§ 2 GewStG)."], "richtig": 2, "erklaerung": "Eine Umwandlung in eine Kapitalgesellschaft kann die Steuerpflicht beeinflussen (§ 2 GewStG)."}, {"id": 1477, "gesetz": "GewStG", "frage": "#1477 Sind Einnahmen aus Subventionen oder Fördermitteln gewerbesteuerpflichtig?", "antworten": ["Die Steuer wird anteilig auf die Gemeinden aufgeteilt, in denen das Unternehmen tätig ist (§ 28 GewStG).", "Ja, wenn sie den Gewinn des Unternehmens erhöhen (§ 7 GewStG).", "Nein, wenn sie den Gewinn des Unternehmens erhöhen (§ 7 GewStG)."], "richtig": 1, "erklaerung": "Ja, wenn sie den Gewinn des Unternehmens erhöhen (§ 7 GewStG)."}, {"id": 1478, "gesetz": "GewStG", "frage": "#1478 Kann ein Taxiunternehmen durch Umstrukturierung Gewerbesteuer sparen?", "antworten": ["Ja, durch Umwandlung in eine GmbH entfällt die Gewerbesteuer vollständig, da Kapitalgesellschaften nicht gewerbesteuerpflichtig sind (§§ 9, 16 GewStG).", "Begrenzt; z. B. durch die Wahl der Rechtsform, eines Standorts mit niedrigem Hebesatz oder die Nutzung gesetzlicher Kürzungen (§§ 9, 16 GewStG).", "Nein, eine Umstrukturierung hat keinerlei Einfluss auf die Gewerbesteuer, da die Hebesätze bundesweit einheitlich sind (§§ 9, 16 GewStG)."], "richtig": 1, "erklaerung": "Begrenzt; z. B. durch die Wahl der Rechtsform, eines Standorts mit niedrigem Hebesatz oder die Nutzung gesetzlicher Kürzungen (§§ 9, 16 GewStG)."}, {"id": 1479, "gesetz": "GewStG", "frage": "#1479 Wie wird die Gewerbesteuer bei Unternehmensfusionen berechnet?", "antworten": ["Ja, wenn die Einkünfte die Freigrenze von 24.500 € überschreiten (§ 11 GewStG).", "Nein, aber Elektro-Taxis können über andere Steuererleichterungen wie die Kfz-Steuerbefreiung profitieren.", "Der Gewerbeertrag des fusionierten Unternehmens wird neu berechnet (§ 7 GewStG)."], "richtig": 2, "erklaerung": "Der Gewerbeertrag des fusionierten Unternehmens wird neu berechnet (§ 7 GewStG)."}, {"id": 1480, "gesetz": "GewStG", "frage": "#1480 Welche steuerlichen Vorteile bietet eine Holding-Struktur für ein Taxiunternehmen?", "antworten": ["Die Gewerbesteuer wird in der Gemeinde erhoben, in der sich die Betriebsstätte befindet (§ 4 GewStG).", "Gewinnanteile von Tochterunternehmen können unter bestimmten Voraussetzungen steuerlich begünstigt sein (§ 9 GewStG).", "Ja, für natürliche Personen und Personengesellschaften gilt ein Freibetrag von 24.500 € (§ 11 GewStG)."], "richtig": 1, "erklaerung": "Gewinnanteile von Tochterunternehmen können unter bestimmten Voraussetzungen steuerlich begünstigt sein (§ 9 GewStG)."}];

// Schwierigkeit zuweisen (je 1/3)
const sq = [...ALL_QUESTIONS].sort((a,b)=>a.id-b.id);
const t3 = Math.ceil(sq.length/3);
sq.forEach((q,i)=>{ q.schwierigkeit = i<t3?'leicht':i<t3*2?'mittel':'schwer'; });

let currentUser = null;
let stats = {richtig:[],falsch:[],gesehen:[]};
let quizQueue = [], quizIdx = 0, quizResults = [];
let selectedDiff = 'alle';

// ════ LOGIN ════
function checkCode(){
  const val = document.getElementById('code-input').value.trim().toUpperCase();
  if(CODES.includes(val)){
    currentUser = val;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.add('visible');
    showHome();
  } else {
    document.getElementById('login-error').textContent = '❌ Ungültiger Code. Bitte prüfen.';
    document.getElementById('code-input').value='';
  }
}
document.getElementById('code-input').addEventListener('keydown',e=>{ if(e.key==='Enter') checkCode(); });

function logout(){
  currentUser=null;
  stats={richtig:[],falsch:[],gesehen:[]};
  document.getElementById('code-input').value='';
  document.getElementById('login-error').textContent='';
  document.getElementById('app-screen').classList.remove('visible');
  document.getElementById('login-screen').classList.remove('hidden');
}

// ════ HOME ════
const DIFFS={
  leicht:{label:'Leicht',emoji:'🟢',farbe:'#3DD68C'},
  mittel:{label:'Mittel',emoji:'🟡',farbe:'#F5C842'},
  schwer:{label:'Schwer',emoji:'🔴',farbe:'#FF5A5A'},
  alle:  {label:'Alle Mix',emoji:'🎲',farbe:'#C9A84C'},
};

function showHome(){
  window.scrollTo(0,0);
  const total=ALL_QUESTIONS.length;
  const beherrscht=stats.richtig.length;
  const falsch=stats.falsch.length;
  const neu=total-stats.gesehen.length;
  const pct=Math.round(beherrscht/total*100);
  const counts={
    leicht:ALL_QUESTIONS.filter(q=>q.schwierigkeit==='leicht').length,
    mittel:ALL_QUESTIONS.filter(q=>q.schwierigkeit==='mittel').length,
    schwer:ALL_QUESTIONS.filter(q=>q.schwierigkeit==='schwer').length,
    alle:total
  };

  document.getElementById('main-content').innerHTML=`
  <div class="anim">
  <div class="stats-row">
    <div class="stat-box"><span class="stat-val" style="color:#C9A84C">${total}</span><span class="stat-lbl">§§</span></div>
    <div class="stat-box"><span class="stat-val" style="color:#3DD68C">${beherrscht}</span><span class="stat-lbl">✓</span></div>
    <div class="stat-box"><span class="stat-val" style="color:#FF5A5A">${falsch}</span><span class="stat-lbl">↺</span></div>
    <div class="stat-box"><span class="stat-val" style="color:#60A5FA">${neu}</span><span class="stat-lbl">○</span></div>
  </div>

  <div class="card">
    <div class="card-label">SCHWIERIGKEITSSTUFE WÄHLEN:</div>
    <div class="diff-grid">
      ${Object.entries(DIFFS).map(([k,v])=>`
        <button class="diff-btn" onclick="selectDiff('${k}')"
          style="border-color:${selectedDiff===k?v.farbe:'rgba(255,255,255,0.08)'};
                 background:${selectedDiff===k?v.farbe+'22':'var(--dark3)'}">
          <span style="font-size:20px">${v.emoji}</span>
          <span class="dlabel">${v.label}</span>
          <small>${counts[k]} Fragen</small>
        </button>`).join('')}
    </div>
  </div>

  <div class="card">
    <div class="card-label">NÄCHSTE RUNDE ENTHÄLT:</div>
    <div class="round-row"><span style="color:#FF5A5A">↺</span><span><b style="color:#FF5A5A">${falsch}</b> Wiederholungen (falsch beantwortet)</span></div>
    <div class="round-row"><span style="color:#60A5FA">★</span><span><b style="color:#60A5FA">${Math.min(neu,20)}</b> neue Fragen</span></div>
    <div class="round-row"><span style="color:#C9A84C">%</span><span>Fortschritt: <b style="color:#C9A84C">${pct}%</b> aller Fragen beherrscht</span></div>
  </div>

  <button class="primary-btn" onclick="startQuiz()">▶ Weiter lernen (${DIFFS[selectedDiff].label})</button>
  <button class="secondary-btn" onclick="showDetail()">📊 Lernstand nach Gesetz</button>
  <button class="danger-btn" onclick="resetProgress()">Fortschritt zurücksetzen</button>
  </div>`;
}

function selectDiff(d){ selectedDiff=d; showHome(); }

function resetProgress(){
  if(confirm('Fortschritt wirklich zurücksetzen?')){
    stats={richtig:[],falsch:[],gesehen:[]};
    showHome();
  }
}

// ════ QUIZ ════
function startQuiz(){
  let pool=selectedDiff==='alle'?ALL_QUESTIONS:ALL_QUESTIONS.filter(q=>q.schwierigkeit===selectedDiff);
  const shuffle=arr=>[...arr].sort(()=>Math.random()-0.5);
  const falschQ=pool.filter(q=>stats.falsch.includes(q.id));
  const neuQ=pool.filter(q=>!stats.gesehen.includes(q.id)&&!stats.falsch.includes(q.id));
  const restQ=pool.filter(q=>stats.gesehen.includes(q.id)&&!stats.falsch.includes(q.id));
  quizQueue=shuffle([...falschQ,...shuffle(neuQ).slice(0,20),...shuffle(restQ)]).slice(0,20);
  if(!quizQueue.length){alert('Alle Fragen beantwortet! Sehr gut!');return;}
  quizIdx=0; quizResults=[];
  showQuestion();
}

function showQuestion(){
  window.scrollTo(0,0);
  const q=quizQueue[quizIdx];
  const pct=Math.round(quizIdx/quizQueue.length*100);
  const letters=['A','B','C'];
  document.getElementById('main-content').innerHTML=`
  <div class="anim">
  <div class="prog-wrap">
    <div class="prog-top"><span>Frage ${quizIdx+1} von ${quizQueue.length}</span><span>${pct}%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:${pct}%"></div></div>
  </div>
  <div class="q-tag">${q.gesetz}</div>
  <div class="q-text">${q.frage}</div>
  <div class="answers" id="answers">
    ${q.antworten.map((a,i)=>`
      <button class="ans-btn" id="ans${i}" onclick="selectAnswer(${i})">
        <span class="letter">${letters[i]}</span><span>${a.replace(/^#\d{4}\s*/,'')}</span>
      </button>`).join('')}
  </div>
  <div class="feedback" id="feedback"></div>
  <button class="primary-btn" id="next-btn" style="display:none" onclick="nextQuestion()">
    ${quizIdx+1>=quizQueue.length?'Ergebnis anzeigen →':'Nächste Frage →'}
  </button>
  <button class="secondary-btn" style="margin-top:4px" onclick="showHome()">← Abbrechen</button>
  </div>`;
}

function selectAnswer(idx){
  const q=quizQueue[quizIdx];
  document.querySelectorAll('.ans-btn').forEach(b=>b.classList.add('locked'));
  const isOk=idx===q.richtig;
  quizResults.push({id:q.id,correct:isOk});
  document.getElementById('ans'+idx).classList.add(isOk?'correct':'wrong');
  if(!isOk) document.getElementById('ans'+q.richtig).classList.add('correct');
  document.querySelectorAll('.ans-btn').forEach((b,i)=>{
    if(i!==idx&&i!==q.richtig) b.style.opacity='0.3';
  });
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(isOk?'ok':'err');
  fb.innerHTML=`<b>${isOk?'✓ Richtig!':'✗ Leider falsch.'}</b>${q.erklaerung}`;
  document.getElementById('next-btn').style.display='block';
}

function nextQuestion(){
  const last=quizResults[quizResults.length-1];
  if(last){
    if(!stats.gesehen.includes(last.id)) stats.gesehen.push(last.id);
    if(last.correct){
      stats.richtig=[...new Set([...stats.richtig,last.id])];
      stats.falsch=stats.falsch.filter(id=>id!==last.id);
    }else{
      stats.falsch=[...new Set([...stats.falsch,last.id])];
      stats.richtig=stats.richtig.filter(id=>id!==last.id);
    }
  }
  quizIdx++;
  if(quizIdx>=quizQueue.length) showResult();
  else showQuestion();
}

// ════ RESULT ════
function showResult(){
  window.scrollTo(0,0);
  const correct=quizResults.filter(r=>r.correct).length;
  const pct=Math.round(correct/quizResults.length*100);
  const icon=pct>=70?'🏆':pct>=50?'📚':'💪';
  const title=pct>=70?'Sehr gut!':pct>=50?'Weiter üben!':'Nicht aufgeben!';
  document.getElementById('main-content').innerHTML=`
  <div class="result-screen anim">
    <div style="font-size:64px;margin-bottom:16px">${icon}</div>
    <div style="font-size:28px;font-weight:700;color:var(--gold);margin-bottom:8px">${title}</div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:20px">Dein Ergebnis</div>
    <div class="score-big">${pct}%</div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:32px">${correct} von ${quizResults.length} Fragen richtig</div>
    <button class="primary-btn" onclick="showHome()">Zurück zum Menü</button>
  </div>`;
}

// ════ DETAIL ════
function showDetail(){
  window.scrollTo(0,0);
  const gesetze=[...new Set(ALL_QUESTIONS.map(q=>q.gesetz))].sort();
  document.getElementById('main-content').innerHTML=`
  <div class="anim">
  <button class="secondary-btn" onclick="showHome()">← Zurück</button>
  <div style="font-size:18px;font-weight:700;margin-bottom:16px">📊 Lernstand nach Gesetz</div>
  ${gesetze.map(g=>{
    const qs=ALL_QUESTIONS.filter(q=>q.gesetz===g);
    const r=qs.filter(q=>stats.richtig.includes(q.id)).length;
    const pct=Math.round(r/qs.length*100);
    return `<div class="detail-item">
      <div style="font-weight:600;font-size:14px">${g}</div>
      <div class="detail-bar"><div class="detail-fill" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--muted)">${r} / ${qs.length} · ${pct}%</div>
    </div>`;
  }).join('')}
  </div>`;
}
</script>
</body>
</html>
