erklaerung": "Ja, alle 3 Jahre, ab 50 Jahren jährlich, auf Kosten des Arbeitgebers (§ 6 Abs. 3 ArbZG)."}, {"id": 472, "gesetz": "ArbZG", "frage": "#0472 Kann ein Nachtarbeiter auf einen Tagesarbeitsplatz wechseln?", "antworten": ["Nein, wenn gesundheitliche Gründe, Kinderbetreuung oder Pflege eines Angehörigen vorliegen (§ 6 Abs. 4 ArbZG).", "Ja, wenn gesundheitliche Gründe, Kinderbetreuung oder Pflege eines Angehörigen vorliegen (§ 6 Abs. 4 ArbZG).", "Notdienste, Krankenhäuser, Verkehrsbetriebe, Gastronomie, Rundfunk, Freizeitbetriebe u. a. (§ 10 Abs. 1 ArbZG)."], "richtig": 1, "erklaerung": "Ja, wenn gesundheitliche Gründe, Kinderbetreuung oder Pflege eines Angehörigen vorliegen (§ 6 Abs. 4 ArbZG)."}, {"id": 473, "gesetz": "ArbZG", "frage": "#0473 Müssen Arbeitgeber die Arbeitszeiten dokumentieren?", "antworten": ["Ja, die über 8 Stunden werktäglich hinausgehende Arbeitszeit ist aufzuzeichnen und 2 Jahre aufzubewahren (§ 16 Abs. 2 ArbZG); im Taxi- und Mietwagengewerbe die gesamte Arbeitszeit (§ 17 MiLoG).", "Ja, aber nur die Nachtarbeit ist aufzuzeichnen und 1 Jahr aufzubewahren (§ 16 Abs. 2 ArbZG); im Taxigewerbe genügen die Daten des Fahrpreisanzeigers (§ 17 MiLoG).", "Nein, eine Aufzeichnungspflicht besteht nur für Betriebe mit mehr als 10 Arbeitnehmern, Aufbewahrung 6 Monate (§ 16 Abs. 2 ArbZG); das MiLoG enthält keine Aufzeichnungspflicht."], "richtig": 0, "erklaerung": "Ja, die über 8 Stunden werktäglich hinausgehende Arbeitszeit ist aufzuzeichnen und 2 Jahre aufzubewahren (§ 16 Abs. 2 ArbZG); im Taxi- und Mietwagengewerbe die gesamte Arbeitszeit (§ 17 MiLoG)."}, {"id": 474, "gesetz": "ArbZG", "frage": "#0474 Welche Verantwortung trägt der Taxiunternehmer für die Arbeitszeiten?", "antworten": ["Er muss sicherstellen, dass die gesetzlichen Arbeitszeit-, Pausen- und Ruhezeitregelungen eingehalten werden (§§ 3–5, 16, 22 ArbZG).", "Er muss nur die Höchstarbeitszeit überwachen; Pausen und Ruhezeiten sind Sache des Fahrers und nicht zu kontrollieren (§§ 3–5, 16, 22 ArbZG).", "Keine; die Einhaltung der Arbeitszeiten liegt allein bei den Fahrern, die selbst über Beginn und Ende entscheiden (§§ 3–5, 16, 22 ArbZG)."], "richtig": 0, "erklaerung": "Er muss sicherstellen, dass die gesetzlichen Arbeitszeit-, Pausen- und Ruhezeitregelungen eingehalten werden (§§ 3–5, 16, 22 ArbZG)."}, {"id": 475, "gesetz": "ArbZG", "frage": "#0475 Welche Behörde ist für die Überwachung des Arbeitszeitgesetzes zuständig?", "antworten": ["Ja, wenn gesundheitliche Gründe, Kinderbetreuung oder Pflege eines Angehörigen vorliegen (§ 6 Abs. 4 ArbZG).", "Die zuständige Aufsichtsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG).", "Die zuständige Genehmigungsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG)."], "richtig": 1, "erklaerung": "Die zuständige Aufsichtsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG)."}, {"id": 476, "gesetz": "ArbZG", "frage": "#0476 Welche Arbeitszeitverstöße gelten als Ordnungswidrigkeit?", "antworten": ["Die zuständige Aufsichtsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG).", "Nein, sie dürfen an Sonn- und Feiertagen arbeiten (§ 10 Abs. 1 ArbZG).", "Überschreiten der Arbeitszeitgrenzen, keine Einhaltung von Ruhepausen oder Sonn- und Feiertagsruhe (§ 22 ArbZG)."], "richtig": 2, "erklaerung": "Überschreiten der Arbeitszeitgrenzen, keine Einhaltung von Ruhepausen oder Sonn- und Feiertagsruhe (§ 22 ArbZG)."}, {"id": 477, "gesetz": "ArbZG", "frage": "#0477 Welche Strafen drohen bei Verstößen gegen das ArbZG?", "antworten": ["Schutz der Sicherheit und Gesundheit der Arbeitnehmer sowie die Regelung von Arbeits- und Ruhezeiten (§ 1 ArbZG).", "Mindestens 15 Sonntage (§ 11 Abs. 1 ArbZG).", "Geldbußen bis zu 30.000 € (§ 22 ArbZG)."], "richtig": 2, "erklaerung": "Geldbußen bis zu 30.000 € (§ 22 ArbZG)."}, {"id": 478, "gesetz": "ArbZG", "frage": "#0478 Wie werden Verstöße gegen das ArbZG bestraft?", "antworten": ["30 Minuten Pause bei mehr als 6 Stunden Arbeit, 45 Minuten Pause bei mehr als 9 Stunden Arbeit (§ 4 ArbZG).", "Nein, Arbeitnehmer dürfen von 0 bis 24 Uhr nicht beschäftigt werden (§ 9 Abs. 1 ArbZG).", "Mit Geldbußen oder in schweren Fällen mit Freiheitsstrafe bis zu einem Jahr (§ 23 ArbZG)."], "richtig": 2, "erklaerung": "Mit Geldbußen oder in schweren Fällen mit Freiheitsstrafe bis zu einem Jahr (§ 23 ArbZG)."}, {"id": 479, "gesetz": "ArbZG", "frage": "#0479 Wann macht sich ein Arbeitgeber strafbar?", "antworten": ["Wenn er Verstöße vorsätzlich begeht und dadurch Gesundheit oder Arbeitskraft eines Arbeitnehmers gefährdet oder sie beharrlich wiederholt (§ 23 ArbZG).", "Nur wenn ein Arbeitnehmer infolge des Verstoßes tödlich verunglückt; sonst sind Verstöße stets Ordnungswidrigkeiten (§ 23 ArbZG).", "Bereits bei jedem fahrlässigen Verstoß gegen die Höchstarbeitszeit, unabhängig von einer Gefährdung der Arbeitnehmer (§ 23 ArbZG)."], "richtig": 0, "erklaerung": "Wenn er Verstöße vorsätzlich begeht und dadurch Gesundheit oder Arbeitskraft eines Arbeitnehmers gefährdet oder sie beharrlich wiederholt (§ 23 ArbZG)."}, {"id": 480, "gesetz": "ArbZG", "frage": "#0480 Welche besonderen Regeln gelten für gefährliche Arbeiten?", "antworten": ["Die Bundesregierung kann zusätzliche Einschränkungen für gefährliche Tätigkeiten festlegen (§ 8 ArbZG).", "Geldbußen bis zu 30.000 € (§ 22 ArbZG).", "Die zuständige Aufsichtsbehörde der Länder (z. B. Gewerbeaufsichtsamt oder Amt für Arbeitsschutz) (§ 17 ArbZG)."], "richtig": 0, "erklaerung": "Die Bundesregierung kann zusätzliche Einschränkungen für gefährliche Tätigkeiten festlegen (§ 8 ArbZG)."}, {"id": 501, "gesetz": "AGG", "frage": "#0501 Darf ein Taxiunternehmer Bewerber wegen ihres Alters ablehnen?", "antworten": ["Ja, ohne Einschränkung; das AGG gilt nicht für Bewerbungsverfahren, sondern nur für bestehende Arbeitsverhältnisse, und das Alter ist kein geschütztes Merkmal (§§ 1, 7, 10 AGG).", "Grundsätzlich nein; zulässig nur, wenn die Ungleichbehandlung objektiv, angemessen und durch ein legitimes Ziel gerechtfertigt ist, z. B. gesetzliches Mindestalter (§§ 1, 7, 10 AGG).", "Ja, wenn die Bewerber älter als 60 Jahre sind, da sie nach dem AGG für den Taxidienst grundsätzlich als ungeeignet gelten (§§ 1, 7, 10 AGG)."], "richtig": 1, "erklaerung": "Grundsätzlich nein; zulässig nur, wenn die Ungleichbehandlung objektiv, angemessen und durch ein legitimes Ziel gerechtfertigt ist, z. B. gesetzliches Mindestalter (§§ 1, 7, 10 AGG)."}, {"id": 502, "gesetz": "AGG", "frage": "#0502 Muss ein Taxiunternehmen barrierefreie Fahrzeuge bereitstellen?", "antworten": ["Ja, das AGG verpflichtet jedes Taxiunternehmen, je fünf Genehmigungen mindestens ein barrierefreies Fahrzeug vorzuhalten (§ 19 AGG); sonst wird die Genehmigung widerrufen.", "Das AGG verlangt keine barrierefreien Fahrzeuge, verbietet aber, Fahrgäste wegen einer Behinderung zu benachteiligen (§ 19 AGG); Pflichten können sich aus PBefG oder kommunalen Vorgaben ergeben.", "Nein, und das AGG erlaubt es sogar, Rollstuhlfahrer generell abzulehnen, da Taxifahrten keine Massengeschäfte sind (§ 19 AGG); weitere Pflichten bestehen nicht."], "richtig": 1, "erklaerung": "Das AGG verlangt keine barrierefreien Fahrzeuge, verbietet aber, Fahrgäste wegen einer Behinderung zu benachteiligen (§ 19 AGG); Pflichten können sich aus PBefG oder kommunalen Vorgaben ergeben."}, {"id": 503, "gesetz": "AGG", "frage": "#0503 Darf ein Taxiunternehmen bestimmte Fahrer bevorzugt einstellen?", "antworten": ["Nur, wenn eine wesentliche berufliche Anforderung besteht, die objektiv gerechtfertigt ist (§ 8 AGG).", "Vorbeugende Maßnahmen und Schutzmaßnahmen für Beschäftigte (§ 12 AGG).", "Wenn eine Person wegen eines AGG-Merkmals schlechter behandelt wird als eine andere in vergleichbarer Situation (§ 3 Abs. 1 AGG)."], "richtig": 0, "erklaerung": "Nur, wenn eine wesentliche berufliche Anforderung besteht, die objektiv gerechtfertigt ist (§ 8 AGG)."}, {"id": 504, "gesetz": "AGG", "frage": "#0504 Darf ein Fahrgast aufgrund seiner Herkunft abgelehnt werden?", "antworten": ["Nein, das wäre eine unzulässige Diskriminierung nach § 19 AGG.", "Nein, das wäre eine ununzulässige Diskriminierung nach § 19 AGG.", "Ja, das wäre eine unzulässige Diskriminierung nach § 19 AGG."], "richtig": 0, "erklaerung": "Nein, das wäre eine unzulässige Diskriminierung nach § 19 AGG."}, {"id": 505, "gesetz": "AGG", "frage": "#0505 Welche AGG-Vorschriften gelten für Mietwagenunternehmen?", "antworten": ["Benachteiligungen aus Gründen der Rasse, ethnischen Herkunft, Geschlecht, Religion, Behinderung, Alter oder sexuellen Identität zu verhindern (§ 1 AGG).", "Durch Beschwerde beim Arbeitgeber oder einer zuständigen Stelle (§ 13 AGG).", "Die gleichen wie für Taxiunternehmen, insbesondere das Benachteiligungsverbot bei Anstellung und Dienstleistungen (§ 2, § 19 AGG)."], "richtig": 2, "erklaerung": "Die gleichen wie für Taxiunternehmen, insbesondere das Benachteiligungsverbot bei Anstellung und Dienstleistungen (§ 2, § 19 AGG)."}, {"id": 506, "gesetz": "AGG", "frage": "#0506 Was ist das Ziel des Allgemeinen Gleichbehandlungsgesetzes (AGG)?", "antworten": ["Benachteiligungen aus Gründen der Rasse oder wegen der ethnischen Herkunft, des Geschlechts, der Religion oder Weltanschauung, einer Behinderung, des Alters oder der sexuellen Identität zu verhindern oder zu beseitigen (§ 1 AGG).", "Benachteiligungen aus Gründen des Einkommens, der Staatsangehörigkeit, der politischen Meinung, des Familienstands oder der Parteizugehörigkeit zu verhindern oder zu beseitigen (§ 1 AGG).", "Gleichen Lohn für alle Arbeitnehmer eines Betriebs sicherzustellen und die Bevorzugung von Frauen und Menschen mit Behinderung bei Einstellungen zwingend vorzuschreiben (§ 1 AGG)."], "richtig": 0, "erklaerung": "Benachteiligungen aus Gründen der Rasse oder wegen der ethnischen Herkunft, des Geschlechts, der Religion oder Weltanschauung, einer Behinderung, des Alters oder der sexuellen Identität zu verhindern oder zu beseitigen (§ 1 AGG)."}, {"id": 507, "gesetz": "AGG", "frage": "#0507 In welchen Bereichen gilt das AGG?", "antworten": ["Nur, wenn das Geschlecht eine wesentliche berufliche Anforderung darstellt (§ 8 AGG).", "Im Arbeitsrecht, beim Zugang zu Gütern und Dienstleistungen, bei Sozialleistungen, Bildung und Wohnraum (§ 2 AGG).", "Nur, wenn eine wesentliche berufliche Anforderung besteht, die objektiv gerechtfertigt ist (§ 8 AGG)."], "richtig": 1, "erklaerung": "Im Arbeitsrecht, beim Zugang zu Gütern und Dienstleistungen, bei Sozialleistungen, Bildung und Wohnraum (§ 2 AGG)."}, {"id": 508, "gesetz": "AGG", "frage": "#0508 Welche Benachteiligungen sind laut AGG verboten?", "antworten": ["Arbeitnehmer, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG).", "Unmittelbare, mittelbare Benachteiligung, Belästigung, sexuelle Belästigung und Anweisung zur Benachteiligung (§ 3 AGG).", "Wenn eine Person wegen eines AGG-Merkmals schlechter behandelt wird als eine andere in vergleichbarer Situation (§ 3 Abs. 1 AGG)."], "richtig": 1, "erklaerung": "Unmittelbare, mittelbare Benachteiligung, Belästigung, sexuelle Belästigung und Anweisung zur Benachteiligung (§ 3 AGG)."}, {"id": 509, "gesetz": "AGG", "frage": "#0509 Wann liegt eine unmittelbare Benachteiligung vor?", "antworten": ["Wenn eine Person wegen eines AGG-Merkmals schlechter behandelt wird als eine andere in vergleichbarer Situation (§ 3 Abs. 1 AGG).", "Alle vier Jahre (§ 27 Abs. 4 AGG).", "Information über Rechte, Vermittlung zwischen den Parteien (§ 27 Abs. 2 AGG)."], "richtig": 0, "erklaerung": "Wenn eine Person wegen eines AGG-Merkmals schlechter behandelt wird als eine andere in vergleichbarer Situation (§ 3 Abs. 1 AGG)."}, {"id": 510, "gesetz": "AGG", "frage": "#0510 Wann liegt eine mittelbare Benachteiligung vor?", "antworten": ["Wenn scheinbar neutrale Vorschriften oder Praktiken bestimmte Gruppen benachteiligen, ohne gerechtfertigt zu sein (§ 3 Abs. 2 AGG).", "Arbeitnehmer, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG).", "Er darf keine diskriminierenden Anforderungen stellen (§ 11 AGG)."], "richtig": 0, "erklaerung": "Wenn scheinbar neutrale Vorschriften oder Praktiken bestimmte Gruppen benachteiligen, ohne gerechtfertigt zu sein (§ 3 Abs. 2 AGG)."}, {"id": 511, "gesetz": "AGG", "frage": "#0511 Wer ist nach dem AGG vor Benachteiligung geschützt?", "antworten": ["Arbeitnehmer, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG).", "Arbeitgeber, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG).", "Wenn sie sachlich gerechtfertigt ist, z. B. durch Sicherheitsvorschriften oder Schutzbedürfnisse (§ 20 AGG)."], "richtig": 0, "erklaerung": "Arbeitnehmer, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG)."}, {"id": 512, "gesetz": "AGG", "frage": "#0512 Wann ist eine unterschiedliche Behandlung im Arbeitsverhältnis zulässig?", "antworten": ["Wenn sie durch wesentliche berufliche Anforderungen gerechtfertigt ist (§ 8 AGG).", "Wenn sie sachlich gerechtfertigt ist, z. B. durch Sicherheitsvorschriften oder Schutzbedürfnisse (§ 20 AGG).", "Beratung, Aufklärung und Vermittlung bei Diskriminierungsfällen (§ 25 AGG)."], "richtig": 0, "erklaerung": "Wenn sie durch wesentliche berufliche Anforderungen gerechtfertigt ist (§ 8 AGG)."}, {"id": 513, "gesetz": "AGG", "frage": "#0513 Darf ein Unternehmen gezielt Frauen oder Männer für eine Stelle suchen?", "antworten": ["Alle vier Jahre (§ 27 Abs. 4 AGG).", "Nur, wenn das Geschlecht eine wesentliche berufliche Anforderung darstellt (§ 8 AGG).", "Ja, insbesondere bei Massengeschäften oder bei Wohnungsvermietungen (§ 19 AGG)."], "richtig": 1, "erklaerung": "Nur, wenn das Geschlecht eine wesentliche berufliche Anforderung darstellt (§ 8 AGG)."}, {"id": 514, "gesetz": "AGG", "frage": "#0514 Was gilt für Religionsgemeinschaften bei der Personalauswahl?", "antworten": ["Nur, wenn eine wesentliche berufliche Anforderung besteht, die objektiv gerechtfertigt ist (§ 8 AGG).", "Sie dürfen Mitarbeiter nach ihrer Religion auswählen, wenn es für die Tätigkeit erforderlich ist (§ 9 AGG).", "Alle vier Jahre (§ 27 Abs. 4 AGG)."], "richtig": 1, "erklaerung": "Sie dürfen Mitarbeiter nach ihrer Religion auswählen, wenn es für die Tätigkeit erforderlich ist (§ 9 AGG)."}, {"id": 515, "gesetz": "AGG", "frage": "#0515 Wann ist eine Ungleichbehandlung aufgrund des Alters erlaubt?", "antworten": ["Arbeitnehmer, Auszubildende, arbeitnehmerähnliche Personen und Bewerber (§ 6 AGG).", "Nur, wenn das Geschlecht eine wesentliche berufliche Anforderung darstellt (§ 8 AGG).", "Wenn sie objektiv gerechtfertigt ist, z. B. durch Renteneintrittsalter oder Jugendschutz (§ 10 AGG)."], "richtig": 2, "erklaerung": "Wenn sie objektiv gerechtfertigt ist, z. B. durch Renteneintrittsalter oder Jugendschutz (§ 10 AGG)."}, {"id": 516, "gesetz": "AGG", "frage": "#0516 Welche Maßnahmen muss ein Arbeitgeber gegen Diskriminierung ergreifen?", "antworten": ["Vorbeugende Maßnahmen und Schutzmaßnahmen für Beschäftigte (§ 12 AGG).", "Wenn sie durch wesentliche berufliche Anforderungen gerechtfertigt ist (§ 8 AGG).", "Innerhalb von zwei Monaten nach Kenntnis der Benachteiligung (§ 15 Abs. 4 AGG)."], "richtig": 0, "erklaerung": "Vorbeugende Maßnahmen und Schutzmaßnahmen für Beschäftigte (§ 12 AGG)."}, {"id": 517, "gesetz": "AGG", "frage": "#0517 Was muss ein Arbeitgeber bei Stellenanzeigen beachten?", "antworten": ["Er darf keine diskriminierenden Anforderungen stellen (§ 11 AGG).", "Wenn scheinbar neutrale Vorschriften oder Praktiken bestimmte Gruppen benachteiligen, ohne gerechtfertigt zu sein (§ 3 Abs. 2 AGG).", "Wenn sie durch wesentliche berufliche Anforderungen gerechtfertigt ist (§ 8 AGG)."], "richtig": 0, "erklaerung": "Er darf keine diskriminierenden Anforderungen stellen (§ 11 AGG)."}, {"id": 518, "gesetz": "AGG", "frage": "#0518 Wie kann sich ein Arbeitnehmer gegen Diskriminierung wehren?", "antworten": ["Durch Beschwerde beim Arbeitgeber oder einer zuständigen Stelle (§ 13 AGG).", "Durch Beschwerde beim Arbeitnehmer oder einer zuständigen Stelle (§ 13 AGG).", "Schadensersatz- oder Entschädigungszahlungen (§ 15 AGG)."], "richtig": 0, "erklaerung": "Durch Beschwerde beim Arbeitgeber oder einer zuständigen Stelle (§ 13 AGG)."}, {"id": 519, "gesetz": "AGG", "frage": "#0519 Welche Sanktionen drohen Unternehmen bei Verstößen gegen das AGG?", "antworten": ["Nein, eine Ablehnung aufgrund des Alters verstößt gegen das AGG (§ 1, § 10 AGG).", "Schadensersatz- oder Entschädigungszahlungen (§ 15 AGG).", "Sie dürfen Mitarbeiter nach ihrer Religion auswählen, wenn es für die Tätigkeit erforderlich ist (§ 9 AGG)."], "richtig": 1, "erklaerung": "Schadensersatz- oder Entschädigungszahlungen (§ 15 AGG)."}, {"id": 520, "gesetz": "AGG", "frage": "#0520 Was passiert, wenn ein Arbeitnehmer sich gegen Diskriminierung wehrt?", "antworten": ["Ja, insbesondere bei Massengeschäften oder bei Wohnungsvermietungen (§ 19 AGG).", "Er darf nicht benachteiligt oder gekündigt werden (§ 16 AGG).", "Er darf keine diskriminierenden Anforderungen stellen (§ 11 AGG)."], "richtig": 1, "erklaerung": "Er darf nicht benachteiligt oder gekündigt werden (§ 16 AGG)."}, {"id": 521, "gesetz": "AGG", "frage": "#0521 Gilt das AGG auch für private Dienstleistungen und Verträge?", "antworten": ["Ja, insbesondere bei Massengeschäften oder bei Wohnungsvermietungen (§ 19 AGG).", "Im Arbeitsrecht, beim Zugang zu Gütern und Dienstleistungen, bei Sozialleistungen, Bildung und Wohnraum (§ 2 AGG).", "Nein, insbesondere bei Massengeschäften oder bei Wohnungsvermietungen (§ 19 AGG)."], "richtig": 0, "erklaerung": "Ja, insbesondere bei Massengeschäften oder bei Wohnungsvermietungen (§ 19 AGG)."}, {"id": 522, "gesetz": "AGG", "frage": "#0522 Darf ein Unternehmen einen Vertrag wegen der Religion eines Kunden verweigern?", "antworten": ["Nein, das wäre eine verbotene Diskriminierung (§ 19 AGG).", "Ja, das wäre eine verbotene Diskriminierung (§ 19 AGG).", "Er darf keine diskriminierenden Anforderungen stellen (§ 11 AGG)."], "richtig": 0, "erklaerung": "Nein, das wäre eine verbotene Diskriminierung (§ 19 AGG)."}, {"id": 523, "gesetz": "AGG", "frage": "#0523 Wann ist eine Ungleichbehandlung im Zivilrecht erlaubt?", "antworten": ["Wenn für eine Ungleichbehandlung wegen Rasse oder ethnischer Herkunft ein sachlicher Grund vorliegt, z. B. Wünsche anderer Kunden; wegen Alter, Behinderung oder Geschlecht dagegen nie (§ 20 AGG).", "Immer, da das AGG im Zivilrecht nur für Unternehmen mit mehr als 50 Beschäftigten gilt; kleinere Taxiunternehmen dürfen Fahrgäste daher aus jedem Grund ablehnen (§ 20 AGG).", "Wenn für die Ungleichbehandlung wegen Religion, Behinderung, Alter, sexueller Identität oder Geschlecht ein sachlicher Grund vorliegt, z. B. Gefahrenvermeidung; nie wegen Rasse oder ethnischer Herkunft (§ 20 AGG)."], "richtig": 2, "erklaerung": "Wenn für die Ungleichbehandlung wegen Religion, Behinderung, Alter, sexueller Identität oder Geschlecht ein sachlicher Grund vorliegt, z. B. Gefahrenvermeidung; nie wegen Rasse oder ethnischer Herkunft (§ 20 AGG)."}, {"id": 524, "gesetz": "AGG", "frage": "#0524 Welche Beweislast gilt im AGG-Fall?", "antworten": ["Innerhalb von zwei Monaten nach Kenntnis der Benachteiligung (§ 15 Abs. 4 AGG).", "Der Benachteiligte muss Indizien vorlegen, dann muss die Gegenseite das Gegenteil beweisen (§ 22 AGG).", "Nein, sie kann nur Empfehlungen aussprechen und beraten (§ 27 AGG)."], "richtig": 1, "erklaerung": "Der Benachteiligte muss Indizien vorlegen, dann muss die Gegenseite das Gegenteil beweisen (§ 22 AGG)."}, {"id": 525, "gesetz": "AGG", "frage": "#0525 Wie lange kann man Ansprüche wegen Diskriminierung geltend machen?", "antworten": ["Schriftlich innerhalb von zwei Monaten; bei Bewerbungen ab Zugang der Ablehnung, sonst ab Kenntnis der Benachteiligung (§ 15 Abs. 4 AGG).", "Mündlich oder schriftlich innerhalb von sechs Monaten; bei Bewerbungen ab Absendung der Bewerbungsunterlagen (§ 15 Abs. 4 AGG).", "Schriftlich innerhalb von drei Jahren ab Ende des Kalenderjahres, wie bei der regelmäßigen Verjährung (§ 15 Abs. 4 AGG)."], "richtig": 0, "erklaerung": "Schriftlich innerhalb von zwei Monaten; bei Bewerbungen ab Zugang der Ablehnung, sonst ab Kenntnis der Benachteiligung (§ 15 Abs. 4 AGG)."}, {"id": 526, "gesetz": "AGG", "frage": "#0526 Welche Aufgaben hat die Antidiskriminierungsstelle des Bundes?", "antworten": ["Gerichtliche Vertretung Betroffener vor den Arbeitsgerichten (§ 27 AGG).", "Beratung, Aufklärung und Vermittlung bei Diskriminierungsfällen (§ 27 AGG).", "Verhängung von Bußgeldern gegen diskriminierende Arbeitgeber (§ 27 AGG)."], "richtig": 1, "erklaerung": "Beratung, Aufklärung und Vermittlung bei Diskriminierungsfällen (§ 27 AGG)."}, {"id": 527, "gesetz": "AGG", "frage": "#0527 Kann die Antidiskriminierungsstelle Unternehmen bestrafen?", "antworten": ["Nein, sie kann nur Empfehlungen aussprechen und beraten (§ 27 AGG).", "Durch Beschwerde beim Arbeitgeber oder einer zuständigen Stelle (§ 13 AGG).", "Ja, sie kann nur Empfehlungen aussprechen und beraten (§ 27 AGG)."], "richtig": 0, "erklaerung": "Nein, sie kann nur Empfehlungen aussprechen und beraten (§ 27 AGG)."}, {"id": 528, "gesetz": "AGG", "frage": "#0528 Welche Unterstützung können Betroffene bei der Antidiskriminierungsstelle erhalten?", "antworten": ["Wenn sie sachlich gerechtfertigt ist, z. B. durch Sicherheitsvorschriften oder Schutzbedürfnisse (§ 20 AGG).", "Beratung, Aufklärung und Vermittlung bei Diskriminierungsfällen (§ 25 AGG).", "Information über Rechte, Vermittlung zwischen den Parteien (§ 27 Abs. 2 AGG)."], "richtig": 2, "erklaerung": "Information über Rechte, Vermittlung zwischen den Parteien (§ 27 Abs. 2 AGG)."}, {"id": 529, "gesetz": "AGG", "frage": "#0529 Welche Organisationen dürfen Betroffene in AGG-Verfahren unterstützen?", "antworten": ["Die Antidiskriminierungsstelle des Bundes als Prozessbevollmächtigte (§ 23 AGG); bei Verstößen kann die IHK im Namen der Betroffenen Schadensersatz einklagen (§ 17 Abs. 2 AGG).", "Antidiskriminierungsverbände als Beistände (§ 23 AGG); bei groben Verstößen des Arbeitgebers können Betriebsrat oder eine im Betrieb vertretene Gewerkschaft gerichtlich vorgehen (§ 17 Abs. 2 AGG).", "Nur Rechtsanwälte; Antidiskriminierungsverbände sind ausgeschlossen, und Betriebsrat oder Gewerkschaft dürfen bei Verstößen des Arbeitgebers nie gerichtlich vorgehen (§§ 17, 23 AGG)."], "richtig": 1, "erklaerung": "Antidiskriminierungsverbände als Beistände (§ 23 AGG); bei groben Verstößen des Arbeitgebers können Betriebsrat oder eine im Betrieb vertretene Gewerkschaft gerichtlich vorgehen (§ 17 Abs. 2 AGG)."}, {"id": 530, "gesetz": "AGG", "frage": "#0530 Wie oft erstellt die Antidiskriminierungsstelle Berichte zum Stand der Gleichbehandlung?", "antworten": ["Alle vier Jahre (§ 27 Abs. 4 AGG).", "Wenn sie durch wesentliche berufliche Anforderungen gerechtfertigt ist (§ 8 AGG).", "Durch Beschwerde beim Arbeitgeber oder einer zuständigen Stelle (§ 13 AGG)."], "richtig": 0, "erklaerung": "Alle vier Jahre (§ 27 Abs. 4 AGG)."}, {"id": 551, "gesetz": "ArbSchG", "frage": "#0551 Welche Arbeitsschutzmaßnahmen müssen Taxiunternehmen treffen?", "antworten": ["Arbeitgeber müssen Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Unternehmer ergreifen (§ 3 ArbSchG).", "Arbeitgeber müssen Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Fahrer ergreifen (§ 3 ArbSchG).", "Arbeitnehmer müssen Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Fahrer ergreifen (§ 3 ArbSchG)."], "richtig": 1, "erklaerung": "Arbeitgeber müssen Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Fahrer ergreifen (§ 3 ArbSchG)."}, {"id": 552, "gesetz": "ArbSchG", "frage": "#0552 Sind Taxifahrer verpflichtet, Sicherheitsunterweisungen zu absolvieren?", "antworten": ["Ja, der Arbeitgeber muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG).", "Nein, der Arbeitgeber muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG).", "Ja, der Arbeitnehmer muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG)."], "richtig": 0, "erklaerung": "Ja, der Arbeitgeber muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG)."}, {"id": 553, "gesetz": "ArbSchG", "frage": "#0553 Welche Rolle spielt der Arbeitsschutz für selbstständige Mietwagenfahrer?", "antworten": ["Ja, Arbeitgeber müssen für ausreichende Erste-Hilfe-Maßnahmen sorgen (§ 10 ArbSchG).", "Besondere Schutzmaßnahmen gelten für Schwangere, Jugendliche und Menschen mit Behinderungen (§ 4 ArbSchG).", "Das ArbSchG gilt nur für Beschäftigte, nicht für Selbstständige, doch sie sollten sich an die Grundsätze des Arbeitsschutzes halten (§ 1 ArbSchG)."], "richtig": 2, "erklaerung": "Das ArbSchG gilt nur für Beschäftigte, nicht für Selbstständige, doch sie sollten sich an die Grundsätze des Arbeitsschutzes halten (§ 1 ArbSchG)."}, {"id": 554, "gesetz": "ArbSchG", "frage": "#0554 Muss ein Taxiunternehmen eine Gefährdungsbeurteilung durchführen?", "antworten": ["Ja, jeder Arbeitnehmer ist verpflichtet, die Arbeitsbedingungen zu beurteilen und Maßnahmen zu ergreifen (§ 5 ArbSchG).", "Nein, jeder Arbeitgeber ist verpflichtet, die Arbeitsbedingungen zu beurteilen und Maßnahmen zu ergreifen (§ 5 ArbSchG).", "Ja, jeder Arbeitgeber ist verpflichtet, die Arbeitsbedingungen zu beurteilen und Maßnahmen zu ergreifen (§ 5 ArbSchG)."], "richtig": 2, "erklaerung": "Ja, jeder Arbeitgeber ist verpflichtet, die Arbeitsbedingungen zu beurteilen und Maßnahmen zu ergreifen (§ 5 ArbSchG)."}, {"id": 555, "gesetz": "ArbSchG", "frage": "#0555 Sind Taxis mit Erste-Hilfe-Ausrüstung auszustatten?", "antworten": ["Nein, ein Verbandkasten ist nur in Kraftomnibussen vorgeschrieben (§ 35h StVZO); Erste-Hilfe-Pflichten bestehen nur in festen Betriebsstätten (§ 10 ArbSchG).", "Ja, jedes Taxi muss zusätzlich einen Defibrillator mitführen (§ 35h StVZO); der Fahrer muss jährlich einen Erste-Hilfe-Kurs nachweisen (§ 10 ArbSchG).", "Ja, jedes Taxi muss einen Verbandkasten mitführen (§ 35h StVZO); zudem muss der Arbeitgeber für Erste Hilfe sorgen (§ 10 ArbSchG)."], "richtig": 2, "erklaerung": "Ja, jedes Taxi muss einen Verbandkasten mitführen (§ 35h StVZO); zudem muss der Arbeitgeber für Erste Hilfe sorgen (§ 10 ArbSchG)."}, {"id": 556, "gesetz": "ArbSchG", "frage": "#0556 Was ist das Ziel des Arbeitsschutzgesetzes (ArbSchG)?", "antworten": ["Die Verbesserung der Sicherheit und des Gesundheitsschutzes der Beschäftigten bei der Arbeit (§ 1 ArbSchG).", "Durch EU-Richtlinien, die in nationales Recht umgesetzt werden (§ 19 ArbSchG).", "Sie müssen Sicherheitsvorschriften einhalten und Arbeitsmittel bestimmungsgemäß verwenden (§ 15 ArbSchG)."], "richtig": 0, "erklaerung": "Die Verbesserung der Sicherheit und des Gesundheitsschutzes der Beschäftigten bei der Arbeit (§ 1 ArbSchG)."}, {"id": 557, "gesetz": "ArbSchG", "frage": "#0557 Für wen gilt das ArbSchG?", "antworten": ["Für alle Beschäftigten einschließlich Hausangestellter in privaten Haushalten (§ 2 Abs. 2 ArbSchG); ausgenommen sind nur Auszubildende und Minijobber (§ 1 Abs. 2 ArbSchG).", "Nur für Betriebe mit mehr als 10 Beschäftigten (§ 2 Abs. 2 ArbSchG); Fahrpersonal im Straßenverkehr ist ausgenommen, da hier die StVO gilt (§ 1 Abs. 2 ArbSchG).", "Für alle Beschäftigten (§ 2 Abs. 2 ArbSchG); ausgenommen sind Hausangestellte in privaten Haushalten sowie – soweit Sondervorschriften bestehen – Seeschiffe und Bergbau (§ 1 Abs. 2 ArbSchG)."], "richtig": 2, "erklaerung": "Für alle Beschäftigten (§ 2 Abs. 2 ArbSchG); ausgenommen sind Hausangestellte in privaten Haushalten sowie – soweit Sondervorschriften bestehen – Seeschiffe und Bergbau (§ 1 Abs. 2 ArbSchG)."}, {"id": 558, "gesetz": "ArbSchG", "frage": "#0558 Welche Verpflichtungen haben Arbeitgeber im Arbeitsschutz?", "antworten": ["Durch EU-Richtlinien, die in nationales Recht umgesetzt werden (§ 19 ArbSchG).", "Physische, chemische, biologische Einwirkungen sowie psychische Belastungen (§ 5 ArbSchG).", "Sie müssen alle erforderlichen Maßnahmen zum Schutz der Gesundheit und Sicherheit der Beschäftigten treffen (§ 3 ArbSchG)."], "richtig": 2, "erklaerung": "Sie müssen alle erforderlichen Maßnahmen zum Schutz der Gesundheit und Sicherheit der Beschäftigten treffen (§ 3 ArbSchG)."}, {"id": 559, "gesetz": "ArbSchG", "frage": "#0559 Welche Grundsätze sind bei Arbeitsschutzmaßnahmen zu beachten?", "antworten": ["Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG).", "Gefahren müssen vermieden oder minimiert, Arbeitsbedingungen sicher gestaltet und der Stand der Technik berücksichtigt werden (§ 4 ArbSchG).", "Ja, der Arbeitgeber muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG)."], "richtig": 1, "erklaerung": "Gefahren müssen vermieden oder minimiert, Arbeitsbedingungen sicher gestaltet und der Stand der Technik berücksichtigt werden (§ 4 ArbSchG)."}, {"id": 560, "gesetz": "ArbSchG", "frage": "#0560 Was sind arbeitsbedingte Gefährdungen laut ArbSchG?", "antworten": ["U. a. Gestaltung des Arbeitsplatzes, physikalische, chemische und biologische Einwirkungen, Arbeitsmittel, Arbeitsabläufe und -zeit sowie psychische Belastungen (§ 5 Abs. 3 ArbSchG).", "Ausschließlich körperliche Gefahren durch Maschinen und Gefahrstoffe; psychische Belastungen und die Arbeitszeitgestaltung sind ausdrücklich nicht erfasst (§ 5 Abs. 3 ArbSchG).", "Nur Gefahren, die bereits zu einem meldepflichtigen Arbeitsunfall geführt haben, sowie vom Betriebsarzt festgestellte Berufskrankheiten (§ 5 Abs. 3 ArbSchG)."], "richtig": 0, "erklaerung": "U. a. Gestaltung des Arbeitsplatzes, physikalische, chemische und biologische Einwirkungen, Arbeitsmittel, Arbeitsabläufe und -zeit sowie psychische Belastungen (§ 5 Abs. 3 ArbSchG)."}, {"id": 561, "gesetz": "ArbSchG", "frage": "#0561 Was ist eine Gefährdungsbeurteilung?", "antworten": ["Arbeitgeber müssen Maßnahmen zur Sicherheit und zum Gesundheitsschutz der Fahrer ergreifen (§ 3 ArbSchG).", "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG).", "Die systematische Analyse der Arbeitsbedingungen, um Risiken für Beschäftigte zu erkennen und Maßnahmen abzuleiten (§ 5 ArbSchG)."], "richtig": 2, "erklaerung": "Die systematische Analyse der Arbeitsbedingungen, um Risiken für Beschäftigte zu erkennen und Maßnahmen abzuleiten (§ 5 ArbSchG)."}, {"id": 562, "gesetz": "ArbSchG", "frage": "#0562 Welche Dokumentationspflichten hat der Arbeitgeber im Arbeitsschutz?", "antworten": ["Für alle Beschäftigten, außer Hausangestellte in privaten Haushalten und bestimmte Gruppen im öffentlichen Dienst (§ 2 ArbSchG).", "Er muss die Ergebnisse der Gefährdungsbeurteilung und ergriffene Maßnahmen dokumentieren (§ 6 ArbSchG).", "Ja, jeder Arbeitgeber ist verpflichtet, die Arbeitsbedingungen zu beurteilen und Maßnahmen zu ergreifen (§ 5 ArbSchG)."], "richtig": 1, "erklaerung": "Er muss die Ergebnisse der Gefährdungsbeurteilung und ergriffene Maßnahmen dokumentieren (§ 6 ArbSchG)."}, {"id": 563, "gesetz": "ArbSchG", "frage": "#0563 Welche Maßnahmen muss ein Arbeitgeber bei besonderen Gefahren treffen?", "antworten": ["Nur geschulte Beschäftigte dürfen in besonders gefährlichen Bereichen arbeiten (§ 9 ArbSchG).", "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG).", "Ja, der Arbeitgeber muss regelmäßige Unterweisungen zu Sicherheit und Gesundheitsschutz durchführen (§ 12 ArbSchG)."], "richtig": 0, "erklaerung": "Nur geschulte Beschäftigte dürfen in besonders gefährlichen Bereichen arbeiten (§ 9 ArbSchG)."}, {"id": 564, "gesetz": "ArbSchG", "frage": "#0564 Wann ist eine arbeitsmedizinische Vorsorge notwendig?", "antworten": ["Jährlich für alle Beschäftigten verpflichtend, unabhängig von der Gefährdungsbeurteilung; die Befunde muss der Arzt dem Arbeitgeber vollständig mitteilen (§ 11 ArbSchG).", "Auf Wunsch der Beschäftigten muss der Arbeitgeber regelmäßige Untersuchungen ermöglichen, außer laut Gefährdungsbeurteilung ist kein Gesundheitsschaden zu erwarten (§ 11 ArbSchG); Pflichtvorsorge regelt die ArbMedVV.", "Nur wenn der Beschäftigte älter als 50 Jahre ist; die Kosten der Untersuchung muss er selbst tragen (§ 11 ArbSchG); eine Pflichtvorsorge gibt es im Taxigewerbe grundsätzlich nicht."], "richtig": 1, "erklaerung": "Auf Wunsch der Beschäftigten muss der Arbeitgeber regelmäßige Untersuchungen ermöglichen, außer laut Gefährdungsbeurteilung ist kein Gesundheitsschaden zu erwarten (§ 11 ArbSchG); Pflichtvorsorge regelt die ArbMedVV."}, {"id": 565, "gesetz": "ArbSchG", "frage": "#0565 Welche Aufgaben hat der Arbeitgeber in Notfallsituationen?", "antworten": ["Nur geschulte Beschäftigte dürfen in besonders gefährlichen Bereichen arbeiten (§ 9 ArbSchG).", "Die systematische Analyse der Arbeitsbedingungen, um Risiken für Beschäftigte zu erkennen und Maßnahmen abzuleiten (§ 5 ArbSchG).", "Er muss Maßnahmen zur Ersten Hilfe, Brandbekämpfung und Evakuierung sicherstellen (§ 10 ArbSchG)."], "richtig": 2, "erklaerung": "Er muss Maßnahmen zur Ersten Hilfe, Brandbekämpfung und Evakuierung sicherstellen (§ 10 ArbSchG)."}, {"id": 566, "gesetz": "ArbSchG", "frage": "#0566 Welche Pflichten haben Arbeitnehmer im Arbeitsschutz?", "antworten": ["Die zuständigen Arbeitsschutzbehörden der Länder (§ 21 ArbSchG).", "Sie müssen Sicherheitsvorschriften einhalten und Arbeitsmittel bestimmungsgemäß verwenden (§ 15 ArbSchG).", "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG)."], "richtig": 1, "erklaerung": "Sie müssen Sicherheitsvorschriften einhalten und Arbeitsmittel bestimmungsgemäß verwenden (§ 15 ArbSchG)."}, {"id": 567, "gesetz": "ArbSchG", "frage": "#0567 Wann dürfen Arbeitnehmer eine Arbeit verweigern?", "antworten": ["Jederzeit bei Unzufriedenheit mit den Arbeitsbedingungen, ohne dass eine Gefahr vorliegen muss, bei voller Lohnfortzahlung (§ 9 Abs. 3 ArbSchG).", "Nur mit vorheriger schriftlicher Zustimmung des Arbeitgebers; wer ohne sie den Arbeitsplatz verlässt, kann fristlos gekündigt werden (§ 9 Abs. 3 ArbSchG).", "Bei unmittelbarer erheblicher Gefahr dürfen sie sich durch sofortiges Verlassen des Arbeitsplatzes in Sicherheit bringen, ohne Nachteile zu erleiden (§ 9 Abs. 3 ArbSchG)."], "richtig": 2, "erklaerung": "Bei unmittelbarer erheblicher Gefahr dürfen sie sich durch sofortiges Verlassen des Arbeitsplatzes in Sicherheit bringen, ohne Nachteile zu erleiden (§ 9 Abs. 3 ArbSchG)."}, {"id": 568, "gesetz": "ArbSchG", "frage": "#0568 Müssen Beschäftigte Sicherheitsmängel melden?", "antworten": ["Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG).", "Nein, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG).", "Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitnehmer oder Vorgesetzten mitzuteilen (§ 16 ArbSchG)."], "richtig": 0, "erklaerung": "Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG)."}, {"id": 569, "gesetz": "ArbSchG", "frage": "#0569 Welche Rechte haben Arbeitnehmer bei Arbeitsschutzverstößen?", "antworten": ["Durch EU-Richtlinien, die in nationales Recht umgesetzt werden (§ 19 ArbSchG).", "Sie können sich bei Verdacht auf unzureichende Schutzmaßnahmen an die zuständige Behörde wenden (§ 17 ArbSchG).", "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG)."], "richtig": 1, "erklaerung": "Sie können sich bei Verdacht auf unzureichende Schutzmaßnahmen an die zuständige Behörde wenden (§ 17 ArbSchG)."}, {"id": 570, "gesetz": "ArbSchG", "frage": "#0570 Wie oft müssen Beschäftigte unterwiesen werden?", "antworten": ["Monatlich für alle Beschäftigten, unabhängig von Änderungen im Aufgabenbereich oder neuen Arbeitsmitteln (§ 12 ArbSchG); nach DGUV Vorschrift 1 zusätzlich vor jedem Schichtbeginn.", "Nur einmalig bei der Einstellung; spätere Unterweisungen, auch bei neuen Arbeitsmitteln, sind freiwillig (§ 12 ArbSchG); nach DGUV Vorschrift 1 genügt eine Wiederholung alle fünf Jahre.", "Bei Einstellung, bei Veränderungen im Aufgabenbereich oder neuen Arbeitsmitteln vor Tätigkeitsbeginn und erforderlichenfalls regelmäßig (§ 12 ArbSchG); nach DGUV Vorschrift 1 mindestens einmal jährlich."], "richtig": 2, "erklaerung": "Bei Einstellung, bei Veränderungen im Aufgabenbereich oder neuen Arbeitsmitteln vor Tätigkeitsbeginn und erforderlichenfalls regelmäßig (§ 12 ArbSchG); nach DGUV Vorschrift 1 mindestens einmal jährlich."}, {"id": 571, "gesetz": "ArbSchG", "frage": "#0571 Welche Behörden überwachen die Einhaltung des Arbeitsschutzgesetzes?", "antworten": ["Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG).", "Sie müssen alle erforderlichen Maßnahmen zum Schutz der Gesundheit und Sicherheit der Beschäftigten treffen (§ 3 ArbSchG).", "Die zuständigen Arbeitsschutzbehörden der Länder (§ 21 ArbSchG)."], "richtig": 2, "erklaerung": "Die zuständigen Arbeitsschutzbehörden der Länder (§ 21 ArbSchG)."}, {"id": 572, "gesetz": "ArbSchG", "frage": "#0572 Welche Konsequenzen drohen bei Verstößen gegen das ArbSchG?", "antworten": ["Geldbußen bis zu 30.000 € und in schweren Fällen Freiheitsstrafen bis zu einem Jahr (§ 25, § 26 ArbSchG).", "Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG).", "Wenn durch die Tätigkeit gesundheitliche Risiken entstehen können (§ 11 ArbSchG)."], "richtig": 0, "erklaerung": "Geldbußen bis zu 30.000 € und in schweren Fällen Freiheitsstrafen bis zu einem Jahr (§ 25, § 26 ArbSchG)."}, {"id": 573, "gesetz": "ArbSchG", "frage": "#0573 Welche Maßnahmen kann die Arbeitsschutzbehörde anordnen?", "antworten": ["Sie müssen Sicherheitsvorschriften einhalten und Arbeitsmittel bestimmungsgemäß verwenden (§ 15 ArbSchG).", "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG).", "Wenn durch die Tätigkeit gesundheitliche Risiken entstehen können (§ 11 ArbSchG)."], "richtig": 1, "erklaerung": "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG)."}, {"id": 574, "gesetz": "ArbSchG", "frage": "#0574 Wie oft muss ein Betrieb im Rahmen des Arbeitsschutzes kontrolliert werden?", "antworten": ["Jeder Betrieb ist jährlich durch die Gewerbeaufsicht zu kontrollieren; Kleinbetriebe mit weniger als 10 Beschäftigten sind von Besichtigungen ausgenommen (§ 21 Abs. 1 ArbSchG).", "Eine feste Frist je Betrieb gibt es nicht; seit 2026 müssen die Länder jährlich mindestens 5 % der Betriebe besichtigen, ausgewählt nach Gefährdungspotenzial (§ 21 Abs. 1 ArbSchG).", "Jeder Betrieb muss alle zwei Jahre von der Berufsgenossenschaft kontrolliert werden; die Länder müssen jährlich mindestens 20 % der Betriebe besichtigen (§ 21 Abs. 1 ArbSchG)."], "richtig": 1, "erklaerung": "Eine feste Frist je Betrieb gibt es nicht; seit 2026 müssen die Länder jährlich mindestens 5 % der Betriebe besichtigen, ausgewählt nach Gefährdungspotenzial (§ 21 Abs. 1 ArbSchG)."}, {"id": 575, "gesetz": "ArbSchG", "frage": "#0575 Wann können Beschäftigte eine Beschwerde bei der Arbeitsschutzbehörde einreichen?", "antworten": ["Wenn sie der Meinung sind, dass der Arbeitgeber nicht ausreichende Maßnahmen zum Schutz ihrer Gesundheit trifft (§ 17 ArbSchG).", "Wenn sie der Meinung sind, dass der Arbeitnehmer nicht ausreichende Maßnahmen zum Schutz ihrer Gesundheit trifft (§ 17 ArbSchG).", "Sie kann Schutzmaßnahmen vorschreiben oder Tätigkeiten untersagen (§ 22 ArbSchG)."], "richtig": 0, "erklaerung": "Wenn sie der Meinung sind, dass der Arbeitgeber nicht ausreichende Maßnahmen zum Schutz ihrer Gesundheit trifft (§ 17 ArbSchG)."}, {"id": 576, "gesetz": "ArbSchG", "frage": "#0576 Welche besonderen Schutzmaßnahmen gelten für Nachtarbeit?", "antworten": ["Für Nachtarbeit gelten keine besonderen Regeln, solange ein Nachtzuschlag von mindestens 50 % gezahlt wird (§ 6 ArbZG); Risiken sind nur auf Verlangen des Betriebsrats zu beurteilen (§ 5 ArbSchG).", "Nachtarbeit ist arbeitswissenschaftlich zu gestalten, höchstens 8 (10) Stunden, mit Anspruch auf arbeitsmedizinische Untersuchung und ggf. Tagesarbeitsplatz (§ 6 ArbZG); Risiken sind in der Gefährdungsbeurteilung zu erfassen (§ 5 ArbSchG).", "Nachtarbeit ist ohne Verlängerungsmöglichkeit auf 6 Stunden begrenzt; ein Anspruch auf arbeitsmedizinische Untersuchung besteht erst ab dem 55. Lebensjahr (§ 6 ArbZG); eine Gefährdungsbeurteilung ist entbehrlich (§ 5 ArbSchG)."], "richtig": 1, "erklaerung": "Nachtarbeit ist arbeitswissenschaftlich zu gestalten, höchstens 8 (10) Stunden, mit Anspruch auf arbeitsmedizinische Untersuchung und ggf. Tagesarbeitsplatz (§ 6 ArbZG); Risiken sind in der Gefährdungsbeurteilung zu erfassen (§ 5 ArbSchG)."}, {"id": 577, "gesetz": "ArbSchG", "frage": "#0577 Welche Regelungen gelten für Beschäftigte mit besonderen Risiken?", "antworten": ["Schutzbedürftige Gruppen sind ausschließlich nach den allgemeinen Regeln des ArbSchG zu behandeln (§ 4 Nr. 6 ArbSchG); MuSchG, JArbSchG und SGB IX gelten im Taxigewerbe nicht.", "Spezielle Gefahren für besonders schutzbedürftige Gruppen sind zu berücksichtigen (§ 4 Nr. 6 ArbSchG); konkrete Regeln für Schwangere, Jugendliche und Schwerbehinderte enthalten MuSchG, JArbSchG und SGB IX.", "Beschäftigte mit besonderen Risiken dürfen nicht eingesetzt werden (§ 4 Nr. 6 ArbSchG); Schwangere, Jugendliche und Schwerbehinderte sind daher vom Fahrdienst ausnahmslos ausgeschlossen."], "richtig": 1, "erklaerung": "Spezielle Gefahren für besonders schutzbedürftige Gruppen sind zu berücksichtigen (§ 4 Nr. 6 ArbSchG); konkrete Regeln für Schwangere, Jugendliche und Schwerbehinderte enthalten MuSchG, JArbSchG und SGB IX."}, {"id": 578, "gesetz": "ArbSchG", "frage": "#0578 Wann darf von den Regelungen des ArbSchG abgewichen werden?", "antworten": ["Wenn durch Verordnungen spezielle Regelungen für bestimmte Berufe oder Tätigkeiten getroffen werden (§ 18 ArbSchG).", "Wenn durch die Tätigkeit gesundheitliche Risiken entstehen können (§ 11 ArbSchG).", "Ja, Arbeitgeber müssen für ausreichende Erste-Hilfe-Maßnahmen sorgen (§ 10 ArbSchG)."], "richtig": 0, "erklaerung": "Wenn durch Verordnungen spezielle Regelungen für bestimmte Berufe oder Tätigkeiten getroffen werden (§ 18 ArbSchG)."}, {"id": 579, "gesetz": "ArbSchG", "frage": "#0579 Wie werden arbeitsschutzrechtliche Maßnahmen europaweit geregelt?", "antworten": ["Wenn eine unmittelbare erhebliche Gefahr für die eigene Sicherheit besteht (§ 17 ArbSchG).", "Durch EU-Richtlinien, die in nationales Recht umgesetzt werden (§ 19 ArbSchG).", "Ja, sie sind verpflichtet, erkannte Gefahren dem Arbeitgeber oder Vorgesetzten mitzuteilen (§ 16 ArbSchG)."], "richtig": 1, "erklaerung": "Durch EU-Richtlinien, die in nationales Recht umgesetzt werden (§ 19 ArbSchG)."}, {"id": 580, "gesetz": "ArbSchG", "frage": "#0580 Was ist die Gemeinsame Deutsche Arbeitsschutzstrategie?", "antworten": ["Eine Zusammenarbeit zwischen Bund, Ländern und Unfallversicherungsträgern zur Verbesserung des Arbeitsschutzes (§ 20a ArbSchG).", "Nur geschulte Beschäftigte dürfen in besonders gefährlichen Bereichen arbeiten (§ 9 ArbSchG).", "Geldbußen bis zu 30.000 € und in schweren Fällen Freiheitsstrafen bis zu einem Jahr (§ 25, § 26 ArbSchG)."], "richtig": 0, "erklaerung": "Eine Zusammenarbeit zwischen Bund, Ländern und Unfallversicherungsträgern zur Verbesserung des Arbeitsschutzes (§ 20a ArbSchG)."}, {"id": 601, "gesetz": "ASiG", "frage": "#0601 Muss ein Taxiunternehmen eine Fachkraft für Arbeitssicherheit bestellen?", "antworten": ["Ja, und zwar zwingend als festangestellte Vollzeitkraft, auch wenn der Unternehmer keinen einzigen Arbeitnehmer beschäftigt (§ 5 ASiG).", "Ja, soweit erforderlich nach Betriebsart, Beschäftigtenzahl und Gefährdungen; konkretisiert durch DGUV Vorschrift 2, Betreuung ab dem ersten Arbeitnehmer (§ 5 ASiG).", "Nein, erst ab 20 Arbeitnehmern; Kleinbetriebe sind nach DGUV Vorschrift 2 vollständig von der sicherheitstechnischen Betreuung befreit (§ 5 ASiG)."], "richtig": 1, "erklaerung": "Ja, soweit erforderlich nach Betriebsart, Beschäftigtenzahl und Gefährdungen; konkretisiert durch DGUV Vorschrift 2, Betreuung ab dem ersten Arbeitnehmer (§ 5 ASiG)."}, {"id": 602, "gesetz": "ASiG", "frage": "#0602 Welche Rolle spielen Betriebsärzte in Taxi- und Mietwagenbetrieben?", "antworten": ["Sie beraten das Unternehmen in Gesundheitsfragen und führen Vorsorgeuntersuchungen für Unternehmer durch (§ 3 ASiG).", "Sie kann Anordnungen treffen und Maßnahmen verlangen (§ 12 ASiG).", "Sie beraten das Unternehmen in Gesundheitsfragen und führen Vorsorgeuntersuchungen für Fahrer durch (§ 3 ASiG)."], "richtig": 2, "erklaerung": "Sie beraten das Unternehmen in Gesundheitsfragen und führen Vorsorgeuntersuchungen für Fahrer durch (§ 3 ASiG)."}, {"id": 603, "gesetz": "ASiG", "frage": "#0603 Welche Gefährdungen für Taxifahrer müssen bei der Arbeitssicherheit berücksichtigt werden?", "antworten": ["Risiken durch lange Sitzzeiten, Unfallgefahr, Überfälle und Stress; sie sind in der Gefährdungsbeurteilung zu ermitteln (§ 5 ArbSchG).", "Ausschließlich Gefahren in den Büroräumen am Betriebssitz, da das Taxi nicht als Arbeitsplatz gilt (§ 5 ArbSchG).", "Nur Risiken durch technische Mängel am Fahrzeug; Überfälle und Stress gehören nicht in die Gefährdungsbeurteilung (§ 5 ArbSchG)."], "richtig": 0, "erklaerung": "Risiken durch lange Sitzzeiten, Unfallgefahr, Überfälle und Stress; sie sind in der Gefährdungsbeurteilung zu ermitteln (§ 5 ArbSchG)."}, {"id": 604, "gesetz": "ASiG", "frage": "#0604 Darf ein Taxiunternehmen Sicherheitsingenieure einsetzen?", "antworten": ["Ja, jederzeit; soweit erforderlich, muss er Fachkräfte für Arbeitssicherheit (z. B. Sicherheitsingenieure) sogar schriftlich bestellen (§ 5 ASiG).", "Nein, Sicherheitsingenieure dürfen nur Betriebe mit mehr als 50 Beschäftigten einsetzen; kleinere Betriebe müssen die Berufsgenossenschaft beauftragen (§ 5 ASiG).", "Ja, aber nur mit Genehmigung der Gewerbeaufsicht; die Bestellung kann mündlich erfolgen und muss nicht dokumentiert werden (§ 5 ASiG)."], "richtig": 0, "erklaerung": "Ja, jederzeit; soweit erforderlich, muss er Fachkräfte für Arbeitssicherheit (z. B. Sicherheitsingenieure) sogar schriftlich bestellen (§ 5 ASiG)."}, {"id": 605, "gesetz": "ASiG", "frage": "#0605 Welche Pflicht hat ein Taxiunternehmer bezüglich der Arbeitsumgebung seiner Fahrer?", "antworten": ["Er muss nur das Fahrzeug verkehrssicher halten; für Ergonomie und Gesundheitsschutz ist der Fahrer selbst verantwortlich (§§ 3, 4 ArbSchG).", "Er muss die Arbeit so gestalten, dass Gefährdungen für Leben und Gesundheit vermieden bzw. gering gehalten werden, auch ergonomisch (§§ 3, 4 ArbSchG).", "Er muss jedem Fahrer alle drei Jahre ein neues Fahrzeug stellen; weitere Pflichten zur Arbeitsgestaltung bestehen nicht (§§ 3, 4 ArbSchG)."], "richtig": 1, "erklaerung": "Er muss die Arbeit so gestalten, dass Gefährdungen für Leben und Gesundheit vermieden bzw. gering gehalten werden, auch ergonomisch (§§ 3, 4 ArbSchG)."}, {"id": 606, "gesetz": "ASiG", "frage": "#0606 Was ist das Ziel des Arbeitssicherheitsgesetzes (ASiG)?", "antworten": ["Die Verbesserung des Arbeitsschutzes und der Unfallverhütung in Betrieben (§ 1 ASiG).", "Risiken durch lange Sitzzeiten, Unfallgefahr, Überfälle und Stress (§ 1 ASiG).", "Wenn er sich einem überbetrieblichen Dienst anschließt (§ 19 ASiG)."], "richtig": 0, "erklaerung": "Die Verbesserung des Arbeitsschutzes und der Unfallverhütung in Betrieben (§ 1 ASiG)."}, {"id": 607, "gesetz": "ASiG", "frage": "#0607 Welche Betriebe müssen Betriebsärzte und Fachkräfte für Arbeitssicherheit bestellen?", "antworten": ["Nur Betriebe mit mindestens 20 Arbeitnehmern; Kleinbetriebe sind unabhängig von der Gefährdung vollständig befreit (§§ 2, 5 ASiG).", "Nur Betriebe mit besonders gefährlichen Tätigkeiten wie Bau oder Chemie; Verkehrsbetriebe sind ausgenommen (§§ 2, 5 ASiG).", "Alle Betriebe mit Arbeitnehmern, soweit es nach Betriebsart, Beschäftigtenzahl und Organisation erforderlich ist (§§ 2, 5 ASiG)."], "richtig": 2, "erklaerung": "Alle Betriebe mit Arbeitnehmern, soweit es nach Betriebsart, Beschäftigtenzahl und Organisation erforderlich ist (§§ 2, 5 ASiG)."}, {"id": 608, "gesetz": "ASiG", "frage": "#0608 Welche Aufgaben haben Betriebsärzte nach dem ASiG?", "antworten": ["Beratung des Arbeitnehmers, Durchführung von arbeitsmedizinischen Untersuchungen und Beobachtung des Arbeitsschutzes (§ 3 ASiG).", "Beratung des Arbeitgebers, Durchführung von arbeitsmedizinischen Untersuchungen und Beobachtung des Arbeitsschutzes (§ 3 ASiG).", "Sie beraten das Unternehmen in Gesundheitsfragen und führen Vorsorgeuntersuchungen für Fahrer durch (§ 3 ASiG)."], "richtig": 1, "erklaerung": "Beratung des Arbeitgebers, Durchführung von arbeitsmedizinischen Untersuchungen und Beobachtung des Arbeitsschutzes (§ 3 ASiG)."}, {"id": 609, "gesetz": "ASiG", "frage": "#0609 Was sind die Hauptaufgaben von Fachkräften für Arbeitssicherheit?", "antworten": ["Verhängung von Bußgeldern bei Sicherheitsverstößen der Beschäftigten und Erteilung verbindlicher Weisungen an den Arbeitgeber (§ 6 ASiG).", "Beratung des Arbeitgebers in Sicherheitsfragen (auch bei der Gefährdungsbeurteilung), sicherheitstechnische Überprüfung und Begehung der Arbeitsstätten (§ 6 ASiG).", "Überwachung der Arbeitszeiten und Pausen, Erstellung der Lohnabrechnungen sowie Durchführung der ärztlichen Eignungsuntersuchungen der Fahrer (§ 6 ASiG)."], "richtig": 1, "erklaerung": "Beratung des Arbeitgebers in Sicherheitsfragen (auch bei der Gefährdungsbeurteilung), sicherheitstechnische Überprüfung und Begehung der Arbeitsstätten (§ 6 ASiG)."}, {"id": 610, "gesetz": "ASiG", "frage": "#0610 Wie müssen Betriebsärzte und Fachkräfte für Arbeitssicherheit bestellt werden?", "antworten": ["Mündlich durch die Berufsgenossenschaft, ohne Beteiligung des Betriebsrats (§§ 2, 5, 9 Abs. 3 ASiG).", "Durch Eintragung bei der IHK, mit Zustimmung der Gewerbeaufsicht (§§ 2, 5, 9 Abs. 3 ASiG).", "Schriftlich durch den Arbeitgeber, ggf. mit Zustimmung des Betriebsrats (§§ 2, 5, 9 Abs. 3 ASiG)."], "richtig": 2, "erklaerung": "Schriftlich durch den Arbeitgeber, ggf. mit Zustimmung des Betriebsrats (§§ 2, 5, 9 Abs. 3 ASiG)."}, {"id": 611, "gesetz": "ASiG", "frage": "#0611 Welche arbeitsmedizinischen Maßnahmen führen Betriebsärzte durch?", "antworten": ["Ja, wenn es eine bestimmte Anzahl an Mitarbeitern überschreitet oder besondere Sicherheitsrisiken bestehen (§ 5 ASiG).", "Er muss sicherstellen, dass Arbeitsbedingungen ergonomisch und gesundheitsschonend sind (§ 3 ASiG).", "Gesundheitsüberwachung, Vorsorgeuntersuchungen und Beratung von Beschäftigten (§ 3 ASiG)."], "richtig": 2, "erklaerung": "Gesundheitsüberwachung, Vorsorgeuntersuchungen und Beratung von Beschäftigten (§ 3 ASiG)."}, {"id": 612, "gesetz": "ASiG", "frage": "#0612 Müssen Betriebsärzte regelmäßige Betriebsbegehungen durchführen?", "antworten": ["Schriftlich durch den Arbeitgeber (§ 2 ASiG).", "Ja, um Gefahren zu identifizieren und geeignete Maßnahmen vorzuschlagen (§ 3 ASiG).", "Nein, um Gefahren zu identifizieren und geeignete Maßnahmen vorzuschlagen (§ 3 ASiG)."], "richtig": 1, "erklaerung": "Ja, um Gefahren zu identifizieren und geeignete Maßnahmen vorzuschlagen (§ 3 ASiG)."}, {"id": 613, "gesetz": "ASiG", "frage": "#0613 Dürfen Betriebsärzte Krankmeldungen überprüfen?", "antworten": ["Sie dürfen Betriebe betreten, Unterlagen einsehen und Anordnungen erlassen (§ 13 ASiG).", "Ja, dies gehört nicht zu ihren Aufgaben (§ 3 Abs. 3 ASiG).", "Nein, dies gehört nicht zu ihren Aufgaben (§ 3 Abs. 3 ASiG)."], "richtig": 2, "erklaerung": "Nein, dies gehört nicht zu ihren Aufgaben (§ 3 Abs. 3 ASiG)."}, {"id": 614, "gesetz": "ASiG", "frage": "#0614 Was muss ein Betriebsarzt tun, wenn er Gesundheitsgefährdungen feststellt?", "antworten": ["Den Arbeitgeber informieren und Maßnahmen zur Gefahrenbeseitigung vorschlagen (§ 3 ASiG).", "Geldbußen bis zu 25.000 € (§ 20 ASiG).", "Den Arbeitnehmer informieren und Maßnahmen zur Gefahrenbeseitigung vorschlagen (§ 3 ASiG)."], "richtig": 0, "erklaerung": "Den Arbeitgeber informieren und Maßnahmen zur Gefahrenbeseitigung vorschlagen (§ 3 ASiG)."}, {"id": 615, "gesetz": "ASiG", "frage": "#0615 Welche Anforderungen muss ein Betriebsarzt erfüllen?", "antworten": ["Ja, sie müssen ihre Fachkunde unabhängig anwenden (§ 8 ASiG).", "Er muss berechtigt sein, den ärztlichen Beruf auszuüben und über arbeitsmedizinische Fachkunde verfügen (§ 4 ASiG).", "Alle Betriebe, soweit es für die Sicherheit der Arbeitnehmer erforderlich ist (§ 2 ASiG)."], "richtig": 1, "erklaerung": "Er muss berechtigt sein, den ärztlichen Beruf auszuüben und über arbeitsmedizinische Fachkunde verfügen (§ 4 ASiG)."}, {"id": 616, "gesetz": "ASiG", "frage": "#0616 Welche Hauptaufgaben haben Fachkräfte für Arbeitssicherheit?", "antworten": ["Beratung des Arbeitgebers und der Beschäftigten in Fragen des Arbeitsschutzes und der Unfallverhütung (§ 6 ASiG).", "Beratung des Arbeitnehmers und der Beschäftigten in Fragen des Arbeitsschutzes und der Unfallverhütung (§ 6 ASiG).", "Sie kann Anordnungen treffen und Maßnahmen verlangen (§ 12 ASiG)."], "richtig": 0, "erklaerung": "Beratung des Arbeitgebers und der Beschäftigten in Fragen des Arbeitsschutzes und der Unfallverhütung (§ 6 ASiG)."}, {"id": 617, "gesetz": "ASiG", "frage": "#0617 Müssen Fachkräfte für Arbeitssicherheit regelmäßig Betriebsanlagen überprüfen?", "antworten": ["Beratung über Arbeitsschutzmaßnahmen und Unfallverhütung (§ 11 ASiG).", "Nein, insbesondere vor der Inbetriebnahme neuer Arbeitsmittel (§ 6 ASiG).", "Ja, insbesondere vor der Inbetriebnahme neuer Arbeitsmittel (§ 6 ASiG)."], "richtig": 2, "erklaerung": "Ja, insbesondere vor der Inbetriebnahme neuer Arbeitsmittel (§ 6 ASiG)."}, {"id": 618, "gesetz": "ASiG", "frage": "#0618 Welche Maßnahmen können Fachkräfte für Arbeitssicherheit vorschlagen?", "antworten": ["Nein, dies gehört nicht zu ihren Aufgaben (§ 3 Abs. 3 ASiG).", "Technische, organisatorische und persönliche Schutzmaßnahmen (§ 6 ASiG).", "Wenn er sich einem überbetrieblichen Dienst anschließt (§ 19 ASiG)."], "richtig": 1, "erklaerung": "Technische, organisatorische und persönliche Schutzmaßnahmen (§ 6 ASiG)."}, {"id": 619, "gesetz": "ASiG", "frage": "#0619 Welche Anforderungen müssen Fachkräfte für Arbeitssicherheit erfüllen?", "antworten": ["Sie müssen über eine sicherheitstechnische Fachkunde verfügen (§ 7 ASiG).", "Wenn er sich einem überbetrieblichen Dienst anschließt (§ 19 ASiG).", "Die Verbesserung des Arbeitsschutzes und der Unfallverhütung in Betrieben (§ 1 ASiG)."], "richtig": 0, "erklaerung": "Sie müssen über eine sicherheitstechnische Fachkunde verfügen (§ 7 ASiG)."}, {"id": 620, "gesetz": "ASiG", "frage": "#0620 Sind Fachkräfte für Arbeitssicherheit gegenüber dem Arbeitgeber weisungsfrei?", "antworten": ["Ja, sie müssen ihre Fachkunde unabhängig anwenden (§ 8 ASiG).", "Ja, insbesondere durch gemeinsame Betriebsbegehungen (§ 10 ASiG).", "Nein, sie müssen ihre Fachkunde unabhängig anwenden (§ 8 ASiG)."], "richtig": 0, "erklaerung": "Ja, sie müssen ihre Fachkunde unabhängig anwenden (§ 8 ASiG)."}, {"id": 621, "gesetz": "ASiG", "frage": "#0621 Müssen Betriebsärzte und Fachkräfte für Arbeitssicherheit zusammenarbeiten?", "antworten": ["Nein, insbesondere durch gemeinsame Betriebsbegehungen (§ 10 ASiG).", "Ja, insbesondere durch gemeinsame Betriebsbegehungen (§ 10 ASiG).", "Sie dürfen Betriebe betreten, Unterlagen einsehen und Anordnungen erlassen (§ 13 ASiG)."], "richtig": 1, "erklaerung": "Ja, insbesondere durch gemeinsame Betriebsbegehungen (§ 10 ASiG)."}, {"id": 622, "gesetz": "ASiG", "frage": "#0622 Was ist ein Arbeitsschutzausschuss?", "antworten": ["Gesundheitsüberwachung, Vorsorgeuntersuchungen und Beratung von Beschäftigten (§ 3 ASiG).", "Ein Ausschuss in Betrieben mit mehr als 20 Beschäftigten, der sich mit Fragen des Arbeitsschutzes befasst (§ 11 ASiG).", "Alle Betriebe, soweit es für die Sicherheit der Arbeitnehmer erforderlich ist (§ 2 ASiG)."], "richtig": 1, "erklaerung": "Ein Ausschuss in Betrieben mit mehr als 20 Beschäftigten, der sich mit Fragen des Arbeitsschutzes befasst (§ 11 ASiG)."}, {"id": 623, "gesetz": "ASiG", "frage": "#0623 Welche Aufgaben hat der Arbeitsschutzausschuss?", "antworten": ["Beratung über Arbeitsschutzmaßnahmen und Unfallverhütung (§ 11 ASiG).", "Ja, insbesondere vor der Inbetriebnahme neuer Arbeitsmittel (§ 6 ASiG).", "Den Arbeitgeber informieren und Maßnahmen zur Gefahrenbeseitigung vorschlagen (§ 3 ASiG)."], "richtig": 0, "erklaerung": "Beratung über Arbeitsschutzmaßnahmen und Unfallverhütung (§ 11 ASiG)."}, {"id": 624, "gesetz": "ASiG", "frage": "#0624 Wer ist Mitglied des Arbeitsschutzausschusses?", "antworten": ["Arbeitnehmer, Betriebsratsmitglieder, Betriebsärzte, Fachkräfte für Arbeitssicherheit und Sicherheitsbeauftragte (§ 11 ASiG).", "Arbeitgeber, Betriebsratsmitglieder, Betriebsärzte, Fachkräfte für Arbeitssicherheit und Sicherheitsbeauftragte (§ 11 ASiG).", "Sie beraten das Unternehmen in Gesundheitsfragen und führen Vorsorgeuntersuchungen für Fahrer durch (§ 3 ASiG)."], "richtig": 1, "erklaerung": "Arbeitgeber, Betriebsratsmitglieder, Betriebsärzte, Fachkräfte für Arbeitssicherheit und Sicherheitsbeauftragte (§ 11 ASiG)."}, {"id": 625, "gesetz": "ASiG", "frage": "#0625 Wie oft muss der Arbeitsschutzausschuss tagen?", "antworten": ["Mindestens einmal pro Quartal (§ 11 ASiG).", "Ja, insbesondere vor der Inbetriebnahme neuer Arbeitsmittel (§ 6 ASiG).", "Beratung über Arbeitsschutzmaßnahmen und Unfallverhütung (§ 11 ASiG)."], "richtig": 0, "erklaerung": "Mindestens einmal pro Quartal (§ 11 ASiG)."}, {"id": 626, "gesetz": "ASiG", "frage": "#0626 Welche Behörde ist für die Überwachung des ASiG zuständig?", "antworten": ["Technische, organisatorische und persönliche Schutzmaßnahmen (§ 6 ASiG).", "Sie kann Anordnungen treffen und Maßnahmen verlangen (§ 12 ASiG).", "Die zuständige Arbeitsschutzbehörde (§ 12 ASiG)."], "richtig": 2, "erklaerung": "Die zuständige Arbeitsschutzbehörde (§ 12 ASiG)."}, {"id": 627, "gesetz": "ASiG", "frage": "#0627 Welche Maßnahmen kann die Behörde bei Verstößen gegen das ASiG ergreifen?", "antworten": ["Er muss sicherstellen, dass Arbeitsbedingungen ergonomisch und gesundheitsschonend sind (§ 3 ASiG).", "Die Verbesserung des Arbeitsschutzes und der Unfallverhütung in Betrieben (§ 1 ASiG).", "Sie kann Anordnungen treffen und Maßnahmen verlangen (§ 12 ASiG)."], "richtig": 2, "erklaerung": "Sie kann Anordnungen treffen und Maßnahmen verlangen (§ 12 ASiG)."}, {"id": 628, "gesetz": "ASiG", "frage": "#0628 Welche Rechte haben Arbeitsschutzbehörden?", "antworten": ["Sie dürfen Arbeitsstätten nur nach schriftlicher Ankündigung und mit Zustimmung des Arbeitgebers betreten (§ 13 ASiG); Anordnungen dürfen nur Gerichte treffen (§ 12 ASiG).", "Sie dürfen Auskünfte verlangen, Arbeitsstätten während der Betriebszeit betreten und besichtigen (§ 13 ASiG) sowie Anordnungen treffen (§ 12 ASiG).", "Sie dürfen Bußgelder vor Ort bar kassieren und Betriebe ohne Anhörung dauerhaft schließen (§ 13 ASiG), jedoch keine Auskünfte verlangen (§ 12 ASiG)."], "richtig": 1, "erklaerung": "Sie dürfen Auskünfte verlangen, Arbeitsstätten während der Betriebszeit betreten und besichtigen (§ 13 ASiG) sowie Anordnungen treffen (§ 12 ASiG)."}, {"id": 629, "gesetz": "ASiG", "frage": "#0629 Welche Sanktionen drohen bei Verstößen gegen das ASiG?", "antworten": ["Bußgelder bis 5.000 € bei Verstoß gegen eine vollziehbare Anordnung, bis 50 € bei Auskunfts- oder Besichtigungsverstößen (§ 20 ASiG).", "Freiheitsstrafe bis zu einem Jahr bei Verstoß gegen eine vollziehbare Anordnung, Bußgeld bis 2.500 € bei Auskunftsverstößen (§ 20 ASiG).", "Bußgelder bis 25.000 € bei Verstoß gegen eine vollziehbare Anordnung, bis 500 € bei Auskunfts- oder Besichtigungsverstößen (§ 20 ASiG)."], "richtig": 2, "erklaerung": "Bußgelder bis 25.000 € bei Verstoß gegen eine vollziehbare Anordnung, bis 500 € bei Auskunfts- oder Besichtigungsverstößen (§ 20 ASiG)."}, {"id": 630, "gesetz": "ASiG", "frage": "#0630 Wie kann ein Arbeitgeber seine Pflicht zur Bestellung von Fachkräften für Arbeitssicherheit noch erfüllen?", "antworten": ["Er kann die Pflicht auch erfüllen, indem er eine jährliche Pauschale an die Gewerbeaufsicht zahlt (§ 19 ASiG).", "Er kann die Pflicht auch erfüllen, indem er einen Fahrer mit Erste-Hilfe-Kurs zum Sicherheitsbeauftragten ernennt (§ 19 ASiG).", "Er kann die Pflicht auch erfüllen, indem er einen überbetrieblichen Dienst mit den Aufgaben beauftragt (§ 19 ASiG)."], "richtig": 2, "erklaerung": "Er kann die Pflicht auch erfüllen, indem er einen überbetrieblichen Dienst mit den Aufgaben beauftragt (§ 19 ASiG)."}, {"id": 651, "gesetz": "JArbSchG", "frage": "#0651 Dürfen Jugendliche als Taxifahrer arbeiten?", "antworten": ["Ja, ab 16 Jahren als Auszubildende, wenn ein erfahrener Taxifahrer als Begleiter mitfährt (§ 48 Abs. 4 Nr. 2 FeV).", "Ja, ab 17 Jahren, sofern sie die Klasse B im begleiteten Fahren besitzen (§ 48 Abs. 4 Nr. 2 FeV).", "Nein, die Fahrerlaubnis zur Fahrgastbeförderung setzt das vollendete 21. Lebensjahr voraus (§ 48 Abs. 4 Nr. 2 FeV)."], "richtig": 2, "erklaerung": "Nein, die Fahrerlaubnis zur Fahrgastbeförderung setzt das vollendete 21. Lebensjahr voraus (§ 48 Abs. 4 Nr. 2 FeV)."}, {"id": 652, "gesetz": "JArbSchG", "frage": "#0652 Dürfen Jugendliche in einem Taxiunternehmen beschäftigt werden?", "antworten": ["Ja, aber nur für nicht Unternehmerbezogene Tätigkeiten, z. B. Büroarbeit oder Fahrzeugpflege (§ 22 JArbSchG).", "Ja, aber nur für nicht fahrerbezogene Tätigkeiten, z. B. Büroarbeit oder Fahrzeugpflege (§ 22 JArbSchG).", "Nein, aber nur für nicht fahrerbezogene Tätigkeiten, z. B. Büroarbeit oder Fahrzeugpflege (§ 22 JArbSchG)."], "richtig": 1, "erklaerung": "Ja, aber nur für nicht fahrerbezogene Tätigkeiten, z. B. Büroarbeit oder Fahrzeugpflege (§ 22 JArbSchG)."}, {"id": 653, "gesetz": "JArbSchG", "frage": "#0653 Welche Arbeitszeiten gelten für Jugendliche in Taxiunternehmen?", "antworten": ["Maximal 8 Stunden täglich und 40 Stunden wöchentlich (§ 8 JArbSchG).", "Maximal 12 Stunden täglich und 40 Stunden wöchentlich (§ 8 JArbSchG).", "Maximal 4 Stunden täglich und 40 Stunden wöchentlich (§ 8 JArbSchG)."], "richtig": 0, "erklaerung": "Maximal 8 Stunden täglich und 40 Stunden wöchentlich (§ 8 JArbSchG)."}, {"id": 654, "gesetz": "JArbSchG", "frage": "#0654 Dürfen Jugendliche in einem Taxiunternehmen nachts arbeiten?", "antworten": ["Nein, Jugendliche dürfen in der Regel nicht zwischen 20:00 und 6:00 Uhr beschäftigt werden (§ 14 JArbSchG).", "Nein, außer in gesetzlich zugelassenen Bereichen wie Verkehrsbetrieben (§ 18 JArbSchG).", "Ja, Jugendliche dürfen in der Regel nicht zwischen 20:00 und 6:00 Uhr beschäftigt werden (§ 14 JArbSchG)."], "richtig": 0, "erklaerung": "Nein, Jugendliche dürfen in der Regel nicht zwischen 20:00 und 6:00 Uhr beschäftigt werden (§ 14 JArbSchG)."}, {"id": 655, "gesetz": "JArbSchG", "frage": "#0655 Sind Jugendliche von der Samstags- und Sonntagsruhe ausgenommen?", "antworten": ["Samstagsarbeit ist im Taxigewerbe generell verboten; Sonntagsarbeit ist zulässig, wenn jeder zweite Sonntag frei bleibt (§§ 16, 17 JArbSchG).", "Samstags- und Sonntagsarbeit ist im Verkehrswesen ohne Einschränkung zulässig; eine Freistellung an anderen Tagen ist nicht erforderlich (§§ 16, 17 JArbSchG).", "Samstagsarbeit ist im Verkehrswesen zulässig, mit Freistellung an einem anderen Tag derselben Woche; Sonntagsarbeit ist im Taxigewerbe verboten (§§ 16, 17 JArbSchG)."], "richtig": 2, "erklaerung": "Samstagsarbeit ist im Verkehrswesen zulässig, mit Freistellung an einem anderen Tag derselben Woche; Sonntagsarbeit ist im Taxigewerbe verboten (§§ 16, 17 JArbSchG)."}, {"id": 656, "gesetz": "JArbSchG", "frage": "#0656 Was ist das Ziel des Jugendarbeitsschutzgesetzes (JArbSchG)?", "antworten": ["Maximal 10 Stunden inklusive Pausen (§ 12 JArbSchG).", "Der Schutz von Jugendlichen vor Überlastung und gesundheitlichen Schäden bei der Arbeit (§ 1 JArbSchG).", "Geldbußen bis zu 15.000 € oder in schweren Fällen Freiheitsstrafen (§ 58 JArbSchG)."], "richtig": 1, "erklaerung": "Der Schutz von Jugendlichen vor Überlastung und gesundheitlichen Schäden bei der Arbeit (§ 1 JArbSchG)."}, {"id": 657, "gesetz": "JArbSchG", "frage": "#0657 Für wen gilt das JArbSchG?", "antworten": ["Für alle Beschäftigten unter 18 Jahren, mit speziellen Regelungen für Kinder und Jugendliche (§§ 1, 2 JArbSchG).", "Für alle Beschäftigten unter 21 Jahren, da bis dahin die Fahrerlaubnis zur Fahrgastbeförderung fehlt (§§ 1, 2 JArbSchG).", "Nur für Auszubildende unter 18 Jahren; Aushilfen und Ferienjobber sind ausgenommen (§§ 1, 2 JArbSchG)."], "richtig": 0, "erklaerung": "Für alle Beschäftigten unter 18 Jahren, mit speziellen Regelungen für Kinder und Jugendliche (§§ 1, 2 JArbSchG)."}, {"id": 658, "gesetz": "JArbSchG", "frage": "#0658 Wann gilt eine Person als Kind oder Jugendlicher im Sinne des JArbSchG?", "antworten": ["Kind: unter 14 Jahre, Jugendlicher: 14 bis unter 21 Jahre; Vollzeitschulpflichtige werden wie Erwachsene behandelt (§ 2 JArbSchG).", "Kind: unter 15 Jahre, Jugendlicher: 15 bis unter 18 Jahre; Vollzeitschulpflichtige werden wie Kinder behandelt (§ 2 JArbSchG).", "Kind: unter 16 Jahre, Jugendlicher: 16 bis unter 18 Jahre; Auszubildende werden stets wie Kinder behandelt (§ 2 JArbSchG)."], "richtig": 1, "erklaerung": "Kind: unter 15 Jahre, Jugendlicher: 15 bis unter 18 Jahre; Vollzeitschulpflichtige werden wie Kinder behandelt (§ 2 JArbSchG)."}, {"id": 659, "gesetz": "JArbSchG", "frage": "#0659 Welche Arbeitszeitregelungen gelten für Jugendliche?", "antworten": ["Maximal 4 Stunden täglich, 40 Stunden wöchentlich, in Ausnahmen 8,5 Stunden täglich (§ 8 JArbSchG).", "Maximal 8 Stunden täglich, 40 Stunden wöchentlich, in Ausnahmen 8,5 Stunden täglich (§ 8 JArbSchG).", "Maximal 12 Stunden täglich, 40 Stunden wöchentlich, in Ausnahmen 8,5 Stunden täglich (§ 8 JArbSchG)."], "richtig": 1, "erklaerung": "Maximal 8 Stunden täglich, 40 Stunden wöchentlich, in Ausnahmen 8,5 Stunden täglich (§ 8 JArbSchG)."}, {"id": 660, "gesetz": "JArbSchG", "frage": "#0660 Wann haben Jugendliche Anspruch auf Ruhepausen?", "antworten": ["30 Minuten bei mehr als 4,5 Stunden Arbeit, 60 Minuten bei mehr als 6 Stunden (§ 11 JArbSchG).", "60 Minuten bei mehr als 4,5 Stunden Arbeit, 60 Minuten bei mehr als 6 Stunden (§ 11 JArbSchG).", "14 Minuten bei mehr als 4,5 Stunden Arbeit, 60 Minuten bei mehr als 6 Stunden (§ 11 JArbSchG)."], "richtig": 0, "erklaerung": "30 Minuten bei mehr als 4,5 Stunden Arbeit, 60 Minuten bei mehr als 6 Stunden (§ 11 JArbSchG)."}, {"id": 661, "gesetz": "JArbSchG", "frage": "#0661 Welche Arbeiten sind für Jugendliche verboten?", "antworten": ["In regelmäßigen Abständen durch die zuständige Aufsichtsbehörde (§ 51 JArbSchG).", "Gefährliche, gesundheitsschädliche, übermäßig belastende oder sittlich gefährdende Arbeiten (§ 22 JArbSchG).", "Nein, es sei denn, die Arbeit ist für ihre Ausbildung erforderlich und wird überwacht (§ 22 JArbSchG)."], "richtig": 1, "erklaerung": "Gefährliche, gesundheitsschädliche, übermäßig belastende oder sittlich gefährdende Arbeiten (§ 22 JArbSchG)."}, {"id": 662, "gesetz": "JArbSchG", "frage": "#0662 Dürfen Jugendliche Akkordarbeit oder tempoabhängige Arbeit leisten?", "antworten": ["Ja, ab 15 Jahren uneingeschränkt, wenn die Eltern schriftlich zustimmen und ein Akkordzuschlag gezahlt wird (§ 23 JArbSchG).", "Grundsätzlich nein; Ausnahmen gelten für über 16-Jährige zur Ausbildung oder nach abgeschlossener Ausbildung unter fachkundiger Aufsicht (§ 23 JArbSchG).", "Grundsätzlich nein; Ausnahmen gelten nur für unter 16-Jährige in Ferienjobs mit höchstens 2 Stunden täglich (§ 23 JArbSchG)."], "richtig": 1, "erklaerung": "Grundsätzlich nein; Ausnahmen gelten für über 16-Jährige zur Ausbildung oder nach abgeschlossener Ausbildung unter fachkundiger Aufsicht (§ 23 JArbSchG)."}, {"id": 663, "gesetz": "JArbSchG", "frage": "#0663 Welche Tätigkeiten dürfen Jugendliche unter Tage nicht ausführen?", "antworten": ["Arbeiten mit Lärm, Strahlen, gefährlichen Chemikalien oder in extremer Hitze/Kälte (§ 22 JArbSchG).", "Nein, Jugendliche dürfen in der Regel nicht zwischen 20:00 und 6:00 Uhr beschäftigt werden (§ 14 JArbSchG).", "Alle Arbeiten im Bergbau unter Tage (§ 24 JArbSchG)."], "richtig": 2, "erklaerung": "Alle Arbeiten im Bergbau unter Tage (§ 24 JArbSchG)."}, {"id": 664, "gesetz": "JArbSchG", "frage": "#0664 Dürfen Jugendliche schwere körperliche Arbeiten verrichten?", "antworten": ["Ja, ab 16 Jahren dürfen sie schwere körperliche Arbeiten verrichten, wenn ein Arzt dies vorher bescheinigt hat (§ 22 Abs. 2 JArbSchG).", "Ja, aber nur höchstens vier Stunden täglich und unter ständiger Aufsicht eines fachkundigen Erwachsenen (§ 22 Abs. 1 Nr. 1 JArbSchG).", "Nein, Arbeiten, die ihre körperliche oder psychische Leistungsfähigkeit übersteigen, sind ausnahmslos verboten (§ 22 Abs. 1 Nr. 1 JArbSchG)."], "richtig": 2, "erklaerung": "Nein, Arbeiten, die ihre körperliche oder psychische Leistungsfähigkeit übersteigen, sind ausnahmslos verboten (§ 22 Abs. 1 Nr. 1 JArbSchG)."}, {"id": 665, "gesetz": "JArbSchG", "frage": "#0665 Welche Arbeitsbereiche sind für Jugendliche besonders eingeschränkt?", "antworten": ["Geldbußen bis zu 15.000 € oder in schweren Fällen Freiheitsstrafen (§ 58 JArbSchG).", "Arbeiten mit Lärm, Strahlen, gefährlichen Chemikalien oder in extremer Hitze/Kälte (§ 22 JArbSchG).", "Nein, Jugendliche dürfen in der Regel nicht zwischen 20:00 und 6:00 Uhr beschäftigt werden (§ 14 JArbSchG)."], "richtig": 1, "erklaerung": "Arbeiten mit Lärm, Strahlen, gefährlichen Chemikalien oder in extremer Hitze/Kälte (§ 22 JArbSchG)."}, {"id": 666, "gesetz": "JArbSchG", "frage": "#0666 Wie viele freie Tage müssen Jugendliche pro Woche haben?", "antworten": ["Maximal 8 Stunden täglich, 40 Stunden wöchentlich, in Ausnahmen 8,5 Stunden täglich (§ 8 JArbSchG).", "Erstuntersuchung vor Arbeitsbeginn und Nachuntersuchung nach einem Jahr (§ 32, § 33 JArbSchG).", "Mindestens zwei Ruhetage (§ 15 JArbSchG)."], "richtig": 2, "erklaerung": "Mindestens zwei Ruhetage (§ 15 JArbSchG)."}, {"id": 667, "gesetz": "JArbSchG", "frage": "#0667 Wann dürfen Jugendliche sonntags arbeiten?", "antworten": ["Ab 16 Jahren in allen Branchen einschließlich Taxigewerbe; mindestens ein Sonntag im Monat muss beschäftigungsfrei bleiben (§ 17 JArbSchG).", "Generell an jedem Sonntag, wenn dafür ein Ersatzruhetag in derselben Woche gewährt wird, auch im Taxi- und Mietwagengewerbe (§ 17 JArbSchG).", "Nur in den Bereichen des § 17 Abs. 2, z. B. Krankenanstalten, Gaststätten, Sport; mindestens zwei Sonntage im Monat frei, nicht im Taxigewerbe (§ 17 JArbSchG)."], "richtig": 2, "erklaerung": "Nur in den Bereichen des § 17 Abs. 2, z. B. Krankenanstalten, Gaststätten, Sport; mindestens zwei Sonntage im Monat frei, nicht im Taxigewerbe (§ 17 JArbSchG)."}, {"id": 668, "gesetz": "JArbSchG", "frage": "#0668 Dürfen Jugendliche an Feiertagen arbeiten?", "antworten": ["Nein, außer im Taxi- und Mietwagengewerbe; dort ausgenommen sind nur der 24.12. und der 31.12. ab 14 Uhr (§ 18 JArbSchG).", "Ja, an allen Feiertagen ohne Ausnahme, auch im Taxigewerbe, sofern ein Zuschlag von 100 % gezahlt und ein Ersatzruhetag gewährt wird (§ 18 JArbSchG).", "Nein, außer in den Bereichen des § 17 Abs. 2 (z. B. Gaststätten, Krankenanstalten), nicht am 25.12., 1.1., Ostersonntag und 1.5. (§ 18 JArbSchG)."], "richtig": 2, "erklaerung": "Nein, außer in den Bereichen des § 17 Abs. 2 (z. B. Gaststätten, Krankenanstalten), nicht am 25.12., 1.1., Ostersonntag und 1.5. (§ 18 JArbSchG)."}, {"id": 669, "gesetz": "JArbSchG", "frage": "#0669 Welche Nachtruhezeiten gelten für Jugendliche?", "antworten": ["Beschäftigung nur zwischen 6:00 und 20:00 Uhr erlaubt, mit Ausnahmen für bestimmte Branchen (§ 14 JArbSchG).", "Ja, wenn sie in Verkehrsunternehmen tätig sind, muss ihnen ein Ersatzruhetag gewährt werden (§ 16, § 17 JArbSchG).", "Geldbußen bis zu 15.000 € oder in schweren Fällen Freiheitsstrafen (§ 58 JArbSchG)."], "richtig": 0, "erklaerung": "Beschäftigung nur zwischen 6:00 und 20:00 Uhr erlaubt, mit Ausnahmen für bestimmte Branchen (§ 14 JArbSchG)."}, {"id": 670, "gesetz": "JArbSchG", "frage": "#0670 Welche Schichtzeit gilt für Jugendliche?", "antworten": ["Maximal 10 Stunden inklusive Pausen (§ 12 JArbSchG).", "Maximal 15 Stunden inklusive Pausen (§ 12 JArbSchG).", "Maximal 5 Stunden inklusive Pausen (§ 12 JArbSchG)."], "richtig": 0, "erklaerung": "Maximal 10 Stunden inklusive Pausen (§ 12 JArbSchG)."}, {"id": 671, "gesetz": "JArbSchG", "frage": "#0671 Welche ärztlichen Untersuchungen sind für jugendliche Arbeitnehmer vorgeschrieben?", "antworten": ["Alle Arbeiten im Bergbau unter Tage (§ 24 JArbSchG).", "Die zuständigen Arbeitsschutzbehörden (§ 51 JArbSchG).", "Erstuntersuchung vor Arbeitsbeginn und Nachuntersuchung nach einem Jahr (§ 32, § 33 JArbSchG)."], "richtig": 2, "erklaerung": "Erstuntersuchung vor Arbeitsbeginn und Nachuntersuchung nach einem Jahr (§ 32, § 33 JArbSchG)."}, {"id": 672, "gesetz": "JArbSchG", "frage": "#0672 Was passiert, wenn ein Jugendlicher die Nachuntersuchung nicht vorlegt?", "antworten": ["In Ausnahmefällen, z. B. in Verkehrsbetrieben, mit Ersatzruhetag (§ 17 JArbSchG).", "Beschäftigungsverbot bis zur Vorlage der Bescheinigung (§ 33 JArbSchG).", "Der Staat (§ 44 JArbSchG)."], "richtig": 1, "erklaerung": "Beschäftigungsverbot bis zur Vorlage der Bescheinigung (§ 33 JArbSchG)."}, {"id": 673, "gesetz": "JArbSchG", "frage": "#0673 Müssen Arbeitgeber die ärztlichen Untersuchungsbescheinigungen aufbewahren?", "antworten": ["Nein, sie sind dem Jugendlichen sofort zurückzugeben; der Arbeitgeber muss lediglich eine Kopie bei der IHK hinterlegen (§ 41 JArbSchG).", "Ja, bis zum Ende der Beschäftigung, längstens bis zur Vollendung des 18. Lebensjahres; beim Ausscheiden sind sie auszuhändigen (§ 41 JArbSchG).", "Ja, mindestens zehn Jahre nach Ende der Beschäftigung; eine Aushändigung an den Jugendlichen beim Ausscheiden ist unzulässig (§ 41 JArbSchG)."], "richtig": 1, "erklaerung": "Ja, bis zum Ende der Beschäftigung, längstens bis zur Vollendung des 18. Lebensjahres; beim Ausscheiden sind sie auszuhändigen (§ 41 JArbSchG)."}, {"id": 674, "gesetz": "JArbSchG", "frage": "#0674 Wer trägt die Kosten für die ärztlichen Untersuchungen?", "antworten": ["Der Bund (§ 44 JArbSchG).", "Das Land (§ 44 JArbSchG).", "Die IHK (§ 44 JArbSchG)."], "richtig": 1, "erklaerung": "Das Land (§ 44 JArbSchG)."}, {"id": 675, "gesetz": "JArbSchG", "frage": "#0675 Wann ist eine außerordentliche Nachuntersuchung anzuordnen?", "antworten": ["Die Krankenkasse ordnet sie an, wenn der Jugendliche im Kalenderjahr mehr als sechs Wochen arbeitsunfähig war (§ 35 JArbSchG).", "Der Arzt soll sie anordnen bei Entwicklungsrückstand, gesundheitlichen Schwächen/Schäden oder noch unklaren Auswirkungen der Beschäftigung (§ 35 JArbSchG).", "Der Arbeitgeber muss sie jährlich anordnen, sobald der Jugendliche mehr als 20 Stunden pro Woche beschäftigt wird oder Nachtschichten leistet (§ 35 JArbSchG)."], "richtig": 1, "erklaerung": "Der Arzt soll sie anordnen bei Entwicklungsrückstand, gesundheitlichen Schwächen/Schäden oder noch unklaren Auswirkungen der Beschäftigung (§ 35 JArbSchG)."}, {"id": 676, "gesetz": "JArbSchG", "frage": "#0676 Welche Behörde überwacht die Einhaltung des JArbSchG?", "antworten": ["Nein, es sei denn, die Arbeit ist für ihre Ausbildung erforderlich und wird überwacht (§ 22 JArbSchG).", "Die zuständigen Arbeitsschutzbehörden (§ 51 JArbSchG).", "Erstuntersuchung vor Arbeitsbeginn und Nachuntersuchung nach einem Jahr (§ 32, § 33 JArbSchG)."], "richtig": 1, "erklaerung": "Die zuständigen Arbeitsschutzbehörden (§ 51 JArbSchG)."}, {"id": 677, "gesetz": "JArbSchG", "frage": "#0677 Welche Sanktionen drohen bei Verstößen gegen das JArbSchG?", "antworten": ["Geldbußen bis zu 5.000 €, bei vorsätzlicher Gefährdung oder beharrlicher Wiederholung Freiheitsstrafe bis zu drei Jahren (§ 58 JArbSchG).", "Geldbußen bis zu 30.000 €, bei vorsätzlicher Gefährdung oder beharrlicher Wiederholung Freiheitsstrafe bis zu einem Jahr (§ 58 JArbSchG).", "Nur Verwarnungsgelder bis 1.000 € durch die Berufsgenossenschaft; Freiheitsstrafen sieht das JArbSchG nicht vor (§ 59 JArbSchG)."], "richtig": 1, "erklaerung": "Geldbußen bis zu 30.000 €, bei vorsätzlicher Gefährdung oder beharrlicher Wiederholung Freiheitsstrafe bis zu einem Jahr (§ 58 JArbSchG)."}, {"id": 678, "gesetz": "JArbSchG", "frage": "#0678 Wann kann ein Betrieb eine Ausnahmegenehmigung erhalten?", "antworten": ["Wenn besondere betriebliche Bedingungen es erfordern und die Gesundheit nicht gefährdet wird (§ 54 JArbSchG).", "In Ausnahmefällen, z. B. in Verkehrsbetrieben, mit Ersatzruhetag (§ 17 JArbSchG).", "Nein, es sei denn, die Arbeit ist für ihre Ausbildung erforderlich und wird überwacht (§ 22 JArbSchG)."], "richtig": 0, "erklaerung": "Wenn besondere betriebliche Bedingungen es erfordern und die Gesundheit nicht gefährdet wird (§ 54 JArbSchG)."}, {"id": 679, "gesetz": "JArbSchG", "frage": "#0679 Wie oft müssen Unternehmen mit jugendlichen Beschäftigten kontrolliert werden?", "antworten": ["In regelmäßigen Abständen durch die zuständige Genehmigungsbehörde (§ 51 JArbSchG).", "Mindestens zwei Ruhetage (§ 15 JArbSchG).", "In regelmäßigen Abständen durch die zuständige Aufsichtsbehörde (§ 51 JArbSchG)."], "richtig": 2, "erklaerung": "In regelmäßigen Abständen durch die zuständige Aufsichtsbehörde (§ 51 JArbSchG)."}, {"id": 680, "gesetz": "JArbSchG", "frage": "#0680 Welche Konsequenzen hat die Beschäftigung eines Jugendlichen ohne Erstuntersuchung?", "antworten": ["Keine, wenn die Untersuchung binnen drei Monaten nachgeholt wird (§ 32 JArbSchG); ein Bußgeld ist nicht vorgesehen.", "Verbot der Beschäftigung (§ 32 JArbSchG) und Bußgeld bis 30.000 € für den Arbeitgeber (§ 58 JArbSchG).", "Nur ein Bußgeld bis 500 € für den Jugendlichen (§ 59 JArbSchG); die Beschäftigung selbst bleibt zulässig (§ 32 JArbSchG)."], "richtig": 1, "erklaerung": "Verbot der Beschäftigung (§ 32 JArbSchG) und Bußgeld bis 30.000 € für den Arbeitgeber (§ 58 JArbSchG)."}, {"id": 701, "gesetz": "KSchG", "frage": "#0701 Gilt das Kündigungsschutzgesetz (KSchG) für Taxi- und Mietwagenunternehmen?", "antworten": ["Ja, sofern das Unternehmen mehr als zehn Arbeitgeber beschäftigt (§ 23 KSchG).", "Nein, sofern das Unternehmen mehr als zehn Arbeitnehmer beschäftigt (§ 23 KSchG).", "Ja, sofern das Unternehmen mehr als zehn Arbeitnehmer beschäftigt (§ 23 KSchG)."], "richtig": 2, "erklaerung": "Ja, sofern das Unternehmen mehr als zehn Arbeitnehmer beschäftigt (§ 23 KSchG)."}, {"id": 702, "gesetz": "KSchG", "frage": "#0702 Welche besonderen Kündigungsschutzregelungen gibt es für Taxi- und Mietwagenfahrer?", "antworten": ["Das KSchG schützt Unternehmer vor sozial ungerechtfertigten Kündigungen (§ 1 KSchG).", "Das KSchG schützt Fahrer vor sozial ungerechtfertigten Kündigungen (§ 1 KSchG).", "Sie richtet sich nach der Betriebszugehörigkeit des Arbeitnehmers (§ 622 BGB)."], "richtig": 1, "erklaerung": "Das KSchG schützt Fahrer vor sozial ungerechtfertigten Kündigungen (§ 1 KSchG)."}, {"id": 703, "gesetz": "KSchG", "frage": "#0703 Kann ein Taxiunternehmer einen Fahrer ohne Angabe von Gründen kündigen?", "antworten": ["Angeben muss er sie nicht, aber nach sechs Monaten in Betrieben mit mehr als zehn Arbeitnehmern braucht er einen sozial rechtfertigenden Grund (§§ 1, 23 KSchG).", "Ja, ein sozial rechtfertigender Grund ist erst nach zwei Jahren Betriebszugehörigkeit in Betrieben mit mehr als 20 Arbeitnehmern nötig (§§ 1, 23 KSchG).", "Nein, er muss die Gründe stets im Kündigungsschreiben angeben, sonst ist die Kündigung unabhängig von der Betriebsgröße unwirksam (§§ 1, 23 KSchG)."], "richtig": 0, "erklaerung": "Angeben muss er sie nicht, aber nach sechs Monaten in Betrieben mit mehr als zehn Arbeitnehmern braucht er einen sozial rechtfertigenden Grund (§§ 1, 23 KSchG)."}, {"id": 704, "gesetz": "KSchG", "frage": "#0704 Welche Gründe rechtfertigen eine Kündi
