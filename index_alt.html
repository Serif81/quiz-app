den ersten zwölf Monaten, mind. zweimal 30 oder einmal 60 Minuten täglich, ohne Entgeltausfall (§§ 7, 23 MuSchG)."}, {"id": 880, "gesetz": "MuSchG", "frage": "#0880 Dürfen Arbeitgeber den Arbeitsvertrag einer schwangeren Frau anpassen?", "antworten": ["Ja, bei jeder Gefährdung darf er den Vertrag einseitig in Teilzeit umwandeln und das Gehalt entsprechend kürzen (§ 13 MuSchG).", "Bei unverantwortbarer Gefährdung: zuerst Arbeitsbedingungen umgestalten, dann Arbeitsplatzwechsel, zuletzt Beschäftigungsverbot (§ 13 MuSchG).", "Bei Gefährdung ist sofort und ohne Gefährdungsbeurteilung ein Beschäftigungsverbot auszusprechen; Umgestaltung oder Arbeitsplatzwechsel sind unzulässig (§ 13 MuSchG)."], "richtig": 1, "erklaerung": "Bei unverantwortbarer Gefährdung: zuerst Arbeitsbedingungen umgestalten, dann Arbeitsplatzwechsel, zuletzt Beschäftigungsverbot (§ 13 MuSchG)."}, {"id": 901, "gesetz": "SGB IX", "frage": "#0901 Muss ein Taxiunternehmen schwerbehinderte Fahrer einstellen?", "antworten": ["Ja, jedes Taxiunternehmen mit Angestellten muss mindestens einen schwerbehinderten Fahrer einstellen, sonst droht der Widerruf der Genehmigung (§§ 154, 160 SGB IX).", "Nein, keine Pflicht im Einzelfall; Arbeitgeber mit mindestens 20 Arbeitsplätzen müssen aber auf 5 % der Arbeitsplätze schwerbehinderte Menschen beschäftigen oder eine Ausgleichsabgabe zahlen (§§ 154, 160 SGB IX).", "Nein; erst Arbeitgeber mit mindestens 50 Arbeitsplätzen müssen auf 3 % der Arbeitsplätze schwerbehinderte Menschen beschäftigen, eine Ausgleichsabgabe wird seit 2024 nicht mehr erhoben und wurde durch eine Meldepflicht ersetzt (§§ 154, 160 SGB IX)."], "richtig": 1, "erklaerung": "Nein, keine Pflicht im Einzelfall; Arbeitgeber mit mindestens 20 Arbeitsplätzen müssen aber auf 5 % der Arbeitsplätze schwerbehinderte Menschen beschäftigen oder eine Ausgleichsabgabe zahlen (§§ 154, 160 SGB IX)."}, {"id": 902, "gesetz": "SGB IX", "frage": "#0902 Welche Rechte hat ein schwerbehinderter Taxifahrer im Arbeitsverhältnis?", "antworten": ["Er hat Anspruch auf Zusatzurlaub, besonderen Kündigungsschutz und ggf. technische Arbeitshilfen (§§ 164, 168, 208 SGB IX).", "Er hat nur Anspruch auf steuerliche Pauschbeträge; arbeitsrechtliche Sonderrechte bestehen nicht (§§ 164, 168, 208 SGB IX).", "Er hat Anspruch auf doppelten Urlaub, kürzere Arbeitszeit bei vollem Lohn und Befreiung von Nachtfahrten (§§ 164, 168, 208 SGB IX)."], "richtig": 0, "erklaerung": "Er hat Anspruch auf Zusatzurlaub, besonderen Kündigungsschutz und ggf. technische Arbeitshilfen (§§ 164, 168, 208 SGB IX)."}, {"id": 903, "gesetz": "SGB IX", "frage": "#0903 Welche Pflichten hat ein Taxiunternehmen gegenüber schwerbehinderten Beschäftigten?", "antworten": ["Ab 20 Arbeitsplätzen mindestens 5 % der Belegschaft (§ 154 SGB IX).", "Zuschüsse zur Einrichtung eines behindertengerechten Arbeitsplatzes und Lohnkostenzuschüsse (§ 185 SGB IX).", "Es muss ihnen geeignete Arbeitsbedingungen und Unterstützungsmaßnahmen bieten (§ 164 SGB IX)."], "richtig": 2, "erklaerung": "Es muss ihnen geeignete Arbeitsbedingungen und Unterstützungsmaßnahmen bieten (§ 164 SGB IX)."}, {"id": 904, "gesetz": "SGB IX", "frage": "#0904 Kann ein schwerbehinderter Taxifahrer von Nachtfahrten befreit werden?", "antworten": ["Ja, wenn gesundheitliche Einschränkungen vorliegen (§ 164 Abs. 4 SGB IX).", "Nein, wenn gesundheitliche Einschränkungen vorliegen (§ 164 Abs. 4 SGB IX).", "Medizinische Rehabilitation, berufliche Rehabilitation, soziale Teilhabe, Eingliederungshilfe (§ 5 SGB IX)."], "richtig": 0, "erklaerung": "Ja, wenn gesundheitliche Einschränkungen vorliegen (§ 164 Abs. 4 SGB IX)."}, {"id": 905, "gesetz": "SGB IX", "frage": "#0905 Welche besonderen Fördermöglichkeiten gibt es für Taxiunternehmen, die schwerbehinderte Fahrer beschäftigen?", "antworten": ["Zuschüsse zur Einrichtung eines behindertengerechten Arbeitsplatzes und Lohnkostenzuschüsse (§ 185 SGB IX).", "Zuschüsse für die Arbeitsplatzanpassung, Lohnkostenzuschüsse (§ 50 SGB IX).", "Nein, jedoch besteht eine allgemeine Beschäftigungspflicht für Unternehmen mit mehr als 20 Mitarbeitern (§ 154 SGB IX)."], "richtig": 0, "erklaerung": "Zuschüsse zur Einrichtung eines behindertengerechten Arbeitsplatzes und Lohnkostenzuschüsse (§ 185 SGB IX)."}, {"id": 906, "gesetz": "SGB IX", "frage": "#0906 Was regelt das Sozialgesetzbuch Neuntes Buch (SGB IX)?", "antworten": ["Ergänzende unabhängige Teilhabeberatung (EUTB) (§ 32 SGB IX).", "Die Rehabilitation und Teilhabe von Menschen mit Behinderungen am Arbeitsleben und in der Gesellschaft (§ 1 SGB IX).", "Rentenversicherung, Unfallversicherung, Agentur für Arbeit, Integrationsämter und Krankenkassen (§ 6 SGB IX)."], "richtig": 1, "erklaerung": "Die Rehabilitation und Teilhabe von Menschen mit Behinderungen am Arbeitsleben und in der Gesellschaft (§ 1 SGB IX)."}, {"id": 907, "gesetz": "SGB IX", "frage": "#0907 Wer gilt als schwerbehindert im Sinne des SGB IX?", "antworten": ["Sie können Zuschüsse zur Gründung oder Erhaltung ihrer Tätigkeit erhalten (§ 49 SGB IX).", "Ab 20 Arbeitsplätzen mindestens 5 % der Belegschaft (§ 154 SGB IX).", "Personen mit einem Grad der Behinderung (GdB) von mindestens 50 (§ 2 Abs. 2 SGB IX)."], "richtig": 2, "erklaerung": "Personen mit einem Grad der Behinderung (GdB) von mindestens 50 (§ 2 Abs. 2 SGB IX)."}, {"id": 908, "gesetz": "SGB IX", "frage": "#0908 Welche Institutionen sind für die Teilhabeleistungen zuständig?", "antworten": ["Krankenkassen, Agentur für Arbeit, Unfall- und Rentenversicherung, Träger der Sozialen Entschädigung, der Jugendhilfe und der Eingliederungshilfe (§ 6 SGB IX).", "Ausschließlich das Integrationsamt und die Pflegekasse; andere Sozialleistungsträger sind an Teilhabeleistungen nicht beteiligt (§ 6 SGB IX).", "Die Industrie- und Handelskammern, die Gewerbeaufsichtsämter der Länder, die Finanzämter und die Handwerkskammern als gemeinsame Träger der Teilhabe am Arbeitsleben (§ 6 SGB IX)."], "richtig": 0, "erklaerung": "Krankenkassen, Agentur für Arbeit, Unfall- und Rentenversicherung, Träger der Sozialen Entschädigung, der Jugendhilfe und der Eingliederungshilfe (§ 6 SGB IX)."}, {"id": 909, "gesetz": "SGB IX", "frage": "#0909 Welches Ziel verfolgt die berufliche Rehabilitation?", "antworten": ["Medizinische Rehabilitation, berufliche Rehabilitation, soziale Teilhabe, Eingliederungshilfe (§ 5 SGB IX).", "Je nach Fall die Rentenversicherung, Agentur für Arbeit oder Unfallversicherung (§ 6 SGB IX).", "Die Wiederherstellung oder Verbesserung der Erwerbsfähigkeit von Menschen mit Behinderung (§ 49 SGB IX)."], "richtig": 2, "erklaerung": "Die Wiederherstellung oder Verbesserung der Erwerbsfähigkeit von Menschen mit Behinderung (§ 49 SGB IX)."}, {"id": 910, "gesetz": "SGB IX", "frage": "#0910 Welche Arten der Teilhabeleistungen gibt es?", "antworten": ["Ausschließlich medizinische Rehabilitation sowie laufende Geldleistungen wie Pflegegeld, Wohngeld, Kindergeld und Bürgergeld für Menschen mit Behinderung (§ 5 SGB IX).", "Kündigungsschutz, Zusatzurlaub, Ausgleichsabgabe, Nachteilsausgleiche im Steuerrecht und unentgeltliche Beförderung im Nahverkehr (§ 5 SGB IX).", "Medizinische Rehabilitation, Teilhabe am Arbeitsleben, unterhaltssichernde und ergänzende Leistungen, Teilhabe an Bildung, soziale Teilhabe (§ 5 SGB IX)."], "richtig": 2, "erklaerung": "Medizinische Rehabilitation, Teilhabe am Arbeitsleben, unterhaltssichernde und ergänzende Leistungen, Teilhabe an Bildung, soziale Teilhabe (§ 5 SGB IX)."}, {"id": 911, "gesetz": "SGB IX", "frage": "#0911 Ab welcher Betriebsgröße müssen Arbeitgeber schwerbehinderte Menschen beschäftigen?", "antworten": ["Ab jahresdurchschnittlich 20 Arbeitsplätzen auf 5 % der Arbeitsplätze; unter 40 Arbeitsplätzen ein, unter 60 zwei Pflichtplätze (§ 154 Abs. 1 SGB IX).", "Ab jahresdurchschnittlich 10 Arbeitsplätzen auf 3 % der Arbeitsplätze; unter 30 Arbeitsplätzen genügt ein Pflichtplatz, unter 50 genügen zwei (§ 154 Abs. 1 SGB IX).", "Ab jahresdurchschnittlich 50 Arbeitsplätzen auf 6 % der Arbeitsplätze; unter 100 Arbeitsplätzen drei Pflichtplätze (§ 154 Abs. 1 SGB IX)."], "richtig": 0, "erklaerung": "Ab jahresdurchschnittlich 20 Arbeitsplätzen auf 5 % der Arbeitsplätze; unter 40 Arbeitsplätzen ein, unter 60 zwei Pflichtplätze (§ 154 Abs. 1 SGB IX)."}, {"id": 912, "gesetz": "SGB IX", "frage": "#0912 Welche Sanktionen drohen Unternehmen, die die Beschäftigungspflicht nicht erfüllen?", "antworten": ["Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX).", "Arbeitgeber müssen geeignete Maßnahmen zur Beseitigung von Barrieren ergreifen (§ 164 SGB IX).", "Sie müssen eine Ausgleichsabgabe zahlen (§ 160 SGB IX)."], "richtig": 2, "erklaerung": "Sie müssen eine Ausgleichsabgabe zahlen (§ 160 SGB IX)."}, {"id": 913, "gesetz": "SGB IX", "frage": "#0913 Welche Besonderheiten gelten für die Kündigung eines schwerbehinderten Taxifahrers?", "antworten": ["Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX).", "Eine Förderung für Arbeitgeber zur Einstellung von Menschen mit Behinderungen anstelle einer Werkstatt für behinderte Menschen (§ 61 SGB IX).", "Er hat Anspruch auf Zusatzurlaub, besonderen Kündigungsschutz und ggf. technische Hilfsmittel (§ 164 SGB IX)."], "richtig": 0, "erklaerung": "Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX)."}, {"id": 914, "gesetz": "SGB IX", "frage": "#0914 Wie hoch ist der Zusatzurlaub für schwerbehinderte Arbeitnehmer?", "antworten": ["Je nach Fall die Rentenversicherung, Agentur für Arbeit oder Unfallversicherung (§ 6 SGB IX).", "Fünf zusätzliche Arbeitstage pro Jahr (§ 208 SGB IX).", "Zuschüsse für die Arbeitsplatzanpassung, Lohnkostenzuschüsse (§ 50 SGB IX)."], "richtig": 1, "erklaerung": "Fünf zusätzliche Arbeitstage pro Jahr (§ 208 SGB IX)."}, {"id": 915, "gesetz": "SGB IX", "frage": "#0915 Was ist eine Inklusionsvereinbarung?", "antworten": ["Ein Bescheid des Integrationsamts, der den Arbeitgeber zur Einstellung einer bestimmten Zahl schwerbehinderter Menschen verpflichtet und jährlich überprüft wird (§ 166 SGB IX).", "Ein Vertrag zwischen Arbeitgeber und Agentur für Arbeit über die Befreiung von der Ausgleichsabgabe gegen eine Pauschale (§ 166 SGB IX).", "Eine verbindliche Vereinbarung des Arbeitgebers mit Schwerbehindertenvertretung und Betriebsrat zur Eingliederung schwerbehinderter Menschen (§ 166 SGB IX)."], "richtig": 2, "erklaerung": "Eine verbindliche Vereinbarung des Arbeitgebers mit Schwerbehindertenvertretung und Betriebsrat zur Eingliederung schwerbehinderter Menschen (§ 166 SGB IX)."}, {"id": 916, "gesetz": "SGB IX", "frage": "#0916 Welche Maßnahmen der beruflichen Rehabilitation gibt es?", "antworten": ["Ab 20 Arbeitsplätzen mindestens 5 % der Belegschaft (§ 154 SGB IX).", "Umschulungen, Anpassungsqualifikationen, technische Arbeitshilfen, unterstützte Beschäftigung (§ 49 SGB IX).", "Eine freiwillige Vereinbarung zwischen Arbeitgeber und Schwerbehindertenvertretung zur Förderung der Inklusion (§ 166 SGB IX)."], "richtig": 1, "erklaerung": "Umschulungen, Anpassungsqualifikationen, technische Arbeitshilfen, unterstützte Beschäftigung (§ 49 SGB IX)."}, {"id": 917, "gesetz": "SGB IX", "frage": "#0917 Welche finanziellen Hilfen gibt es für Arbeitgeber bei der Einstellung schwerbehinderter Menschen?", "antworten": ["Ein Konzept zur schrittweisen Rückkehr in den Beruf nach längerer Krankheit (§ 44 SGB IX).", "Zuschüsse für die Arbeitsplatzanpassung, Lohnkostenzuschüsse (§ 50 SGB IX).", "Personen mit einem Grad der Behinderung (GdB) von mindestens 50 (§ 2 Abs. 2 SGB IX)."], "richtig": 1, "erklaerung": "Zuschüsse für die Arbeitsplatzanpassung, Lohnkostenzuschüsse (§ 50 SGB IX)."}, {"id": 918, "gesetz": "SGB IX", "frage": "#0918 Welche besonderen Rechte haben schwerbehinderte Auszubildende?", "antworten": ["Sie sind von Berufsschulpflicht und Abschlussprüfung befreit; das Ausbildungsverhältnis ist ohne Zustimmung der IHK unkündbar (§ 50 SGB IX, §§ 64 ff. BBiG).", "Sie haben Anspruch auf behinderungsgerechte Ausbildung (Nachteilsausgleich, ggf. Verlängerung der Ausbildung); Arbeitgeber können Ausbildungszuschüsse erhalten (§ 50 SGB IX, §§ 64 ff. BBiG).", "Sie erhalten automatisch die doppelte Ausbildungsvergütung, die die Agentur für Arbeit erstattet; Prüfungserleichterungen gibt es nicht (§ 50 SGB IX, §§ 64 ff. BBiG)."], "richtig": 1, "erklaerung": "Sie haben Anspruch auf behinderungsgerechte Ausbildung (Nachteilsausgleich, ggf. Verlängerung der Ausbildung); Arbeitgeber können Ausbildungszuschüsse erhalten (§ 50 SGB IX, §§ 64 ff. BBiG)."}, {"id": 919, "gesetz": "SGB IX", "frage": "#0919 Wer ist für die berufliche Rehabilitation zuständig?", "antworten": ["Spezialisierte Dienste, die Menschen mit Behinderungen bei der Arbeitsplatzsuche und -erhaltung unterstützen (§ 192 SGB IX).", "Ergänzende unabhängige Teilhabeberatung (EUTB) (§ 32 SGB IX).", "Je nach Fall die Rentenversicherung, Agentur für Arbeit oder Unfallversicherung (§ 6 SGB IX)."], "richtig": 2, "erklaerung": "Je nach Fall die Rentenversicherung, Agentur für Arbeit oder Unfallversicherung (§ 6 SGB IX)."}, {"id": 920, "gesetz": "SGB IX", "frage": "#0920 Was ist das Budget für Arbeit?", "antworten": ["Ein monatliches persönliches Budget bis 500 € für alle schwerbehinderten Arbeitnehmer zur freien Verwendung, das vom Integrationsamt aus Mitteln der Ausgleichsabgabe gezahlt wird und jährlich neu zu beantragen ist (§ 61 SGB IX).", "Leistung für WfbM-berechtigte Menschen mit Behinderung bei Einstellung auf dem allgemeinen Arbeitsmarkt: Lohnkostenzuschuss an den Arbeitgeber bis 75 % sowie Anleitung und Begleitung (§ 61 SGB IX).", "Prämie für Arbeitgeber, die mehr schwerbehinderte Menschen als vorgeschrieben beschäftigen: Erstattung von 75 % der Ausgleichsabgabe je zusätzlich besetztem Pflichtplatz (§ 61 SGB IX)."], "richtig": 1, "erklaerung": "Leistung für WfbM-berechtigte Menschen mit Behinderung bei Einstellung auf dem allgemeinen Arbeitsmarkt: Lohnkostenzuschuss an den Arbeitgeber bis 75 % sowie Anleitung und Begleitung (§ 61 SGB IX)."}, {"id": 921, "gesetz": "SGB IX", "frage": "#0921 Welche Beratungsangebote gibt es für Menschen mit Behinderungen?", "antworten": ["Ergänzende unabhängige Teilhabeberatung (EUTB) (§ 32 SGB IX).", "Sie müssen frühzeitig Maßnahmen zur Verhinderung von Kündigungen ergreifen (§ 167 SGB IX).", "Die Wiederherstellung oder Verbesserung der Erwerbsfähigkeit von Menschen mit Behinderung (§ 49 SGB IX)."], "richtig": 0, "erklaerung": "Ergänzende unabhängige Teilhabeberatung (EUTB) (§ 32 SGB IX)."}, {"id": 922, "gesetz": "SGB IX", "frage": "#0922 Was sind Integrationsfachdienste?", "antworten": ["Spezialisierte Dienste, die Menschen mit Behinderungen bei der Arbeitsplatzsuche und -erhaltung unterstützen (§ 192 SGB IX).", "Arbeitgeber müssen geeignete Maßnahmen zur Beseitigung von Barrieren ergreifen (§ 164 SGB IX).", "Durch ein ärztliches Gutachten, das vom Versorgungsamt geprüft wird (§ 152 SGB IX)."], "richtig": 0, "erklaerung": "Spezialisierte Dienste, die Menschen mit Behinderungen bei der Arbeitsplatzsuche und -erhaltung unterstützen (§ 192 SGB IX)."}, {"id": 923, "gesetz": "SGB IX", "frage": "#0923 Welche Pflichten haben Arbeitgeber in Bezug auf Prävention?", "antworten": ["Sie müssen frühzeitig Maßnahmen zur Verhinderung von Kündigungen ergreifen (§ 167 SGB IX).", "Die Rehabilitation und Teilhabe von Menschen mit Behinderungen am Arbeitsleben und in der Gesellschaft (§ 1 SGB IX).", "Fünf zusätzliche Arbeitstage pro Jahr (§ 208 SGB IX)."], "richtig": 0, "erklaerung": "Sie müssen frühzeitig Maßnahmen zur Verhinderung von Kündigungen ergreifen (§ 167 SGB IX)."}, {"id": 924, "gesetz": "SGB IX", "frage": "#0924 Was ist eine stufenweise Wiedereingliederung?", "antworten": ["Die Rehabilitation und Teilhabe von Menschen mit Behinderungen am Arbeitsleben und in der Gesellschaft (§ 1 SGB IX).", "Durch ein ärztliches Gutachten, das vom Versorgungsamt geprüft wird (§ 152 SGB IX).", "Ein Konzept zur schrittweisen Rückkehr in den Beruf nach längerer Krankheit (§ 44 SGB IX)."], "richtig": 2, "erklaerung": "Ein Konzept zur schrittweisen Rückkehr in den Beruf nach längerer Krankheit (§ 44 SGB IX)."}, {"id": 925, "gesetz": "SGB IX", "frage": "#0925 Welche Regelungen gibt es zur Barrierefreiheit am Arbeitsplatz?", "antworten": ["Arbeitnehmer müssen geeignete Maßnahmen zur Beseitigung von Barrieren ergreifen (§ 164 SGB IX).", "Arbeitgeber müssen geeignete Maßnahmen zur Beseitigung von Barrieren ergreifen (§ 164 SGB IX).", "Sie müssen frühzeitig Maßnahmen zur Verhinderung von Kündigungen ergreifen (§ 167 SGB IX)."], "richtig": 1, "erklaerung": "Arbeitgeber müssen geeignete Maßnahmen zur Beseitigung von Barrieren ergreifen (§ 164 SGB IX)."}, {"id": 926, "gesetz": "SGB IX", "frage": "#0926 Welche Bedeutung hat die unentgeltliche Beförderung schwerbehinderter Menschen?", "antworten": ["Schwerbehinderte erhalten im Nahverkehr 50 % Ermäßigung; Taxiunternehmer müssen sie gegen Ausweis zum halben Tarif befördern (§ 228 SGB IX).", "Schwerbehinderte mit bestimmten Merkzeichen (z. B. G, aG, H, Gl) werden im öffentlichen Nahverkehr gegen Ausweis mit gültiger Wertmarke unentgeltlich befördert (§ 228 SGB IX).", "Alle Schwerbehinderten ab einem GdB von 50 fahren ohne Wertmarke kostenlos im Taxi und im gesamten Fernverkehr der Bahn, Begleitpersonen zahlen den halben Fahrpreis (§ 228 SGB IX)."], "richtig": 1, "erklaerung": "Schwerbehinderte mit bestimmten Merkzeichen (z. B. G, aG, H, Gl) werden im öffentlichen Nahverkehr gegen Ausweis mit gültiger Wertmarke unentgeltlich befördert (§ 228 SGB IX)."}, {"id": 927, "gesetz": "SGB IX", "frage": "#0927 Welche Unterstützung gibt es für schwerbehinderte Selbstständige?", "antworten": ["Sie können Zuschüsse zur Gründung oder Erhaltung ihrer Tätigkeit erhalten (§ 49 SGB IX).", "Ergänzende unabhängige Teilhabeberatung (EUTB) (§ 32 SGB IX).", "Je nach Fall die Rentenversicherung, Agentur für Arbeit oder Unfallversicherung (§ 6 SGB IX)."], "richtig": 0, "erklaerung": "Sie können Zuschüsse zur Gründung oder Erhaltung ihrer Tätigkeit erhalten (§ 49 SGB IX)."}, {"id": 928, "gesetz": "SGB IX", "frage": "#0928 Was passiert, wenn ein Unternehmen seine Pflichten nach dem SGB IX nicht erfüllt?", "antworten": ["Ausgleichsabgabe bei unbesetzten Pflichtplätzen (§ 160) und Geldbußen bis 10.000 € z. B. bei Verstößen gegen Anzeige- und Unterrichtungspflichten (§ 238 SGB IX).", "Widerruf der Gewerbeerlaubnis durch das Integrationsamt und Freiheitsstrafe bis zu zwei Jahren bei unbesetzten Pflichtplätzen (§ 238 SGB IX).", "Nur eine schriftliche Ermahnung durch die Agentur für Arbeit; eine Ausgleichsabgabe oder Geldbußen sind nicht vorgesehen (§ 160 SGB IX)."], "richtig": 0, "erklaerung": "Ausgleichsabgabe bei unbesetzten Pflichtplätzen (§ 160) und Geldbußen bis 10.000 € z. B. bei Verstößen gegen Anzeige- und Unterrichtungspflichten (§ 238 SGB IX)."}, {"id": 929, "gesetz": "SGB IX", "frage": "#0929 Welche Rechte haben schwerbehinderte Arbeitnehmer in Bezug auf Mehrarbeit?", "antworten": ["Sie können sich von Mehrarbeit befreien lassen (§ 207 SGB IX).", "Personen mit einem Grad der Behinderung (GdB) von mindestens 50 (§ 2 Abs. 2 SGB IX).", "Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX)."], "richtig": 0, "erklaerung": "Sie können sich von Mehrarbeit befreien lassen (§ 207 SGB IX)."}, {"id": 930, "gesetz": "SGB IX", "frage": "#0930 Wie wird der Grad der Behinderung (GdB) festgestellt?", "antworten": ["Die Krankenkasse stellt den GdB von Amts wegen in Fünfergraden fest; ein Antrag ist nicht erforderlich (§ 152 SGB IX).", "Der Hausarzt stellt den GdB in Prozentstufen von 1 bis 100 fest und bescheinigt ihn dem Arbeitgeber (§ 152 SGB IX).", "Auf Antrag stellt die zuständige Behörde (meist Versorgungsamt) den GdB nach Zehnergraden fest (§ 152 SGB IX)."], "richtig": 2, "erklaerung": "Auf Antrag stellt die zuständige Behörde (meist Versorgungsamt) den GdB nach Zehnergraden fest (§ 152 SGB IX)."}, {"id": 951, "gesetz": "TzBfG", "frage": "#0951 Können Taxifahrer in Teilzeit arbeiten?", "antworten": ["Nein, im Taxigewerbe ist Teilzeit wegen der Schichtdienste nur mit Genehmigung der Genehmigungsbehörde und bei mindestens 30 Wochenstunden zulässig (§§ 6, 8 TzBfG).", "Ja, jeder Arbeitnehmer hat ab dem ersten Tag einen uneingeschränkten Anspruch, unabhängig von Betriebsgröße und Gründen (§§ 6, 8 TzBfG).", "Ja, Arbeitnehmer können Teilzeit verlangen, sofern keine betrieblichen Gründe entgegenstehen (Betrieb > 15 Arbeitnehmer, > 6 Monate beschäftigt) (§§ 6, 8 TzBfG)."], "richtig": 2, "erklaerung": "Ja, Arbeitnehmer können Teilzeit verlangen, sofern keine betrieblichen Gründe entgegenstehen (Betrieb > 15 Arbeitnehmer, > 6 Monate beschäftigt) (§§ 6, 8 TzBfG)."}, {"id": 952, "gesetz": "TzBfG", "frage": "#0952 Welche Auswirkungen hat eine Teilzeitbeschäftigung für einen Taxifahrer?", "antworten": ["Er hat nur eingeschränkte Rechte; Urlaub, Zuschläge und Kündigungsschutz stehen ihm erst ab 20 Wochenstunden und sechs Monaten Betriebszugehörigkeit zu (§ 4 Abs. 1 TzBfG).", "Er darf einen niedrigeren Stundenlohn als Vollzeitkräfte erhalten, wenn dies im Arbeitsvertrag vereinbart ist (§ 4 Abs. 1 TzBfG).", "Er hat die gleichen Rechte wie Vollzeitbeschäftigte und darf wegen der Teilzeit nicht schlechter behandelt werden (§ 4 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Er hat die gleichen Rechte wie Vollzeitbeschäftigte und darf wegen der Teilzeit nicht schlechter behandelt werden (§ 4 Abs. 1 TzBfG)."}, {"id": 953, "gesetz": "TzBfG", "frage": "#0953 Darf ein Taxiunternehmen eine Vollzeitstelle nur als solche ausschreiben?", "antworten": ["Nein, Arbeitnehmer müssen prüfen, ob die Stelle auch als Teilzeitstelle angeboten werden kann (§ 7 Abs. 1 TzBfG).", "Nein, Arbeitgeber müssen prüfen, ob die Stelle auch als Teilzeitstelle angeboten werden kann (§ 7 Abs. 1 TzBfG).", "Ja, Arbeitgeber müssen prüfen, ob die Stelle auch als Teilzeitstelle angeboten werden kann (§ 7 Abs. 1 TzBfG)."], "richtig": 1, "erklaerung": "Nein, Arbeitgeber müssen prüfen, ob die Stelle auch als Teilzeitstelle angeboten werden kann (§ 7 Abs. 1 TzBfG)."}, {"id": 954, "gesetz": "TzBfG", "frage": "#0954 Haben Teilzeitbeschäftigte im Taxi- und Mietwagengewerbe Anspruch auf Mehrstunden?", "antworten": ["Nein, und der Arbeitgeber darf einen angezeigten Wunsch nach Mehrstunden bei der Besetzung freier Stellen auch nicht berücksichtigen (§ 9 TzBfG).", "Ja, nach zwölf Monaten in Teilzeit besteht ein Rechtsanspruch auf Aufstockung um bis zu zehn Wochenstunden, auch wenn keine entsprechende freie Stelle vorhanden ist oder der Betriebsrat widerspricht (§ 9 TzBfG).", "Nein, kein direkter Anspruch; wer den Wunsch in Textform angezeigt hat, ist bei der Besetzung eines entsprechenden freien Arbeitsplatzes bevorzugt zu berücksichtigen (§ 9 TzBfG)."], "richtig": 2, "erklaerung": "Nein, kein direkter Anspruch; wer den Wunsch in Textform angezeigt hat, ist bei der Besetzung eines entsprechenden freien Arbeitsplatzes bevorzugt zu berücksichtigen (§ 9 TzBfG)."}, {"id": 955, "gesetz": "TzBfG", "frage": "#0955 Können Taxiunternehmen befristete Arbeitsverträge abschließen?", "antworten": ["Ja, aber nur mit Sachgrund; sachgrundlose Befristungen sind im Personenbeförderungsgewerbe unzulässig, eine Form ist nicht vorgeschrieben (§ 14 TzBfG).", "Ja, mit Sachgrund (z. B. vorübergehender Bedarf, Erprobung) oder ohne Sachgrund bis zu zwei Jahre; die Befristung bedarf der Schriftform (§ 14 TzBfG).", "Ja, ohne Sachgrund bis zu fünf Jahre mit beliebig vielen Verlängerungen; die Befristung kann auch mündlich vereinbart werden (§ 14 TzBfG)."], "richtig": 1, "erklaerung": "Ja, mit Sachgrund (z. B. vorübergehender Bedarf, Erprobung) oder ohne Sachgrund bis zu zwei Jahre; die Befristung bedarf der Schriftform (§ 14 TzBfG)."}, {"id": 956, "gesetz": "TzBfG", "frage": "#0956 Was ist das Ziel des Teilzeit- und Befristungsgesetzes (TzBfG)?", "antworten": ["Die Förderung von Teilzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und unbefristet Beschäftigten (§ 1 TzBfG).", "Die Förderung von Vollzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und befristet Beschäftigten (§ 1 TzBfG).", "Die Förderung von Teilzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und befristet Beschäftigten (§ 1 TzBfG)."], "richtig": 2, "erklaerung": "Die Förderung von Teilzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und befristet Beschäftigten (§ 1 TzBfG)."}, {"id": 957, "gesetz": "TzBfG", "frage": "#0957 Wann gilt ein Arbeitnehmer als teilzeitbeschäftigt?", "antworten": ["Wenn seine regelmäßige Wochenarbeitszeit geringer ist als die eines vergleichbaren Teilzeitbeschäftigten (§ 2 Abs. 1 TzBfG).", "Wenn seine regelmäßige Wochenarbeitszeit geringer ist als die eines vergleichbaren Vollzeitbeschäftigten (§ 2 Abs. 1 TzBfG).", "Ja, der Arbeitgeber muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG)."], "richtig": 1, "erklaerung": "Wenn seine regelmäßige Wochenarbeitszeit geringer ist als die eines vergleichbaren Vollzeitbeschäftigten (§ 2 Abs. 1 TzBfG)."}, {"id": 958, "gesetz": "TzBfG", "frage": "#0958 Wann gilt ein Arbeitnehmer als befristet beschäftigt?", "antworten": ["Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG).", "Die Förderung von Teilzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und befristet Beschäftigten (§ 1 TzBfG).", "Wenn sein Arbeitsvertrag nur für eine bestimmte Zeit oder bis zur Erreichung eines Zwecks geschlossen wurde (§ 3 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Wenn sein Arbeitsvertrag nur für eine bestimmte Zeit oder bis zur Erreichung eines Zwecks geschlossen wurde (§ 3 Abs. 1 TzBfG)."}, {"id": 959, "gesetz": "TzBfG", "frage": "#0959 Welche Schutzmaßnahmen gelten für Teilzeitkräfte?", "antworten": ["Sie dürfen nicht wegen ihrer Vollzeitarbeit benachteiligt werden (§ 4 Abs. 1 TzBfG).", "Wenn der betriebliche Bedarf nur vorübergehend besteht, eine Vertretung erforderlich ist oder eine Erprobung gewünscht wird (§ 14 Abs. 1 TzBfG).", "Sie dürfen nicht wegen ihrer Teilzeitarbeit benachteiligt werden (§ 4 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Sie dürfen nicht wegen ihrer Teilzeitarbeit benachteiligt werden (§ 4 Abs. 1 TzBfG)."}, {"id": 960, "gesetz": "TzBfG", "frage": "#0960 Welche Schutzmaßnahmen gelten für befristet Beschäftigte?", "antworten": ["Sie müssen grundsätzlich die gleichen Arbeitsbedingungen wie unbefristet Beschäftigte haben (§ 4 Abs. 2 TzBfG).", "Sie müssen grundsätzlich die gleichen Arbeitsbedingungen wie ununbefristet Beschäftigte haben (§ 4 Abs. 2 TzBfG).", "Sie müssen grundsätzlich die gleichen Arbeitsbedingungen wie befristet Beschäftigte haben (§ 4 Abs. 2 TzBfG)."], "richtig": 0, "erklaerung": "Sie müssen grundsätzlich die gleichen Arbeitsbedingungen wie unbefristet Beschäftigte haben (§ 4 Abs. 2 TzBfG)."}, {"id": 961, "gesetz": "TzBfG", "frage": "#0961 Muss der Arbeitgeber einen Wunsch auf Teilzeit genehmigen?", "antworten": ["Nein, das liegt allein im freien Ermessen des Arbeitgebers (§ 8 Abs. 4 TzBfG).", "Ja, sofern betriebliche Gründe nicht entgegenstehen (§ 8 Abs. 4 TzBfG).", "Ja, ausnahmslos, sobald der Betriebsrat zugestimmt hat (§ 8 Abs. 4 TzBfG)."], "richtig": 1, "erklaerung": "Ja, sofern betriebliche Gründe nicht entgegenstehen (§ 8 Abs. 4 TzBfG)."}, {"id": 962, "gesetz": "TzBfG", "frage": "#0962 Wie lange muss ein Arbeitnehmer im Betrieb sein, um eine Verringerung seiner Arbeitszeit verlangen zu können?", "antworten": ["Länger als drei Monate; auf die Zahl der Arbeitnehmer im Betrieb kommt es dabei nicht an (§ 8 Abs. 1, 7 TzBfG).", "Länger als sechs Monate; der Arbeitgeber muss in der Regel mehr als 15 Arbeitnehmer beschäftigen (§ 8 Abs. 1, 7 TzBfG).", "Länger als zwölf Monate; der Arbeitgeber muss in der Regel mehr als 20 Arbeitnehmer beschäftigen (§ 8 Abs. 1, 7 TzBfG)."], "richtig": 1, "erklaerung": "Länger als sechs Monate; der Arbeitgeber muss in der Regel mehr als 15 Arbeitnehmer beschäftigen (§ 8 Abs. 1, 7 TzBfG)."}, {"id": 963, "gesetz": "TzBfG", "frage": "#0963 Welche Frist muss ein Arbeitnehmer für den Antrag auf Teilzeit beachten?", "antworten": ["Ja, aber nur unter bestimmten Voraussetzungen, wie z. B. einem vorübergehenden Bedarf oder einer Erprobung (§ 14 TzBfG).", "Ja, der Arbeitgeber muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG).", "Der Antrag muss spätestens drei Monate vor Beginn in Textform gestellt werden (§ 8 Abs. 2 TzBfG)."], "richtig": 2, "erklaerung": "Der Antrag muss spätestens drei Monate vor Beginn in Textform gestellt werden (§ 8 Abs. 2 TzBfG)."}, {"id": 964, "gesetz": "TzBfG", "frage": "#0964 Welche Frist hat der Arbeitgeber für eine Antwort auf den Antrag auf Teilzeit?", "antworten": ["Einen Monat vor dem gewünschten Beginn der Vollzeit (§ 8 Abs. 5 TzBfG).", "Wenn der betriebliche Bedarf nur vorübergehend besteht, eine Vertretung erforderlich ist oder eine Erprobung gewünscht wird (§ 14 Abs. 1 TzBfG).", "Einen Monat vor dem gewünschten Beginn der Teilzeit (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Einen Monat vor dem gewünschten Beginn der Teilzeit (§ 8 Abs. 5 TzBfG)."}, {"id": 965, "gesetz": "TzBfG", "frage": "#0965 Kann der Arbeitgeber eine Teilzeitvereinbarung später rückgängig machen?", "antworten": ["Ja, die Verringerung nach § 8 gilt automatisch nur für zwei Jahre; danach kehrt der Arbeitnehmer zur Vollzeit zurück (§ 8 Abs. 5 TzBfG).", "Ja, der Arbeitgeber kann die Teilzeit jederzeit mit einer Frist von einem Monat einseitig widerrufen, wenn sich der Bedarf ändert oder Schichten neu verteilt werden (§ 8 Abs. 5 TzBfG).", "Nein, die Verringerung nach § 8 ist unbefristet; der Arbeitgeber kann nur die Verteilung der Arbeitszeit unter engen Voraussetzungen ändern (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Nein, die Verringerung nach § 8 ist unbefristet; der Arbeitgeber kann nur die Verteilung der Arbeitszeit unter engen Voraussetzungen ändern (§ 8 Abs. 5 TzBfG)."}, {"id": 966, "gesetz": "TzBfG", "frage": "#0966 Wann ist eine Befristung ohne Sachgrund zulässig?", "antworten": ["Wenn sein Arbeitsvertrag nur für eine bestimmte Zeit oder bis zur Erreichung eines Zwecks geschlossen wurde (§ 3 Abs. 1 TzBfG).", "Ja, wenn ein Arbeitsplatz in Vollzeit frei wird, müssen Teilzeitkräfte bevorzugt berücksichtigt werden (§ 9 TzBfG).", "Bis zu einer Gesamtdauer von zwei Jahren, mit höchstens dreimaliger Verlängerung (§ 14 Abs. 2 TzBfG)."], "richtig": 2, "erklaerung": "Bis zu einer Gesamtdauer von zwei Jahren, mit höchstens dreimaliger Verlängerung (§ 14 Abs. 2 TzBfG)."}, {"id": 967, "gesetz": "TzBfG", "frage": "#0967 Wann ist eine Befristung mit Sachgrund erlaubt?", "antworten": ["Die Arbeitsgerichte (§ 17 TzBfG).", "Wenn der betriebliche Bedarf nur vorübergehend besteht, eine Vertretung erforderlich ist oder eine Erprobung gewünscht wird (§ 14 Abs. 1 TzBfG).", "Der Arbeitgeber muss die Arbeitszeit mindestens vier Tage im Voraus mitteilen (§ 12 Abs. 3 TzBfG)."], "richtig": 1, "erklaerung": "Wenn der betriebliche Bedarf nur vorübergehend besteht, eine Vertretung erforderlich ist oder eine Erprobung gewünscht wird (§ 14 Abs. 1 TzBfG)."}, {"id": 968, "gesetz": "TzBfG", "frage": "#0968 Kann eine Befristung durch Tarifvertrag verlängert werden?", "antworten": ["Ja, Arbeitgeber müssen Teilzeitarbeit ermöglichen, sofern keine betrieblichen Gründe dagegen sprechen (§ 6 TzBfG).", "Ja, die Höchstdauer und die Anzahl der Verlängerungen können tarifvertraglich abweichen (§ 14 Abs. 2 TzBfG).", "Nein, die Höchstdauer und die Anzahl der Verlängerungen können tarifvertraglich abweichen (§ 14 Abs. 2 TzBfG)."], "richtig": 1, "erklaerung": "Ja, die Höchstdauer und die Anzahl der Verlängerungen können tarifvertraglich abweichen (§ 14 Abs. 2 TzBfG)."}, {"id": 969, "gesetz": "TzBfG", "frage": "#0969 Was passiert, wenn eine Befristung unwirksam ist?", "antworten": ["Das Arbeitsverhältnis gilt als befristet (§ 16 TzBfG).", "Das Arbeitsverhältnis gilt als ununbefristet (§ 16 TzBfG).", "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG)."], "richtig": 2, "erklaerung": "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG)."}, {"id": 970, "gesetz": "TzBfG", "frage": "#0970 Welche Frist gilt für eine Klage gegen eine unwirksame Befristung?", "antworten": ["Drei Wochen nach Ende des unbefristeten Arbeitsvertrags (§ 17 TzBfG).", "Drei Wochen nach Ende des befristeten Arbeitsvertrags (§ 17 TzBfG).", "Eine Arbeitsform, bei der der Arbeitnehmer flexibel je nach Arbeitsanfall eingesetzt wird (§ 12 TzBfG)."], "richtig": 1, "erklaerung": "Drei Wochen nach Ende des befristeten Arbeitsvertrags (§ 17 TzBfG)."}, {"id": 971, "gesetz": "TzBfG", "frage": "#0971 Was ist Arbeit auf Abruf?", "antworten": ["Der Arbeitgeber muss die Arbeitszeit mindestens vier Tage im Voraus mitteilen (§ 12 Abs. 3 TzBfG).", "Eine Arbeitsform, bei der der Arbeitgeber flexibel je nach Arbeitsanfall eingesetzt wird (§ 12 TzBfG).", "Eine Arbeitsform, bei der der Arbeitnehmer flexibel je nach Arbeitsanfall eingesetzt wird (§ 12 TzBfG)."], "richtig": 2, "erklaerung": "Eine Arbeitsform, bei der der Arbeitnehmer flexibel je nach Arbeitsanfall eingesetzt wird (§ 12 TzBfG)."}, {"id": 972, "gesetz": "TzBfG", "frage": "#0972 Welche Mindestarbeitszeit gilt bei Arbeit auf Abruf?", "antworten": ["Ist keine wöchentliche Arbeitszeit festgelegt, gelten 40 Stunden als vereinbart; täglich mindestens vier aufeinanderfolgende Stunden (§ 12 Abs. 1 TzBfG).", "Ist keine wöchentliche Arbeitszeit festgelegt, gelten 10 Stunden als vereinbart; täglich mindestens zwei aufeinanderfolgende Stunden (§ 12 Abs. 1 TzBfG).", "Ist keine wöchentliche Arbeitszeit festgelegt, gelten 20 Stunden als vereinbart; täglich mindestens drei aufeinanderfolgende Stunden (§ 12 Abs. 1 TzBfG)."], "richtig": 2, "erklaerung": "Ist keine wöchentliche Arbeitszeit festgelegt, gelten 20 Stunden als vereinbart; täglich mindestens drei aufeinanderfolgende Stunden (§ 12 Abs. 1 TzBfG)."}, {"id": 973, "gesetz": "TzBfG", "frage": "#0973 Welche Ankündigungsfrist gilt bei Arbeit auf Abruf?", "antworten": ["Er hat die gleichen Rechte wie Vollzeitbeschäftigte, darf aber nicht wegen seiner Teilzeit schlechter behandelt werden (§ 4 Abs. 1 TzBfG).", "Der Arbeitnehmer muss die Arbeitszeit mindestens vier Tage im Voraus mitteilen (§ 12 Abs. 3 TzBfG).", "Der Arbeitgeber muss die Arbeitszeit mindestens vier Tage im Voraus mitteilen (§ 12 Abs. 3 TzBfG)."], "richtig": 2, "erklaerung": "Der Arbeitgeber muss die Arbeitszeit mindestens vier Tage im Voraus mitteilen (§ 12 Abs. 3 TzBfG)."}, {"id": 974, "gesetz": "TzBfG", "frage": "#0974 Darf ein Arbeitgeber ein Arbeitsverhältnis kündigen, weil ein Arbeitnehmer nicht in Teilzeit wechseln will?", "antworten": ["Nein, eine Kündigung aus diesem Grund ist unwirksam (§ 11 TzBfG).", "Ja, eine Kündigung aus diesem Grund ist unwirksam (§ 11 TzBfG).", "Ja, Arbeitgeber müssen Teilzeitarbeit ermöglichen, sofern keine betrieblichen Gründe dagegen sprechen (§ 6 TzBfG)."], "richtig": 0, "erklaerung": "Nein, eine Kündigung aus diesem Grund ist unwirksam (§ 11 TzBfG)."}, {"id": 975, "gesetz": "TzBfG", "frage": "#0975 Muss ein Arbeitgeber befristet Beschäftigte über freie unbefristete Stellen informieren?", "antworten": ["Nein, der Arbeitgeber muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG).", "Ja, der Arbeitnehmer muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG).", "Ja, der Arbeitgeber muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG)."], "richtig": 2, "erklaerung": "Ja, der Arbeitgeber muss über unbefristete Arbeitsplätze informieren (§ 18 TzBfG)."}, {"id": 976, "gesetz": "TzBfG", "frage": "#0976 Welche Behörde ist für die Einhaltung des TzBfG zuständig?", "antworten": ["Das Gewerbeaufsichtsamt; es kontrolliert Teilzeit- und Befristungsverträge und verhängt Bußgelder bis 30.000 € (§ 17 TzBfG).", "Die Agentur für Arbeit; befristete Verträge sind ihr binnen zwei Wochen anzuzeigen, sonst gelten sie als unbefristet und es droht ein Bußgeld (§ 17 TzBfG).", "Keine Aufsichtsbehörde; Ansprüche werden vor dem Arbeitsgericht durchgesetzt, z. B. Befristungskontrollklage binnen drei Wochen (§ 17 TzBfG)."], "richtig": 2, "erklaerung": "Keine Aufsichtsbehörde; Ansprüche werden vor dem Arbeitsgericht durchgesetzt, z. B. Befristungskontrollklage binnen drei Wochen (§ 17 TzBfG)."}, {"id": 977, "gesetz": "TzBfG", "frage": "#0977 Welche Sanktionen drohen, wenn ein Arbeitgeber Teilzeitwünsche ignoriert?", "antworten": ["Lehnt der Arbeitgeber nicht binnen einer Woche schriftlich ab, kann der Arbeitnehmer beim Gewerbeaufsichtsamt ein Bußgeld von bis zu 5.000 € gegen ihn beantragen (§ 8 Abs. 5 TzBfG).", "Schweigt der Arbeitgeber, gilt der Antrag als abgelehnt; eine Klage vor dem Arbeitsgericht ist dann ausgeschlossen (§ 8 Abs. 5 TzBfG).", "Lehnt der Arbeitgeber nicht spätestens einen Monat vor Beginn in Textform ab, gilt die Teilzeit als vereinbart; im Übrigen Klage vor dem Arbeitsgericht (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Lehnt der Arbeitgeber nicht spätestens einen Monat vor Beginn in Textform ab, gilt die Teilzeit als vereinbart; im Übrigen Klage vor dem Arbeitsgericht (§ 8 Abs. 5 TzBfG)."}, {"id": 978, "gesetz": "TzBfG", "frage": "#0978 Welche Folgen hat eine unrechtmäßige Befristung?", "antworten": ["Das Arbeitsverhältnis gilt als befristet (§ 16 TzBfG).", "Das Arbeitsverhältnis gilt als ununbefristet (§ 16 TzBfG).", "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG)."], "richtig": 2, "erklaerung": "Das Arbeitsverhältnis gilt als unbefristet (§ 16 TzBfG)."}, {"id": 979, "gesetz": "TzBfG", "frage": "#0979 Kann ein Arbeitnehmer, der in Teilzeit arbeitet, die Rückkehr zur Vollzeit verlangen?", "antworten": ["Nein, kein Rückkehranspruch; er ist aber bei freien Stellen bevorzugt zu berücksichtigen (§ 9). Bei Brückenteilzeit endet die Verringerung automatisch (§ 9a TzBfG).", "Ja, nach jeder Teilzeit besteht nach sechs Monaten ein Rückkehranspruch (§ 9). Bei Brückenteilzeit muss die Rückkehr drei Monate vorher schriftlich gesondert beantragt werden (§ 9a TzBfG).", "Ja, aber nur mit Zustimmung des Betriebsrats (§ 9). Brückenteilzeit kann nur für mindestens fünf Jahre vereinbart werden (§ 9a TzBfG)."], "richtig": 0, "erklaerung": "Nein, kein Rückkehranspruch; er ist aber bei freien Stellen bevorzugt zu berücksichtigen (§ 9). Bei Brückenteilzeit endet die Verringerung automatisch (§ 9a TzBfG)."}, {"id": 980, "gesetz": "TzBfG", "frage": "#0980 Was passiert, wenn ein Arbeitgeber einen Antrag auf Teilzeit nicht rechtzeitig beantwortet?", "antworten": ["Die Vollzeit gilt automatisch als bewilligt (§ 8 Abs. 5 TzBfG).", "Die Förderung von Teilzeitarbeit und die Verhinderung der Diskriminierung von Teilzeit- und befristet Beschäftigten (§ 1 TzBfG).", "Die Teilzeit gilt automatisch als bewilligt (§ 8 Abs. 5 TzBfG)."], "richtig": 2, "erklaerung": "Die Teilzeit gilt automatisch als bewilligt (§ 8 Abs. 5 TzBfG)."}, {"id": 1001, "gesetz": "MiLoG", "frage": "#1001 Gilt das Mindestlohngesetz (MiLoG) für Taxifahrer?", "antworten": ["Ja, alle Arbeitnehmer, einschließlich Taxifahrer, haben Anspruch auf den gesetzlichen Mindestlohn (§ 1 MiLoG).", "Ja, alle Arbeitgeber, einschließlich Taxifahrer, haben Anspruch auf den gesetzlichen Mindestlohn (§ 1 MiLoG).", "Ja, alle Arbeitnehmer, einschließlich TaxiUnternehmer, haben Anspruch auf den gesetzlichen Mindestlohn (§ 1 MiLoG)."], "richtig": 0, "erklaerung": "Ja, alle Arbeitnehmer, einschließlich Taxifahrer, haben Anspruch auf den gesetzlichen Mindestlohn (§ 1 MiLoG)."}, {"id": 1002, "gesetz": "MiLoG", "frage": "#1002 Wie hoch ist der aktuelle gesetzliche Mindestlohn für Taxifahrer?", "antworten": ["Seit 1.1.2026 brutto 13,90 € je Zeitstunde, ab 1.1.2027 14,60 € (§ 1 Abs. 2 MiLoG i. V. m. MiLoV).", "Seit 1.1.2026 brutto 14,60 € je Zeitstunde, ab 1.1.2027 15,00 € (§ 1 Abs. 2 MiLoG i. V. m. MiLoV).", "Seit 1.1.2026 brutto 12,82 € je Zeitstunde, ab 1.1.2027 13,50 € (§ 1 Abs. 2 MiLoG i. V. m. MiLoV)."], "richtig": 0, "erklaerung": "Seit 1.1.2026 brutto 13,90 € je Zeitstunde, ab 1.1.2027 14,60 € (§ 1 Abs. 2 MiLoG i. V. m. MiLoV)."}, {"id": 1003, "gesetz": "MiLoG", "frage": "#1003 Muss ein Taxiunternehmen den Mindestlohn auch bei Provisionslohn zahlen?", "antworten": ["Nein, Kurzarbeitergeld basiert auf einem anderen Berechnungsmodell (§ 96 SGB III).", "Ja, das Einkommen muss mindestens dem gesetzlichen Mindestlohn entsprechen, auch wenn es auf Umsatzprovision basiert (§ 1 Abs. 1 MiLoG).", "Nein, das Einkommen muss mindestens dem gesetzlichen Mindestlohn entsprechen, auch wenn es auf Umsatzprovision basiert (§ 1 Abs. 1 MiLoG)."], "richtig": 1, "erklaerung": "Ja, das Einkommen muss mindestens dem gesetzlichen Mindestlohn entsprechen, auch wenn es auf Umsatzprovision basiert (§ 1 Abs. 1 MiLoG)."}, {"id": 1004, "gesetz": "MiLoG", "frage": "#1004 Darf ein Taxiunternehmer den Mindestlohn durch Trinkgelder ersetzen?", "antworten": ["Ja, Trinkgelder zählen nicht zum Mindestlohn (§ 1 MiLoG).", "Nein, Trinkgelder zählen nicht zum Mindestlohn (§ 1 MiLoG).", "Nein, solche Vereinbarungen sind unwirksam (§ 3 MiLoG)."], "richtig": 1, "erklaerung": "Nein, Trinkgelder zählen nicht zum Mindestlohn (§ 1 MiLoG)."}, {"id": 1005, "gesetz": "MiLoG", "frage": "#1005 Welche Dokumentationspflichten hat ein Taxiunternehmen bezüglich der Arbeitszeiten?", "antworten": ["Beginn, Ende und Dauer der täglichen Arbeitszeit sind bis zum Ablauf des siebten Folgetages aufzuzeichnen und mindestens zwei Jahre aufzubewahren (§ 17 Abs. 1 MiLoG).", "Nur die tägliche Gesamtstundenzahl ist bis zum Monatsende aufzuzeichnen und mindestens sechs Monate aufzubewahren (§ 17 Abs. 1 MiLoG).", "Beginn, Ende und Dauer der Arbeitszeit sind binnen eines Monats handschriftlich in einem gebundenen Heft aufzuzeichnen und nur bis zur nächsten Lohnabrechnung aufzubewahren (§ 17 Abs. 1 MiLoG)."], "richtig": 0, "erklaerung": "Beginn, Ende und Dauer der täglichen Arbeitszeit sind bis zum Ablauf des siebten Folgetages aufzuzeichnen und mindestens zwei Jahre aufzubewahren (§ 17 Abs. 1 MiLoG)."}, {"id": 1006, "gesetz": "MiLoG", "frage": "#1006 Wer hat Anspruch auf den gesetzlichen Mindestlohn?", "antworten": ["Alle Arbeitnehmerinnen und Arbeitnehmer, mit wenigen Ausnahmen (§ 22 MiLoG).", "Alle Arbeitgeberinnen und Arbeitnehmer, mit wenigen Ausnahmen (§ 22 MiLoG).", "Ja, Auftraggeber haften für Verstöße von beauftragten Subunternehmen (§ 13 MiLoG)."], "richtig": 0, "erklaerung": "Alle Arbeitnehmerinnen und Arbeitnehmer, mit wenigen Ausnahmen (§ 22 MiLoG)."}, {"id": 1007, "gesetz": "MiLoG", "frage": "#1007 Welche Ausnahmen vom Mindestlohn gibt es?", "antworten": ["Saisonkräfte, Teilzeitkräfte, Aushilfen, Jugendliche unter 21 Jahren ohne Berufsabschluss sowie Langzeitarbeitslose in den ersten zwölf Monaten der neuen Beschäftigung (§ 22 MiLoG).", "Minijobber, Rentner, Aushilfsfahrer, Studenten sowie alle Beschäftigten in Betrieben mit weniger als zehn Arbeitnehmern (§ 22 MiLoG).", "Auszubildende, Ehrenamtliche, bestimmte Praktikanten, Jugendliche unter 18 ohne Berufsabschluss sowie Langzeitarbeitslose in den ersten sechs Monaten (§ 22 MiLoG)."], "richtig": 2, "erklaerung": "Auszubildende, Ehrenamtliche, bestimmte Praktikanten, Jugendliche unter 18 ohne Berufsabschluss sowie Langzeitarbeitslose in den ersten sechs Monaten (§ 22 MiLoG)."}, {"id": 1008, "gesetz": "MiLoG", "frage": "#1008 Darf ein Arbeitnehmer auf den Mindestlohn verzichten?", "antworten": ["Nein, ein Verzicht ist nur durch gerichtlichen Vergleich möglich, im Übrigen unwirksam; Verwirkung ist ausgeschlossen (§ 3 MiLoG).", "Ja, aber nur während einer Probezeit von bis zu sechs Monaten; danach ist ein Verzicht auch durch Vergleich unwirksam (§ 3 MiLoG).", "Ja, wenn der Verzicht schriftlich vereinbart und vom Arbeitnehmer eigenhändig unterschrieben wurde (§ 3 MiLoG)."], "richtig": 0, "erklaerung": "Nein, ein Verzicht ist nur durch gerichtlichen Vergleich möglich, im Übrigen unwirksam; Verwirkung ist ausgeschlossen (§ 3 MiLoG)."}, {"id": 1009, "gesetz": "MiLoG", "frage": "#1009 Wann muss der Mindestlohn gezahlt werden?", "antworten": ["Der Mindestlohn gilt für sie erst nach sechs Monaten ununterbrochener Beschäftigung (§ 22 Abs. 4 MiLoG).", "Ja, für einige Branchen gelten höhere tarifliche Mindestlöhne (§ 1 Abs. 3 MiLoG).", "Spätestens am letzten Bankarbeitstag des Folgemonats (§ 2 Abs. 1 MiLoG)."], "richtig": 2, "erklaerung": "Spätestens am letzten Bankarbeitstag des Folgemonats (§ 2 Abs. 1 MiLoG)."}, {"id": 1010, "gesetz": "MiLoG", "frage": "#1010 Gilt der Mindestlohn auch für geringfügig Beschäftigte (Minijobs)?", "antworten": ["Ja, wenn sie in Deutschland arbeiten (§ 20 MiLoG).", "Ja, Minijobber haben ebenfalls Anspruch auf den Mindestlohn (§ 22 MiLoG).", "Nein, Minijobber haben ebenfalls Anspruch auf den Mindestlohn (§ 22 MiLoG)."], "richtig": 1, "erklaerung": "Ja, Minijobber haben ebenfalls Anspruch auf den Mindestlohn (§ 22 MiLoG)."}, {"id": 1011, "gesetz": "MiLoG", "frage": "#1011 Welche Behörde ist für die Kontrolle des Mindestlohns zuständig?", "antworten": ["Alle Arbeitnehmerinnen und Arbeitnehmer, mit wenigen Ausnahmen (§ 22 MiLoG).", "Die Zollverwaltung überprüft die Einhaltung des Mindestlohns (§ 14 MiLoG).", "Ja, Ansprüche verjähren in der Regel nach drei Jahren (§ 195 BGB in Verbindung mit § 21 MiLoG)."], "richtig": 1, "erklaerung": "Die Zollverwaltung überprüft die Einhaltung des Mindestlohns (§ 14 MiLoG)."}, {"id": 1012, "gesetz": "MiLoG", "frage": "#1012 Welche Unterlagen müssen Arbeitgeber zur Kontrolle des Mindestlohns bereithalten?", "antworten": ["Arbeitsverträge, Lohnabrechnungen und Arbeitszeitnachweise (§ 17 MiLoG).", "Die Mindestlohnkommission, bestehend aus Arbeitgeber- und Arbeitnehmervertretern (§ 4 MiLoG).", "Alle zwei Jahre auf Vorschlag der Mindestlohnkommission (§ 9 MiLoG)."], "richtig": 0, "erklaerung": "Arbeitsverträge, Lohnabrechnungen und Arbeitszeitnachweise (§ 17 MiLoG)."}, {"id": 1013, "gesetz": "MiLoG", "frage": "#1013 Wie müssen Arbeitszeiten dokumentiert werden?", "antworten": ["Ja, wenn das Praktikum verpflichtend im Rahmen einer Ausbildung oder eines Studiums stattfindet (§ 22 Abs. 1 MiLoG).", "Beginn, Ende und Dauer der täglichen Arbeitszeit müssen bis spätestens zum siebten Folgetag erfasst werden (§ 17 MiLoG).", "Nein, ein Verzicht ist unwirksam (§ 3 MiLoG)."], "richtig": 1, "erklaerung": "Beginn, Ende und Dauer der täglichen Arbeitszeit müssen bis spätestens zum siebten Folgetag erfasst werden (§ 17 MiLoG)."}, {"id": 1014, "gesetz": "MiLoG", "frage": "#1014 Welche Strafen drohen bei Verstößen gegen den Mindestlohn?", "antworten": ["Geldbußen bis 500.000 € bei Nichtzahlung, bis 50.000 € bei Aufzeichnungsverstößen, sonst bis 30.000 € (§ 21 Abs. 3 MiLoG).", "Geldbußen bis 50.000 € bei Nichtzahlung, bis 5.000 € bei Aufzeichnungsverstößen, sonst bis 1.000 € (§ 21 Abs. 3 MiLoG).", "Geldbußen bis 1.000.000 € bei Nichtzahlung, bis 100.000 € bei Aufzeichnungsverstößen, sonst bis 50.000 € (§ 21 Abs. 3 MiLoG)."], "richtig": 0, "erklaerung": "Geldbußen bis 500.000 € bei Nichtzahlung, bis 50.000 € bei Aufzeichnungsverstößen, sonst bis 30.000 € (§ 21 Abs. 3 MiLoG)."}, {"id": 1015, "gesetz": "MiLoG", "frage": "#1015 Kann ein Unternehmen bei Mindestlohnverstößen von öffentlichen Aufträgen ausgeschlossen werden?", "antworten": ["Ja, Unternehmen können von der Vergabe privater Aufträge ausgeschlossen werden (§ 19 MiLoG).", "Nein, Unternehmen können von der Vergabe öffentlicher Aufträge ausgeschlossen werden (§ 19 MiLoG).", "Ja, Unternehmen können von der Vergabe öffentlicher Aufträge ausgeschlossen werden (§ 19 MiLoG)."], "richtig": 2, "erklaerung": "Ja, Unternehmen können von der Vergabe öffentlicher Aufträge ausgeschlossen werden (§ 19 MiLoG)."}, {"id": 1016, "gesetz": "MiLoG", "frage": "#1016 Wer haftet für die Einhaltung des Mindestlohns?", "antworten": ["Der Arbeitnehmer haftet für die korrekte Zahlung des Mindestlohns (§ 20 MiLoG).", "Nein, Trinkgelder zählen nicht zum Mindestlohn (§ 1 MiLoG).", "Der Arbeitgeber haftet für die korrekte Zahlung des Mindestlohns (§ 20 MiLoG)."], "richtig": 2, "erklaerung": "Der Arbeitgeber haftet für die korrekte Zahlung des Mindestlohns (§ 20 MiLoG)."}, {"id": 1017, "gesetz": "MiLoG", "frage": "#1017 Haftet auch ein Auftraggeber, wenn ein Subunternehmer den Mindestlohn nicht zahlt?", "antworten": ["Nein, Auftraggeber haften für Verstöße von beauftragten Subunternehmen (§ 13 MiLoG).", "Ja, Auftraggeber haften für Verstöße von beauftragten Subunternehmen (§ 13 MiLoG).", "Arbeitsverträge, Lohnabrechnungen und Arbeitszeitnachweise (§ 17 MiLoG)."], "richtig": 1, "erklaerung": "Ja, Auftraggeber haften für Verstöße von beauftragten Subunternehmen (§ 13 MiLoG)."}, {"id": 1018, "gesetz": "MiLoG", "frage": "#1018 Gibt es eine Verjährungsfrist für Ansprüche auf Mindestlohn?", "antworten": ["Ja, regelmäßig drei Jahre ab Jahresende; Verwirkung ist ausgeschlossen (§§ 195, 199 BGB, § 3 MiLoG).", "Nein, Mindestlohnansprüche verjähren nie, weil auf sie nicht verzichtet werden kann (§§ 195, 199 BGB, § 3 MiLoG).", "Ja, sechs Monate ab Fälligkeit, danach sind sie verwirkt (§§ 195, 199 BGB, § 3 MiLoG)."], "richtig": 0, "erklaerung": "Ja, regelmäßig drei Jahre ab Jahresende; Verwirkung ist ausgeschlossen (§§ 195, 199 BGB, § 3 MiLoG)."}, {"id": 1019, "gesetz": "MiLoG", "frage": "#1019 Kann der Arbeitgeber vertraglich eine niedrigere Vergütung als den Mindestlohn festlegen?", "antworten": ["Ja, solche Vereinbarungen sind unwirksam (§ 3 MiLoG).", "Arbeitsverträge, Lohnabrechnungen und Arbeitszeitnachweise (§ 17 MiLoG).", "Nein, solche Vereinbarungen sind unwirksam (§ 3 MiLoG)."], "richtig": 2, "erklaerung": "Nein, solche Vereinbarungen sind unwirksam (§ 3 MiLoG)."}, {"id": 1020, "gesetz": "MiLoG", "frage": "#1020 Gilt der Mindestlohn auch bei Kurzarbeit?", "antworten": ["Für tatsächlich geleistete Stunden ja; für ausgefallene Stunden zahlt die Agentur für Arbeit Kurzarbeitergeld, das nicht dem Mindestlohn unterliegt (§ 1 MiLoG, §§ 95 ff. SGB III).", "Ja, der Arbeitgeber muss auch für ausgefallene Stunden den vollen Mindestlohn zahlen; das Kurzarbeitergeld wird angerechnet (§ 1 MiLoG, §§ 95 ff. SGB III).", "Nein, während der Kurzarbeit ist der Mindestlohn ausgesetzt, auch für die tatsächlich geleisteten Stunden; es gilt dann nur das Kurzarbeitergeld der Agentur für Arbeit (§ 1 MiLoG, §§ 95 ff. SGB III)."], "richtig": 0, "erklaerung": "Für tatsächlich geleistete Stunden ja; für ausgefallene Stunden zahlt die Agentur für Arbeit Kurzarbeitergeld, das nicht dem Mindestlohn unterliegt (§ 1 MiLoG, §§ 95 ff. SGB III)."}, {"id": 1021, "gesetz": "MiLoG", "frage": "#1021 Gibt es Branchenmindestlöhne, die über dem gesetzlichen Mindestlohn liegen?", "antworten": ["Ja, für einige Branchen gelten höhere tarifliche Mindestlöhne (§ 1 Abs. 3 MiLoG).", "Nein, für einige Branchen gelten höhere tarifliche Mindestlöhne (§ 1 Abs. 3 MiLoG).", "Nein, solche Vereinbarungen sind unwirksam (§ 3 MiLoG)."], "richtig": 0, "erklaerung": "Ja, für einige Branchen gelten höhere tarifliche Mindestlöhne (§ 1 Abs. 3 MiLoG)."}, {"id": 1022, "gesetz": "MiLoG", "frage": "#1022 Gilt der Mindestlohn auch für Saisonarbeitskräfte?", "antworten": ["Nein, Saisonarbeitskräfte sind für bis zu 70 Arbeitstage im Kalenderjahr vom Mindestlohn ausgenommen, sofern sie aus dem Ausland kommen (§ 22 Abs. 1 MiLoG, § 8 Abs. 1 Nr. 2 SGB IV).", "Ja, uneingeschränkt; bei kurzfristiger Beschäftigung kann lediglich Sozialversicherungsfreiheit bestehen (§ 22 Abs. 1 MiLoG, § 8 Abs. 1 Nr. 2 SGB IV).", "Ja, aber erst ab dem zweiten Monat; im ersten Monat darf er um bis zu 20 % unterschritten werden (§ 22 Abs. 1 MiLoG, § 8 Abs. 1 Nr. 2 SGB IV)."], "richtig": 1, "erklaerung": "Ja, uneingeschränkt; bei kurzfristiger Beschäftigung kann lediglich Sozialversicherungsfreiheit bestehen (§ 22 Abs. 1 MiLoG, § 8 Abs. 1 Nr. 2 SGB IV)."}, {"id": 1023, "gesetz": "MiLoG", "frage": "#1023 Sind Praktikanten vom Mindestlohn ausgenommen?", "antworten": ["Nein, nur Pflichtpraktika sind ausgenommen; freiwillige Praktika sind ab dem ersten Tag mindestlohnpflichtig (§ 22 Abs. 1 MiLoG).", "Ja, bei Pflichtpraktika sowie bei freiwilligen Orientierungs- oder ausbildungsbegleitenden Praktika bis zu drei Monaten (§ 22 Abs. 1 MiLoG).", "Ja, alle Praktikanten sind unabhängig von Art und Dauer des Praktikums vollständig vom Mindestlohn ausgenommen, auch nach dem Studienabschluss (§ 22 Abs. 1 MiLoG)."], "richtig": 1, "erklaerung": "Ja, bei Pflichtpraktika sowie bei freiwilligen Orientierungs- oder ausbildungsbegleitenden Praktika bis zu drei Monaten (§ 22 Abs. 1 MiLoG)."}, {"id": 1024, "gesetz": "MiLoG", "frage": "#1024 Welche Regelung gilt für Langzeitarbeitslose beim Mindestlohn?", "antworten": ["Der Mindestlohn beträgt derzeit 13,90 € pro Stunde (Stand: 2026, § 1 Abs. 2 MiLoG).", "Der Mindestlohn gilt für sie erst nach sechs Monaten ununterbrochener Beschäftigung (§ 22 Abs. 4 MiLoG).", "Der Arbeitgeber haftet für die korrekte Zahlung des Mindestlohns (§ 20 MiLoG)."], "richtig": 1, "erklaerung": "Der Mindestlohn gilt für sie erst nach sechs Monaten ununterbrochener Beschäftigung (§ 22 Abs. 4 MiLoG)."}, {"id": 1025, "gesetz": "MiLoG", "frage": "#1025 Gilt der Mindestlohn auch für ausländische Arbeitnehmer?", "antworten": ["Nein, wenn sie in Deutschland arbeiten (§ 20 MiLoG).", "Ja, wenn sie in Deutschland arbeiten (§ 20 MiLoG).", "Der Mindestlohn beträgt derzeit 13,90 € pro Stunde (Stand: 2026, § 1 Abs. 2 MiLoG)."], "richtig": 1, "erklaerung": "Ja, wenn sie in Deutschland arbeiten (§ 20 MiLoG)."}, {"id": 1026, "gesetz": "MiLoG", "frage": "#1026 Müssen Arbeitgeber bei einer Mindestlohnerhöhung automatisch das Gehalt anpassen?", "antworten": ["Nein, sobald der neue Mindestlohn in Kraft tritt (§ 1 Abs. 2 MiLoG).", "Ja, sobald der neue Mindestlohn in Kraft tritt (§ 1 Abs. 2 MiLoG).", "Ja, wenn sie in Deutschland arbeiten (§ 20 MiLoG)."], "richtig": 1, "erklaerung": "Ja, sobald der neue Mindestlohn in Kraft tritt (§ 1 Abs. 2 MiLoG)."}, {"id": 1027, "gesetz": "MiLoG", "frage": "#1027 Kann der Mindestlohn durch Sachleistungen ersetzt werden?", "antworten": ["Nein, der Mindestlohn ist in Geld zu zahlen; Sachbezüge dürfen den pfändbaren Teil des Arbeitsentgelts nicht übersteigen (§ 107 Abs. 2 GewO).", "Ja, bis zur Hälfte des Mindestlohns, wenn der Arbeitnehmer der Sachleistung schriftlich zugestimmt hat (§ 107 Abs. 2 GewO).", "Ja, Sachleistungen wie die private Nutzung des Taxis können vollständig auf den Mindestlohn angerechnet werden, sofern der Fahrer zustimmt (§ 107 Abs. 2 GewO)."], "richtig": 0, "erklaerung": "Nein, der Mindestlohn ist in Geld zu zahlen; Sachbezüge dürfen den pfändbaren Teil des Arbeitsentgelts nicht übersteigen (§ 107 Abs. 2 GewO)."}, {"id": 1028, "gesetz": "MiLoG", "frage": "#1028 Wie oft wird der Mindestlohn angepasst?", "antworten": ["Ja, das Einkommen muss mindestens dem gesetzlichen Mindestlohn entsprechen, auch wenn es auf Umsatzprovision basiert (§ 1 Abs. 1 MiLoG).", "Ja, Ansprüche verjähren in der Regel nach drei Jahren (§ 195 BGB in Verbindung mit § 21 MiLoG).", "Alle zwei Jahre auf Vorschlag der Mindestlohnkommission (§ 9 MiLoG)."], "richtig": 2, "erklaerung": "Alle zwei Jahre auf Vorschlag der Mindestlohnkommission (§ 9 MiLoG)."}, {"id": 1029, "gesetz": "MiLoG", "frage": "#1029 Wer entscheidet über die Anpassung des Mindestlohns?", "antworten": ["Die Tarifparteien jeder Branche legen ihn eigenständig fest, die IHK erklärt ihn für allgemeinverbindlich (§§ 1 Abs. 2, 4, 11 MiLoG).", "Der Bundestag beschließt die Anpassung jährlich zum 1. Januar durch Bundesgesetz auf Vorschlag der Bundesagentur für Arbeit, der Bundesrat muss zustimmen (§§ 1 Abs. 2, 4, 11 MiLoG).", "Die Mindestlohnkommission (Sozialpartner und Wissenschaft) beschließt, die Bundesregierung setzt die Anpassung per Rechtsverordnung fest (§§ 1 Abs. 2, 4, 11 MiLoG)."], "richtig": 2, "erklaerung": "Die Mindestlohnkommission (Sozialpartner und Wissenschaft) beschließt, die Bundesregierung setzt die Anpassung per Rechtsverordnung fest (§§ 1 Abs. 2, 4, 11 MiLoG)."}, {"id": 1030, "gesetz": "MiLoG", "frage": "#1030 Welche Möglichkeiten hat ein Arbeitnehmer, wenn der Mindestlohn nicht gezahlt wird?", "antworten": ["Er kann sich an den Zoll (Finanzkontrolle Schwarzarbeit) wenden oder Lohnklage beim Arbeitsgericht erheben (§§ 1, 14 MiLoG).", "Er muss zuerst die Genehmigungsbehörde nach dem PBefG einschalten; eine Lohnklage ist erst danach zulässig (§§ 1, 14 MiLoG).", "Er kann sich nur an die IHK wenden, die den Mindestlohn per Bescheid gegenüber dem Arbeitgeber festsetzt (§§ 1, 14 MiLoG)."], "richtig": 0, "erklaerung": "Er kann sich an den Zoll (Finanzkontrolle Schwarzarbeit) wenden oder Lohnklage beim Arbeitsgericht erheben (§§ 1, 14 MiLoG)."}, {"id": 1051, "gesetz": "BVV", "frage": "#1051 Welche Beiträge muss ein Taxiunternehmen für seine Angestellten abführen?", "antworten": ["Nur Beiträge zur Renten- und Arbeitslosenversicherung; Kranken- und Pflegeversicherung zahlen die Fahrer vollständig selbst (§ 28d SGB IV).", "Gesamtsozialversicherungsbeitrag einschließlich der Beiträge zur Berufsgenossenschaft, die je zur Hälfte vom Fahrer getragen und monatlich vom Lohn abgezogen werden (§ 28d SGB IV).", "Gesamtsozialversicherungsbeitrag (Kranken-, Pflege-, Renten-, Arbeitslosenversicherung), Umlagen U1/U2/U3 und Beiträge zur Berufsgenossenschaft (§ 28d SGB IV)."], "richtig": 2, "erklaerung": "Gesamtsozialversicherungsbeitrag (Kranken-, Pflege-, Renten-, Arbeitslosenversicherung), Umlagen U1/U2/U3 und Beiträge zur Berufsgenossenschaft (§ 28d SGB IV)."}, {"id": 1052, "gesetz": "BVV", "frage": "#1052 Wann müssen Taxiunternehmen die Sozialversicherungsbeiträge überweisen?", "antworten": ["Spätestens am letzten Bankarbeitstag des Quartals für alle drei Monate in einer Summe (§ 23 Abs. 1 SGB IV).", "Spätestens am drittletzten Bankarbeitstag des laufenden Monats in voraussichtlicher Höhe der Beitragsschuld (§ 23 Abs. 1 SGB IV).", "Spätestens am 15. des Folgemonats auf Grundlage der tatsächlichen Abrechnung des Vormonats, bei Lastschrift am 20. (§ 23 Abs. 1 SGB IV)."], "richtig": 1, "erklaerung": "Spätestens am drittletzten Bankarbeitstag des laufenden Monats in voraussichtlicher Höhe der Beitragsschuld (§ 23 Abs. 1 SGB IV)."}, {"id": 1053, "gesetz": "BVV", "frage": "#1053 Wie berechnet sich der Gesamtsozialversicherungsbeitrag für einen Taxifahrer?", "antworten": ["Der Beitrag wird auf Grundlage des beitragspflichtigen Arbeitsentgelts berechnet (§ 1 BVV).", "Durch Überweisung oder Lastschrift, Barzahlungen sind nicht zulässig (§ 3 BVV).", "Abhängig von der Beschäftigungsdauer gelten besondere Regelungen (§ 2 BVV)."], "richtig": 0, "erklaerung": "Der Beitrag wird auf Grundlage des beitragspflichtigen Arbeitsentgelts berechnet (§ 1 BVV)."}, {"id": 1054, "gesetz": "BVV", "frage": "#1054 Welche Behörde überwacht die korrekte Abführung von Sozialversicherungsbeiträgen durch Taxiunternehmen?", "antworten": ["Die Einzugsstellen müssen die Beiträge täglich weiterleiten (§ 5 BVV).", "Die Deutsche Rentenversicherung (§ 7 BVV).", "Über pauschale Arbeitgeberbeiträge (§ 9 BVV)."], "richtig": 1, "erklaerung": "Die Deutsche Rentenversicherung (§ 7 BVV)."}, {"id": 1055, "gesetz": "BVV", "frage": "#1055 Was passiert, wenn ein Taxiunternehmen die Sozialversicherungsbeiträge nicht rechtzeitig zahlt?", "antworten": ["Es fallen nur Verzugszinsen von 0,5 % pro Jahr an; Säumniszuschläge sind nicht vorgesehen (§ 24 SGB IV).", "Es fallen Säumniszuschläge von 5 % je angefangener Woche an, zusätzlich ruht die Konzession (§ 24 SGB IV).", "Es fallen Säumniszuschläge von 1 % je angefangenem Monat sowie ggf. Mahngebühren an (§ 24 SGB IV)."], "richtig": 2, "erklaerung": "Es fallen Säumniszuschläge von 1 % je angefangenem Monat sowie ggf. Mahngebühren an (§ 24 SGB IV)."}, {"id": 1056, "gesetz": "BVV", "frage": "#1056 Was regelt die Beitragsverfahrensverordnung (BVV)?", "antworten": ["Es gelten gesonderte Regelungen, abhängig von der Beschäftigungsdauer (§ 2 BVV).", "Geldbußen, Zwangsvollstreckung und strafrechtliche Konsequenzen (§ 12 BVV).", "Die Berechnung, Zahlung, Weiterleitung, Abrechnung und Prüfung des Gesamtsozialversicherungsbeitrags (§ 1 BVV)."], "richtig": 2, "erklaerung": "Die Berechnung, Zahlung, Weiterleitung, Abrechnung und Prüfung des Gesamtsozialversicherungsbeitrags (§ 1 BVV)."}, {"id": 1057, "gesetz": "BVV", "frage": "#1057 Wie wird der Gesamtsozialversicherungsbeitrag berechnet?", "antworten": ["Mindestens sechs Jahre (§ 8 BVV).", "Sozialversicherungsbeiträge zur Kranken-, Renten-, Pflege- und Arbeitslosenversicherung (§ 1 BVV).", "Auf Basis des Arbeitsentgelts bis zur Beitragsbemessungsgrenze (§ 1 Abs. 1 BVV)."], "richtig": 2, "erklaerung": "Auf Basis des Arbeitsentgelts bis zur Beitragsbemessungsgrenze (§ 1 Abs. 1 BVV)."}, {"id": 1058, "gesetz": "BVV", "frage": "#1058 Wie erfolgt die Rundung bei der Beitragsberechnung?", "antworten": ["Arbeitgeber und Arbeitnehmer tragen die Beiträge jeweils zur Hälfte, mit Ausnahme bestimmter Beiträge (§ 2 BVV).", "Das Gesamtergebnis wird auf zwei Dezimalstellen gerundet (§ 1 Abs. 2 BVV).", "Sie dürfen sich über die Ergebnisse informieren und eine Stellungnahme abgeben (§ 7 BVV)."], "richtig": 1, "erklaerung": "Das Gesamtergebnis wird auf zwei Dezimalstellen gerundet (§ 1 Abs. 2 BVV)."}, {"id": 1059, "gesetz": "BVV", "frage": "#1059 Wer trägt die Sozialversicherungsbeiträge?", "antworten": ["Der Arbeitgeber trägt sämtliche Beiträge allein; der Arbeitnehmer zahlt nur Lohnsteuer, Solidaritätszuschlag und den Kinderlosenzuschlag in der Pflegeversicherung (§ 2 BVV, § 249 SGB V).", "Arbeitgeber und Arbeitnehmer tragen die Beiträge grundsätzlich je zur Hälfte, mit Ausnahmen (z. B. Kinderlosenzuschlag in der Pflegeversicherung) (§ 2 BVV, § 249 SGB V).", "Der Arbeitnehmer trägt die Beiträge allein, der Arbeitgeber zahlt nur die Umlagen U1/U2 und den Beitrag zur Berufsgenossenschaft (§ 2 BVV, § 249 SGB V)."], "richtig": 1, "erklaerung": "Arbeitgeber und Arbeitnehmer tragen die Beiträge grundsätzlich je zur Hälfte, mit Ausnahmen (z. B. Kinderlosenzuschlag in der Pflegeversicherung) (§ 2 BVV, § 249 SGB V)."}, {"id": 1060, "gesetz": "BVV", "frage": "#1060 Welche Frist gilt für die Abgabe von Beitragsnachweisen?", "antworten": ["Spätestens zehn Tage nach Fälligkeit der Beiträge (§ 28f Abs. 3 SGB IV, § 26 DEÜV).", "Spätestens zwei Arbeitstage vor Fälligkeit der Beiträge (§ 28f Abs. 3 SGB IV, § 26 DEÜV).", "Bis zum 15. des Folgemonats nach Zahlung der Beiträge schriftlich bei der Krankenkasse (§ 28f Abs. 3 SGB IV, § 26 DEÜV)."], "richtig": 1, "erklaerung": "Spätestens zwei Arbeitstage vor Fälligkeit der Beiträge (§ 28f Abs. 3 SGB IV, § 26 DEÜV)."}, {"id": 1061, "gesetz": "BVV", "frage": "#1061 Wie müssen Sozialversicherungsbeiträge gezahlt werden?", "antworten": ["An die Berufsgenossenschaft, auch in fremder Währung oder per Wechsel, sofern der Gegenwert in Euro gedeckt ist; Barzahlung ist ausgeschlossen (§ 3 BVV).", "Ausschließlich per Lastschrift an das Finanzamt; Überweisung, Scheck und Barzahlung sind nicht zugelassen (§ 3 BVV).", "An die Einzugsstelle per Überweisung, Lastschrift, Scheck oder bar; Zahlungen in fremder Währung und durch Wechsel sind nicht zugelassen (§ 3 BVV)."], "richtig": 2, "erklaerung": "An die Einzugsstelle per Überweisung, Lastschrift, Scheck oder bar; Zahlungen in fremder Währung und durch Wechsel sind nicht zugelassen (§ 3 BVV)."}, {"id": 1062, "gesetz": "BVV", "frage": "#1062 Wie erfolgt die Beitragsweiterleitung durch die Einzugsstellen?", "antworten": ["Die Rentenversicherungsträger (§ 7 BVV).", "Die Einzugsstellen müssen die Beiträge täglich weiterleiten (§ 5 BVV).", "Arbeitgeber und Arbeitnehmer tragen die Beiträge jeweils zur Hälfte, mit Ausnahme bestimmter Beiträge (§ 2 BVV)."], "richtig": 1, "erklaerung": "Die Einzugsstellen müssen die Beiträge täglich weiterleiten (§ 5 BVV)."}, {"id": 1063, "gesetz": "BVV", "frage": "#1063 Wie werden Beitragsnachweise erstellt?", "antworten": ["Die Einzugsstelle erstellt den Beitragsnachweis selbst anhand der Lohnsteueranmeldung beim Finanzamt (§ 28f Abs. 3 SGB IV, § 26 DEÜV).", "Arbeitgeber reichen den Beitragsnachweis quartalsweise in Papierform mit Unterschrift bei der Deutschen Rentenversicherung ein (§ 28f Abs. 3 SGB IV, § 26 DEÜV).", "Arbeitgeber übermitteln den Beitragsnachweis elektronisch aus einem systemgeprüften Programm an die Einzugsstelle (§ 28f Abs. 3 SGB IV, § 26 DEÜV)."], "richtig": 2, "erklaerung": "Arbeitgeber übermitteln den Beitragsnachweis elektronisch aus einem systemgeprüften Programm an die Einzugsstelle (§ 28f Abs. 3 SGB IV, § 26 DEÜV)."}, {"id": 1064, "gesetz": "BVV", "frage": "#1064 Wie lange müssen Beitragsabrechnungen aufbewahrt werden?", "antworten": ["Bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres (§ 28f Abs. 1 SGB IV, § 9 Abs. 5 BVV); steuerliche Fristen bleiben unberührt.", "Bis zum Ende des Kalenderjahres der Beitragszahlung (§ 28f Abs. 1 SGB IV, § 9 Abs. 5 BVV); danach dürfen die Unterlagen vernichtet werden.", "Zwei Jahre ab Ende der Beschäftigung, unabhängig von der letzten Betriebsprüfung (§ 28f Abs. 1 SGB IV, § 9 Abs. 5 BVV); steuerliche Fristen gelten nicht."], "richtig": 0, "erklaerung": "Bis zum Ablauf des auf die letzte Betriebsprüfung folgenden Kalenderjahres (§ 28f Abs. 1 SGB IV, § 9 Abs. 5 BVV); steuerliche Fristen bleiben unberührt."}, {"id": 1065, "gesetz": "BVV", "frage": "#1065 Welche Daten müssen in den Entgeltunterlagen enthalten sein?", "antworten": ["Name, Führerscheinklasse, P-Schein-Nummer, Fahrzeugkennzeichen, Konzessionsnummer und Fahrtenbuch (§ 8 Abs. 1 BVV).", "Name, Geburtsdatum, Anschrift, Beginn und Ende der Beschäftigung, Arbeitsentgelt, Beitragsgruppenschlüssel und Einzugsstelle (§ 8 Abs. 1 BVV).", "Nur Name, Bankverbindung und Nettolohn; Angaben zu Geburtsdatum, Beschäftigungsbeginn oder Einzugsstelle sind nicht erforderlich (§ 8 Abs. 1 BVV)."], "richtig": 1, "erklaerung": "Name, Geburtsdatum, Anschrift, Beginn und Ende der Beschäftigung, Arbeitsentgelt, Beitragsgruppenschlüssel und Einzugsstelle (§ 8 Abs. 1 BVV)."}, {"id": 1066, "gesetz": "BVV", "frage": "#1066 Welche Behörde ist für die Kontrolle der Sozialversicherungsbeiträge zuständig?", "antworten": ["Der Arbeitgeber muss weiterhin Beiträge leisten, auch bei Entgeltfortzahlung (§ 9 BVV).", "Die Rentenversicherungsträger (§ 7 BVV).", "Über pauschale Arbeitgeberbeiträge (§ 9 BVV)."], "richtig": 1, "erklaerung": "Die Rentenversicherungsträger (§ 7 BVV)."}, {"id": 1067, "gesetz": "BVV", "frage": "#1067 Wie oft werden Taxiunternehmen auf ihre Sozialversicherungsbeiträge geprüft?", "antworten": ["Mindestens alle sechs Jahre (§ 28p Abs. 1 SGB IV).", "Mindestens alle zwei Jahre (§ 28p Abs. 1 SGB IV).", "Mindestens alle vier Jahre (§ 28p Abs. 1 SGB IV)."], "richtig": 2, "erklaerung": "Mindestens alle vier Jahre (§ 28p Abs. 1 SGB IV)."}, {"id": 1068, "gesetz": "BVV", "frage": "#1068 Welche Folgen hat eine falsche Beitragsabrechnung?", "antworten": ["Automatischer Widerruf der Taxikonzession durch die Krankenkasse (§§ 24, 28p, 111 SGB IV).", "Nachforderungen per Prüfbescheid, Säumniszuschläge oder Bußgelder (§§ 24, 28p, 111 SGB IV).", "Nur eine formlose Korrekturmeldung, Nachzahlungen fallen nicht an (§§ 24, 28p, 111 SGB IV)."], "richtig": 1, "erklaerung": "Nachforderungen per Prüfbescheid, Säumniszuschläge oder Bußgelder (§§ 24, 28p, 111 SGB IV)."}, {"id": 1069, "gesetz": "BVV", "frage": "#1069 Wie wird die Zahlung von Sozialversicherungsbeiträgen nachgewiesen?", "antworten": ["Durch eine jährliche Bescheinigung des Steuerberaters an die Berufsgenossenschaft (§ 28f Abs. 3 SGB IV); als Zahltag gilt stets der Monatsletzte des Folgemonats, unabhängig vom Eingang (§ 3 BVV).", "Durch Vorlage der Kontoauszüge beim Finanzamt (§ 28f Abs. 3 SGB IV); als Tag der Zahlung gilt der Tag der Auftragserteilung an die Bank (§ 3 BVV).", "Die Beitragshöhe wird per elektronischem Beitragsnachweis gemeldet (§ 28f Abs. 3 SGB IV); als Tag der Zahlung gilt z. B. die Wertstellung bei der Einzugsstelle (§ 3 BVV)."], "richtig": 2, "erklaerung": "Die Beitragshöhe wird per elektronischem Beitragsnachweis gemeldet (§ 28f Abs. 3 SGB IV); als Tag der Zahlung gilt z. B. die Wertstellung bei der Einzugsstelle (§ 3 BVV)."}, {"id": 1070, "gesetz": "BVV", "frage": "#1070 Welche Sanktionen drohen bei Nichtzahlung der Beiträge?", "antworten": ["Säumniszuschläge, aber keine Zwangsvollstreckung ohne vorheriges Gerichtsurteil und keine Strafbarkeit (§ 24 SGB IV, § 266a StGB).", "Nur eine Verwarnung durch die Krankenkasse; eine Strafbarkeit ist ausgeschlossen, solange der Nettolohn gezahlt wird (§ 24 SGB IV, § 266a StGB).", "Säumniszuschläge, Zwangsvollstreckung und Strafbarkeit wegen Vorenthaltens von Arbeitsentgelt (§ 24 SGB IV, § 266a StGB)."], "richtig": 2, "erklaerung": "Säumniszuschläge, Zwangsvollstreckung und Strafbarkeit wegen Vorenthaltens von Arbeitsentgelt (§ 24 SGB IV, § 266a StGB)."}, {"id": 1071, "gesetz": "BVV", "frage": "#1071 Welche Beiträge müssen für Minijobber in Taxiunternehmen gezahlt werden?", "antworten": ["Pauschalbeiträge zur Kranken- und Rentenversicherung, ggf. RV-Eigenanteil des Minijobbers, Umlagen und ggf. Pauschsteuer an die Minijob-Zentrale (§ 249b SGB V, § 172 SGB VI).", "Volle Sozialversicherungsbeiträge wie bei Vollzeitkräften, je zur Hälfte von Arbeitgeber und Minijobber an die Krankenkasse (§ 249b SGB V, § 172 SGB VI).", "Keine Beiträge und keine Umlagen; Minijobs sind vollständig abgabenfrei und nur der Rentenversicherung anzuzeigen (§ 249b SGB V, § 172 SGB VI)."], "richtig": 0, "erklaerung": "Pauschalbeiträge zur Kranken- und Rentenversicherung, ggf. RV-Eigenanteil des Minijobbers, Umlagen und ggf. Pauschsteuer an die Minijob-Zentrale (§ 249b SGB V, § 172 SGB VI)."}, {"id": 1072, "gesetz": "BVV", "frage": "#1072 Wie werden Beiträge für kurzfristige Beschäftigungen berechnet?", "antworten": ["Kurzfristige Beschäftigungen (max. zwei Monate oder 50 Arbeitstage) unterliegen Pauschalbeiträgen von 28 % an die Minijob-Zentrale (§ 8 Abs. 1 Nr. 2 SGB IV).", "Kurzfristige Beschäftigungen (max. sechs Monate oder 120 Arbeitstage im Kalenderjahr) sind voll beitragspflichtig wie Vollzeitstellen, jedoch ohne Umlagen und Unfallversicherung (§ 8 Abs. 1 Nr. 2 SGB IV).", "Kurzfristige Beschäftigungen (max. drei Monate oder 70 Arbeitstage im Kalenderjahr) sind sozialversicherungsfrei; es fallen nur Umlagen und Unfallversicherung an (§ 8 Abs. 1 Nr. 2 SGB IV)."], "richtig": 2, "erklaerung": "Kurzfristige Beschäftigungen (max. drei Monate oder 70 Arbeitstage im Kalenderjahr) sind sozialversicherungsfrei; es fallen nur Umlagen und Unfallversicherung an (§ 8 Abs. 1 Nr. 2 SGB IV)."}, {"id": 1073, "gesetz": "BVV", "frage": "#1073 Wie werden Beiträge bei geringfügig entlohnten Beschäftigten abgerechnet?", "antworten": ["Über Pauschalbeiträge des Arbeitgebers (KV 15 %, RV 13 %) an die Krankenkasse des Beschäftigten (§ 249b SGB V, § 172 Abs. 3 SGB VI).", "Über Pauschalbeiträge des Arbeitnehmers (KV 5 %, RV 10 %) an das Finanzamt (§ 249b SGB V, § 172 Abs. 3 SGB VI).", "Über Pauschalbeiträge des Arbeitgebers (KV 13 %, RV 15 %) an die Minijob-Zentrale (§ 249b SGB V, § 172 Abs. 3 SGB VI)."], "richtig": 2, "erklaerung": "Über Pauschalbeiträge des Arbeitgebers (KV 13 %, RV 15 %) an die Minijob-Zentrale (§ 249b SGB V, § 172 Abs. 3 SGB VI)."}, {"id": 1074, "gesetz": "BVV", "frage": "#1074 Welche Regelung gilt für Beiträge bei Altersteilzeit?", "antworten": ["Der Arbeitgeber ist von Rentenbeiträgen befreit, die Bundesagentur übernimmt sie (§ 3 Abs. 1 Nr. 1 Buchst. b AltTZG; Aufzeichnung nach § 8 Abs. 1 Nr. 12 BVV).", "Der Arbeitnehmer muss die ausgefallenen Rentenbeiträge selbst nachzahlen (§ 3 Abs. 1 Nr. 1 Buchst. b AltTZG; Aufzeichnung nach § 8 Abs. 1 Nr. 12 BVV).", "Der Arbeitgeber muss zusätzliche Beiträge zur Rentenversicherung zahlen (§ 3 Abs. 1 Nr. 1 Buchst. b AltTZG; Aufzeichnung nach § 8 Abs. 1 Nr. 12 BVV)."], "richtig": 2, "erklaerung": "Der Arbeitgeber muss zusätzliche Beiträge zur Rentenversicherung zahlen (§ 3 Abs. 1 Nr. 1 Buchst. b AltTZG; Aufzeichnung nach § 8 Abs. 1 Nr. 12 BVV)."}, {"id": 1075, "gesetz": "BVV", "frage": "#1075 Wie werden Beiträge bei Krankheit eines Arbeitnehmers weitergeführt?", "antworten": ["Ab dem ersten Krankheitstag zahlt die Krankenkasse sämtliche Beiträge; der Arbeitgeber ist für die gesamte AU befreit (§ 3 EntgFG, § 224 SGB V).", "Während der Entgeltfortzahlung (bis sechs Wochen) entfallen alle Beiträge; beim Krankengeld zahlt der Arbeitgeber die vollen Beiträge weiter (§ 3 EntgFG, § 224 SGB V).", "Während der Entgeltfortzahlung (bis sechs Wochen) normal weiter; bei Bezug von Krankengeld entfallen die Arbeitgeberbeiträge (§ 3 EntgFG, § 224 SGB V)."], "richtig": 2, "erklaerung": "Während der Entgeltfortzahlung (bis sechs Wochen) normal weiter; bei Bezug von Krankengeld entfallen die Arbeitgeberbeiträge (§ 3 EntgFG, § 224 SGB V)."}, {"id": 1076, "gesetz": "BVV", "frage": "#1076 Wie erfolgt die Prüfung der Sozialversicherungsbeiträge durch die Rentenversicherung?", "antworten": ["Durch regelmäßige Betriebsprüfungen beim Arbeitnehmer (§ 7 BVV).", "Durch regelmäßige Betriebsprüfungen beim Arbeitgeber (§ 7 BVV).", "Es fallen Säumniszuschläge und ggf. Mahngebühren an (§ 4 BVV)."], "richtig": 1, "erklaerung": "Durch regelmäßige Betriebsprüfungen beim Arbeitgeber (§ 7 BVV)."}, {"id": 1077, "gesetz": "BVV", "frage": "#1077 Welche Besonderheiten gibt es bei Saisonarbeitern?", "antworten": ["Saisonkräfte zahlen bei kurzfristiger Beschäftigung (max. drei Monate) nur die halben Krankenversicherungsbeiträge (§ 8 Abs. 1 Nr. 2 SGB IV).", "Saisonkräfte sind bei kurzfristiger Beschäftigung (max. drei Monate oder 70 Arbeitstage) sozialversicherungsfrei (§ 8 Abs. 1 Nr. 2 SGB IV).", "Saisonkräfte sind bei kurzfristiger Beschäftigung (max. sechs Monate oder 150 Arbeitstage) voll sozialversicherungspflichtig (§ 8 Abs. 1 Nr. 2 SGB IV)."], "richtig": 1, "erklaerung": "Saisonkräfte sind bei kurzfristiger Beschäftigung (max. drei Monate oder 70 Arbeitstage) sozialversicherungsfrei (§ 8 Abs. 1 Nr. 2 SGB IV)."}, {"id": 1078, "gesetz": "BVV", "frage": "#1078 Welche Angaben müssen Arbeitgeber für die Betriebsprüfung bereithalten?", "antworten": ["Der Beitrag wird auf Grundlage des beitragspflichtigen Arbeitsentgelts berechnet (§ 1 BVV).", "Es gelten gesonderte Regelungen, abhängig von der Beschäftigungsdauer (§ 2 BVV).", "Entgeltunterlagen, Beitragsnachweise, Lohnabrechnungen (§ 8 BVV)."], "richtig": 2, "erklaerung": "Entgeltunterlagen, Beitragsnachweise, Lohnabrechnungen (§ 8 BVV)."}, {"id": 1079, "gesetz": "BVV", "frage": "#1079 Wie erfolgt die Tilgung von Beitragsschulden?", "antworten": ["Der Arbeitgeber kann bestimmen, welche Schuld getilgt wird (z. B. vorrangig Arbeitnehmeranteile); sonst gilt: Auslagen, Gebühren, Beiträge, Säumniszuschläge, Zinsen, Bußgelder (§ 4 BVV).", "Die Einzugsstelle bestimmt stets allein die Reihenfolge; der Arbeitgeber hat kein Bestimmungsrecht, getilgt werden zuerst Bußgelder, dann Säumniszuschläge, dann Beiträge (§ 4 BVV).", "Zahlungen werden immer zuerst auf Säumniszuschläge und Zinsen, dann auf Arbeitgeber- und zuletzt auf Arbeitnehmeranteile angerechnet; eine Bestimmung durch den Arbeitgeber ist ausgeschlossen (§ 4 BVV)."], "richtig": 0, "erklaerung": "Der Arbeitgeber kann bestimmen, welche Schuld getilgt wird (z. B. vorrangig Arbeitnehmeranteile); sonst gilt: Auslagen, Gebühren, Beiträge, Säumniszuschläge, Zinsen, Bußgelder (§ 4 BVV)."}, {"id": 1080, "gesetz": "BVV", "frage": "#1080 Welche Rechte haben Arbeitgeber bei Prüfungen?", "antworten": ["Sie dürfen sich über die Ergebnisse informieren und eine Stellungnahme abgeben (§ 7 BVV).", "Es gelten gesonderte Regelungen, abhängig von der Beschäftigungsdauer (§ 2 BVV).", "Arbeitgeber und Arbeitnehmer tragen die Beiträge jeweils zur Hälfte, mit Ausnahme bestimmter Beiträge (§ 2 BVV)."], "richtig": 0, "erklaerung": "Sie dürfen sich über die Ergebnisse informieren und eine Stellungnahme abgeben (§ 7 BVV)."}, {"id": 1101, "gesetz": "DEÜV", "frage": "#1101 Müssen Taxiunternehmen die Sozialversicherungsdaten ihrer Mitarbeiter melden?", "antworten": ["Ja, sie sind verpflichtet, die Meldungen zur Sozialversicherung nach den Vorgaben der DEÜV zu übermitteln (§ 1 DEÜV).", "Spätestens mit der ersten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach Arbeitsbeginn (§ 6 DEÜV).", "Nein, sie sind verpflichtet, die Meldungen zur Sozialversicherung nach den Vorgaben der DEÜV zu übermitteln (§ 1 DEÜV)."], "richtig": 0, "erklaerung": "Ja, sie sind verpflichtet, die Meldungen zur Sozialversicherung nach den Vorgaben der DEÜV zu übermitteln (§ 1 DEÜV)."}, {"id": 1102, "gesetz": "DEÜV", "frage": "#1102 Welche Meldungen sind von Taxiunternehmen für ihre Fahrer notwendig?", "antworten": ["Mindestens alle vier Jahre (§ 33 DEÜV).", "Elektronisch über ein gesichertes Datenübertragungsverfahren (§ 17 DEÜV).", "Anmeldung, Abmeldung, Jahresmeldung und Entgeltmeldungen (§§ 6-12 DEÜV)."], "richtig": 2, "erklaerung": "Anmeldung, Abmeldung, Jahresmeldung und Entgeltmeldungen (§§ 6-12 DEÜV)."}, {"id": 1103, "gesetz": "DEÜV", "frage": "#1103 Bis wann muss die Anmeldung eines neuen Taxifahrers bei der Sozialversicherung erfolgen?", "antworten": ["Spätestens mit der ersten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach Arbeitsbeginn (§ 6 DEÜV).", "Der Verleihbetrieb muss Sozialversicherungsmeldungen vornehmen (§ 3 DEÜV).", "Das Entgelt ist in vollen Beträgen zu melden, Beträge nach dem Komma werden kaufmännisch gerundet (§ 5 Abs. 4 DEÜV)."], "richtig": 0, "erklaerung": "Spätestens mit der ersten Lohnabrechnung, jedoch innerhalb von sechs Wochen nach Arbeitsbeginn (§ 6 DEÜV)."}, {"id": 1104, "gesetz": "DEÜV", "frage": "#1104 Was ist eine Sofortmeldung und gilt sie für Taxiunternehmen?", "antworten": ["Meldung des Beschäftigungsbeginns innerhalb von sechs Wochen an die Krankenkasse; das Taxi- und Mietwagengewerbe ist von der Sofortmeldepflicht ausdrücklich ausgenommen, da es bereits dem PBefG unterliegt (§ 7 DEÜV, § 28a Abs. 4 SGB IV).", "Meldung des Beschäftigungsbeginns spätestens am Folgetag an die Agentur für Arbeit; Pflicht nur für Taxi, nicht für Mietwagen, da diese nicht dem PBefG unterliegen (§ 7 DEÜV, § 28a Abs. 4 SGB IV).", "Meldung des Beschäftigungsbeginns spätestens bei Arbeitsaufnahme an die Datenstelle der Rentenversicherung; Pflicht auch im Personenbeförderungsgewerbe, also für Taxi und Mietwagen (§ 7 DEÜV, § 28a Abs. 4 SGB IV)."], "richtig": 2, "erklaerung": "Meldung des Beschäftigungsbeginns spätestens bei Arbeitsaufnahme an die Datenstelle der Rentenversicherung; Pflicht auch im Personenbeförderungsgewerbe, also für Taxi und Mietwagen (§ 7 DEÜV, § 28a Abs. 4 SGB IV)."}, {"id": 1105, "gesetz": "DEÜV", "frage": "#1105 Welche Meldepflichten bestehen für geringfügig beschäftigte Fahrer (Minijobber) in Taxiunternehmen?", "antworten": ["Sie sind bei der Minijob-Zentrale an- und abzumelden (inkl. Sofortmeldung); ein Antrag auf Befreiung von der Rentenversicherungspflicht ist gesondert zu melden (§§ 5 Abs. 12, 13 DEÜV).", "Minijobber müssen nicht gemeldet werden, sofern sie unter 15 Wochenstunden arbeiten; ein Befreiungsantrag ist beim Finanzamt einzureichen (§§ 5 Abs. 12, 13 DEÜV).", "Sie sind bei ihrer jeweiligen Krankenkasse an- und abzumelden; Sofortmeldungen entfallen bei Minijobbern, die Befreiung von der Rentenversicherung gilt automatisch (§§ 5 Abs. 12, 13 DEÜV)."], "richtig": 0, "erklaerung": "Sie sind bei der Minijob-Zentrale an- und abzumelden (inkl. Sofortmeldung); ein Antrag auf Befreiung von der Rentenversicherungspflicht ist gesondert zu melden (§§ 5 Abs. 12, 13 DEÜV)."}, {"id": 1106, "gesetz": "DEÜV", "frage": "#1106 Was regelt die Datenerfassungs- und -übermittlungsverordnung (DEÜV)?", "antworten": ["Die elektronische Erfassung und Übermittlung von Daten zur Sozialversicherung (§ 1 DEÜV).", "Eine Sofortmeldung muss in bestimmten Branchen bereits am ersten Arbeitstag erfolgen; für das Taxi- und Mietwagengewerbe ist sie jedoch nicht vorgeschrieben (§ 7 DEÜV).", "Sie muss unverzüglich storniert und korrigiert werden (§ 14 DEÜV)."], "richtig": 0, "erklaerung": "Die elektronische Erfassung und Übermittlung von Daten zur Sozialversicherung (§ 1 DEÜV)."}, {"id": 1107, "gesetz": "DEÜV", "frage": "#1107 Wer ist z
