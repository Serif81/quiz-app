gung eines Taxifahrers?", "antworten": ["Drei Wochen nach Zugang der Kündigung (§ 4 KSchG).", "Nach sechs Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als zehn Beschäftigten (§ 1 Abs. 1 KSchG).", "Personenbedingte, verhaltensbedingte oder betriebsbedingte Gründe (§ 1 Abs. 2 KSchG)."], "richtig": 2, "erklaerung": "Personenbedingte, verhaltensbedingte oder betriebsbedingte Gründe (§ 1 Abs. 2 KSchG)."}, {"id": 705, "gesetz": "KSchG", "frage": "#0705 Wie muss eine betriebsbedingte Kündigung in einem Taxiunternehmen begründet werden?", "antworten": ["Der Arbeitgeber muss nur nachweisen, dass er dem Betriebsrat eine Namensliste vorgelegt und die Agentur für Arbeit informiert hat (§ 1 Abs. 3 KSchG).", "Der Arbeitgeber muss dringende betriebliche Erfordernisse, fehlende Weiterbeschäftigungsmöglichkeit und eine korrekte Sozialauswahl nachweisen (§ 1 Abs. 2, 3 KSchG).", "Es genügt, dass der Umsatz des Unternehmens im Vorjahr gesunken ist; eine Sozialauswahl ist nur bei Massenentlassungen erforderlich (§ 1 Abs. 2 KSchG)."], "richtig": 1, "erklaerung": "Der Arbeitgeber muss dringende betriebliche Erfordernisse, fehlende Weiterbeschäftigungsmöglichkeit und eine korrekte Sozialauswahl nachweisen (§ 1 Abs. 2, 3 KSchG)."}, {"id": 706, "gesetz": "KSchG", "frage": "#0706 Wann gilt eine Kündigung als sozial ungerechtfertigt?", "antworten": ["Entlassungen werden erst nach einem Monat wirksam (§ 18 KSchG).", "Wenn sie nicht personen-, verhaltens- oder betriebsbedingt erfolgt (§ 1 Abs. 2 KSchG).", "Ein dringendes betriebliches Erfordernis und eine fehlerfreie Sozialauswahl (§ 1 Abs. 2 KSchG)."], "richtig": 1, "erklaerung": "Wenn sie nicht personen-, verhaltens- oder betriebsbedingt erfolgt (§ 1 Abs. 2 KSchG)."}, {"id": 707, "gesetz": "KSchG", "frage": "#0707 Wann genießt ein Arbeitnehmer Kündigungsschutz nach dem KSchG?", "antworten": ["Nach sechs Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als zehn Beschäftigten (§ 1 Abs. 1 KSchG).", "Ein dringendes betriebliches Erfordernis und eine fehlerfreie Sozialauswahl (§ 1 Abs. 2 KSchG).", "Anzeige bei der Agentur für Arbeit und Beratung mit dem Betriebsrat (§ 17 KSchG)."], "richtig": 0, "erklaerung": "Nach sechs Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als zehn Beschäftigten (§ 1 Abs. 1 KSchG)."}, {"id": 708, "gesetz": "KSchG", "frage": "#0708 Welche Form muss eine Kündigung haben?", "antworten": ["Schriftlich oder in Textform, also auch per E-Mail mit eingescannter Unterschrift; lediglich eine SMS genügt nicht (§ 623 BGB).", "Keine bestimmte Form; auch eine mündliche Kündigung ist wirksam, wenn sie vor einem Zeugen ausgesprochen und protokolliert wird (§ 623 BGB).", "Schriftlich mit eigenhändiger Unterschrift des Arbeitgebers oder eines Bevollmächtigten; E-Mail, Fax oder SMS genügen nicht (§ 623 BGB)."], "richtig": 2, "erklaerung": "Schriftlich mit eigenhändiger Unterschrift des Arbeitgebers oder eines Bevollmächtigten; E-Mail, Fax oder SMS genügen nicht (§ 623 BGB)."}, {"id": 709, "gesetz": "KSchG", "frage": "#0709 Welche Fristen gelten für eine Kündigung durch den Arbeitgeber?", "antworten": ["Grundfrist vier Wochen zum 15. oder Monatsende; danach verlängern sie sich mit der Betriebszugehörigkeit (§ 622 BGB).", "Grundfrist zwei Wochen zum Wochenende; danach verlängern sie sich nur durch tarifvertragliche Regelungen (§ 622 BGB).", "Grundfrist drei Monate zum Quartalsende; die Betriebszugehörigkeit hat auf die Länge der Frist keinen Einfluss (§ 622 BGB)."], "richtig": 0, "erklaerung": "Grundfrist vier Wochen zum 15. oder Monatsende; danach verlängern sie sich mit der Betriebszugehörigkeit (§ 622 BGB)."}, {"id": 710, "gesetz": "KSchG", "frage": "#0710 Wann kann ein Arbeitnehmer gegen eine Kündigung klagen?", "antworten": ["Innerhalb von drei Wochen nach Zugang der Kündigung (§ 4 KSchG).", "Nach sechs Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als zehn Beschäftigten (§ 1 Abs. 1 KSchG).", "Personenbedingte, verhaltensbedingte oder betriebsbedingte Gründe (§ 1 Abs. 2 KSchG)."], "richtig": 0, "erklaerung": "Innerhalb von drei Wochen nach Zugang der Kündigung (§ 4 KSchG)."}, {"id": 711, "gesetz": "KSchG", "frage": "#0711 Welche Arbeitnehmergruppen genießen besonderen Kündigungsschutz?", "antworten": ["Arbeitnehmer über 55 Jahre (§ 10 KSchG), Minijobber (§ 8 SGB IV), Aushilfsfahrer und Fahrer in der Probezeit (§ 622 BGB).", "Schwerbehinderte (§ 168 SGB IX), Schwangere (§ 17 MuSchG), Betriebsratsmitglieder (§ 15 KSchG) und Auszubildende (§ 22 BBiG).", "Schwangere (§ 17 MuSchG), Berufskraftfahrer (§ 15 KSchG), Eltern von Kindern unter 14 (§ 18 BEEG) und Befristete (§ 14 TzBfG)."], "richtig": 1, "erklaerung": "Schwerbehinderte (§ 168 SGB IX), Schwangere (§ 17 MuSchG), Betriebsratsmitglieder (§ 15 KSchG) und Auszubildende (§ 22 BBiG)."}, {"id": 712, "gesetz": "KSchG", "frage": "#0712 Welche Schutzbestimmungen gibt es für schwerbehinderte Taxifahrer?", "antworten": ["Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX).", "Wenn sie nicht personen-, verhaltens- oder betriebsbedingt erfolgt (§ 1 Abs. 2 KSchG).", "Anzeige bei der Agentur für Arbeit und Beratung mit dem Betriebsrat (§ 17 KSchG)."], "richtig": 0, "erklaerung": "Die Kündigung bedarf der Zustimmung des Integrationsamtes (§ 168 SGB IX)."}, {"id": 713, "gesetz": "KSchG", "frage": "#0713 Welche Regelungen gelten für schwangere Arbeitnehmerinnen in Taxiunternehmen?", "antworten": ["Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten und Schwerbehinderung (§ 1 Abs. 3 KSchG).", "Das KSchG schützt Fahrer vor sozial ungerechtfertigten Kündigungen (§ 1 KSchG).", "Sie genießen Kündigungsschutz vom Beginn der Schwangerschaft bis vier Monate nach der Geburt (§ 17 MuSchG)."], "richtig": 2, "erklaerung": "Sie genießen Kündigungsschutz vom Beginn der Schwangerschaft bis vier Monate nach der Geburt (§ 17 MuSchG)."}, {"id": 714, "gesetz": "KSchG", "frage": "#0714 Welche Schutzregelungen gibt es für Betriebsratsmitglieder in Taxiunternehmen?", "antworten": ["Nur ordentlich nach bloßer Anhörung des Betriebsrats; ein nachwirkender Schutz nach Amtsende besteht nicht (§ 15 KSchG, § 102 BetrVG).", "Ordentlich mit doppelter Kündigungsfrist und Zustimmung der Agentur für Arbeit; nachwirkender Schutz drei Monate nach Amtsende (§ 15 KSchG).", "Nur außerordentlich aus wichtigem Grund und mit Zustimmung des Betriebsrats; nachwirkender Schutz ein Jahr nach Amtsende (§ 15 KSchG, § 103 BetrVG)."], "richtig": 2, "erklaerung": "Nur außerordentlich aus wichtigem Grund und mit Zustimmung des Betriebsrats; nachwirkender Schutz ein Jahr nach Amtsende (§ 15 KSchG, § 103 BetrVG)."}, {"id": 715, "gesetz": "KSchG", "frage": "#0715 Welche Regelungen gelten für die Kündigung von Auszubildenden?", "antworten": ["Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten und Schwerbehinderung (§ 1 Abs. 3 KSchG).", "Die Kündigung gilt als wirksam (§ 7 KSchG).", "Eine Kündigung nach der Probezeit ist nur aus wichtigem Grund möglich (§ 22 BBiG)."], "richtig": 2, "erklaerung": "Eine Kündigung nach der Probezeit ist nur aus wichtigem Grund möglich (§ 22 BBiG)."}, {"id": 716, "gesetz": "KSchG", "frage": "#0716 Welche Voraussetzungen müssen für eine betriebsbedingte Kündigung vorliegen?", "antworten": ["Ja, wenn der Arbeitgeber dies anbietet und der Arbeitnehmer keine Kündigungsschutzklage erhebt (§ 1a KSchG).", "Ein dringendes betriebliches Erfordernis und eine fehlerfreie Sozialauswahl (§ 1 Abs. 2 KSchG).", "Wenn sie nicht personen-, verhaltens- oder betriebsbedingt erfolgt (§ 1 Abs. 2 KSchG)."], "richtig": 1, "erklaerung": "Ein dringendes betriebliches Erfordernis und eine fehlerfreie Sozialauswahl (§ 1 Abs. 2 KSchG)."}, {"id": 717, "gesetz": "KSchG", "frage": "#0717 Welche sozialen Kriterien sind bei der Sozialauswahl zu beachten?", "antworten": ["Sie genießen Kündigungsschutz vom Beginn der Schwangerschaft bis vier Monate nach der Geburt (§ 17 MuSchG).", "Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten und Schwerbehinderung (§ 1 Abs. 3 KSchG).", "Nein, wenn das Arbeitsverhältnis länger als sechs Monate besteht und das Unternehmen mehr als zehn Arbeitnehmer hat (§ 1 Abs. 1 KSchG)."], "richtig": 1, "erklaerung": "Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten und Schwerbehinderung (§ 1 Abs. 3 KSchG)."}, {"id": 718, "gesetz": "KSchG", "frage": "#0718 Welche Rolle spielt ein Interessenausgleich bei betriebsbedingten Kündigungen?", "antworten": ["Mit Interessenausgleich entfällt die Sozialauswahl vollständig; die Kündigungen sind gerichtlich nicht mehr überprüfbar (§ 1 Abs. 5 KSchG).", "Er verpflichtet den Arbeitgeber, jedem Gekündigten eine Abfindung von einem Monatsgehalt je Beschäftigungsjahr zu zahlen (§ 1 Abs. 5 KSchG).", "Mit Namensliste wird die Betriebsbedingtheit vermutet; die Sozialauswahl ist nur auf grobe Fehlerhaftigkeit prüfbar (§ 1 Abs. 5 KSchG)."], "richtig": 2, "erklaerung": "Mit Namensliste wird die Betriebsbedingtheit vermutet; die Sozialauswahl ist nur auf grobe Fehlerhaftigkeit prüfbar (§ 1 Abs. 5 KSchG)."}, {"id": 719, "gesetz": "KSchG", "frage": "#0719 Hat ein Arbeitnehmer Anspruch auf eine Abfindung bei betriebsbedingter Kündigung?", "antworten": ["Nur wenn der Arbeitnehmer Kündigungsschutzklage erhebt und mindestens fünf Jahre ununterbrochen im Betrieb beschäftigt war (§ 1a KSchG).", "Grundsätzlich nein; nur wenn der Arbeitgeber im Kündigungsschreiben darauf hinweist und der Arbeitnehmer die Klagefrist verstreichen lässt (§ 1a KSchG).", "Ja, bei jeder betriebsbedingten Kündigung besteht ein gesetzlicher Anspruch auf einen halben Monatsverdienst je Beschäftigungsjahr (§ 1a KSchG)."], "richtig": 1, "erklaerung": "Grundsätzlich nein; nur wenn der Arbeitgeber im Kündigungsschreiben darauf hinweist und der Arbeitnehmer die Klagefrist verstreichen lässt (§ 1a KSchG)."}, {"id": 720, "gesetz": "KSchG", "frage": "#0720 Wie hoch ist die Abfindung nach § 1a KSchG?", "antworten": ["Beim Abfindungsanspruch nach § 1a: 1,0 Monatsverdienste je Beschäftigungsjahr, angefangene Jahre werden stets voll angerechnet (§ 1a Abs. 2 KSchG).", "Beim Abfindungsanspruch nach § 1a: 0,5 Monatsverdienste je Beschäftigungsjahr, mehr als sechs Monate werden aufgerundet (§ 1a Abs. 2 KSchG).", "Beim Abfindungsanspruch nach § 1a: pauschal drei Monatsverdienste, unabhängig von der Dauer des Arbeitsverhältnisses (§ 1a Abs. 2 KSchG)."], "richtig": 1, "erklaerung": "Beim Abfindungsanspruch nach § 1a: 0,5 Monatsverdienste je Beschäftigungsjahr, mehr als sechs Monate werden aufgerundet (§ 1a Abs. 2 KSchG)."}, {"id": 721, "gesetz": "KSchG", "frage": "#0721 Welche Frist gilt für die Erhebung einer Kündigungsschutzklage?", "antworten": ["Sie genießen Kündigungsschutz vom Beginn der Schwangerschaft bis vier Monate nach der Geburt (§ 17 MuSchG).", "Drei Wochen nach Zugang der Kündigung (§ 4 KSchG).", "Die Kündigung gilt als wirksam (§ 7 KSchG)."], "richtig": 1, "erklaerung": "Drei Wochen nach Zugang der Kündigung (§ 4 KSchG)."}, {"id": 722, "gesetz": "KSchG", "frage": "#0722 Was passiert, wenn ein Arbeitnehmer die Klagefrist versäumt?", "antworten": ["Eine Kündigung nach der Probezeit ist nur aus wichtigem Grund möglich (§ 22 BBiG).", "Die Kündigung gilt als wirksam (§ 7 KSchG).", "Wenn eine Weiterbeschäftigung unzumutbar ist (§ 10 KSchG)."], "richtig": 1, "erklaerung": "Die Kündigung gilt als wirksam (§ 7 KSchG)."}, {"id": 723, "gesetz": "KSchG", "frage": "#0723 Kann eine Kündigung auch durch den Betriebsrat verhindert werden?", "antworten": ["Nein; der Betriebsrat muss vor einer Kündigung nicht angehört werden, er wird nur nachträglich über sie unterrichtet (§ 102 BetrVG).", "Nein; ohne Anhörung des Betriebsrats ist sie aber unwirksam, ein Widerspruch begründet nur einen Weiterbeschäftigungsanspruch (§ 102 BetrVG).", "Ja; widerspricht der Betriebsrat fristgerecht, ist die Kündigung automatisch unwirksam, ohne dass das Arbeitsgericht entscheidet, die Anhörung allein reicht nicht aus (§ 102 BetrVG)."], "richtig": 1, "erklaerung": "Nein; ohne Anhörung des Betriebsrats ist sie aber unwirksam, ein Widerspruch begründet nur einen Weiterbeschäftigungsanspruch (§ 102 BetrVG)."}, {"id": 724, "gesetz": "KSchG", "frage": "#0724 Welche Möglichkeiten hat das Arbeitsgericht bei einer unwirksamen Kündigung?", "antworten": ["Feststellung, dass das Arbeitsverhältnis fortbesteht, oder auf Antrag Auflösung gegen Abfindung (§§ 4, 9 KSchG).", "Nur Zuspruch einer Abfindung; eine Feststellung des Fortbestands ist nach Zugang der Kündigung ausgeschlossen (§§ 4, 9 KSchG).", "Verurteilung des Arbeitgebers zu einer Geldbuße oder Anordnung der Versetzung in einen anderen Betrieb (§§ 4, 9 KSchG)."], "richtig": 0, "erklaerung": "Feststellung, dass das Arbeitsverhältnis fortbesteht, oder auf Antrag Auflösung gegen Abfindung (§§ 4, 9 KSchG)."}, {"id": 725, "gesetz": "KSchG", "frage": "#0725 Wann kann das Arbeitsgericht eine Abfindung festlegen?", "antworten": ["Nur in Kleinbetrieben und nur mit Zustimmung des Arbeitgebers; Höhe bis zu 24 (30/36) Monatsverdienste (§§ 9, 10 KSchG).", "Auf Antrag, wenn die Fortsetzung des Arbeitsverhältnisses unzumutbar ist; Höhe bis zu 12 (15/18) Monatsverdienste (§§ 9, 10 KSchG).", "Von Amts wegen bei jeder unwirksamen Kündigung; Höhe pauschal ein halber Monatsverdienst je Beschäftigungsjahr, höchstens jedoch sechs Monatsverdienste (§§ 9, 10 KSchG)."], "richtig": 1, "erklaerung": "Auf Antrag, wenn die Fortsetzung des Arbeitsverhältnisses unzumutbar ist; Höhe bis zu 12 (15/18) Monatsverdienste (§§ 9, 10 KSchG)."}, {"id": 726, "gesetz": "KSchG", "frage": "#0726 Wann ist eine Kündigung anzeigepflichtig?", "antworten": ["Bei Massenentlassungen gemäß § 17 KSchG.", "Personenbedingte, verhaltensbedingte oder betriebsbedingte Gründe (§ 1 Abs. 2 KSchG).", "Wenn eine Weiterbeschäftigung unzumutbar ist (§ 10 KSchG)."], "richtig": 0, "erklaerung": "Bei Massenentlassungen gemäß § 17 KSchG."}, {"id": 727, "gesetz": "KSchG", "frage": "#0727 Welche Arbeitgeberpflichten bestehen bei einer Massenentlassung?", "antworten": ["Anzeige bei der Agentur für Arbeit und Beratung mit dem Betriebsrat (§ 17 KSchG).", "Ja, wenn der Betriebsrat Widerspruch einlegt (§ 102 BetrVG).", "Die Kündigung muss schriftlich erfolgen und eigenhändig vom Arbeitgeber unterschrieben sein (§ 623 BGB, § 2 KSchG)."], "richtig": 0, "erklaerung": "Anzeige bei der Agentur für Arbeit und Beratung mit dem Betriebsrat (§ 17 KSchG)."}, {"id": 728, "gesetz": "KSchG", "frage": "#0728 Welche Sperrfrist gilt bei einer Massenentlassung?", "antworten": ["Entlassungen werden erst nach einem Monat wirksam (§ 18 KSchG).", "Bei Massenentlassungen gemäß § 17 KSchG.", "Ja, wenn der Betriebsrat Widerspruch einlegt (§ 102 BetrVG)."], "richtig": 0, "erklaerung": "Entlassungen werden erst nach einem Monat wirksam (§ 18 KSchG)."}, {"id": 729, "gesetz": "KSchG", "frage": "#0729 Welche Strafen drohen bei Verstößen gegen die Anzeigepflicht?", "antworten": ["Nach sechs Monaten Betriebszugehörigkeit in einem Unternehmen mit mehr als zehn Beschäftigten (§ 1 Abs. 1 KSchG).", "Die Kündigungen sind unwirksam (§ 17 KSchG).", "Anzeige bei der Agentur für Arbeit und Beratung mit dem Betriebsrat (§ 17 KSchG)."], "richtig": 1, "erklaerung": "Die Kündigungen sind unwirksam (§ 17 KSchG)."}, {"id": 730, "gesetz": "KSchG", "frage": "#0730 Wann entfällt die Pflicht zur Massenentlassungsanzeige?", "antworten": ["In Betrieben mit in der Regel höchstens 20 Arbeitnehmern oder wenn die Schwellenwerte der Entlassungen nicht erreicht werden (§ 17 Abs. 1 KSchG).", "Nie; jede betriebsbedingte Kündigung ist unabhängig von Betriebsgröße und Anzahl der Agentur für Arbeit anzuzeigen (§ 17 Abs. 1 KSchG).", "In Betrieben mit in der Regel höchstens 50 Arbeitnehmern oder wenn der Betriebsrat den Entlassungen zugestimmt hat, auch ohne dessen schriftliche Stellungnahme (§ 17 Abs. 1 KSchG)."], "richtig": 0, "erklaerung": "In Betrieben mit in der Regel höchstens 20 Arbeitnehmern oder wenn die Schwellenwerte der Entlassungen nicht erreicht werden (§ 17 Abs. 1 KSchG)."}, {"id": 751, "gesetz": "BUrlG", "frage": "#0751 Haben Taxifahrer Anspruch auf bezahlten Urlaub?", "antworten": ["Nein, jeder Arbeitnehmer hat Anspruch auf bezahlten Erholungsurlaub (§ 1 BUrlG).", "Ja, jeder Arbeitnehmer hat Anspruch auf bezahlten Erholungsurlaub (§ 1 BUrlG).", "Ja, jeder Arbeitgeber hat Anspruch auf bezahlten Erholungsurlaub (§ 1 BUrlG)."], "richtig": 1, "erklaerung": "Ja, jeder Arbeitnehmer hat Anspruch auf bezahlten Erholungsurlaub (§ 1 BUrlG)."}, {"id": 752, "gesetz": "BUrlG", "frage": "#0752 Wie lange beträgt der gesetzliche Mindesturlaub für Taxifahrer?", "antworten": ["Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG).", "Alle Kalendertage außer Sonn- und gesetzliche Feiertage (§ 3 Abs. 2 BUrlG).", "Mindestens 24 Werktage pro Jahr (§ 3 Abs. 1 BUrlG)."], "richtig": 2, "erklaerung": "Mindestens 24 Werktage pro Jahr (§ 3 Abs. 1 BUrlG)."}, {"id": 753, "gesetz": "BUrlG", "frage": "#0753 Welche Tage gelten als Werktage im Sinne des BUrlG?", "antworten": ["Alle Kalendertage außer Sonn- und gesetzlichen Feiertagen (§ 3 Abs. 2 BUrlG).", "Nur Montag bis Freitag, ausgenommen gesetzliche Feiertage (§ 3 Abs. 2 BUrlG).", "Alle Kalendertage einschließlich Sonn- und Feiertagen (§ 3 Abs. 2 BUrlG)."], "richtig": 0, "erklaerung": "Alle Kalendertage außer Sonn- und gesetzlichen Feiertagen (§ 3 Abs. 2 BUrlG)."}, {"id": 754, "gesetz": "BUrlG", "frage": "#0754 Wann erwirbt ein Taxifahrer den vollen Urlaubsanspruch?", "antworten": ["Nach sechs Monaten Betriebszugehörigkeit (§ 4 BUrlG).", "Nein, diese zählt nicht als Urlaub (§ 10 BUrlG).", "Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG)."], "richtig": 0, "erklaerung": "Nach sechs Monaten Betriebszugehörigkeit (§ 4 BUrlG)."}, {"id": 755, "gesetz": "BUrlG", "frage": "#0755 Was passiert mit dem Urlaubsanspruch, wenn ein Taxifahrer vor Ablauf der sechs Monate ausscheidet?", "antworten": ["Es besteht ein Teilurlaubsanspruch von einem Zwölftel pro vollem Monat (§ 5 Abs. 1 BUrlG).", "Der gesetzliche Mindesturlaub kann nicht zuungunsten des Arbeitnehmers verkürzt werden (§ 13 BUrlG).", "Doppelansprüche sind ausgeschlossen, der bisherige Arbeitgeber muss eine Bescheinigung ausstellen (§ 6 BUrlG)."], "richtig": 0, "erklaerung": "Es besteht ein Teilurlaubsanspruch von einem Zwölftel pro vollem Monat (§ 5 Abs. 1 BUrlG)."}, {"id": 756, "gesetz": "BUrlG", "frage": "#0756 Wer hat Anspruch auf Urlaub nach dem BUrlG?", "antworten": ["Es besteht ein Teilurlaubsanspruch von einem Zwölftel pro vollem Monat (§ 5 Abs. 1 BUrlG).", "Alle Arbeitgeber, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG).", "Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG)."], "richtig": 2, "erklaerung": "Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG)."}, {"id": 757, "gesetz": "BUrlG", "frage": "#0757 Darf ein Arbeitgeber bereits gewährten Urlaub zurückfordern?", "antworten": ["Nein; scheidet der Arbeitnehmer aus und hat er zu viel Urlaub erhalten, kann das Urlaubsentgelt nicht zurückgefordert werden (§ 5 Abs. 3 BUrlG).", "Ja; scheidet der Arbeitnehmer in der ersten Jahreshälfte aus, muss er zu viel erhaltenes Urlaubsentgelt vollständig zurückzahlen (§ 5 Abs. 3 BUrlG).", "Ja, aber nur, wenn der Arbeitnehmer im Urlaub erkrankt ist und die Erkrankung nicht unverzüglich gemeldet hat (§ 9 BUrlG)."], "richtig": 0, "erklaerung": "Nein; scheidet der Arbeitnehmer aus und hat er zu viel Urlaub erhalten, kann das Urlaubsentgelt nicht zurückgefordert werden (§ 5 Abs. 3 BUrlG)."}, {"id": 758, "gesetz": "BUrlG", "frage": "#0758 Was passiert mit dem Urlaubsanspruch bei einem Arbeitgeberwechsel?", "antworten": ["Doppelansprüche sind ausgeschlossen, der bisherige Arbeitgeber muss eine Bescheinigung ausstellen (§ 6 BUrlG).", "Arbeitnehmer haben Anspruch auf anteiligen Urlaub gemäß § 5 Abs. 1 BUrlG.", "Doppelansprüche sind ausgeschlossen, der bisherige Arbeitnehmer muss eine Bescheinigung ausstellen (§ 6 BUrlG)."], "richtig": 0, "erklaerung": "Doppelansprüche sind ausgeschlossen, der bisherige Arbeitgeber muss eine Bescheinigung ausstellen (§ 6 BUrlG)."}, {"id": 759, "gesetz": "BUrlG", "frage": "#0759 Welche Fristen gelten für die Übertragung des Urlaubs auf das nächste Jahr?", "antworten": ["Im Kalenderjahr; Übertragung auch ohne besonderen Grund bis 30. Juni des Folgejahres, danach Verfall automatisch und ohne Hinweis des Arbeitgebers (§ 7 Abs. 3 BUrlG).", "Urlaub kann beliebig angespart werden und verfällt erst mit Ablauf der dreijährigen Regelverjährung (§ 7 Abs. 3 BUrlG, § 195 BGB).", "Im Kalenderjahr; Übertragung bei dringenden betrieblichen oder persönlichen Gründen bis 31. März; Verfall nur nach Hinweis des Arbeitgebers (§ 7 Abs. 3 BUrlG)."], "richtig": 2, "erklaerung": "Im Kalenderjahr; Übertragung bei dringenden betrieblichen oder persönlichen Gründen bis 31. März; Verfall nur nach Hinweis des Arbeitgebers (§ 7 Abs. 3 BUrlG)."}, {"id": 760, "gesetz": "BUrlG", "frage": "#0760 Was passiert mit nicht genommenem Urlaub bei Beendigung des Arbeitsverhältnisses?", "antworten": ["Er muss in Geld abgegolten werden (§ 7 Abs. 4 BUrlG).", "Nach dem durchschnittlichen Verdienst der letzten 13 Wochen vor Urlaubsbeginn, ohne Überstunden (§ 11 Abs. 1 BUrlG).", "Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG)."], "richtig": 0, "erklaerung": "Er muss in Geld abgegolten werden (§ 7 Abs. 4 BUrlG)."}, {"id": 761, "gesetz": "BUrlG", "frage": "#0761 Wer entscheidet über den Zeitpunkt des Urlaubs?", "antworten": ["Der Arbeitgeber unter Berücksichtigung der Wünsche des Arbeitnehmers, sofern keine dringenden betrieblichen Gründe entgegenstehen (§ 7 Abs. 1 BUrlG).", "Der Arbeitgeber unter Berücksichtigung der Wünsche des Arbeitgebers, sofern keine dringenden betrieblichen Gründe entgegenstehen (§ 7 Abs. 1 BUrlG).", "Der Arbeitnehmer unter Berücksichtigung der Wünsche des Arbeitnehmers, sofern keine dringenden betrieblichen Gründe entgegenstehen (§ 7 Abs. 1 BUrlG)."], "richtig": 0, "erklaerung": "Der Arbeitgeber unter Berücksichtigung der Wünsche des Arbeitnehmers, sofern keine dringenden betrieblichen Gründe entgegenstehen (§ 7 Abs. 1 BUrlG)."}, {"id": 762, "gesetz": "BUrlG", "frage": "#0762 Muss der Urlaub zusammenhängend genommen werden?", "antworten": ["Nein; der Arbeitnehmer kann den Urlaub frei in einzelne Tage aufteilen, ohne dass ein Teil eine Mindestdauer haben muss (§ 7 Abs. 2 BUrlG).", "Ja; eine Teilung ist nur mit Zustimmung des Betriebsrats zulässig, wobei ein Teil mindestens sechs Werktage umfassen muss, die übrigen Tage sind frei verteilbar (§ 7 Abs. 2 BUrlG).", "Grundsätzlich ja; wird er aus dringenden Gründen geteilt, muss ein Teil mindestens zwölf aufeinanderfolgende Werktage umfassen (§ 7 Abs. 2 BUrlG)."], "richtig": 2, "erklaerung": "Grundsätzlich ja; wird er aus dringenden Gründen geteilt, muss ein Teil mindestens zwölf aufeinanderfolgende Werktage umfassen (§ 7 Abs. 2 BUrlG)."}, {"id": 763, "gesetz": "BUrlG", "frage": "#0763 Kann ein Arbeitgeber den Urlaub verweigern?", "antworten": ["Nein, wenn dringende betriebliche Gründe oder vorrangige Urlaubswünsche anderer Arbeitnehmer bestehen (§ 7 Abs. 1 BUrlG).", "Ja, wenn dringende betriebliche Gründe oder vorrangige Urlaubswünsche anderer Arbeitnehmer bestehen (§ 7 Abs. 1 BUrlG).", "Ja, wenn dringende betriebliche Gründe oder vorrangige Urlaubswünsche anderer Arbeitgeber bestehen (§ 7 Abs. 1 BUrlG)."], "richtig": 1, "erklaerung": "Ja, wenn dringende betriebliche Gründe oder vorrangige Urlaubswünsche anderer Arbeitnehmer bestehen (§ 7 Abs. 1 BUrlG)."}, {"id": 764, "gesetz": "BUrlG", "frage": "#0764 Darf ein Taxifahrer während des Urlaubs arbeiten?", "antworten": ["Nein, jede dem Urlaubszweck widersprechende Erwerbstätigkeit ist verboten (§ 8 BUrlG).", "Ja, jeder Arbeitnehmer hat Anspruch auf bezahlten Erholungsurlaub (§ 1 BUrlG).", "Ja, jede dem Urlaubszweck widersprechende Erwerbstätigkeit ist verboten (§ 8 BUrlG)."], "richtig": 0, "erklaerung": "Nein, jede dem Urlaubszweck widersprechende Erwerbstätigkeit ist verboten (§ 8 BUrlG)."}, {"id": 765, "gesetz": "BUrlG", "frage": "#0765 Was passiert, wenn ein Taxifahrer während des Urlaubs krank wird?", "antworten": ["Ja, Tarifverträge können spezifische Urlaubsregelungen festlegen (§ 13 Abs. 2 BUrlG).", "Die durch ärztliches Attest nachgewiesenen Krankheitstage werden nicht auf den Urlaub angerechnet (§ 9 BUrlG).", "Es gelten besondere Regelungen für Urlaubsentgelt (§ 12 BUrlG)."], "richtig": 1, "erklaerung": "Die durch ärztliches Attest nachgewiesenen Krankheitstage werden nicht auf den Urlaub angerechnet (§ 9 BUrlG)."}, {"id": 766, "gesetz": "BUrlG", "frage": "#0766 Wie wird das Urlaubsentgelt berechnet?", "antworten": ["Nach dem durchschnittlichen Verdienst der letzten 14 Wochen vor Urlaubsbeginn, ohne Überstunden (§ 11 Abs. 1 BUrlG).", "Nach dem durchschnittlichen Verdienst der letzten 12 Wochen vor Urlaubsbeginn, ohne Überstunden (§ 11 Abs. 1 BUrlG).", "Nach dem durchschnittlichen Verdienst der letzten 13 Wochen vor Urlaubsbeginn, ohne Überstunden (§ 11 Abs. 1 BUrlG)."], "richtig": 2, "erklaerung": "Nach dem durchschnittlichen Verdienst der letzten 13 Wochen vor Urlaubsbeginn, ohne Überstunden (§ 11 Abs. 1 BUrlG)."}, {"id": 767, "gesetz": "BUrlG", "frage": "#0767 Wann muss das Urlaubsentgelt ausgezahlt werden?", "antworten": ["Urlaub muss im laufenden Kalenderjahr genommen werden; eine Übertragung ist nur bei dringenden Gründen bis zum 31. März möglich (§ 7 Abs. 3 BUrlG).", "Mindestens 24 Werktage pro Jahr (§ 3 Abs. 1 BUrlG).", "Vor Urlaubsantritt (§ 11 Abs. 2 BUrlG)."], "richtig": 2, "erklaerung": "Vor Urlaubsantritt (§ 11 Abs. 2 BUrlG)."}, {"id": 768, "gesetz": "BUrlG", "frage": "#0768 Darf der Arbeitgeber während des Urlaubs eine Maßnahme der medizinischen Vorsorge anrechnen?", "antworten": ["Nein, diese zählt nicht als Urlaub (§ 10 BUrlG).", "Die durch ärztliches Attest nachgewiesenen Krankheitstage werden nicht auf den Urlaub angerechnet (§ 9 BUrlG).", "Ja, diese zählt nicht als Urlaub (§ 10 BUrlG)."], "richtig": 0, "erklaerung": "Nein, diese zählt nicht als Urlaub (§ 10 BUrlG)."}, {"id": 769, "gesetz": "BUrlG", "frage": "#0769 Was gilt für Arbeitnehmer in Heimarbeit bezüglich des Urlaubs?", "antworten": ["Es gelten besondere Regelungen für Urlaubsentgelt (§ 12 BUrlG).", "Alle Kalendertage außer Sonn- und gesetzliche Feiertage (§ 3 Abs. 2 BUrlG).", "Bußgelder und arbeitsrechtliche Konsequenzen (§ 15 BUrlG)."], "richtig": 0, "erklaerung": "Es gelten besondere Regelungen für Urlaubsentgelt (§ 12 BUrlG)."}, {"id": 770, "gesetz": "BUrlG", "frage": "#0770 Kann von den Bestimmungen des BUrlG durch Tarifverträge abgewichen werden?", "antworten": ["Ja, auch zuungunsten der Arbeitnehmer, außer bei §§ 1, 2 und 3 Abs. 1 (Mindesturlaub); Einzelverträge nur zugunsten (§ 13 Abs. 1 BUrlG).", "Nein, weder durch Tarifvertrag noch durch Einzelvertrag darf von irgendeiner Bestimmung des BUrlG abgewichen werden (§ 13 Abs. 1 BUrlG).", "Ja, Tarif- und Einzelverträge dürfen auch den Mindesturlaub kürzen, wenn dafür eine Abgeltung in Geld gezahlt wird (§ 13 Abs. 1 BUrlG)."], "richtig": 0, "erklaerung": "Ja, auch zuungunsten der Arbeitnehmer, außer bei §§ 1, 2 und 3 Abs. 1 (Mindesturlaub); Einzelverträge nur zugunsten (§ 13 Abs. 1 BUrlG)."}, {"id": 771, "gesetz": "BUrlG", "frage": "#0771 Welche Behörde überwacht die Einhaltung des BUrlG?", "antworten": ["Keine; das BUrlG sieht keine behördliche Überwachung vor, Ansprüche werden vor dem Arbeitsgericht durchgesetzt.", "Die Finanzkontrolle Schwarzarbeit des Zolls, die den Urlaub zusammen mit den Arbeitszeitaufzeichnungen prüft und Bußgelder verhängt.", "Das Gewerbeaufsichtsamt; es prüft die Urlaubslisten jährlich und kann bei Verstößen Anordnungen erlassen."], "richtig": 0, "erklaerung": "Keine; das BUrlG sieht keine behördliche Überwachung vor, Ansprüche werden vor dem Arbeitsgericht durchgesetzt."}, {"id": 772, "gesetz": "BUrlG", "frage": "#0772 Welche Sanktionen drohen bei Verstößen gegen das BUrlG?", "antworten": ["Keine Bußgelder; der Arbeitnehmer kann Urlaub, Urlaubsentgelt oder Abgeltung vor dem Arbeitsgericht einklagen, ggf. Schadensersatz.", "Bußgelder bis 15.000 € durch das Gewerbeaufsichtsamt; bei wiederholten Verstößen kann die Taxikonzession widerrufen werden.", "Freiheitsstrafe bis zu einem Jahr bei vorsätzlicher Urlaubsverweigerung; einklagbare Ansprüche des Arbeitnehmers bestehen daneben nicht."], "richtig": 0, "erklaerung": "Keine Bußgelder; der Arbeitnehmer kann Urlaub, Urlaubsentgelt oder Abgeltung vor dem Arbeitsgericht einklagen, ggf. Schadensersatz."}, {"id": 773, "gesetz": "BUrlG", "frage": "#0773 Wie kann ein Arbeitnehmer gegen verweigerten Urlaub vorgehen?", "antworten": ["Er darf den Urlaub eigenmächtig antreten, wenn er ihn zwei Wochen vorher schriftlich angekündigt hat (§ 7 Abs. 1 BUrlG).", "Er kann den Anspruch beim Arbeitsgericht einklagen, in Eilfällen per einstweiliger Verfügung (§ 7 Abs. 1 BUrlG, § 2 ArbGG).", "Er muss zunächst Beschwerde bei der IHK einlegen, die über den Urlaubsantrag verbindlich entscheidet (§ 7 Abs. 1 BUrlG, § 2 ArbGG)."], "richtig": 1, "erklaerung": "Er kann den Anspruch beim Arbeitsgericht einklagen, in Eilfällen per einstweiliger Verfügung (§ 7 Abs. 1 BUrlG, § 2 ArbGG)."}, {"id": 774, "gesetz": "BUrlG", "frage": "#0774 Welche Auswirkungen hat eine unzulässige Kürzung des Urlaubs durch den Arbeitgeber?", "antworten": ["Sie ist wirksam, der Arbeitnehmer erhält aber eine Abgeltung in Geld (§§ 1, 3, 13 BUrlG).", "Sie wird wirksam, wenn der Arbeitnehmer nicht binnen drei Wochen widerspricht (§§ 1, 3, 13 BUrlG).", "Sie ist unwirksam, und der volle Urlaubsanspruch bleibt bestehen (§§ 1, 3, 13 BUrlG)."], "richtig": 2, "erklaerung": "Sie ist unwirksam, und der volle Urlaubsanspruch bleibt bestehen (§§ 1, 3, 13 BUrlG)."}, {"id": 775, "gesetz": "BUrlG", "frage": "#0775 Welche Bedeutung hat die sogenannte „Unabdingbarkeit“ des Urlaubsanspruchs?", "antworten": ["Der gesetzliche Mindesturlaub kann nicht zuungunsten des Arbeitgebers verkürzt werden (§ 13 BUrlG).", "Alle Arbeitnehmer, einschließlich Auszubildende und arbeitnehmerähnliche Personen (§ 2 BUrlG).", "Der gesetzliche Mindesturlaub kann nicht zuungunsten des Arbeitnehmers verkürzt werden (§ 13 BUrlG)."], "richtig": 2, "erklaerung": "Der gesetzliche Mindesturlaub kann nicht zuungunsten des Arbeitnehmers verkürzt werden (§ 13 BUrlG)."}, {"id": 776, "gesetz": "BUrlG", "frage": "#0776 Gibt es Sonderregelungen für das Baugewerbe und ähnliche Branchen?", "antworten": ["Ja, Tarifverträge können spezifische Urlaubsregelungen festlegen (§ 13 Abs. 2 BUrlG).", "Nein, jede dem Urlaubszweck widersprechende Erwerbstätigkeit ist verboten (§ 8 BUrlG).", "Nein, Tarifverträge können spezifische Urlaubsregelungen festlegen (§ 13 Abs. 2 BUrlG)."], "richtig": 0, "erklaerung": "Ja, Tarifverträge können spezifische Urlaubsregelungen festlegen (§ 13 Abs. 2 BUrlG)."}, {"id": 777, "gesetz": "BUrlG", "frage": "#0777 Wie wird der Urlaub bei kurzfristiger Beschäftigung geregelt?", "antworten": ["Der gesetzliche Mindesturlaub kann nicht zuungunsten des Arbeitnehmers verkürzt werden (§ 13 BUrlG).", "Arbeitnehmer haben Anspruch auf anteiligen Urlaub gemäß § 5 Abs. 1 BUrlG.", "Arbeitgeber haben Anspruch auf anteiligen Urlaub gemäß § 5 Abs. 1 BUrlG."], "richtig": 1, "erklaerung": "Arbeitnehmer haben Anspruch auf anteiligen Urlaub gemäß § 5 Abs. 1 BUrlG."}, {"id": 778, "gesetz": "BUrlG", "frage": "#0778 Kann ein einmal genehmigter Urlaub durch den Arbeitgeber widerrufen werden?", "antworten": ["Nein, eine Rücknahme ist nicht unzulässig (§ 7 BUrlG).", "Nein, eine Rücknahme ist nicht zulässig (§ 7 BUrlG).", "Ja, eine Rücknahme ist nicht zulässig (§ 7 BUrlG)."], "richtig": 1, "erklaerung": "Nein, eine Rücknahme ist nicht zulässig (§ 7 BUrlG)."}, {"id": 779, "gesetz": "BUrlG", "frage": "#0779 Welche Regelung gilt für den Fall, dass ein Arbeitnehmer nach einer Kündigung bereits mehr Urlaub erhalten hat als ihm zustand?", "antworten": ["Der Arbeitgeber unter Berücksichtigung der Wünsche des Arbeitnehmers, sofern keine dringenden betrieblichen Gründe entgegenstehen (§ 7 Abs. 1 BUrlG).", "Eine Rückforderung des zu viel gezahlten Urlaubsentgelts ist nicht möglich (§ 5 Abs. 3 BUrlG).", "Mindestens 24 Werktage pro Jahr (§ 3 Abs. 1 BUrlG)."], "richtig": 1, "erklaerung": "Eine Rückforderung des zu viel gezahlten Urlaubsentgelts ist nicht möglich (§ 5 Abs. 3 BUrlG)."}, {"id": 780, "gesetz": "BUrlG", "frage": "#0780 Kann ein Arbeitnehmer nach Ende des Arbeitsverhältnisses seinen Resturlaub noch nehmen?", "antworten": ["Ja, der Resturlaub muss abgegolten werden (§ 7 Abs. 4 BUrlG).", "Mindestens 24 Werktage pro Jahr (§ 3 Abs. 1 BUrlG).", "Nein, der Resturlaub muss abgegolten werden (§ 7 Abs. 4 BUrlG)."], "richtig": 2, "erklaerung": "Nein, der Resturlaub muss abgegolten werden (§ 7 Abs. 4 BUrlG)."}, {"id": 801, "gesetz": "EntgFG", "frage": "#0801 Haben Taxifahrer Anspruch auf Entgeltfortzahlung im Krankheitsfall?", "antworten": ["Nein, sie haben Anspruch auf bis zu sechs Wochen Entgeltfortzahlung durch den Arbeitgeber (§ 3 Abs. 1 EntgFG).", "Ja, sie haben Anspruch auf bis zu sechs Wochen Entgeltfortzahlung durch den Arbeitnehmer (§ 3 Abs. 1 EntgFG).", "Ja, sie haben Anspruch auf bis zu sechs Wochen Entgeltfortzahlung durch den Arbeitgeber (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Ja, sie haben Anspruch auf bis zu sechs Wochen Entgeltfortzahlung durch den Arbeitgeber (§ 3 Abs. 1 EntgFG)."}, {"id": 802, "gesetz": "EntgFG", "frage": "#0802 Ab wann besteht der Anspruch auf Entgeltfortzahlung für einen angestellten Taxifahrer?", "antworten": ["Nach vier Wochen ununterbrochener Dauer des Arbeitsverhältnisses (§ 3 Abs. 3 EntgFG).", "Er muss dem Arbeitgeber die Arbeitsunfähigkeit unverzüglich mitteilen und nach drei Tagen eine ärztliche Bescheinigung vorlegen (§ 5 Abs. 1 EntgFG).", "Er muss seinen Arbeitgeber und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG)."], "richtig": 0, "erklaerung": "Nach vier Wochen ununterbrochener Dauer des Arbeitsverhältnisses (§ 3 Abs. 3 EntgFG)."}, {"id": 803, "gesetz": "EntgFG", "frage": "#0803 Wie hoch ist das fortzuzahlende Entgelt für Taxifahrer im Krankheitsfall?", "antworten": ["Nur der vertraglich vereinbarte Grundlohn ohne Umsatzanteil, höchstens jedoch 70 % des letzten Bruttoverdienstes der vergangenen drei Monate (§ 4 Abs. 1, 1a EntgFG).", "Das Entgelt, das bei regelmäßiger Arbeitszeit angefallen wäre; bei Umsatzlohn der erzielbare Durchschnittsverdienst (§ 4 Abs. 1, 1a EntgFG).", "Der gesetzliche Mindestlohn für die im Vormonat tatsächlich gefahrenen Stunden, unabhängig vom Umsatzlohn (§ 4 Abs. 1, 1a EntgFG)."], "richtig": 1, "erklaerung": "Das Entgelt, das bei regelmäßiger Arbeitszeit angefallen wäre; bei Umsatzlohn der erzielbare Durchschnittsverdienst (§ 4 Abs. 1, 1a EntgFG)."}, {"id": 804, "gesetz": "EntgFG", "frage": "#0804 Erhält ein Taxifahrer während der Probezeit Entgeltfortzahlung bei Krankheit?", "antworten": ["Nein, während einer Probezeit von bis zu sechs Monaten zahlt ausschließlich die Krankenkasse Krankengeld (§ 3 Abs. 3 EntgFG).", "Ja, ab dem ersten Arbeitstag ohne jede Wartezeit, sofern die Arbeitsunfähigkeit ärztlich festgestellt wurde und die Krankenkasse informiert ist (§ 3 Abs. 3 EntgFG).", "Ja, sobald das Arbeitsverhältnis vier Wochen ununterbrochen besteht; die Probezeit schließt den Anspruch nicht aus (§ 3 Abs. 3 EntgFG)."], "richtig": 2, "erklaerung": "Ja, sobald das Arbeitsverhältnis vier Wochen ununterbrochen besteht; die Probezeit schließt den Anspruch nicht aus (§ 3 Abs. 3 EntgFG)."}, {"id": 805, "gesetz": "EntgFG", "frage": "#0805 Welche Verpflichtung hat ein Taxifahrer bei Krankmeldung?", "antworten": ["Nur die Krankenkasse informieren, die den Arbeitgeber benachrichtigt; eine ärztliche Feststellung ist erst ab der zweiten Krankheitswoche nötig (§ 5 EntgFG).", "Unverzüglich Arbeitsunfähigkeit und Dauer mitteilen; ab dem 4. Kalendertag AU ärztlich feststellen lassen (eAU), Privatversicherte Bescheinigung vorlegen (§ 5 EntgFG).", "Spätestens nach drei Tagen schriftlich melden; ab dem 7. Kalendertag eine AU-Bescheinigung per Post an den Arbeitgeber senden, auch Kassenpatienten trotz vorliegender eAU (§ 5 EntgFG)."], "richtig": 1, "erklaerung": "Unverzüglich Arbeitsunfähigkeit und Dauer mitteilen; ab dem 4. Kalendertag AU ärztlich feststellen lassen (eAU), Privatversicherte Bescheinigung vorlegen (§ 5 EntgFG)."}, {"id": 806, "gesetz": "EntgFG", "frage": "#0806 Was regelt das Entgeltfortzahlungsgesetz?", "antworten": ["Der durchschnittliche Verdienst der letzten 13 Wochen, ohne Überstunden (§ 4 Abs. 1 EntgFG).", "Die zuständigen Arbeitsgerichte und Sozialversicherungsträger (§ 6 EntgFG).", "Die Fortzahlung des Arbeitsentgelts an gesetzlichen Feiertagen und im Krankheitsfall (§ 1 EntgFG)."], "richtig": 2, "erklaerung": "Die Fortzahlung des Arbeitsentgelts an gesetzlichen Feiertagen und im Krankheitsfall (§ 1 EntgFG)."}, {"id": 807, "gesetz": "EntgFG", "frage": "#0807 Wer hat Anspruch auf Entgeltfortzahlung nach dem EntgFG?", "antworten": ["Arbeitgeber, einschließlich Teilzeitbeschäftigte und Auszubildende (§ 1 Abs. 2 EntgFG).", "Arbeitnehmer, einschließlich Vollzeitbeschäftigte und Auszubildende (§ 1 Abs. 2 EntgFG).", "Arbeitnehmer, einschließlich Teilzeitbeschäftigte und Auszubildende (§ 1 Abs. 2 EntgFG)."], "richtig": 2, "erklaerung": "Arbeitnehmer, einschließlich Teilzeitbeschäftigte und Auszubildende (§ 1 Abs. 2 EntgFG)."}, {"id": 808, "gesetz": "EntgFG", "frage": "#0808 Wann haben Arbeitnehmer Anspruch auf Feiertagsvergütung?", "antworten": ["Wenn die Arbeitszeit wegen eines gesetzlichen Feiertages ausfällt (§ 2 Abs. 1 EntgFG).", "Er muss seinen Arbeitgeber und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG).", "Ja, sie haben Anspruch auf bis zu sechs Wochen Entgeltfortzahlung durch den Arbeitgeber (§ 3 Abs. 1 EntgFG)."], "richtig": 0, "erklaerung": "Wenn die Arbeitszeit wegen eines gesetzlichen Feiertages ausfällt (§ 2 Abs. 1 EntgFG)."}, {"id": 809, "gesetz": "EntgFG", "frage": "#0809 Wann entfällt der Anspruch auf Feiertagsvergütung?", "antworten": ["Wenn der Arbeitnehmer unentschuldigt am letzten oder ersten Arbeitstag vor/nach dem Feiertag fehlt (§ 2 Abs. 3 EntgFG).", "Wenn der Arbeitgeber unentschuldigt am letzten oder ersten Arbeitstag vor/nach dem Feiertag fehlt (§ 2 Abs. 3 EntgFG).", "Der Arbeitgeber kann die Entgeltfortzahlung verweigern (§ 7 Abs. 1 EntgFG)."], "richtig": 0, "erklaerung": "Wenn der Arbeitnehmer unentschuldigt am letzten oder ersten Arbeitstag vor/nach dem Feiertag fehlt (§ 2 Abs. 3 EntgFG)."}, {"id": 810, "gesetz": "EntgFG", "frage": "#0810 Gilt das EntgFG auch für geringfügig Beschäftigte?", "antworten": ["Ja, auch Minijobber haben Anspruch auf Entgeltfortzahlung (§ 1 Abs. 2 EntgFG).", "Wenn mindestens sechs Monate vergangen sind oder eine neue Krankheit auftritt (§ 3 Abs. 1 EntgFG).", "Nein, auch Minijobber haben Anspruch auf Entgeltfortzahlung (§ 1 Abs. 2 EntgFG)."], "richtig": 0, "erklaerung": "Ja, auch Minijobber haben Anspruch auf Entgeltfortzahlung (§ 1 Abs. 2 EntgFG)."}, {"id": 811, "gesetz": "EntgFG", "frage": "#0811 Wie lange zahlt der Arbeitgeber das Gehalt bei Krankheit?", "antworten": ["Ja, unter bestimmten Bedingungen besteht ein Anspruch auf wirtschaftliche Sicherung (§ 10 EntgFG).", "Spätestens am vierten Krankheitstag (§ 5 Abs. 1 EntgFG).", "Bis zu sechs Wochen (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Bis zu sechs Wochen (§ 3 Abs. 1 EntgFG)."}, {"id": 812, "gesetz": "EntgFG", "frage": "#0812 Was passiert, wenn ein Arbeitnehmer nach sechs Wochen weiterhin arbeitsunfähig ist?", "antworten": ["Die gesetzliche Krankenkasse zahlt Krankengeld (§§ 44 ff. SGB V).", "Die Agentur für Arbeit zahlt Arbeitslosengeld (§§ 136 ff. SGB III).", "Der Arbeitgeber zahlt 80 % des Entgelts weiter (§ 3 EntgFG)."], "richtig": 0, "erklaerung": "Die gesetzliche Krankenkasse zahlt Krankengeld (§§ 44 ff. SGB V)."}, {"id": 813, "gesetz": "EntgFG", "frage": "#0813 Wann beginnt der Anspruch auf Entgeltfortzahlung erneut nach einer Krankheit?", "antworten": ["Bei neuer Krankheit erst im nächsten Kalenderjahr; bei derselben Krankheit nach drei Monaten ohne AU wegen dieser Krankheit oder sechs Monate nach Beginn der ersten AU (§ 3 Abs. 1 EntgFG).", "Bei jeder Krankheit erst nach vier Wochen erneuter Arbeit; bei derselben Krankheit nie wieder im selben Arbeitsverhältnis (§ 3 Abs. 1 EntgFG).", "Bei neuer Krankheit sofort neu; bei derselben Krankheit nach sechs Monaten ohne AU wegen dieser Krankheit oder zwölf Monate nach Beginn der ersten AU (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Bei neuer Krankheit sofort neu; bei derselben Krankheit nach sechs Monaten ohne AU wegen dieser Krankheit oder zwölf Monate nach Beginn der ersten AU (§ 3 Abs. 1 EntgFG)."}, {"id": 814, "gesetz": "EntgFG", "frage": "#0814 Welche Besonderheit gilt für eine wiederholte Erkrankung mit derselben Diagnose?", "antworten": ["Er muss dem Arbeitgeber die Arbeitsunfähigkeit unverzüglich mitteilen und nach drei Tagen eine ärztliche Bescheinigung vorlegen (§ 5 Abs. 1 EntgFG).", "Der Anspruch lebt nur auf, wenn seit der letzten Arbeitsunfähigkeit mindestens sechs Monate vergangen sind oder zwölf Monate seit der ersten Krankheit verstrichen sind (§ 3 Abs. 1 EntgFG).", "Der durchschnittliche Verdienst der letzten 13 Wochen, ohne Überstunden (§ 4 Abs. 1 EntgFG)."], "richtig": 1, "erklaerung": "Der Anspruch lebt nur auf, wenn seit der letzten Arbeitsunfähigkeit mindestens sechs Monate vergangen sind oder zwölf Monate seit der ersten Krankheit verstrichen sind (§ 3 Abs. 1 EntgFG)."}, {"id": 815, "gesetz": "EntgFG", "frage": "#0815 Gibt es eine Entgeltfortzahlung bei Organspenden?", "antworten": ["Nein, bis zu sechs Wochen (§ 3a EntgFG).", "Er muss dem Arbeitgeber die Arbeitsunfähigkeit unverzüglich mitteilen und nach drei Tagen eine ärztliche Bescheinigung vorlegen (§ 5 Abs. 1 EntgFG).", "Ja, bis zu sechs Wochen (§ 3a EntgFG)."], "richtig": 2, "erklaerung": "Ja, bis zu sechs Wochen (§ 3a EntgFG)."}, {"id": 816, "gesetz": "EntgFG", "frage": "#0816 Welche Bestandteile zählen zur Entgeltfortzahlung?", "antworten": ["Das Entgelt inkl. Überstundenvergütung und Aufwendungsersatz wie Spesen, jedoch ohne Zulagen und Zuschläge für Nacht- und Sonntagsarbeit (§ 4 Abs. 1, 1a EntgFG).", "Nur der Grundlohn ohne Zulagen; Überstunden fließen mit dem Durchschnitt der letzten zwölf Monate ein (§ 4 Abs. 1, 1a EntgFG).", "Das bei regelmäßiger Arbeitszeit zustehende Entgelt inkl. Zulagen, ohne Überstundenvergütung und Aufwendungsersatz (§ 4 Abs. 1, 1a EntgFG)."], "richtig": 2, "erklaerung": "Das bei regelmäßiger Arbeitszeit zustehende Entgelt inkl. Zulagen, ohne Überstundenvergütung und Aufwendungsersatz (§ 4 Abs. 1, 1a EntgFG)."}, {"id": 817, "gesetz": "EntgFG", "frage": "#0817 Sind Zulagen und Zuschläge Bestandteil des fortzuzahlenden Entgelts?", "antworten": ["Nein, Zulagen und Zuschläge entfallen stets; fortgezahlt wird nur der Grundlohn einschließlich Überstundenvergütung (§ 4 Abs. 1, 1a EntgFG).", "Ja, aber nur steuerpflichtige Zuschläge; Nachtzuschläge sind ausgenommen, weil sie als Aufwendungsersatz gelten (§ 4 Abs. 1, 1a EntgFG).", "Ja, wenn sie ohne die Arbeitsunfähigkeit angefallen wären (z. B. Nachtzuschläge), außer Überstundenvergütung (§ 4 Abs. 1, 1a EntgFG)."], "richtig": 2, "erklaerung": "Ja, wenn sie ohne die Arbeitsunfähigkeit angefallen wären (z. B. Nachtzuschläge), außer Überstundenvergütung (§ 4 Abs. 1, 1a EntgFG)."}, {"id": 818, "gesetz": "EntgFG", "frage": "#0818 Kann das Entgelt für Feiertage und Krankheit durch Tarifvertrag abweichen?", "antworten": ["Nein, das EntgFG ist vollständig zwingend; auch die Bemessungsgrundlage darf tariflich nicht geregelt werden (§§ 4 Abs. 4, 12 EntgFG).", "Ja, aber nur die Bemessungsgrundlage des Krankheitsentgelts; sonst darf nicht zuungunsten abgewichen werden (§§ 4 Abs. 4, 12 EntgFG).", "Ja, Tarifverträge dürfen Feiertags- und Krankheitsentgelt beliebig kürzen, auch die Dauer der Fortzahlung (§§ 4 Abs. 4, 12 EntgFG)."], "richtig": 1, "erklaerung": "Ja, aber nur die Bemessungsgrundlage des Krankheitsentgelts; sonst darf nicht zuungunsten abgewichen werden (§§ 4 Abs. 4, 12 EntgFG)."}, {"id": 819, "gesetz": "EntgFG", "frage": "#0819 Welche Leistungen sind von der Entgeltfortzahlung ausgenommen?", "antworten": ["Er muss seinen Arbeitgeber und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG).", "Unverzüglich nach Beginn der Arbeitsunfähigkeit (§ 5 Abs. 1 EntgFG).", "Überstundenvergütungen und Aufwendungsersatz (§ 4 Abs. 1a EntgFG)."], "richtig": 2, "erklaerung": "Überstundenvergütungen und Aufwendungsersatz (§ 4 Abs. 1a EntgFG)."}, {"id": 820, "gesetz": "EntgFG", "frage": "#0820 Kann der Arbeitgeber Sondervergütungen kürzen?", "antworten": ["Ja, wenn vereinbart; je Krankheitstag höchstens ein Viertel des im Jahresdurchschnitt auf einen Arbeitstag entfallenden Entgelts (§ 4a EntgFG).", "Nein, Sondervergütungen wie Weihnachtsgeld dürfen wegen krankheitsbedingter Fehlzeiten in keinem Fall gekürzt werden (§ 4a EntgFG).", "Ja, auch ohne Vereinbarung; je Krankheitstag höchstens die Hälfte des im Jahresdurchschnitt auf einen Arbeitstag entfallenden Entgelts (§ 4a EntgFG)."], "richtig": 0, "erklaerung": "Ja, wenn vereinbart; je Krankheitstag höchstens ein Viertel des im Jahresdurchschnitt auf einen Arbeitstag entfallenden Entgelts (§ 4a EntgFG)."}, {"id": 821, "gesetz": "EntgFG", "frage": "#0821 Wann muss eine Krankmeldung erfolgen?", "antworten": ["Nein, erst nach vier Wochen Betriebszugehörigkeit (§ 3 Abs. 3 EntgFG).", "Unverzüglich nach Beginn der Arbeitsunfähigkeit (§ 5 Abs. 1 EntgFG).", "Arbeitnehmer, einschließlich Teilzeitbeschäftigte und Auszubildende (§ 1 Abs. 2 EntgFG)."], "richtig": 1, "erklaerung": "Unverzüglich nach Beginn der Arbeitsunfähigkeit (§ 5 Abs. 1 EntgFG)."}, {"id": 822, "gesetz": "EntgFG", "frage": "#0822 Wann muss eine ärztliche Bescheinigung vorgelegt werden?", "antworten": ["Immer ab dem ersten Krankheitstag; ein früheres oder späteres Verlangen des Arbeitgebers ist nicht vorgesehen (§ 5 Abs. 1, 1a EntgFG).", "Bei AU über drei Kalendertage am folgenden Arbeitstag, auf Verlangen früher; gesetzlich Versicherte nur Feststellung (eAU) (§ 5 Abs. 1, 1a EntgFG).", "Bei AU über fünf Kalendertage spätestens am achten Tag; auch gesetzlich Versicherte müssen den Papierschein persönlich beim Arbeitgeber vorlegen (§ 5 Abs. 1, 1a EntgFG)."], "richtig": 1, "erklaerung": "Bei AU über drei Kalendertage am folgenden Arbeitstag, auf Verlangen früher; gesetzlich Versicherte nur Feststellung (eAU) (§ 5 Abs. 1, 1a EntgFG)."}, {"id": 823, "gesetz": "EntgFG", "frage": "#0823 Was passiert, wenn ein Arbeitnehmer die Krankmeldung nicht rechtzeitig einreicht?", "antworten": ["Der Arbeitgeber kann die Zahlung verweigern, solange die Bescheinigung schuldhaft nicht vorliegt; der Anspruch entfällt nicht (§ 7 EntgFG).", "Nichts; der Arbeitgeber muss weiterzahlen und darf nur abmahnen, ein Leistungsverweigerungsrecht hat er nicht (§ 7 EntgFG).", "Der Anspruch auf Entgeltfortzahlung entfällt endgültig für die gesamte AU, auch wenn die Bescheinigung nachgereicht wird und die AU unstreitig ist (§ 7 EntgFG)."], "richtig": 0, "erklaerung": "Der Arbeitgeber kann die Zahlung verweigern, solange die Bescheinigung schuldhaft nicht vorliegt; der Anspruch entfällt nicht (§ 7 EntgFG)."}, {"id": 824, "gesetz": "EntgFG", "frage": "#0824 Welche Pflicht hat ein Arbeitnehmer bei Krankheit im Ausland?", "antworten": ["Er muss seinen Arbeitnehmer und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG).", "Er muss seinen Arbeitgeber und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG).", "Nur, wenn dies die Genesung nicht gefährdet und der Arbeitgeber informiert ist (§ 5 Abs. 2 EntgFG)."], "richtig": 1, "erklaerung": "Er muss seinen Arbeitgeber und ggf. seine Krankenkasse unverzüglich informieren (§ 5 Abs. 2 EntgFG)."}, {"id": 825, "gesetz": "EntgFG", "frage": "#0825 Darf ein erkrankter Arbeitnehmer während der Arbeitsunfähigkeit verreisen?", "antworten": ["Ja, aber nur mit vorheriger schriftlicher Genehmigung des Arbeitgebers; ohne sie entfällt die Entgeltfortzahlung (§ 5 EntgFG).", "Ja, wenn die Reise die Genesung nicht gefährdet; genesungswidriges Verhalten kann zur Abmahnung oder Kündigung führen (Rechtsprechung, kein § im EntgFG).", "Nein, während der AU darf er den Wohnort nicht verlassen; jede Reise führt zum sofortigen Verlust der Entgeltfortzahlung (§ 3 EntgFG)."], "richtig": 1, "erklaerung": "Ja, wenn die Reise die Genesung nicht gefährdet; genesungswidriges Verhalten kann zur Abmahnung oder Kündigung führen (Rechtsprechung, kein § im EntgFG)."}, {"id": 826, "gesetz": "EntgFG", "frage": "#0826 Welche Behörde ist für die Überwachung des EntgFG zuständig?", "antworten": ["Das Gewerbeaufsichtsamt, das Verstöße mit Bußgeld bis 5.000 € ahndet (§ 12 EntgFG).", "Die Krankenkasse des Arbeitnehmers als Aufsichtsbehörde (§ 5 EntgFG).", "Keine; Ansprüche werden vor den Arbeitsgerichten durchgesetzt (§ 2 ArbGG)."], "richtig": 2, "erklaerung": "Keine; Ansprüche werden vor den Arbeitsgerichten durchgesetzt (§ 2 ArbGG)."}, {"id": 827, "gesetz": "EntgFG", "frage": "#0827 Kann der Arbeitgeber eine Entgeltfortzahlung verweigern?", "antworten": ["Ja, wenn das Arbeitsverhältnis kürzer als sechs Monate besteht oder die Krankheit länger als drei Tage dauert (§ 3 Abs. 3 EntgFG).", "Nein, in keinem Fall; auch bei fehlender Bescheinigung oder selbstverschuldeter Krankheit muss er zahlen (§ 7 EntgFG, § 3 Abs. 1 EntgFG).", "Ja, solange die AU-Bescheinigung fehlt oder der Forderungsübergang vereitelt wird (§ 7 EntgFG); bei Verschulden besteht kein Anspruch (§ 3 Abs. 1 EntgFG)."], "richtig": 2, "erklaerung": "Ja, solange die AU-Bescheinigung fehlt oder der Forderungsübergang vereitelt wird (§ 7 EntgFG); bei Verschulden besteht kein Anspruch (§ 3 Abs. 1 EntgFG)."}, {"id": 828, "gesetz": "EntgFG", "frage": "#0828 Wann endet die Entgeltfortzahlungspflicht des Arbeitgebers?", "antworten": ["Nach sechs Wochen oder mit Ende des Arbeitsverhältnisses, außer bei Kündigung aus Anlass der Arbeitsunfähigkeit (§§ 3, 8 EntgFG).", "Nach acht Wochen; endet das Arbeitsverhältnis vorher, zahlt er die vollen acht Wochen in jedem Fall aus eigenen Mitteln weiter (§§ 3, 8 EntgFG).", "Nach sechs Monaten oder mit Ablauf der Probezeit, außer bei Arbeitsunfällen im Straßenverkehr (§§ 3, 8 EntgFG)."], "richtig": 0, "erklaerung": "Nach sechs Wochen oder mit Ende des Arbeitsverhältnisses, außer bei Kündigung aus Anlass der Arbeitsunfähigkeit (§§ 3, 8 EntgFG)."}, {"id": 829, "gesetz": "EntgFG", "frage": "#0829 Was passiert, wenn die Arbeitsunfähigkeit durch Dritte verursacht wurde?", "antworten": ["Der Arbeitgeber muss dann kein Entgelt fortzahlen; der Arbeitnehmer muss sich allein an den Schädiger halten (§ 6 EntgFG).", "Der Schadensersatzanspruch des Arbeitnehmers geht in Höhe der Entgeltfortzahlung auf den Arbeitgeber über (§ 6 EntgFG).", "Der Arbeitnehmer erhält Entgelt und Schadensersatz doppelt; ein Übergang auf den Arbeitgeber findet nicht statt (§ 6 EntgFG)."], "richtig": 1, "erklaerung": "Der Schadensersatzanspruch des Arbeitnehmers geht in Höhe der Entgeltfortzahlung auf den Arbeitgeber über (§ 6 EntgFG)."}, {"id": 830, "gesetz": "EntgFG", "frage": "#0830 Gilt das EntgFG auch für Heimarbeiter?", "antworten": ["Nein, unter bestimmten Bedingungen besteht ein Anspruch auf wirtschaftliche Sicherung (§ 10 EntgFG).", "Ja, unter bestimmten Bedingungen besteht ein Anspruch auf wirtschaftliche Sicherung (§ 10 EntgFG).", "Ja, wenn der Arbeitnehmer seine Meldepflichten nicht erfüllt oder seine Krankheit selbst verschuldet hat (§ 7 Abs. 1 EntgFG)."], "richtig": 1, "erklaerung": "Ja, unter bestimmten Bedingungen besteht ein Anspruch auf wirtschaftliche Sicherung (§ 10 EntgFG)."}, {"id": 851, "gesetz": "MuSchG", "frage": "#0851 Darf eine schwangere Taxifahrerin weiterhin Fahrgäste befördern?", "antworten": ["Ja, sie sind verpflichtet, über Schutzmaßnahmen und Arbeitsbedingungen aufzuklären (§ 14 MuSchG).", "Nur, wenn keine unverantwortbare Gefährdung besteht, z. B. durch lange Sitzzeiten, Stress oder Unfallrisiken (§ 9 MuSchG).", "Der Arbeitgeber muss flexible Stillzeiten ermöglichen (§ 7 MuSchG)."], "richtig": 1, "erklaerung": "Nur, wenn keine unverantwortbare Gefährdung besteht, z. B. durch lange Sitzzeiten, Stress oder Unfallrisiken (§ 9 MuSchG)."}, {"id": 852, "gesetz": "MuSchG", "frage": "#0852 Muss ein Taxiunternehmen für schwangere Fahrerinnen spezielle Schutzmaßnahmen ergreifen?", "antworten": ["Nein, der Arbeitgeber muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG).", "Ja, der Arbeitnehmer muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG).", "Ja, der Arbeitgeber muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG)."], "richtig": 2, "erklaerung": "Ja, der Arbeitgeber muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG)."}, {"id": 853, "gesetz": "MuSchG", "frage": "#0853 Dürfen schwangere Taxifahrerinnen in der Nachtschicht arbeiten?", "antworten": ["Nein, die Beschäftigung zwischen 20:00 Uhr und 6:00 Uhr ist grundsätzlich verboten, kann aber in Ausnahmefällen genehmigt werden (§ 5 MuSchG).", "Ja, die Beschäftigung zwischen 20:00 Uhr und 6:00 Uhr ist grundsätzlich verboten, kann aber in Ausnahmefällen genehmigt werden (§ 5 MuSchG).", "Sechs Wochen vor der Geburt und mindestens acht Wochen danach (§ 3 MuSchG)."], "richtig": 0, "erklaerung": "Nein, die Beschäftigung zwischen 20:00 Uhr und 6:00 Uhr ist grundsätzlich verboten, kann aber in Ausnahmefällen genehmigt werden (§ 5 MuSchG)."}, {"id": 854, "gesetz": "MuSchG", "frage": "#0854 Sind Sonn- und Feiertagsdienste für schwangere Fahrerinnen erlaubt?", "antworten": ["Nur mit ausdrücklicher Bereiterklärung, bei Ausnahme nach § 10 ArbZG, mit Ersatzruhetag und ohne Gefährdung durch Alleinarbeit (§ 6 MuSchG).", "Ja, ohne Einschränkung, sofern die Schwangere nicht mehr als acht Stunden täglich und nicht an zwei Sonntagen in Folge arbeitet (§ 6 MuSchG).", "Nur mit Genehmigung der Aufsichtsbehörde; ein Ersatzruhetag ist nicht vorgesehen und Alleinarbeit ist ausdrücklich erlaubt (§ 6 MuSchG)."], "richtig": 0, "erklaerung": "Nur mit ausdrücklicher Bereiterklärung, bei Ausnahme nach § 10 ArbZG, mit Ersatzruhetag und ohne Gefährdung durch Alleinarbeit (§ 6 MuSchG)."}, {"id": 855, "gesetz": "MuSchG", "frage": "#0855 Wie lange gilt der Mutterschutz für eine Taxifahrerin vor und nach der Geburt?", "antworten": ["Sechs Wochen vor der Geburt und mindestens acht Wochen danach (§ 3 MuSchG).", "Keine Nachtschicht und besondere Rücksichtnahme auf Ruhezeiten (§ 5 MuSchG).", "Nur, wenn keine unverantwortbare Gefährdung besteht, z. B. durch lange Sitzzeiten, Stress oder Unfallrisiken (§ 9 MuSchG)."], "richtig": 0, "erklaerung": "Sechs Wochen vor der Geburt und mindestens acht Wochen danach (§ 3 MuSchG)."}, {"id": 856, "gesetz": "MuSchG", "frage": "#0856 Was ist das Ziel des Mutterschutzgesetzes (MuSchG)?", "antworten": ["Stillzeiten müssen gewährt und Arbeitsbedingungen angepasst werden (§ 7 MuSchG).", "Schutz der Gesundheit von Schwangeren und stillenden Frauen sowie ihres Kindes am Arbeitsplatz (§ 1 MuSchG).", "Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG)."], "richtig": 1, "erklaerung": "Schutz der Gesundheit von Schwangeren und stillenden Frauen sowie ihres Kindes am Arbeitsplatz (§ 1 MuSchG)."}, {"id": 857, "gesetz": "MuSchG", "frage": "#0857 Für wen gilt das MuSchG?", "antworten": ["Ja, der Arbeitgeber muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG).", "Für alle Frauen in einem Arbeitsverhältnis, einschließlich Auszubildende und Praktikantinnen (§ 1 Abs. 2 MuSchG).", "Ja, sie können unter bestimmten Bedingungen weiterbeschäftigt werden, wenn sie dies wünschen (§ 3 Abs. 3 MuSchG)."], "richtig": 1, "erklaerung": "Für alle Frauen in einem Arbeitsverhältnis, einschließlich Auszubildende und Praktikantinnen (§ 1 Abs. 2 MuSchG)."}, {"id": 858, "gesetz": "MuSchG", "frage": "#0858 Welche Arbeitsbedingungen sind für Schwangere besonders kritisch?", "antworten": ["Stillzeiten müssen gewährt und Arbeitsbedingungen angepasst werden (§ 7 MuSchG).", "Keine Nachtschicht und besondere Rücksichtnahme auf Ruhezeiten (§ 5 MuSchG).", "Tätigkeiten mit schwerem Heben, langen Standzeiten, gefährlichen Stoffen oder psychischer Belastung (§ 9 MuSchG)."], "richtig": 2, "erklaerung": "Tätigkeiten mit schwerem Heben, langen Standzeiten, gefährlichen Stoffen oder psychischer Belastung (§ 9 MuSchG)."}, {"id": 859, "gesetz": "MuSchG", "frage": "#0859 Müssen Arbeitgeber schwangere Mitarbeiterinnen über ihre Rechte informieren?", "antworten": ["Ja, sie sind verpflichtet, über Schutzmaßnahmen und Arbeitsbedingungen aufzuklären (§ 14 MuSchG).", "Nein, sie sind verpflichtet, über Schutzmaßnahmen und Arbeitsbedingungen aufzuklären (§ 14 MuSchG).", "Acht Wochen nach der Entbindung, bei Früh- oder Mehrlingsgeburten zwölf Wochen (§ 3 MuSchG)."], "richtig": 0, "erklaerung": "Ja, sie sind verpflichtet, über Schutzmaßnahmen und Arbeitsbedingungen aufzuklären (§ 14 MuSchG)."}, {"id": 860, "gesetz": "MuSchG", "frage": "#0860 Welche besonderen Schutzmaßnahmen gelten für stillende Mütter?", "antworten": ["Stillzeiten müssen gewährt und Arbeitsbedingungen angepasst werden (§ 7 MuSchG).", "Er muss Schutzmaßnahmen und Gefährdungsbeurteilungen schriftlich festhalten (§ 14 MuSchG).", "Nein, die Beschäftigung zwischen 20:00 Uhr und 6:00 Uhr ist grundsätzlich verboten, kann aber in Ausnahmefällen genehmigt werden (§ 5 MuSchG)."], "richtig": 0, "erklaerung": "Stillzeiten müssen gewährt und Arbeitsbedingungen angepasst werden (§ 7 MuSchG)."}, {"id": 861, "gesetz": "MuSchG", "frage": "#0861 Welche Tätigkeiten sind für Schwangere unzulässig?", "antworten": ["Tätigkeiten mit unverantwortbarer Gefährdung durch Gefahrstoffe, Hitze oder Lärm sowie Akkord- und Fließarbeit (§ 11 MuSchG).", "Jede Tätigkeit mit Kundenkontakt sowie jede Bildschirmarbeit von mehr als zwei Stunden täglich (§ 11 MuSchG).", "Nur Tätigkeiten mit Heben von mehr als 25 kg; Akkord- und Fließarbeit sind für Schwangere ausdrücklich erlaubt (§ 11 MuSchG)."], "richtig": 0, "erklaerung": "Tätigkeiten mit unverantwortbarer Gefährdung durch Gefahrstoffe, Hitze oder Lärm sowie Akkord- und Fließarbeit (§ 11 MuSchG)."}, {"id": 862, "gesetz": "MuSchG", "frage": "#0862 Wann darf eine schwangere Frau nicht mehr arbeiten?", "antworten": ["Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG).", "Sechs Wochen vor der Geburt, es sei denn, sie erklärt sich ausdrücklich bereit (§ 3 MuSchG).", "Ja, sie können unter bestimmten Bedingungen weiterbeschäftigt werden, wenn sie dies wünschen (§ 3 Abs. 3 MuSchG)."], "richtig": 1, "erklaerung": "Sechs Wochen vor der Geburt, es sei denn, sie erklärt sich ausdrücklich bereit (§ 3 MuSchG)."}, {"id": 863, "gesetz": "MuSchG", "frage": "#0863 Wann endet das Beschäftigungsverbot nach der Geburt?", "antworten": ["Zwölf Wochen nach der Entbindung, bei Früh-, Mehrlingsgeburten oder Behinderung des Kindes sechzehn Wochen ohne gesonderten Antrag (§ 3 Abs. 2 MuSchG).", "Sechs Wochen nach der Entbindung, bei Früh-, Mehrlingsgeburten oder Behinderung des Kindes acht Wochen (§ 3 Abs. 2 MuSchG).", "Acht Wochen nach der Entbindung, bei Früh-, Mehrlingsgeburten oder Behinderung des Kindes (auf Antrag) zwölf Wochen (§ 3 Abs. 2 MuSchG)."], "richtig": 2, "erklaerung": "Acht Wochen nach der Entbindung, bei Früh-, Mehrlingsgeburten oder Behinderung des Kindes (auf Antrag) zwölf Wochen (§ 3 Abs. 2 MuSchG)."}, {"id": 864, "gesetz": "MuSchG", "frage": "#0864 Darf eine schwangere Frau schwere körperliche Arbeiten verrichten?", "antworten": ["Stillzeiten müssen gewährt und Arbeitsbedingungen angepasst werden (§ 7 MuSchG).", "Nein, wenn die Arbeit eine Gefährdung für sie oder das Kind darstellt (§ 9 MuSchG).", "Ja, wenn die Arbeit eine Gefährdung für sie oder das Kind darstellt (§ 9 MuSchG)."], "richtig": 1, "erklaerung": "Nein, wenn die Arbeit eine Gefährdung für sie oder das Kind darstellt (§ 9 MuSchG)."}, {"id": 865, "gesetz": "MuSchG", "frage": "#0865 Wie oft muss der Arbeitgeber eine Gefährdungsbeurteilung für schwangere Mitarbeiterinnen durchführen?", "antworten": ["Erst nach Mitteilung der Schwangerschaft und nur einmalig durch die Aufsichtsbehörde; vorher ist keine Beurteilung erforderlich (§ 10 MuSchG).", "Vorab für jede Tätigkeit im Rahmen der Gefährdungsbeurteilung; nach Mitteilung der Schwangerschaft sind unverzüglich Schutzmaßnahmen festzulegen (§ 10 MuSchG).", "Einmal pro Schwangerschaftsdrittel durch den Betriebsarzt; Schutzmaßnahmen sind erst nach Zustimmung der Krankenkasse festzulegen (§ 10 MuSchG)."], "richtig": 1, "erklaerung": "Vorab für jede Tätigkeit im Rahmen der Gefährdungsbeurteilung; nach Mitteilung der Schwangerschaft sind unverzüglich Schutzmaßnahmen festzulegen (§ 10 MuSchG)."}, {"id": 866, "gesetz": "MuSchG", "frage": "#0866 Wann beginnt der Kündigungsschutz für Schwangere?", "antworten": ["Sechs Wochen vor der Geburt, es sei denn, sie erklärt sich ausdrücklich bereit (§ 3 MuSchG).", "Bis zu 13 € pro Kalendertag plus Arbeitgeberzuschuss (§ 19, § 20 MuSchG).", "Ab Beginn der Schwangerschaft und bis vier Monate nach der Geburt (§ 17 MuSchG)."], "richtig": 2, "erklaerung": "Ab Beginn der Schwangerschaft und bis vier Monate nach der Geburt (§ 17 MuSchG)."}, {"id": 867, "gesetz": "MuSchG", "frage": "#0867 Darf eine schwangere Frau während der Elternzeit gekündigt werden?", "antworten": ["Nein; es gilt das Kündigungsverbot während der Schwangerschaft (§ 17 MuSchG) und zusätzlich der Kündigungsschutz in der Elternzeit (§ 18 BEEG).", "Ja; mit Beginn der Elternzeit endet der Kündigungsschutz nach dem MuSchG, und das BEEG schützt nur Väter (§ 18 BEEG).", "Ja, mit einer Frist von drei Monaten, wenn der Betriebsrat zustimmt und die Agentur für Arbeit informiert ist; eine behördliche Zustimmung ist entbehrlich (§ 17 MuSchG, § 18 BEEG)."], "richtig": 0, "erklaerung": "Nein; es gilt das Kündigungsverbot während der Schwangerschaft (§ 17 MuSchG) und zusätzlich der Kündigungsschutz in der Elternzeit (§ 18 BEEG)."}, {"id": 868, "gesetz": "MuSchG", "frage": "#0868 Wie hoch ist das Mutterschaftsgeld?", "antworten": ["Nein, die Beschäftigung zwischen 20:00 Uhr und 6:00 Uhr ist grundsätzlich verboten, kann aber in Ausnahmefällen genehmigt werden (§ 5 MuSchG).", "Bis zu 13 € pro Kalendertag plus Arbeitgeberzuschuss (§ 19, § 20 MuSchG).", "Bis zu 13 € pro Kalendertag plus Arbeitnehmerzuschuss (§ 19, § 20 MuSchG)."], "richtig": 1, "erklaerung": "Bis zu 13 € pro Kalendertag plus Arbeitgeberzuschuss (§ 19, § 20 MuSchG)."}, {"id": 869, "gesetz": "MuSchG", "frage": "#0869 Wer zahlt den Mutterschutzlohn?", "antworten": ["Der Arbeitgeber während eines Beschäftigungsverbots (§ 18 MuSchG).", "Sofort nach Bekanntgabe der Schwangerschaft und bei jeder Änderung der Arbeitsbedingungen (§ 10 MuSchG).", "Der Arbeitnehmer während eines Beschäftigungsverbots (§ 18 MuSchG)."], "richtig": 0, "erklaerung": "Der Arbeitgeber während eines Beschäftigungsverbots (§ 18 MuSchG)."}, {"id": 870, "gesetz": "MuSchG", "frage": "#0870 Wie wird das Mutterschaftsgeld berechnet?", "antworten": ["Nach dem Nettoentgelt der letzten drei abgerechneten Kalendermonate vor der Schutzfrist; Kasse max. 13 €/Tag, Rest Arbeitgeberzuschuss (§§ 19–21 MuSchG).", "Nach dem Bruttoentgelt der letzten zwölf Monate; die Krankenkasse zahlt den vollen Betrag, ein Arbeitgeberzuschuss ist nur in Tarifverträgen vorgesehen (§§ 19–21 MuSchG).", "Nach dem Nettoentgelt des letzten Monats vor der Geburt; Kasse max. 30 €/Tag, den Rest trägt die Pflegeversicherung (§§ 19–21 MuSchG)."], "richtig": 0, "erklaerung": "Nach dem Nettoentgelt der letzten drei abgerechneten Kalendermonate vor der Schutzfrist; Kasse max. 13 €/Tag, Rest Arbeitgeberzuschuss (§§ 19–21 MuSchG)."}, {"id": 871, "gesetz": "MuSchG", "frage": "#0871 Welche Behörde ist für die Überwachung des Mutterschutzes zuständig?", "antworten": ["Ab Beginn der Schwangerschaft und bis vier Monate nach der Geburt (§ 17 MuSchG).", "Die Arbeitsschutzbehörden der Länder (§ 29 MuSchG).", "Acht Wochen nach der Entbindung, bei Früh- oder Mehrlingsgeburten zwölf Wochen (§ 3 MuSchG)."], "richtig": 1, "erklaerung": "Die Arbeitsschutzbehörden der Länder (§ 29 MuSchG)."}, {"id": 872, "gesetz": "MuSchG", "frage": "#0872 Was passiert, wenn ein Arbeitgeber gegen das MuSchG verstößt?", "antworten": ["Sie soll ihre Schwangerschaft so früh wie möglich mitteilen (§ 15 MuSchG).", "Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG).", "Geldbußen bis zu 30.000 € oder Freiheitsstrafen bei schwerwiegenden Verstößen (§ 32, § 33 MuSchG)."], "richtig": 2, "erklaerung": "Geldbußen bis zu 30.000 € oder Freiheitsstrafen bei schwerwiegenden Verstößen (§ 32, § 33 MuSchG)."}, {"id": 873, "gesetz": "MuSchG", "frage": "#0873 Welche Dokumentationspflichten hat der Arbeitgeber im Mutterschutz?", "antworten": ["Er muss Schutzmaßnahmen und Gefährdungsbeurteilungen schriftlich festhalten (§ 14 MuSchG).", "Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG).", "Er muss Schutzmaßnahmen und Gefährdungsbeurteilungen mündlich festhalten (§ 14 MuSchG)."], "richtig": 0, "erklaerung": "Er muss Schutzmaßnahmen und Gefährdungsbeurteilungen schriftlich festhalten (§ 14 MuSchG)."}, {"id": 874, "gesetz": "MuSchG", "frage": "#0874 Welche Informationspflicht hat die Schwangere gegenüber dem Arbeitgeber?", "antworten": ["Sie muss die Schwangerschaft spätestens zu Beginn des dritten Monats melden, sonst verliert sie den Kündigungsschutz bis zur Entbindung (§ 15 MuSchG).", "Sie muss die Schwangerschaft innerhalb von zwei Wochen nach Kenntnis schriftlich mit ärztlichem Attest mitteilen (§ 15 MuSchG).", "Sie soll Schwangerschaft und voraussichtlichen Entbindungstag mitteilen, sobald sie davon weiß; eine Pflicht besteht nicht (§ 15 MuSchG)."], "richtig": 2, "erklaerung": "Sie soll Schwangerschaft und voraussichtlichen Entbindungstag mitteilen, sobald sie davon weiß; eine Pflicht besteht nicht (§ 15 MuSchG)."}, {"id": 875, "gesetz": "MuSchG", "frage": "#0875 Welche Konsequenzen hat eine missachtete Gefährdungsbeurteilung?", "antworten": ["Tätigkeiten mit schwerem Heben, langen Standzeiten, gefährlichen Stoffen oder psychischer Belastung (§ 9 MuSchG).", "Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG).", "Ja, der Arbeitgeber muss eine Gefährdungsbeurteilung durchführen und ggf. alternative Tätigkeiten anbieten (§ 10 MuSchG)."], "richtig": 1, "erklaerung": "Die Arbeitsschutzbehörde kann Maßnahmen anordnen oder die Beschäftigung untersagen (§ 29 MuSchG)."}, {"id": 876, "gesetz": "MuSchG", "frage": "#0876 Gibt es eine Ausnahme für werdende Mütter in Ausbildung oder Studium?", "antworten": ["Nein, für Schülerinnen und Studentinnen gilt die Schutzfrist nach der Entbindung ausnahmslos und ohne Verzichtsmöglichkeit, auch bei Prüfungen und Abschlussarbeiten (§ 3 Abs. 3 MuSchG).", "Ja, Schülerinnen und Studentinnen sind vom Mutterschutzgesetz generell ausgenommen und haben keinerlei Schutzfristen (§ 3 Abs. 3 MuSchG).", "Ja, Schülerinnen und Studentinnen dürfen auf ausdrückliches Verlangen schon in der Schutzfrist nach der Entbindung an der Ausbildung teilnehmen (§ 3 Abs. 3 MuSchG)."], "richtig": 2, "erklaerung": "Ja, Schülerinnen und Studentinnen dürfen auf ausdrückliches Verlangen schon in der Schutzfrist nach der Entbindung an der Ausbildung teilnehmen (§ 3 Abs. 3 MuSchG)."}, {"id": 877, "gesetz": "MuSchG", "frage": "#0877 Welche Schutzmaßnahmen gelten für werdende Mütter in Schichtarbeit?", "antworten": ["Keine Arbeit zwischen 22 und 5 Uhr, max. 10 Stunden
